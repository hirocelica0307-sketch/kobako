<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学習の足跡</title>
<style>
/* ===========================================================
   学習の足跡（通知表の所見づくりを手伝うアプリ）
   - 児童の名前は入れなくても使えます。入れた名前は画面と保存先の中だけで使い、
     AI へのプロンプトには入れません。
   - 保存先は「このPCのブラウザ」か「Googleスプレッドシート」です。
   - AI（Claude）には、先生がコピーして貼り付けたときだけ、
     出席番号とメモが渡ります。このアプリが自分で送ることはありません。
   =========================================================== */
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#23211e; --muted:#6b665f; --faint:#9a948b;
  --line:#e3dfd7; --line2:#cfc8bd;
  --accent:#2f6f56; --accent-d:#245845; --accent-w:#e6f0ea;
  --err:#b23a2f; --err-w:#fbeceb;
  --warn:#8a6212; --warn-w:#fbf2df;
  --info:#3a5d84; --info-w:#e9f0f8;
  --part:#c9771c; --part-w:#fcefdc;
  --ok:#2f6f56;
  --r:10px;
  --shadow:0 1px 2px rgba(35,33,30,.05), 0 2px 8px rgba(35,33,30,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Kaku Gothic ProN",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14.5px; line-height:1.7;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none !important}
.mini{font-size:12.5px;color:var(--muted)}
.spacer{flex:1}
code{background:#f1eee8;border-radius:4px;padding:0 4px;font-size:.92em}

/* 保存先による出し分け。data-store は起動時に body に付く */
.sheet-only{display:none}
body[data-store="sheet"] .local-only{display:none !important}
body[data-store="sheet"] .sheet-only{display:revert}

/* ---- 上の帯（見出し＋手順） ---- */
.topbar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.appbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 18px 6px}
.brand{display:flex;flex-direction:column;line-height:1.3}
.brand b{font-size:17px;letter-spacing:.03em}
.brand small{font-size:11.5px;color:var(--muted)}
.ctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctxchip{border:1px solid var(--line2);background:#faf8f4;border-radius:999px;padding:4px 14px;font-weight:700}
.ctxchip:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 14px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.savechip{font-size:12.5px;color:var(--muted);border-radius:999px;padding:3px 12px;background:#f3f1ec;white-space:nowrap}
.savechip.saving{color:var(--info);background:var(--info-w)}
.savechip.saved{color:var(--accent);background:var(--accent-w)}
.savechip.error,.savechip.conflict{color:var(--err);background:var(--err-w);font-weight:700;cursor:pointer}

nav.steps{display:flex;align-items:stretch;gap:4px;padding:0 14px;overflow-x:auto}
nav.steps button{
  border:0;background:none;padding:8px 14px 9px;border-bottom:3px solid transparent;
  color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:14px
}
nav.steps button .no{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:#ece8e1;color:var(--muted);font-weight:700;font-size:12.5px
}
nav.steps button .badge{font-size:11.5px}
nav.steps button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
nav.steps button.on .no{background:var(--accent);color:#fff}
nav.steps .arrow{color:var(--faint);align-self:center;font-size:12px}
nav.steps button.sub{font-size:13px}
nav.steps .sep{width:1px;background:var(--line);margin:8px 6px}

main{padding:18px;max-width:1440px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card > h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card > h2 .step{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px}
.lead{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.notice{border-radius:8px;padding:9px 12px;font-size:13px;margin:0 0 12px;border-left:4px solid}
.notice.info{background:var(--info-w);border-color:var(--info)}
.notice.warn{background:var(--warn-w);border-color:var(--warn)}
.notice.ok{background:var(--accent-w);border-color:var(--accent)}

/* ---- ボタン ---- */
.btn{
  border:1px solid var(--line2); background:#fff; border-radius:8px;
  padding:6px 14px; white-space:nowrap; min-height:34px; display:inline-flex; align-items:center; gap:6px
}
.btn:hover{background:#f5f2ec}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{border-color:transparent;background:var(--accent-w);color:var(--accent)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger:hover{background:var(--err-w)}
.btn.sm{padding:2px 10px;font-size:12.5px;min-height:28px}
.btn.big{padding:9px 20px;font-size:15px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
label.inline{display:inline-flex;align-items:center;gap:6px}
select,input[type=text],input[type=number]{border:1px solid var(--line2);border-radius:7px;padding:5px 8px;background:#fff;min-height:34px}

/* ---- 名簿と本体の2段組 ---- */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.layout > *{min-width:0}
.side{position:sticky;top:112px}
.roster{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .roster{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:46px;overflow-x:auto;padding-bottom:4px}
}
/* スマホでは上の帯を固定しない（画面が狭くなりすぎるため） */
@media(max-width:700px){
  .topbar{position:static}
  th{top:0}
  main{padding:12px}
  .card{padding:14px}
}
.rbtn{
  border:1px solid var(--line2);background:#fff;border-radius:7px;height:38px;
  text-align:center;font-variant-numeric:tabular-nums;font-size:14px;position:relative;border-bottom-width:4px
}
.rbtn:hover{border-color:var(--accent)}
.rbtn.on{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px 0;height:auto;min-height:40px}
.rbtn.st-part{border-bottom-color:var(--part);background:var(--part-w)}
.rbtn.st-done{border-bottom-color:var(--ok);background:var(--accent-w)}
.pips{display:flex;gap:2px;justify-content:center}
.pips i{width:6px;height:6px;border-radius:50%;background:#e2ddd4;display:block}
.pips i.on{background:var(--ok)}
.roster.list{grid-template-columns:1fr;max-height:calc(100vh - 330px);overflow-y:auto;padding-right:2px}
.roster.list .rbtn{flex-direction:row;justify-content:flex-start;gap:8px;padding:4px 8px;min-height:34px;text-align:left}
.roster.list .rno{font-weight:700;min-width:1.6em;text-align:right}
.roster.list .rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.checks{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 14px;padding:8px 10px;background:#faf8f4;border-radius:8px}
.ck{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:3px 12px;font-size:13px}
.ck.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.kid .kname{font-size:16px;font-weight:700;margin-left:10px}
.tname{font-size:11.5px;font-weight:400;color:var(--muted);white-space:nowrap}
.dismissed{margin-top:4px;display:flex;align-items:center;gap:8px}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 12px}
.namegrid label{display:flex;align-items:center;gap:6px}
.namegrid span{min-width:1.8em;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.namegrid input{flex:1;min-width:0}
.dlg.wide{max-width:820px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle;background:var(--line2)}
.legend .part i{background:var(--part)} .legend .ok i{background:var(--ok)}
.progress{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.bar{height:8px;border-radius:4px;background:#ece8e1;overflow:hidden;display:flex;margin:4px 0 6px}
.bar span{display:block;height:100%}
.counts{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:12.5px}
.counts b{font-variant-numeric:tabular-nums;text-align:right}

/* 子どもの見出し（番号と前後移動） */
.kid{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 12px}
.kid .num{font-size:22px;font-weight:700;letter-spacing:.02em}
.kid .num small{font-size:13px;font-weight:400;color:var(--muted);margin-right:4px}
.stbadge{font-size:12px;padding:2px 10px;border-radius:999px;font-weight:700;background:#efece6;color:var(--muted)}
.stbadge.memo{background:var(--info-w);color:var(--info)}
.stbadge.part{background:var(--part-w);color:var(--part)}
.stbadge.err{background:var(--err-w);color:var(--err)}
.stbadge.warn{background:var(--warn-w);color:var(--warn)}
.stbadge.ok{background:var(--accent-w);color:var(--accent)}

/* ---- メモ入力 ---- */
.memogroup{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin:16px 0 10px;padding-top:12px}
.memogroup:first-child{border-top:0;margin-top:0;padding-top:0}
.memogroup > b{font-size:14px;color:var(--accent)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:1px}
.field .hint{font-size:12px;color:var(--muted);margin-bottom:5px}
textarea{
  width:100%;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;
  resize:vertical;line-height:1.8;background:#fff
}
textarea:focus{outline:3px solid var(--accent-w);border-color:var(--accent)}
details.more{border:1px dashed var(--line2);border-radius:8px;padding:6px 12px;margin-top:6px}
details.more > summary{cursor:pointer;color:var(--muted);font-size:13px}
details.more[open] > summary{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{border:1px solid var(--line);background:#faf9f6;border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink)}
.chip:hover{background:var(--accent-w);border-color:var(--accent);color:var(--accent)}
.chipgroup{margin-bottom:8px}
.chipgroup > b{font-size:12px;color:var(--muted)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* ---- 下書き＋校正 ---- */
.draftbox{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;background:#fdfcfa}
.draftbox > .top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.draftbox > .top b{font-size:15px}
.count{font-variant-numeric:tabular-nums;font-size:12.5px;padding:1px 9px;border-radius:999px;background:#eee;color:var(--muted)}
.count.ok{background:var(--accent-w);color:var(--accent)}
.count.ng{background:var(--err-w);color:var(--err)}
.memoref{background:#f6f4ef;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.memoref summary{cursor:pointer;color:var(--muted)}
.memoref div{margin-top:4px}
.preview{
  border:1px dashed var(--line2);border-radius:8px;padding:9px 12px;margin-top:8px;
  background:#fff;line-height:2;min-height:2.4em;white-space:pre-wrap;word-break:break-all
}
mark{padding:1px 0;border-radius:2px;background:none}
mark.error{background:var(--err-w);box-shadow:0 2px 0 var(--err)}
mark.warn{background:var(--warn-w);box-shadow:0 2px 0 var(--warn)}
mark.info{background:var(--info-w);box-shadow:0 2px 0 var(--info)}
.issues{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.issue{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 9px;border-radius:6px;border-left:3px solid}
.issue.error{background:var(--err-w);border-color:var(--err)}
.issue.warn{background:var(--warn-w);border-color:var(--warn)}
.issue.info{background:var(--info-w);border-color:var(--info)}
.issue .tag{font-weight:700;white-space:nowrap;font-size:11.5px;padding-top:1px;min-width:4em}
.issue .fix{margin-left:auto}
.noissue{font-size:13px;color:var(--accent);background:var(--accent-w);padding:6px 10px;border-radius:6px;margin-top:8px}

/* ---- 案の選択 ---- */
.cands{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.candhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.candhead .mini{flex:1;min-width:220px}
.cand{
  display:flex;gap:9px;text-align:left;width:100%;position:relative;
  border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 36px 8px 11px;line-height:1.6
}
.cand:hover{background:#faf9f6}
.cand.on{border-color:var(--accent);background:var(--accent-w);box-shadow:inset 0 0 0 1px var(--accent)}
.cand .pick{color:var(--accent);font-size:13px;padding-top:2px}
.cand .cbody{flex:1;min-width:0}
.cand .chead{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.cand.on .chead{color:var(--accent)}
.cand .ctext{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--ink)}
.cand.on .ctext{-webkit-line-clamp:5}
.canddel{
  position:absolute;top:6px;right:6px;width:24px;height:24px;line-height:1;
  border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--muted);font-size:14px;padding:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer
}
.canddel:hover{background:var(--err-w);border-color:var(--err);color:var(--err)}
.candnote{font-size:13px;background:var(--info-w);border-left:3px solid var(--info);border-radius:6px;padding:6px 10px;margin-bottom:8px}
.candnote b{margin-right:6px}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:700}
.badge.error{background:var(--err-w);color:var(--err)}
.badge.warn{background:var(--warn-w);color:var(--warn)}
.badge.ok{background:var(--accent-w);color:var(--accent)}
.badge.none{background:#eee;color:var(--muted)}

/* ---- 話題（教科・単元・生活）の小さな札 ---- */
.tchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tchip{font-size:11.5px;border-radius:5px;padding:0 7px;background:#f1eee8;color:var(--muted);font-weight:400}
.tchip.hot{background:var(--part-w);color:var(--part);font-weight:700}
.othermemo{margin-top:6px;background:#f6f4ef;border-radius:8px;padding:6px 10px;font-size:13px}
.othermemo > div + div{margin-top:3px}
.material{font-size:12.5px;background:#f6f4ef;border-radius:8px;padding:7px 11px;margin-bottom:12px}
.material b{color:var(--accent)}

[hidden]{display:none !important}
/* ---- メモの書き方のガイドと読み取り結果 ---- */
.guide{border:1px solid var(--line2);background:#fbfaf6;border-radius:10px;padding:8px 14px;margin-bottom:14px}
.guide > summary{cursor:pointer;font-weight:700;color:var(--accent)}
.guide[open] > summary{margin-bottom:8px}
.guidegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:6px 20px;font-size:13px}
.guidegrid h3{font-size:13.5px;margin:4px 0 2px}
.guidegrid ol,.guidegrid ul{margin:0;padding-left:1.3em}
.guidegrid li{margin-bottom:1px}
.guide pre.ex{white-space:pre-wrap;word-break:break-all;background:#fff;border:1px dashed var(--line2);border-radius:6px;padding:6px 9px;margin:6px 0 4px;font-family:inherit;font-size:12.5px;line-height:1.7}
.parsed{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.pchip{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--accent-w);color:var(--accent);border:1px solid #cfe2d7}
.pchip.warn{background:var(--part-w);color:var(--part);border-color:#efd3ad}
.pchip small{margin-left:4px;font-size:10.5px;opacity:.8}
.pnote{font-size:12px;border-radius:6px;padding:2px 8px;border-left:3px solid}
.pnote.warn{background:var(--warn-w);border-color:var(--warn)}
.pnote.info{background:var(--info-w);border-color:var(--info)}
/* ---- AIで見直す ---- */
.rvrow{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}
.rvrow.st-used{background:var(--accent-w)}
.rvrow.st-same,.rvrow.st-skipped{opacity:.75}
.rvtext{line-height:2;margin:6px 0 2px;word-break:break-all}
.rvtext del{background:var(--err-w);color:var(--err);text-decoration:line-through}
.rvtext ins{background:var(--accent-w);color:var(--accent);text-decoration:none;font-weight:700;border-bottom:2px solid var(--accent)}
.mini del{background:var(--err-w);color:var(--err)}
.mini ins{background:var(--accent-w);color:var(--accent);text-decoration:none}
/* ---- クラス全体の偏り ---- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 18px}
.vcat h3{font-size:13px;margin:0 0 6px;color:var(--muted)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 56px 46px;gap:6px;align-items:center;font-size:13px;margin-bottom:3px}
.vrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .vb{height:7px;border-radius:4px;background:#ece8e1;overflow:hidden}
.vrow .vb span{display:block;height:100%;background:var(--accent)}
.vrow.over .vb span{background:var(--part)}
.vrow.over .nm,.vrow.over b{color:var(--part);font-weight:700}
.vrow b{text-align:right;font-variant-numeric:tabular-nums}
.swap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff;font-size:13px}
.swap .no{font-weight:700;min-width:3em}

/* ---- AIで案を作る ---- */
.aigrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.aigrid{grid-template-columns:1fr}}
.opts{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin-bottom:12px}
.opts > span{font-size:13px;color:var(--muted);text-align:right}
pre.prompt{
  background:#fbfaf7;border:1px solid var(--line);border-radius:8px;padding:12px;
  white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;margin:10px 0 0;
  font-family:"Consolas","BIZ UDGothic",monospace;font-size:12px;line-height:1.65
}
.chunks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chunks button{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:4px 12px;font-size:13px}
.chunks button.on{border-color:var(--accent);background:var(--accent-w);color:var(--accent);font-weight:700}
.chunks button.done::after{content:" ✓";color:var(--accent)}

/* ---- 仕上げ（一覧） ---- */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sumbox{border:1px solid var(--line);border-radius:8px;padding:6px 14px;min-width:92px;background:#fff;text-align:left}
.sumbox b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.sumbox span{font-size:12px;color:var(--muted)}
.sumbox.err b{color:var(--err)} .sumbox.warn b{color:var(--warn)} .sumbox.ok b{color:var(--accent)}
.sumbox.on{outline:2px solid var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:top;text-align:left}
th{background:#faf8f4;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;position:sticky;top:112px}
td.no{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;width:52px;font-weight:700}
td.len{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;width:60px}
td.st{white-space:nowrap;width:86px}
td .issues{margin-top:6px}
td .issue{font-size:12px;padding:3px 8px}
tr.rowlink:hover td{background:#fbfaf7}

/* ---- ルール ---- */
.rulegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:4px 14px;font-size:13px}
.rulegrid div{padding:1px 0;border-bottom:1px dotted var(--line)}
.rulegrid s{color:var(--muted)}
ul.plain{margin:0;padding-left:1.2em}
ul.plain li{margin-bottom:3px}

/* ---- 小窓・お知らせ ---- */
.dlgwrap{position:fixed;inset:0;background:rgba(35,33,30,.38);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.dlg{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.dlg h3{margin:0 0 10px;font-size:16px}
.dlg .body{font-size:14px}
.dlg .btns{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:18px}
.dlg .kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.dlg .kv > span{color:var(--muted);font-size:13px}
.typechecks{display:flex;flex-direction:column;gap:4px}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:9px 20px;border-radius:999px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:120
}
.toast.on{opacity:1}

@media print{
  .topbar,.noprint,.side,.dlgwrap,.toast{display:none !important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{border:0;padding:0;box-shadow:none}
  th{position:static}
  th,td{border:1px solid #999}
  td .issues{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <header class="appbar">
    <div class="brand">
      <b>学習の足跡</b>
      <small id="storeinfo">名前はAIに渡しません</small>
    </div>
    <div class="ctx">
      <button class="ctxchip" id="ctx-btn" title="年度・学年・人数・今回書く種類を変える"></button>
      <div class="seg" id="term-seg" role="tablist" aria-label="学期">
        <button data-term="1">1学期</button><button data-term="2">2学期</button><button data-term="3">3学期</button>
      </div>
    </div>
    <span class="spacer"></span>
    <span class="savechip" id="savestate">—</span>
    <button class="btn sm" id="btn-settings">設定</button>
  </header>
  <nav class="steps" aria-label="作業の手順">
    <button data-tab="memo"><span class="no">1</span>メモを書く<span class="badge" data-badge="memo"></span></button>
    <span class="arrow">›</span>
    <button data-tab="ai"><span class="no">2</span>AIで案を作る</button>
    <span class="arrow">›</span>
    <button data-tab="pick"><span class="no">3</span>案を選ぶ・直す<span class="badge" data-badge="pick"></span></button>
    <span class="arrow">›</span>
    <button data-tab="review"><span class="no">4</span>AIで見直す</button>
    <span class="arrow">›</span>
    <button data-tab="finish"><span class="no">5</span>仕上げ・書き出し<span class="badge" data-badge="finish"></span></button>
    <span class="spacer"></span>
    <span class="sep"></span>
    <button data-tab="stock" class="sub">記録メモ帳</button>
    <button data-tab="rules" class="sub">ルール</button>
  </nav>
</div>

<main id="main"></main>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="file-json" accept=".json" class="hide">

<script src="rules/course-of-study.js"></script>
<script src="rules/shoken-rules.js"></script>
<script src="engine.js"></script>
<script>
/* =========================================================================
   状態
   -------------------------------------------------------------------------
   名前（S.names）は先生が入れたときだけ持ちます。プロンプトを作るときは
   scrubNames() で必ず消してから渡します。この約束は崩さないでください。
   ========================================================================= */
let R = window.SHOKEN_RULES;
const CS = window.COURSE_OF_STUDY || null;
let E = null;

let S = null;          // いま開いている学年のデータ
let cur = 1;           // 選択中の出席番号
let view = 'memo';     // 表示中の画面
let lastField = null;  // 入力補助の挿入先 {key, el}

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ルールファイルが読めなかったときの復旧画面。
   置き場所を直すのが本筋だが、それでも読めない環境のために手で選べるようにしておく。 */
function showRulesRecovery(){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:#f4f2ee;z-index:999;padding:48px;overflow:auto';
  d.innerHTML =
    '<h2 style="margin-top:0;font-size:18px">ルールファイルが読み込めませんでした</h2>'+
    '<p><code>index.html</code> と <code>rules</code> フォルダ、<code>engine.js</code> は、必ず同じ場所に一緒に置いてください。</p>'+
    '<p>置き場所が正しいのにこの画面が出るときは、下のボタンから <code>rules/shoken-rules.js</code> を選んでください。</p>'+
    '<p><input type="file" accept=".js"></p>'+
    '<p class="mini">選んだファイルはこの PC の中だけで読み込まれます。どこにも送信しません。</p>';
  document.body.appendChild(d);
  d.querySelector('input').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        (0,eval)(fr.result);
        if(!window.SHOKEN_RULES) throw new Error('ルールの入っていないファイルです');
        R = window.SHOKEN_RULES; d.remove(); boot();
      }catch(err){ alert('読み込めませんでした：'+err.message); }
    };
    fr.readAsText(f);
  };
}

/* =========================================================================
   保存
   -------------------------------------------------------------------------
   保存先は2通り。同じ画面がどちらでもそのまま動きます。
     local … このPCのブラウザの中（index.html をダブルクリックで開いたとき）
     sheet … Googleスプレッドシート（GASのWebアプリとして開いたとき）

   どちらも「保存番号（rev）」を持ちます。保存するときは、読み込んだときの
   保存番号を添えて送り、ほかの端末・タブが先に保存していたら上書きしません。
   また、送るのは常に1件だけです（前の保存が終わるまで次は送らない）。
   これで「古い内容があとから届いて新しい内容を消す」ことが起きません。
   ========================================================================= */
const inGAS = typeof google !== 'undefined' && google.script && google.script.run;
const LS_PREFIX = 'shoken.v1.';
function projectKey(m){ return LS_PREFIX + `${m.year}-${m.grade}`; }

function gasCall(fn, ...args){
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

const Store = {
  kind: inGAS ? 'sheet' : 'local',

  /* meta は local のときだけ使う（スプレッドシートは1つで1学年） */
  load(meta){
    if(inGAS) return gasCall('getState').then(o => (o && o.data) ? o : null);
    try{
      const raw = localStorage.getItem(projectKey(meta));
      const o = raw ? JSON.parse(raw) : null;
      if(o) o.meta = Object.assign(o.meta || {}, meta);
      return Promise.resolve(o);
    }catch(e){ return Promise.reject(e); }
  },

  /* 戻り値 Promise<{ok, rev} | {conflict, rev}> */
  save(state, baseRev, force){
    if(inGAS) return gasCall('putState', state, baseRev, !!force);
    try{
      const key = projectKey(state.meta);
      const raw = localStorage.getItem(key);
      const curRev = raw ? (JSON.parse(raw).rev || 0) : 0;
      if(!force && curRev !== (baseRev || 0)) return Promise.resolve({ conflict:true, rev:curRev });
      const next = curRev + 1;
      localStorage.setItem(key, JSON.stringify(Object.assign({}, state, { rev: next })));
      return Promise.resolve({ ok:true, rev:next });
    }catch(e){ return Promise.reject(e); }
  },

  peekRev(meta){
    if(inGAS) return 0;
    try{ const raw = localStorage.getItem(projectKey(meta)); return raw ? (JSON.parse(raw).rev || 0) : 0; }
    catch(e){ return 0; }
  }
};

const Saver = { busy:false, dirty:false, blocked:false, failed:false, timer:null, at:null };

function setSave(kind, msg){
  const el = $('#savestate');
  el.className = 'savechip ' + kind;
  el.onclick = null;
  el.title = '';
  if(kind === 'saving') el.textContent = '保存中…';
  else if(kind === 'typing') el.textContent = '入力中…';
  else if(kind === 'saved'){
    const d = Saver.at || new Date();
    el.textContent = '保存済み ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  else if(kind === 'error'){
    el.textContent = '保存できませんでした（押すと再試行）';
    el.title = msg || '';
    el.onclick = ()=>{ Saver.dirty = true; Saver.failed = false; pump(); };
  }
  else if(kind === 'conflict'){
    el.textContent = 'ほかの画面で更新されています';
    el.onclick = showConflict;
  }
  else el.textContent = msg || '—';
}

/* すぐ保存する（ボタン操作のあとなど） */
function save(){
  if(!S) return;
  Saver.dirty = true;
  clearTimeout(Saver.timer);
  pump();
}
/* 入力中は少し待ってからまとめて保存する */
function saveSoon(){
  if(!S) return;
  Saver.dirty = true;
  clearTimeout(Saver.timer);
  Saver.timer = setTimeout(pump, inGAS ? 1200 : 400);
  if(!Saver.busy && !Saver.blocked) setSave('typing');
}
function pump(){
  clearTimeout(Saver.timer);
  if(!S || Saver.busy || Saver.blocked || !Saver.dirty) return;
  Saver.dirty = false;
  Saver.busy = true;
  setSave('saving');
  Store.save(S, S.rev || 0, false).then(res => {
    Saver.busy = false;
    if(res && res.conflict){
      Saver.blocked = true; Saver.dirty = true;
      setSave('conflict');
      showConflict();
      return;
    }
    S.rev = res.rev; Saver.failed = false; Saver.at = new Date();
    if(Saver.dirty) pump(); else setSave('saved');
  }).catch(err => {
    Saver.busy = false; Saver.dirty = true; Saver.failed = true;
    setSave('error', err && err.message);
  });
}

/* ほかの端末・タブが先に保存していたとき */
function showConflict(){
  dlg({
    title:'ほかの画面で、先に保存されています',
    body:`<p style="margin-top:0">このデータは、ほかの端末か、このブラウザのほかのタブで保存されています。
      このまま保存すると、向こうで入力した内容が消えてしまうため、保存を止めています。</p>
      <p>どちらかを選んでください。</p>
      <ul class="plain">
        <li><b>向こうの内容を読み込む</b> … この画面でまだ保存していない変更は消えます。</li>
        <li><b>この画面の内容で上書きする</b> … 向こうで入力した内容が消えます。</li>
      </ul>`,
    buttons:[
      { label:'あとで決める', value:null },
      { label:'この画面の内容で上書きする', value:'mine', kind:'danger' },
      { label:'向こうの内容を読み込む', value:'theirs', kind:'primary' }
    ]
  }).then(v => {
    if(v === 'theirs'){
      Store.load(S.meta).then(o => {
        if(o){ S = normalize(o); }
        Saver.blocked = false; Saver.dirty = false;
        Saver.at = new Date(); setSave('saved');
        renderAll(); toast('読み込み直しました');
      }).catch(e => alert('読み込めませんでした：' + e.message));
    }else if(v === 'mine'){
      Saver.busy = true; setSave('saving');
      Store.save(S, S.rev || 0, true).then(res => {
        Saver.busy = false; Saver.blocked = false; Saver.dirty = false;
        S.rev = res.rev; Saver.at = new Date(); setSave('saved'); toast('この画面の内容で保存しました');
      }).catch(err => { Saver.busy = false; setSave('error', err.message); });
    }
  });
}

/* =========================================================================
   データの形
   ========================================================================= */
function defaultWrite(grade){
  const g = String(grade), out = {};
  ['1','2','3'].forEach(t => {
    const d = (R.defaultWrite && R.defaultWrite[g] && R.defaultWrite[g][t]) || ['shoken'];
    out[t] = d.slice();
  });
  return out;
}
function defaultVariety(){
  const V = R.variety || {};
  return { share: V.defaultShare || 1, itemLimit: V.defaultItemLimit != null ? V.defaultItemLimit : 5 };
}
function defaultCheckUse(){ return (R.checkItems || []).filter(i => !i.optional).map(i => i.key); }
function blankState(meta){
  const m = Object.assign({ year:R.meta.year, grade:'3', count:32 }, meta || {});
  return { version:2, rev:0, meta:m, term:'2', write:defaultWrite(m.grade),
           data:{ "1":{}, "2":{}, "3":{} }, stock:{ "1":'', "2":'', "3":'' },
           variety:defaultVariety(), names:{}, checkUse:defaultCheckUse() };
}
function normalize(o){
  o.version = 2;
  o.rev = o.rev || 0;
  o.meta = Object.assign({ year:R.meta.year, grade:'3', count:32 }, o.meta || {});
  o.meta.count = Math.min(45, Math.max(1, +o.meta.count || 32));
  o.term = o.term || '2';
  o.data = Object.assign({ "1":{}, "2":{}, "3":{} }, o.data || {});
  o.stock = Object.assign({ "1":'', "2":'', "3":'' }, o.stock || {});
  o.variety = Object.assign(defaultVariety(), o.variety || {});
  if(typeof o.variety.share !== 'number') o.variety.share = defaultVariety().share;
  if(typeof o.variety.itemLimit !== 'number') o.variety.itemLimit = defaultVariety().itemLimit;
  if(!o.names || typeof o.names !== 'object') o.names = {};
  if(!Array.isArray(o.checkUse)) o.checkUse = defaultCheckUse();
  if(!o.write || typeof o.write !== 'object') o.write = defaultWrite(o.meta.grade);
  ['1','2','3'].forEach(t => { if(!Array.isArray(o.write[t])) o.write[t] = defaultWrite(o.meta.grade)[t]; });
  return o;
}

/* 1人分の記録
     checks … 先生がつけたチェック（項目ごと）
     dismiss… 先生が「確認した」にした指摘（種類ごと）
     memos  … 先生が書いたメモ
     cands  … Claude が作った案（種別ごとに最大5つ）[{text, note}, …]
     pick   … 採用中の案の番号（種別ごと）
     drafts … 採用中の本文。校正・一覧・書き出しはすべてこれを見る。 */
function rec(term, no){
  const t = S.data[term] || (S.data[term] = {});
  const r = t[no] || (t[no] = { memos:{}, drafts:{}, done:{} });
  if(!r.cands) r.cands = {};
  if(!r.pick)  r.pick  = {};
  if(!r.memos) r.memos = {};
  if(!r.drafts) r.drafts = {};
  return r;
}
/* 読むだけ（記録を作らない） */
function peek(term, no){ return (S.data[term] || {})[no] || null; }
function draftOf(no, k, term){ const r = peek(term || S.term, no); return ((r && r.drafts && r.drafts[k]) || '').trim(); }
function candsOf(no, k, term){ const r = peek(term || S.term, no); return (r && r.cands && r.cands[k]) || []; }
function pickOf(no, k, term){
  const r = peek(term || S.term, no);
  const i = r && r.pick ? r.pick[k] : undefined;
  return (typeof i === 'number' && candsOf(no, k, term)[i]) ? i : 0;
}
function setCands(no, k, list){
  const r = rec(S.term, no);
  r.cands[k] = list; r.pick[k] = 0;
  r.drafts[k] = list.length ? list[0].text : '';
}
function addCands(no, k, list){
  const r = rec(S.term, no);
  r.cands[k] = (r.cands[k] || []).concat(list);
  if(typeof r.pick[k] !== 'number') r.pick[k] = 0;
  if(!(r.drafts[k] || '').trim() && r.cands[k][r.pick[k]]) r.drafts[k] = r.cands[k][r.pick[k]].text;
}
function pickCand(no, k, i){
  const r = rec(S.term, no), list = r.cands[k] || [];
  if(!list[i]) return;
  r.pick[k] = i; r.drafts[k] = list[i].text;
}
/* 本文を手で直したとき。採用中の案にも書き戻す（案を選び直しても直しが残る） */
function editDraft(no, k, text){
  const r = rec(S.term, no), list = r.cands[k] || [];
  r.drafts[k] = text;
  const i = pickOf(no, k);
  if(list[i]) list[i].text = text;
}
function hasData(r){
  if(!r) return false;
  const any = o => o && Object.values(o).some(v => Array.isArray(v) ? v.length : String(v || '').trim());
  return any(r.memos) || any(r.drafts) || any(r.cands);
}

/* =========================================================================
   学期・種類・学年段階
   ========================================================================= */
/* 今回書く種類（設定で選んだもの） */
function activeTypes(term){
  const t = term || S.term;
  const can = (R.termMatrix[S.meta.grade] || {})[t] || R.allTypes;
  const w = (S.write && S.write[t]) || defaultWrite(S.meta.grade)[t];
  return R.allTypes.filter(k => can.includes(k) && w.includes(k) && R.types[k]);
}
function stageNow(){ return E.stageOf(S.meta.grade); }

/* 他の学期で使った教科を調べる。avoid が渡されればその学期だけ、無ければ現在学期以外すべて。 */
function otherTerms(no, typeKey, avoid){
  if(typeKey !== 'shoken') return [];
  const out = [];
  ['1','2','3'].forEach(t => {
    if(t === S.term) return;
    if(avoid && avoid.indexOf(t) < 0) return;
    const txt = draftOf(no, 'shoken', t);
    if(txt) out.push({ term:t, label:t+'学期', text:txt });
  });
  return out;
}

/* ---------- 名前（入れなくてもよい。AIへのプロンプトには入れない） ---------- */
function nameOf(no){ return ((S.names || {})[no] || '').trim(); }
function hasNames(){ return Object.values(S.names || {}).some(v => (v || '').trim()); }
/* 校正と置きかえに使う名前の部分（姓・名・続けて書いたもの。1文字の部分は使わない） */
function nameParts(){
  const out = [];
  Object.values(S.names || {}).forEach(v => {
    const full = String(v || '').trim(); if(!full) return;
    const parts = full.split(/[\s　]+/).filter(Boolean);
    [parts.join('')].concat(parts).forEach(p => { if(Array.from(p).length >= 2 && out.indexOf(p) < 0) out.push(p); });
  });
  return out.sort((a, b) => b.length - a.length);
}
/* AIに渡す文から名前を消す */
function scrubNames(text){
  let t = String(text || '');
  nameParts().forEach(p => { t = t.split(p).join('（名前）'); });
  return t;
}

/* 校正に渡す、その子の情報 */
function lifeHintsFor(no){ return E.lifeHintsOf([memoOf(S.term, no, 'life'), memoOf(S.term, no, 'event')].join('\n')); }
/* その子の「教科での姿」のメモにある単元名（「 」で書いたもの） */
function memoUnitsFor(no){ return E.topicsOf(memoOf(S.term, no, 'subject'), 'shoken').units; }
function ctxFor(no, k){
  const sh = k === 'shoken';
  return { stage: stageNow(), others: otherTerms(no, k), lifeHints: sh ? lifeHintsFor(no) : [], names: nameParts(),
           memoUnits: sh ? memoUnitsFor(no) : [] };
}
function check(text, k, no){ return E.checkCached(text, k, ctxFor(no, k)); }

/* ---------- 先生が「確認した」にした指摘 ---------- */
function dismissedOf(no, k){ const r = peek(S.term, no); return (r && r.dismiss && r.dismiss[k]) || []; }
/* 画面に出す指摘（確認済みのものを除く） */
function visibleIssues(text, k, no){
  const all = check(text, k, no), d = dismissedOf(no, k);
  return d.length ? all.filter(i => d.indexOf(E.issueSig(i)) < 0) : all;
}
function setDismiss(no, k, sigs, on){
  const r = rec(S.term, no);
  r.dismiss = r.dismiss || {};
  const cur0 = r.dismiss[k] || [];
  r.dismiss[k] = on ? Array.from(new Set(cur0.concat(sigs))) : cur0.filter(x => sigs.indexOf(x) < 0);
  if(!r.dismiss[k].length) delete r.dismiss[k];
}

/* その種類の案づくりに使うメモ。[{label, text, key, term}]
   allTerms の欄（道徳・総合・外国語）は、1〜3学期のメモをすべて集め、学期を添える。
   それ以外の欄（所見のもと・その他メモ）は、いまの学期のメモだけ。 */
function memoOf(term, no, key){ const r = peek(term, no); return (((r && r.memos) || {})[key] || '').trim(); }
function memoLines(no, typeKey){
  const keys = (typeKey && R.memoFor && R.memoFor[typeKey]) ? R.memoFor[typeKey] : R.memoFields.map(f => f.key);
  const out = [];
  R.memoFields.filter(f => keys.indexOf(f.key) >= 0).forEach(f => {
    if(f.allTerms){
      ['1','2','3'].forEach(t => {
        const v = memoOf(t, no, f.key);
        if(v) out.push({ label:`${f.label}（${t}学期）`, text:v, key:f.key, term:t });
      });
    }else{
      const v = memoOf(S.term, no, f.key);
      if(v) out.push({ label:f.label, text:v, key:f.key, term:S.term });
    }
  });
  return out;
}
/* 学期をまたいで使う種類か */
function usesAllTerms(typeKey){
  const keys = (R.memoFor && R.memoFor[typeKey]) || [];
  return R.memoFields.some(f => f.allTerms && keys.indexOf(f.key) >= 0);
}
function hasMemoAny(no){
  const r = peek(S.term, no);
  return !!((r && Object.values(r.memos || {}).some(v => (v || '').trim())) || activeTypes().some(k => memoLines(no, k).length));
}

/* =========================================================================
   チェック（左の名簿）
   -------------------------------------------------------------------------
   所見ができたかどうかは自動で決めず、先生が項目ごとにチェックする。
     none 未チェック / part チェック途中 / done すべてチェック済み
   ========================================================================= */
const ST = { none:{ label:'未チェック' }, part:{ label:'チェック途中' }, done:{ label:'チェック済み' } };
function checkItemsNow(){
  const types = activeTypes();
  return (R.checkItems || []).filter(i => types.includes(i.type) && (S.checkUse || []).includes(i.key));
}
function checksOf(no){ const r = peek(S.term, no); return (r && r.checks) || {}; }
function toggleCheck(no, key){
  const r = rec(S.term, no);
  r.checks = r.checks || {};
  if(r.checks[key]) delete r.checks[key]; else r.checks[key] = true;
  save();
}
function statusOf(no){
  const items = checkItemsNow();
  if(!items.length) return 'none';
  const c = checksOf(no), n = items.filter(i => c[i.key]).length;
  return n === 0 ? 'none' : n === items.length ? 'done' : 'part';
}
function tally(){
  const c = { none:0, part:0, done:0 }, per = {};
  const items = checkItemsNow();
  items.forEach(i => per[i.key] = 0);
  for(let n = 1; n <= S.meta.count; n++){
    c[statusOf(n)]++;
    const ck = checksOf(n);
    items.forEach(i => { if(ck[i.key]) per[i.key]++; });
  }
  return { c, per, items };
}
/* 校正で要修正が残っている子の数（確認済みにした指摘は数えない） */
function errorKids(){
  let n = 0;
  for(let no = 1; no <= S.meta.count; no++){
    if(activeTypes().some(k => { const t = draftOf(no, k); return t && E.worst(visibleIssues(t, k, no)) === 'error'; })) n++;
  }
  return n;
}

/* =========================================================================
   画面の骨組み
   ========================================================================= */
function renderAll(){
  renderHeader();
  renderSteps();
  renderView();
}
function renderHeader(){
  const types = activeTypes().map(k => R.types[k].label).join('・') || '書く種類なし';
  $('#ctx-btn').innerHTML = `${esc(S.meta.year)}年度 ${esc(S.meta.grade)}年 · ${S.meta.count}人 · <span class="mini">${esc(types)}</span>`;
  $$('#term-seg button').forEach(b => b.classList.toggle('on', b.dataset.term === S.term));
  $('#storeinfo').textContent = '名前はAIに渡しません · 保存先：' + (Store.kind === 'sheet' ? 'スプレッドシート' : 'このPCのブラウザ');
}
function renderSteps(){
  const N = S.meta.count, t = tally();
  let memo = 0;
  for(let n = 1; n <= N; n++) if(hasMemoAny(n)) memo++;
  $$('nav.steps button[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === view));
  $('[data-badge="memo"]').textContent = `${memo}/${N}`;
  $('[data-badge="pick"]').textContent = t.items.length ? `チェック ${t.c.done}/${N}` : '';
  const err = errorKids(), fb = $('[data-badge="finish"]');
  fb.textContent = err ? `要修正 ${err}` : '';
  fb.style.color = err ? 'var(--err)' : '';
}
function showTab(name){
  view = name;
  renderSteps();
  renderView();
  window.scrollTo(0, 0);
}
function renderView(){
  const m = $('#main');
  const fn = { memo:viewMemo, ai:viewAI, pick:viewPick, review:viewReview, finish:viewFinish, stock:viewStock, rules:viewRules }[view] || viewMemo;
  m.innerHTML = '';

}
function goKid(n){
  cur = Math.min(S.meta.count, Math.max(1, n));

}

/* =========================================================================
   1 メモを書く
   ========================================================================= */
const MEMO_GROUPS = [
  { key:'shoken',    title:'所見のもと',     note:'「所見」の案づくりに使います' },
  { key:'doutoku',   title:'道徳',           note:'「道徳所見」の案づくりに使います。どの学期に書いたメモも使います' },

  { key:'gaikokugo', title:'外国語（活動）', note:'「外国語活動の記録」の案づくりに使います。どの学期に書いたメモも使います' }
];
function viewMemo(root){
  const wrap = document.createElement('div'); wrap.className = 'layout';
  wrap.appendChild(rosterCard());
  const mainCol = document.createElement('div');
  const card = document.createElement('section'); card.className = 'card';
  card.innerHTML = kidHeader(`${S.meta.grade}年 ${S.term}学期`) + `<div id="memoform"></div>

  wrap.appendChild(mainCol);

  const r = peek(S.term, cur) || { memos:{} };
  const box = $('#memoform');

  const field = f => {
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = `<label for="memo-${f.key}">${esc(f.label)}</label><div class="hint">${esc(f.hint)}</div>`;

    ta.value = (r.memos || {})[f.key] || '';
    ta.addEventListener('focus', () => lastField = { key:f.key, el:ta });
    ta.addEventListener('input', () => { rec(S.term, cur).memos[f.key] = ta.value; saveSoon(); refreshKid(cur); showMaterial(); showParsed(f.key); });
    d.appendChild(ta);
    /* 打ちながら、アプリがどう読み取ったかを見せる */
    if(PARSED_FIELDS.includes(f.key)){
      const pr = document.createElement('div'); pr.className = 'parsed'; pr.id = 'parsed-' + f.key;
      d.appendChild(pr);
    }
    /* 学期をまたいで使う欄は、ほかの学期に書いたメモも見せる */
    if(f.allTerms){
      const others = ['1','2','3'].filter(t => t !== S.term).map(t => ({ t, v:memoOf(t, cur, f.key) })).filter(x => x.v);
      if(others.length){
        const o = document.createElement('div'); o.className = 'othermemo';

          others.map(x => `<div><span class="tchip">${x.t}学期</span> ${esc(x.v)}</div>`).join('');
        d.appendChild(o);
      }
    }
    return d;
  };
  const group = (g, parent) => {
    const fields = R.memoFields.filter(f => (f.group || 'shoken') === g.key);
    if(!fields.length) return;
    const h = document.createElement('div'); h.className = 'memogroup';
    h.innerHTML = `<b>${esc(g.title)}</b><span class="mini">${esc(g.note)}</span>`;

  group({ key:'all', title:'その他', note:'どの種類の案づくりにも使います' }, box);
  const rest = MEMO_GROUPS.filter(g => !types.includes(g.key));
  if(rest.length){

  }
  showMaterial();
  PARSED_FIELDS.forEach(showParsed);
  renderChips();
}

/* ---------- メモの書き方のガイド ---------- */
const PARSED_FIELDS = ['subject', 'life', 'event'];
function memoGuide(){

        </ol>

      </div>

        <h3>生活・当番・係／行事</h3>
        <ol>
          <li><b>1行に1場面</b>（掃除、給食当番、廊下歩行、運動会 など）。</li>
          <li>場面の名前から書き始めると、読み取りやすい。</li>
        </ol>
        <pre class="ex">掃除：だまって隅々まで床をふいた
給食当番：最後まで片付けをした
廊下：静かに右側を歩いていた</pre>
        <h3>そのほか</h3>
        <ul>
          <li>子どもの言葉は「 」の最後に「。」まで入れる（例：「困っている人に声をかけたい。」と書いた）。</li>

          <li>何をして、どうなったか（どう伸びたか）を、事実で短く書く。</li>
        </ul>

}
/* 「教科での姿」「生活・当番・係」「行事」の読み取り結果 */
function showParsed(key){
  const el = $('#parsed-' + key); if(!el) return;
  const text = memoOf(S.term, cur, key);
  if(!text){ el.innerHTML = ''; return; }
  let chips = '', notes = [];
  if(key === 'subject'){
    const r = E.analyzeSubjectMemo(text, { grade:S.meta.grade });
    chips = r.items.map(it => `<span class="pchip ${it.unit ? '' : 'warn'}" title="${esc(it.text)}">${it.line}行目 ${esc(it.subject)}${it.unit ? `「${esc(it.unit)}」` : '（単元名なし）'}${it.inferred ? '<small>内容から</small>' : ''}</span>`).join('');
    notes = r.notes;
  }else{
    const r = E.analyzeLifeMemo(text);
    chips = r.items.map(it => `<span class="pchip" title="${esc(it.text)}">${it.line}行目 ${esc(it.label)}</span>`).join('');
    notes = r.notes;
  }
  el.innerHTML = `<div class="prow"><span class="mini">アプリの読み取り</span>${chips || '<span class="mini">（まだ読み取れるものがありません）</span>'}</div>` +
    notes.map(n => `<div class="pnote ${n.level}">${n.line}行目：${esc(n.msg)}</div>`).join('');
}
/* 所見の材料：「教科での姿」から教科ごと、「生活・当番・係」「行事」から1文ごと */
function materialsFor(no){
  return E.materialsOf(memoOf(S.term, no, 'subject'), [memoOf(S.term, no, 'life'), memoOf(S.term, no, 'event')].join('\n'), { grade:S.meta.grade });
}
function subjLabel(m){ return m ? `${m.subject}${m.unit ? `「${m.unit}」` : ''}` : ''; }
/* プロンプトの児童たちに、案ごとの組み合わせを割り当てる。
   案1は、すでに採用した所見とこの回の前の児童の案1を数えて、クラスでいちばん偏らないものにする */
function planBatch(nums, avoidTerms){
  const NC = (R.generation && R.generation.candidates) || 5;
  const counts = {};
  const tl = E.tallyKeys(classEntries('shoken', nums), 'shoken');
  Object.keys(tl).forEach(k => counts[k] = tl[k].length);
  const out = {};
  nums.forEach(n => {
    const avoid = [];
    otherTerms(n, 'shoken', avoidTerms).forEach(o => R.subjects.list.forEach(sb => { if(o.text.indexOf(sb) >= 0) avoid.push(sb); }));
    const mat = materialsFor(n);
    const combos = E.planCombos(mat, NC, { counts, limit:limitFor, avoidSubjects:avoid });
    E.comboKeys(combos[0]).forEach(k => counts[k] = (counts[k] || 0) + 1);
    out[n] = { mat, combos };
  });
  return out;
}
function showMaterial(){
  const el = $('#material'); if(!el) return;
  const mat = materialsFor(cur);
  const nS = mat.subjects.length, nL = mat.life.length;
  const subs = mat.subjects.map(subjLabel), lifes = mat.life.map(m => m.label);
  const pairs = Math.max(1, nS) * Math.max(1, nL);
  el.innerHTML = `<b>このメモの材料</b>　教科：${nS ? esc(subs.join('、')) : '<span class="mini">まだありません</span>'}　／　生活・行事：${nL ? esc(lifes.join('、')) : '<span class="mini">まだありません</span>'}<br>
    <span class="mini">5つの案は、この教科と生活の材料を組み合わせて作ります（いまは${nS && nL ? pairs + '通り' : 'まだ組み合わせられません'}）。
    教科の姿と生活の姿を、それぞれ2つ以上書くと、案ごとに違う組み合わせになります。教科は1文に1つ、生活は1文に1つの場面で書くと、材料として分かれます。
    メモに無い教科や話題を、AIが作ることはありません。</span>`;
}

function renderChips(){
  const box = $('#chips'); if(!box) return;
  Object.entries(R.chips).forEach(([g, words]) => {
    const d = document.createElement('div'); d.className = 'chipgroup';
    d.innerHTML = `<b>${esc(g)}</b>`;
    const wrap = document.createElement('div'); wrap.className = 'chips';
    words.forEach(w => {
      const c = document.createElement('button'); c.className = 'chip'; c.textContent = w;
      c.onmousedown = e => e.preventDefault();   // 欄のカーソル位置を失わない
      c.onclick = () => {
        if(!lastField || !document.body.contains(lastField.el)) return toast('先に、入れたい欄を押してください');
        const ta = lastField.el;
        const s = ta.selectionStart ?? ta.value.length, e2 = ta.selectionEnd ?? ta.value.length;
        ta.value = ta.value.slice(0, s) + w + ta.value.slice(e2);
        ta.focus();
        /* 「」は、かっこの間にカーソルを置く */
        ta.selectionStart = ta.selectionEnd = s + (w === '「」' ? 1 : w.length);
        ta.dispatchEvent(new Event('input'));
      };
      wrap.appendChild(c);
    });
    d.appendChild(wrap); box.appendChild(d);
  });
}

/* =========================================================================
   2 AIで案を作る（プロンプト → 貼り戻し）
   ========================================================================= */
let AI = { type:null, scope:'all', size:10, avoid1:true, avoid2:true, chunks:[], at:0, copied:{}, importType:null, info:'' };

/* ---------- クラス全体の書き分け ---------- */
/* 同じ単元・同じ生活の項目は「何人まで」、同じ教科・同じ書き出しは「クラスの何分の1まで」 */
function itemLimitNow(){ const v = S.variety ? S.variety.itemLimit : 0; return v > 0 ? v : Infinity; }
function subjLimitNow(){ return E.limitOf(S.meta.count, S.variety ? S.variety.share : 1); }
function limitFor(key){
  const cat = key.slice(0, key.indexOf('|'));
  return (cat === '単元' || cat === '生活・行事') ? itemLimitNow() : subjLimitNow();
}
/* 採用済みの本文（exclude の番号は除く） */
function classEntries(k, exclude){
  const out = [];
  for(let n = 1; n <= S.meta.count; n++){
    if(exclude && exclude.indexOf(n) >= 0) continue;
    const t = draftOf(n, k);
    if(t) out.push({ no:n, text:t });
  }
  return out;
}
/* その種類に使うメモ欄の中身だけ（見出しを付けない） */
function memoRaw(no, typeKey){
  return memoLines(no, typeKey).map(m => m.text).join('\n');
}
const KEY_CATS = ['教科', '単元', '生活・行事', '書き出し'];
function keyLabel(key){
  const i = key.indexOf('|'), cat = key.slice(0, i), name = key.slice(i + 1);
  return (cat === '単元' || cat === '書き出し') ? `「${name}」` : name;
}
/* 文の話題を小さな札で見せる。others = その子以外のクラスの数（鍵→番号の配列） */
function topicChips(text, k, others, simTo){
  const keys = E.keysOf(text, k);
  let html = keys.map(key => {
    const n = ((others && others[key]) || []).length + 1, limit = limitFor(key);
    const hot = n > limit;
    const isOpen = key.startsWith('書き出し|');
    if(isOpen && !hot) return '';
    const label = isOpen ? '書き出しが重なる' : keyLabel(key);
    return `<span class="tchip ${hot ? 'hot' : ''}" title="${hot ? `クラスで${n}人になります（${limit}人まで）` : ''}">${esc(label)}${hot ? ` ${n}人目` : ''}</span>`;
  }).join('');
  /* ほかの子の採用済みの文と似ているか */
  if(simTo){
    const m = E.mostSimilar(text, simTo);
    if(m && m.sim >= R.duplication.warnThreshold) html += `<span class="tchip hot" title="言い回しが似ています">#${m.no}と似ている ${Math.round(m.sim * 100)}%</span>`;
  }
  return html ? `<span class="tchips">${html}</span>` : '';
}

/* プロンプトに入れる「クラス全体での書き分け」 */
function varietyBlock(typeKey, nums){

  const L = [];
  const iLim = itemLimitNow(), sLim = subjLimitNow();
  const isShoken = typeKey === 'shoken';
  const others = classEntries(typeKey, nums);
  const tally = E.tallyKeys(others, typeKey);

  L.push('# クラス全体での書き分け（大切）');
  L.push('通知表は、保護者どうしで見比べられることがあります。クラスの中で同じような文が並ばないようにしてください。');
  L.push('## 書き分けのきまり');
  if(isShoken){
    if(iLim !== Infinity){
      L.push(`- **同じ単元・同じ生活の項目（廊下歩行・あいさつ・掃除など）を取り上げるのは、クラス全体（${S.meta.count}人）で${iLim}人まで。必ず守る。**`);
      L.push(`  下の配分で${iLim}人に達している単元・項目は、どの案でも取り上げない（メモにほかの材料が無い子だけは例外。その場合は「※」の行でそのことを伝える）。`);
    }
    if(sLim !== Infinity) L.push(`- 同じ教科は、クラス全体で${sLim}人までを目安にする。`);
    L.push('- 各児童の案1には、下の配分とこの回のほかの児童の案1を見て、クラス全体で教科・単元・生活の項目がバラけるような組み合わせを割り当ててある（児童ごとのメモの「組み合わせ」）。割り当てどおりに書く。');
  }else{
    L.push('- 各児童の「案1」は、この回のほかの児童と、書き出しと文の組み立てがいちばん重ならないものにする。');
  }
  if(isShoken){
    L.push(`- 書き出しの形「${R.shokenOpening.form}」は全員同じでよい（変えてはいけない）。書き分けるのは「では、」より後ろ。`);
    L.push('- 同じ単元・同じ項目・似たメモの子は、取り上げる場面・「では、」の後の文の組み立て・文末の言い方・ほめる言葉をすべて変える。');
  }else{
    if(sLim !== Infinity) L.push(`- 同じ書き出しは、クラス全体で${sLim}人までを目安にする。`);
    L.push('- 同じ単元・同じ項目・似たメモの子は、取り上げる場面・文の組み立て・書き出し・文末の言い方・ほめる言葉をすべて変える。');
  }
  L.push('  同じ語句を続けて使う「〜することができました」のような締め方も、子どもごとに変える（「〜を身に付けました」「〜するようになりました」「〜を伸ばしました」など）。');
  L.push('- ただし、メモに無い教科・話題は、配分のためでも持ち出さない。メモの材料が1つしかない子は、その材料のまま言い方を変える。');
  L.push('- 「※」の行の最初に、取り上げた教科・単元・項目を【 】で書く。（例：※【算数科「わり算」・給食】…）');
  L.push('');

  if(others.length){
    L.push(`## すでに採用した${R.types[typeKey].label}での配分（この回の児童を除く${others.length}人分）`);
    (isShoken ? KEY_CATS : ['書き出し']).forEach(cat => {
      const items = Object.entries(tally).filter(([key]) => key.startsWith(cat + '|'))
        .map(([key, v]) => [key, v.length]).sort((a, b) => b[1] - a[1]);
      if(!items.length) return;
      const strict = cat === '単元' || cat === '生活・行事';
      L.push(`- ${cat}：` + items.slice(0, 12).map(([key, c]) => {
        const lim = limitFor(key);
        const tag = lim === Infinity ? '' : c >= lim ? (strict ? '（上限に達しています。取り上げない）' : '（目安に達しています。なるべく避ける）') : '';
        return `${keyLabel(key)} ${c}人${tag}`;
      }).join('、'));
    });
    const reps = E.repeatedPhrases(others.map(o => o.text));
    if(reps.length) L.push('- 何人もの所見に出てくる言い回し（そのまま使わない）：' + reps.slice(0, 10).map(r => `「${r.phrase}」${r.count}人`).join('、'));
    if(!isShoken && (V.openingIdeas || []).length) L.push('- 書き出しを変えるときの例：' + V.openingIdeas.join('／'));
    L.push('');
  }

  /* この回の児童と、メモが似ている子の採用済みの文（同じ表現にしないため） */
  const adoptedMemo = others.map(o => ({ no:o.no, text:memoRaw(o.no, typeKey) })).filter(o => o.text);
  const refs = [];
  nums.forEach(n => {
    const mine = memoRaw(n, typeKey); if(!mine) return;
    const g = E.bigrams(mine);
    adoptedMemo.map(o => ({ no:o.no, sim:E.jaccard(g, E.bigrams(o.text)) }))
      .filter(x => x.sim >= V.memoSimilarity).sort((a, b) => b.sim - a.sim).slice(0, 2)
      .forEach(x => refs.push(`- #${n} のメモは #${x.no} と似ています。#${x.no} で採用した文：「${draftOf(x.no, typeKey)}」`));
  });
  if(refs.length){
    L.push('## メモが似ている子の、採用済みの文（この文と同じ表現にしない）');
    refs.slice(0, 20).forEach(l => L.push(l));
    L.push(isShoken
      ? `上の文と、「では、」より後ろの言い回し・文の組み立て・文末を変える（書き出しの形「${R.shokenOpening.form}」はそのまま）。同じ語句を3つ以上続けて使わない。`
      : '上の文と、書き出し・言い回し・文の組み立て・文末を変える。同じ語句を3つ以上続けて使わない。');
    L.push('');
  }

  if(nums.length > 1){
    const memos = nums.map(n => ({ no:n, text:memoRaw(n, typeKey) }));
    const groups = {};
    const add = (k, n) => { (groups[k] = groups[k] || []).push(n); };
    memos.forEach(m => {
      const tp = E.topicsOf(m.text, typeKey);
      tp.units.forEach(u => add(`同じ単元・教材「${u}」`, m.no));
      if(isShoken){
        tp.subjects.forEach(x => add(`同じ教科（${x}）`, m.no));
        tp.life.forEach(x => add(`同じ生活の項目（${x}）`, m.no));
      }
    });
    const lines = Object.entries(groups).filter(([, v]) => v.length > 1)
      .sort((a, b) => b[1].length - a[1].length)
      .map(([k, v]) => `- ${k}：${v.map(n => '#' + n).join('・')}`);
    E.groupSimilar(memos).forEach(g => lines.push(`- メモがよく似ている：${g.map(n => '#' + n).join('・')}（特に、言い回しと文の組み立てを変える）`));
    if(lines.length){
      L.push('## この回で、メモの材料が重なっている児童');
      lines.forEach(l => L.push(l));
      L.push(isShoken
        ? '上の子どうしは、案1で取り上げる単元・項目（メモにほかの材料があれば）と、「では、」より後ろの言い回し・文末をすべて変える。'
        : '上の子どうしは、案1で取り上げる単元・項目（メモにほかの材料があれば）と、書き出し・言い回し・文末をすべて変える。');
      L.push('');
    }
  }
  return L;
}

function memoBlock(no, typeKey){
  return memoLines(no, typeKey).map(m => `【${m.label}】${m.text.replace(/\s*\n\s*/g,' ')}`).join('\n');
}
function targetNums(typeKey, scope){
  const nums = [];
  for(let n = 1; n <= S.meta.count; n++){
    if(scope === 'one' && n !== cur) continue;
    if(!memoBlock(n, typeKey)) continue;
    if(scope === 'todo' && draftOf(n, typeKey)) continue;
    if(scope === 'unchecked' && statusOf(n) === 'done') continue;
    nums.push(n);
  }
  return nums;
}

/* メモ本文から教科を推定する。当たった語の数が多い順。 */
function detectSubjects(text, typeKey){
  if(!CS || !text) return [];
  const stage = stageNow();
  const hits = [];
  Object.entries(CS.subjects).forEach(([key, sub]) => {
    if(sub.stages && sub.stages.indexOf(stage) < 0) return;
    if(!sub.areas || !sub.areas[stage]) return;
    let n = 0; const words = [];
    (sub.match || []).forEach(w => { if(text.indexOf(w) >= 0){ n++; words.push(w); } });
    const topics = Object.keys(sub.topics || {}).filter(kw => text.indexOf(kw) >= 0);
    if(n || topics.length) hits.push({ key, sub, n:n + topics.length, words, topics });
  });
  hits.sort((a, b) => b.n - a.n);
  const force = { doutoku:'doutoku', sogo:'sougou', gaikokugo:'gaikokugo' }[typeKey];
  if(force && CS.subjects[force] && !hits.some(h => h.key === force)){
    const sub = CS.subjects[force];
    if(sub.areas && sub.areas[stage]) hits.unshift({ key:force, sub, n:99, words:[], topics:[] });
    else{
      const near = ['中','高','低'].find(st => sub.areas && sub.areas[st]);
      if(near) hits.unshift({ key:force, sub, n:99, words:[], topics:[], useStage:near, ref:true });
    }
  }
  const top = hits.slice(0, 4);
  /* 所見は「教科1つ＋教科以外1つ」なので、特別活動は常に入れる */
  if(typeKey === 'shoken' && CS.subjects.tokkatsu && !top.some(h => h.key === 'tokkatsu') && CS.subjects.tokkatsu.areas[stage]){
    top.push({ key:'tokkatsu', sub:CS.subjects.tokkatsu, n:0, words:[], topics:[] });
  }
  return top;
}

function courseBlock(subjectHits){
  if(!CS || !subjectHits.length) return [];

  L.push('');
  return L;

    L.push(`- 児童ごとのメモの下に、案1〜案${NC}の「組み合わせ」（教科・単元 ＋ 生活の内容）を書いてある。`);
    L.push('- **各案は、その案に割り当てた教科・単元と生活の内容を使って書く。** 割り当てと違う教科や生活の内容に変えない。');
    L.push('- 割り当ては、その子のメモの材料から、案ごとになるべく違う組み合わせになるように決めてある。案1は、クラス全体で教科・単元・生活の内容が偏らないように決めてある。');
    L.push('- 1つの案で取り上げる教科は1つ、生活の内容は1つにする（いくつもの教科を並べない）。');
    L.push('- メモの材料が少なく、同じ組み合わせになっている案は、取り上げる場面・言い回し・文の組み立てを変える。');
    L.push('');
  }
  L.push(`# ${NC}つの案の作り分け`);
  L.push(`- ${NC}案は「同じ文の言い換え」にしない。取り上げる場面・切り口・文の組み立てを変える。`);
  L.push(typeKey === 'shoken'
    ? `- 割り当てた組み合わせの中での切り口の目安（どの案も「${R.shokenOpening.form}」で始め、「教科の評価 → 生活面」の順序は変えない）：`
    : '- 切り口の目安：');
  ((R.generation && R.generation.angles) || []).forEach((a, i) => L.push(`  ${i+1}. ${a}`));
  L.push('- ただし、メモに材料が無い切り口は無理に作らない。その場合は近い切り口で書き分ける。');
  L.push('- どの案も字数の範囲に収め、上のきまりをすべて満たすこと。');
  L.push('- 先生がどれを使うか選ぶので、どの案もそのまま通知表に載せられる完成度で書く。');
  L.push('');

  varietyBlock(typeKey, nums).forEach(l => L.push(l));

  const allMemo = nums.map(n => memoBlock(n, typeKey)).join('\n');
  courseBlock(detectSubjects(allMemo, typeKey)).forEach(l => L.push(l));

  const sug = (R.generation && R.generation.suggestion) || {};
  L.push('# 表現の提案について');
  L.push('メモをそのまま文にするだけでなく、保護者にがんばりが伝わる書き方を提案してください。');
  L.push('**提案の根拠は、必ず上の学習指導要領の指導事項に置いてください。**');
  L.push('メモに「詩を書いた」とあれば、国語科の詩に関わる指導事項（言葉の響きやリズム、言葉を選ぶこと、感じたことを書くこと）から、その子の姿にいちばん合うものを選んで提案します。');
  L.push('## してよいこと');
  (sug.allow || []).forEach(s => L.push('- ' + s));
  L.push('## してはいけないこと');
  (sug.forbid || []).forEach(s => L.push('- ' + s));
  L.push('- 事実を足したかどうか迷ったら、足さずに「※」の行で先生に確認を促す。');
  L.push('## 「※」の行の書き方');
  if(sug.noteRule) L.push('- ' + sug.noteRule);
  L.push('- **どの指導事項をもとにしたかを必ず書く。**（例：※ 国語科C読むこと「叙述を基に捉える」をもとに、文章の言葉から気持ちを読み取った姿として書きました。）');
  L.push('- 先生が根拠をたどれるように、教科名と領域名を入れる。');
  L.push('');
  L.push('# 基本的な考え方');
  R.principles.forEach(p => L.push('- ' + p));
  L.push('');
  L.push('# 絶対に守るきまり');
  R.commonRules.forEach(p => L.push('- ' + p));
  L.push('- 児童の氏名・友達の名前・大会名・学校名などの固有名詞は書かない。');
  L.push('- メモに無い「事実」は作らない。（書き方の工夫は上の「表現の提案について」を見ること）');
  if(nums.length > 1) L.push('- まとめて書くので、同じ言い回し・同じ文型が並ばないよう、児童ごとに書き分ける。');
  L.push('');
  L.push('# 文末');
  L.push('- 過去形で書く。「〜しています。」→「〜しました。」／「〜できます。」→「〜できました。」');
  L.push('- 可能動詞は使わない。「書けるようになりました」→「書くことができました」');
  L.push('- 子どもの言葉を「 」で引用するときは、その子の言葉のままでよい。');
  L.push('');
  L.push('# 数字・記号');
  L.push('- ' + R.numberFormat.note);
  L.push('- 読点は「、」。感嘆符・疑問符・三点リーダは使わない。文頭は1マス空けない。');
  L.push('');
  L.push('# 避ける表現 → 言い換え');
  R.vague.filter(v => v.level !== 'info').forEach(v => L.push(`- ${v.ng} → ${v.ok}`));
  L.push('');
  L.push('# 表記（左の表記を必ず使う）');
  L.push('この一覧は学習指導要領および学年別漢字配当表に準拠したものです。必ずこのとおりに書いてください。');
  L.push(R.hyoki.filter(h => h.level !== 'info' && !/^（/.test(h.ok)).map(h => `${h.ok}（×${h.ng}）`).join('、'));
  L.push('一覧に無い語は、学習指導要領の本文で使われている表記に合わせてください。');
  L.push('');
  L.push('# 教科名');
  L.push('必ず「科」を付ける：' + R.subjects.list.join('、'));
  L.push('');
  L.push('# 書き方のお手本');
  R.examples.forEach(e => { L.push(`× ${e.bad}`); L.push(`○ ${e.good}`); L.push(''); });
  L.push('# 児童ごとのメモ');
  L.push('（番号だけで管理しています。氏名はありません。）');
  L.push('');
  const plans = typeKey === 'shoken' ? planBatch(nums, opt.avoidTerms) : {};
  nums.forEach(n => {
    L.push(`## #${n}`);
    L.push(memoBlock(n, typeKey));
    if(typeKey === 'shoken'){
      const units = memoUnitsFor(n);
      L.push(units.length
        ? `単元名：${units.map(u => `「${u}」`).join('・')}（書き出しは、その案に割り当てた教科と単元名で「〇〇科「単元名」では、」の形にする）`
        : '単元名：メモにありません（メモにある学習の内容を短く「 」に入れる。新しい単元名は作らない）');
      const plan = plans[n];
      if(plan){
        L.push('組み合わせ（この割り当てどおりに書く）：');
        plan.combos.forEach((c, i) => {
          const sub = c.s ? (c.s.unit ? subjLabel(c.s) : `${c.s.subject}（単元名はメモに無い。メモにある学習の内容を短く「 」に入れる）`)
                          : '教科のメモがありません（「※」の行で先生に伝える）';
          const life = c.l ? c.l.label : 'メモがありません（行事や伸びのメモから書く。無ければ「※」の行で先生に伝える）';
          L.push(`- 案${i + 1}：${sub} ＋ 生活：${life}`);
        });
        const distinct = new Set(plan.combos.map(c => subjLabel(c.s) + '|' + (c.l ? c.l.label : ''))).size;
        if(distinct < plan.combos.length) L.push('（メモの材料が少ないため、同じ組み合わせの案があります。その案は、取り上げる場面・言い回しを変える）');
      }
    }
    otherTerms(n, typeKey, opt.avoidTerms).forEach(o => {
      const used = R.subjects.list.filter(s => o.text.indexOf(s) >= 0);
      if(used.length) L.push(`※ ${o.label}は「${used.join('・')}」で書いたので、今回は違う教科で書く。`);
    });
    L.push('');
  });
  L.push('---');
  L.push('# 出力する前の確認（すべての案で確かめ、1つでも外れていたら書き直してから出力する）');
  if(typeKey === 'shoken'){
    L.push(`- 1文目が「${R.shokenOpening.form}」で始まっている（教科名に「科」、単元名に「 」）。`);
    L.push('- 前半が教科、後半が生活面。');
  }
  if(typeKey === 'doutoku') L.push('- 2文で、2文目が「特に「内容項目」の学習では、」で始まっている。');
  L.push(`- 字数が${rg.min}〜${rg.max}字。`);
  L.push('- 文末が過去形。性格の記述・名前・メモに無い事実が無い。');
  L.push('- 「※」の行がある。');
  L.push('');
  L.push(`上のメモをもとに、#${nums.join('、#')} の${t.label}を、1人につき${NC}案ずつ、指定の出力形式で書いてください。`);
  if(typeKey === 'shoken') L.push(`もう一度：どの案も、必ず「${R.shokenOpening.form}」で書き始めてください。`);
  /* 名簿の名前は、AIに渡す前に必ず消す */
  return scrubNames(L.join('\n'));
}

function typeOptions(sel){
  return activeTypes().map(k => `<option value="${k}" ${k===sel?'selected':''}>${esc(R.types[k].label)}（${R.types[k].target}字程度）</option>`).join('');
}

function viewAI(root){
  const types = activeTypes();
  if(!types.includes(AI.type)) AI.type = types[0] || null;
  if(!types.includes(AI.importType)) AI.importType = AI.type;
  if(!types.length){ root.innerHTML = noTypesCard(); wireNoTypes(root); return; }

  root.innerHTML = `
  <div class="aigrid">
    <section class="card">
      <h2><span class="step">A</span>プロンプトを作ってコピーする</h2>

      <div class="notice warn">AI に渡るのは<b>出席番号とメモだけ</b>です。名簿に入れた名前は、メモに入っていても「（名前）」に置きかえます。
        メモに、本人が分かる事情（家庭・健康・転出入など）や、名簿に無い友達の名前が入っていないか、貼り付ける前に確かめてください。</div>
      <div id="p-names"></div>
      <div class="opts">
        <span>種類</span><div><select id="p-type">${typeOptions(AI.type)}</select>
          <div class="mini">道徳所見・総合・外国語は、1〜3学期に書いたメモをすべて使います。</div></div>
        <span>対象</span>
        <select id="p-scope">
          <option value="all">メモのある児童すべて</option>
          <option value="todo">メモがあり、まだ本文が無い児童</option>
          <option value="unchecked">名簿のチェックがまだ済んでいない児童</option>
          <option value="one">選択中の1人だけ（${cur}番）</option>
        </select>
        <span>1回の人数</span>
        <select id="p-size">${[5,10,15,20,45].map(n=>`<option value="${n}">${n===45?'全員まとめて':n+'人ずつ'}</option>`).join('')}</select>
        <span>教科の重なり</span>
        <div class="row">
          <label class="inline"><input type="checkbox" id="p-avoid1">1学期と違う教科で</label>
          <label class="inline"><input type="checkbox" id="p-avoid2">2学期と違う教科で</label>
        </div>
      </div>
      <div class="row">
        <button class="btn primary" id="btn-build">プロンプトを作る</button>
        <button class="btn" id="btn-copy" disabled>このプロンプトをコピー</button>
        <span class="mini" id="p-info"></span>
      </div>
      <div class="chunks" id="chunks"></div>
      <pre class="prompt" id="promptout">（「プロンプトを作る」を押してください）</pre>
    </section>

    <section class="card">
      <h2><span class="step">B</span>返ってきた文を貼り付けて取り込む</h2>
      <p class="lead">Claude の返事をそのまま貼り付けて「取り込む」を押すと、番号ごとに振り分けて、案として保存します。<br>
        行頭の <code>#12</code> <code>【12】</code> <code>12.</code> を目印に読み取ります。</p>
      <div class="opts"><span>種類</span><select id="i-type">${typeOptions(AI.importType)}</select></div>
      <textarea id="pastearea" rows="14" placeholder="#1&#10;1) 国語科「ごんぎつね」の学習では、…&#10;※ …&#10;2) …&#10;&#10;#2&#10;…"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" id="btn-parse">取り込む</button>
        <button class="btn" id="btn-clearpaste">貼り付け欄を消す</button>
      </div>
      <div id="i-info" style="margin-top:10px">${AI.info}</div>
    </section>
  </div>`;

  $('#p-scope').value = AI.scope;
  $('#p-size').value = String(AI.size);
  $('#p-avoid1').checked = AI.avoid1; $('#p-avoid2').checked = AI.avoid2;
  $('#p-avoid1').disabled = S.term === '1'; $('#p-avoid2').disabled = S.term === '2';
  $('#p-type').onchange = e => { AI.type = e.target.value; AI.importType = AI.type; $('#i-type').value = AI.type; AI.chunks = []; drawChunks(); };
  $('#p-scope').onchange = e => { AI.scope = e.target.value; AI.chunks = []; drawChunks(); };
  $('#p-size').onchange = e => { AI.size = +e.target.value; AI.chunks = []; drawChunks(); };
  $('#p-avoid1').onchange = e => { AI.avoid1 = e.target.checked; };

      AI.chunks.push({ nums:part, text:buildPrompt(AI.type, part, { avoidTerms }) });
    }
    /* メモに名簿の名前が入っていた子を知らせる（プロンプトでは置きかえ済み） */
    const parts = nameParts();

    drawChunks();
  };
  $('#btn-copy').onclick = async () => {
    const c = AI.chunks[AI.at]; if(!c) return;
    await copyText(c.text);
    AI.copied[AI.at] = true; drawChunks();
    toast(AI.chunks.length > 1 ? `#${c.nums[0]}〜#${c.nums[c.nums.length-1]} をコピーしました` : 'コピーしました');
  };
  $('#btn-parse').onclick = doImport;
  $('#btn-clearpaste').onclick = () => { $('#pastearea').value = ''; AI.info = ''; $('#i-info').innerHTML = ''; };
  drawChunks();
}
function drawChunks(msg){
  const out = $('#promptout'), box = $('#chunks'), info = $('#p-info'), copy = $('#btn-copy');
  if(!out) return;
  box.innerHTML = '';
  if(!AI.chunks.length){
    out.textContent = msg || '（「プロンプトを作る」を押してください）';
    info.textContent = ''; copy.disabled = true; return;
  }
  if(AI.chunks.length > 1){
    AI.chunks.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = (i === AI.at ? 'on ' : '') + (AI.copied[i] ? 'done' : '');
      b.textContent = `${i+1}回目 #${c.nums[0]}〜#${c.nums[c.nums.length-1]}`;
      b.onclick = () => { AI.at = i; drawChunks(); };
      box.appendChild(b);
    });
  }
  const c = AI.chunks[AI.at];
  out.textContent = c.text;
  copy.disabled = false;
  const total = AI.chunks.reduce((a, x) => a + x.nums.length, 0);
  info.textContent = AI.chunks.length > 1
    ? `${total}人を${AI.chunks.length}回に分けました（この回：${c.nums.length}人・約${c.text.length}字）`
    : `${c.nums.length}人分・約${c.text.length}字`;
}

function doImport(){
  const raw = $('#pastearea').value;
  if(!raw.trim()) return toast('貼り付け欄が空です');
  const k = AI.importType;
  const res = E.parsePasted(raw);
  const nos = res.order.filter(n => n >= 1 && n <= S.meta.count);
  const skipped = res.order.filter(n => !(n >= 1 && n <= S.meta.count));
  if(!nos.length){
    AI.info = '<div class="notice warn">「#番号」の行が見つかりませんでした。返ってきた文の形を確かめてください。</div>';
    $('#i-info').innerHTML = AI.info; return;
  }
  const already = nos.filter(n => draftOf(n, k));
  const apply = mode => {
    let cands = 0, applied = 0;
    nos.forEach(n => {
      if(mode === 'skip' && draftOf(n, k)) return;
      const list = res.blocks[n];
      if(mode === 'add' && draftOf(n, k)) addCands(n, k, list); else setCands(n, k, list);
      cands += list.length; applied++;
    });
    save();
    AI.info = `<div class="notice ok">${R.types[k].label}：${applied}人分・計${cands}案を取り込みました。` +
      (skipped.length ? `（名簿にない番号 ${skipped.join('・')} は除きました）` : '') +
      `<div style="margin-top:8px"><button class="btn primary sm" id="go-pick">3 案を選ぶ・直す へ ›</button></div></div>`;
    $('#i-info').innerHTML = AI.info;
    $('#go-pick').onclick = () => { cur = nos[0]; showTab('pick'); };
    renderSteps();
    toast(`${applied}人分・${cands}案を取り込みました`);
  };
  if(!already.length) return apply('replace');
  dlg({
    title:'すでに本文がある児童がいます',
    body:`<p style="margin-top:0">${already.map(n=>'#'+n).join('・')} には、すでに「${esc(R.types[k].label)}」の本文があります（手で直した文かもしれません）。</p>
      <ul class="plain">
        <li><b>新しい案を後ろに足す</b> … いまの本文はそのまま。新しい案は「案を選ぶ」で選べます。</li>
        <li><b>この子たちは取り込まない</b> … 本文がまだ無い子だけ取り込みます。</li>
        <li><b>置き換える</b> … いまの案と本文を消して、新しい案にします。</li>
      </ul>`,
    buttons:[
      { label:'やめる', value:null },
      { label:'置き換える', value:'replace', kind:'danger' },
      { label:'この子たちは取り込まない', value:'skip' },
      { label:'新しい案を後ろに足す', value:'add', kind:'primary' }
    ]
  }).then(v => { if(v) apply(v); });
}

function noTypesCard(){

function wireNoTypes(root){ const b = $('#open-settings', root); if(b) b.onclick = openSettings; }

function viewPick(root){
  const types = activeTypes();
  const wrap = document.createElement('div'); wrap.className = 'layout';
