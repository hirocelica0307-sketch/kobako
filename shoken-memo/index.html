function draftBox(k){
  const t = R.types[k], rg = E.lenRange(k);
  const d = document.createElement('div'); d.className = 'draftbox';
  const top = document.createElement('div'); top.className = 'top';
  top.innerHTML = `<b>${esc(t.label)}</b><span class="mini">${rg.target}字程度（${rg.min}〜${rg.max}字）</span>
    <span class="count" data-c></span><span class="badge" data-lv></span>`;
  d.appendChild(top);

  /* その子のメモ（この種類に使う欄だけ） */
  const mb = memoBlock(cur, k);
  const ref = document.createElement('details'); ref.className = 'memoref';
  ref.innerHTML = mb
    ? `<summary>メモを見る</summary>${mb.split('\n').map(l => `<div>${esc(l)}</div>`).join('')}`
    : `<summary>メモがありません</summary><div>「1 メモを書く」で入れると、案づくりに使えます。</div>`;
  d.appendChild(ref);

  /* ほかの学期に採用した、同じ種類の所見（同じ教科を避ける・伸びを書くための参考） */
  const past = ['1','2','3'].filter(tm => tm !== S.term).map(tm => ({ tm, text:draftOf(cur, k, tm) })).filter(x => x.text);
  if(past.length){
    const pv0 = document.createElement('details'); pv0.className = 'memoref pastterm'; pv0.open = true;
    pv0.innerHTML = `<summary>ほかの学期の${esc(t.label)}</summary>` + past.map(x => {
      const subs = k === 'shoken' ? E.topicsOf(x.text, k).subjects : [];
      return `<div><span class="tchip">${x.tm}学期</span>${subs.length ? ` <span class="tchip">${esc(subs.join('・'))}</span>` : ''} ${esc(x.text)}</div>`;
    }).join('');
    d.appendChild(pv0);
  }

  const cl = document.createElement('div'); cl.className = 'cands'; d.appendChild(cl);
  const note = document.createElement('div'); note.className = 'candnote'; d.appendChild(note);
  /* この子を除いたクラスの話題の数と、ほかの子の採用済みの文（各案が多すぎないか・似ていないかを見るため） */
  const otherEntries = classEntries(k, [cur]);
  const others = E.tallyKeys(otherEntries, k);
  const ta = document.createElement('textarea');
  ta.rows = 4; ta.value = draftOf(cur, k);
  ta.placeholder = '案を選ぶか、ここに直接書いてください。' + (t.note ? '（' + t.note + '）' : '');
  ta.setAttribute('aria-label', t.label + 'の本文');
  d.appendChild(ta);
  const pv = document.createElement('div'); pv.className = 'preview'; d.appendChild(pv);
  const iss = document.createElement('div'); iss.className = 'issues'; d.appendChild(iss);

  const renderCands = () => {
    const list = candsOf(cur, k), sel = pickOf(cur, k);
    cl.innerHTML = ''; note.innerHTML = '';
    if(list.length < 2){ cl.classList.add('hide'); note.classList.add('hide'); return; }
    cl.classList.remove('hide'); note.classList.remove('hide');
    const head = document.createElement('div'); head.className = 'candhead';
    head.innerHTML = `<span class="mini">Claude が作った${list.length}つの案です。使うものを選んでください。選ばなかった案も残ります。</span>`;
    const delAll = document.createElement('button');
    delAll.className = 'btn sm danger'; delAll.textContent = 'この子の案を全部削除';
    delAll.onclick = () => dlg({
      title:'案を全部削除します',
      body:`出席番号 ${cur} の「${esc(t.label)}」の案を ${list.length}件すべて削除し、本文も空にします。元に戻せません。`,
      buttons:[{ label:'やめる', value:false }, { label:'削除する', value:true, kind:'danger' }]
    }).then(ok => {
      if(!ok) return;
      const rr = rec(S.term, cur);
      delete rr.cands[k]; delete rr.pick[k]; rr.drafts[k] = '';
      save(); renderCands(); ta.value = ''; refresh(); refreshKid(cur); toast('案を削除しました');
    });
    head.appendChild(delAll);
    cl.appendChild(head);

    list.forEach((c, i) => {
      const n = E.countChars(c.text);
      const lv = E.worst(visibleIssues(c.text, k, cur));
      const row = document.createElement('button');
      row.className = 'cand' + (i === sel ? ' on' : '');
      row.setAttribute('aria-pressed', i === sel ? 'true' : 'false');
      row.innerHTML =
        `<span class="pick">${i === sel ? '●' : '○'}</span>` +
        `<span class="cbody"><span class="chead">案${i+1}` +
        `<span class="count ${n>=rg.min&&n<=rg.max?'ok':'ng'}">${n}字</span>` +
        `<span class="badge ${lv==='error'?'error':lv==='warn'?'warn':'ok'}">${lv==='error'?'要修正':lv==='warn'?'注意':'OK'}</span></span>` +
        `<span class="ctext">${esc(c.text)}</span>${topicChips(c.text, k, others, otherEntries)}</span>`;
      row.onclick = () => {
        pickCand(cur, k, i);
        ta.value = draftOf(cur, k);
        save(); renderCands(); refresh(); refreshKid(cur);
        /* 上限を超える単元・項目があれば知らせる */
        const over = E.keysOf(c.text, k).filter(key => !key.startsWith('書き出し|') && ((others[key] || []).length + 1) > limitFor(key));
        if(over.length) toast(`${over.map(keyLabel).join('・')} は、この子で${limitFor(over[0])}人をこえます`);
      };
      const del = document.createElement('span');
      del.className = 'canddel'; del.title = `案${i+1}を削除`; del.textContent = '×'; del.setAttribute('role', 'button');
      del.onclick = e => {
        e.stopPropagation();
        dlg({
          title:`案${i+1}を削除します`,
          body:`<p style="margin-top:0">出席番号 ${cur} の「${esc(t.label)}」の案${i+1}を削除します。元に戻せません。</p><div class="preview">${esc(c.text)}</div>`,
          buttons:[{ label:'やめる', value:false }, { label:'削除する', value:true, kind:'danger' }]
        }).then(ok => {
          if(!ok) return;
          const rr = rec(S.term, cur), l = rr.cands[k];
          const wasSel = pickOf(cur, k);
          l.splice(i, 1);
          if(!l.length){ delete rr.cands[k]; delete rr.pick[k]; rr.drafts[k] = ''; }
          else{
            const ns = Math.min(wasSel > i ? wasSel - 1 : (wasSel === i ? 0 : wasSel), l.length - 1);
            rr.pick[k] = ns; rr.drafts[k] = l[ns].text;
          }
          ta.value = draftOf(cur, k);
          save(); renderCands(); refresh(); refreshKid(cur);
          toast(`案${i+1}を削除しました`);
        });
      };
      row.appendChild(del);
      cl.appendChild(row);
    });
    const cn = list[sel] && list[sel].note;
    note.innerHTML = cn ? `<b>この案の工夫</b> ${esc(cn)}` : '';
    if(!cn) note.classList.add('hide');
  };

  const refresh = () => {
    const text = ta.value;
    const n = E.countChars(text);
    const cEl = $('[data-c]', top), lvEl = $('[data-lv]', top);
    cEl.textContent = n + '字';
    cEl.className = 'count ' + (!text.trim() ? '' : (n >= rg.min && n <= rg.max ? 'ok' : 'ng'));
    const all = check(text, k, cur);
    const issues = visibleIssues(text, k, cur);
    const hidden = all.filter(i => issues.indexOf(i) < 0);
    const lv = text.trim() ? E.worst(issues) : 'none';
    lvEl.className = 'badge ' + (lv === 'error' ? 'error' : lv);
    lvEl.textContent = { error:'要修正', warn:'注意', ok:'OK', none:'未作成' }[lv];
    pv.innerHTML = text.trim() ? E.highlight(text, issues) : '<span class="mini">（ここに校正結果が色付きで出ます）</span>';
    iss.innerHTML = '';
    if(text.trim() && !issues.length){
      iss.innerHTML = '<div class="noissue">' + (hidden.length ? '残っている指摘はありません（確認済みにしたものを除く）。' :
        'ルール上の問題は見つかりませんでした。') + '内容が事実と合っているか、最後にご自身で確かめてください。</div>';
    }
    /* 先生が確かめて「このままでよい」とした指摘は、確認済みにして表示を消せる */
    if(issues.length > 1){
      const allBtn = document.createElement('div'); allBtn.className = 'row'; allBtn.style.justifyContent = 'flex-end';
      allBtn.innerHTML = `<button class="btn sm" data-dismiss-all>この文の指摘をすべて確認済みにする</button>`;
      $('[data-dismiss-all]', allBtn).onclick = () => {
        setDismiss(cur, k, issues.map(E.issueSig), true); save(); refresh(); renderCands(); refreshKid(cur);
      };
      iss.appendChild(allBtn);
    }
    issues.forEach(i => {
      const e = document.createElement('div'); e.className = 'issue ' + i.level;
      e.innerHTML = `<span class="tag">${esc(i.kind)}</span><span>${esc(i.msg)}${
        i.ng && i.ok ? ` <s style="color:var(--muted)">${esc(i.ng)}</s> → <b>${esc(i.ok)}</b>` : ''}</span>`;
      const tools = document.createElement('span'); tools.className = 'fix'; tools.style.display = 'flex'; tools.style.gap = '4px';
      if(i.fixable){
        const fx = document.createElement('button'); fx.className = 'btn sm'; fx.textContent = '直す';
        fx.onclick = () => {
          ta.value = ta.value.slice(0, i.index) + i.ok + ta.value.slice(i.index + i.length);
          editDraft(cur, k, ta.value); save(); refresh(); renderCands(); refreshKid(cur);
        };
        tools.appendChild(fx);
      }
      const ok = document.createElement('button'); ok.className = 'btn sm'; ok.textContent = '確認した';
      ok.title = '確かめて、このままでよいときに押します。この指摘の表示が消えます';
      ok.onclick = () => { setDismiss(cur, k, [E.issueSig(i)], true); save(); refresh(); renderCands(); refreshKid(cur); };
      tools.appendChild(ok);
      e.appendChild(tools);
      iss.appendChild(e);
    });
    if(hidden.length){
      const h = document.createElement('div'); h.className = 'mini dismissed';
      h.innerHTML = `確認済みにした指摘：${hidden.length}件 <button class="btn sm" data-undo-dismiss>表示に戻す</button>`;
      $('[data-undo-dismiss]', h).onclick = () => {
        setDismiss(cur, k, hidden.map(E.issueSig), false); save(); refresh(); renderCands(); refreshKid(cur);
      };
      iss.appendChild(h);
    }
  };
  ta.addEventListener('input', () => { editDraft(cur, k, ta.value); saveSoon(); refresh(); refreshKid(cur); });
  ta.addEventListener('blur', renderCands);
  renderCands(); refresh();
  return d;
}

/* =========================================================================
   5 仕上げ・書き出し（クラス全体の確認と一覧）
   ========================================================================= */
let FIN = { type:null, filter:'all', withName:false };

function viewFinish(root){
  const types = activeTypes();
  if(!types.includes(FIN.type)) FIN.type = types[0] || null;
  if(!types.length){ root.innerHTML = noTypesCard(); wireNoTypes(root); return; }
  const k = FIN.type;

  const rows = [];
  const c = { error:0, warn:0, ok:0, none:0 };
  for(let n = 1; n <= S.meta.count; n++){
    const text = draftOf(n, k);
    const issues = text ? visibleIssues(text, k, n) : [];
    const lv = text ? E.worst(issues) : 'none';
    c[lv]++;
    rows.push({ n, text, issues, lv });
  }
  const dups = E.findDuplicates(rows.map(r => ({ no:r.n, text:r.text })));
  const shown = rows.filter(r =>
    FIN.filter === 'all' ? true :
    FIN.filter === 'fix' ? (r.lv === 'error' || r.lv === 'warn') :
    FIN.filter === 'none' ? r.lv === 'none' : true);

  root.innerHTML = `
  <section class="card noprint">
    <h2>仕上げ・書き出し</h2>
    <div class="row" style="margin-bottom:12px">
      <label class="inline">種類 <select id="l-type">${typeOptions(k)}</select></label>
      <span class="spacer"></span>
      <button class="btn local-only" id="btn-csv">CSVで保存（Excel用）</button>
      <button class="btn local-only" id="btn-txt">テキストで保存</button>
      <button class="btn sheet-only" id="btn-sheet">書き出しシートに出す</button>
      <button class="btn" id="btn-print">印刷</button>
    </div>
    ${hasNames() ? `<label class="inline mini" style="margin:-4px 0 10px"><input type="checkbox" id="l-name" ${FIN.withName ? 'checked' : ''}> 書き出し・印刷に名前を入れる</label>` : ''}
    <div class="summary">
      <button class="sumbox ${FIN.filter==='all'?'on':''}" data-f="all"><b>${S.meta.count}</b><span>すべて</span></button>
      <button class="sumbox err ${FIN.filter==='fix'?'on':''}" data-f="fix"><b>${c.error}</b><span>要修正</span></button>
      <button class="sumbox warn ${FIN.filter==='fix'?'on':''}" data-f="fix"><b>${c.warn}</b><span>注意</span></button>
      <div class="sumbox ok"><b>${c.ok}</b><span>OK</span></div>
      <button class="sumbox ${FIN.filter==='none'?'on':''}" data-f="none"><b>${c.none}</b><span>未作成</span></button>
    </div>
    <p class="mini" style="margin:0"><span class="local-only">CSVはBOM付きUTF-8です。Excelでそのまま開けます。</span>
      <span class="sheet-only">同じスプレッドシートに書き出しシートを作ります。そこから校務システムへコピーできます。</span>
      数字の箱を押すと、その児童だけを表示します。「確認済み」にした指摘は数えません。</p>
  </section>

  <section class="card noprint">
    <h2>クラス全体の偏り <span class="mini" style="font-weight:400" id="v-limit"></span></h2>
    <div id="variety"></div>
  </section>

  <section class="card noprint">
    <h2>クラス内で表現が似ている組み合わせ</h2>
    <div id="dupresult" class="mini"></div>
  </section>

  <section class="card">
    <h2 id="list-title">${esc(S.meta.year)}年度 ${esc(S.meta.grade)}年 ${S.term}学期 ／ ${esc(R.types[k].label)}</h2>
    <table>
      <thead><tr><th>番号</th><th>本文と校正</th><th>字数</th><th>判定</th><th class="noprint"></th></tr></thead>
      <tbody id="listbody"></tbody>
    </table>
    ${shown.length ? '' : '<p class="mini">該当する児童はいません。</p>'}
  </section>`;

  const tb = $('#listbody');
  shown.forEach(r => {
    const tr = document.createElement('tr'); tr.className = 'rowlink';
    const list = candsOf(r.n, k);
    const which = list.length > 1 ? `<div class="mini">案${pickOf(r.n, k)+1}/${list.length}</div>` : '';
    const badge = r.lv === 'none' ? '<span class="badge none">未作成</span>'
      : r.lv === 'error' ? '<span class="badge error">要修正</span>'
      : r.lv === 'warn' ? '<span class="badge warn">注意</span>' : '<span class="badge ok">OK</span>';
    const issues = r.issues.filter(i => i.level !== 'info').map(i =>
      `<div class="issue ${i.level}"><span class="tag">${esc(i.kind)}</span><span>${esc(i.msg)}${
        i.ng && i.ok ? ` <s style="color:var(--muted)">${esc(i.ng)}</s> → <b>${esc(i.ok)}</b>` : ''}</span></div>`).join('');
    const nm = nameOf(r.n);
    tr.innerHTML = `<td class="no">${r.n}${nm ? `<div class="tname ${FIN.withName ? '' : 'noprint'}">${esc(nm)}</div>` : ''}</td>
      <td>${r.text ? E.highlight(r.text, r.issues) : '<span class="mini">（まだありません）</span>'}${issues ? `<div class="issues">${issues}</div>` : ''}</td>
      <td class="len">${r.text ? E.countChars(r.text) : ''}</td>
      <td class="st">${badge}${which}</td>
      <td class="noprint"><button class="btn sm ghost" data-open="${r.n}">${r.text ? '直す ›' : '書く ›'}</button></td>`;
    tb.appendChild(tr);
  });
  $$('[data-open]', root).forEach(b => b.onclick = () => { cur = +b.dataset.open; showTab(b.textContent.indexOf('書く') >= 0 && !memoBlock(cur, k) ? 'memo' : 'pick'); });
  $$('[data-f]', root).forEach(b => b.onclick = () => { FIN.filter = FIN.filter === b.dataset.f ? 'all' : b.dataset.f; renderView(); });
  $('#l-type').onchange = e => { FIN.type = e.target.value; renderView(); };
  if($('#l-name')) $('#l-name').onchange = e => { FIN.withName = e.target.checked; renderView(); };

  drawVariety(k);

  const dv = $('#dupresult');
  if(!dups.length) dv.textContent = '似すぎている組み合わせはありません。';
  else{
    dv.innerHTML = dups.map(d => {
      const lv = d.sim >= R.duplication.errorThreshold ? 'error' : 'warn';
      const na = candsOf(d.a, k).length, nb = candsOf(d.b, k).length;
      const hint = (na > 1 || nb > 1) ? `　どちらかを別の案に変えると直せます（#${d.a}：${na}案／#${d.b}：${nb}案）。` : '';
      return `<div class="issue ${lv}"><span class="tag">#${d.a} と #${d.b}</span>
        <span>${Math.round(d.sim*100)}% 一致。${esc(R.duplication.msg)}${hint}</span>
        <button class="btn sm fix" data-dup="${d.a}">#${d.a}を開く</button></div>`;
    }).join('');
    $$('[data-dup]', dv).forEach(b => b.onclick = () => { cur = +b.dataset.dup; showTab('pick'); });
  }

  /* 書き出しの表。名前は「名前を入れる」にしたときだけ */
  const withName = hasNames() && FIN.withName;
  const exportHead = ['出席番号'].concat(withName ? ['名前'] : [], [R.types[k].label, '字数']);
  const exportRows = () => {
    const out = [];
    for(let n = 1; n <= S.meta.count; n++){
      const t = draftOf(n, k);
      out.push([n].concat(withName ? [nameOf(n)] : [], [t, t ? E.countChars(t) : '']));
    }
    return out;
  };
  $('#btn-csv').onclick = () => {
    const rows2 = [exportHead].concat(exportRows());
    const csv = '﻿' + rows2.map(r => r.map(csvCell).join(',')).join('\r\n');
    download(`所見_${S.meta.year}_${S.meta.grade}年_${S.term}学期_${R.types[k].label}.csv`, csv, 'text/csv;charset=utf-8');
  };
  $('#btn-txt').onclick = () => {
    let out = `${S.meta.year} ${S.meta.grade}年 ${S.term}学期 ${R.types[k].label}\n\n`;
    exportRows().forEach(r => {
      const [n, t, len] = withName ? [r[0], r[2], r[3]] : r;
      out += `#${n}${withName && r[1] ? ' ' + r[1] : ''}（${len || 0}字）\n${t || '（未作成）'}\n\n`;
    });
    download(`所見_${S.meta.grade}年_${S.term}学期_${R.types[k].label}.txt`, out);
  };
  $('#btn-sheet').onclick = () => {
    const b = $('#btn-sheet'); b.disabled = true; toast('書き出しています…');
    gasCall('exportToSheet', `${S.term}学期_${R.types[k].label}`, exportHead, exportRows())
      .then(name => { b.disabled = false; toast(`シート「${name}」に書き出しました`); })
      .catch(e => { b.disabled = false; alert('書き出せませんでした：' + e.message); });
  };
  $('#btn-print').onclick = () => {
    if(FIN.filter !== 'all'){ FIN.filter = 'all'; renderView(); }
    setTimeout(() => window.print(), 50);
  };
}

/* クラス全体の偏り：教科・単元・生活の話題・書き出しの人数と、案の切りかえの提案 */
function drawVariety(k){
  const box = $('#variety'); if(!box) return;
  const iLim = itemLimitNow(), sLim = subjLimitNow();
  const hasLimit = iLim !== Infinity || sLim !== Infinity;
  const entries = classEntries(k);
  $('#v-limit').textContent = (k === 'shoken'
    ? `同じ単元・同じ生活の項目は${iLim === Infinity ? '人数をしぼらない' : iLim + '人まで'}／同じ教科・書き出しは${sLim === Infinity ? '目安なし' : sLim + '人まで'}`
    : `同じ書き出しは${sLim === Infinity ? '目安なし' : sLim + '人まで'}`) + '（設定で変えられます）';
  if(!entries.length){ box.innerHTML = '<p class="mini" style="margin:0">本文がまだありません。</p>'; return; }
  const tally = E.tallyKeys(entries, k);
  const cats = k === 'shoken' ? KEY_CATS : ['書き出し'];
  let html = '<div class="vgrid">';
  cats.forEach(cat => {
    const items = Object.entries(tally).filter(([key]) => key.startsWith(cat + '|'))
      .map(([key, v]) => ({ key, n:v.length, nos:v })).sort((a, b) => b.n - a.n);
    if(!items.length) return;
    if(cat === '書き出し' && !items.some(x => x.n > 1)) return;
    const shown = items.slice(0, 8);
    html += `<div class="vcat"><h3>${esc(cat)}</h3>` + shown.map(x =>
      `<div class="vrow ${x.n > limitFor(x.key) ? 'over' : ''}" title="${x.nos.map(n => '#' + n).join('・')}">
        <span class="nm">${esc(keyLabel(x.key))}</span>
        <span class="vb"><span style="width:${Math.min(100, x.n / entries.length * 100)}%"></span></span>
        <b>${x.n}人</b></div>`).join('') +
      (items.length > shown.length ? `<div class="mini">ほか ${items.length - shown.length}件</div>` : '') + '</div>';
  });
  html += '</div>';
  if(k !== 'shoken') html += '<p class="mini">道徳所見などは、内容項目を学年でそろえるきまりがあるため、書き出しの重なりだけを数えます。</p>';

  const overKeys = Object.keys(tally).filter(key => tally[key].length > limitFor(key));
  if(!hasLimit){ box.innerHTML = html; return; }
  if(!overKeys.length){
    box.innerHTML = html + `<div class="notice ok" style="margin:12px 0 0">上限・目安を超えている単元・項目・教科・書き出しはありません。</div>`;
    return;
  }
  const plan = E.planSwaps(entries.map(e => ({
    no:e.no, text:e.text, pick:pickOf(e.no, k),
    cands:candsOf(e.no, k).map(c => ({ text:c.text, usable:E.worst(visibleIssues(c.text, k, e.no)) !== 'error' }))
  })), k, limitFor);
  html += `<div class="notice warn" style="margin:12px 0 10px">上限・目安を超えているもの：${overKeys.map(key =>
    `<b>${esc(keyLabel(key))}</b> ${tally[key].length}人（${limitFor(key)}人まで）`).join('、')}</div>`;
  if(plan.swaps.length){
    html += `<div class="row" style="margin-bottom:8px"><b style="font-size:13.5px">案を切りかえると減らせます</b>
      <span class="spacer"></span><button class="btn primary sm" id="swap-all">提案をまとめて切りかえる（${plan.swaps.length}人）</button></div>`;
    html += plan.swaps.map((w, i) => {
      const show = keys => keys.filter(x => !x.startsWith('書き出し|')).map(keyLabel).join('・') || '（書き出しだけが変わります）';
      return `<div class="swap"><span class="no">#${w.no}</span>
        <span>案${w.from + 1} → <b>案${w.to + 1}</b></span>
        <span class="mini">${esc(show(w.fromKeys))} → <b>${esc(show(w.toKeys))}</b></span>
        <span class="spacer"></span>
        <button class="btn sm" data-look="${w.no}">見る</button>
        <button class="btn sm ghost" data-swap="${i}">案${w.to + 1}にする</button></div>`;
    }).join('');
  }else{
    html += '<p class="mini">選べる案の中には、偏りを減らせるものがありません。「2 AIで案を作る」で、上限を超えている子だけを作り直すと、クラスの配分を見た案が出ます（対象を「選択中の1人だけ」にすると1人ずつ作れます）。</p>';
  }
  box.innerHTML = html;
  const apply = list => {
    list.forEach(w => pickCand(w.no, k, w.to));
    save(); renderView(); renderSteps();
    toast(`${list.length}人の案を切りかえました`);
  };

  const nums = [];

/* 文字ごとの違い（消したところ・足したところ）を色で見せる */
function diffHTML(a, b){
  const A = Array.from(a || ''), B = Array.from(b || '');
  const n = A.length, m = B.length;
  const dp = Array.from({ length:n + 1 }, () => new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = '', mode = '', buf = '';
  const flush = () => { if(buf) out += mode === 'del' ? `<del>${esc(buf)}</del>` : mode === 'ins' ? `<ins>${esc(buf)}</ins>` : esc(buf); buf = ''; };
  const put = (md, ch) => { if(md !== mode){ flush(); mode = md; } buf += ch; };
  while(i < n && j < m){
    if(A[i] === B[j]){ put('', A[i]); i++; j++; }
    else if(dp[i + 1][j] >= dp[i][j + 1]){ put('del', A[i]); i++; }
    else { put('ins', B[j]); j++; }
  }
  while(i < n){ put('del', A[i]); i++; }
  while(j < m){ put('ins', B[j]); j++; }
  flush();
  return out;
}

function drawReviewChunks(msg){
  const out = $('#r-out'), box = $('#r-chunks'), info = $('#r-info'), copy = $('#r-copy');

    });
  }

  out.textContent = c.text; copy.disabled = false;

function importReview(k){
  const raw = $('#r-paste').value;
  if(!raw.trim()) return toast('貼り付け欄が空です');
  const res = E.parsePasted(raw);
  const got = res.order.filter(n => n >= 1 && n <= S.meta.count && draftOf(n, k));
  if(!got.length){
    RV.info = '<div class="notice warn">「#番号」の行が見つからないか、その番号の本文がありません。返ってきた文の形を確かめてください。</div>';
    $('#r-msg').innerHTML = RV.info; return;
  }
  const keep = RV.results.filter(x => got.indexOf(x.no) < 0);
  const fresh = got.map(n => {
    const c = res.blocks[n][0];
    const before = draftOf(n, k), after = c.text.trim();
    const same = after === before || /^直しなし/.test(after);
    return { no:n, before, after: same ? before : after, note:(c.note || '').replace(/^直しなし$/, ''), status: same ? 'same' : 'pending' };
  });
  RV.results = keep.concat(fresh).sort((a, b) => a.no - b.no);
  const changed = fresh.filter(x => x.status === 'pending').length;
  RV.info = `<div class="notice ok">${fresh.length}人分を取り込みました。直しがあるのは${changed}人です。下の「直しの確認」で、使うかどうかを決めてください。</div>`;
  $('#r-msg').innerHTML = RV.info;
  $('#r-results-card').hidden = false;
  drawReviewResults(k);
  $('#r-results-card').scrollIntoView({ block:'start' });
  toast(`${fresh.length}人分を取り込みました（直し${changed}人）`);
}
function drawReviewResults(k){
  const box = $('#r-results'); if(!box) return;
  if(!RV.results.length){ box.innerHTML = ''; return; }
  const pending = RV.results.filter(x => x.status === 'pending');
  const used = RV.results.filter(x => x.status === 'used').length;
  const st = { pending:'まだ決めていない', used:'使った', skipped:'使わない', same:'直しなし' };
  let html = `<div class="row" style="margin-bottom:10px">
      <span class="mini">直しあり ${RV.results.filter(x => x.status !== 'same').length}人（使った ${used}人・まだ ${pending.length}人）／ 直しなし ${RV.results.filter(x => x.status === 'same').length}人</span>
      <span class="spacer"></span>
      ${pending.length ? `<button class="btn primary sm" id="r-use-all">まだの直しをすべて使う（${pending.length}人）</button>` : ''}
      <button class="btn sm ghost" id="r-go-finish">5 仕上げ・書き出し へ ›</button>
    </div>
    <p class="mini" style="margin:0 0 10px"><del>赤い取り消し線</del>が消したところ、<ins>緑</ins>が足したところです。直した文の校正結果も確かめてから使ってください。</p>`;
  html += RV.results.map((x, i) => {
    const nm = nameOf(x.no);
    const iss = x.status === 'same' ? [] : visibleIssues(x.after, k, x.no);
    const lv = x.status === 'same' ? 'ok' : E.worst(iss);
    const n = E.countChars(x.after), rg = E.lenRange(k);
    const btns = x.status === 'pending'
      ? `<button class="btn sm primary" data-ruse="${i}">この直しを使う</button><button class="btn sm" data-rskip="${i}">使わない</button>`
      : x.status === 'used' ? `<button class="btn sm" data-rundo="${i}">元の文に戻す</button>`
      : x.status === 'skipped' ? `<button class="btn sm" data-ruse="${i}">やはり使う</button>` : '';
    return `<div class="rvrow st-${x.status}">
      <div class="row"><b>#${x.no}${nm ? ' ' + esc(nm) : ''}</b>
        <span class="stbadge ${x.status === 'used' ? 'ok' : x.status === 'pending' ? 'part' : ''}">${st[x.status]}</span>
        ${x.status !== 'same' ? `<span class="count ${n >= rg.min && n <= rg.max ? 'ok' : 'ng'}">${n}字</span>
        <span class="badge ${lv === 'error' ? 'error' : lv === 'warn' ? 'warn' : 'ok'}">${lv === 'error' ? '要修正' : lv === 'warn' ? '注意' : 'OK'}</span>` : ''}
        <span class="spacer"></span>${btns}
        <button class="btn sm" data-rlook="${x.no}">3で開く</button></div>
      <div class="rvtext">${x.status === 'same' ? esc(x.before) : diffHTML(x.before, x.after)}</div>
      ${x.note ? `<div class="mini">※ ${esc(x.note)}</div>` : ''}
      ${iss.filter(j => j.level !== 'info').length ? `<div class="issues">${iss.filter(j => j.level !== 'info').map(j =>
        `<div class="issue ${j.level}"><span class="tag">${esc(j.kind)}</span><span>${esc(j.msg)}</span></div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  box.innerHTML = html;
  const use = list => {
    list.forEach(x => {
      if(draftOf(x.no, k) !== x.before && draftOf(x.no, k) !== x.after){ x.status = 'skipped'; return; }
      editDraft(x.no, k, x.after); x.status = 'used';
    });
    save(); renderSteps(); drawReviewResults(k);
  };
  $$('[data-ruse]', box).forEach(b => b.onclick = () => { use([RV.results[+b.dataset.ruse]]); toast('直した文を使いました'); });
  $$('[data-rskip]', box).forEach(b => b.onclick = () => { RV.results[+b.dataset.rskip].status = 'skipped'; drawReviewResults(k); });
  $$('[data-rundo]', box).forEach(b => b.onclick = () => {
    const x = RV.results[+b.dataset.rundo];
    editDraft(x.no, k, x.before); x.status = 'pending'; save(); renderSteps(); drawReviewResults(k); toast('元の文に戻しました');
  });
  $$('[data-rlook]', box).forEach(b => b.onclick = () => { cur = +b.dataset.rlook; showTab('pick'); });
  const all = $('#r-use-all', box);
  if(all) all.onclick = () => { const p = RV.results.filter(x => x.status === 'pending'); use(p); toast(`${p.length}人の直しを使いました`); };
  $('#r-go-finish', box).onclick = () => { FIN.type = k; showTab('finish'); };
}

      h += `<details style="margin-bottom:8px"><summary><b>${esc(sub.label)}</b></summary>`;
      if(sub.aim) h += `<div class="mini">目標：${esc(sub.aim)}</div>`;
      h += '<table style="margin-top:5px"><thead><tr><th style="width:24%;position:static">領域</th><th style="position:static">指導事項（要旨）</th><th style="width:28%;position:static">所見に使える言い方</th></tr></thead><tbody>';
      items.forEach(it => { h += `<tr><td class="mini">${esc(it.cite)}</td><td>${esc(it.t)}</td><td class="mini">${(it.w || []).map(esc).join('<br>')}</td></tr>`; });
      h += '</tbody></table></details>';
    });
    box.innerHTML = h || '<p class="mini">この学年段階の指導事項がありません。</p>';
  }
  $('#rule-meta').innerHTML = '出典：' + R.meta.source.map(esc).join('／') + `（版 ${esc(R.meta.updated)}）`;
  $('#rule-principles').innerHTML = R.principles.map(p => `<li>${esc(p)}</li>`).join('');
  $('#rule-common').innerHTML = R.commonRules.map(p => `<li>${esc(p)}</li>`).join('');
  $('#rule-types').innerHTML = '<table><thead><tr><th style="position:static">種別</th><th style="position:static">目安</th><th style="position:static">許容</th><th style="position:static">今回書く</th></tr></thead><tbody>' +
    Object.entries(R.types).map(([k, t]) => {
      const rg = E.lenRange(k);
      const w = ['1','2','3'].filter(tm => activeTypes(tm).includes(k)).map(tm => tm + '学期');
      return `<tr><td>${esc(t.label)}</td><td class="len">${t.target}字</td><td class="len">${rg.min}〜${rg.max}</td><td class="mini">${w.join('、') || '—'}</td></tr>`;
    }).join('') + '</tbody></table>';
  $('#rule-vague').innerHTML = R.vague.map(v => `<div><s>${esc(v.ng)}</s> → ${esc(v.ok)}</div>`).join('');
  $('#rule-hyoki').innerHTML = R.hyoki.map(h => `<div><b>${esc(h.ok)}</b> <s>${esc(h.ng)}</s></div>`).join('') +
    R.subjects.checks.map(c => `<div><b>${esc(c.ok)}</b> <s>${esc(c.ng)}</s></div>`).join('');
  $('#rule-examples').innerHTML = R.examples.map(e =>
    `<div style="margin-bottom:10px"><div class="issue error" style="margin-bottom:3px"><span class="tag">×</span><span>${esc(e.bad)}</span></div>
     <div class="issue" style="background:var(--accent-w);border-color:var(--accent)"><span class="tag">○</span><span>${esc(e.good)}</span></div></div>`).join('');
}

/* =========================================================================
   設定（年度・学年・人数・今回書く種類）
   ========================================================================= */
function numsWithData(from){
  const out = [];
  for(let n = from; n <= 45; n++){
    if(['1','2','3'].some(t => hasData(peek(t, n)))) out.push(n);
  }
  return out;
}
function openSettings(){
  const box = document.createElement('div');
  const draftWrite = JSON.parse(JSON.stringify(S.write));
  const typeChecks = (grade, term) => {
    const can = (R.termMatrix[grade] || {})[term] || R.allTypes;
    return R.allTypes.filter(k => can.includes(k)).map(k =>
      `<label class="inline"><input type="checkbox" data-type="${k}" ${draftWrite[term].includes(k)?'checked':''}> ${esc(R.types[k].label)}（${R.types[k].target}字）</label>`).join('');
  };
  let term = S.term;
  box.innerHTML = `
    <div class="kv">
      <span>年度</span><input type="text" id="s-year" value="${esc(S.meta.year)}" style="width:90px">
      <span>学年</span><select id="s-grade">${[1,2,3,4,5,6].map(g=>`<option ${String(g)===String(S.meta.grade)?'selected':''}>${g}</option>`).join('')}</select>
      <span>人数</span><div><input type="number" id="s-count" min="1" max="45" value="${S.meta.count}" style="width:80px"> 人</div>
      <span>同じ単元・項目</span><div><select id="s-item">${(R.variety ? R.variety.itemLimitOptions : []).map(o =>
        `<option value="${o.value}" ${o.value === S.variety.itemLimit ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>
        <div class="mini">同じ単元や、同じ生活の項目（廊下歩行・あいさつなど）を所見で取り上げてよい人数です。</div></div>
      <span>同じ教科・書き出し</span><div><select id="s-share">${(R.variety ? R.variety.shareOptions : []).map(o =>
        `<option value="${o.value}" ${Math.abs(o.value - S.variety.share) < 0.001 ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>
        <div class="mini">AIへのお願いと「5 仕上げ」の偏りの表に使います。</div></div>
      <span>名前</span><div><button class="btn sm" id="s-names">${hasNames() ? '名前を直す' : '名前を入れる（入れなくてもよい）'}</button>
        <div class="mini">名前は、この画面と保存先の中だけで使います。AIへのプロンプトには入れません。</div></div>
    </div>
    <div style="margin-top:16px">
      <b>名簿でチェックする項目</b>
      <div class="row" id="s-checks" style="margin-top:4px">${(R.checkItems || []).map(i =>
        `<label class="inline"><input type="checkbox" data-ck="${i.key}" ${S.checkUse.includes(i.key) ? 'checked' : ''}> ${esc(i.label)}</label>`).join('')}</div>
      <p class="mini" style="margin:4px 0 0">道徳・総合・外国語は、その学期にその種類を書くときだけ出ます。</p>
    </div>
    <div style="margin-top:16px">
      <div class="row" style="margin-bottom:6px"><b>今回書く種類</b>
        <div class="seg" id="s-term">${['1','2','3'].map(t=>`<button data-t="${t}" class="${t===term?'on':''}">${t}学期</button>`).join('')}</div></div>
      <div class="typechecks" id="s-types"></div>
      <p class="mini" style="margin:6px 0 0">名簿のチェック項目と、プロンプト・一覧・書き出しの種類は、ここで選んだものだけになります。
        選んでいない種類の欄も、メモ画面の「ほかの欄」から入力できます。</p>
    </div>
    <div class="notice info" style="margin:14px 0 0">保存先：<b>${Store.kind==='sheet' ? 'このスプレッドシート' : 'このPCのブラウザ'}</b>。
      ${Store.kind==='sheet'
        ? 'スプレッドシート1つで1学年分です。'
        : '年度か学年を変えると、その学年のデータに切り替わります。ブラウザのデータを消すと記録も消えるので、ときどき「JSON保存」で控えを取ってください。'}</div>
    <div class="row local-only" style="margin-top:12px">
      <button class="btn sm" id="btn-export-json">JSON保存（控え）</button>
      <button class="btn sm" id="btn-import-json">JSON読込</button>
    </div>`;
  const drawTypes = () => {
    $('#s-types', box).innerHTML = typeChecks($('#s-grade', box).value, term);
    $$('#s-types input', box).forEach(cb => cb.onchange = () => {
      const k = cb.dataset.type, list = draftWrite[term];
      if(cb.checked){ if(!list.includes(k)) list.push(k); }
      else draftWrite[term] = list.filter(x => x !== k);
    });
  };
  $$('#s-term button', box).forEach(b => b.onclick = () => {
    term = b.dataset.t;
    $$('#s-term button', box).forEach(x => x.classList.toggle('on', x === b));
    drawTypes();
  });
  $('#s-grade', box).onchange = e => {
    Object.assign(draftWrite, defaultWrite(e.target.value));
    drawTypes();
  };
  drawTypes();
  $('#btn-export-json', box).onclick = () => {
    download(`学習の足跡_${S.meta.year}_${S.meta.grade}年.json`, JSON.stringify(S, null, 2), 'application/json');
  };
  $('#btn-import-json', box).onclick = () => $('#file-json').click();
  $('#s-names', box).onclick = () => { closeDialogs(); openNames(); };

  dlg({ title:'設定', node:box, buttons:[{ label:'キャンセル', value:false }, { label:'決定', value:true, kind:'primary' }] })
    .then(ok => {
      if(!ok) return;
      const year = $('#s-year', box).value.trim() || R.meta.year;
      const grade = $('#s-grade', box).value;
      const count = Math.min(45, Math.max(1, +$('#s-count', box).value || S.meta.count));
      const share = +($('#s-share', box) ? $('#s-share', box).value : S.variety.share);
      const itemLimit = +($('#s-item', box) ? $('#s-item', box).value : S.variety.itemLimit);
      const checkUse = $$('#s-checks input', box).filter(cb => cb.checked).map(cb => cb.dataset.ck);
      applySettings({ year, grade, count, write:draftWrite, share, itemLimit, checkUse });
    });
}

/* 名前を入れる（入れなくてもよい）。1行に1人で貼り付けることもできる */
function openNames(){
  const box = document.createElement('div');
  const N = S.meta.count;
  box.innerHTML = `
    <p class="mini" style="margin-top:0">名前は、この画面（名簿・見出し・一覧）と保存先の中だけで使います。
      <b>AIへのプロンプトには入れません</b>。メモに名前が入っていても「（名前）」に置きかえます。
      所見の文に名簿の名前が入ると、校正で「要修正」になります。</p>
    <details class="more" style="margin-bottom:10px"><summary>名簿からまとめて貼り付ける</summary>
      <p class="mini">1行に1人、出席番号の順に貼り付けて「入れる」を押します（Excelの名前の列をコピーして貼り付けられます）。</p>
      <textarea id="nm-paste" rows="5" placeholder="山田 花子&#10;佐藤 太郎&#10;…"></textarea>
      <div class="row" style="margin-top:6px"><button class="btn sm" id="nm-fill">入れる</button></div>
    </details>
    <div class="namegrid">${Array.from({ length:N }, (_, i) => i + 1).map(n =>
      `<label><span>${n}</span><input type="text" data-no="${n}" value="${esc(nameOf(n))}" maxlength="30"></label>`).join('')}</div>`;
  $('#nm-fill', box).onclick = () => {
    const lines = $('#nm-paste', box).value.split(/\r?\n/).map(x => x.replace(/^\s*\d+[\s.．、,，)）]*/, '').trim());
    lines.forEach((v, i) => { const el = $(`input[data-no="${i + 1}"]`, box); if(el && v) el.value = v; });
    toast(`${Math.min(lines.filter(Boolean).length, N)}人分を入れました。「保存」で決まります`);
  };
  dlg({ title:'名前（入れなくてもよい）', node:box, wide:true,
        buttons:[{ label:'キャンセル', value:false }, { label:'全部消す', value:'clear', kind:'danger' }, { label:'保存', value:true, kind:'primary' }] })
    .then(v => {
      if(!v) return;
      if(v === 'clear'){ S.names = {}; }
      else{
        const names = {};
        $$('input[data-no]', box).forEach(el => { const t = el.value.trim(); if(t) names[el.dataset.no] = t; });
        /* 人数より大きい番号の名前は残しておく */
        Object.keys(S.names || {}).forEach(k => { if(+k > N) names[k] = S.names[k]; });
        S.names = names;
      }
      save(); renderAll();
      toast(v === 'clear' ? '名前を消しました' : '名前を保存しました');
    });
}
/* 開いている小窓を閉じる */
function closeDialogs(){ $$('.dlgwrap').forEach(w => w.parentNode.removeChild(w)); }

async function applySettings(o){
  /* ローカル保存で年度・学年を変えたら、その学年のデータに切り替える */
  if(Store.kind === 'local' && (o.year !== S.meta.year || String(o.grade) !== String(S.meta.grade))){
    pump();
    const meta = { year:o.year, grade:String(o.grade) };
    let next = null;
    try{ next = await Store.load(meta); }catch(e){ next = null; }
    S = normalize(next || blankState(Object.assign({ count:o.count }, meta)));
    if(!next) S.write = o.write;
    if(!next) Object.assign(S.variety, { share:o.share, itemLimit:o.itemLimit });
    if(!next) S.checkUse = o.checkUse;
    cur = 1; renderAll(); save();
    toast(next ? `${o.year}年度 ${o.grade}年のデータに切り替えました` : `${o.year}年度 ${o.grade}年を新しく始めます`);
    return;
  }
  /* 人数を減らすとき、入力済みの番号があれば知らせる（データは消さない） */
  if(o.count < S.meta.count){
    const left = numsWithData(o.count + 1);
    if(left.length){
      const ok = await dlg({
        title:`人数を${o.count}人にします`,
        body:`<p style="margin-top:0"><b>${left.map(n=>n+'番').join('・')}</b> には、入力済みのメモや所見があります。</p>
          <p>人数を減らしても、<b>データは消えずに残ります</b>。人数を戻すと、また表示されます。<br>
          それまでは、名簿・一覧・書き出し・プロンプトには出てきません。</p>`,
        buttons:[{ label:'やめる', value:false }, { label:`${o.count}人にする`, value:true, kind:'primary' }]
      });
      if(!ok) return;
    }
  }
  S.meta.year = o.year; S.meta.grade = String(o.grade); S.meta.count = o.count;
  S.write = o.write;
  S.variety = Object.assign({}, S.variety, { share:o.share, itemLimit:o.itemLimit });
  S.checkUse = o.checkUse;
  if(cur > S.meta.count) cur = S.meta.count;
  renderAll(); save();
  toast('設定を変えました');
}

/* =========================================================================
   小物
   ========================================================================= */
/* 小窓。buttons の value が Promise の結果になる。背景を押すと最初のボタン（取り消し）扱い */
function dlg(opt){
  return new Promise(resolve => {
    const wrap = document.createElement('div'); wrap.className = 'dlgwrap';
    const box = document.createElement('div'); box.className = 'dlg' + (opt.wide ? ' wide' : '');
    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
    box.innerHTML = `<h3>${esc(opt.title || '')}</h3><div class="body"></div><div class="btns"></div>`;
    if(opt.node) $('.body', box).appendChild(opt.node); else $('.body', box).innerHTML = opt.body || '';
    const btns = opt.buttons || [{ label:'OK', value:true, kind:'primary' }];
    const close = v => { wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if(e.key === 'Escape') close(btns[0].value); };
    btns.forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.kind || '');
      el.textContent = b.label;
      el.onclick = () => close(b.value);
      $('.btns', box).appendChild(el);
    });
    wrap.onclick = e => { if(e.target === wrap) close(btns[0].value); };
    document.addEventListener('keydown', onKey);
    wrap.appendChild(box); document.body.appendChild(wrap);
    const last = $('.btns .btn:last-child', box); if(last) last.focus();
  });
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2000);
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
}
function download(name, text, mime){
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
}
function csvCell(s){ return '"' + String(s ?? '').replace(/"/g, '""') + '"'; }

/* =========================================================================
   起動
   ========================================================================= */
function boot(){
  E = window.ShokenEngine.create(R, CS);
  document.body.dataset.store = Store.kind;
  setSave('', '読み込み中…');
  const meta = { year:R.meta.year, grade:'3' };
  /* ローカルでは、前回開いた学年を覚えておく */
  if(Store.kind === 'local'){
    try{ const last = JSON.parse(localStorage.getItem(LS_PREFIX + 'last') || 'null'); if(last) Object.assign(meta, last); }catch(e){}
  }
  Store.load(meta).then(o => start(o, meta)).catch(e => {
    setSave('error', e.message);
    $('#main').innerHTML = `<section class="card"><h2>読み込めませんでした</h2><p>${esc(e.message)}</p>
      <button class="btn primary" onclick="location.reload()">もう一度読み込む</button></section>`;
  });
}

function start(o, meta){
  S = normalize(o || blankState(meta));
  Saver.at = null;
  setSave('', '準備完了');

  $$('nav.steps button[data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  $$('#term-seg button').forEach(b => b.onclick = () => {
    if(S.term === b.dataset.term) return;
    S.term = b.dataset.term; renderAll(); save();
  });
  $('#ctx-btn').onclick = openSettings;
  $('#btn-settings').onclick = openSettings;

  /* --- JSON 読込（ローカル保存のとき） --- */
  $('#file-json').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = async () => {
      try{
        const o2 = JSON.parse(fr.result);
        if(!o2.data || !o2.meta) throw new Error('形式が違います');
        const ok = await dlg({
          title:'JSONを読み込みます',
          body:`${esc(o2.meta.year)}年度 ${esc(o2.meta.grade)}年 のデータを読み込みます。同じ学年の、いまのデータは上書きされます。`,
          buttons:[{ label:'やめる', value:false }, { label:'読み込む', value:true, kind:'danger' }]
        });
        if(!ok) return;
        $$('.dlgwrap').forEach(w => w.remove());
        S = normalize(o2);
        S.rev = Store.peekRev(S.meta);
        cur = 1; renderAll(); save(); toast('読み込みました');
      }catch(err){ alert('読み込めませんでした：' + err.message); }
      e.target.value = '';
    };
    fr.readAsText(f);
  };

  /* 閉じる前・ほかのタブへ行く前に、まだ送っていない分を送る */
  document.addEventListener('visibilitychange', () => { if(document.hidden) pump(); });
  window.addEventListener('beforeunload', e => {
    if(Store.kind === 'local' && S){
      try{ localStorage.setItem(LS_PREFIX + 'last', JSON.stringify({ year:S.meta.year, grade:S.meta.grade })); }catch(err){}
    }
    if(Saver.dirty || Saver.busy){ pump(); e.preventDefault(); e.returnValue = ''; }
  });

  renderAll();
  if(!o) setTimeout(openSettings, 50);   // はじめて開いたときは設定から
}

if(R && window.ShokenEngine) boot(); else showRulesRecovery();
</script>
