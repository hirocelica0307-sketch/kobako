<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>所見メモ作成</title>
<style>
/* ===========================================================
   所見メモ作成アプリ
   - 児童の氏名は扱いません。出席番号のみで運用します。
   - 保存先は「このPCのブラウザ」か「Googleスプレッドシート」です。
   - AI（Claude）には、先生がコピーして貼り付けたときだけ、
     出席番号とメモが渡ります。このアプリが自分で送ることはありません。
   =========================================================== */
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#23211e; --muted:#6b665f; --faint:#9a948b;
  --line:#e3dfd7; --line2:#cfc8bd;
  --accent:#2f6f56; --accent-d:#245845; --accent-w:#e6f0ea;
  --err:#b23a2f; --err-w:#fbeceb;
  --warn:#8a6212; --warn-w:#fbf2df;
  --info:#3a5d84; --info-w:#e9f0f8;
  --part:#c9771c; --part-w:#fcefdc;
  --ok:#2f6f56;
  --r:10px;
  --shadow:0 1px 2px rgba(35,33,30,.05), 0 2px 8px rgba(35,33,30,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Kaku Gothic ProN",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14.5px; line-height:1.7;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none !important}
.mini{font-size:12.5px;color:var(--muted)}
.spacer{flex:1}
code{background:#f1eee8;border-radius:4px;padding:0 4px;font-size:.92em}

/* 保存先による出し分け。data-store は起動時に body に付く */
.sheet-only{display:none}
body[data-store="sheet"] .local-only{display:none !important}
body[data-store="sheet"] .sheet-only{display:revert}

/* ---- 上の帯（見出し＋手順） ---- */
.topbar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.appbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 18px 6px}
.brand{display:flex;flex-direction:column;line-height:1.3}
.brand b{font-size:17px;letter-spacing:.03em}
.brand small{font-size:11.5px;color:var(--muted)}
.ctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctxchip{border:1px solid var(--line2);background:#faf8f4;border-radius:999px;padding:4px 14px;font-weight:700}
.ctxchip:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 14px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.savechip{font-size:12.5px;color:var(--muted);border-radius:999px;padding:3px 12px;background:#f3f1ec;white-space:nowrap}
.savechip.saving{color:var(--info);background:var(--info-w)}
.savechip.saved{color:var(--accent);background:var(--accent-w)}
.savechip.error,.savechip.conflict{color:var(--err);background:var(--err-w);font-weight:700;cursor:pointer}

nav.steps{display:flex;align-items:stretch;gap:4px;padding:0 14px;overflow-x:auto}
nav.steps button{
  border:0;background:none;padding:8px 14px 9px;border-bottom:3px solid transparent;
  color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:14px
}
nav.steps button .no{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:#ece8e1;color:var(--muted);font-weight:700;font-size:12.5px
}
nav.steps button .badge{font-size:11.5px}
nav.steps button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
nav.steps button.on .no{background:var(--accent);color:#fff}
nav.steps .arrow{color:var(--faint);align-self:center;font-size:12px}
nav.steps button.sub{font-size:13px}
nav.steps .sep{width:1px;background:var(--line);margin:8px 6px}

main{padding:18px;max-width:1440px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card > h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card > h2 .step{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px}
.lead{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.notice{border-radius:8px;padding:9px 12px;font-size:13px;margin:0 0 12px;border-left:4px solid}
.notice.info{background:var(--info-w);border-color:var(--info)}
.notice.warn{background:var(--warn-w);border-color:var(--warn)}
.notice.ok{background:var(--accent-w);border-color:var(--accent)}

/* ---- ボタン ---- */
.btn{
  border:1px solid var(--line2); background:#fff; border-radius:8px;
  padding:6px 14px; white-space:nowrap; min-height:34px; display:inline-flex; align-items:center; gap:6px
}
.btn:hover{background:#f5f2ec}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{border-color:transparent;background:var(--accent-w);color:var(--accent)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger:hover{background:var(--err-w)}
.btn.sm{padding:2px 10px;font-size:12.5px;min-height:28px}
.btn.big{padding:9px 20px;font-size:15px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
label.inline{display:inline-flex;align-items:center;gap:6px}
select,input[type=text],input[type=number]{border:1px solid var(--line2);border-radius:7px;padding:5px 8px;background:#fff;min-height:34px}

/* ---- 名簿と本体の2段組 ---- */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.layout > *{min-width:0}
.side{position:sticky;top:112px}
.roster{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .roster{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:46px;overflow-x:auto;padding-bottom:4px}
}
/* スマホでは上の帯を固定しない（画面が狭くなりすぎるため） */
@media(max-width:700px){
  .topbar{position:static}
  th{top:0}
  main{padding:12px}
  .card{padding:14px}
}
.rbtn{
  border:1px solid var(--line2);background:#fff;border-radius:7px;height:38px;
  text-align:center;font-variant-numeric:tabular-nums;font-size:14px;position:relative;border-bottom-width:4px
}
.rbtn:hover{border-color:var(--accent)}
.rbtn.on{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
.rbtn.st-memo{border-bottom-color:var(--info)}
.rbtn.st-part{border-bottom-color:var(--part);background:var(--part-w)}
.rbtn.st-err{border-bottom-color:var(--err);background:var(--err-w)}
.rbtn.st-warn{border-bottom-color:var(--warn);background:#fffaf0}
.rbtn.st-ok{border-bottom-color:var(--ok);background:var(--accent-w)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle;background:var(--line2)}
.legend .memo i{background:var(--info)} .legend .part i{background:var(--part)}
.legend .err i{background:var(--err)} .legend .warn i{background:var(--warn)} .legend .ok i{background:var(--ok)}
.progress{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.bar{height:8px;border-radius:4px;background:#ece8e1;overflow:hidden;display:flex;margin:4px 0 6px}
.bar span{display:block;height:100%}
.counts{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:12.5px}
.counts b{font-variant-numeric:tabular-nums;text-align:right}

/* 子どもの見出し（番号と前後移動） */
.kid{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 12px}
.kid .num{font-size:22px;font-weight:700;letter-spacing:.02em}
.kid .num small{font-size:13px;font-weight:400;color:var(--muted);margin-right:4px}
.stbadge{font-size:12px;padding:2px 10px;border-radius:999px;font-weight:700;background:#efece6;color:var(--muted)}
.stbadge.memo{background:var(--info-w);color:var(--info)}
.stbadge.part{background:var(--part-w);color:var(--part)}
.stbadge.err{background:var(--err-w);color:var(--err)}
.stbadge.warn{background:var(--warn-w);color:var(--warn)}
.stbadge.ok{background:var(--accent-w);color:var(--accent)}

/* ---- メモ入力 ---- */
.memogroup{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin:16px 0 10px;padding-top:12px}
.memogroup:first-child{border-top:0;margin-top:0;padding-top:0}
.memogroup > b{font-size:14px;color:var(--accent)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:1px}
.field .hint{font-size:12px;color:var(--muted);margin-bottom:5px}
textarea{
  width:100%;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;
  resize:vertical;line-height:1.8;background:#fff
}
textarea:focus{outline:3px solid var(--accent-w);border-color:var(--accent)}
details.more{border:1px dashed var(--line2);border-radius:8px;padding:6px 12px;margin-top:6px}
details.more > summary{cursor:pointer;color:var(--muted);font-size:13px}
details.more[open] > summary{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{border:1px solid var(--line);background:#faf9f6;border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink)}
.chip:hover{background:var(--accent-w);border-color:var(--accent);color:var(--accent)}
.chipgroup{margin-bottom:8px}
.chipgroup > b{font-size:12px;color:var(--muted)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* ---- 下書き＋校正 ---- */
.draftbox{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;background:#fdfcfa}
.draftbox > .top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.draftbox > .top b{font-size:15px}
.count{font-variant-numeric:tabular-nums;font-size:12.5px;padding:1px 9px;border-radius:999px;background:#eee;color:var(--muted)}
.count.ok{background:var(--accent-w);color:var(--accent)}
.count.ng{background:var(--err-w);color:var(--err)}
.memoref{background:#f6f4ef;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.memoref summary{cursor:pointer;color:var(--muted)}
.memoref div{margin-top:4px}
.preview{
  border:1px dashed var(--line2);border-radius:8px;padding:9px 12px;margin-top:8px;
  background:#fff;line-height:2;min-height:2.4em;white-space:pre-wrap;word-break:break-all
}
mark{padding:1px 0;border-radius:2px;background:none}
mark.error{background:var(--err-w);box-shadow:0 2px 0 var(--err)}
mark.warn{background:var(--warn-w);box-shadow:0 2px 0 var(--warn)}
mark.info{background:var(--info-w);box-shadow:0 2px 0 var(--info)}
.issues{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.issue{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 9px;border-radius:6px;border-left:3px solid}
.issue.error{background:var(--err-w);border-color:var(--err)}
.issue.warn{background:var(--warn-w);border-color:var(--warn)}
.issue.info{background:var(--info-w);border-color:var(--info)}
.issue .tag{font-weight:700;white-space:nowrap;font-size:11.5px;padding-top:1px;min-width:4em}
.issue .fix{margin-left:auto}
.noissue{font-size:13px;color:var(--accent);background:var(--accent-w);padding:6px 10px;border-radius:6px;margin-top:8px}

/* ---- 案の選択 ---- */
.cands{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.candhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.candhead .mini{flex:1;min-width:220px}
.cand{
  display:flex;gap:9px;text-align:left;width:100%;position:relative;
  border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 36px 8px 11px;line-height:1.6
}
.cand:hover{background:#faf9f6}
.cand.on{border-color:var(--accent);background:var(--accent-w);box-shadow:inset 0 0 0 1px var(--accent)}
.cand .pick{color:var(--accent);font-size:13px;padding-top:2px}
.cand .cbody{flex:1;min-width:0}
.cand .chead{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.cand.on .chead{color:var(--accent)}
.cand .ctext{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--ink)}
.cand.on .ctext{-webkit-line-clamp:5}
.canddel{
  position:absolute;top:6px;right:6px;width:24px;height:24px;line-height:1;
  border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--muted);font-size:14px;padding:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer
}
.canddel:hover{background:var(--err-w);border-color:var(--err);color:var(--err)}
.candnote{font-size:13px;background:var(--info-w);border-left:3px solid var(--info);border-radius:6px;padding:6px 10px;margin-bottom:8px}
.candnote b{margin-right:6px}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:700}
.badge.error{background:var(--err-w);color:var(--err)}
.badge.warn{background:var(--warn-w);color:var(--warn)}
.badge.ok{background:var(--accent-w);color:var(--accent)}
.badge.none{background:#eee;color:var(--muted)}

/* ---- AIで案を作る ---- */
.aigrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.aigrid{grid-template-columns:1fr}}
.opts{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin-bottom:12px}
.opts > span{font-size:13px;color:var(--muted);text-align:right}
pre.prompt{
  background:#fbfaf7;border:1px solid var(--line);border-radius:8px;padding:12px;
  white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;margin:10px 0 0;
  font-family:"Consolas","BIZ UDGothic",monospace;font-size:12px;line-height:1.65
}
.chunks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chunks button{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:4px 12px;font-size:13px}
.chunks button.on{border-color:var(--accent);background:var(--accent-w);color:var(--accent);font-weight:700}
.chunks button.done::after{content:" ✓";color:var(--accent)}

/* ---- 仕上げ（一覧） ---- */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sumbox{border:1px solid var(--line);border-radius:8px;padding:6px 14px;min-width:92px;background:#fff;text-align:left}
.sumbox b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.sumbox span{font-size:12px;color:var(--muted)}
.sumbox.err b{color:var(--err)} .sumbox.warn b{color:var(--warn)} .sumbox.ok b{color:var(--accent)}
.sumbox.on{outline:2px solid var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:top;text-align:left}
th{background:#faf8f4;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;position:sticky;top:112px}
td.no{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;width:52px;font-weight:700}
td.len{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;width:60px}
td.st{white-space:nowrap;width:86px}
td .issues{margin-top:6px}
td .issue{font-size:12px;padding:3px 8px}
tr.rowlink:hover td{background:#fbfaf7}

/* ---- ルール ---- */
.rulegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:4px 14px;font-size:13px}
.rulegrid div{padding:1px 0;border-bottom:1px dotted var(--line)}
.rulegrid s{color:var(--muted)}
ul.plain{margin:0;padding-left:1.2em}
ul.plain li{margin-bottom:3px}

/* ---- 小窓・お知らせ ---- */
.dlgwrap{position:fixed;inset:0;background:rgba(35,33,30,.38);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.dlg{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.dlg h3{margin:0 0 10px;font-size:16px}
.dlg .body{font-size:14px}
.dlg .btns{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:18px}
.dlg .kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.dlg .kv > span{color:var(--muted);font-size:13px}
.typechecks{display:flex;flex-direction:column;gap:4px}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:9px 20px;border-radius:999px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:120
}
.toast.on{opacity:1}

@media print{
  .topbar,.noprint,.side,.dlgwrap,.toast{display:none !important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{border:0;padding:0;box-shadow:none}
  th{position:static}
  th,td{border:1px solid #999}
  td .issues{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <header class="appbar">
    <div class="brand">
      <b>所見メモ作成</b>
      <small id="storeinfo">氏名は扱いません</small>
    </div>
    <div class="ctx">
      <button class="ctxchip" id="ctx-btn" title="年度・学年・人数・今回書く種類を変える"></button>
      <div class="seg" id="term-seg" role="tablist" aria-label="学期">
        <button data-term="1">1学期</button><button data-term="2">2学期</button><button data-term="3">3学期</button>
      </div>
    </div>
    <span class="spacer"></span>
    <span class="savechip" id="savestate">—</span>
    <button class="btn sm" id="btn-settings">設定</button>
  </header>
  <nav class="steps" aria-label="作業の手順">
    <button data-tab="memo"><span class="no">1</span>メモを書く<span class="badge" data-badge="memo"></span></button>
    <span class="arrow">›</span>
    <button data-tab="ai"><span class="no">2</span>AIで案を作る</button>
    <span class="arrow">›</span>
    <button data-tab="pick"><span class="no">3</span>案を選ぶ・直す<span class="badge" data-badge="pick"></span></button>
    <span class="arrow">›</span>
    <button data-tab="finish"><span class="no">4</span>仕上げ・書き出し<span class="badge" data-badge="finish"></span></button>
    <span class="spacer"></span>
    <span class="sep"></span>
    <button data-tab="stock" class="sub">記録メモ帳</button>
    <button data-tab="rules" class="sub">ルール</button>
  </nav>
</div>

<main id="main"></main>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="file-json" accept=".json" class="hide">

<script>
/* rules/course-of-study.js を埋め込んだもの */
/* ==========================================================================
   小学校学習指導要領（平成29年告示）── 所見を書くための抜き出し
   --------------------------------------------------------------------------
   所見の表現・語句・表記は、すべてここに書かれた指導事項をもとに決めます。
   メモに出てくる教科をアプリが見つけ、その教科・その学年段階の指導事項だけを
   Claude に渡します。Claude はここにある言い方の中から、その子の姿にいちばん

<script>
/* engine.js を埋め込んだもの */
/* ==========================================================================
   所見メモ作成 ─ 校正エンジン
   --------------------------------------------------------------------------
   画面（index.html）とテスト（tests/*.test.js）の両方から使う、画面に依存しない部分。
     ・字数の数え方と範囲
     ・校正（checkText）とハイライト
     ・クラス内の似ている所見さがし
     ・Claude の出力の読み取り
   ルールは rules/shoken-rules.js、学習指導要領は rules/course-of-study.js にあります。

   使い方：  const E = ShokenEngine.create(window.SHOKEN_RULES, window.COURSE_OF_STUDY);
   ========================================================================== */
(function (root) {
  'use strict';

  /* 「 」の中身を伏せるときに使う文字（どのルールにも当たらない私用領域の文字） */
  var MASK = '';

  function create(R, CS) {
    var reCache = new Map();

    function reOf(src) {
      if (reCache.has(src)) { var c = reCache.get(src); c.lastIndex = 0; return c; }
      var re = null;
      try { re = new RegExp(src, 'g'); } catch (e) { re = null; }  // 後読み未対応ブラウザ向けの保険
      reCache.set(src, re);
      return re;
    }
    function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function scan(text, pattern, make) {
      var re = reOf(pattern);
      if (!re) return [];
      re.lastIndex = 0;
      var out = [], m, guard = 0;
      while ((m = re.exec(text)) && guard++ < 500) {
        if (m[0] === '') { re.lastIndex++; continue; }
        out.push(Object.assign({ index: m.index, length: m[0].length, hit: m[0] }, make(m)));
      }
      return out;
    }

    /* ---------- 字数 ---------- */
    function countChars(t) { return Array.from((t || '').replace(/\r?\n/g, '').trim()).length; }
    function lenRange(typeKey) {
      var t = R.types[typeKey];
      var tol = t.tolerance != null ? t.tolerance : 0.12;
      return {
        min: (typeof t.min === 'number') ? t.min : Math.round(t.target * (1 - tol)),
        max: (typeof t.max === 'number') ? t.max : Math.round(t.target * (1 + tol)),
        target: t.target
      };
    }

    /* ---------- 「 」の中を伏せる ----------
       長さは変えないので、伏せた文で見つけた位置はそのまま元の文の位置になる。
       かっこ自体は残す。入れ子（「…『…』…」）にも対応する。 */
    function maskQuotes(text) {
      var Q = R.quote || { open: '「『', close: '」』' };
      var out = '', depth = 0;
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        if (Q.open.indexOf(ch) >= 0) { depth++; out += ch; continue; }
        if (Q.close.indexOf(ch) >= 0 && depth > 0) { depth--; out += ch; continue; }
        out += depth > 0 ? MASK : ch;
      }
      return out;
    }
    function skipInQuote(kind) {
      var s = (R.quote && R.quote.skip) || [];
      return s.indexOf(kind) >= 0;
    }

    /* ---------- 学年段階 ---------- */
    function stageOf(grade) { return CS ? (CS.stageOf[String(grade)] || '中') : '中'; }

    /* ======================================================================
       校正
       1つの指摘 = {level, kind, msg, ng, ok, index, length, hit, fixable}
       ctx = { stage:'低'|'中'|'高', others:[{label, text}] }
       ====================================================================== */
    function checkText(text, typeKey, ctx) {
      ctx = ctx || {};
      var issues = [];
      if (!text || !text.trim()) return issues;
      var masked = maskQuotes(text);
      var src = function (kind) { return skipInQuote(kind) ? masked : text; };

      /* --- 字数 --- */
      var n = countChars(text), rg = lenRange(typeKey);
      if (n > rg.max) issues.push({ level: 'error', kind: '字数', msg: n + '字です。' + R.types[typeKey].label + 'は' + rg.target + '字程度（' + rg.min + '〜' + rg.max + '字）に収めます。' });
      else if (n < rg.min) issues.push({ level: 'warn', kind: '字数', msg: n + '字です。' + rg.target + '字程度（' + rg.min + '〜' + rg.max + '字）まで書き足します。' });

      /* --- 個人情報：氏名らしい表記（かっこの中も見る） --- */
      var pv = R.privacy;
      scan(text, pv.honorific.re, function (m) { return { level: 'error', kind: '個人情報', msg: pv.honorific.msg, ng: m[0], ok: '（削る）' }; })
        .filter(function (i) {
          /* 「〜さん」の部分が許可語（たくさん・お父さん など）で終わっていれば OK */
          var end = i.index + i.length;
          return !pv.honorific.allow.some(function (a) {
            return end - a.length >= 0 && text.slice(end - a.length, end) === a;
          });
        })
        .forEach(function (i) { issues.push(i); });

      /* --- 個人情報：知らないカタカナ語（固有名詞の疑い） --- */
      scan(src('katakana'), '[ァ-ヴー]{2,}', function (m) {
        return { level: 'info', kind: '固有名詞', msg: '固有名詞（人名・大会名・商品名など）ではありませんか。所見には書きません。', ng: m[0], ok: '（一般的な言葉に）' };
      })
        .filter(function (i) { return !pv.katakanaAllow.some(function (w) { return w.indexOf(i.hit) >= 0 || i.hit.indexOf(w) >= 0; }); })
        .forEach(function (i) { issues.push(i); });

      /* --- 性格の記述 --- */
      R.personality.words.forEach(function (w) {
        scan(src('personality'), escRe(w), function () { return { level: R.personality.level, kind: '性格', msg: R.personality.msg, ng: w, ok: '（行動の事実で書く）' }; })
          .forEach(function (i) { issues.push(i); });
      });

      /* --- 曖昧・主観表現 --- */
      R.vague.forEach(function (v) {
        scan(src('vague'), v.re || escRe(v.ng), function () {
          return { level: v.level || 'warn', kind: '表現', msg: v.msg || ('「' + v.ng + '」は避けます。'), ng: v.ng, ok: v.ok };
        }).forEach(function (i) { issues.push(i); });
      });

      /* --- 教科名の「科」 --- */
      R.subjects.checks.forEach(function (c) {
        scan(src('subject'), c.re || escRe(c.ng), function () {
          return { level: c.level, kind: '教科名', msg: '教科名は「〜〜科」と表します。', ng: c.ng, ok: c.ok };
        }).forEach(function (i) { issues.push(i); });
      });

      /* --- 表記ルール --- */
      R.hyoki.forEach(function (h) {
        scan(src('hyoki'), h.re || escRe(h.ng), function () {
          return { level: h.level || 'warn', kind: '表記',
            msg: h.note ? ('「' + h.ok + '」と書きます。' + h.note) : ('「' + h.ok + '」と書きます。'),
            ng: h.ng, ok: h.ok };
        }).forEach(function (i) { issues.push(i); });
      });

      /* --- 文末（現在形 → 過去形） --- */
      for (var p = 0; p < R.sentenceEnd.patterns.length; p++) {
        var pat = R.sentenceEnd.patterns[p];
        var hits = scan(src('sentenceEnd'), escRe(pat.re), function () {
          return { level: R.sentenceEnd.level, kind: '文末', msg: R.sentenceEnd.msg, ng: pat.re, ok: pat.ok };
        });
        if (hits.length) { hits.forEach(function (i) { issues.push(i); }); break; }  // 最も具体的な1種だけ出す
      }

      /* --- 句読点・書式 --- */
      R.format.forEach(function (f) {
        scan(text, f.re, function (m) {
          return { level: f.level, kind: '書式', msg: f.msg, ng: m[0] === '　' ? '全角スペース' : (m[0].trim() || '先頭の空白'), ok: '' };
        }).forEach(function (i) { issues.push(i); });
      });

      /* --- 数字表記 --- */
      R.numberFormat.rules.forEach(function (f) {
        scan(text, f.re, function (m) { return { level: f.level, kind: '数字', msg: f.msg, ng: m[0], ok: '' }; })
          .forEach(function (i) { issues.push(i); });
      });

      /* --- 構成：教科の所見1つ＋教科以外1つ／順序 --- */
      if (typeKey === 'shoken') {
        var has = function (w) { return masked.indexOf(w) >= 0; };
        /* 「体育」のように「科」が抜けている場合も、教科の記述はあるものとして数える
           （「科」を付ける指摘は教科名チェックが別に出しているので、二重に言わない） */
        var subjNames = R.subjects.list.concat(R.subjects.checks.filter(function (c) { return c.level === 'error'; }).map(function (c) { return c.ng; }));
        var hasSubject = subjNames.some(has);
        var outWords = ['掃除', '給食', '当番', '係', '委員会', 'クラブ', '休憩時間', '運動会', '学習発表会',
          'あいさつ', '整とん', '友達', '行事', '遠足', '宿泊', '集会', '片付け', 'なわとび', '班'];
        var hasOut = outWords.some(has);
        if (!hasSubject) issues.push({ level: 'warn', kind: '構成', msg: '教科に関する所見が見あたりません。教科名（〜〜科）を挙げて1つ書きます。' });
        if (!hasOut) issues.push({ level: 'warn', kind: '構成', msg: '教科以外（生活・行事など）の所見が見あたりません。原則として1つ書きます。' });

        if (hasSubject && hasOut && R.structure) {
          var firstOf = function (words) {
            return words.map(function (w) { return masked.indexOf(w); })
              .filter(function (i) { return i >= 0; })
              .reduce(function (a, b) { return Math.min(a, b); }, Infinity);
          };
          var iSubject = firstOf(subjNames);
          var iLife = firstOf(R.structure.lifeWords);
          if (iSubject !== Infinity && iLife !== Infinity && iLife < iSubject) {
            issues.push({ level: R.structure.level, kind: '順序', msg: R.structure.msg, index: iLife, length: 1 });
          }
        }
      }

      /* --- 道徳所見の型（2文構成・2文目は「特に「内容項目」の学習では、」） --- */
      if (typeKey === 'doutoku' && R.doutokuFormat) {
        var DF = R.doutokuFormat;
        var at = text.indexOf('特に「');
        if (at < 0) {
          issues.push({ level: 'error', kind: '道徳の型',
            msg: '2文目は「特に「内容項目」の学習では、」で始めます。この形が無いと要録に使えません。' });
        } else {
          var mm = text.slice(at).match(/^特に「([^」]{1,24})」の学習/);
          if (!mm) {
            issues.push({ level: 'error', kind: '道徳の型', index: at, length: 3,
              msg: '「特に「内容項目」の学習では、」の形にします。（例：特に「規則の尊重」の学習では、）' });
          } else {
            var st = ctx.stage || '中';
            var list = DF.contentItems[st] || DF.contentItems['中'];
            /* 「友情・信頼」のような中黒表記も、正式名称に照らして拾う。
               「自由と責任」のように、正式名称の一部（、で区切られた語）でもよい */
            var norm = function (s) { return s.replace(/[・､、\s]/g, ''); };
            var name = norm(mm[1]);
            var ok = list.some(function (x) {
              if (norm(x) === name || norm(x).indexOf(name) === 0) return true;
              return x.split('、').some(function (part) { return norm(part) === name; });
            });
            if (!ok) {
              issues.push({ level: 'warn', kind: '内容項目', index: at + 3, length: mm[1].length,
                ng: mm[1], ok: '（学習指導要領の内容項目名）',
                msg: '学習指導要領の内容項目名と一致しません。' + (CS ? CS.stageLabel[st] : '') + 'で使えるのは：' +
                  list.slice(0, 8).join('／') + ' など。' });
            }
          }
          /* 1文目が無い（いきなり「特に」で始まる） */
          if (at === 0) issues.push({ level: 'error', kind: '道徳の型', msg: '1文目（道徳全体の評価）がありません。2文で書きます。' });
        }
        /* 文の数は、かっこの中の「。」を数えない */
        var sentences = masked.split('。').filter(function (s) { return s.trim(); }).length;
        if (sentences > 2) issues.push({ level: 'warn', kind: '道徳の型', msg: sentences + '文あります。道徳所見は2文で書きます。' });
      }

      /* --- 他の学期と同じ教科になっていないか --- */
      if (typeKey === 'shoken' && ctx.others && ctx.others.length) {
        var mine = R.subjects.list.filter(function (s) { return masked.indexOf(s) >= 0; });
        ctx.others.forEach(function (o) {
          var same = mine.filter(function (s) { return o.text.indexOf(s) >= 0; });
          if (same.length) issues.push({ level: 'error', kind: '同一教科',
            msg: o.label + 'の所見と同じ教科（' + same.join('・') + '）です。学期ごとに違う教科にします。' });
        });
      }

      /* 「直す」ボタンを出せるか。
         置き換え先が1つに定まり、見つかった文字が ng そのもののときだけ。
         （「正確に／分かりやすく」のような選択肢や「（削る）」は先生が判断する） */
      issues.forEach(function (i) {
        i.fixable = !!(i.ng && i.ok && i.index != null && i.hit === i.ng && !/[（(／\/〜～]/.test(i.ok));
      });

      /* 重複した指摘を1つにまとめ、重い順に並べる */
      var seen = new Set(), uniq = [];
      var order = { error: 0, warn: 1, info: 2 };
      issues.sort(function (a, b) {
        return (order[a.level] - order[b.level]) || ((a.index != null ? a.index : 1e9) - (b.index != null ? b.index : 1e9));
      });
      issues.forEach(function (i) {
        var k = i.kind + '|' + (i.ng || '') + '|' + i.msg;
        if (seen.has(k)) return;
        seen.add(k); uniq.push(i);
      });
      return uniq;
    }

    /* 同じ文を何度も校正しないように覚えておく（入力のたびに全員分を数えるため） */
    var memo = new Map();
    function checkCached(text, typeKey, ctx) {
      ctx = ctx || {};
      var key = typeKey + '\u0001' + (ctx.stage || '') + '\u0001' +
        (ctx.others || []).map(function (o) { return o.label + '\u0002' + o.text; }).join('\u0003') + '\u0001' + text;
      var hit = memo.get(key);
      if (hit) return hit;
      var res = checkText(text, typeKey, ctx);
      if (memo.size > 4000) memo.clear();
      memo.set(key, res);
      return res;
    }

    function worst(issues) {
      if (issues.some(function (i) { return i.level === 'error'; })) return 'error';
      if (issues.some(function (i) { return i.level === 'warn'; })) return 'warn';
      return 'ok';
    }

    /* ---------- ハイライト表示 ---------- */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function highlight(text, issues) {
      var spans = issues.filter(function (i) { return i.index != null; })
        .map(function (i) { return { s: i.index, e: i.index + i.length, lv: i.level }; })
        .sort(function (a, b) { return a.s - b.s || b.e - a.e; });
      var kept = [], end = -1;
      spans.forEach(function (sp) { if (sp.s >= end) { kept.push(sp); end = sp.e; } });
      var out = '', p = 0;
      kept.forEach(function (sp) {
        out += esc(text.slice(p, sp.s)) + '<mark class="' + sp.lv + '">' + esc(text.slice(sp.s, sp.e)) + '</mark>';
        p = sp.e;
      });
      return out + esc(text.slice(p));
    }

    /* ---------- クラス内の重複 ---------- */
    function bigrams(t) {
      var s = (t || '').replace(/[、。「」\s]/g, '');
      var g = new Set();
      for (var i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2));
      return g;
    }
    function jaccard(a, b) {
      if (!a.size || !b.size) return 0;
      var inter = 0;
      a.forEach(function (x) { if (b.has(x)) inter++; });
      return inter / (a.size + b.size - inter);
    }
    /* list = [{no, text}] */
    function findDuplicates(list) {
      var g = list.filter(function (x) { return (x.text || '').trim(); })
        .map(function (x) { return { no: x.no, g: bigrams(x.text) }; });
      var out = [];
      for (var i = 0; i < g.length; i++) for (var j = i + 1; j < g.length; j++) {
        var sim = jaccard(g[i].g, g[j].g);
        if (sim >= R.duplication.warnThreshold) out.push({ a: g[i].no, b: g[j].no, sim: sim });
      }
      return out.sort(function (x, y) { return y.sim - x.sim; });
    }

    /* ======================================================================
       Claude の出力の読み取り
         児童の区切り  #12 / ＃12 / 【12】（見出しだけの行）
         案の区切り    1) 2) … / 案1 / [案1] / 1．
         工夫した点    ※ で始まる行
       案の区切りが1つも無ければ、その児童の本文全体を1案として扱う。
       ====================================================================== */
    var RE_HEAD_HASH = /^\s*(?:[#＃]+|【|\[)\s*(\d{1,2})\s*(?:番)?\s*(?:】|\])?\s*[:：.．]?\s*$/;
    var RE_HEAD_BARE = /^\s*(\d{1,2})\s*番?\s*[:：.．]?\s*$/;
    var RE_CAND = /^\s*(?:\[?\s*案\s*)?([1-5１-５])\s*(?:案)?\s*[).）．.:：\]、]\s*(.*)$/;
    var RE_NOTE = /^\s*[※＊*]\s*(.+)$/;

    function splitCandidates(block) {
      var out = [], cur = null, sawMarker = false;
      block.forEach(function (ln) {
        var mc = ln.match(RE_CAND);
        if (mc) { sawMarker = true; cur = { text: (mc[2] || '').trim(), note: '' }; out.push(cur); return; }
        var mn = ln.match(RE_NOTE);
        if (mn) { if (cur) cur.note = (cur.note ? cur.note + ' ' : '') + mn[1].trim(); return; }
        if (cur) cur.text += ln.trim();
        else if (!sawMarker && ln.trim()) { cur = { text: ln.trim(), note: '' }; out.push(cur); }
      });
      return out.filter(function (c) { return c.text.trim(); })
        .map(function (c) { return { text: c.text.trim(), note: c.note.trim() }; });
    }

    /* 戻り値 { blocks: {番号: [{text, note}, …]}, order: [番号…] } */
    function parsePasted(raw) {
      var lines = String(raw || '').replace(/\r/g, '').split('\n');
      /* #付きの見出しが1つでもあれば、裸の数字は本文の一部として扱う（案の番号と紛れないため） */
      var hasHash = lines.some(function (l) { return RE_HEAD_HASH.test(l); });
      var raws = {}, order = [], curNo = null, buf = [];
      var flush = function () {
        if (curNo != null && buf.length) raws[curNo] = (raws[curNo] || []).concat(buf);
        buf = [];
      };
      lines.forEach(function (ln) {
        var m = ln.match(RE_HEAD_HASH);
        if (!m && !hasHash) m = ln.match(RE_HEAD_BARE);
        if (m) { flush(); curNo = +m[1]; if (order.indexOf(curNo) < 0) order.push(curNo); return; }
        if (curNo != null) buf.push(ln);
      });
      flush();
      var blocks = {};
      order.forEach(function (no) {
        var list = splitCandidates(raws[no] || []);
        if (list.length) blocks[no] = list;
      });
      return { blocks: blocks, order: order.filter(function (no) { return blocks[no]; }) };
    }

    return {
      MASK: MASK,
      countChars: countChars, lenRange: lenRange, stageOf: stageOf,
      maskQuotes: maskQuotes, checkText: checkText, checkCached: checkCached, worst: worst,
      highlight: highlight, esc: esc,
      bigrams: bigrams, jaccard: jaccard, findDuplicates: findDuplicates,
      splitCandidates: splitCandidates, parsePasted: parsePasted
    };
  }

  var api = { create: create };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.ShokenEngine = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================================
   状態
   -------------------------------------------------------------------------
   氏名フィールドは意図的に持ちません。個人が特定できる情報をこのアプリに
   入れない運用のため、後から「便利だから」と追加しないでください。
   氏名と番号の対応は、先生の手元の名簿で行います。
   ========================================================================= */
let R = window.SHOKEN_RULES;
const CS = window.COURSE_OF_STUDY || null;
let E = null;

let S = null;          // いま開いている学年のデータ
let cur = 1;           // 選択中の出席番号
let view = 'memo';     // 表示中の画面
let lastField = null;  // 入力補助の挿入先 {key, el}

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ルールファイルが読めなかったときの復旧画面。
   置き場所を直すのが本筋だが、それでも読めない環境のために手で選べるようにしておく。 */
function showRulesRecovery(){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:#f4f2ee;z-index:999;padding:48px;overflow:auto';
  d.innerHTML =
    '<h2 style="margin-top:0;font-size:18px">ルールファイルが読み込めませんでした</h2>'+
    '<p><code>index.html</code> と <code>rules</code> フォルダ、<code>engine.js</code> は、必ず同じ場所に一緒に置いてください。</p>'+
    '<p>置き場所が正しいのにこの画面が出るときは、下のボタンから <code>rules/shoken-rules.js</code> を選んでください。</p>'+
    '<p><input type="file" accept=".js"></p>'+
    '<p class="mini">選んだファイルはこの PC の中だけで読み込まれます。どこにも送信しません。</p>';
  document.body.appendChild(d);
  d.querySelector('input').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        (0,eval)(fr.result);
        if(!window.SHOKEN_RULES) throw new Error('ルールの入っていないファイルです');
        R = window.SHOKEN_RULES; d.remove(); boot();
      }catch(err){ alert('読み込めませんでした：'+err.message); }
    };
    fr.readAsText(f);
  };
}

/* =========================================================================
   保存
   -------------------------------------------------------------------------
   保存先は2通り。同じ画面がどちらでもそのまま動きます。
     local … このPCのブラウザの中（index.html をダブルクリックで開いたとき）
     sheet … Googleスプレッドシート（GASのWebアプリとして開いたとき）

   どちらも「保存番号（rev）」を持ちます。保存するときは、読み込んだときの
   保存番号を添えて送り、ほかの端末・タブが先に保存していたら上書きしません。
   また、送るのは常に1件だけです（前の保存が終わるまで次は送らない）。
   これで「古い内容があとから届いて新しい内容を消す」ことが起きません。
   ========================================================================= */
const inGAS = typeof google !== 'undefined' && google.script && google.script.run;
const LS_PREFIX = 'shoken.v1.';
function projectKey(m){ return LS_PREFIX + `${m.year}-${m.grade}`; }

function gasCall(fn, ...args){
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

const Store = {
  kind: inGAS ? 'sheet' : 'local',

  /* meta は local のときだけ使う（スプレッドシートは1つで1学年） */
  load(meta){
    if(inGAS) return gasCall('getState').then(o => (o && o.data) ? o : null);
    try{
      const raw = localStorage.getItem(projectKey(meta));
      const o = raw ? JSON.parse(raw) : null;
      if(o) o.meta = Object.assign(o.meta || {}, meta);
      return Promise.resolve(o);
    }catch(e){ return Promise.reject(e); }
  },

  /* 戻り値 Promise<{ok, rev} | {conflict, rev}> */
  save(state, baseRev, force){
    if(inGAS) return gasCall('putState', state, baseRev, !!force);
    try{
      const key = projectKey(state.meta);
      const raw = localStorage.getItem(key);
      const curRev = raw ? (JSON.parse(raw).rev || 0) : 0;
      if(!force && curRev !== (baseRev || 0)) return Promise.resolve({ conflict:true, rev:curRev });
      const next = curRev + 1;
      localStorage.setItem(key, JSON.stringify(Object.assign({}, state, { rev: next })));
      return Promise.resolve({ ok:true, rev:next });
    }catch(e){ return Promise.reject(e); }
  },

  peekRev(meta){
    if(inGAS) return 0;
    try{ const raw = localStorage.getItem(projectKey(meta)); return raw ? (JSON.parse(raw).rev || 0) : 0; }
    catch(e){ return 0; }
  }
};

const Saver = { busy:false, dirty:false, blocked:false, failed:false, timer:null, at:null };

function setSave(kind, msg){
  const el = $('#savestate');
  el.className = 'savechip ' + kind;
  el.onclick = null;
  el.title = '';
  if(kind === 'saving') el.textContent = '保存中…';
  else if(kind === 'typing') el.textContent = '入力中…';
  else if(kind === 'saved'){
    const d = Saver.at || new Date();
    el.textContent = '保存済み ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  else if(kind === 'error'){
    el.textContent = '保存できませんでした（押すと再試行）';
    el.title = msg || '';
    el.onclick = ()=>{ Saver.dirty = true; Saver.failed = false; pump(); };
  }
  else if(kind === 'conflict'){
    el.textContent = 'ほかの画面で更新されています';
    el.onclick = showConflict;
  }
  else el.textContent = msg || '—';
}

/* すぐ保存する（ボタン操作のあとなど） */
function save(){
  if(!S) return;
  Saver.dirty = true;
  clearTimeout(Saver.timer);
  pump();
}
/* 入力中は少し待ってからまとめて保存する */
function saveSoon(){
  if(!S) return;
  Saver.dirty = true;
  clearTimeout(Saver.timer);
  Saver.timer = setTimeout(pump, inGAS ? 1200 : 400);
  if(!Saver.busy && !Saver.blocked) setSave('typing');
}
function pump(){
  clearTimeout(Saver.timer);
  if(!S || Saver.busy || Saver.blocked || !Saver.dirty) return;
  Saver.dirty = false;
  Saver.busy = true;
  setSave('saving');
  Store.save(S, S.rev || 0, false).then(res => {
    Saver.busy = false;
    if(res && res.conflict){
      Saver.blocked = true; Saver.dirty = true;
      setSave('conflict');
      showConflict();
      return;
    }
    S.rev = res.rev; Saver.failed = false; Saver.at = new Date();
    if(Saver.dirty) pump(); else setSave('saved');
  }).catch(err => {
    Saver.busy = false; Saver.dirty = true; Saver.failed = true;
    setSave('error', err && err.message);
  });
}

/* ほかの端末・タブが先に保存していたとき */
function showConflict(){
  dlg({
    title:'ほかの画面で、先に保存されています',
    body:`<p style="margin-top:0">このデータは、ほかの端末か、このブラウザのほかのタブで保存されています。
      このまま保存すると、向こうで入力した内容が消えてしまうため、保存を止めています。</p>
      <p>どちらかを選んでください。</p>
      <ul class="plain">
        <li><b>向こうの内容を読み込む</b> … この画面でまだ保存していない変更は消えます。</li>
        <li><b>この画面の内容で上書きする</b> … 向こうで入力した内容が消えます。</li>
      </ul>`,
    buttons:[
      { label:'あとで決める', value:null },
      { label:'この画面の内容で上書きする', value:'mine', kind:'danger' },
      { label:'向こうの内容を読み込む', value:'theirs', kind:'primary' }
    ]
  }).then(v => {
    if(v === 'theirs'){
      Store.load(S.meta).then(o => {
        if(o){ S = normalize(o); }
        Saver.blocked = false; Saver.dirty = false;
        Saver.at = new Date(); setSave('saved');
        renderAll(); toast('読み込み直しました');
      }).catch(e => alert('読み込めませんでした：' + e.message));
    }else if(v === 'mine'){
      Saver.busy = true; setSave('saving');
      Store.save(S, S.rev || 0, true).then(res => {
        Saver.busy = false; Saver.blocked = false; Saver.dirty = false;
        S.rev = res.rev; Saver.at = new Date(); setSave('saved'); toast('この画面の内容で保存しました');
      }).catch(err => { Saver.busy = false; setSave('error', err.message); });
    }
  });
}

/* =========================================================================
   データの形
   ========================================================================= */
function defaultWrite(grade){
  const g = String(grade), out = {};
  ['1','2','3'].forEach(t => {
    const d = (R.defaultWrite && R.defaultWrite[g] && R.defaultWrite[g][t]) || ['shoken'];
    out[t] = d.slice();
  });
  return out;
}
function blankState(meta){
  const m = Object.assign({ year:R.meta.year, grade:'3', count:32 }, meta || {});
  return { version:2, rev:0, meta:m, term:'2', write:defaultWrite(m.grade),
           data:{ "1":{}, "2":{}, "3":{} }, stock:{ "1":'', "2":'', "3":'' } };
}
function normalize(o){
  o.version = 2;
  o.rev = o.rev || 0;
  o.meta = Object.assign({ year:R.meta.year, grade:'3', count:32 }, o.meta || {});
  o.meta.count = Math.min(45, Math.max(1, +o.meta.count || 32));
  o.term = o.term || '2';
  o.data = Object.assign({ "1":{}, "2":{}, "3":{} }, o.data || {});
  o.stock = Object.assign({ "1":'', "2":'', "3":'' }, o.stock || {});
  if(!o.write || typeof o.write !== 'object') o.write = defaultWrite(o.meta.grade);
  ['1','2','3'].forEach(t => { if(!Array.isArray(o.write[t])) o.write[t] = defaultWrite(o.meta.grade)[t]; });
  return o;
}

/* 1人分の記録
     memos  … 先生が書いたメモ
     cands  … Claude が作った案（種別ごとに最大5つ）[{text, note}, …]
     pick   … 採用中の案の番号（種別ごと）
     drafts … 採用中の本文。校正・一覧・書き出しはすべてこれを見る。 */
function rec(term, no){
  const t = S.data[term] || (S.data[term] = {});
  const r = t[no] || (t[no] = { memos:{}, drafts:{}, done:{} });
  if(!r.cands) r.cands = {};
  if(!r.pick)  r.pick  = {};
  if(!r.memos) r.memos = {};
  if(!r.drafts) r.drafts = {};
  return r;
}
/* 読むだけ（記録を作らない） */
function peek(term, no){ return (S.data[term] || {})[no] || null; }
function draftOf(no, k, term){ const r = peek(term || S.term, no); return ((r && r.drafts && r.drafts[k]) || '').trim(); }
function candsOf(no, k, term){ const r = peek(term || S.term, no); return (r && r.cands && r.cands[k]) || []; }
function pickOf(no, k, term){
  const r = peek(term || S.term, no);
  const i = r && r.pick ? r.pick[k] : undefined;
  return (typeof i === 'number' && candsOf(no, k, term)[i]) ? i : 0;
}
function setCands(no, k, list){
  const r = rec(S.term, no);
  r.cands[k] = list; r.pick[k] = 0;
  r.drafts[k] = list.length ? list[0].text : '';
}
function addCands(no, k, list){
  const r = rec(S.term, no);
  r.cands[k] = (r.cands[k] || []).concat(list);
  if(typeof r.pick[k] !== 'number') r.pick[k] = 0;
  if(!(r.drafts[k] || '').trim() && r.cands[k][r.pick[k]]) r.drafts[k] = r.cands[k][r.pick[k]].text;
}
function pickCand(no, k, i){
  const r = rec(S.term, no), list = r.cands[k] || [];
  if(!list[i]) return;
  r.pick[k] = i; r.drafts[k] = list[i].text;
}
/* 本文を手で直したとき。採用中の案にも書き戻す（案を選び直しても直しが残る） */
function editDraft(no, k, text){
  const r = rec(S.term, no), list = r.cands[k] || [];
  r.drafts[k] = text;
  const i = pickOf(no, k);
  if(list[i]) list[i].text = text;
}
function hasData(r){
  if(!r) return false;
  const any = o => o && Object.values(o).some(v => Array.isArray(v) ? v.length : String(v || '').trim());
  return any(r.memos) || any(r.drafts) || any(r.cands);
}

/* =========================================================================
   学期・種類・学年段階
   ========================================================================= */
/* 今回書く種類（設定で選んだもの）。進み具合はこれだけで数える */
function activeTypes(term){
  const t = term || S.term;
  const can = (R.termMatrix[S.meta.grade] || {})[t] || R.allTypes;
  const w = (S.write && S.write[t]) || defaultWrite(S.meta.grade)[t];
  return R.allTypes.filter(k => can.includes(k) && w.includes(k) && R.types[k]);
}
function stageNow(){ return E.stageOf(S.meta.grade); }

/* 他の学期で使った教科を調べる。avoid が渡されればその学期だけ、無ければ現在学期以外すべて。 */
function otherTerms(no, typeKey, avoid){
  if(typeKey !== 'shoken') return [];
  const out = [];
  ['1','2','3'].forEach(t => {
    if(t === S.term) return;
    if(avoid && avoid.indexOf(t) < 0) return;
    const txt = draftOf(no, 'shoken', t);
    if(txt) out.push({ term:t, label:t+'学期', text:txt });
  });
  return out;
}
function ctxFor(no, k){ return { stage: stageNow(), others: otherTerms(no, k) }; }
function check(text, k, no){ return E.checkCached(text, k, ctxFor(no, k)); }

/* =========================================================================
   進み具合
     none 未入力 / memo メモだけ / part 書きかけ（今回書く種類のうち、まだ無いものがある）
     err 要修正 / warn 注意あり / ok 完成
   ========================================================================= */
const ST = {
  none:{ label:'未入力' }, memo:{ label:'メモあり' }, part:{ label:'書きかけ' },
  err:{ label:'要修正' }, warn:{ label:'注意あり' }, ok:{ label:'完成' }
};
function statusOf(no){
  const r = peek(S.term, no);
  if(!r) return 'none';
  const types = activeTypes();
  const hasMemo = Object.values(r.memos || {}).some(v => (v || '').trim());
  const drafted = types.filter(k => draftOf(no, k));
  if(!drafted.length) return hasMemo ? 'memo' : 'none';
  let lv = 'ok';
  for(const k of drafted){
    const w = E.worst(check(draftOf(no, k), k, no));
    if(w === 'error') return 'err';
    if(w === 'warn') lv = 'warn';
  }
  if(drafted.length < types.length) return 'part';
  return lv;
}
function tally(){

      c.onclick = () => {

let AI = { type:null, scope:'all', size:10, avoid1:true, avoid2:true, chunks:[], at:0, copied:{}, importType:null, info:'' };

function memoBlock(no, typeKey){
  const r = peek(S.term, no); if(!r) return '';
  const keys = (typeKey && R.memoFor && R.memoFor[typeKey]) ? R.memoFor[typeKey] : R.memoFields.map(f => f.key);
  return R.memoFields
    .filter(f => keys.indexOf(f.key) >= 0 && ((r.memos || {})[f.key] || '').trim())
    .map(f => `【${f.label}】${r.memos[f.key].trim().replace(/\s*\n\s*/g,' ')}`)
    .join('\n');
}
function targetNums(typeKey, scope){
  const nums = [];
  for(let n = 1; n <= S.meta.count; n++){
    if(scope === 'one' && n !== cur) continue;
    if(!memoBlock(n, typeKey)) continue;
    if(scope === 'todo' && draftOf(n, typeKey)) continue;
    nums.push(n);
  }
  return nums;
}

/* メモ本文から教科を推定する。当たった語の数が多い順。 */
function detectSubjects(text, typeKey){
  if(!CS || !text) return [];
  const stage = stageNow();
  const hits = [];
  Object.entries(CS.subjects).forEach(([key, sub]) => {
    if(sub.stages && sub.stages.indexOf(stage) < 0) return;
    if(!sub.areas || !sub.areas[stage]) return;
    let n = 0; const words = [];
    (sub.match || []).forEach(w => { if(text.indexOf(w) >= 0){ n++; words.push(w); } });
    const topics = Object.keys(sub.topics || {}).filter(kw => text.indexOf(kw) >= 0);
    if(n || topics.length) hits.push({ key, sub, n:n + topics.length, words, topics });
  });
  hits.sort((a, b) => b.n - a.n);
  const force = { doutoku:'doutoku', sogo:'sougou', gaikokugo:'gaikokugo' }[typeKey];
  if(force && CS.subjects[force] && !hits.some(h => h.key === force)){
    const sub = CS.subjects[force];
    if(sub.areas && sub.areas[stage]) hits.unshift({ key:force, sub, n:99, words:[], topics:[] });
    else{
      const near = ['中','高','低'].find(st => sub.areas && sub.areas[st]);
      if(near) hits.unshift({ key:force, sub, n:99, words:[], topics:[], useStage:near, ref:true });
    }
  }
  const top = hits.slice(0, 4);
  /* 所見は「教科1つ＋教科以外1つ」なので、特別活動は常に入れる */
  if(typeKey === 'shoken' && CS.subjects.tokkatsu && !top.some(h => h.key === 'tokkatsu') && CS.subjects.tokkatsu.areas[stage]){
    top.push({ key:'tokkatsu', sub:CS.subjects.tokkatsu, n:0, words:[], topics:[] });
  }
  return top;
}

function courseBlock(subjectHits){
  if(!CS || !subjectHits.length) return [];
  const stage = stageNow(), sl = CS.stageLabel[stage];
  const L = [];
  L.push('# 学習指導要領（この所見に関わる部分）');
  L.push(`${CS.meta.title}　${sl}（${stage}学年）`);
  L.push('所見の表現・語句は、下の指導事項をもとに選んでください。');
  L.push('「使える言い方」から、その子の姿にいちばん合うものを選び、具体的な事実と組み合わせます。');
  L.push('ただし、指導事項の用語をそのまま並べず、保護者が読んで分かる文にしてください。');
  L.push('');
  subjectHits.forEach(h => {
    const st = h.useStage || stage;
    L.push(`## ${h.sub.label}（${CS.stageLabel[st]}）`);
    if(h.ref) L.push('※ この学年段階には学習指導要領上の定めがありません。いちばん近い段階の指導事項を参考として示します。学年に合わせて言い方をやさしくしてください。');
    if(h.sub.aim) L.push(`目標：${h.sub.aim}`);
    if(h.sub.evaluation) h.sub.evaluation.forEach(e => L.push(`※ ${e}`));
    (h.sub.areas[st] || []).forEach(it => {
      L.push(`- 〈${it.cite}〉${it.t}`);
      if(it.w && it.w.length) L.push(`  使える言い方：${it.w.join('／')}`);
    });
    (h.topics || []).forEach(kw => L.push(`▲ 「${kw}」について：${h.sub.topics[kw]}`));
    L.push('');
  });
  L.push('## 表記の決め方');
  (CS.notation.principle || []).forEach(p => L.push('- ' + p));
  if((CS.notation.softening || []).length){
    L.push('- 学習指導要領の用語は、そのままだと硬いので次のように言いかえてよい：');
    CS.notation.softening.forEach(s => L.push(`  「${s.term}」→「${s.plain}」`));
  }
  L.push('');
  return L;
}

  L.push('# 数字・記号');
  L.push('- ' + R.numberFormat.note);
  L.push('- 読点は「、」。感嘆符・疑問符・三点リーダは使わない。文頭は1マス空けない。');
  L.push('');
  L.push('# 避ける表現 → 言い換え');
  R.vague.filter(v => v.level !== 'info').forEach(v => L.push(`- ${v.ng} → ${v.ok}`));
  L.push('');
  L.push('# 表記（左の表記を必ず使う）');
  L.push('この一覧は学習指導要領および学年別漢字配当表に準拠したものです。必ずこのとおりに書いてください。');
  L.push(R.hyoki.filter(h => h.level !== 'info' && !/^（/.test(h.ok)).map(h => `${h.ok}（×${h.ng}）`).join('、'));
  L.push('一覧に無い語は、学習指導要領の本文で使われている表記に合わせてください。');
  L.push('');
  L.push('# 教科名');
  L.push('必ず「科」を付ける：' + R.subjects.list.join('、'));
  L.push('');
  L.push('# 書き方のお手本');
  R.examples.forEach(e => { L.push(`× ${e.bad}`); L.push(`○ ${e.good}`); L.push(''); });
  L.push('# 児童ごとのメモ');
  L.push('（番号だけで管理しています。氏名はありません。）');
  L.push('');
  nums.forEach(n => {
    L.push(`## #${n}`);
    L.push(memoBlock(n, typeKey));
    otherTerms(n, typeKey, opt.avoidTerms).forEach(o => {
      const used = R.subjects.list.filter(s => o.text.indexOf(s) >= 0);
      if(used.length) L.push(`※ ${o.label}は「${used.join('・')}」で書いたので、今回は違う教科で書く。`);
    });
    L.push('');
  });
  L.push('---');
  L.push(`上のメモをもとに、#${nums.join('、#')} の${t.label}を、1人につき${NC}案ずつ、指定の出力形式で書いてください。`);
  return L.join('\n');
}

function typeOptions(sel){
  return activeTypes().map(k => `<option value="${k}" ${k===sel?'selected':''}>${esc(R.types[k].label)}（${R.types[k].target}字程度）</option>`).join('');
}

        </select>

      <h2><span class="step">B</span>返ってきた文を貼り付けて取り込む</h2>
      <p class="lead">Claude の返事をそのまま貼り付けて「取り込む」を押すと、番号ごとに振り分けて、案として保存します。<br>

      <div class="opts"><span>種類</span><select id="i-type">${typeOptions(AI.importType)}</select></div>
      <textarea id="pastearea" rows="14" placeholder="#1&#10;1) 国語科「ごんぎつね」の学習では、…&#10;※ …&#10;2) …&#10;&#10;#2&#10;…"></textarea>
      <div class="row" style="margin-top:8px">

  $('#p-scope').value = AI.scope;

  $('#p-type').onchange = e => { AI.type = e.target.value; AI.importType = AI.type; $('#i-type').value = AI.type; AI.chunks = []; drawChunks(); };
  $('#p-scope').onchange = e => { AI.scope = e.target.value; AI.chunks = []; drawChunks(); };

    if(!nums.length){ drawChunks('対象になる児童がいません。先に「1 メモを書く」でメモを入れてください。'); return; }
    const avoidTerms = [];
    if(AI.avoid1 && S.term !== '1') avoidTerms.push('1');
    if(AI.avoid2 && S.term !== '2') avoidTerms.push('2');
    for(let i = 0; i < nums.length; i += AI.size){
      const part = nums.slice(i, i + AI.size);
      AI.chunks.push({ nums:part, text:buildPrompt(AI.type, part, { avoidTerms }) });
    }
    drawChunks();
  };
  $('#btn-copy').onclick = async () => {
    const c = AI.chunks[AI.at]; if(!c) return;
    await copyText(c.text);
    AI.copied[AI.at] = true; drawChunks();
    toast(AI.chunks.length > 1 ? `#${c.nums[0]}〜#${c.nums[c.nums.length-1]} をコピーしました` : 'コピーしました');

  $('#btn-parse').onclick = doImport;
  $('#btn-clearpaste').onclick = () => { $('#pastearea').value = ''; AI.info = ''; $('#i-info').innerHTML = ''; };
  drawChunks();
}
function drawChunks(msg){
  const out = $('#promptout'), box = $('#chunks'), info = $('#p-info'), copy = $('#btn-copy');
  if(!out) return;
  box.innerHTML = '';
  if(!AI.chunks.length){
    out.textContent = msg || '（「プロンプトを作る」を押してください）';
    info.textContent = ''; copy.disabled = true; return;
  }
  if(AI.chunks.length > 1){
    AI.chunks.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = (i === AI.at ? 'on ' : '') + (AI.copied[i] ? 'done' : '');
      b.textContent = `${i+1}回目 #${c.nums[0]}〜#${c.nums[c.nums.length-1]}`;
      b.onclick = () => { AI.at = i; drawChunks(); };
      box.appendChild(b);
    });
  }
  const c = AI.chunks[AI.at];
  out.textContent = c.text;
  copy.disabled = false;
  const total = AI.chunks.reduce((a, x) => a + x.nums.length, 0);
  info.textContent = AI.chunks.length > 1
    ? `${total}人を${AI.chunks.length}回に分けました（この回：${c.nums.length}人・約${c.text.length}字）`
    : `${c.nums.length}人分・約${c.text.length}字`;
}

function doImport(){
  const raw = $('#pastearea').value;
  if(!raw.trim()) return toast('貼り付け欄が空です');
  const k = AI.importType;
  const res = E.parsePasted(raw);
  const nos = res.order.filter(n => n >= 1 && n <= S.meta.count);
  const skipped = res.order.filter(n => !(n >= 1 && n <= S.meta.count));
  if(!nos.length){
    AI.info = '<div class="notice warn">「#番号」の行が見つかりませんでした。返ってきた文の形を確かめてください。</div>';
    $('#i-info').innerHTML = AI.info; return;
  }
  const already = nos.filter(n => draftOf(n, k));
  const apply = mode => {
    let cands = 0, applied = 0;
    nos.forEach(n => {
      if(mode === 'skip' && draftOf(n, k)) return;
      const list = res.blocks[n];
      if(mode === 'add' && draftOf(n, k)) addCands(n, k, list); else setCands(n, k, list);
      cands += list.length; applied++;
    });
    save();
    AI.info = `<div class="notice ok">${R.types[k].label}：${applied}人分・計${cands}案を取り込みました。` +
      (skipped.length ? `（名簿にない番号 ${skipped.join('・')} は除きました）` : '') +
      `<div style="margin-top:8px"><button class="btn primary sm" id="go-pick">3 案を選ぶ・直す へ ›</button></div></div>`;
    $('#i-info').innerHTML = AI.info;
    $('#go-pick').onclick = () => { cur = nos[0]; showTab('pick'); };
    renderSteps();
    toast(`${applied}人分・${cands}案を取り込みました`);
  };
  if(!already.length) return apply('replace');
  dlg({
    title:'すでに本文がある児童がいます',
    body:`<p style="margin-top:0">${already.map(n=>'#'+n).join('・')} には、すでに「${esc(R.types[k].label)}」の本文があります（手で直した文かもしれません）。</p>
      <ul class="plain">
        <li><b>新しい案を後ろに足す</b> … いまの本文はそのまま。新しい案は「案を選ぶ」で選べます。</li>
        <li><b>この子たちは取り込まない</b> … 本文がまだ無い子だけ取り込みます。</li>
        <li><b>置き換える</b> … いまの案と本文を消して、新しい案にします。</li>
      </ul>`,
    buttons:[
      { label:'やめる', value:null },
      { label:'置き換える', value:'replace', kind:'danger' },
      { label:'この子たちは取り込まない', value:'skip' },
      { label:'新しい案を後ろに足す', value:'add', kind:'primary' }
    ]
  }).then(v => { if(v) apply(v); });
}

function noTypesCard(){
  return `<section class="card"><h2>この学期に書く種類が選ばれていません</h2>
    <p class="lead">「設定」で、${S.term}学期に書く種類（所見・道徳所見など）を選んでください。</p>
    <button class="btn primary" id="open-settings">設定を開く</button></section>`;
}
function wireNoTypes(root){ const b = $('#open-settings', root); if(b) b.onclick = openSettings; }

function viewPick(root){
  const types = activeTypes();
  const wrap = document.createElement('div'); wrap.className = 'layout';
  wrap.appendChild(rosterCard());
  const card = document.createElement('section'); card.className = 'card';
  card.innerHTML = kidHeader(`${S.meta.grade}年 ${S.term}学期`) + '<div id="drafts"></div>';

function draftBox(k){
  const t = R.types[k], rg = E.lenRange(k);
  const d = document.createElement('div'); d.className = 'draftbox';
  const top = document.createElement('div'); top.className = 'top';
  top.innerHTML = `<b>${esc(t.label)}</b><span class="mini">${rg.target}字程度（${rg.min}〜${rg.max}字）</span>
    <span class="count" data-c></span><span class="badge" data-lv></span>`;
  d.appendChild(top);

  /* その子のメモ（この種類に使う欄だけ） */
  const mb = memoBlock(cur, k);
  const ref = document.createElement('details'); ref.className = 'memoref';
  ref.innerHTML = mb
    ? `<summary>メモを見る</summary>${mb.split('\n').map(l => `<div>${esc(l)}</div>`).join('')}`
    : `<summary>メモがありません</summary><div>「1 メモを書く」で入れると、案づくりに使えます。</div>`;
  d.appendChild(ref);

  const cl = document.createElement('div'); cl.className = 'cands'; d.appendChild(cl);
  const note = document.createElement('div'); note.className = 'candnote'; d.appendChild(note);
  const ta = document.createElement('textarea');
  ta.rows = 4; ta.value = draftOf(cur, k);
  ta.placeholder = '案を選ぶか、ここに直接書いてください。' + (t.note ? '（' + t.note + '）' : '');
  ta.setAttribute('aria-label', t.label + 'の本文');
  d.appendChild(ta);
  const pv = document.createElement('div'); pv.className = 'preview'; d.appendChild(pv);
  const iss = document.createElement('div'); iss.className = 'issues'; d.appendChild(iss);

  const renderCands = () => {
    const list = candsOf(cur, k), sel = pickOf(cur, k);
    cl.innerHTML = ''; note.innerHTML = '';
    if(list.length < 2){ cl.classList.add('hide'); note.classList.add('hide'); return; }
    cl.classList.remove('hide'); note.classList.remove('hide');
    const head = document.createElement('div'); head.className = 'candhead';
    head.innerHTML = `<span class="mini">Claude が作った${list.length}つの案です。使うものを選んでください。選ばなかった案も残ります。</span>`;
    const delAll = document.createElement('button');
    delAll.className = 'btn sm danger'; delAll.textContent = 'この子の案を全部削除';
    delAll.onclick = () => dlg({
      title:'案を全部削除します',
      body:`出席番号 ${cur} の「${esc(t.label)}」の案を ${list.length}件すべて削除し、本文も空にします。元に戻せません。`,
      buttons:[{ label:'やめる', value:false }, { label:'削除する', value:true, kind:'danger' }]
    }).then(ok => {
      if(!ok) return;
      const rr = rec(S.term, cur);
      delete rr.cands[k]; delete rr.pick[k]; rr.drafts[k] = '';
      save(); renderCands(); ta.value = ''; refresh(); refreshKid(cur); toast('案を削除しました');
    });
    head.appendChild(delAll);
    cl.appendChild(head);

    list.forEach((c, i) => {
      const n = E.countChars(c.text);
      const lv = E.worst(check(c.text, k, cur));
      const row = document.createElement('button');
      row.className = 'cand' + (i === sel ? ' on' : '');
      row.setAttribute('aria-pressed', i === sel ? 'true' : 'false');
      row.innerHTML =
        `<span class="pick">${i === sel ? '●' : '○'}</span>` +
        `<span class="cbody"><span class="chead">案${i+1}` +
        `<span class="count ${n>=rg.min&&n<=rg.max?'ok':'ng'}">${n}字</span>` +
        `<span class="badge ${lv==='error'?'error':lv==='warn'?'warn':'ok'}">${lv==='error'?'要修正':lv==='warn'?'注意':'OK'}</span></span>` +
        `<span class="ctext">${esc(c.text)}</span></span>`;
      row.onclick = () => {
        pickCand(cur, k, i);
        ta.value = draftOf(cur, k);
        save(); renderCands(); refresh(); refreshKid(cur);
      };
      const del = document.createElement('span');
      del.className = 'canddel'; del.title = `案${i+1}を削除`; del.textContent = '×'; del.setAttribute('role', 'button');
      del.onclick = e => {
        e.stopPropagation();
        dlg({
          title:`案${i+1}を削除します`,
          body:`<p style="margin-top:0">出席番号 ${cur} の「${esc(t.label)}」の案${i+1}を削除します。元に戻せません。</p><div class="preview">${esc(c.text)}</div>`,
          buttons:[{ label:'やめる', value:false }, { label:'削除する', value:true, kind:'danger' }]
        }).then(ok => {
          if(!ok) return;
          const rr = rec(S.term, cur), l = rr.cands[k];
          const wasSel = pickOf(cur, k);
          l.splice(i, 1);
          if(!l.length){ delete rr.cands[k]; delete rr.pick[k]; rr.drafts[k] = ''; }
          else{
            const ns = Math.min(wasSel > i ? wasSel - 1 : (wasSel === i ? 0 : wasSel), l.length - 1);
            rr.pick[k] = ns; rr.drafts[k] = l[ns].text;
          }
          ta.value = draftOf(cur, k);
          save(); renderCands(); refresh(); refreshKid(cur);
          toast(`案${i+1}を削除しました`);
        });
      };
      row.appendChild(del);
      cl.appendChild(row);
    });
    const cn = list[sel] && list[sel].note;
    note.innerHTML = cn ? `<b>この案の工夫</b> ${esc(cn)}` : '';
    if(!cn) note.classList.add('hide');
  };

  const refresh = () => {
    const text = ta.value;
    const n = E.countChars(text);
    const cEl = $('[data-c]', top), lvEl = $('[data-lv]', top);
    cEl.textContent = n + '字';
    cEl.className = 'count ' + (!text.trim() ? '' : (n >= rg.min && n <= rg.max ? 'ok' : 'ng'));
    const issues = check(text, k, cur);
    const lv = text.trim() ? E.worst(issues) : 'none';
    lvEl.className = 'badge ' + (lv === 'error' ? 'error' : lv);
    lvEl.textContent = { error:'要修正', warn:'注意', ok:'OK', none:'未作成' }[lv];
    pv.innerHTML = text.trim() ? E.highlight(text, issues) : '<span class="mini">（ここに校正結果が色付きで出ます）</span>';
    iss.innerHTML = '';
    if(text.trim() && !issues.length){
      iss.innerHTML = '<div class="noissue">ルール上の問題は見つかりませんでした。内容が事実と合っているか、最後にご自身で確かめてください。</div>';
    }
    issues.forEach(i => {
      const e = document.createElement('div'); e.className = 'issue ' + i.level;
      e.innerHTML = `<span class="tag">${esc(i.kind)}</span><span>${esc(i.msg)}${
        i.ng && i.ok ? ` <s style="color:var(--muted)">${esc(i.ng)}</s> → <b>${esc(i.ok)}</b>` : ''}</span>`;
      if(i.fixable){
        const fx = document.createElement('button'); fx.className = 'btn sm fix'; fx.textContent = '直す';
        fx.onclick = () => {
          ta.value = ta.value.slice(0, i.index) + i.ok + ta.value.slice(i.index + i.length);
          editDraft(cur, k, ta.value); save(); refresh(); renderCands(); refreshKid(cur);
        };
        e.appendChild(fx);
      }
      iss.appendChild(e);
    });
  };
  ta.addEventListener('input', () => { editDraft(cur, k, ta.value); saveSoon(); refresh(); refreshKid(cur); });
  ta.addEventListener('blur', renderCands);
  renderCands(); refresh();
  return d;
}

let FIN = { type:null, filter:'all' };

  </section>

  <section class="card">
    <h2 id="list-title">${esc(S.meta.year)}年度 ${esc(S.meta.grade)}年 ${S.term}学期 ／ ${esc(R.types[k].label)}</h2>
    <table>
      <thead><tr><th>番号</th><th>本文と校正</th><th>字数</th><th>判定</th><th class="noprint"></th></tr></thead>
      <tbody id="listbody"></tbody>
    </table>
    ${shown.length ? '' : '<p class="mini">該当する児童はいません。</p>'}
  </section>

  <section class="card noprint">
    <h2>クラス内で表現が似ている組み合わせ</h2>
    <div id="dupresult" class="mini"></div>
  </section>`;

  const tb = $('#listbody');
  shown.forEach(r => {
    const tr = document.createElement('tr'); tr.className = 'rowlink';
    const list = candsOf(r.n, k);
    const which = list.length > 1 ? `<div class="mini">案${pickOf(r.n, k)+1}/${list.length}</div>` : '';
    const badge = r.lv === 'none' ? '<span class="badge none">未作成</span>'
      : r.lv === 'error' ? '<span class="badge error">要修正</span>'
      : r.lv === 'warn' ? '<span class="badge warn">注意</span>' : '<span class="badge ok">OK</span>';
    const issues = r.issues.filter(i => i.level !== 'info').map(i =>
      `<div class="issue ${i.level}"><span class="tag">${esc(i.kind)}</span><span>${esc(i.msg)}${
        i.ng && i.ok ? ` <s style="color:var(--muted)">${esc(i.ng)}</s> → <b>${esc(i.ok)}</b>` : ''}</span></div>`).join('');
    tr.innerHTML = `<td class="no">${r.n}</td>
      <td>${r.text ? E.highlight(r.text, r.issues) : '<span class="mini">（まだありません）</span>'}${issues ? `<div class="issues">${issues}</div>` : ''}</td>
      <td class="len">${r.text ? E.countChars(r.text) : ''}</td>
      <td class="st">${badge}${which}</td>
      <td class="noprint"><button class="btn sm ghost" data-open="${r.n}">${r.text ? '直す ›' : '書く ›'}</button></td>`;
    tb.appendChild(tr);
  });
  $$('[data-open]', root).forEach(b => b.onclick = () => { cur = +b.dataset.open; showTab(b.textContent.indexOf('書く') >= 0 && !memoBlock(cur, k) ? 'memo' : 'pick'); });
  $$('[data-f]', root).forEach(b => b.onclick = () => { FIN.filter = FIN.filter === b.dataset.f ? 'all' : b.dataset.f; renderView(); });
  $('#l-type').onchange = e => { FIN.type = e.target.value; renderView(); };

  const dv = $('#dupresult');
  if(!dups.length) dv.textContent = '似すぎている組み合わせはありません。';
  else{
    dv.innerHTML = dups.map(d => {
      const lv = d.sim >= R.duplication.errorThreshold ? 'error' : 'warn';
      const na = candsOf(d.a, k).length, nb = candsOf(d.b, k).length;
      const hint = (na > 1 || nb > 1) ? `　どちらかを別の案に変えると直せます（#${d.a}：${na}案／#${d.b}：${nb}案）。` : '';
      return `<div class="issue ${lv}"><span class="tag">#${d.a} と #${d.b}</span>
        <span>${Math.round(d.sim*100)}% 一致。${esc(R.duplication.msg)}${hint}</span>
        <button class="btn sm fix" data-dup="${d.a}">#${d.a}を開く</button></div>`;
    }).join('');
    $$('[data-dup]', dv).forEach(b => b.onclick = () => { cur = +b.dataset.dup; showTab('pick'); });
  }

  const exportRows = () => {
    const out = [];
    for(let n = 1; n <= S.meta.count; n++){ const t = draftOf(n, k); out.push([n, t, t ? E.countChars(t) : '']); }
    return out;
  };
  $('#btn-csv').onclick = () => {
    const rows2 = [['出席番号', R.types[k].label, '字数']].concat(exportRows());
    const csv = '﻿' + rows2.map(r => r.map(csvCell).join(',')).join('\r\n');
    download(`所見_${S.meta.year}_${S.meta.grade}年_${S.term}学期_${R.types[k].label}.csv`, csv, 'text/csv;charset=utf-8');
  };
  $('#btn-txt').onclick = () => {
    let out = `${S.meta.year} ${S.meta.grade}年 ${S.term}学期 ${R.types[k].label}\n\n`;
    exportRows().forEach(([n, t, len]) => { out += `#${n}（${len || 0}字）\n${t || '（未作成）'}\n\n`; });
    download(`所見_${S.meta.grade}年_${S.term}学期_${R.types[k].label}.txt`, out);
  };
  $('#btn-sheet').onclick = () => {
    const b = $('#btn-sheet'); b.disabled = true; toast('書き出しています…');
    gasCall('exportToSheet', `${S.term}学期_${R.types[k].label}`, R.types[k].label, exportRows())
      .then(name => { b.disabled = false; toast(`シート「${name}」に書き出しました`); })
      .catch(e => { b.disabled = false; alert('書き出せませんでした：' + e.message); });
  };
  $('#btn-print').onclick = () => {
    if(FIN.filter !== 'all'){ FIN.filter = 'all'; renderView(); }
    setTimeout(() => window.print(), 50);
  };
}

async function applySettings(o){
  /* ローカル保存で年度・学年を変えたら、その学年のデータに切り替える */
  if(Store.kind === 'local' && (o.year !== S.meta.year || String(o.grade) !== String(S.meta.grade))){
    pump();
    const meta = { year:o.year, grade:String(o.grade) };
    let next = null;
    try{ next = await Store.load(meta); }catch(e){ next = null; }
    S = normalize(next || blankState(Object.assign({ count:o.count }, meta)));
    if(!next) S.write = o.write;
    cur = 1; renderAll(); save();
    toast(next ? `${o.year}年度 ${o.grade}年のデータに切り替えました` : `${o.year}年度 ${o.grade}年を新しく始めます`);
    return;
  }
  /* 人数を減らすとき、入力済みの番号があれば知らせる（データは消さない） */
  if(o.count < S.meta.count){
    const left = numsWithData(o.count + 1);
    if(left.length){
      const ok = await dlg({
        title:`人数を${o.count}人にします`,
        body:`<p style="margin-top:0"><b>${left.map(n=>n+'番').join('・')}</b> には、入力済みのメモや所見があります。</p>
          <p>人数を減らしても、<b>データは消えずに残ります</b>。人数を戻すと、また表示されます。<br>
          それまでは、名簿・一覧・書き出し・プロンプトには出てきません。</p>`,
        buttons:[{ label:'やめる', value:false }, { label:`${o.count}人にする`, value:true, kind:'primary' }]
      });
      if(!ok) return;
    }
  }
  S.meta.year = o.year; S.meta.grade = String(o.grade); S.meta.count = o.count;
  S.write = o.write;
  if(cur > S.meta.count) cur = S.meta.count;
  renderAll(); save();
  toast('設定を変えました');
}

/* 小窓。buttons の value が Promise の結果になる。背景を押すと最初のボタン（取り消し）扱い */
function dlg(opt){
  return new Promise(resolve => {
    const wrap = document.createElement('div'); wrap.className = 'dlgwrap';
    const box = document.createElement('div'); box.className = 'dlg';
    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
    box.innerHTML = `<h3>${esc(opt.title || '')}</h3><div class="body"></div><div class="btns"></div>`;
    if(opt.node) $('.body', box).appendChild(opt.node); else $('.body', box).innerHTML = opt.body || '';
    const btns = opt.buttons || [{ label:'OK', value:true, kind:'primary' }];
    const close = v => { wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if(e.key === 'Escape') close(btns[0].value); };
    btns.forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.kind || '');
      el.textContent = b.label;
      el.onclick = () => close(b.value);
      $('.btns', box).appendChild(el);
    });
    wrap.onclick = e => { if(e.target === wrap) close(btns[0].value); };
    document.addEventListener('keydown', onKey);
    wrap.appendChild(box); document.body.appendChild(wrap);
    const last = $('.btns .btn:last-child', box); if(last) last.focus();
  });
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2000);
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
}
function download(name, text, mime){
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
}
function csvCell(s){ return '"' + String(s ?? '').replace(/"/g, '""') + '"'; }

/* =========================================================================
   起動
   ========================================================================= */
function boot(){
  E = window.ShokenEngine.create(R, CS);
  document.body.dataset.store = Store.kind;
  setSave('', '読み込み中…');
  const meta = { year:R.meta.year, grade:'3' };
  /* ローカルでは、前回開いた学年を覚えておく */
  if(Store.kind === 'local'){
    try{ const last = JSON.parse(localStorage.getItem(LS_PREFIX + 'last') || 'null'); if(last) Object.assign(meta, last); }catch(e){}
  }
  Store.load(meta).then(o => start(o, meta)).catch(e => {
    setSave('error', e.message);
    $('#main').innerHTML = `<section class="card"><h2>読み込めませんでした</h2><p>${esc(e.message)}</p>
      <button class="btn primary" onclick="location.reload()">もう一度読み込む</button></section>`;
  });
}

function start(o, meta){
  S = normalize(o || blankState(meta));
  Saver.at = null;
  setSave('', '準備完了');

  $$('nav.steps button[data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  $$('#term-seg button').forEach(b => b.onclick = () => {
    if(S.term === b.dataset.term) return;
    S.term = b.dataset.term; renderAll(); save();
  });
  $('#ctx-btn').onclick = openSettings;
  $('#btn-settings').onclick = openSettings;

  /* --- JSON 読込（ローカル保存のとき） --- */
  $('#file-json').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = async () => {
      try{
        const o2 = JSON.parse(fr.result);
        if(!o2.data || !o2.meta) throw new Error('形式が違います');
        const ok = await dlg({
          title:'JSONを読み込みます',
          body:`${esc(o2.meta.year)}年度 ${esc(o2.meta.grade)}年 のデータを読み込みます。同じ学年の、いまのデータは上書きされます。`,
          buttons:[{ label:'やめる', value:false }, { label:'読み込む', value:true, kind:'danger' }]
        });
        if(!ok) return;
        $$('.dlgwrap').forEach(w => w.remove());
        S = normalize(o2);
        S.rev = Store.peekRev(S.meta);
        cur = 1; renderAll(); save(); toast('読み込みました');
      }catch(err){ alert('読み込めませんでした：' + err.message); }
      e.target.value = '';
    };
    fr.readAsText(f);
  };

  /* 閉じる前・ほかのタブへ行く前に、まだ送っていない分を送る */
  document.addEventListener('visibilitychange', () => { if(document.hidden) pump(); });
  window.addEventListener('beforeunload', e => {
    if(Store.kind === 'local' && S){
      try{ localStorage.setItem(LS_PREFIX + 'last', JSON.stringify({ year:S.meta.year, grade:S.meta.grade })); }catch(err){}
    }
    if(Saver.dirty || Saver.busy){ pump(); e.preventDefault(); e.returnValue = ''; }
  });

  renderAll();
  if(!o) setTimeout(openSettings, 50);   // はじめて開いたときは設定から
}
