<title>げんこうようし</title>
<style>
/* 原稿用紙ツール ― 見た目 */

:root{
  --ink:   #1e2a24;
  --paper: #fffdf6;
  --rule:  #3d8d6b;   /* 原稿用紙の みどりの けい線 */
  --rule2: #a9d2bf;
  --accent:#2f7a5a;
  --bg:    #eef3f0;
  --fix:   #fff2b8;   /* なおした ところ */
  --cell:  26px;
  --gapc:  calc(var(--cell) * 0.18);
}

*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;
}
#app{ height:100%; display:flex; flex-direction:column; }

/* ---------- 上の バー ---------- */
.bar{
  flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:8px 14px; background:var(--accent); color:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.18);
}
.logo{ font-size:19px; margin:0; letter-spacing:.06em; white-space:nowrap; }
.bar-mid{ display:flex; align-items:center; gap:14px; flex:1 1 auto; }
.bar-right{ display:flex; align-items:center; gap:10px; }
.field{ display:flex; align-items:center; gap:6px; font-size:13px; }
.field select{
  font:inherit; font-size:14px; padding:4px 8px; border-radius:8px;
  border:none; background:#ffffff; color:var(--ink);
}
.count{ font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.count.over{ background:#ffd6d6; color:#a12; border-radius:8px; padding:2px 8px; }
.save{ font-size:12px; min-width:7em; text-align:right; opacity:.9; }

.btn{
  font:inherit; font-size:14px; padding:7px 14px; border:none; border-radius:10px;
  background:#ffd166; color:#3a2d00; cursor:pointer; white-space:nowrap;
}
.btn:hover{ filter:brightness(1.06); }
.btn-ghost{ background:rgba(255,255,255,.18); color:#fff; }
.btn-ghost[aria-pressed="false"]{ opacity:.55; }

/* ---------- 左右の わけ ---------- */
.main{ flex:1 1 auto; display:flex; min-height:0; }
.pane{ display:flex; flex-direction:column; min-height:0; min-width:0; }
.pane-in{ flex:0 0 34%; border-right:2px solid #d3ded8; background:#fff; }
.pane-out{ flex:1 1 auto; background:var(--bg); }

.in-head,.out-head{
  flex:0 0 auto; padding:7px 12px; font-size:13px; color:#4a5a52;
  background:#f3f7f5; border-bottom:1px solid #dde7e2;
  display:flex; justify-content:space-between; gap:10px;
}
.out-head .note{ color:var(--accent); }

.in-row{ display:flex; align-items:center; gap:8px; padding:8px 12px 0; }
.in-label{ flex:0 0 4.5em; font-size:13px; color:#4a5a52; }
.in-row input{
  flex:1 1 auto; min-width:0; font:inherit; font-size:16px; padding:7px 10px;
  border:2px solid #dde7e2; border-radius:9px; background:#fff;
}
.in-row input:focus,#inBody:focus{ outline:none; border-color:var(--accent); }

#inBody{
  flex:1 1 auto; margin:10px 12px; padding:12px; min-height:0;
  font:inherit; font-size:17px; line-height:1.9;
  border:2px solid #dde7e2; border-radius:10px; resize:none; background:#fff;
}

.fixes{ flex:0 0 auto; max-height:26%; overflow:auto; padding:0 12px 12px; }
.fix-item{
  font-size:13px; color:#5a4a10; background:var(--fix);
  border-radius:8px; padding:6px 10px; margin-top:6px;
}

/* ---------- 原稿用紙 ---------- */
.sheets{ flex:1 1 auto; overflow:auto; padding:18px; }
.sheet{
  background:var(--paper); margin:0 auto 22px; padding:calc(var(--cell) * .7);
  box-shadow:0 2px 10px rgba(0,0,0,.14); width:max-content;
  display:flex; flex-direction:row-reverse; gap:var(--gapc);
}
.sheet.over{ opacity:.45; outline:3px dashed #d66; }
.col{
  display:flex; flex-direction:column;
  border:1.5px solid var(--rule); background:#fff;
}
.cell{
  width:var(--cell); height:var(--cell);
  border-bottom:1px solid var(--rule2);
  display:flex; align-items:center; justify-content:center;
  font-family:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho","YuMincho",serif;
  font-size:calc(var(--cell) * .78); line-height:1;
}
.cell:last-child{ border-bottom:none; }
/* たて書きの 字の 向き（フォントに たよらず 自分で きめる） */
.cell span{ display:block; line-height:1; }
.cell span.rot{ transform:rotate(90deg); }
.cell span.rot.ro{ transform:translateY(-40%) rotate(90deg); }  /* ひらく かっこは 上に */
.cell span.rot.rc{ transform:translateY(40%)  rotate(90deg); }  /* とじる かっこは 下に */
.cell span.tr { transform:translate(44%,-44%); }
.cell span.sk { transform:translate(16%,-16%); }
/* 句読点だけの マス（「。」」）… 2つとも 小さく たてに ならべる */
.cell.stack{ flex-direction:column; }
.cell.stack span{ font-size:.62em; }
.cell.stack span.tr{ transform:translate(34%,0); }
.cell.stack span.sk{ transform:none; }
/* 詰めた マス（「た。」）… もとの 字は そのまま、句読点だけ 小さく 右下に */
.cell.hang{ position:relative; }
.cell.hang .tail{
  position:absolute; right:1px; bottom:0;
  display:flex; flex-direction:column; align-items:center;
  font-size:.46em; line-height:1;
}
.cell.hang .tail span.tr,.cell.hang .tail span.sk{ transform:none; }
.cell.fix{ background:var(--fix); }
.cell.note{ cursor:help; }
body.nofix .cell.fix{ background:transparent; }

/* ---------- いんさつ ---------- */
@page{ size:A4 portrait; margin:12mm; }
@media print{
  body{ background:#fff; }
  .bar,.pane-in,.out-head,.fixes{ display:none !important; }
  .main{ display:block; }
  .pane-out{ display:block; }
  .sheets{ overflow:visible; padding:0; }
  .sheet{ box-shadow:none; background:#fff; margin:0 auto; }
  .cell.fix{ background:transparent !important; }
}

/* ---------- せまい 画面（タブレットを たてに した とき）---------- */
@media (max-width:820px){
  .main{ flex-direction:column; }
  .pane-in{ flex:0 0 46%; border-right:none; border-bottom:2px solid #d3ded8; }
  .logo{ font-size:16px; }
}

/* ---------- 先生用の せってい ---------- */
.main{ position:relative; }
.settings{
  position:absolute; top:0; bottom:0; left:0; width:min(420px, 46%);
  background:#fff; border-right:2px solid #d3ded8; z-index:20;
  display:flex; flex-direction:column;
  box-shadow:6px 0 18px rgba(0,0,0,.12);
}
.settings[hidden]{ display:none; }
.set-head{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; background:#f3f7f5; border-bottom:1px solid #dde7e2;
}
.set-body{ flex:1 1 auto; overflow:auto; padding:6px 14px 18px; }
.set-group{ padding:12px 0; border-bottom:1px solid #eef3f0; }
.set-group h3{ margin:0 0 8px; font-size:14px; color:var(--accent); }
.set-group > select,.set-group > textarea{
  width:100%; font:inherit; font-size:15px; padding:6px 8px;
  border:2px solid #dde7e2; border-radius:8px; background:#fff;
}
.set-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:5px 0; font-size:14px;
}
.set-row input[type="number"]{ width:5em; font:inherit; font-size:15px; padding:5px 7px;
  border:2px solid #dde7e2; border-radius:8px; text-align:right; }
.set-row input[type="checkbox"]{ width:22px; height:22px; accent-color:var(--accent); }
.set-row select{ font:inherit; font-size:14px; padding:5px 7px; border:2px solid #dde7e2; border-radius:8px; }
.set-btns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.btn-sm{ font-size:13px; padding:5px 10px; background:#e8f0ec; color:var(--ink); }
.btn-danger{ background:#ffdede; color:#a12; }
.hint{ font-size:12px; color:#6a7a72; margin:8px 0 0; line-height:1.6; }
.hint code{ background:#eef3f0; padding:1px 4px; border-radius:4px; }

@media (max-width:820px){
  .settings{ width:100%; }
}
@media print{ .settings{ display:none !important; } }

/* ---------- まい数の 見出し（自動で ふえます） ---------- */
.sheet-wrap{ margin:0 auto 22px; width:max-content; }
.sheet{ margin:0 auto; }
.sheet-no{
  text-align:center; font-size:12px; color:#6a7a72; padding-top:6px;
}
/* 詰めた マスの 中の 小さい字は 句読点より 大きめに */
.cell.hang .tail span.tk{ font-size:1.3em; }
@media print{ .sheet-no{ display:none; } .sheet-wrap{ margin:0 auto; page-break-after:always; break-after:page; }
  .sheet-wrap:last-child{ page-break-after:auto; break-after:auto; } }

/* ---------- アルファベット ---------- */
.cell.lat1 span{                       /* 大文字は 1マス1字、たてに そのまま */
  font-family:"Times New Roman",serif; font-size:.9em;
}
.cell.lat2 .latpair{                   /* 小文字は 1マス2字、よこ向きに */
  display:block; white-space:nowrap; transform:rotate(90deg);
  font-family:"Times New Roman",serif; font-size:.62em; letter-spacing:0;
}
/* ---------- 句読点を マスの 外に ぶら下げる とき ---------- */
.sheet.hang-out .cell.hang .tail{ bottom:auto; top:100%; right:0; }

</style>

<div id="app">

  <header class="bar">
    <h1 class="logo">げんこうようし</h1>

    <div class="bar-mid">
      <div class="count" id="count">0字</div>
    </div>

    <div class="bar-right">
      <button class="btn btn-ghost" id="btnFix" aria-pressed="true">なおした ところ</button>
      <button class="btn" id="btnPrint">いんさつ</button>
      <button class="btn btn-ghost" id="btnSet" title="先生用の せってい">⚙ せってい</button>
      <div class="save" id="save">　</div>
    </div>
  </header>

  <main class="main">

    <!-- ========== 左：うつ ========== -->
    <section class="pane pane-in">
      <div class="in-head">うつ（よこ書き）</div>

      <label class="in-row" id="rowTitle">
        <span class="in-label">だいめい</span>
        <input type="text" id="inTitle" placeholder="六年間の思い出" autocomplete="off">
      </label>

      <label class="in-row" id="rowName">
        <span class="in-label">なまえ</span>
        <input type="text" id="inName" placeholder="山田　太郎" autocomplete="off">
      </label>

      <textarea id="inBody" placeholder="ここに 本文を うちます。&#10;行を かえると 段落に なります。&#10;&#10;「かぎかっこ」や 数字は、原稿用紙の きまりどおりに 右がわで なおります。"></textarea>

      <div class="fixes" id="fixes"></div>
    </section>

    <!-- ========== 右：原稿用紙 ========== -->
    <section class="pane pane-out">
      <div class="out-head">
        <span>げんこうようし（たて書き）</span>
        <span class="note" id="note"></span>
      </div>
      <div class="sheets" id="sheets"></div>
    </section>


    <!-- ========== 先生用の せってい ========== -->
    <section class="settings" id="settings" hidden aria-label="先生用の せってい">
      <div class="set-head">
        <b>せってい（先生用）</b>
        <button class="btn" id="btnCloseSet">とじる</button>
      </div>
      <div class="set-body">

        <div class="set-group">
          <h3>マス</h3>
          <label class="set-row"><span>1行の 字数</span><input type="number" id="setChars" min="4" max="40"></label>
          <label class="set-row"><span>1まいの 行数</span><input type="number" id="setCols" min="2" max="40"></label>
          <p class="hint">まい数は きめません。1まい目の さいごまで 書いて つぎの 字を 打つと、
             自動で 2まい目が ふえます。</p>
        </div>

        <div class="set-group">
          <h3>題名</h3>
          <label class="set-row"><span>つかう</span><input type="checkbox" id="setTitleOn"></label>
          <label class="set-row"><span>そろえ方</span>
            <select id="setTitleAlign">
              <option value="indent">上を あける</option>
              <option value="center">まんなかに そろえる</option>
            </select></label>
          <label class="set-row"><span>上を あける マス</span><input type="number" id="setTitleIndent" min="0" max="20"></label>
        </div>

        <div class="set-group">
          <h3>名前</h3>
          <label class="set-row"><span>つかう</span><input type="checkbox" id="setNameOn"></label>
          <label class="set-row"><span>下を あける マス</span><input type="number" id="setNameBottom" min="0" max="20"></label>
          <label class="set-row"><span>姓と名の あいだ</span><input type="number" id="setNameGap" min="0" max="5"></label>
        </div>

        <div class="set-group">
          <h3>本文</h3>
          <label class="set-row"><span>はじまり</span>
            <select id="setBodyGap">
              <option value="0">すぐ つぎの行から</option>
              <option value="1">1行 あけてから</option>
              <option value="2">2行 あけてから</option>
            </select></label>
          <p class="hint" id="bodyGapHint"></p>
          <label class="set-row"><span>段落の はじめに あける マス</span><input type="number" id="setParaIndent" min="0" max="3"></label>
        </div>

        <div class="set-group">
          <h3>原稿用紙の きまり</h3>
          <label class="set-row"><span>数字の 書き方</span>
            <select id="setNumbers">
              <option value="mixed">使い分け（十二人／二〇二六年）</option>
              <option value="positional">いつも 位取り（十二／二千二十六）</option>
              <option value="serial">いつも 並べ（一二／二〇二六）</option>
              <option value="keep">算用数字の まま</option>
            </select></label>
          <label class="set-row"><span>小数点を 中黒に する（三十二・五）</span><input type="checkbox" id="setDecimal"></label>
          <label class="set-row"><span>アルファベット</span>
            <select id="setLatin">
              <option value="rule">大文字1字・小文字2字（よこ向き）</option>
              <option value="perCell">ぜんぶ 1マス1字</option>
            </select></label>
          <label class="set-row"><span>行頭の 句読点を 前の行へ まわす</span><input type="checkbox" id="setHang"></label>
          <label class="set-row"><span>まわし方</span>
            <select id="setHangStyle">
              <option value="inside">前のマスに 一緒に 入れる</option>
              <option value="outside">マスの 外に ぶら下げる</option>
            </select></label>
          <label class="set-row"><span>小さい字（っ ゃ ー）も 前の行へ まわす</span><input type="checkbox" id="setSmallKana"></label>
          <label class="set-row"><span>「。」」を 1マスに まとめる</span><input type="checkbox" id="setKuten"></label>
          <label class="set-row"><span>会話文は 改行して 1マス目から</span><input type="checkbox" id="setDialogue"></label>
          <label class="set-row"><span>段落が 会話から はじまる ときは 1マス あける</span><input type="checkbox" id="setDialogueIndent"></label>
          <label class="set-row"><span>「」を とじた あとの 改行</span>
            <select id="setAfterQuote">
              <option value="dialogue">会話文だけ 改行（思ったことは そのまま）</option>
              <option value="always">どの「」でも 改行する</option>
              <option value="never">改行しない</option>
            </select></label>
          <label class="set-row"><span>！ ？ の あとを 1マス あける</span><input type="checkbox" id="setBangSpace"></label>
          <label class="set-row"><span>…… —— を 2マス つかう</span><input type="checkbox" id="setEllipsis"></label>
          <label class="set-row"><span>…… —— の 2マス目を 行頭に 置かない</span><input type="checkbox" id="setPair"></label>
          <label class="set-row"><span>行末の 「 を つぎの行へ 送る</span><input type="checkbox" id="setPushOpen"></label>
          <label class="set-row"><span>長い 題名を つぎの行へ 分ける</span><input type="checkbox" id="setWrapTitle"></label>
          <p class="hint">きまりの くわしい 説明は <code>docs/RULES.md</code> に あります。</p>
        </div>

        <div class="set-group">
          <h3>ほかの 端末に くばる</h3>
          <p class="hint">「コードを 作る」で 出た 文字を 児童の 端末で 貼りつけて「読みこむ」と、同じ きまりに なります。</p>
          <textarea id="setCode" rows="3" placeholder="ここに せっていコードが 出ます"></textarea>
          <div class="set-btns">
            <button class="btn btn-sm" id="btnCodeOut">コードを 作る</button>
            <button class="btn btn-sm" id="btnCodeIn">読みこむ</button>
            <button class="btn btn-sm" id="btnReset">はじめの きまりに もどす</button>
          </div>
          <div class="hint" id="setMsg"></div>
        </div>

      </div>
    </section>
  </main>
</div>

<script>
/* 原稿用紙ツール ― きまり（設定）
   先生が 設定画面（⚙）で かえられます。
   きまりの くわしい 説明は docs/RULES.md を 見てください。 */

const GY_DEFAULTS = {
  /* ---- マスの かたち ---- */
  charsPerColumn : 20,   // 1行に 入る 字数（たてに ならぶ マスの 数）
  columnsPerPage : 20,   // 1まいの 行数（よこに ならぶ 行の 数）
  /* まい数は きめません。書いた ぶんだけ 1まいずつ ふえます。 */

  /* ---- 題名 ---- */
  title: {
    enabled : true,
    align   : 'indent',  // 'indent' = 上を あける / 'center' = まんなか
    indent  : 3          // 上を あける マスの 数
  },

  /* ---- 名前 ---- */
  name: {
    enabled   : true,
    bottomGap : 1,       // 下を あける マスの 数
    gapBetween: 1        // 姓と名の あいだの マスの 数
  },

  /* ---- 本文 ---- */
  bodyGapColumns  : 0,   // 名前の つぎに あける 行の 数
                         //   0 … すぐ つぎの行（3行目）から
                         //   1 … 1行 あけて（4行目）から
  paragraphIndent : 1,   // 段落の はじめに あける マスの 数

  /* ---- 原稿用紙の きまり ---- */
  hangPunctuation      : true,  // 行頭に 来る 句読点・とじかぎを 前のマスに 入れる
  hangStyle            : 'inside', // 'inside'=前のマスに 一緒に / 'outside'=マスの 外に ぶら下げる
  hangSmallKana        : false, // 小さい字（っ ゃ ー）も 同じく 前のマスに 入れるか
                                //   false … そのまま 行の はじめに 書く（一般的）
                                //   true  … 句読点と 同じく 前のマスに 詰める
  combineKutenBracket  : true,  // 「。」」を 1マスに まとめる
  dialogueNewline      : true,  // 会話文は 改行して 1マス目から
  dialogueParagraphIndent: false, // 新しい 段落が 会話から はじまる ときの 「 の 位置
                                //   false … いつも 1マス目（既定）
                                //   true  … 1マス あけて 2マス目から
  quoteNewline         : 'dialogue', // 「」を とじた あとの 改行
                                //   'dialogue' … 文の はじめの「」＝会話文だけ 改行する。
                                //                文の 途中の「」（思ったこと・引用）は 改行しない
                                //   'always'   … どの「」でも 改行する
                                //   'never'    … 改行しない
  numbers              : 'mixed', // 'mixed'=使い分け / 'positional'=位取り / 'serial'=並べ / 'keep'=算用数字のまま
  decimalNakaguro      : true,  // 小数点を 中黒に する（三十二・五）
  latinStyle           : 'rule',// 'rule'=大文字は 1マス1字・小文字は 1マス2字（よこ向き）
                                // 'perCell'=ぜんぶ 1マス1字
  spaceAfterBangQuestion: true, // ！ ？ の あとを 1マス あける
  ellipsisTwoCells     : true,  // …… —— は 2マス つかう
  keepPairTogether     : true,  // …… —— の 2マス目が 行頭に 来ないように する
  pushOpenBracket      : true,  // 行の おわりに 来た 「 は つぎの行へ おくる
  wrapLongTitle        : true   // 1行に 入りきらない 題名は つぎの行へ 分ける
};

/* 設定を 1つに まぜあわせる（あさい ものだけ 上書き） */
function gyMergeConfig(base, over){
  const out = JSON.parse(JSON.stringify(base));
  for(const k in (over || {})){
    if(over[k] && typeof over[k] === 'object' && !Array.isArray(over[k])){
      out[k] = Object.assign({}, out[k] || {}, over[k]);
    }else if(over[k] !== undefined){
      out[k] = over[k];
    }
  }
  return out;
}

function gyDefaultSettings(){ return gyMergeConfig(GY_DEFAULTS, {}); }

/* 前の かたちで 保存されて いた ものを いまの かたちに なおす */
function gyUpgradeSettings(s){
  if(!s || typeof s !== 'object') return gyDefaultSettings();
  if(Array.isArray(s)) s = s[0] || {};            // むかしは かだいの 一覧だった
  const out = gyMergeConfig(GY_DEFAULTS, s);
  if(s.bodyStartColumn !== undefined && s.bodyGapColumns === undefined){
    const head = (out.title.enabled ? 1 : 0) + (out.name.enabled ? 1 : 0);
    out.bodyGapColumns = Math.max(0, s.bodyStartColumn - 1 - head);
  }
  if(s.smallKanaAtLineStart !== undefined && s.hangSmallKana === undefined){
    out.hangSmallKana = !s.smallKanaAtLineStart;
  }
  if(s.newlineAfterQuote !== undefined && s.quoteNewline === undefined){
    out.quoteNewline = s.newlineAfterQuote ? 'dialogue' : 'never';
  }
  delete out.bodyStartColumn;
  delete out.smallKanaAtLineStart;
  delete out.pages;
  delete out.newlineAfterQuote;
  delete out.id;
  delete out.label;
  return out;
}

<script>
/* 原稿用紙ツール ― 入力を 原稿用紙の 書き方に なおす
   よこ書きで 打った 文章を、たて書きの 原稿用紙に 入れられる 形に そろえます。
   なおした ところには しるし（fix）を つけて、あとで 色を つけられる ように します。 */

/* なおした りゆう（画面に 出す ことば） */
const GY_FIX_LABEL = {
  num   : '数字を 漢数字に なおしました',
  zen   : '半角の 字を 全角に なおしました',
  punct : '読点・句点・記号を 全角に なおしました',
  dots  : '「…」を 2マスの 「……」に なおしました',
  dash  : '「—」を 2マスの 「——」に なおしました',
  space : 'よけいな 空白を とりました'
};

const GY_D_KANJI = '〇一二三四五六七八九';

/* 位取り（十二 / 三百五十 / 二千二十六） */
function gyKanjiPositional(digits){
  let n = parseInt(digits, 10);
  if(!isFinite(n)) return digits;
  if(n === 0) return '〇';
  const big = ['', '万', '億', '兆'];
  const small = ['', '十', '百', '千'];
  let out = '', gi = 0;
  while(n > 0){
    const g = n % 10000;
    if(g > 0){
      let s = '', gg = g, i = 0;
      while(gg > 0){
        const d = gg % 10;
        if(d > 0) s = ((d === 1 && i > 0) ? '' : GY_D_KANJI[d]) + small[i] + s;
        gg = Math.floor(gg / 10); i++;
      }
      out = s + big[gi] + out;
    }
    n = Math.floor(n / 10000); gi++;
  }
  return out;
}

/* 並べ（二〇二六 / 三五〇） */
function gyKanjiSerial(digits){
  let out = '';
  for(const d of digits) out += GY_D_KANJI[Number(d)];
  return out;
}

/* 数字の ならびを 漢数字に する。after は そのすぐ あとの 字 */
function gyDigitsToKanji(digits, after, mode, before){
  if(mode === 'keep') return digits;
  if(mode === 'positional') return gyKanjiPositional(digits);
  if(mode === 'serial')     return gyKanjiSerial(digits);
  /* mixed（使い分け）*/
  if(/[-−－ー]/.test(before || '') || /[-−－]/.test(after || ''))
    return gyKanjiSerial(digits);          // 電話番号などの つながった 数字
  if(digits.length >= 7)               return gyKanjiSerial(digits);  // けたの とても 多い 番号
  if(digits.length > 1 && digits[0] === '0') return gyKanjiSerial(digits);  // 0で はじまる 番号
  if(digits.length === 4 && after === '年')  return gyKanjiSerial(digits);  // 二〇二六年
  if(after === '組' || after === '番' || after === '号') return gyKanjiSerial(digits);
  return gyKanjiPositional(digits);
}

/* 半角 → 全角（数字は べつに あつかうので ここでは ふくめない） */
function gyToZenkaku(ch){
  const code = ch.charCodeAt(0);
  if(code >= 0x21 && code <= 0x7e) return String.fromCharCode(code + 0xfee0);
  return ch;
}

const GY_PUNCT_MAP = { ',':'、', '.':'。', '!':'！', '?':'？', '，':'、', '．':'。' };

/* --- 本体 ---
   src : 児童が 打った 文章（よこ書き・改行は \n）
   cfg : きまり
   もどり値 : { paragraphs:[{units:[{c,fix}], dialogue:bool}], fixes:{りゆう:かず} } */
function gyNormalize(src, cfg){
  cfg = cfg || GY_DEFAULTS;
  const fixes = {};
  const addFix = k => { if(k) fixes[k] = (fixes[k] || 0) + 1; };

  const rawParas = String(src == null ? '' : src)
    .replace(/\r\n?/g, '\n')
    .split('\n');

  const paragraphs = [];
  for(const raw of rawParas){
    const line = raw.replace(/^[ 　\t]+/, m => { if(m) addFix('space'); return ''; })
                    .replace(/[ 　\t]+$/, '');
    if(line === ''){ continue; }                 // 空行は とばす
    const chars = Array.from(line);
    const units = [];
    for(let i = 0; i < chars.length; i++){
      const c = chars[i];

      /* 数字の ならび（小数点も ふくむ） */
      if(/[0-9０-９]/.test(c)){
        const before = chars[i-1] || '';
        const half = d => d.replace(/[０-９]/, x => String.fromCharCode(x.charCodeAt(0) - 0xfee0));
        let run = '';
        while(i < chars.length && /[0-9０-９]/.test(chars[i])){ run += half(chars[i]); i++; }
        /* 小数（32.5）は 中黒で つなぐ */
        let dec = '';
        if(cfg.decimalNakaguro && /[.．]/.test(chars[i] || '') && /[0-9０-９]/.test(chars[i+1] || '')){
          i++;
          while(i < chars.length && /[0-9０-９]/.test(chars[i])){ dec += half(chars[i]); i++; }
        }
        const after = chars[i] || '';
        let conv = gyDigitsToKanji(run, dec ? '' : after, cfg.numbers, before);
        let src  = run;
        if(dec){
          conv += '・' + gyKanjiSerial(dec);   // 小数点いかは 1けたずつ
          src  += '.' + dec;
        }
        i--;
        const changed = (conv !== src);
        for(const k of Array.from(conv)) units.push({ c:k, fix: changed ? 'num' : '' });
        if(changed) addFix('num');
        continue;
      }

      /* 三点リーダ … / ... / 。。。 */
      if(cfg.ellipsisTwoCells && (c === '…' || (c === '.' && chars[i+1] === '.' && chars[i+2] === '.'))){
        let n = 0;
        if(c === '…'){ while(chars[i+n] === '…') n++; i += n - 1; }
        else { while(chars[i+n] === '.') n++; i += n - 1; }
        units.push({ c:'…', fix:'dots' }); units.push({ c:'…', fix:'dots' });
        addFix('dots');
        continue;
      }

      /* ダッシュ ― / — / -- */
      if(cfg.ellipsisTwoCells && (c === '—' || c === '―' || (c === '-' && chars[i+1] === '-'))){
        let n = 0;
        while(chars[i+n] === c) n++;
        i += n - 1;
        units.push({ c:'—', fix:'dash' }); units.push({ c:'—', fix:'dash' });
        addFix('dash');
        continue;
      }

      /* 空白 ― 原稿用紙では ことばの あいだを あけないので とる */
      if(c === ' ' || c === '　' || c === '\t'){
        addFix('space');
        continue;
      }

      /* 句読点の なおし */
      if(GY_PUNCT_MAP[c]){
        const to = GY_PUNCT_MAP[c];
        units.push({ c:to, fix: to === c ? '' : 'punct' });
        if(to !== c) addFix('punct');
        continue;
      }

      /* アルファベットは そのまま（1マスに 何字 入れるかは compose.js で きめる） */
      if(/[A-Za-z]/.test(c)){ units.push({ c:c, fix:'' }); continue; }
      if(/[Ａ-Ｚａ-ｚ]/.test(c)){
        units.push({ c: String.fromCharCode(c.charCodeAt(0) - 0xfee0), fix:'' });
        continue;
      }

      /* 半角 → 全角 */
      const z = gyToZenkaku(c);
      units.push({ c:z, fix: z === c ? '' : 'zen' });
      if(z !== c) addFix('zen');
    }
    if(units.length) paragraphs.push({ units, dialogue:false });
  }

  /* 会話文の ところで 行を かえる
     ・文の はじめ（段落の 先頭、または 。！？ の すぐ あと）に 来る 「 … 会話文
       → 行を かえて 1マス目から 書き、とじた あとも 行を かえる
     ・文の 途中に 来る 「   … 思ったこと・引用・強調
       → 行は かえず、そのまま つづける                                   */
  const out  = [];
  const mode = cfg.quoteNewline || 'dialogue';
  const OPEN = '「『', CLOSE = '」』';
  const ENDS = '。！？';
  for(const p of paragraphs){
    let cur = [], curTop = false, openIsDialogue = false, first = true;
    const flush = nextTop => {
      if(cur.length){
        const isQuote = OPEN.indexOf(cur[0].c) >= 0;
        /* paraHead … 打った 段落の いちばん さいしょが 会話文だった、という しるし */
        out.push({ units:cur, dialogue: curTop || isQuote, paraHead: first && isQuote });
        first = false;
      }
      cur = []; curTop = nextTop;
    };
    for(let i = 0; i < p.units.length; i++){
      const u = p.units[i], nx = p.units[i+1];
      if(OPEN.indexOf(u.c) >= 0){
        const prev = cur[cur.length - 1];
        const atStart = !prev || ENDS.indexOf(prev.c) >= 0;
        if(atStart && cfg.dialogueNewline && cur.length) flush(false);
        openIsDialogue = atStart;
        cur.push(u);
        continue;
      }
      cur.push(u);
      if(CLOSE.indexOf(u.c) >= 0 && nx){
        const doBreak = (mode === 'always') || (mode === 'dialogue' && openIsDialogue);
        openIsDialogue = false;
        if(doBreak) flush(true);
      }
    }
    flush(false);
  }

  return { paragraphs: out, fixes };
}

</script>
<script>
/* 原稿用紙ツール ― 文章を マスに わりつける
   なおした 文章を うけとり、原稿用紙の きまりに そって
   「どの行の どのマスに なにを 書くか」を きめます。 */

const GY_CLOSE         = '」』）〕】〉》｝］';
const GY_NO_LINE_START = '。、，．」』）〕】〉》｝］？！ゝゞヽヾ';
const GY_NO_LINE_END   = '「『（〔【〈《｛［';
const GY_SMALL_KANA    = 'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶー';

/* なぜ そう なったかの 説明（マスに さわると 出ます） */
const GY_NOTE = {
  hang : '行の はじめに 来るので、前のマスに 一緒に 入れました',
  push : '「 が 行の おわりに 来るので、つぎの行へ おくりました',
  kuten: '「。」を 1マスに まとめました'
};

/* たて書きに したとき、字を どう 置くか
   rot = 90どまわす（かぎかっこ・長音・ダッシュ・リーダ）
   tr  = マスの 右上に 置く（句読点）
   sk  = 少し 右上に よせる（小さい字）            */
const GY_ROT_OPEN  = '「『（〔【〈《｛［';   // 90どまわして マスの 上へ
const GY_ROT_CLOSE = '」』）〕】〉》｝］';   // 90どまわして マスの 下へ
const GY_ROT_MID   = 'ー—―〜～…‥＝';      // 90どまわして まんなかに
const GY_TOPRIGHT  = '、。，．';            // マスの 右上に
function gyCharClass(c){
  if(GY_ROT_OPEN .indexOf(c) >= 0) return 'rot ro';
  if(GY_ROT_CLOSE.indexOf(c) >= 0) return 'rot rc';
  if(GY_ROT_MID  .indexOf(c) >= 0) return 'rot';
  if(GY_TOPRIGHT .indexOf(c) >= 0) return 'tr';
  if(GY_SMALL_KANA.indexOf(c) >= 0) return 'sk';
  return '';
}

function gyIsLatin(c){ return /[Ａ-Ｚａ-ｚA-Za-z]/.test(c); }
function gyCls(c){ return gyIsLatin(c) ? 'latin' : ''; }

function gyNoLineStart(text, cfg){
  const c = Array.from(text)[0];
  if(GY_NO_LINE_START.indexOf(c) >= 0) return true;
  if(cfg.hangSmallKana && GY_SMALL_KANA.indexOf(c) >= 0) return true;
  return false;
}

/* 段落を マス1つぶんずつの ならびに する */
function gyBuildItems(paragraphs, cfg){
  const items = [];
  for(const p of paragraphs){
    /* 会話文は 1マス目から。ただし 新しい 段落が 会話から はじまる ときは
       設定に よって 1マス あけて 2マス目からに できる。 */
    const indent = p.dialogue
      ? ((cfg.dialogueParagraphIndent && p.paraHead) ? cfg.paragraphIndent : 0)
      : cfg.paragraphIndent;
    items.push({ t:'newpara', indent: indent });
    const u = p.units;
    for(let i = 0; i < u.length; i++){
      const c = u[i].c, nx = u[i+1], pv = u[i-1];

      /* アルファベット ― 大文字だけの ことばは 1マス1字、
         小文字を ふくむ ことばは 1マスに 2字（よこ向き）    */
      if(/[A-Za-z]/.test(c)){
        if(cfg.latinStyle !== 'rule'){
          items.push({ t:'cell', text:c, fix:u[i].fix || '', cls:'lat1' });
          continue;
        }
        let run = '', j = i;
        while(j < u.length && /[A-Za-z]/.test(u[j].c)){ run += u[j].c; j++; }
        i = j - 1;
        if(/^[A-Z]+$/.test(run)){
          for(const ch of run) items.push({ t:'cell', text:ch, fix:'', cls:'lat1' });
        }else{
          for(let k = 0; k < run.length; k += 2){
            items.push({ t:'cell', text: run.substr(k, 2), fix:'', cls:'lat2' });
          }
        }
        continue;
      }

      /* 「。」」を 1マスに */
      if(cfg.combineKutenBracket && (c === '。' || c === '、') && nx && GY_CLOSE.indexOf(nx.c) >= 0){
        items.push({ t:'cell', text: c + nx.c, fix: u[i].fix || nx.fix || '', cls:'multi', note: GY_NOTE.kuten });
        i++; continue;
      }

      /* …… —— の 2マス目は 行の はじめに 来ないように する */
      const isPairTail = (c === '…' || c === '—') && pv && pv.c === c;
      items.push({ t:'cell', text:c, fix:u[i].fix || '', cls: gyCls(c), noStart: isPairTail });

      /* ！ ？ の あとは 1マス あける */
      if(cfg.spaceAfterBangQuestion && (c === '！' || c === '？')){
        const after = nx ? nx.c : '';
        if(after && GY_NO_LINE_START.indexOf(after) < 0) items.push({ t:'blank' });
      }
    }
  }
  return items;
}

/* マスの ならびを 行に つめる（ここで 禁則処理を する） */
function gyPlace(items, cfg){
  const N = cfg.charsPerColumn;
  const cols = [];
  let cur = null, pos = N;

  const startCol = () => { cur = { cells: new Array(N).fill(null) }; cols.push(cur); pos = 0; return cur; };
  const lastCell = () => {
    for(let ci = cols.length - 1; ci >= 0; ci--){
      const cc = cols[ci].cells;
      for(let i = N - 1; i >= 0; i--) if(cc[i]) return cc[i];
    }
    return null;
  };

  for(const it of items){
    if(it.t === 'newpara'){ startCol(); pos = Math.min(it.indent, N); continue; }
    if(it.t === 'blank'){ if(pos < N - 1) pos++; continue; }

    if(pos >= N){
      const prev = lastCell();
      const room = prev ? (Array.from(prev.text).length + Array.from(it.text).length) : 99;
      const wantHang = (cfg.hangPunctuation && gyNoLineStart(it.text, cfg))
                    || (cfg.keepPairTogether && it.noStart);
      if(wantHang && prev && room <= 3){
        prev.text += it.text;
        prev.cls = 'multi';
        prev.note = GY_NOTE.hang;
        if(it.fix && !prev.fix) prev.fix = it.fix;
        continue;
      }
      startCol();
    }

    if(cfg.pushOpenBracket && pos === N - 1 && GY_NO_LINE_END.indexOf(it.text) >= 0){
      startCol();
      cur.cells[pos] = null;
      if(cols.length >= 2){
        const prevCol = cols[cols.length - 2];
        prevCol.note = GY_NOTE.push;
      }
    }

    cur.cells[pos++] = { text: it.text, fix: it.fix || '', cls: it.cls || '', note: it.note || '' };
  }
  return cols;
}

/* 題名・名前の 行を つくる */
function gyHeadColumns(title, name, cfg){
  const N = cfg.charsPerColumn;
  const blank = () => ({ cells: new Array(N).fill(null) });
  const cols = [];

  if(cfg.title.enabled){
    const norm  = gyNormalize(title || '', cfg).paragraphs[0];
    const chars = norm ? norm.units.map(u => u.c) : [];
    const indent = (cfg.title.align === 'center') ? 0 : Math.min(cfg.title.indent, N - 1);
    const room   = Math.max(1, N - indent);
    /* 1行に 入りきらない 題名は つぎの行へ 分ける */
    const lines = [];
    if(!cfg.wrapLongTitle){
      lines.push(chars.slice(0, room));
    }else{
      for(let i = 0; i < Math.max(1, Math.ceil(chars.length / room)); i++){
        lines.push(chars.slice(i * room, (i + 1) * room));
      }
    }
    for(const line of lines){
      const col = blank();
      const start = (cfg.title.align === 'center')
        ? Math.max(0, Math.floor((N - line.length) / 2))
        : Math.min(indent, Math.max(0, N - line.length));
      for(let i = 0; i < line.length && start + i < N; i++){
        col.cells[start + i] = { text: line[i], cls: gyCls(line[i]), role:'title', fix:'', note:'' };
      }
      col.role = 'title';
      cols.push(col);
    }
  }

  if(cfg.name.enabled){
    const col = blank();
    const parts = String(name || '').split(/[\s　]+/).filter(Boolean);
    const seq = [];
    parts.forEach((part, pi) => {
      if(pi > 0) for(let k = 0; k < cfg.name.gapBetween; k++) seq.push(null);
      const norm = gyNormalize(part, cfg).paragraphs[0];
      const chars = norm ? norm.units.map(u => u.c) : [];
      for(const ch of chars) seq.push(ch);
    });
    let start = N - cfg.name.bottomGap - seq.length;
    if(start < 0) start = 0;
    for(let i = 0; i < seq.length && start + i < N; i++){
      if(seq[i] !== null) col.cells[start + i] = { text: seq[i], cls: gyCls(seq[i]), role:'name', fix:'', note:'' };
    }
    col.role = 'name';
    cols.push(col);
  }

  for(let i = 0; i < (cfg.bodyGapColumns || 0); i++) cols.push(blank());
  return cols;
}

/* --- 本体 ---
   input : { title, name, body }
   cfg   : きまり
   もどり値 : { pages, columns, chars, fixes }
   まい数は きめません。書いた ぶんだけ 1まいずつ ふえます。 */
function gyCompose(input, cfg){
  cfg = cfg || GY_DEFAULTS;
  const norm  = gyNormalize(input.body || '', cfg);
  const items = gyBuildItems(norm.paragraphs, cfg);
  const body  = gyPlace(items, cfg);
  const head  = gyHeadColumns(input.title, input.name, cfg);
  const all   = head.concat(body);

  const per   = cfg.columnsPerPage;
  const nPage = Math.max(1, Math.ceil(all.length / per));
  const pages = [];
  for(let i = 0; i < nPage; i++){
    const columns = all.slice(i * per, (i + 1) * per);
    while(columns.length < per) columns.push({ cells: new Array(cfg.charsPerColumn).fill(null) });
    pages.push({ columns });
  }

  /* 字数は「つかった マスの 数」で かぞえます
     （1マス つかう ものは 句読点も かぎかっこも 1字と 数える きまりに 合わせる）*/
  let chars = 0;
  for(const col of body){
    let last = -1;
    for(let i = col.cells.length - 1; i >= 0; i--) if(col.cells[i]){ last = i; break; }
    chars += last + 1;
  }

  return { pages, columns: all.length, chars, fixes: norm.fixes };
}

</script>
<script>
/* 原稿用紙ツール ― 保存のしくみ
   ・ファイルを そのまま ひらいた とき   … 端末の 中（localStorage）に 保存します
   ・Apps Script の ウェブアプリの とき   … Google スプレッドシートに 保存し、
     端末の 中にも 下書きを のこします（通信が 切れても 消えないように）。
     つながった ときに 自動で 送りなおします。 */

var gyStore = (function(){
'use strict';

const K_SET  = 'genkou-youshi/settings';
const K_DOC  = 'genkou-youshi/doc';
const K_PEND = 'genkou-youshi/pending';

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

const hasGas = (typeof google !== 'undefined' && google.script && google.script.run);

const S = {
  mode     : hasGas ? 'gas' : 'local',
  user     : '',
  isTeacher: !hasGas,      /* ファイルを そのまま ひらいた ときは だれでも 設定できる。
                              Apps Script の ときは サーバーが 先生かどうかを かえす */
  status   : '',
  onStatus : null,
  _set     : null,
  _doc     : null,
  _pend    : null,
  _timer   : null,
  _sending : false
};

function say(t){ S.status = t; if(S.onStatus) S.onStatus(t); }

/* ---------- きまり（設定） ---------- */
S.getSettings = function(){
  if(!S._set) S._set = gyUpgradeSettings(lsGet(K_SET, null));
  return S._set;
};
S.setSettings = function(obj){
  S._set = obj;
  lsSet(K_SET, obj);
  if(S.mode === 'gas'){
    try{
      google.script.run
        .withSuccessHandler(() => say('きまりを ほぞんしました'))
        .withFailureHandler(() => say('きまりを 送れませんでした'))
        .gySaveSettings(obj);
    }catch(e){ say('きまりを 送れませんでした'); }
  }
};
S.resetSettings = function(){ S.setSettings(gyDefaultSettings()); return S._set; };

/* ---------- 書いた もの ---------- */
S.getDoc = function(){
  if(!S._doc) S._doc = lsGet(K_DOC, null) || { title:'', name:'', body:'', chars:0, pages:1, at:'' };
  return S._doc;
};
S.setDoc = function(doc){
  doc.at = new Date().toISOString();
  S._doc = doc;
  const okLocal = lsSet(K_DOC, doc);
  if(S.mode === 'local'){
    say(okLocal ? 'この たんまつに ほぞん' : 'ほぞんできません');
    return;
  }
  S._pend = doc;
  lsSet(K_PEND, doc);
  say('ほぞん中…');
  clearTimeout(S._timer);
  S._timer = setTimeout(flush, 800);
};

/* ---------- Apps Script へ 送る ---------- */
function flush(){
  if(S.mode !== 'gas' || S._sending || !S._pend) return;
  const doc = S._pend;
  S._sending = true;
  try{
    google.script.run
      .withSuccessHandler(() => {
        S._sending = false;
        if(S._pend === doc){ S._pend = null; lsSet(K_PEND, null); say('ほぞんしました'); }
        else setTimeout(flush, 100);
      })
      .withFailureHandler(() => {
        S._sending = false;
        say('ほぞんまち（つながったら 送ります）');
        setTimeout(flush, 15000);
      })
      .gySaveDoc(doc);
  }catch(e){
    S._sending = false;
    say('ほぞんまち（つながったら 送ります）');
    setTimeout(flush, 15000);
  }
}

/* ---------- はじめに 1回 ---------- */
S.init = function(done){
  S._pend = lsGet(K_PEND, null);
  S.getSettings();
  S.getDoc();
  if(S.mode !== 'gas'){ say(''); done(); return; }

  say('よみこみ中…');
  try{
    google.script.run
      .withSuccessHandler(function(res){
        if(res){
          S.user = res.user || '';
          S.isTeacher = !!res.isTeacher;
          if(res.settings){ S._set = gyUpgradeSettings(res.settings); lsSet(K_SET, S._set); }
          if(res.doc){
            /* 端末の 下書きの ほうが 新しければ そちらを のこす */
            const mine = lsGet(K_DOC, null);
            const use = (mine && mine.at && mine.at > (res.doc.at || '')) ? mine : res.doc;
            S._doc = use; lsSet(K_DOC, use);
          }
        }
        say('');
        flush();
        done();
      })
      .withFailureHandler(function(){
        say('つながりません（この たんまつに ほぞんします）');
        done();
      })
      .gyLoad();
  }catch(e){
    say('つながりません（この たんまつに ほぞんします）');
    done();
  }
};

return S;
})();

</script>
<script>
/* 原稿用紙ツール ― 画面の うごき */

(function(){
'use strict';

const $ = id => document.getElementById(id);
const el = {
  title:$('inTitle'), name:$('inName'), body:$('inBody'),
  sheets:$('sheets'), count:$('count'), fixes:$('fixes'),
  note:$('note'), save:$('save'),
  rowTitle:$('rowTitle'), rowName:$('rowName'),
  btnPrint:$('btnPrint'), btnFix:$('btnFix'), btnSet:$('btnSet'),
  printSize:$('printSize'),

  panel:$('settings'), btnCloseSet:$('btnCloseSet'),
  setChars:$('setChars'), setCols:$('setCols'),
  setTitleOn:$('setTitleOn'), setTitleAlign:$('setTitleAlign'), setTitleIndent:$('setTitleIndent'),
  setNameOn:$('setNameOn'), setNameBottom:$('setNameBottom'), setNameGap:$('setNameGap'),
  setBodyGap:$('setBodyGap'), bodyGapHint:$('bodyGapHint'), setParaIndent:$('setParaIndent'),
  setNumbers:$('setNumbers'), setDecimal:$('setDecimal'), setLatin:$('setLatin'),
  setHang:$('setHang'), setHangStyle:$('setHangStyle'), setSmallKana:$('setSmallKana'),
  setKuten:$('setKuten'), setDialogue:$('setDialogue'),
  setDialogueIndent:$('setDialogueIndent'), setAfterQuote:$('setAfterQuote'),
  setBangSpace:$('setBangSpace'), setEllipsis:$('setEllipsis'), setPair:$('setPair'),
  setPushOpen:$('setPushOpen'), setWrapTitle:$('setWrapTitle'),
  setCode:$('setCode'), btnCodeOut:$('btnCodeOut'), btnCodeIn:$('btnCodeIn'),
  btnReset:$('btnReset'), setMsg:$('setMsg')
};

let cfg   = null;   // いまの きまり
let raf   = null;
let chars = 0;      // いまの 字数（先生の シートにも のせる）
let pages = 1;      // いまの まい数

/* ================= ほぞん ================= */
let saveTimer = null;
function saveDoc(){
  if(!cfg) return;
  gyStore.setDoc({
    title:el.title.value, name:el.name.value, body:el.body.value,
    chars:chars, pages:pages
  });
}
function saveSoon(){
  clearTimeout(saveTimer);
  el.save.textContent = 'ほぞん中…';
  saveTimer = setTimeout(saveDoc, 600);
}

/* ================= 原稿用紙を 出す ================= */

/* マスの 大きさを きめる。
   行の わく線（左右 1.5px ずつ）と マスの しきり線（1px）も 数に 入れないと
   A4 から はみ出して しまうので、そのぶんを ひいてから わりつけます。 */
function fitCell(w, h, M, N, bCol, bCell){
  const byW = (w - M * bCol * 2)               / (M * 1.18 - 0.18 + 1.4);
  const byH = (h - (N - 1) * bCell - bCol * 2) / (N + 1.4);
  return Math.min(byW, byH);
}

function sizeCells(){
  const N = cfg.charsPerColumn, M = cfg.columnsPerPage;
  const box  = el.sheets.getBoundingClientRect();
  const w    = Math.max(240, box.width  - 40);
  const h    = Math.max(240, box.height - 40);
  const cell = Math.max(11, Math.min(fitCell(w, h, M, N, 1.5, 1), 34));
  /* いんさつ：A4（よゆうを みて 182mm × 252mm）／ 1.5px=0.397mm、1px=0.265mm */
  const mm = fitCell(182, 252, M, N, 0.397, 0.265);
  el.printSize.textContent =
    ':root{ --cell:' + cell.toFixed(2) + 'px; }\n' +
    '@media print{ :root{ --cell:' + mm.toFixed(3) + 'mm; } }';
}

/* 1つの マスに 字を 入れる。
   ・ふつうの マス                … 1字を まんなかに
   ・アルファベット（小文字）       … 1マスに 2字、よこ向きに
   ・詰めた マス（「た。」「けっ」） … もとの 字は そのままの 大きさ、あとの 字は 小さく 右下に
   ・句読点だけの マス（「。」」）   … 2つとも 小さく たてに ならべる   */
function fillCell(d, cell){
  const text  = cell.text;
  const chars = Array.from(text);
  const mkSpan = ch => {
    const s = document.createElement('span');
    s.textContent = ch;
    const k = gyCharClass(ch);
    if(k) s.className = k;
    return s;
  };

  if(cell.cls === 'lat2'){            // 小文字は 1マスに 2字（よこ向き）
    d.classList.add('lat2');
    const s = document.createElement('span');
    s.className = 'latpair';
    s.textContent = text;
    d.appendChild(s);
    return;
  }
  if(cell.cls === 'lat1'){            // 大文字は 1マスに 1字
    d.classList.add('lat1');
    const s = document.createElement('span');
    s.textContent = text;
    d.appendChild(s);
    return;
  }

  if(chars.length === 1){ d.appendChild(mkSpan(chars[0])); return; }

  if(GY_NO_LINE_START.indexOf(chars[0]) >= 0){   // 「。」」のような 句読点だけの マス
    d.classList.add('stack');
    for(const ch of chars) d.appendChild(mkSpan(ch));
    return;
  }
  d.classList.add('hang');                        // 「た。」のような 詰めた マス
  const main = mkSpan(chars[0]);
  main.classList.add('main');
  d.appendChild(main);
  const tail = document.createElement('div');
  tail.className = 'tail';
  for(let i = 1; i < chars.length; i++){
    const s = mkSpan(chars[i]);
    /* 小さい字は 句読点より 大きめに（読めるように） */
    if(GY_SMALL_KANA.indexOf(chars[i]) >= 0) s.classList.add('tk');
    tail.appendChild(s);
  }
  d.appendChild(tail);
}

function render(){
  const res = gyCompose({ title:el.title.value, name:el.name.value, body:el.body.value }, cfg);
  sizeCells();

  const frag = document.createDocumentFragment();
  res.pages.forEach((pg, i) => {
    const sheet = document.createElement('div');
    sheet.className = 'sheet' + (cfg.hangStyle === 'outside' ? ' hang-out' : '');
    const label = document.createElement('div');
    label.className = 'sheet-no';
    label.textContent = (i + 1) + ' / ' + res.pages.length + ' まい目';
    for(const col of pg.columns){
      const c = document.createElement('div');
      c.className = 'col';
      for(const cell of col.cells){
        const d = document.createElement('div');
        d.className = 'cell'
          + (cell && cell.fix  ? ' fix'  : '')
          + (cell && cell.note ? ' note' : '');
        if(cell){
          fillCell(d, cell);
          const why = [];
          if(cell.note) why.push(cell.note);
          if(cell.fix && GY_FIX_LABEL[cell.fix]) why.push(GY_FIX_LABEL[cell.fix]);
          if(why.length) d.title = why.join(' / ');
        }
        c.appendChild(d);
      }
      sheet.appendChild(c);
    }
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.appendChild(sheet);
    wrap.appendChild(label);
    frag.appendChild(wrap);
  });
  el.sheets.innerHTML = '';
  el.sheets.appendChild(frag);

  chars = res.chars;
  pages = res.pages.length;
  el.count.textContent = res.chars + '字・' + pages + 'まい';
  el.note.textContent  = '1まい ' + (cfg.charsPerColumn * cfg.columnsPerPage) + '字（' +
                         cfg.charsPerColumn + '字 × ' + cfg.columnsPerPage + '行）';
  el.fixes.innerHTML = '';
  for(const k in res.fixes){
    if(!GY_FIX_LABEL[k]) continue;
    const d = document.createElement('div');
    d.className = 'fix-item';
    d.textContent = GY_FIX_LABEL[k] + '（' + res.fixes[k] + 'か所）';
    el.fixes.appendChild(d);
  }
}

function renderSoon(){
  if(raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(render);
}

/* ================= 先生用の せってい ================= */
function headColumns(){
  return (cfg.title.enabled ? 1 : 0) + (cfg.name.enabled ? 1 : 0);
}
function bodyGapHint(){
  const start = headColumns() + (cfg.bodyGapColumns || 0) + 1;
  el.bodyGapHint.textContent = '本文は ' + start + '行目から はじまります。';
}

function loadSettingsForm(){
  el.setChars.value       = cfg.charsPerColumn;
  el.setCols.value        = cfg.columnsPerPage;
  el.setTitleOn.checked   = !!cfg.title.enabled;
  el.setTitleAlign.value  = cfg.title.align;
  el.setTitleIndent.value = cfg.title.indent;
  el.setNameOn.checked    = !!cfg.name.enabled;
  el.setNameBottom.value  = cfg.name.bottomGap;
  el.setNameGap.value     = cfg.name.gapBetween;
  el.setBodyGap.value     = String(cfg.bodyGapColumns || 0);
  el.setParaIndent.value  = cfg.paragraphIndent;
  el.setNumbers.value     = cfg.numbers;
  el.setDecimal.checked   = !!cfg.decimalNakaguro;
  el.setLatin.value       = cfg.latinStyle;
  el.setHang.checked      = !!cfg.hangPunctuation;
  el.setHangStyle.value   = cfg.hangStyle;
  el.setSmallKana.checked = !!cfg.hangSmallKana;
  el.setKuten.checked     = !!cfg.combineKutenBracket;
  el.setDialogue.checked  = !!cfg.dialogueNewline;
  el.setDialogueIndent.checked = !!cfg.dialogueParagraphIndent;
  el.setAfterQuote.value  = cfg.quoteNewline;
  el.setBangSpace.checked = !!cfg.spaceAfterBangQuestion;
  el.setEllipsis.checked  = !!cfg.ellipsisTwoCells;
  el.setPair.checked      = !!cfg.keepPairTogether;
  el.setPushOpen.checked  = !!cfg.pushOpenBracket;
  el.setWrapTitle.checked = !!cfg.wrapLongTitle;
  bodyGapHint();
}

function num(input, min, max, now){
  const v = parseInt(input.value, 10);
  if(!isFinite(v)) return now;
  return Math.min(max, Math.max(min, v));
}

function applySettingsForm(){
  cfg.charsPerColumn = num(el.setChars, 4, 40, cfg.charsPerColumn);
  cfg.columnsPerPage = num(el.setCols,  2, 40, cfg.columnsPerPage);
  cfg.title.enabled  = el.setTitleOn.checked;
  cfg.title.align    = el.setTitleAlign.value;
  cfg.title.indent   = num(el.setTitleIndent, 0, cfg.charsPerColumn, cfg.title.indent);
  cfg.name.enabled   = el.setNameOn.checked;
  cfg.name.bottomGap = num(el.setNameBottom, 0, cfg.charsPerColumn, cfg.name.bottomGap);
  cfg.name.gapBetween= num(el.setNameGap, 0, 5, cfg.name.gapBetween);
  cfg.bodyGapColumns = parseInt(el.setBodyGap.value, 10) || 0;
  cfg.paragraphIndent= num(el.setParaIndent, 0, 3, cfg.paragraphIndent);

  cfg.numbers               = el.setNumbers.value;
  cfg.decimalNakaguro       = el.setDecimal.checked;
  cfg.latinStyle            = el.setLatin.value;
  cfg.hangPunctuation       = el.setHang.checked;
  cfg.hangStyle             = el.setHangStyle.value;
  cfg.hangSmallKana         = el.setSmallKana.checked;
  cfg.combineKutenBracket   = el.setKuten.checked;
  cfg.dialogueNewline       = el.setDialogue.checked;
  cfg.dialogueParagraphIndent= el.setDialogueIndent.checked;
  cfg.quoteNewline          = el.setAfterQuote.value;
  cfg.spaceAfterBangQuestion= el.setBangSpace.checked;
  cfg.ellipsisTwoCells      = el.setEllipsis.checked;
  cfg.keepPairTogether      = el.setPair.checked;
  cfg.pushOpenBracket       = el.setPushOpen.checked;
  cfg.wrapLongTitle         = el.setWrapTitle.checked;

  el.rowTitle.style.display = cfg.title.enabled ? '' : 'none';
  el.rowName .style.display = cfg.name.enabled  ? '' : 'none';

  bodyGapHint();
  gyStore.setSettings(cfg);
  renderSoon();
}

function msg(t){ el.setMsg.textContent = t; }

/* ---- せっていコード（ほかの 端末に くばる）---- */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(b64.replace(/\s+/g, ''));
  const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

/* ================= できごと ================= */
['input','change'].forEach(ev => {
  el.title.addEventListener(ev, () => { renderSoon(); saveSoon(); });
  el.name .addEventListener(ev, () => { renderSoon(); saveSoon(); });
  el.body .addEventListener(ev, () => { renderSoon(); saveSoon(); });
});

el.btnPrint.addEventListener('click', () => window.print());
el.btnFix.addEventListener('click', () => {
  const on = el.btnFix.getAttribute('aria-pressed') === 'true';
  el.btnFix.setAttribute('aria-pressed', on ? 'false' : 'true');
  document.body.classList.toggle('nofix', on);
});
el.btnSet.addEventListener('click', () => { el.panel.hidden = false; loadSettingsForm(); renderSoon(); });
el.btnCloseSet.addEventListener('click', () => { el.panel.hidden = true; renderSoon(); });

[ el.setChars, el.setCols, el.setTitleOn, el.setTitleAlign, el.setTitleIndent,
  el.setNameOn, el.setNameBottom, el.setNameGap, el.setBodyGap, el.setParaIndent,
  el.setNumbers, el.setDecimal, el.setLatin, el.setHang, el.setHangStyle,
  el.setSmallKana, el.setKuten, el.setDialogue, el.setDialogueIndent, el.setAfterQuote,
  el.setBangSpace, el.setEllipsis, el.setPair, el.setPushOpen, el.setWrapTitle
].forEach(x => x.addEventListener('change', applySettingsForm));

el.btnCodeOut.addEventListener('click', () => {
  try{
    el.setCode.value = b64enc(JSON.stringify(cfg));
    el.setCode.select();
    msg('このコードを 児童の 端末で 貼りつけて「読みこむ」を おします');
  }catch(e){ msg('コードを 作れませんでした'); }
});
el.btnCodeIn.addEventListener('click', () => {
  try{
    const obj = JSON.parse(b64dec(el.setCode.value));
    if(!obj || !obj.charsPerColumn) throw new Error('形が ちがいます');
    cfg = gyUpgradeSettings(obj);
    gyStore.setSettings(cfg);
    loadSettingsForm();
    el.rowTitle.style.display = cfg.title.enabled ? '' : 'none';
    el.rowName .style.display = cfg.name.enabled  ? '' : 'none';
    renderSoon();
    msg('読みこみました');
  }catch(e){ msg('コードが ちがうようです'); }
});
el.btnReset.addEventListener('click', () => {
  if(!confirm('きまりを はじめの ものに もどしますか。書いた 文章は のこります。')) return;
  cfg = gyStore.resetSettings();
  loadSettingsForm();
  el.rowTitle.style.display = cfg.title.enabled ? '' : 'none';
  el.rowName .style.display = cfg.name.enabled  ? '' : 'none';
  renderSoon();
  msg('もどしました');
});

window.addEventListener('resize', renderSoon);
window.addEventListener('beforeunload', saveDoc);

/* ================= はじまり ================= */
gyStore.onStatus = t => { el.save.textContent = t || '　'; };
gyStore.init(function(){
  cfg = gyStore.getSettings();
  if(!gyStore.isTeacher){ el.btnSet.hidden = true; el.panel.hidden = true; }
  const d = gyStore.getDoc();
  el.title.value = d.title || '';
  el.name .value = d.name  || '';
  el.body .value = d.body  || '';
  el.rowTitle.style.display = cfg.title.enabled ? '' : 'none';
  el.rowName .style.display = cfg.name.enabled  ? '' : 'none';
  loadSettingsForm();
  render();
});

})();

</script>
