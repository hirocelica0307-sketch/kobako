function exportPerson(stuId){
  const st = S.b.students.find(x=>x['児童ID']===stuId);
  const subs = subjectsWithOpps().filter(s=>takes(stuId, s['教科ID']));
  const blocks = [];
  const cells = (r, sid)=>!r ? ['','',''] : r.exc ? ['除外','',''] : r.abs ? ['欠席','',''] :
    [r.raw+'/'+r.max, String(Math.round(r.pct)), gradeOf(r.pct, sid)||''];
  subs.forEach(s=>{
    const g = calcStu(stuId, s['教科ID'], PV.term);
    if (!KAN_ORDER.some(k=>g[k].t!=null || g[k].m!=null)) return;
    const testList = oppsOfSubject(s['教科ID'], PV.term, 'テスト');
    const usedK = KAN_ORDER.filter(k=>testList.some(x=>faces(x.o).some(f=>f.k===k)));
    const header = ['実施日','単元','テスト名'];
    usedK.forEach(k=>header.push(KAN_SHORT[k]+'点', KAN_SHORT[k]+'%', KAN_SHORT[k]+'評価'));
    header.push('合計点','合計%','合計評価');
    const rows = testList.map(x=>{
      const fs = faces(x.o), split = isSplit(x.o);
      const r = [fmtDate(x.o['日付'])||x.o['学期'],
                 split ? splitUnitNames(x.o).join(' / ') : (x.u?x.u['単元名']:''),
                 split ? fs.map(f=>faceName(x.o,f)).join(' / ') : x.o['機会名']];
      usedK.forEach(k=>{
        const kf = fs.filter(z=>z.k===k);
        r.push(...(kf.length ? cells(totalOf(x.o, stuId, kf), s['教科ID']) : ['','','']));
      });
      r.push(...cells(oppTotal(x.o, stuId), s['教科ID']));
      return r;
    });
    if (rows.length) blocks.push({heading:s['教科名']+' テストの記録', header, rows});
    const kr = KAN_ORDER.filter(k=>g[k].t!=null || g[k].m!=null).map(k=>{
      const x = g[k], f = finalOf(x, getOv(stuId, s['教科ID'], k, PV.term));
      return [KAN_FULL[k],
              x.t!=null?x.tRaw+'/'+x.tMax:'', x.t!=null?String(x.t):'', x.tG||'', String(x.tN),
              x.m!=null?x.mRaw+'/'+x.mMax:'', x.m!=null?String(x.m):'', x.mG||'', String(x.mN),
              f.g||'', String(x.tAbs+x.mAbs), String(x.tExc+x.mExc)];
    });
    if (kr.length) blocks.push({heading:s['教科名']+' 観点別のまとめ',
      header:['観点','テスト点','テスト%','テスト評価','テスト件数','見取り点','見取り%','見取り評価','見取り件数','最終評価','欠席','除外'], rows:kr});
  });
  const memos = [];
  S.b.opps.forEach(o=>{
    if (!takes(stuId, o['教科ID'])) return;
    faces(o).forEach(f=>{
      const r = recOf(o, stuId, f);
      if (r && r.memo) memos.push([fmtDate(o['日付'])||o['学期'], faceName(o,f), KAN_FULL[f.k], r.memo]);
    });
  });
  if (memos.length) blocks.push({heading:'見取りメモ', header:['日付','テスト・見取り','観点','メモ'], rows:memos});
  if (!blocks.length){ alertBox('出力できません', 'この子の記録がまだありません。'); return; }
  ovl('Excelファイルを作成中…');
  call('exportKojin', {
    title: `${st['名前']} 個人シート(${PV.term}) - ${cls()['クラス名']}`,
    note: 'テストと見取りはそれぞれ100%で評価 / 欠席・除外は平均に入れていません',
    blocks
  }).then(r=>{ unovl(); showDownload(r.url); }).catch(fail('出力できませんでした'));
}

function toggleGuide(i){ GOPEN[i] = !GOPEN[i]; render(); }
function guideAll(v){ GUIDE.forEach((_,i)=>GOPEN[i]=v); render(); }
function vGuide(){
  if (!Object.keys(GOPEN).length) GOPEN[0] = true;
  const back = S.b ? `go('home')` : `go('start')`;
  return `
    <div class="bar">
      <button class="btn sec sm" onclick="${back}">‹ 戻る</button>
      <h2>使い方</h2>
      <span class="grow"></span>
      <button class="btn sec sm" onclick="guideAll(true)">すべて開く</button>
      <button class="btn sec sm" onclick="guideAll(false)">すべて閉じる</button>
    </div>
    <p class="sub" style="margin-bottom:14px">見出しを押すと開きます。はじめての方は上から順に読んでみてください。</p>
    ${GUIDE.map((m,i)=>`<div class="panel foldcard ${GOPEN[i]?'open':''}" style="margin-bottom:10px">
        <button class="foldhead" aria-expanded="${!!GOPEN[i]}" onclick="toggleGuide(${i})">
          <span class="arw">▸</span>
          <span class="sub" style="font-weight:800;color:var(--ai);width:26px">${String(i+1).padStart(2,'0')}</span>
          <h3 style="font-size:15.5px">${esc(m.t)}</h3>
        </button>
        <div class="foldbody" style="line-height:1.85">${m.b}</div>
      </div>`).join('')}`;
}

function afterOk(msg){ return ()=>reloadBundle().then(()=>{ unovl(); render(); if (msg) toast(msg); }); }
function saveBase(v){
  ovl('保存中…');
  call('saveSettings', {kv:{'既定評価':v}}).then(afterOk('保存しました')).catch(fail('保存できませんでした'));
}
function saveSteps(v){
  ovl('保存中…');
  call('saveSettings', {kv:{'段階数値':JSON.stringify(v)}}).then(afterOk()).catch(fail('保存できませんでした'));
}
function addStep(g){
  const v = num($('stIn_'+g).value);
  if (v==null || v<0 || v>1000){ toast('0〜1000の数字で入力してください'); return; }
  const sv = stepValues();
  if ((sv[g]||[]).indexOf(v)>=0){ toast('すでに登録されています'); return; }
  sv[g] = (sv[g]||[]).concat([v]).sort((a,b)=>b-a);
  saveSteps(sv);
}
function delStep(g, v){
  const sv = stepValues();
  sv[g] = (sv[g]||[]).filter(x=>x!==v);
  saveSteps(sv);
}
function applyAllBounds(){
  const a = num($('bkA').value), b = num($('bkB').value);
  if (a==null||b==null||a<0||a>100||b<0||b>100){ toast('AとBの基準を0〜100で入力してください'); return; }
  if (b>=a){ toast('Bの基準はAの基準より小さくしてください'); return; }
  askYes('全教科に適用', `すべての教科の基準を「A:${a}%以上 / B:${b}%以上」に変更します。個別設定していた値も上書きされます。`).then(yes=>{
    if (!yes) return;
    ovl('適用中…');
    call('saveSubjectsBulk', {a:String(a), b:String(b)}).then(afterOk(`全教科を A:${a}% / B:${b}% にしました`))
      .catch(fail('適用できませんでした'));
  });
}

function bulkAddRoster(){
  const lines = $('bulkRoster').value.split('\n').map(s=>s.trim()).filter(s=>s);
  if (!lines.length){ toast('名前を入力してください'); return; }
  if (lines.length > 60){ toast('一度に登録できるのは60人までです'); return; }
  let maxNo = Math.max(0, ...S.b.students.map(s=>num(s['出席番号'])||0));
  const list = lines.map(raw=>{
    const line = z2h(raw);
    const m = line.match(/^(\d+)[\s,、\t]+(.+)$/);
    if (m) return {no:m[1], name:m[2].trim().slice(0,20)};
    maxNo++; return {no:String(maxNo), name:line.slice(0,20)};
  });
  ovl(`${list.length}人を登録中…`);
  call('addStudentsBulk', {list}).then(afterOk(`${list.length}人を登録しました`))
    .catch(fail('登録できませんでした'));
}

      <h2 style="margin:12px 0 8px">評価ノート</h2>

  }
  const t = loadToken();
  if (!t){ showLock().catch(bootFail); return; }

  S.token = t;
  reloadBundle().then(()=>{ go(S.b ? 'home' : 'start'); })
    .catch(e=>{ S.token = null; saveToken(null); (e && e.auth ? showLock() : Promise.reject(e)).catch(bootFail); });
}
window.addEventListener('load', boot);
</script>
