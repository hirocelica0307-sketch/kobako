function copyText(text){
  const done = ()=>{ shutModal(); toast('コピーしました。Ctrl+V で貼り付けられます'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>copyFallback(text, done));
  } else copyFallback(text, done);
}
function copyFallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  if (ok){ done(); return; }
  modal(`<h3 style="margin-bottom:8px">手動でコピーしてください</h3>
    <p class="sub" style="margin-bottom:10px">下の欄をクリック(全選択されます)して Ctrl+C でコピーしてください。</p>

    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" onclick="shutModal()">閉じる</button></div>`, true);
}

            <td style="font-weight:600">${esc(nameCell)}${split?' <span class="tag gray">表裏違い</span>':''}</td>
            ${usedKans.map(k=>{
              const f = fs.find(z=>z.k===k);
              if (!f) return `<td class="nores" style="border-left:1px solid var(--line)">−</td><td class="nores">−</td><td class="nores">−</td>`;
              return cell3(faceResult(x.o, f, stuId), s['教科ID']).replace('<td', '<td style="border-left:1px solid var(--line)"');
            }).join('')}
            ${(()=>{
              if (!t) return `<td class="nores" style="border-left:1px solid var(--line)" colspan="3">ー</td>`;
              if (t.exc) return `<td class="nores" style="border-left:1px solid var(--line)" colspan="3">除外</td>`;
              if (t.abs) return `<td style="border-left:1px solid var(--line);color:var(--shu);font-weight:700" colspan="3">欠席</td>`;
              return `<td style="border-left:1px solid var(--line);font-weight:800">${t.raw}<span class="sub">/${t.max}</span></td>
                      <td><span class="pchip">${Math.round(t.pct)}%</span></td><td>${gBadge(gradeOf(t.pct, s['教科ID']))}</td>`;
            })()}
            ${showAvg?`<td class="avg-col sub" style="text-align:right">${cavg!=null?Math.round(cavg*10)/10+'%':'ー'}</td>`:''}
          </tr>`;
        }).join('')}
        <tr class="sumrow">${anyDate?'<td></td>':''}<td></td><td>テストの合計</td>
          ${usedKans.map(k=>{
            const x = g[k];
            return `<td style="border-left:1px solid var(--line)">${x.t!=null?x.tRaw+'/'+x.tMax:'ー'}</td>
                    <td>${x.t!=null?Math.round(x.t)+'%':''}</td><td>${x.t!=null?gBadge(x.tG):''}</td>`;
          }).join('')}
          <td style="border-left:1px solid var(--line)">${testPct!=null?sumRaw+'/'+sumMax:'ー'}</td>
          <td>${testPct!=null?Math.round(testPct)+'%':''}</td>
          <td>${testPct!=null?gBadge(gradeOf(testPct, s['教科ID'])):''}</td>
          ${showAvg?'<td class="avg-col"></td>':''}</tr>
      </table></div>` : '';

    const mitBlock = !C.mitori || !mitList.length ? '' : `
      <div class="plabel">授業のようす(見取り)</div>
      <div class="row" style="gap:16px;flex-wrap:wrap">
        ${KAN_ORDER.map(k=>{ const x=g[k]; if (x.m==null) return '';
          return `<span style="font-size:13px"><b>${KAN_SHORT[k]}</b> ${x.mRaw}/${x.mMax} ・ ${x.m}% ${x.mN}回</span>`; }).join('')}
      </div>
      ${teacher && C.mitoriDetail ? `<div class="no-print" style="margin-top:6px"><table class="psheet">
        <tr><th>日付</th><th>見取り名</th><th>観点</th><th style="text-align:right">点</th></tr>
        ${mitList.map(x=>faces(x.o).map(f=>{
          const r = getRec(x.o['機会ID'], stuId, f.k);
          if (!r || (r.raw==='' && !r.state)) return '';
          const v = r.state===ST_ABS ? '<span style="color:var(--shu)">欠</span>'
                  : r.state===ST_EXC ? '<span class="sub">除外</span>'
                  : esc(r.raw)+'/'+faceMax(f,r);
          return `<tr><td class="sub">${esc(fmtDate(x.o['日付'])||x.o['学期'])}</td><td>${esc(faceName(x.o,f))}</td><td>${KAN_SHORT[f.k]}</td><td style="text-align:right;font-weight:700">${v}</td></tr>`;
        }).join('')).join('')}</table></div>` : ''}`;

    const line = (x, which)=>{
      const pct = which==='t' ? x.t : x.m;
      const g2  = which==='t' ? x.tG : x.mG;
      const raw = which==='t' ? x.tRaw : x.mRaw;
      const max = which==='t' ? x.tMax : x.mMax;
      const n   = which==='t' ? x.tN : x.mN;
      const thin= which==='t' ? x.tThin : x.mThin;
      const cls2= which==='t' ? 'ts' : 'ms';
      const lbl = which==='t' ? 'テ' : '見';
      if (pct==null) return `<div class="kline" style="margin-top:4px"><span class="src ${cls2}">${lbl}</span><span class="sub">記録なし</span></div>`;
      return `<div class="kline" style="margin-top:4px"><span class="src ${cls2}">${lbl}</span>
        <b style="min-width:66px">${raw}/${max}</b><b style="min-width:42px">${pct}%</b>${gBadge(g2)}
        <span class="sub" style="font-size:11px">${n}件${thin?' ⚠少ない':''}</span></div>`;
    };
    const kantenBlock = !C.kanten ? '' : `
      <div class="plabel">観点別のまとめ(点数 → ％ → 評価)</div>
      ${KAN_ORDER.map(k=>{
        const x = g[k]; if (x.t==null && x.m==null) return '';
        const ov = getOv(stuId, s['教科ID'], k, PV.term);
        let growth = '';
        if (prevTerm(PV.term) && C.growth){
          const pt = prevTerm(PV.term);
          const pv = calcStu(stuId, s['教科ID'], pt)[k];
          const before = pv.t!=null ? pv.t : pv.m, now = x.t!=null ? x.t : x.m;
          if (before!=null && now!=null){
            const d = Math.round((now-before)*10)/10;
            const col = d>0?'var(--ko)':d<0?'var(--shu)':'var(--sub)';
            growth = `<span class="sub" style="font-size:11px;margin-left:8px">${pt} ${before}% → <span style="color:${col};font-weight:700">${d>0?'+':''}${d}</span></span>`;
          }
        }
        return `<div style="margin-top:9px;padding:8px 10px;background:#F7F8F4;border-radius:8px">
          <div class="row"><b style="width:56px">${KAN_SHORT[k]}</b>
            <span class="sub" style="font-size:11.5px">最終評価</span>${finalBadge(x, ov)}${growth}</div>
          ${line(x,'t')}${line(x,'m')}</div>`;
      }).join('')}`;

    const open = !!PV.open[s['教科ID']];
    return `<div class="panel foldcard ${open?'open':''}" style="margin-top:14px">
      <button class="foldhead" onclick="toggleSubjCard('${s['教科ID']}')">
        <span class="arw">▸</span>
        <h3>${esc(s['教科名'])}</h3>
        <span class="sub" style="font-size:12px">テスト ${testPct!=null?sumRaw+'/'+sumMax+' ('+Math.round(testPct)+'%)':'ー'}</span>
        <span class="grow"></span>
        ${C.badges ? KAN_ORDER.map(k=>{ const x=g[k]; if (x.t==null && x.m==null) return '';
          return `<span title="${KAN_FULL[k]}">${finalBadge(x, getOv(stuId, s['教科ID'], k, PV.term))}</span>`; }).join('') : ''}
      </button>
      <div class="foldbody">
        <div class="sub" style="font-size:11px;margin:6px 0 2px">A:${esc(s['A閾値'])}%以上 / B:${esc(s['B閾値'])}%以上</div>
        ${testTable}${mitBlock}${kantenBlock}
      </div></div>`;
  }).join('');
  return { cards, withData };
}

function exportPerson(stuId){
  const st = S.b.students.find(x=>x['児童ID']===stuId);
  const subs = shownSubjects().filter(s=>S.b.opps.some(o=>o['教科ID']===s['教科ID']) && takes(stuId, s['教科ID']));
  const blocks = [];
  subs.forEach(s=>{
    const g = calcStu(stuId, s['教科ID'], PV.term);
    if (!KAN_ORDER.some(k=>g[k].t!=null || g[k].m!=null)) return;
    const testList = oppsOfSubject(s['教科ID'], PV.term, 'テスト');
    const usedKans = KAN_ORDER.filter(k=>testList.some(x=>faces(x.o).some(f=>f.k===k)));
    const header = ['実施日','単元','テスト名'];
    usedKans.forEach(k=>header.push(KAN_SHORT[k]+'点', KAN_SHORT[k]+'%', KAN_SHORT[k]+'評価'));
    header.push('合計点','合計%','合計評価');
    const rows = testList.map(x=>{
      const fs = faces(x.o), split = isSplit(x.o);
      const r = [fmtDate(x.o['日付'])||x.o['学期'],
                 split ? splitUnitNames(x.o).join(' / ') : (x.u?x.u['単元名']:''),
                 split ? fs.map(f=>faceName(x.o,f)).join(' / ') : x.o['機会名']];
      usedKans.forEach(k=>{
        const f = fs.find(z=>z.k===k);
        if (!f){ r.push('','',''); return; }
        const fr = faceResult(x.o, f, stuId);
        if (!fr) r.push('','','');
        else if (fr.exc) r.push('除外','','');
        else if (fr.abs) r.push('欠席','','');
        else r.push(fr.raw+'/'+fr.max, String(Math.round(fr.pct)), gradeOf(fr.pct, s['教科ID'])||'');
      });
      const t = oppTotal(x.o, stuId);
      if (!t) r.push('','','');
      else if (t.exc) r.push('除外','','');
      else if (t.abs) r.push('欠席','','');
      else r.push(t.raw+'/'+t.max, String(Math.round(t.pct)), gradeOf(t.pct, s['教科ID'])||'');
      return r;
    });
    if (rows.length) blocks.push({heading:s['教科名']+' テストの記録', header, rows});
    const kr = KAN_ORDER.filter(k=>g[k].t!=null || g[k].m!=null).map(k=>{
      const x = g[k], f = finalOf(x, getOv(stuId, s['教科ID'], k, PV.term));
      return [KAN_FULL[k],
              x.t!=null?x.tRaw+'/'+x.tMax:'', x.t!=null?String(x.t):'', x.tG||'', String(x.tN),
              x.m!=null?x.mRaw+'/'+x.mMax:'', x.m!=null?String(x.m):'', x.mG||'', String(x.mN),
              f.g||'', String(x.tAbs+x.mAbs), String(x.tExc+x.mExc)];
    });
    if (kr.length) blocks.push({heading:s['教科名']+' 観点別のまとめ',
      header:['観点','テスト点','テスト%','テスト評価','テスト件数','見取り点','見取り%','見取り評価','見取り件数','最終評価','欠席','除外'], rows:kr});
  });
  const memos = [];
  S.b.opps.forEach(o=>faces(o).forEach(f=>{
    const r = getRec(o['機会ID'], stuId, f.k);
    if (r && r.memo) memos.push([fmtDate(o['日付'])||o['学期'], faceName(o,f), KAN_FULL[f.k], r.memo]);
  }));
  if (memos.length) blocks.push({heading:'見取りメモ', header:['日付','テスト・見取り','観点','メモ'], rows:memos});
  if (!blocks.length){ alertBox('出力できません', 'この子の記録がまだありません。'); return; }
  ovl('Excelファイルを作成中…');
  call('exportKojin', {
    title: `${st['名前']} 個人シート(${PV.term}) - ${cls()['クラス名']}`,
    note: 'テストと見取りはそれぞれ100%で評価 / 欠席・除外は平均に入れていません',
    blocks
  }).then(r=>{ unovl(); showDownload(r.url); })
    .catch(e=>{ unovl(); alertBox('出力エラー', e.message); });
}

function toggleGuide(i){ GOPEN[i] = !GOPEN[i]; render(); }
function guideAll(v){ GUIDE.forEach((_,i)=>GOPEN[i]=v); render(); }
function vGuide(){
  if (!Object.keys(GOPEN).length) GOPEN[0] = true;
  const back = S.b ? `go('home')` : `go('start')`;
  return `
    <div class="bar">
      <button class="btn sec sm" onclick="${back}">‹ 戻る</button>
      <h2>使い方</h2>
      <span class="grow"></span>
      <button class="btn sec sm" onclick="guideAll(true)">すべて開く</button>
      <button class="btn sec sm" onclick="guideAll(false)">すべて閉じる</button>
    </div>
    <p class="sub" style="margin-bottom:14px">見出しを押すと開きます。はじめての方は上から順に読んでみてください。</p>
    ${GUIDE.map((m,i)=>`<div class="panel foldcard ${GOPEN[i]?'open':''}" style="margin-bottom:10px">
        <button class="foldhead" onclick="toggleGuide(${i})">
          <span class="arw">▸</span>
          <span class="sub" style="font-weight:800;color:var(--ai);width:26px">${String(i+1).padStart(2,'0')}</span>
          <h3 style="font-size:15.5px">${esc(m.t)}</h3>
        </button>
        <div class="foldbody" style="line-height:1.85">${m.b}</div>
      </div>`).join('')}`;
}

        <span style="font-weight:400;color:var(--sub)">番号を自分で決めたいときだけ「1 青山はると」のように、番号と名前のあいだにスペースを入れてください。</span></p>
      <textarea id="bulkRoster" rows="4" style="width:100%" placeholder="青山はると&#10;井上さくら&#10;上田そうた&#10;(番号は入れなくてOK)"></textarea>

    const nm = setting('最終バックアップ名','');

    const d = daysSinceBackup();

      <h3 style="margin-bottom:6px">バックアップを作る</h3>
      <p class="sub" style="margin-bottom:12px">今の記録をまるごと控えたファイルを、マイドライブに作ります。ファイル名は<b>「評価ノート_バックアップ_日付」</b>です。<br>
        入力した点・単元・名簿・設定のすべてが入ります。月に1回を目安にどうぞ。</p>
      <div class="row" style="background:#F4F5F0;border-radius:8px;padding:12px 14px;margin-bottom:14px">
        <b>前回のバックアップ</b>
        ${at ? `<span>${esc(at)}${d!=null?`(${d}日前)`:''}</span>
               <span class="sub">${esc(nm)}</span>
               ${url?`<a class="jump" href="${esc(url)}" target="_blank" rel="noopener">開く</a>`:''}`
             : '<span class="sub">まだありません</span>'}
      </div>
      <button class="btn pri" onclick="runBackup()">バックアップを作成する</button>

      <h3 style="margin-bottom:6px">バックアップから読み込む(復元)</h3>
      <p class="sub" style="margin-bottom:12px">バックアップのファイルを開いて、アドレスバーのURLをそのまま貼り付けてください。<br>

      </div>

  if (SET==='pin'){
    body = `<div class="panel">
      <h3 style="margin-bottom:6px">合言葉を変える</h3>
      <p class="sub" style="margin-bottom:14px">アプリを開くときに聞かれる数字です。<b>毎回</b>必要になります(画面を再読み込みしたときも聞かれます)。</p>

      <table class="psheet">

      <p class="sub">スプレッドシートの「拡張機能 → Apps Script」を開き、関数の一覧から <b>resetPin</b> を選んで実行してください。合言葉が外れ、次にアプリを開いたときに決め直せます。記録は消えません。</p>
    </div>`;
  }
  if (SET==='cls'){
    const c = cls();
    body = `<div class="panel"><h3 style="margin-bottom:14px">クラス情報</h3>
      <div class="kv" style="max-width:420px">
        <label>クラス名</label><input id="ecName" value="${esc(c['クラス名'])}">

      <button class="btn pri sm" style="margin-top:14px" onclick="saveClsInfo()">保存</button></div>

      <p class="sub" style="margin-bottom:12px">先に <b>ファイル → コピーを作成</b> で1年分をまるごと保存しておくのがおすすめです。<br>このファイルは1クラス専用です。別のクラスを扱うときは、スプレッドシートをコピーして別ファイルとして使ってください。</p>
      <div class="row">
        <button class="btn sec" onclick="clearRecords()">記録だけ消す(単元・テストの枠は残す)</button>
        <span class="grow"></span>
        <button class="btn danger sm" onclick="resetAll()">すべて消して最初からやり直す</button>
      </div></div>
    <div class="panel"><h3 style="margin-bottom:6px">記入例を入れる</h3>
      <p class="sub" style="margin-bottom:12px">国語に「スイミー」「漢字の広場」と、<b>表と裏で単元が違うテスト</b>の例、見取りの例を作ります。使い方を試したいときに。</p>

function afterOk(msg){ return ()=>reloadBundle().then(()=>{ unovl(); render(); if (msg) toast(msg); }); }
function saveBase(){
  const el = document.querySelector('input[name="baseSel"]:checked');
  if (!el){ toast('どれか1つを選んでください'); return; }
  ovl('保存中…');
  call('saveSettings', {kv:{'既定評価':el.value}}).then(afterOk('保存しました'))
    .catch(e=>{ unovl(); alertBox('エラー', e.message); });
}
function saveSteps(v){
  ovl('保存中…');
  call('saveSettings', {kv:{'段階数値':JSON.stringify(v)}}).then(afterOk())
    .catch(e=>{ unovl(); alertBox('エラー', e.message); });
}
function addStep(g){
  const v = num($('stIn_'+g).value);
  if (v==null || v<0 || v>100){ toast('0〜100の数字で入力してください'); return; }
  const sv = stepValues();
  if ((sv[g]||[]).indexOf(v)>=0){ toast('すでに登録されています'); return; }
  sv[g] = (sv[g]||[]).concat([v]).sort((a,b)=>b-a);
  saveSteps(sv);
}
function delStep(g, v){
  const sv = stepValues();
  sv[g] = (sv[g]||[]).filter(x=>x!==v);
  saveSteps(sv);
}
function applyAllBounds(){
  const a = num($('bkA').value), b = num($('bkB').value);
  if (a==null||b==null||a<0||a>100||b<0||b>100){ toast('AとBの基準を0〜100で入力してください'); return; }
  if (b>=a){ toast('Bの基準はAの基準より小さくしてください'); return; }
  askYes('全教科に適用', `すべての教科の基準を「A:${a}%以上 / B:${b}%以上」に変更します。個別設定していた値も上書きされます。`).then(yes=>{
    if (!yes) return;
    ovl('適用中…');
    call('saveSubjectsBulk', {a:String(a), b:String(b)}).then(afterOk(`全教科を A:${a}% / B:${b}% にしました`))
      .catch(e=>{ unovl(); alertBox('エラー', e.message); });
  });
}
function toggleSubjShown(id, on){
  call('setSubjectVisible', {id, on}).then(()=>{
    const s = S.b.subjects.find(x=>x['教科ID']===id);
    if (s) s['有効'] = on ? '1' : '0';
    toast(on ? '表示するようにしました' : '隠しました(データは残っています)');
  }).catch(e=>alertBox('エラー', e.message));
}
function saveSubjRow(id){
  const name = $('sn_'+id).value.trim(), a = num($('sa_'+id).value), b = num($('sb_'+id).value), o = $('so_'+id).value.trim();
  if (!name){ toast('教科名を入力してください'); return; }
  if (a==null||b==null||a<0||a>100||b<0||b>100){ toast('基準は0〜100で入力してください'); return; }
  if (b>=a){ toast('Bの基準はAの基準より小さくしてください'); return; }
  ovl('保存中…');
  call('saveSubject', {id, name, order:o||'99', a:String(a), b:String(b)}).then(afterOk('保存しました'))
    .catch(e=>{ unovl(); alertBox('エラー', e.message); });
}
function addSubj(){
  const name = $('newSubj').value.trim();
  if (!name){ toast('教科名を入力してください'); return; }
  ovl('追加中…');
  call('saveSubject', {name, order:String(S.b.subjects.length+1)}).then(afterOk())
    .catch(e=>{ unovl(); alertBox('エラー', e.message); });
}
function removeSubj(id){
  const s = S.b.subjects.find(x=>x['教科ID']===id);
  if (!s) return;
  askYes('教科を削除', `「${s['教科名']}」を削除すると、この教科の単元・テスト・記録・最終評価もすべて消えます。元に戻せません。\n本当に削除しますか?`, '削除する').then(yes=>{
    if (!yes) return;
    ovl('削除中…');
    call('deleteSubject', {id}).then(afterOk('削除しました')).catch(e=>{ unovl(); alertBox('エラー', e.message); });
  });
}
function saveStuRow(id){
  const no = z2h($('rn_'+id).value).trim(), name = $('rm_'+id).value.trim();
  if (!name){ toast('名前を入力してください'); return; }
  if (num(no)==null){ toast('番号は数字で入力してください'); return; }
  ovl('保存中…');
  call('saveStudent', {id, no, name}).then(afterOk('保存しました'))
    .catch(e=>{ unovl(); alertBox('エラー', e.message); });
}
function removeStu(id){
  const st = S.b.students.find(x=>x['児童ID']===id);
  if (!st) return;
  askYes('児童を削除', `「${st['名前']}」の記録・最終評価・メモもすべて削除されます。転出などで消す場合のみ実行してください。\n本当に削除しますか?`, '削除する').then(yes=>{
    if (!yes) return;
    ovl('削除中…');
    call('deleteStudent', {id}).then(afterOk('削除しました')).catch(e=>{ unovl(); alertBox('エラー', e.message); });
  });
}
function renumber(){
  askYes('出席番号の振り直し', '今の並び順のまま、出席番号を1から振り直します。よろしいですか?').then(yes=>{
    if (!yes) return;
    ovl('振り直し中…');
    call('renumberStudents', {}).then(afterOk('番号を振り直しました')).catch(e=>{ unovl(); alertBox('エラー', e.message); });
  });
}
function bulkAddRoster(){
  const lines = $('bulkRoster').value.split('\n').map(s=>s.trim()).filter(s=>s);
  if (!lines.length){ toast('名前を入力してください'); return; }
  if (lines.length > 60){ toast('一度に登録できるのは60人までです'); return; }
  let maxNo = Math.max(0, ...S.b.students.map(s=>num(s['出席番号'])||0));
  const list = lines.map(raw=>{
    const line = z2h(raw);
    const m = line.match(/^(\d+)[\s,、\t]+(.+)$/);
    if (m) return {no:m[1], name:m[2].trim().slice(0,20)};
    maxNo++; return {no:String(maxNo), name:line.slice(0,20)};
  });
  ovl(`${list.length}人を登録中…`);
  call('addStudentsBulk', {list}).then(afterOk(`${list.length}人を登録しました`))
    .catch(e=>{ unovl(); alertBox('エラー', e.message); });
}
function saveClsInfo(){
  const name = $('ecName').value.trim(), nendo = $('ecNendo').value.trim();
  if (!name){ toast('クラス名を入力してください'); return; }
  ovl('保存中…');
  call('updateClass', {name, nendo}).then(afterOk('保存しました'))
    .catch(e=>{ unovl(); alertBox('エラー', e.message); });
}
function clearRecords(){
  askYes('記録だけ消す', '入力した点数・見取り・最終評価・メモをすべて消します。単元とテストの枠は残ります。\n先にファイルのコピーを作っておくことをおすすめします。', '記録を消す').then(yes=>{
    if (!yes) return;
    ovl('削除中…');
    call('clearRecords', {}).then(afterOk('記録を消しました')).catch(e=>{ unovl(); alertBox('エラー', e.message); });
  });
}
function resetAll(){
  askYes('すべて消す', 'クラス・名簿・教科・単元・テスト・記録のすべてを削除します。元に戻せません。', '削除する').then(yes=>{
    if (!yes) return;
    askYes('最終確認', '本当にすべて消しますか?この操作は取り消せません。', '完全に削除する').then(y2=>{
      if (!y2) return;
      ovl('削除中…');
      call('resetAll', {}).then(()=>reloadBundle()).then(()=>{ unovl(); go('start'); toast('すべて削除しました'); })
        .catch(e=>{ unovl(); alertBox('エラー', e.message); });
    });
  });
}
function runRestore(){
  const url = $('rsUrl') ? $('rsUrl').value.trim() : '';
  if (!url){ toast('バックアップのURLを貼り付けてください'); return; }
  askYes('バックアップから読み込む', '今このファイルに入っている記録は、すべて置き換わります。元に戻すには、読み込む前のバックアップが必要です。\n本当に読み込みますか?', '読み込む').then(yes=>{
    if (!yes) return;
    askYes('最終確認', '本当に置き換えますか?この操作は取り消せません。', '置き換える').then(y2=>{
      if (!y2) return;
      ovl('読み込み中…');
      call('restoreBackup', {url}).then(r=>reloadBundle().then(()=>{
        unovl(); go('home');
        alertBox('読み込みました', `「${r.name}」から ${r.rows} 行を読み込みました。`);
      })).catch(e=>{ unovl(); alertBox('読み込めませんでした', e.message); });
    });
  });
}
function changePin(){
  const f = readFields(['pnOld','pnNew','pnNew2']);
  if (!/^\d{4,6}$/.test(f.pnNew)){ toast('新しい合言葉は数字4〜6桁で決めてください'); return; }
  if (f.pnNew !== f.pnNew2){ toast('2回目が合いません'); return; }
  ovl('変更中…');
  call('setPin', {oldPin:f.pnOld, newPin:f.pnNew}).then(r=>{
    S.token = r.token;
    unovl(); render(); toast('合言葉を変えました');
  }).catch(e=>{ unovl(); alertBox('変更できませんでした', e.message); });
}
function addExample(){
  ovl('記入例を作成中…');
  call('createExample', {}).then(afterOk('記入例を追加しました')).catch(e=>{ unovl(); alertBox('エラー', e.message); });
}

/* ================= 起動 ================= */
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) flushSave(); });
window.addEventListener('beforeunload', e=>{
  if (Object.keys(S.queue).length || S.saveBusy){ flushSave(); e.preventDefault(); e.returnValue=''; }
});
function boot(){
  call('authState', {}).then(a=>{
    S.auth = a;
    if (a.hasPin || a.wait > 0){
      LK = { pin:'', pin2:'', step:1, msg: a.wait>0 ? `間違いが続いたため、あと${a.wait}秒お待ちください` : '', busy:false };
      S.view = 'lock'; render(); return null;
    }
    // まだ合言葉がないときは、決めてもらってから中に入る
    LK = { pin:'', pin2:'', step:1, msg:'', busy:false };
    S.view = 'lock'; render(); return null;
  }).catch(e=>{
    $('app').innerHTML = `<div class="panel" style="text-align:center">
      <h3>読み込みに失敗しました</h3>
      <p class="sub" style="margin:8px 0 16px">${esc(e.message)}</p>
      <button class="btn pri" onclick="location.reload()">再読み込み</button></div>`;
  });
}
function bootOld(){
  reloadBundle().then(()=>{ S.view = S.b ? 'home' : 'start'; render(); })
    .catch(e=>{
      $('app').innerHTML = `<div class="panel" style="text-align:center">
        <h3>読み込みに失敗しました</h3>
        <p class="sub" style="margin:8px 0 16px">${esc(e.message)}</p>
        <button class="btn pri" onclick="location.reload()">再読み込み</button></div>`;
    });
}
window.addEventListener('load', boot);
</script>
