<style>
/* ===== 配色:藍(あい)と朱(しゅ)の記録帳 ===== */
:root{
  --bg:#EAEBE6; --card:#FCFCFA; --ink:#1E2328; --sub:#6B7178; --line:#D4D7CE; --line2:#E6E8E1;
  --ai:#1F5D7A;  --ai-s:#E2EDF2;   /* 藍 = A・主要操作 */
  --ko:#5C7F4B;  --ko-s:#EAF0E5;   /* 苔 = B・見取り */
  --shu:#B4543A; --shu-s:#F7E9E4;  /* 朱 = 注意・削除 */
  /* 評価の色:A=青、C=赤。Bは色を付けない(多数を占めるBに目を奪われないため) */
  --gA:#1D6FB8; --gA-s:#E6F0F9; --gA-b:#B4CFE7;
  --gC:#C0392B; --gC-s:#FBEAE7; --gC-b:#EBBFB6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px;border:1px solid #C6CABE;border-radius:7px;
  padding:9px 11px;background:#fff;color:var(--ink);outline:none;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--ai);box-shadow:0 0 0 3px var(--ai-s)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:#C2C6BA;border-radius:5px}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* ===== 骨格 ===== */
#hdr{position:sticky;top:0;z-index:50;background:#FCFCFA;border-bottom:2px solid var(--ai);
  display:flex;align-items:center;gap:12px;padding:9px 20px}
#hdr .brand{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
#hdr .brand b{font-size:17px;letter-spacing:.06em}
#app{max-width:1220px;margin:0 auto;padding:20px 20px 90px}
#clsChip{font-size:13px;font-weight:700;color:var(--ai);background:var(--ai-s);border-radius:6px;padding:3px 10px}
#saveChip{margin-left:auto;font-size:12.5px;color:var(--sub)}
#saveChip.saving{color:var(--ai)}
#saveChip.err{color:var(--shu);font-weight:700;cursor:pointer}
.gear{font-size:19px;padding:8px 10px;border-radius:7px}
.gear:hover{background:var(--bg)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel+.panel{margin-top:14px}
h2{font-size:19px;font-weight:800;letter-spacing:.03em}
h3{font-size:15.5px;font-weight:800}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:12px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rule{border:0;border-top:1px solid var(--line2);margin:12px 0}

/* ===== ボタン ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;min-height:44px;
  border-radius:8px;padding:10px 17px;border:1px solid transparent;transition:background .12s,border-color .12s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.pri{background:var(--ai);color:#fff}
.btn.pri:hover{background:#17485E}
.btn.sec{background:#fff;border-color:#C6CABE;color:var(--ink)}
.btn.sec:hover{background:#F4F5F0}
.btn.ghost{color:var(--ai);background:var(--ai-s)}
.btn.danger{background:var(--shu-s);color:var(--shu)}
.btn.sm{padding:7px 12px;font-size:13px;min-height:38px}
.btn.icon{min-height:36px;padding:4px 9px;font-size:14px}
.btn.big{font-size:15.5px;padding:14px 22px;min-height:54px}
.seg{display:inline-flex;border:1px solid #C6CABE;border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--sub);min-height:38px;border-right:1px solid #E1E4DB}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ai);color:#fff;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{white-space:nowrap;padding:8px 15px;border-radius:7px;background:#fff;border:1px solid #C6CABE;
  font-weight:600;font-size:13.5px;color:var(--sub);min-height:40px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ===== 評価バッジ(A=藍◆ B=苔● C=朱▲) ===== */
.gbadge{display:inline-flex;align-items:center;justify-content:center;font-weight:800;border-radius:5px;
  width:28px;height:26px;font-size:14px;border:1px solid transparent}
.gbadge.A{background:var(--gA-s);color:var(--gA);border-color:var(--gA-b)}
.gbadge.B{background:transparent;color:var(--ink);border-color:transparent;font-weight:700}
.gbadge.C{background:var(--gC-s);color:var(--gC);border-color:var(--gC-b)}
.gbadge.none{background:#F1F2ED;color:#A9AEA3}
.gmark{font-size:8.5px;vertical-align:top;margin-left:1px}
.thin{color:var(--shu);font-size:11px;font-weight:800;margin-left:2px}
.src{font-size:9.5px;font-weight:800;border-radius:3px;padding:1px 4px;border:1px solid}
.src.ts{background:var(--ai-s);color:var(--ai);border-color:#BCD6E2}
.src.ms{background:var(--ko-s);color:var(--ko);border-color:#C9DABF}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:3px 7px;white-space:nowrap;border:1px solid}
.tag.test{background:var(--ai-s);color:var(--ai);border-color:#BCD6E2}
.tag.mit{background:var(--ko-s);color:var(--ko);border-color:#C9DABF}
.tag.warn{background:var(--shu-s);color:var(--shu);border-color:#E8C7BB}
.tag.gray{background:#F1F2ED;color:var(--sub);border-color:var(--line)}
.tag.subjtag{background:var(--ai);color:#fff;border-color:var(--ai);font-weight:800;letter-spacing:.04em}
.done{color:var(--ko);font-size:12px;font-weight:700;white-space:nowrap}

/* ===== 表 ===== */
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--sub);font-weight:700;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--card);z-index:2;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 208px)}
.gridtbl{width:auto}
.gridtbl th,.gridtbl td{padding:5px 6px}
.gridtbl td{text-align:center}
.gridtbl td.stickL{padding:7px 10px;text-align:left}
.stickL{position:sticky;background:var(--card);z-index:3}
th.stickL{z-index:6}
.stickEdge{border-right:1px solid var(--line)}
.headcell{cursor:pointer;text-align:center;border-left:1px solid var(--line)}
.headcell:hover{color:var(--ai)}
.avgline td{background:#F4F5F0!important;font-weight:700;border-top:1px solid var(--line)}
.nores{color:#B3B8AC}
.cntline{display:flex;gap:7px;justify-content:center;font-size:11px;font-weight:700}
.cnt{display:inline-flex;align-items:center;gap:2px;border-radius:4px;padding:1px 5px;border:1px solid}
.cnt.A{background:var(--gA-s);color:var(--gA);border-color:var(--gA-b)}
.cnt.B{background:transparent;color:var(--ink);border-color:var(--line)}
.cnt.C{background:var(--gC-s);color:var(--gC);border-color:var(--gC-b)}
.cntrow td{background:#EFF1EC!important;border-top:1px solid var(--line)}
.foot{max-width:1220px;margin:0 auto;padding:18px 20px 26px;color:#8E948A;font-size:12px;text-align:center}
.navbtn .ic{width:26px;height:26px;flex-shrink:0}
.subjsel{min-width:120px}

/* テストのセル(観点ごとに分けて表示) */
.kaicell{border-left:1px solid var(--line);text-align:left!important;min-width:196px;padding:5px 8px!important;vertical-align:top}
/* 桁がそろうように、セルの中を固定幅の格子にする */
.kline{display:grid;align-items:center;gap:4px;font-size:11.5px;line-height:1.6;
  font-variant-numeric:tabular-nums;grid-template-columns:42px 58px 36px 28px}
.kaicell.split{min-width:262px}
.kaicell.split .kline{grid-template-columns:42px 62px 58px 36px 28px}
/* 観点の札は「思判表」でも桁からはみ出さないよう、枠いっぱいに収める */
.kline .tg .src{display:flex;width:100%;padding:1px 0;justify-content:center;letter-spacing:-.02em}
.kline .pt{font-weight:800;font-size:12.5px;text-align:right;white-space:nowrap}
.kline .pc{color:var(--sub);text-align:right;white-space:nowrap}
.kline .gr{text-align:center}
.kline .gr .gbadge{width:24px;height:22px;font-size:12px}
.kline .fn{color:var(--sub);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kline .tg{text-align:left}
.ksum{border-top:1px dotted #C6CABE;margin-top:3px;padding-top:3px}
.ksum .pt{font-size:13.5px}

/* 観点別のセル */
.kancell{border-left:1px solid var(--line2);text-align:left!important;min-width:146px;padding:4px 7px!important}
.kancell .kline{grid-template-columns:24px 62px 36px 28px}

/* ===== 入力画面 ===== */
.inputwrap{display:flex;gap:14px;align-items:flex-start}
.padcol{position:sticky;top:68px;width:430px;flex-shrink:0;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
/* 数字パッドは左、そのほかの操作は右にまとめて縦を短くする */
.padgrid{display:flex;gap:10px;align-items:flex-start}
.padmain{flex:1;min-width:0}
.padside{width:136px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.padside .nbtn{width:100%;min-width:0;height:42px}
.padside input{width:100%;height:44px;font-size:17px;font-weight:800;text-align:center}
.padside .pair{display:flex;gap:6px}
.padside .pair .nbtn{flex:1}
@media (max-width:560px){ .padgrid{flex-direction:column} .padside{width:100%} }
.numgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.numgrid .nbtn{min-width:0;width:100%}
@media (max-width:1020px){
  .inputwrap{flex-wrap:wrap}
  .padcol{position:sticky;top:auto;bottom:0;order:2;z-index:40;border-radius:var(--r) var(--r) 0 0;
    margin:0 -20px;width:calc(100% + 40px);max-height:64vh;overflow:auto;box-shadow:0 -4px 18px rgba(30,35,40,.14)}
  .inputwrap>.panel{order:1;width:100%!important;min-width:0!important}
  #app{padding-bottom:16px}
}
.entrytbl{width:auto}
.entrytbl td.no{width:44px}
.entrytbl td.nm{min-width:168px;max-width:240px;overflow:hidden;text-overflow:ellipsis;padding-right:20px}
.entrytbl tr:hover td{background:#F5F6F1}
.entrytbl tr.here td{background:var(--ai-s)!important}
.cell{min-width:104px;text-align:center;cursor:pointer;border-radius:6px;font-weight:700;font-size:16px;
  padding:10px 4px!important}
.cell:hover{box-shadow:inset 0 0 0 1px #B9BEB1}
.cell.on{box-shadow:inset 0 0 0 2px var(--ai);background:#fff!important;color:var(--ai)}
.cell.abs{color:var(--shu);font-size:13px}
.cell.exc{color:#A9AEA3;font-size:13px;font-weight:600}
.cell.blank{color:#BFC4B8;font-weight:400}
/* AとCだけ下線を引く。Bは線なし */
.cell.gA{box-shadow:inset 0 -3px 0 var(--gA)}
.cell.gC{box-shadow:inset 0 -3px 0 var(--gC)}
.cell.on.gA,.cell.on.gC{box-shadow:inset 0 0 0 2px var(--ai)}

.padname{font-size:19px;font-weight:800;display:flex;align-items:baseline;gap:9px}
.padname .no{color:var(--ai);font-size:15px}
.nbtn{min-width:56px;height:48px;border-radius:7px;background:#fff;border:1px solid #C6CABE;
  font-size:17px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.nbtn:hover{border-color:var(--ai);color:var(--ai)}
.nbtn:active{background:var(--ai-s)}
.nbtn.abs{color:var(--shu);border-color:#E0BCB0;background:var(--shu-s)}
.nbtn.exc{color:var(--sub);background:#F1F2ED;font-size:13.5px;font-weight:700}
.nbtn.util{font-size:13.5px;font-weight:700;color:var(--sub)}
.nbtn.on{box-shadow:inset 0 0 0 2px currentColor}
.stepbtn{min-width:82px;height:48px;border-radius:7px;font-size:18px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid transparent}
.stepbtn.A{background:var(--gA-s);color:var(--gA);border-color:var(--gA-b)}
.stepbtn.B{background:#fff;color:var(--ink);border-color:#C6CABE}
.stepbtn.C{background:var(--gC-s);color:var(--gC);border-color:var(--gC-b)}
.stepbtn.on{box-shadow:inset 0 0 0 2px currentColor}
.meter{height:6px;background:#DEE1D8;border-radius:3px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--ai);border-radius:3px}

.numtiles{display:flex;flex-wrap:wrap;gap:8px}
.numtile{width:74px;height:62px;border-radius:8px;border:1px solid #C6CABE;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.numtile small{font-size:10px;color:var(--sub);font-weight:600;max-width:66px;overflow:hidden;text-overflow:ellipsis}
.numtile .n{font-size:19px}
.numtile.full{background:var(--ai);border-color:var(--ai);color:#fff}
.numtile.full small{color:rgba(255,255,255,.82)}
.numtile.part{background:var(--ai-s);border-color:var(--ai);color:var(--ai)}
.numtile.here{box-shadow:0 0 0 3px var(--ai)}
.numtile.abs{background:var(--shu-s);border-color:var(--shu);color:var(--shu)}
.numtile.exc{background:#F1F2ED;color:#A9AEA3}
.facebox{min-width:148px;border:1px solid #C6CABE;border-radius:8px;padding:9px 14px;cursor:pointer}
.facebox.on{border-color:var(--ai);border-width:2px;background:var(--ai-s)}
.facebox .v{font-size:25px;font-weight:800;min-height:33px}
.facebox .v .ph{color:#BFC4B8;font-weight:400;font-size:17px}

/* ===== ホーム ===== */
.navgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.navbtn{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;font-weight:700;text-align:left;min-height:62px}
.navbtn:hover{border-color:var(--ai);background:#fff}
.navbtn .ic{font-size:21px;line-height:1}
.navbtn small{display:block;font-weight:500;font-size:11.5px;color:var(--sub)}
.unitbox{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--card);position:relative}
.unitbox:hover{border-color:#B9BEB1}
.grip{cursor:grab;color:#BFC4B8;font-size:16px;padding:6px 6px 6px 2px;user-select:none}
.grip:hover{color:var(--ai)}
.unitbox.moving{opacity:.4}
.unitbox.drop{outline:2px dashed var(--ai);outline-offset:2px}
.oppline.drop2{outline:2px dashed var(--ai);outline-offset:1px}
.unitools{display:none;position:absolute;top:8px;right:8px;align-items:center;gap:2px;background:var(--card)}
.unitbox:hover .unitools{display:inline-flex}
.oppline{position:relative;display:flex;align-items:center;gap:9px;padding:10px 9px;border-radius:7px;cursor:pointer;min-height:46px}
.oppline:hover{background:#F4F5F0}
.opptools{display:none;position:absolute;right:3px;top:50%;transform:translateY(-50%);align-items:center;background:#F4F5F0}
.oppline:hover .opptools{display:inline-flex}
@media (hover: none){
  .unitools,.opptools{display:inline-flex;position:static;transform:none;background:transparent}
}
.uttl{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oppline .ottl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.notice{display:flex;align-items:center;gap:10px;background:#FBF3E9;border:1px solid #E8D5BC;
  border-radius:8px;padding:11px 15px;font-size:13.5px;margin-bottom:14px}

/* ===== 折りたたみカード ===== */
.foldcard{padding:0;overflow:hidden}
.foldhead{display:flex;width:100%;align-items:center;gap:10px;padding:14px 17px;text-align:left;min-height:54px}
.foldhead:hover{background:#F4F5F0}
.foldhead .arw{font-size:12px;color:var(--sub);flex-shrink:0}
.foldcard.open .foldhead .arw{transform:rotate(90deg)}
.foldbody{display:none;padding:0 17px 17px}
.foldcard.open .foldbody{display:block}
.forceopen .foldbody{display:block}
.forceopen .arw{display:none}

/* ===== 個人シート ===== */
.psheet{width:100%;border-collapse:collapse}
.psheet th{font-size:11px;color:var(--sub);text-align:left;padding:4px 7px;border-bottom:1px solid var(--line);position:static;background:transparent;white-space:nowrap}
.psheet td{padding:5px 7px;border-bottom:1px solid var(--line2);font-size:12.5px;white-space:nowrap}
.psheet .sumrow td{border-top:1px solid var(--line);background:#F4F5F0;font-weight:700}
.plabel{font-weight:800;font-size:13px;margin:14px 0 6px;padding-left:8px;border-left:3px solid var(--ai)}
.pchip{display:inline-block;background:#F1F2ED;border-radius:5px;padding:1px 7px;font-weight:700;font-size:12px}
.initial{width:50px;height:50px;border-radius:8px;background:var(--ai);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.stuhead{display:flex;align-items:center;gap:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px;align-items:center}

@media print{
  @page{size:A4 portrait;margin:13mm}
  body{background:#fff}
  #hdr,.btn,.seg,#toast,.padcol,.no-print,.avg-col,.navgrid{display:none!important}
  #app{max-width:100%;padding:0}
  .panel{border:1px solid #DDD;break-inside:avoid;margin-top:10px}
  .foldbody{display:block!important} .foldhead .arw{display:none}
}

/* ===== かぶせ表示 ===== */
#ovl,#dlgwrap,#modalwrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(30,35,40,.42)}
.dlgbox,.modalbox{background:#fff;border-radius:12px;border:1px solid var(--line);padding:24px 26px;
  box-shadow:0 12px 40px rgba(30,35,40,.28)}
.dlgbox{max-width:440px;width:calc(100vw - 48px)}
.modalbox{max-width:660px;width:calc(100vw - 48px);max-height:86vh;overflow:auto}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--ai-s);border-top-color:var(--ai);
  animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:130;background:var(--ink);color:#fff;
  border-radius:8px;padding:11px 20px;font-weight:600;font-size:13.5px;display:none;max-width:80vw}
.wobble{animation:wb .3s}
@keyframes wb{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.boot{text-align:center;padding:70px 20px;color:var(--sub)}
.lockwrap{display:flex;justify-content:center;padding:26px 0 40px}
.lockbox{max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;padding:28px 24px}
.pinrow{display:flex;gap:11px;justify-content:center;margin:14px 0 4px;min-height:18px}
.pindot{width:14px;height:14px;border-radius:50%;border:1.5px solid #B9BEB1;background:#fff}
.pindot.on{background:var(--ai);border-color:var(--ai)}
.pinmsg{min-height:22px;font-size:12.5px;color:var(--gC);font-weight:700;margin-bottom:10px}
.keygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:280px}
.keypad{height:56px;border-radius:9px;border:1px solid #C6CABE;background:#fff;font-size:21px;font-weight:800}
.keypad:hover{border-color:var(--ai);color:var(--ai)}
.keypad:active{background:var(--ai-s)}
.keypad.soft{font-size:12.5px;font-weight:700;color:var(--sub)}
.keypad.go{font-size:14.5px;background:var(--ai);color:#fff;border-color:var(--ai)}
.hero{text-align:center;padding:44px 20px}
.jump{color:var(--ai);font-weight:700;cursor:pointer;text-decoration:underline}

<script>
/* ================= 用語 ================= */
const KAN_ORDER = ['知','思','主'];
const KAN_FULL  = {'知':'知識・技能','思':'思考・判断・表現','主':'主体的に学習に取り組む態度'};
const KAN_SHORT = {'知':'知技','思':'思判表','主':'主体'};
// 評価の記号は使わない(色だけで区別する)
const ST_ABS = '欠';   // 欠席
const ST_EXC = '除';   // このテストの対象にしない
const TERMS = ['1学期','2学期','3学期'];

let S = {
  token:null, auth:{hasPin:false, wait:0, len:4},
  b:null, rec:{}, ov:{}, sho:{}, exc:{},
  queue:{}, undo:[],
  view:'home', arg:null,
  saveTimer:null, saveBusy:false, saveErr:false
};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function z2h(s){
  return String(s==null?'':s)
    .replace(/[０-９]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/．/g,'.').replace(/[－ー−]/g,'-');
}
function num(v){
  const s = z2h(v).trim();
  if (s==='' || !/^-?\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function avg(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
function r1(v){ return v==null ? null : Math.round(v*10)/10; }
function fmtDate(v){
  if (!v) return '';
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[0] : String(v);
}
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.style.display='block';
  clearTimeout(t._tm); t._tm = setTimeout(()=>{ t.style.display='none'; }, ms||2200);
}
function reportError(msg){
  if (String(msg).indexOf('__AUTH__') >= 0) return;
  unovl();
  try { alertBox('うまくいきませんでした', String(msg) + '\n\nこの画面を閉じて、もう一度お試しください。'); }
  catch(e){ toast('エラー: ' + msg, 5000); }
}
window.addEventListener('error', e=>reportError(e.message || 'エラーが発生しました'));
window.addEventListener('unhandledrejection', e=>reportError((e.reason && e.reason.message) ? e.reason.message : 'エラーが発生しました'));

/* ================= サーバー通信 ================= */
function call(action, payload){
  return new Promise((res, rej)=>{
    google.script.run
      .withSuccessHandler(json=>{
        let r; try { r = JSON.parse(json); } catch(e){ rej(new Error('応答を読み取れませんでした')); return; }
        if (r.ok){ res(r.data); return; }
        if (r.auth){ lockOut(); rej(new Error('__AUTH__')); return; }
        rej(new Error(r.error||'エラーが発生しました'));
      })
      .withFailureHandler(e=>rej(new Error('通信エラー: ' + (e && e.message ? e.message : e))))
      .api(JSON.stringify({action, payload, token:S.token}));
  });
}
function ovl(msg){ $('ovlMsg').textContent = msg||'読み込み中…'; $('ovl').style.display='flex'; }
function unovl(){ $('ovl').style.display='none'; }

/* ================= 小窓 ================= */
function dlg(opt){
  return new Promise(res=>{
    const w = $('dlgwrap');
    const btns = (opt.buttons||[{label:'OK', value:true, cls:'pri'}])
      .map((b,i)=>`<button class="btn ${b.cls||'sec'}" data-i="${i}">${esc(b.label)}</button>`).join('');
    w.innerHTML = `<div class="dlgbox"><h3 style="margin-bottom:8px">${esc(opt.title||'')}</h3>
      <div class="sub" style="font-size:14px;white-space:pre-wrap">${esc(opt.msg||'')}</div>
      <div class="row" style="justify-content:flex-end;margin-top:20px">${btns}</div></div>`;
    w.style.display='flex';
    w.querySelectorAll('button').forEach(el=>{
      el.onclick = ()=>{ w.style.display='none'; res((opt.buttons||[{value:true}])[+el.dataset.i].value); };
    });
  });
}
function alertBox(title, msg){ return dlg({title, msg, buttons:[{label:'OK', value:true, cls:'pri'}]}); }
function askYes(title, msg, danger){
  return dlg({title, msg, buttons:[{label:'キャンセル', value:false}, {label:danger||'OK', value:true, cls: danger?'danger':'pri'}]});
}
function modal(html, closeOutside){
  const w = $('modalwrap');
  w.innerHTML = `<div class="modalbox">${html}</div>`;
  w.style.display='flex';
  w.onclick = e=>{ if (e.target===w && closeOutside!==false) shutModal(); };
}
function shutModal(){ $('modalwrap').style.display='none'; $('modalwrap').innerHTML=''; }
// 入力欄の値は shutModal() より前に必ずここで取り出す
function readFields(ids){
  const out = {};
  ids.forEach(id=>{ const el = $(id); out[id] = el ? el.value : ''; });
  return out;
}

/* ================= 参照 ================= */
function cls(){ return S.b ? S.b.cls : null; }
function terms(){ return TERMS; }
function termIndex(t){ const i = TERMS.indexOf(t); return i<0 ? -1 : i; }
function setting(key, def){
  const r = (S.b.settings||[]).find(x=>x['キー']===key);
  return r && r['値'] !== '' ? r['値'] : def;
}
function stepValues(){
  try { return JSON.parse(setting('段階数値','')) || {A:[100,95,90],B:[80,70,60],C:[55,50,45]}; }
  catch(e){ return {A:[100,95,90],B:[80,70,60],C:[55,50,45]}; }
}
function baseKind(){ return setting('既定評価','test'); }
const BASE_LABEL = { test:'テスト評価', mitori:'見取り評価', none:'手動で決める' };

function subjects(){ return S.b.subjects.slice().sort((a,b)=>(num(a['表示順'])||99)-(num(b['表示順'])||99)); }
function shownSubjects(){ return subjects().filter(s=>s['有効']!=='0'); }
function allStudents(){ return S.b.students.slice().sort((a,b)=>(num(a['出席番号'])||0)-(num(b['出席番号'])||0)); }

/* --- 教科ごとの対象児童 --- */
function buildExc_(){
  S.exc = {};
  try {
    const o = JSON.parse(setting('教科対象外','{}')) || {};
    Object.keys(o).forEach(k=>{ S.exc[k] = {}; (o[k]||[]).forEach(id=>{ S.exc[k][id] = 1; }); });
  } catch(e){ S.exc = {}; }
}
function takes(stuId, subjId){ const m = S.exc[subjId]; return !(m && m[stuId]); }
function rosterOf(subjId){ return allStudents().filter(s=>takes(s['児童ID'], subjId)); }
function saveRoster(subjId, offIds){
  const o = {};
  Object.keys(S.exc).forEach(k=>{ o[k] = Object.keys(S.exc[k]||{}); });
  o[subjId] = offIds;
  const json = JSON.stringify(o);
  ovl('保存中…');
  return call('saveSettings', {kv:{'教科対象外':json}}).then(()=>{
    const r = (S.b.settings||[]).find(x=>x['キー']==='教科対象外');
    if (r) r['値'] = json; else S.b.settings.push({'キー':'教科対象外','値':json});
    buildExc_(); unovl(); render();
  }).catch(e=>{ unovl(); alertBox('エラー', e.message); });
}

/* --- 評価機会と「面」 --- */
// 観点構成の1要素 = テストの1つの面。{k:観点, max:満点, label:面の名前, unit:面の単元}
function faces(opp){ try { return JSON.parse(opp['観点構成'])||[]; } catch(e){ return []; } }
function faceName(opp, f){ return (f.label && String(f.label).trim()) ? String(f.label) : opp['機会名']; }
function faceUnitId(opp, f){ return f.unit || opp['単元ID'] || ''; }
function unitName(id){ const u = S.b.units.find(x=>x['単元ID']===id); return u ? u['単元名'] : ''; }
// 表と裏で単元が違うテストかどうか
function isSplit(opp){
  const set = {};
  faces(opp).forEach(f=>{ set[faceUnitId(opp, f)] = 1; });
  return Object.keys(set).length > 1;
}
function splitUnitNames(opp){
  const seen = [], out = [];
  faces(opp).forEach(f=>{ const id = faceUnitId(opp, f); if (seen.indexOf(id)<0){ seen.push(id); out.push(unitName(id)||'単元なし'); } });
  return out;
}

function rkey(oppId, stuId, kan){ return oppId+'|'+stuId+'|'+kan; }
function getRec(oppId, stuId, kan){ return S.rec[rkey(oppId,stuId,kan)] || null; }
function faceMax(f, r){ const m = r && r.max ? num(r.max) : null; return m!=null && m>0 ? m : f.max; }

function unitSort(a,b){
  const ta = a['学期'] ? termIndex(a['学期']) : -1, tb = b['学期'] ? termIndex(b['学期']) : -1;
  if (ta !== tb) return ta - tb;
  return (num(a['表示順'])||99) - (num(b['表示順'])||99);
}
function oppSort(a,b){
  const av = num(a['表示順']), bv = num(b['表示順']);
  return (av==null?1e9:av) - (bv==null?1e9:bv);
}
function unitsOf(subjId){ return S.b.units.filter(u=>u['教科ID']===subjId).sort(unitSort); }
function oppsIn(subjId, unitId, term){
  return S.b.opps.filter(o=>o['教科ID']===subjId && (o['単元ID']||'')===unitId
      && (term==='年間'||o['学期']===term)).sort(oppSort);
}
function oppsOfSubject(subjId, term, kind){
  const out = [];
  unitsOf(subjId).forEach(u=>{
    oppsIn(subjId, u['単元ID'], term).forEach(o=>{ if (!kind || o['種別']===kind) out.push({o, u}); });
  });
  oppsIn(subjId, '', term).forEach(o=>{ if (!kind || o['種別']===kind) out.push({o, u:null}); });
  return out;
}
function bounds(subjId){
  const s = S.b.subjects.find(x=>x['教科ID']===subjId);
  return { A: s && num(s['A閾値'])!=null ? num(s['A閾値']) : 90,
           B: s && num(s['B閾値'])!=null ? num(s['B閾値']) : 60 };
}
function gradeOf(pct, subjId){
  if (pct==null) return null;
  const b = bounds(subjId);
  return pct>=b.A ? 'A' : pct>=b.B ? 'B' : 'C';
}

/* --- 集計:テストと見取りは別々に100%で評価する --- */
function calcStu(stuId, subjId, term){
  const b = bounds(subjId), base = baseKind();
  const out = {};
  KAN_ORDER.forEach(kan=>{
    let tRaw=0, tMax=0, tN=0, tAbs=0, tExc=0;
    let mRaw=0, mMax=0, mN=0, mAbs=0, mExc=0;
    S.b.opps.forEach(opp=>{
      if (opp['教科ID']!==subjId) return;
      if (term!=='年間' && opp['学期']!==term) return;
      const isTest = opp['種別']==='テスト';
      faces(opp).forEach(f=>{
        if (f.k!==kan) return;
        const r = getRec(opp['機会ID'], stuId, kan);
        if (!r) return;
        if (r.state===ST_EXC){ isTest ? tExc++ : mExc++; return; }
        if (r.state===ST_ABS){ isTest ? tAbs++ : mAbs++; return; }
        if (r.raw==='') return;
        const n = num(r.raw), mx = faceMax(f, r);
        if (n==null || !mx) return;
        if (isTest){ tRaw+=n; tMax+=mx; tN++; } else { mRaw+=n; mMax+=mx; mN++; }
      });
    });
    const t = tMax ? r1(tRaw/tMax*100) : null;
    const m = mMax ? r1(mRaw/mMax*100) : null;
    const tG = t==null ? null : (t>=b.A ? 'A' : t>=b.B ? 'B' : 'C');
    const mG = m==null ? null : (m>=b.A ? 'A' : m>=b.B ? 'B' : 'C');
    out[kan] = {
      t, tG, tRaw:r1(tRaw), tMax, tN, tAbs, tExc, tThin: t!=null && (tN<=2 || tAbs+tExc>=tN),
      m, mG, mRaw:r1(mRaw), mMax, mN, mAbs, mExc, mThin: m!=null && (mN<=2 || mAbs+mExc>=mN),
      auto:  base==='test' ? (t!=null?t:m) : base==='mitori' ? (m!=null?m:t) : null,
      autoG: base==='test' ? (tG||mG)      : base==='mitori' ? (mG||tG)      : null,
      A:b.A, B:b.B
    };
  });
  return out;
}
// 1回のテストの、1つの面の結果
function faceResult(opp, f, stuId){
  const r = getRec(opp['機会ID'], stuId, f.k);
  if (!r) return null;
  if (r.state===ST_EXC) return {exc:true};
  if (r.state===ST_ABS) return {abs:true};
  if (r.raw==='') return null;
  const n = num(r.raw), mx = faceMax(f, r);
  if (n==null || !mx) return null;
  return { raw:n, max:mx, pct: n/mx*100 };
}
// 1回のテストの合計
function oppTotal(opp, stuId){
  const fs = faces(opp);
  let raw=0, max=0, n=0, abs=0, exc=0;
  fs.forEach(f=>{
    const r = faceResult(opp, f, stuId);
    if (!r) return;
    if (r.exc){ exc++; return; }
    if (r.abs){ abs++; return; }
    raw+=r.raw; max+=r.max; n++;
  });
  if (n===0){
    if (fs.length && exc>=fs.length) return {exc:true};
    if (abs) return {abs:true};
    return null;
  }
  return { raw:r1(raw), max, pct: max ? raw/max*100 : null, whole: n+abs+exc===fs.length };
}
function oppAvg(opp){
  const v = [];
  rosterOf(opp['教科ID']).forEach(st=>{
    const t = oppTotal(opp, st['児童ID']);
    if (t && t.pct!=null) v.push(t.pct);
  });
  return avg(v);
}
function faceAvg(opp, f){
  const v = [];
  rosterOf(opp['教科ID']).forEach(st=>{
    const r = faceResult(opp, f, st['児童ID']);
    if (r && r.pct!=null) v.push(r.pct);
  });
  return avg(v);
}

/* --- バッジ --- */
function gBadge(g, title){
  if (!g) return `<span class="gbadge none">−</span>`;
  return `<span class="gbadge ${g}" title="${esc(title||'')}">${g}</span>`;
}
function finalOf(x, ov){ return ov ? {g:ov.grade, manual:true, ov} : {g:x.autoG, manual:false, ov:null}; }
function finalBadge(x, ov){
  const f = finalOf(x, ov);
  if (!f.g) return `<span class="gbadge none" title="まだ決まっていません">−</span>`;
  if (f.manual){
    const stale = ov.auto!=='' && x.auto!=null && Math.abs(num(ov.auto) - x.auto) > 0.05;
    return `<span class="gbadge ${f.g}" title="手動で確定${ov.reason?': '+esc(ov.reason):''}${stale?' / 確定後に元の点数が変わっています':''}">${f.g}<span class="gmark">${stale?'!':'手'}</span></span>`;
  }
  return `<span class="gbadge ${f.g}" title="${BASE_LABEL[baseKind()]}から自動">${f.g}</span>`;
}

/* --- 確定評価・所見 --- */
function buildMaps_(b){
  S.rec = {};
  b.records.forEach(r=>{ S.rec[r['キー']] = { raw:r['素点'], memo:r['メモ'], state:r['状態'], max:r['満点'] }; });
  S.ov = {};
  (b.overrides||[]).forEach(r=>{ S.ov[r['キー']] = { grade:r['評価'], reason:r['理由'], auto:r['自動値'] }; });
  S.sho = {};
  (b.shoken||[]).forEach(r=>{ S.sho[r['キー']] = r['本文']; });
  buildExc_();
}
function ovK(stuId, subjId, kan, term){ return stuId+'|'+subjId+'|'+kan+'|'+term; }
function getOv(stuId, subjId, kan, term){ return S.ov[ovK(stuId,subjId,kan,term)] || null; }
function getMemoText(stuId, term){ return S.sho[stuId+'|'+term] || ''; }

/* ================= 保存キュー ================= */
function setSaveChip(){
  const el = $('saveChip');
  el.className=''; el.onclick=null;
  if (S.saveErr){
    el.className='err'; el.textContent='保存に失敗 — タップで再試行';
    el.onclick = ()=>{ S.saveErr=false; setSaveChip(); flushSave(); };
  } else if (S.saveBusy || Object.keys(S.queue).length){
    el.className='saving'; el.textContent='保存中…';
  } else {
    el.textContent = S.b ? '保存済み' : '';
  }
}
function queueRec(oppId, stuId, kan, raw, memo, state, max){
  const key = rkey(oppId, stuId, kan);
  S.undo.push({key, oppId, stuId, kan, prev: S.rec[key] ? Object.assign({}, S.rec[key]) : null});
  if (S.undo.length > 60) S.undo.shift();
  applyRec(key, oppId, stuId, kan, raw, memo, state, max);
}
function applyRec(key, oppId, stuId, kan, raw, memo, state, max){
  raw = String(raw==null?'':raw); memo = memo||''; state = state||'';
  if (raw==='' && state==='' && memo==='') delete S.rec[key];
  else S.rec[key] = { raw, memo, state, max: max==null?'':String(max) };
  S.queue[key] = { oppId, stuId, kan, raw, memo, state, max: max==null?'':String(max) };
  setSaveChip();
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(flushSave, 1200);
}
function flushSave(){
  if (S.saveBusy || S.saveErr) return;
  const keys = Object.keys(S.queue);
  if (!keys.length){ setSaveChip(); return; }
  const batch = keys.map(k=>S.queue[k]);
  const sent = {}; keys.forEach(k=>sent[k]=S.queue[k]);
  S.queue = {};
  S.saveBusy = true; setSaveChip();
  call('saveRecords', {records:batch})
    .then(()=>{ S.saveBusy=false; setSaveChip(); if (Object.keys(S.queue).length) flushSave(); })
    .catch(()=>{
      Object.keys(sent).forEach(k=>{ if (!S.queue[k]) S.queue[k]=sent[k]; });
      S.saveBusy=false; S.saveErr=true; setSaveChip();
    });
}
function stepBack(){
  const u = S.undo.pop();
  if (!u){ toast('取り消す操作がありません'); return; }
  const p = u.prev;
  applyRec(u.key, u.oppId, u.stuId, u.kan, p?p.raw:'', p?p.memo:'', p?p.state:'', p?p.max:'');
  toast('1つ取り消しました'); render();
}

/* ================= 合言葉の画面 ================= */
let LK = { pin:'', pin2:'', step:1, msg:'', busy:false };

function lockOut(){
  S.token = null; S.b = null;
  LK = { pin:'', pin2:'', step:1, msg:'合言葉をもう一度入力してください', busy:false };
  S.view = 'lock';
  try { render(); } catch(e){}
}
function keyPush(d){
  const max = 6;
  if (LK.busy) return;
  const cur = (S.auth.hasPin || LK.step===1) ? 'pin' : 'pin2';
  if (LK[cur].length >= max) return;
  LK[cur] += String(d);
  LK.msg = '';
  render();
}
function keyBack(){
  if (LK.busy) return;
  const cur = (S.auth.hasPin || LK.step===1) ? 'pin' : 'pin2';
  LK[cur] = LK[cur].slice(0, -1);
  render();
}
function keyGo(){
  if (LK.busy) return;
  if (S.auth.hasPin) return doLogin();
  if (LK.step===1){
    if (!/^\d{4,6}$/.test(LK.pin)){ LK.msg = '数字4〜6桁で決めてください'; render(); return; }
    LK.step = 2; LK.msg = ''; render(); return;
  }
  if (LK.pin !== LK.pin2){ LK.msg = '2回目が合いません。もう一度入力してください'; LK.pin2=''; render(); return; }
  LK.busy = true; render();
  ovl('合言葉を登録中…');
  call('setPin', {newPin: LK.pin}).then(r=>{
    S.token = r.token; S.auth.hasPin = true;
    return reloadBundle();
  }).then(()=>{ unovl(); LK.busy=false; go(S.b ? 'home' : 'start'); toast('合言葉を登録しました'); })
    .catch(e=>{ unovl(); LK.busy=false; LK.msg = e.message; LK.pin=''; LK.pin2=''; LK.step=1; render(); });
}
function doLogin(){
  if (!/^\d{4,6}$/.test(LK.pin)){ LK.msg = '数字4〜6桁を入力してください'; render(); return; }
  LK.busy = true; render();
  ovl('確認中…');

function go(view, arg){
  clearTimeout(S.saveTimer); flushSave();

}
function reloadBundle(){
  return call('bundle', {}).then(b=>{ S.b = b.cls ? b : null; if (S.b) buildMaps_(S.b); });
}
function render(){
  const c = cls();
  $('gearBtn').style.display = c ? '' : 'none';
  $('clsChip').textContent = c ? (c['クラス名'] + ' / ' + c['年度'] + '年度') : '';

                  settings:vSettings, guide:vGuide, printall:vPrintAll };
  if (S.view === 'lock'){
    $('gearBtn').style.display = 'none';
    $('clsChip').textContent = '';
    $('saveChip').textContent = '';
    $('app').innerHTML = vLock();

  $('app').innerHTML = (views[S.view]||vHome)();

// バックアップから1か月たっていたら促す
function daysSinceBackup(){
  const at = setting('最終バックアップ','');
  if (!at) return null;
  const m = String(at).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function backupNotice(){
  const d = daysSinceBackup();
  if (d != null && d < 30) return '';
  const msg = d==null

function oppProgress(opp){
  const fs = faces(opp), sts = rosterOf(opp['教科ID']);
  let filled=0, total=0, exc=0;
  sts.forEach(st=>fs.forEach(f=>{
    const r = getRec(opp['機会ID'], st['児童ID'], f.k);
    if (r && r.state===ST_EXC){ exc++; return; }
    total++;
    if (r && (r.raw!=='' || r.state===ST_ABS)) filled++;
  }));
  return {filled, total, exc};
}

/* --- 並び替え --- */
let dragOpp = null, dragUnit = null;
function oppDragStart(e, oppId, unitId){
  dragOpp = {id:oppId, unit:unitId};
  e.dataTransfer.effectAllowed='move'; e.stopPropagation();
  const row = e.target.closest('.oppline');
  if (row) setTimeout(()=>{ row.style.opacity='.4'; }, 0);
}
function oppDragEnd(){
  dragOpp = null;
  document.querySelectorAll('.oppline').forEach(r=>{ r.style.opacity=''; r.classList.remove('drop2'); });
}
function oppDragOver(e, oppId, unitId){
  if (!dragOpp || dragOpp.id===oppId || dragOpp.unit!==unitId) return;
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.add('drop2');
}
function oppDragLeave(e){ e.currentTarget.classList.remove('drop2'); }
function oppDrop(e, oppId, unitId){
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.remove('drop2');
  const info = dragOpp; oppDragEnd();
  if (!info || info.id===oppId || info.unit!==unitId) return;
  const list = oppsIn(homeSubj, unitId, '年間');
  const from = list.findIndex(o=>o['機会ID']===info.id), to = list.findIndex(o=>o['機会ID']===oppId);
  if (from<0||to<0) return;
  list.splice(to, 0, list.splice(from,1)[0]);
  const orders = list.map((o,i)=>{ o['表示順']=String(i+1); return {id:o['機会ID'], order:String(i+1)}; });
  render();
  call('saveOppOrder', {orders}).then(()=>toast('並び順を保存しました')).catch(er=>alertBox('エラー', er.message));
}
function unitDragStart(e, uid){
  dragUnit = uid; e.dataTransfer.effectAllowed='move';
  const card = e.target.closest('.unitbox');
  if (card) setTimeout(()=>card.classList.add('moving'), 0);
}
function unitDragEnd(){
  dragUnit = null;
  document.querySelectorAll('.unitbox').forEach(c=>c.classList.remove('moving','drop'));
}
function unitDragOver(e, uid){
  if (!dragUnit || dragUnit===uid) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drop');
}
function unitDragLeave(e){ e.currentTarget.classList.remove('drop'); }
function unitDrop(e, target){
  e.preventDefault(); e.currentTarget.classList.remove('drop');
  const src = dragUnit; unitDragEnd();
  if (!src || src===target) return;
  const list = unitsOf(homeSubj);
  const from = list.findIndex(u=>u['単元ID']===src), to = list.findIndex(u=>u['単元ID']===target);
  if (from<0||to<0) return;
  list.splice(to, 0, list.splice(from,1)[0]);
  const orders = list.map((u,i)=>{ u['表示順']=String(i+1); return {id:u['単元ID'], order:String(i+1)}; });
  render();
  call('saveUnitOrder', {orders}).then(()=>toast('並び順を保存しました')).catch(er=>alertBox('エラー', er.message));
}

function unitBoxHtml(u, opps){
  const uid = u ? u['単元ID'] : '';
  const title = u ? esc(u['単元名']) : '単元なし・学期をまたぐ見取り';
  const dnd = u ? `ondragover="unitDragOver(event,'${uid}')" ondragleave="unitDragLeave(event)" ondrop="unitDrop(event,'${uid}')"` : '';
  return `<div class="unitbox" ${dnd}>
    <div class="row" style="margin-bottom:4px;flex-wrap:nowrap">
      <h3 class="uttl" title="${title}">${title}</h3>
      ${u && u['学期'] ? `<span class="tag gray">${esc(u['学期'])}</span>` : ''}
      <span class="grow"></span>
      ${u ? `<span class="unitools">
        <span class="grip" draggable="true" title="ドラッグで並び替え" ondragstart="unitDragStart(event,'${uid}')" ondragend="unitDragEnd()">⠿</span>
        <button class="btn icon" style="color:#8E948A" title="単元を編集" onclick="openUnitForm('${uid}')">編集</button>
        <button class="btn icon" style="color:#8E948A" title="この単元を複製" onclick="openUnitCopy('${uid}')">複製</button>
        <button class="btn icon" style="color:#B08070" title="単元を削除" onclick="removeUnit('${uid}')">削除</button></span>` : ''}
    </div>
    ${opps.map(o=>{
      const p = oppProgress(o);
      const full = p.total>0 && p.filled>=p.total;
      return `<div class="oppline" onclick="go('entry','${o['機会ID']}')" ondragover="oppDragOver(event,'${o['機会ID']}','${uid}')" ondragleave="oppDragLeave(event)" ondrop="oppDrop(event,'${o['機会ID']}','${uid}')">
        <span class="tag ${o['種別']==='テスト'?'test':'mit'}">${esc(o['種別'])}</span>
        <span class="ottl" title="${esc(o['機会名'])}">${esc(o['機会名'])}</span>
        ${isSplit(o) ? `<span class="tag gray" title="表と裏で単元が違います:${esc(splitUnitNames(o).join(' / '))}">表裏で単元違い</span>` : ''}
        ${full ? `<span class="done">✓ 全員</span>` : `<span class="tag ${p.filled>0?'warn':'gray'}">${p.filled}/${p.total}</span>`}

/* ================= まとめて作成 ================= */
let BB = null;
function defaultFaceOrder(){ return ['思','知','主']; }
function newBBItem(type, order){
  const ord = order || defaultFaceOrder();
  return { type, name:'', ks: ord.map(k=>({k, on: type==='テスト' ? (k!=='主') : (k==='主'), max:100})) };
}
function newBBUnit(){
  return { name:'', term: homeTerm!=='年間' ? homeTerm : '', date:'', items:[ newBBItem('テスト', BB?BB.order:null) ] };
}
function openBatchBuilder(){
  if (!homeSubj){ toast('先に設定から教科を登録してください'); return; }
  BB = { order: defaultFaceOrder(), units:[] };
  BB.units.push(newBBUnit());
  drawBB();
}
function bbOrder(ord){
  BB.order = ord.split(',');
  BB.units.forEach(u=>u.items.forEach(it=>{
    it.ks = BB.order.map(k=>it.ks.find(x=>x.k===k) || {k, on:false, max:100});
  }));
  drawBB();
}
function bbKind(ui, ii, type){
  const old = BB.units[ui].items[ii];
  const nw = newBBItem(type, BB.order); nw.name = old.name;
  BB.units[ui].items[ii] = nw;
  drawBB();
}
function drawBB(){
  const subj = S.b.subjects.find(x=>x['教科ID']===homeSubj);
  modal(`<h3 style="margin-bottom:2px">${esc(subj?subj['教科名']:'')}の単元とテストをまとめて作る</h3>
    <p class="sub" style="margin-bottom:10px">満点は観点ごとの数字です。表と裏で単元が違うテストは、作ったあとに「編集」から面ごとの単元を設定できます。</p>
    <div class="row" style="margin-bottom:10px;background:#F4F5F0;border-radius:8px;padding:10px 12px">
      <b style="font-size:13px">観点の並び</b>
      <div class="seg">
        <button class="${BB.order.join(',')==='思,知,主'?'on':''}" onclick="bbOrder('思,知,主')">思判表 → 知技</button>
        <button class="${BB.order.join(',')==='知,思,主'?'on':''}" onclick="bbOrder('知,思,主')">知技 → 思判表</button>
      </div>
      <span class="sub" style="font-size:11.5px">入力画面と一覧の列もこの順になります</span>
    </div>
    <div style="max-height:50vh;overflow:auto;margin:0 -6px;padding:0 6px">
    ${BB.units.map((u,ui)=>`
      <div style="background:#F7F8F4;border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:10px">
        <div class="row" style="flex-wrap:nowrap">
          <b style="white-space:nowrap">単元${ui+1}</b>
          <input placeholder="単元名(例:スイミー)" value="${esc(u.name)}" oninput="BB.units[${ui}].name=this.value" style="flex:1;min-width:120px">
          <select onchange="BB.units[${ui}].term=this.value"><option value="" ${!u.term?'selected':''}>学期なし</option>${TERMS.map(t=>`<option ${u.term===t?'selected':''}>${t}</option>`).join('')}</select>
          <input type="date" title="実施日(あとから変えられます)" value="${esc(u.date)}" onchange="BB.units[${ui}].date=this.value" style="width:148px">
          ${BB.units.length>1?`<button class="btn icon" style="color:var(--shu)" title="この単元を消す" onclick="BB.units.splice(${ui},1);drawBB()">消す</button>`:''}
        </div>
        ${u.items.map((it,ii)=>`
          <div class="row" style="margin-top:8px;padding-left:8px;flex-wrap:wrap">
            <select onchange="bbKind(${ui},${ii},this.value)" style="padding:6px 8px"><option ${it.type==='テスト'?'selected':''}>テスト</option><option ${it.type==='見取り'?'selected':''}>見取り</option></select>
            <input placeholder="${it.type==='テスト'?'テスト名':'見取り名'}" value="${esc(it.name)}" oninput="BB.units[${ui}].items[${ii}].name=this.value" style="flex:1;min-width:110px">
            ${it.ks.map((kk,ki)=>`<label style="display:flex;align-items:center;gap:3px;font-size:12px;white-space:nowrap">
              <input type="checkbox" ${kk.on?'checked':''} onchange="BB.units[${ui}].items[${ii}].ks[${ki}].on=this.checked;drawBB()" style="width:15px;height:15px">${KAN_SHORT[kk.k]}
              <input type="number" value="${kk.max}" ${!kk.on?'disabled':''} oninput="BB.units[${ui}].items[${ii}].ks[${ki}].max=num(this.value)" style="width:54px;padding:4px 5px"></label>`).join('')}
            <button class="btn icon" style="color:#A9AEA3" title="この行を消す" onclick="BB.units[${ui}].items.splice(${ii},1);drawBB()">×</button>
          </div>`).join('')}
        <button class="btn ghost sm" style="margin-top:8px" onclick="BB.units[${ui}].items.push(newBBItem('テスト',BB.order));drawBB()">＋ テスト/見取りを追加</button>
      </div>`).join('')}
    </div>
    <button class="btn sec sm" onclick="BB.units.push(newBBUnit());drawBB()">＋ 単元を追加</button>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn sec" onclick="shutModal()">キャンセル</button>
      <button class="btn pri" onclick="bbSave()">まとめて保存</button>
    </div>`, false);
}
function bbSave(){
  const payload = [];
  const base = unitsOf(homeSubj).length;
  for (let ui=0; ui<BB.units.length; ui++){
    const u = BB.units[ui];
    if (!u.name.trim()){ toast(`単元${ui+1}の名前を入力してください`); return; }
    const opps = [];
    for (let ii=0; ii<u.items.length; ii++){
      const it = u.items[ii];
      const anyOn = it.ks.some(k=>k.on);
      if (!it.name.trim() && !anyOn && u.items.length===1) continue;
      if (!it.name.trim()){ toast(`単元${ui+1}の${ii+1}行目の名前を入力してください`); return; }
      const kanten = [];
      for (const kk of it.ks){
        if (!kk.on) continue;
        const mx = num(kk.max);
        if (mx==null || mx<=0 || mx>1000){ toast(`単元${ui+1}「${it.name}」の満点を確認してください`); return; }
        kanten.push({k:kk.k, max:mx});
      }
      if (!kanten.length){ toast(`単元${ui+1}「${it.name}」の観点を1つ以上選んでください`); return; }
      opps.push({ name:it.name.trim(), type:it.type, term:u.term, date:u.date, kanten:JSON.stringify(kanten) });
    }
    payload.push({ name:u.name.trim(), term:u.term, date:u.date, order:String(base+ui+1), opps });
  }
  if (!payload.length){ toast('単元を入力してください'); return; }
  shutModal(); ovl('保存中…');
  call('createUnitsBulk', {subjectId:homeSubj, units:payload})
    .then(()=>reloadBundle()).then(()=>{
      unovl(); render();
      toast(`単元${payload.length}個・テスト/見取り${payload.reduce((a,u)=>a+u.opps.length,0)}件を登録しました`);
    })
    .catch(e=>{ unovl(); alertBox('エラー', e.message); });
}

/* ================= テスト・見取りフォーム(面ごとの名前と単元) ================= */
let FF = [], FF_SUBJ = null, FF_UNIT = '';
function ffMove(i, d){
  const j = i+d;
  if (j<0 || j>=FF.length) return;
  const t = FF[i]; FF[i] = FF[j]; FF[j] = t;
  drawFaces();
}
function drawFaces(){
  const host = $('ffList');
  if (!host) return;
  const units = unitsOf(FF_SUBJ);
  host.innerHTML = FF.map((f,i)=>{
    const seq = f.on ? (FF.filter((x,j)=>x.on&&j<i).length+1)+'枚目' : '—';
    return `<div class="facerow ${f.on?'':'off'}">
      <div class="row" style="flex-wrap:nowrap">
        <span class="seq">${seq}</span>
        <label style="display:flex;align-items:center;gap:7px;font-weight:700;min-width:180px">
          <input type="checkbox" ${f.on?'checked':''} onchange="FF[${i}].on=this.checked;drawFaces()" style="width:17px;height:17px"> ${KAN_FULL[f.k]}
        </label>
        <span><input type="number" min="1" max="1000" value="${f.max}" ${f.on?'':'disabled'} oninput="FF[${i}].max=num(this.value)" style="width:78px"> 点満点</span>
        <span class="grow"></span>
        <button class="btn icon sec" title="上へ" ${i===0?'disabled':''} onclick="ffMove(${i},-1)">↑</button>
        <button class="btn icon sec" title="下へ" ${i===FF.length-1?'disabled':''} onclick="ffMove(${i},1)">↓</button>
      </div>
      ${f.on?`<div class="row" style="margin-top:7px;padding-left:44px;flex-wrap:nowrap">
        <span class="sub" style="font-size:11.5px;white-space:nowrap">この面の名前</span>
        <input value="${esc(f.label||'')}" placeholder="空ならテスト名と同じ" oninput="FF[${i}].label=this.value" style="flex:1;min-width:120px">
        <span class="sub" style="font-size:11.5px;white-space:nowrap">この面の単元</span>
        <select onchange="FF[${i}].unit=this.value" style="max-width:180px">
          <option value="">テストと同じ</option>
          ${units.map(u=>`<option value="${u['単元ID']}" ${f.unit===u['単元ID']?'selected':''}>${esc(u['単元名'])}</option>`).join('')}
        </select>
      </div>`:''}
    </div>`;
  }).join('');
}
function openOppForm(oppId, unitId){
  const o = oppId ? S.b.opps.find(x=>x['機会ID']===oppId) : null;
  if (!o && !homeSubj){ toast('先に設定から教科を登録してください'); return; }
  FF_SUBJ = o ? o['教科ID'] : homeSubj;
  FF_UNIT = o ? (o['単元ID']||'') : (unitId||'');
  if (o){
    const st = faces(o);
    FF = st.map(f=>({k:f.k, on:true, max:f.max, label:f.label||'', unit:f.unit||''}))
      .concat(KAN_ORDER.filter(k=>!st.some(x=>x.k===k)).map(k=>({k, on:false, max:100, label:'', unit:''})));
  } else {
    FF = defaultFaceOrder().map(k=>({k, on:k!=='主', max:100, label:'', unit:''}));
  }

    <p class="sub" style="margin-bottom:14px">観点は上から順に、入力画面と一覧の列に並びます。答案の表裏の順に合わせてください。<br>
      <b>表と裏で単元が違うテスト</b>は、面ごとに名前と単元を入れられます。1枚のテストとして扱われ、一覧では「表裏で単元違い」と表示されます。</p>

      <label>学期</label><select id="ofTerm">${TERMS.map(t=>`<option ${defTerm===t?'selected':''}>${t}</option>`).join('')}</select>

    </div>
    <div style="margin-top:14px"><b style="font-size:13px">観点・満点・面の名前と単元</b>
      <div id="ffList" style="margin-top:8px"></div></div>
    <div class="row" style="justify-content:flex-end;margin-top:18px">
      ${o?`<button class="btn danger sm" id="ofDel">削除</button><span class="grow"></span>`:''}
      <button class="btn sec" onclick="shutModal()">キャンセル</button>
      <button class="btn pri" id="ofGo">${o?'保存':'追加'}</button>
    </div>`, false);
  drawFaces();
  let curType = type;
  $('ofType').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      const before = curType;
      curType = b.dataset.v;
      $('ofType').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
      // ラベルと入力例を種別に合わせる。既定のまま・空のときだけ名前も差し替える
      const lbl = $('ofNameLbl'), inp = $('ofName');
      if (lbl) lbl.textContent = curType==='テスト' ? 'テスト名' : '名前';
      if (inp){
        inp.placeholder = curType==='テスト' ? '例:単元テスト' : '例:ノート、ワークシートなど';

        if (cur==='' || cur==='単元テスト'){ inp.value = curType==='テスト' ? '単元テスト' : ''; }
      }
      if (curType==='見取り' && before!=='見取り'){ FF.forEach(f=>{ f.on = f.k==='主'; f.max = 100; }); drawFaces(); }
      if (curType==='テスト' && before!=='テスト'){ FF.forEach(f=>{ f.on = f.k!=='主'; f.max = 100; }); drawFaces(); }
    };
  });
  $('ofGo').onclick = ()=>{
    const fv = readFields(['ofName','ofTerm','ofDate']);
    const name = fv.ofName.trim();
    if (!name){ toast(curType==='テスト' ? 'テスト名を入力してください' : '名前を入力してください'); return; }
    if (name.length > 40){ toast('名前が長すぎます'); return; }
    const kanten = [];
    for (const f of FF){
      if (!f.on) continue;
      const mx = num(f.max);
      if (mx==null || mx<=0 || mx>1000){ toast('満点は1〜1000の数字で入力してください'); return; }
      const e = {k:f.k, max:mx};
      if (f.label && f.label.trim()) e.label = f.label.trim().slice(0,40);
      if (f.unit) e.unit = f.unit;
      kanten.push(e);
    }
    if (!kanten.length){ toast('観点を1つ以上選んでください'); return; }
    const p = o ? {id:oppId, name, unitId:o['単元ID'], term:fv.ofTerm, date:fv.ofDate, kanten:JSON.stringify(kanten)}
                : {subjectId:FF_SUBJ, unitId:FF_UNIT, name, type:curType, term:fv.ofTerm,

    call('saveOpp', p).then(()=>reloadBundle()).then(()=>{ unovl(); render(); })
      .catch(e=>{ unovl(); alertBox('エラー', e.message); });
  };
  if (o) $('ofDel').onclick = ()=>{ shutModal(); removeOpp(oppId); };
}

function cellShow(r){
  if (!r) return {t:'ー', c:'blank'};

  const opp = curOpp();
  if (!opp) return `<div class="panel">テストが見つかりません。<span class="jump" onclick="go('home')">戻る</span></div>`;
  if (EV.oppId !== opp['機会ID']) EV = { oppId:opp['機会ID'], mode:'list', dir:'col', si:0, fi:0, step:null, pick:null };
  const fs = faces(opp), sts = rosterOf(opp['教科ID']);
  if (!sts.length) return `<div class="panel">この教科を受ける児童が登録されていません。<span class="jump" onclick="openSubjRoster('${opp['教科ID']}')">対象児童を設定する</span></div>`;
  if (EV.si >= sts.length) EV.si = 0;
  if (EV.fi >= fs.length) EV.fi = 0;
  if (EV.pick != null && EV.pick >= sts.length) EV.pick = null;
  if (jumpTo && jumpTo.oppId === opp['機会ID']){
    const idx = sts.findIndex(s=>s['児童ID']===jumpTo.stuId);
    if (idx >= 0){
      EV.si = idx;
      if (EV.mode==='one') EV.pick = idx;
      const empty = fs.findIndex(f=>{ const r = getRec(opp['機会ID'], sts[idx]['児童ID'], f.k); return !r || (r.raw==='' && !r.state); });
      EV.fi = empty>=0 ? empty : 0;
      EV.step = null;
    }
    jumpTo = null;
  }
  const unit = S.b.units.find(u=>u['単元ID']===opp['単元ID']);
  const hasMemo = st=>fs.some(f=>{ const r = getRec(opp['機会ID'], st['児童ID'], f.k); return r && r.memo; });
  const split = isSplit(opp);
  let body;
  if (EV.mode==='list'){
    body = `<div class="tblwrap" style="max-height:calc(100vh - 230px)"><table class="entrytbl">
      <tr><th style="width:46px">番号</th><th>名前</th>
        ${fs.map((f,i)=>`<th style="text-align:center;cursor:pointer" onclick="EV.fi=${i};EV.step=null;render()">
          ${i+1}枚目 ${KAN_SHORT[f.k]} <span style="font-weight:400">/${f.max}</span>${EV.fi===i&&fs.length>1?' ◀':''}
          ${split?`<div style="font-weight:500;font-size:10.5px;color:var(--sub)">${esc(faceName(opp,f))}${faceUnitId(opp,f)!==(opp['単元ID']||'')?' ・'+esc(unitName(faceUnitId(opp,f))):''}</div>`:''}</th>`).join('')}
        <th style="width:36px"></th></tr>
      ${sts.map((st,si)=>{
        const here = si===EV.si;
        return `<tr class="${here?'here':''}">
          <td class="sub no">${esc(st['出席番号'])}</td>
          <td class="nm" style="font-weight:${here?'800':'600'}">${esc(st['名前'])}</td>
          ${fs.map((f,fi)=>{
            const r = getRec(opp['機会ID'], st['児童ID'], f.k);
            const sh = cellShow(r);
            const n = r && r.raw!=='' && !r.state ? num(r.raw) : null;
            const mx = faceMax(f, r);
            const gr = n!=null && mx ? gradeOf(n/mx*100, opp['教科ID']) : null;
            return `<td class="cell ${here&&fi===EV.fi?'on':''} ${sh.c} ${gr?'g'+gr:''}" data-cell="${si}_${fi}" title="${gr?gr+' 判定':''}" onclick="EV.si=${si};EV.fi=${fi};EV.step=null;render()">${esc(sh.t)}</td>`;
          }).join('')}
          <td>${hasMemo(st)?'<span title="メモあり">✎</span>':''}</td>
        </tr>`;
      }).join('')}
    </table></div>`;
  } else {
    body = oneByOneHtml(opp, fs, sts);
  }
  return `
    <div class="bar">
      <button class="btn sec sm" onclick="go('home')">‹ 戻る</button>
      <div>
        <div class="row" style="gap:8px"><h2 style="font-size:18px">${esc(opp['機会名'])}</h2>
          <span class="tag ${opp['種別']==='テスト'?'test':'mit'}">${esc(opp['種別'])}</span>
          ${split?`<span class="tag gray">表裏で単元違い:${esc(splitUnitNames(opp).join(' / '))}</span>`:''}</div>
        <div class="sub">${unit?esc(unit['単元名'])+' / ':''}${esc(opp['学期'])}${opp['日付']?' / '+esc(fmtDate(opp['日付'])):''} ・ 対象${sts.length}人</div>
      </div>
      <span class="grow"></span>
      <button class="btn sec sm" onclick="openOppForm('${opp['機会ID']}')">このテストを編集</button>
    </div>
    <div class="bar">
      <div class="seg">
        <button class="${EV.mode==='list'?'on':''}" onclick="EV.mode='list';EV.pick=null;render()">一覧で入力</button>
        <button class="${EV.mode==='one'?'on':''}" onclick="EV.mode='one';render()">1人ずつ入力</button>
      </div>
      ${EV.mode==='list'&&fs.length>1?`<div class="seg">
        <button class="${EV.dir==='col'?'on':''}" onclick="EV.dir='col';render()" title="同じ面を全員分→次の面">縦に進む</button>
        <button class="${EV.dir==='row'?'on':''}" onclick="EV.dir='row';render()" title="1人の全部の面→次の子">横に進む</button>
      </div>`:''}
      <span class="grow"></span>
      <span class="sub" style="font-size:12px">Enterでも次へ進めます</span>
    </div>
    <div class="inputwrap">
      <div class="panel" style="padding:13px 16px;width:fit-content;max-width:100%;min-width:min(520px,100%)">${body}</div>
      <div id="padCol" class="padcol"></div>
    </div>`;
}
function oneByOneHtml(opp, fs, sts){
  const status = st=>{
    let f=0,k=0,x=0;
    fs.forEach(fc=>{
      const r = getRec(opp['機会ID'], st['児童ID'], fc.k);
      if (!r) return;
      if (r.state===ST_EXC){ x++; return; }
      if (r.state===ST_ABS){ k++; f++; return; }
      if (r.raw!=='') f++;
    });
    if (x===fs.length) return 'exc';
    if (f===0) return '';
    if (k===fs.length) return 'abs';
    return f>=fs.length-x ? 'full' : 'part';
  };
  const sel = EV.pick!=null ? sts[EV.pick] : null;
  const split = isSplit(opp);
  return `
    <p class="sub" style="margin-bottom:10px"><b>番号を押して → 点を押す</b>。次の子は自動で選ばれます。</p>
    <div class="numtiles">
      ${sts.map((st,i)=>`<button class="numtile ${status(st)} ${EV.pick===i?'here':''}" data-tile="${i}" onclick="EV.pick=${i};EV.fi=0;EV.step=null;render()">
        <span class="n">${esc(st['出席番号'])}</span><small>${esc(st['名前'])}</small></button>`).join('')}
    </div>
    ${sel ? `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:13px">
      <div class="row">
        <div class="padname"><span class="no">${esc(sel['出席番号'])}番</span> ${esc(sel['名前'])}</div>
        <span class="grow"></span>
        <button class="btn sec sm" onclick="EV.pick=null;render()">閉じる</button>
      </div>
      <div class="row" style="margin-top:10px">
        ${fs.map((f,i)=>{
          const r = getRec(opp['機会ID'], sel['児童ID'], f.k);
          const sh = cellShow(r);
          return `<div class="facebox ${EV.fi===i?'on':''}" onclick="EV.fi=${i};EV.step=null;render()">
            <div class="sub" style="font-weight:700">${i+1}枚目 ${KAN_FULL[f.k]} <span style="font-weight:400">/${f.max}</span></div>
            ${split?`<div class="sub" style="font-size:11px">${esc(faceName(opp,f))}</div>`:''}
            <div class="v">${r&&r.raw!==''&&!r.state?esc(r.raw):`<span class="ph">${esc(sh.t==='ー'?'未入力':sh.t)}</span>`}</div>
          </div>`;
        }).join('')}
      </div>
    </div>` : `<p class="sub" style="margin-top:14px">↑ 番号をタップすると入力できます</p>`}`;
}
function afterEntry(){
  const opp = curOpp(); if (!opp) return;
  const fs = faces(opp), sts = rosterOf(opp['教科ID']);
  if (!sts.length || !fs.length) return;
  if (EV.mode==='one' && EV.pick==null){ drawPad(opp, null, null); return; }
  const si = EV.mode==='one' ? EV.pick : Math.min(EV.si, sts.length-1);
  const fi = Math.min(EV.fi, fs.length-1);
  drawPad(opp, sts[si], fs[fi]);
  const active = document.querySelector('.cell.on') || document.querySelector('.numtile.here');
  if (active){
    const wrap = active.closest('.tblwrap');
    if (wrap){
      const r = active.getBoundingClientRect(), w = wrap.getBoundingClientRect();
      wrap.scrollTop += (r.top + r.height/2) - (w.top + w.height/2);
    } else active.scrollIntoView({block:'nearest'});
  }
  const pi = $('padIn'); if (pi) pi.focus({preventScroll:true});
}
function drawPad(opp, st, f){
  const host = $('padCol'); if (!host) return;
  const p = oppProgress(opp);
  const steps = stepValues();
  const isMit = opp['種別']==='見取り';
  const meter = `<div class="row" style="margin:4px 0 12px"><div class="meter"><i style="width:${p.total?p.filled/p.total*100:0}%"></i></div>
    <span class="sub" style="font-size:12px;white-space:nowrap">${p.filled}/${p.total}${p.exc?' (除外'+p.exc+')':''}</span></div>`;
  if (!st || !f){
    host.innerHTML = `<div class="padname">入力パッド</div>
      <p class="sub" style="margin:6px 0 10px">番号タイルをタップすると入力が始まります</p>${meter}`;
    return;
  }
  const r = getRec(opp['機会ID'], st['児童ID'], f.k);
  const max = f.max;
  let nums = [];
  for (let v = Math.floor(max/5)*5; v>=0; v-=5) nums.push(v);
  if (nums[0]!==max) nums.unshift(max);
  if (nums.length>24) nums = nums.slice(0,24);
  const stepRow = isMit ? `<div class="row" style="gap:6px;margin-bottom:8px">
      ${['A','B','C'].map(g=>`<button class="stepbtn ${g} ${EV.step===g?'on':''}" style="flex:1;min-width:0" onclick="tapStep('${g}')">${g}</button>`).join('')}
    </div>` : '';
  const grid = EV.step
    ? `<div class="numgrid">${(steps[EV.step]||[]).map(v=>`<button class="nbtn" onclick="putVal(${v})">${v}</button>`).join('') || '<span class="sub" style="grid-column:1/-1">設定で数値を登録できます</span>'}</div>
       <button class="nbtn util" style="width:100%;margin-top:6px" onclick="EV.step=null;render()">ぜんぶの数字を表示</button>`
    : `<div class="numgrid">${nums.map(v=>`<button class="nbtn" onclick="putVal(${v})">${v}</button>`).join('')}</div>`;
  host.innerHTML = `
    <div class="padname"><span class="no">${esc(st['出席番号'])}番</span>${esc(st['名前'])}</div>
    <div class="sub" style="font-weight:600">${KAN_FULL[f.k]} /${max}点満点${isSplit(opp)?' ・ '+esc(faceName(opp,f)):''}</div>
    ${meter}
    <div class="padgrid">
      <div class="padmain">${stepRow}${grid}</div>
      <div class="padside">
        <input id="padIn" type="text" inputmode="numeric" placeholder="直接入力" autocomplete="off">
        <div class="pair">
          <button class="nbtn util" onclick="bump(-1)">−1</button>
          <button class="nbtn util" onclick="bump(1)">＋1</button>
        </div>
        <button class="nbtn abs ${r&&r.state===ST_ABS?'on':''}" title="欠席。評価の母数には入りません" onclick="putState('${ST_ABS}')">欠席</button>
        <div class="pair">
          <button class="nbtn util" onclick="clearCell()">消す</button>
          <button class="nbtn util" onclick="openMemo()">メモ</button>
        </div>
        <hr class="rule" style="margin:2px 0">
        <button class="nbtn util" onclick="stepBack()">取消</button>
        <button class="nbtn util" onclick="nextBlank()">次の未入力→</button>
        ${EV.mode==='list' ? `<button class="nbtn util" onclick="openFillAll()">全員に同じ点</button>` : ''}
        <button class="nbtn exc ${r&&r.state===ST_EXC?'on':''}"
          title="この子はこのテストの対象にしない。母数にも入力の分母にも入りません" onclick="putState('${ST_EXC}')">除外する</button>
      </div>
    </div>
    ${r&&r.state===ST_EXC ? `<p class="sub" style="margin-top:8px;color:var(--shu)">このテストの対象外にしています。もう一度「除外する」を押すと解除できます。</p>` : ''}`;
}
function tapStep(g){ EV.step = EV.step===g ? null : g; render(); }
function curCell(){
  const opp = curOpp(); if (!opp) return null;
  const fs = faces(opp), sts = rosterOf(opp['教科ID']);
  const si = EV.mode==='one' ? EV.pick : EV.si;
  if (si==null || !sts[si]) return null;
  const fi = Math.min(EV.fi, fs.length-1);
  return { opp, fs, sts, si, fi, st:sts[si], f:fs[fi] };
}
function putVal(v){
  const c = curCell(); if (!c) return;
  const n = num(v);
  if (n==null){ toast('数字を入力してください'); return; }
  if (n<0 || n>c.f.max){
    toast(`0〜${c.f.max}点の範囲で入力してください`);
    const pad = $('padCol'); if (pad){ pad.classList.add('wobble'); setTimeout(()=>pad.classList.remove('wobble'), 350); }
    return;
  }
  const prev = getRec(c.opp['機会ID'], c.st['児童ID'], c.f.k);
  queueRec(c.opp['機会ID'], c.st['児童ID'], c.f.k, Math.round(n*10)/10, prev?prev.memo:'', '', c.f.max);
  EV.step = null; blinkNext(c);
}
function putState(state){
  const c = curCell(); if (!c) return;
  const prev = getRec(c.opp['機会ID'], c.st['児童ID'], c.f.k);
  const same = prev && prev.state===state;
  queueRec(c.opp['機会ID'], c.st['児童ID'], c.f.k, '', prev?prev.memo:'', same?'':state, c.f.max);
  EV.step = null;
  if (same){ render(); toast('解除しました'); return; }
  blinkNext(c);
}
function blinkNext(c){
  const mode = EV.mode, si = mode==='one' ? EV.pick : EV.si, fi = c.fi;
  moveNext(c); render();
  setTimeout(()=>{
    const el = document.querySelector(mode==='one' ? `[data-tile="${si}"]` : `[data-cell="${si}_${fi}"]`);
    if (el){ el.style.outline='2px solid var(--ai)'; setTimeout(()=>{ el.style.outline=''; }, 600); }
  }, 0);
}
function clearCell(){
  const c = curCell(); if (!c) return;
  queueRec(c.opp['機会ID'], c.st['児童ID'], c.f.k, '', '', '', '');
  render();
}
function bump(d){
  const c = curCell(); if (!c) return;
  const r = getRec(c.opp['機会ID'], c.st['児童ID'], c.f.k);
  const base = r && r.raw!=='' && !r.state ? num(r.raw) : null;
  if (base==null){ toast('先に点数を入れてから ＋1 / −1 で微調整します'); return; }
  queueRec(c.opp['機会ID'], c.st['児童ID'], c.f.k, Math.min(c.f.max, Math.max(0, base+d)), r?r.memo:'', '', c.f.max);
  render();
}
function moveNext(c){
  if (EV.mode==='one'){
    if (EV.fi < c.fs.length-1){ EV.fi++; return; }
    const nx = nextBlankStudent(c, EV.pick);
    if (nx!=null){ EV.pick = nx; EV.fi = 0; }
    else { EV.pick = null; EV.fi = 0; toast('全員入力済みです'); }
    return;
  }
  if (EV.dir==='col'){
    if (EV.si < c.sts.length-1) EV.si++;
    else if (EV.fi < c.fs.length-1){ EV.fi++; EV.si = 0; }
  } else {
    if (EV.fi < c.fs.length-1) EV.fi++;
    else if (EV.si < c.sts.length-1){ EV.si++; EV.fi = 0; }
  }
}
function isBlank(oppId, stuId, kan){
  const r = getRec(oppId, stuId, kan);
  return !r || (r.raw==='' && !r.state);
}
function nextBlankStudent(c, from){
  for (let s=1; s<=c.sts.length; s++){
    const si = ((from==null?-1:from) + s + c.sts.length) % c.sts.length;
    if (c.fs.some(f=>isBlank(c.opp['機会ID'], c.sts[si]['児童ID'], f.k))) return si;
  }
  return null;
}
function nextBlank(){
  const c = curCell(); if (!c) return;
  const total = c.sts.length * c.fs.length;
  let si = EV.mode==='one' ? (EV.pick||0) : EV.si, fi = EV.fi;
  for (let s=0; s<total; s++){
    if (si < c.sts.length-1) si++;
    else { si = 0; fi = (fi+1) % c.fs.length; }
    if (isBlank(c.opp['機会ID'], c.sts[si]['児童ID'], c.fs[fi].k)){
      if (EV.mode==='one') EV.pick = si; else EV.si = si;
      EV.fi = fi; EV.step = null; render(); return;
    }
  }
  toast('未入力はありません');
}
function openMemo(){
  const c = curCell(); if (!c) return;
  const r = getRec(c.opp['機会ID'], c.st['児童ID'], c.f.k);
  modal(`<h3 style="margin-bottom:4px">${esc(c.st['名前'])} のメモ</h3>
    <p class="sub" style="margin-bottom:12px">${esc(faceName(c.opp, c.f))} ・ ${KAN_FULL[c.f.k]}(所見の材料になります)</p>
    <textarea id="memoTxt" rows="4" style="width:100%" placeholder="例:友達の意見を取り入れて考えを深めていた">${r?esc(r.memo):''}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn sec" onclick="shutModal()">キャンセル</button>
      <button class="btn pri" id="memoGo">保存</button>
    </div>`, false);
  $('memoGo').onclick = ()=>{
    const txt = $('memoTxt').value.slice(0,500);
    queueRec(c.opp['機会ID'], c.st['児童ID'], c.f.k, r?r.raw:'', txt, r?r.state:'', c.f.max);
    shutModal(); render(); toast('メモを保存しました');
  };
}
function openFillAll(){
  const c = curCell(); if (!c) return;
  modal(`<h3 style="margin-bottom:4px">全員に同じ点を入れる</h3>
    <p class="sub" style="margin-bottom:14px">まず全員に同じ点を入れてから、例外の子だけ直すと速いです。欠席・除外にしている子はそのまま残します。</p>
    <div class="kv">
      <label>面(観点)</label><select id="faKan">${c.fs.map((f,i)=>`<option value="${i}" ${i===c.fi?'selected':''}>${i+1}枚目 ${KAN_FULL[f.k]} (/${f.max})</option>`).join('')}</select>
      <label>点数</label><input id="faVal" type="number" style="width:100px">
      <label></label><label style="display:flex;gap:7px;align-items:center"><input type="checkbox" id="faBlank" style="width:16px;height:16px">未入力の子だけに入れる</label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn sec" onclick="shutModal()">キャンセル</button>
      <button class="btn pri" id="faGo">全員に入力</button>
    </div>`, false);
  $('faGo').onclick = ()=>{
    const fi = +$('faKan').value, f = c.fs[fi];
    const v = num($('faVal').value);
    if (v==null || v<0 || v>f.max){ toast(`0〜${f.max}の数字で入力してください`); return; }
    const onlyBlank = $('faBlank').checked;
    let n = 0;
    c.sts.forEach(st=>{
      const r = getRec(c.opp['機会ID'], st['児童ID'], f.k);
      if (r && (r.state===ST_ABS || r.state===ST_EXC)) return;
      if (onlyBlank && r && r.raw!=='') return;
      queueRec(c.opp['機会ID'], st['児童ID'], f.k, v, r?r.memo:'', '', f.max);
      n++;
    });
    shutModal(); render(); toast(`${n}人に ${v}点 を入力しました(取消で1人ずつ戻せます)`);
  };
}
document.addEventListener('keydown', e=>{
  if (S.view !== 'entry') return;
  if ($('modalwrap').style.display==='flex' || $('dlgwrap').style.display==='flex') return;
  const pi = $('padIn');
  if (e.key==='Enter'){
    e.preventDefault();
    if (pi && pi.value.trim()!==''){ const v = pi.value.trim(); pi.value=''; putVal(v); }
    else { const c = curCell(); if (c){ moveNext(c); render(); } }
    return;
  }
  if (document.activeElement===pi && pi.value.trim()!=='') return;
  if (EV.mode!=='list') return;
  const c = curCell(); if (!c) return;
  if (e.key==='ArrowDown'){ e.preventDefault(); EV.si = Math.min(c.sts.length-1, EV.si+1); render(); }
  if (e.key==='ArrowUp'){ e.preventDefault(); EV.si = Math.max(0, EV.si-1); render(); }
  if (e.key==='ArrowRight'){ e.preventDefault(); EV.fi = Math.min(c.fs.length-1, EV.fi+1); render(); }
  if (e.key==='ArrowLeft'){ e.preventDefault(); EV.fi = Math.max(0, EV.fi-1); render(); }
  if (/^[0-9]$/.test(e.key) && pi){ pi.focus({preventScroll:true}); }
});

// その教科・その学期で、実際にチェックが入っている観点だけを返す
function usedKans(subjId, term, kind){
  const used = {};
  S.b.opps.forEach(o=>{
    if (o['教科ID']!==subjId) return;
    if (term!=='年間' && o['学期']!==term) return;
    if (kind && o['種別']!==kind) return;
    faces(o).forEach(f=>{ used[f.k] = 1; });
  });
  return KAN_ORDER.filter(k=>used[k]);
}
// チェックを入れている観点だけに絞った面
function pickedFaces(opp){ return faces(opp).filter(f=>LV.kans[f.k]!==false); }
function totalOf(opp, stuId, fs){
  let raw=0, max=0, n=0, abs=0, exc=0;
  fs.forEach(f=>{
    const r = faceResult(opp, f, stuId);
    if (!r) return;
    if (r.exc){ exc++; return; }
    if (r.abs){ abs++; return; }
    raw+=r.raw; max+=r.max; n++;
  });
  if (n===0){
    if (fs.length && exc>=fs.length) return {exc:true};
    if (abs) return {abs:true};
    return null;
  }
  return { raw:r1(raw), max, pct: max ? raw/max*100 : null, whole: n+abs+exc===fs.length };
}
function avgOf(opp, fs){
  const v = [];
  rosterOf(opp['教科ID']).forEach(st=>{
    const t = totalOf(opp, st['児童ID'], fs);
    if (t && t.pct!=null) v.push(t.pct);
  });
  return avg(v);
}
function countCell(grades){
  const c = {A:0,B:0,C:0};
  grades.forEach(g=>{ if (c[g]!=null) c[g]++; });
  return `<div class="cntline"><span class="cnt A">A ${c.A}</span><span class="cnt B">B ${c.B}</span><span class="cnt C">C ${c.C}</span></div>`;
}

/* --- 単元ごと(テスト・見取りを1回ずつ、観点に分けて表示) --- */
function kaiCell(opp, stuId, subjId, fs){
  const src = opp['種別']==='テスト' ? 'ts' : 'ms';
  const split = isSplit(opp);
  // 1行はつねに [観点][(面名)][点][％][評価] の桁で組む。空欄も桁として出す
  const line = (head, faceLabel, pt, pc, gr, extra)=>
    `<div class="kline${extra||''}"><span class="tg">${head}</span>${split?`<span class="fn">${faceLabel}</span>`:''}` +
    `<span class="pt">${pt}</span><span class="pc">${pc}</span><span class="gr">${gr}</span></div>`;
  const lines = fs.map(f=>{
    const r = faceResult(opp, f, stuId);
    const tag = `<span class="src ${src}" title="${KAN_FULL[f.k]}">${KAN_SHORT[f.k]}</span>`;
    const fl = split ? `<span title="${esc(faceName(opp,f))} / ${esc(unitName(faceUnitId(opp,f))||'単元なし')}">${esc(faceName(opp,f))}</span>` : '';
    if (!r)     return line(tag, fl, '<span class="nores">ー</span>', '', '');
    if (r.exc)  return line(tag, fl, '<span class="nores">除外</span>', '', '');
    if (r.abs)  return line(tag, fl, '<span style="color:var(--shu)">欠</span>', '', '');
    return line(tag, fl, `${r.raw}/${r.max}`, `${Math.round(r.pct)}%`, gBadge(gradeOf(r.pct, subjId)));
  }).join('');
  const t = totalOf(opp, stuId, fs);
  const head = '<b style="font-size:11px">計</b>';
  let sum;
  if (!t)          sum = line(head, '', '<span class="nores">ー</span>', '', '', ' ksum');
  else if (t.exc)  sum = line(head, '', '<span class="nores">除外</span>', '', '', ' ksum');
  else if (t.abs)  sum = line(head, '', '<span style="color:var(--shu)">欠席</span>', '', '', ' ksum');
  else sum = line(head, '', `${t.raw}/${t.max}${t.whole?'':'<span class="sub" title="一部の面が未入力">…</span>'}`,
                  `${Math.round(t.pct)}%`, gBadge(gradeOf(t.pct, subjId)), ' ksum');
  return `<td class="kaicell${split?' split':''}">${lines}${sum}</td>`;
}

/* --- 観点別(点数 → ％ → 評価 の順) --- */
function kantenTable(){
  const subs = shownSubjects().filter(s=>S.b.opps.some(o=>o['教科ID']===s['教科ID']));
  const sts = allStudents();
  if (!subs.length) return `<div class="panel sub">まだテスト・見取りがありません。</div>`;
  const cols = subs.map(s=>({s, ks: usedKans(s['教科ID'], LV.term)})).filter(c=>c.ks.length);
  if (!cols.length) return `<div class="panel sub">${LV.term}に記録のある教科がありません。</div>`;
  const mode = LV.show;
  const oneLine = (cls2, label, raw, max, pct, g, n, thin)=>{
    if (pct==null) return `<div class="kline"><span class="tg"><span class="src ${cls2}">${label}</span></span><span class="pt nores">ー</span><span class="pc"></span><span class="gr"></span></div>`;
    return `<div class="kline"><span class="tg"><span class="src ${cls2}">${label}</span></span><span class="pt">${raw}/${max}</span><span class="pc">${Math.round(pct)}%</span><span class="gr">${gBadge(g)}${thin?`<span class="thin" title="有効な記録が${n}件">!</span>`:''}</span></div>`;
  };
  const shownGrade = x=>{
    if (mode==='test') return x.tG;
    if (mode==='mitori') return x.mG;
    return x.autoG;
  };
  const cellFor = (st, s, k)=>{
    if (!takes(st['児童ID'], s['教科ID'])) return `<td class="kancell nores" title="この教科の対象外です">—</td>`;
    const x = calcStu(st['児童ID'], s['教科ID'], LV.term)[k];
    const oc = `onclick="openDecide('${st['児童ID']}','${s['教科ID']}','${k}')" style="cursor:pointer"`;
    if (mode==='both'){
      return `<td class="kancell" ${oc}>
        ${oneLine('ts','テ', x.tRaw, x.tMax, x.t, x.tG, x.tN, x.tThin)}
        ${oneLine('ms','見', x.mRaw, x.mMax, x.m, x.mG, x.mN, x.mThin)}</td>`;
    }
    if (mode==='test')   return `<td class="kancell" ${oc}>${oneLine('ts','テ', x.tRaw, x.tMax, x.t, x.tG, x.tN, x.tThin)}</td>`;
    if (mode==='mitori') return `<td class="kancell" ${oc}>${oneLine('ms','見', x.mRaw, x.mMax, x.m, x.mG, x.mN, x.mThin)}</td>`;
    const ov = getOv(st['児童ID'], s['教科ID'], k, LV.term);
    return `<td ${oc} style="text-align:center;cursor:pointer">${finalBadge(x, ov)}<div class="sub" style="font-size:10px">${x.auto!=null?Math.round(x.auto)+'%':''}</div></td>`;
  };
  return `<div class="panel" style="padding:13px"><div class="tblwrap"><table class="gridtbl">
    <tr><th rowspan="2" class="stickL" style="left:0;width:36px">番号</th><th rowspan="2" class="stickL stickEdge" style="left:56px;min-width:118px">名前</th>
      ${cols.map((c,ci)=>`<th colspan="${c.ks.length}" style="text-align:center;border-left:1px solid var(--line);${ci%2?'background:#F4F5F0':''}">${esc(c.s['教科名'])}</th>`).join('')}</tr>
    <tr>${cols.map((c,ci)=>c.ks.map((k,i)=>`<th style="text-align:center;top:31px;${i===0?'border-left:1px solid var(--line);':''}${ci%2?'background:#F4F5F0':''}">${KAN_SHORT[k]}</th>`).join('')).join('')}</tr>
    ${sts.map(st=>`<tr>
      <td class="sub stickL" style="left:0;width:36px">${esc(st['出席番号'])}</td>
      <td class="stickL stickEdge" style="left:56px"><span class="jump" onclick="go('person','${st['児童ID']}')">${esc(st['名前'])}</span></td>
      ${cols.map(c=>c.ks.map(k=>cellFor(st, c.s, k)).join('')).join('')}
    </tr>`).join('')}
    <tr class="avgline">
      <td class="stickL" style="left:0"></td><td class="stickL stickEdge" style="left:56px">クラス平均</td>
      ${cols.map(c=>c.ks.map(k=>{
        const tv=[], mv=[];
        rosterOf(c.s['教科ID']).forEach(st=>{
          const x = calcStu(st['児童ID'], c.s['教科ID'], LV.term)[k];
          if (x.t!=null) tv.push(x.t);
          if (x.m!=null) mv.push(x.m);
        });
        const a = avg(tv), b2 = avg(mv);
        return `<td class="kancell">
          <div class="kline"><span class="tg"><span class="src ts">テ</span></span><span class="pt"></span><span class="pc">${a!=null?Math.round(a*10)/10+'%':'ー'}</span><span class="gr"></span></div>
          <div class="kline"><span class="tg"><span class="src ms">見</span></span><span class="pt"></span><span class="pc">${b2!=null?Math.round(b2*10)/10+'%':'ー'}</span><span class="gr"></span></div></td>`;
      }).join('')).join('')}
    </tr>
    <tr class="cntrow">
      <td class="stickL" style="left:0"></td><td class="stickL stickEdge" style="left:56px">評価の人数</td>
      ${cols.map(c=>c.ks.map(k=>{
        const gs = rosterOf(c.s['教科ID']).map(st=>{
          const x = calcStu(st['児童ID'], c.s['教科ID'], LV.term)[k];
          if (mode==='final'){ const ov = getOv(st['児童ID'], c.s['教科ID'], k, LV.term); return finalOf(x, ov).g; }

    <span><span class="thin">!</span>記録が少ない</span>
    <span>—=この教科の対象外</span>
    <span><b>セルをタップで最終評価を決められます</b></span>
  </div></div>`;
}

function borderHtml(){
  const subs = shownSubjects();
  const nearA = [], nearC = [];
  subs.forEach(s=>rosterOf(s['教科ID']).forEach(st=>{
    const g = calcStu(st['児童ID'], s['教科ID'], LV.term);
    KAN_ORDER.forEach(k=>{
      const x = g[k];
      [['ts', x.t, x.tG], ['ms', x.m, x.mG]].forEach(([trk, p, gr])=>{
        if (p==null) return;
        if (gr==='B' && x.A - p <= 3) nearA.push({st, s, k, trk, p, need:r1(x.A-p)});
        if ((gr==='B' && p - x.B <= 3) || (gr==='C' && x.B - p <= 3)) nearC.push({st, s, k, trk, p, gr});
      });
    });
  }));
  const row = (e, note)=>`<div class="oppline" onclick="openDecide('${e.st['児童ID']}','${e.s['教科ID']}','${e.k}')">
    <span class="src ${e.trk}">${e.trk==='ts'?'テ':'見'}</span>
    <b style="min-width:96px">${esc(e.st['名前'])}</b>
    <span class="tag subjtag">${esc(e.s['教科名'])}</span>
    <span class="sub">${KAN_FULL[e.k]}</span>
    <span class="grow"></span><span class="sub">${e.p}%</span><span class="tag gray">${note}</span></div>`;
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(360px,1fr))">
    <div class="panel"><h3 style="color:var(--gA)">Aまであと僅か(3%以内)</h3>
      <p class="sub" style="margin-bottom:8px">もう1回良い記録があればAに届くかもしれない子</p>
      ${nearA.map(e=>row(e, `あと${e.need}%`)).join('') || '<p class="sub">該当なし</p>'}</div>
    <div class="panel"><h3 style="color:var(--gC)">Cとの境目(±3%)</h3>
      <p class="sub" style="margin-bottom:8px">記録が少ない・支援が必要かもしれない子</p>
      ${nearC.map(e=>row(e, e.gr)).join('') || '<p class="sub">該当なし</p>'}</div>
  </div>`;
}

            ${miss.length ? `<span class="tag warn">${miss.length}人</span>` : `<span class="done">✓ 全員入力済み</span>`}
            <button class="btn ghost sm" onclick="go('entry','${o['機会ID']}')">入力へ</button></div>
          ${miss.length ? `<div class="row" style="margin-top:6px">${miss.map(x=>`<span class="tag ${x.why==='欠席'?'warn':'gray'}" style="cursor:pointer;padding:6px 9px" title="タップでこの子の入力欄へ" onclick="goEntryAt('${o['機会ID']}','${x.st['児童ID']}')">${esc(x.st['名前'])}(${x.why})</span>`).join('')}</div>` : ''}
        </div>`;
      }).join('') || '<p class="sub">対象のテストがありません</p>'}</div>`;
  }
  return `<div class="panel">${seg}
    ${allStudents().map(st=>{
      const list = [];
      opps.forEach(o=>{
        if (!takes(st['児童ID'], o['教科ID'])) return;
        const s = stateOf(o, st['児童ID']);
        if (s.every(v=>v===ST_EXC)) return;
        if (s.some(v=>v===ST_ABS)) list.push({o, why:'欠席'});
        else if (s.some(v=>v==='')) list.push({o, why:'未入力'});
      });
      if (!list.length) return '';
      return `<div style="padding:10px 4px;border-bottom:1px solid var(--line2)">
        <div class="row"><b>${esc(st['出席番号'])} ${esc(st['名前'])}</b><span class="tag warn">${list.length}件</span></div>
        <div class="row" style="margin-top:6px">${list.map(x=>`<span class="tag ${x.why==='欠席'?'warn':'gray'}" style="cursor:pointer;padding:6px 9px" title="タップでこの子の入力欄へ" onclick="goEntryAt('${x.o['機会ID']}','${st['児童ID']}')">${esc(oppUnitLabel(x.o))} / ${esc(x.o['機会名'])}(${x.why})</span>`).join('')}</div>
      </div>`;
    }).join('') || '<p class="sub">未実施・未入力はありません</p>'}</div>`;
}
