<style>
/* ===== 配色:藍(あい)と朱(しゅ)の記録帳 ===== */
:root{
  --bg:#EAEBE6; --card:#FCFCFA; --ink:#1E2328; --sub:#6B7178; --line:#D4D7CE; --line2:#E6E8E1;
  --ai:#1F5D7A;  --ai-s:#E2EDF2;   /* 藍 = 主要操作 */
  --ko:#5C7F4B;  --ko-s:#EAF0E5;   /* 苔 = 見取り・できた */
  --shu:#B4543A; --shu-s:#F7E9E4;  /* 朱 = 注意・削除 */
  /* 評価の色:A=青、C=赤。Bは色を付けない(多数を占めるBに目を奪われないため) */
  --gA:#1D6FB8; --gA-s:#E6F0F9; --gA-b:#B4CFE7;
  --gC:#C0392B; --gC-s:#FBEAE7; --gC-b:#EBBFB6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px;border:1px solid #C6CABE;border-radius:7px;
  padding:9px 11px;background:#fff;color:var(--ink);outline:none;transition:border-color .12s;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ai);box-shadow:0 0 0 3px var(--ai-s)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:#C2C6BA;border-radius:5px}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* アイコン(Phosphor Icons duotone)。色はまわりの文字の色になる */
.ic{display:inline-flex;width:1.3em;height:1.3em;flex-shrink:0;vertical-align:-.25em}
.ic svg{width:100%;height:100%;display:block}

/* ===== 骨格 ===== */
#hdr{position:sticky;top:0;z-index:50;background:#FCFCFA;border-bottom:2px solid var(--ai);
  display:flex;align-items:center;gap:12px;padding:8px 20px;min-height:56px}
#hdr .brand{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;color:var(--ai)}
#hdr .brand .ic{width:28px;height:28px}
#hdr .brand b{font-size:17px;letter-spacing:.06em;color:var(--ink);white-space:nowrap}
#app{max-width:1220px;margin:0 auto;padding:20px 20px 90px}
#clsChip{font-size:13px;font-weight:700;color:var(--ai);background:var(--ai-s);border-radius:6px;padding:3px 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#clsChip:empty{display:none}
#saveChip{margin-left:auto;font-size:12.5px;color:var(--sub);white-space:nowrap}
#saveChip.saving{color:var(--ai)}
#saveChip.err{color:var(--shu);font-weight:700;cursor:pointer;text-decoration:underline}
.gear{display:inline-flex;align-items:center;gap:5px;padding:8px 10px;border-radius:8px;color:var(--ai);font-weight:700;font-size:13.5px}
.gear .ic{width:22px;height:22px}
.gear:hover{background:var(--ai-s)}
@media (max-width:560px){ .gear span.lbl,#hdr .brand b,.wide-only{display:none} #hdr{padding:8px 12px;gap:8px} #app{padding:14px 12px 90px} }

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel+.panel{margin-top:14px}
h2{font-size:19px;font-weight:800;letter-spacing:.03em}
h3{font-size:15.5px;font-weight:800}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nowrap{flex-wrap:nowrap}
.grow{flex:1}
.grid{display:grid;gap:12px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rule{border:0;border-top:1px solid var(--line2);margin:12px 0}

/* ===== ボタン ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;min-height:44px;
  border-radius:8px;padding:10px 17px;border:1px solid transparent;transition:background .12s,border-color .12s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.pri{background:var(--ai);color:#fff}
.btn.pri:hover{background:#17485E}
.btn.sec{background:#fff;border-color:#C6CABE;color:var(--ink)}
.btn.sec:hover{background:#F4F5F0}
.btn.ghost{color:var(--ai);background:var(--ai-s)}
.btn.danger{background:var(--shu-s);color:var(--shu)}
.btn.sm{padding:7px 12px;font-size:13px;min-height:38px}
.btn.big{font-size:15.5px;padding:14px 22px;min-height:54px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;color:#8E948A;flex-shrink:0}
.iconbtn .ic{width:20px;height:20px}
.iconbtn:hover{background:var(--line2);color:var(--ai)}
.seg{display:inline-flex;border:1px solid #C6CABE;border-radius:8px;overflow:hidden;background:#fff;max-width:100%;overflow-x:auto}
.seg button{padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--sub);min-height:38px;border-right:1px solid #E1E4DB;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ai);color:#fff;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%}
.chip{white-space:nowrap;padding:8px 15px;border-radius:7px;background:#fff;border:1px solid #C6CABE;
  font-weight:600;font-size:13.5px;color:var(--sub);min-height:40px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ===== 評価バッジ ===== */
.gbadge{display:inline-flex;align-items:center;justify-content:center;font-weight:800;border-radius:5px;
  width:28px;height:26px;font-size:14px;border:1px solid transparent}
.gbadge.A{background:var(--gA-s);color:var(--gA);border-color:var(--gA-b)}
.gbadge.B{background:transparent;color:var(--ink);border-color:transparent;font-weight:700}
.gbadge.C{background:var(--gC-s);color:var(--gC);border-color:var(--gC-b)}
.gbadge.none{background:#F1F2ED;color:#A9AEA3}
.gmark{font-size:8.5px;vertical-align:top;margin-left:1px}
.thin{color:var(--shu);font-size:11px;font-weight:800;margin-left:2px}
.src{font-size:9.5px;font-weight:800;border-radius:3px;padding:1px 4px;border:1px solid}
.src.ts{background:var(--ai-s);color:var(--ai);border-color:#BCD6E2}
.src.ms{background:var(--ko-s);color:var(--ko);border-color:#C9DABF}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:3px 7px;white-space:nowrap;border:1px solid}
.tag.test{background:var(--ai-s);color:var(--ai);border-color:#BCD6E2}
.tag.mit{background:var(--ko-s);color:var(--ko);border-color:#C9DABF}
.tag.warn{background:var(--shu-s);color:var(--shu);border-color:#E8C7BB}
.tag.gray{background:#F1F2ED;color:var(--sub);border-color:var(--line)}
.tag.subjtag{background:var(--ai);color:#fff;border-color:var(--ai);font-weight:800;letter-spacing:.04em}
.done{color:var(--ko);font-size:12px;font-weight:700;white-space:nowrap}

/* ===== 表 ===== */
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--sub);font-weight:700;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--card);z-index:2;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 208px)}
.gridtbl{width:auto}
.gridtbl th,.gridtbl td{padding:5px 6px}
.gridtbl td{text-align:center}
.gridtbl td.stickL{padding:7px 10px;text-align:left}
.stickL{position:sticky;background:var(--card);z-index:3}
th.stickL{z-index:6}
.stickEdge{border-right:1px solid var(--line)}
.gridtbl .stickEdge{left:var(--lw,56px)!important}
.headcell{cursor:pointer;text-align:center;border-left:1px solid var(--line)}
.headcell:hover{color:var(--ai)}
.avgline td{background:#F4F5F0!important;font-weight:700;border-top:1px solid var(--line)}
.nores{color:#B3B8AC}
.cntline{display:flex;gap:7px;justify-content:center;font-size:11px;font-weight:700}
.cnt{display:inline-flex;align-items:center;gap:2px;border-radius:4px;padding:1px 5px;border:1px solid}
.cnt.A{background:var(--gA-s);color:var(--gA);border-color:var(--gA-b)}
.cnt.B{background:transparent;color:var(--ink);border-color:var(--line)}
.cnt.C{background:var(--gC-s);color:var(--gC);border-color:var(--gC-b)}
.cntrow td{background:#EFF1EC!important;border-top:1px solid var(--line)}
.foot{max-width:1220px;margin:0 auto;padding:18px 20px 26px;color:#8E948A;font-size:12px;text-align:center}
.subjsel{min-width:120px}

/* テストのセル(観点ごとに分けて表示) */
.kaicell{border-left:1px solid var(--line);text-align:left!important;min-width:196px;padding:5px 8px!important;vertical-align:top}
/* 桁がそろうように、セルの中を固定幅の格子にする */
.kline{display:grid;align-items:center;gap:4px;font-size:11.5px;line-height:1.6;
  font-variant-numeric:tabular-nums;grid-template-columns:42px 58px 36px 28px}
.kaicell.split{min-width:262px}
.kaicell.split .kline{grid-template-columns:42px 62px 58px 36px 28px}
.kline .tg .src{display:flex;width:100%;padding:1px 0;justify-content:center;letter-spacing:-.02em}
.kline .pt{font-weight:800;font-size:12.5px;text-align:right;white-space:nowrap}
.kline .pc{color:var(--sub);text-align:right;white-space:nowrap}
.kline .gr{text-align:center}
.kline .gr .gbadge{width:24px;height:22px;font-size:12px}
.kline .fn{color:var(--sub);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kline .tg{text-align:left}
.ksum{border-top:1px dotted #C6CABE;margin-top:3px;padding-top:3px}
.ksum .pt{font-size:13.5px}
.pline{display:flex;align-items:center;gap:8px;margin-top:4px;font-variant-numeric:tabular-nums}

/* 観点別のセル */
.kancell{border-left:1px solid var(--line2);text-align:left!important;min-width:146px;padding:4px 7px!important}
.kancell .kline{grid-template-columns:24px 62px 36px 28px}
.fincell{border-left:1px solid var(--line2);min-width:64px}

/* ===== 入力画面 ===== */
.inputwrap{display:flex;gap:14px;align-items:flex-start}
.entrypanel{padding:13px 16px;width:fit-content;max-width:100%;min-width:min(520px,100%)}
.entrywrap{max-height:calc(100vh - 230px)}
.padcol{position:sticky;top:68px;width:430px;flex-shrink:0;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
/* 数字パッドは左、そのほかの操作は右にまとめて縦を短くする */
.padgrid{display:flex;gap:10px;align-items:flex-start}
.padmain{flex:1;min-width:0}
.padside{width:136px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.padside .nbtn{width:100%;min-width:0;height:42px}
.padside input{width:100%;height:44px;font-size:17px;font-weight:800;text-align:center}
.padside .pair{display:flex;gap:6px}
.padside .pair .nbtn{flex:1}
.padmore{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.padmore .nbtn{flex:1;min-width:96px;height:40px}
.numgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.numgrid .nbtn{min-width:0;width:100%}
@media (max-width:1020px){
  .inputwrap{flex-wrap:wrap}
  .padcol{position:sticky;top:auto;bottom:0;order:2;z-index:40;border-radius:var(--r) var(--r) 0 0;
    margin:0 -20px;width:calc(100% + 40px);max-height:56vh;overflow:auto;box-shadow:0 -4px 18px rgba(30,35,40,.14)}
  .inputwrap>.panel{order:1;width:100%!important;min-width:0!important}
  .entrywrap{max-height:34vh}
  #app{padding-bottom:16px}
}
@media (max-width:560px){
  .padcol{margin:0 -12px;width:calc(100% + 24px);padding:12px 12px}
  .padgrid{flex-direction:column}
  .padside{width:100%;flex-direction:row;flex-wrap:wrap}
  .padside>*{flex:1 1 30%}
  .padside input{flex-basis:100%}
  .numgrid{grid-template-columns:repeat(6,1fr)}
  .padcol .nbtn{height:40px;font-size:16px}
  .padside .nbtn{height:38px}
  .padside input{height:40px}
  .padname{font-size:17px}
  .padmore{margin-top:8px;padding-top:8px}
  .padmore .nbtn{height:36px;min-width:80px}
}
.entrytbl{width:auto}
.entrytbl td.no{width:44px}
.entrytbl td.nm{min-width:150px;max-width:240px;overflow:hidden;text-overflow:ellipsis;padding-right:20px}
.entrytbl tr:hover td{background:#F5F6F1}
.entrytbl tr.here td{background:var(--ai-s)!important}
.cell{min-width:96px;text-align:center;cursor:pointer;border-radius:6px;font-weight:700;font-size:16px;
  padding:10px 4px!important}
.cell:hover{box-shadow:inset 0 0 0 1px #B9BEB1}
.cell.on{box-shadow:inset 0 0 0 2px var(--ai);background:#fff!important;color:var(--ai)}
.cell.abs{color:var(--shu);font-size:13px}
.cell.exc{color:#A9AEA3;font-size:13px;font-weight:600}
.cell.blank{color:#BFC4B8;font-weight:400}
/* AとCだけ下線を引く。Bは線なし */
.cell.gA{box-shadow:inset 0 -3px 0 var(--gA)}
.cell.gC{box-shadow:inset 0 -3px 0 var(--gC)}
.cell.on.gA,.cell.on.gC{box-shadow:inset 0 0 0 2px var(--ai)}
.memomark{color:var(--ai)}
.memomark .ic{width:18px;height:18px}

.padname{font-size:19px;font-weight:800;display:flex;align-items:baseline;gap:9px}
.padname .no{color:var(--ai);font-size:15px}
.nbtn{min-width:56px;height:48px;border-radius:7px;background:#fff;border:1px solid #C6CABE;
  font-size:17px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.nbtn:hover{border-color:var(--ai);color:var(--ai)}
.nbtn:active{background:var(--ai-s)}
.nbtn.abs{color:var(--shu);border-color:#E0BCB0;background:var(--shu-s)}
.nbtn.exc{color:var(--sub);background:#F1F2ED;font-size:13.5px;font-weight:700}
.nbtn.util{font-size:13.5px;font-weight:700;color:var(--sub)}
.nbtn.util .ic{width:18px;height:18px}
.nbtn.on{box-shadow:inset 0 0 0 2px currentColor}
.stepbtn{min-width:82px;height:48px;border-radius:7px;font-size:18px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid transparent}
.stepbtn.A{background:var(--gA-s);color:var(--gA);border-color:var(--gA-b)}
.stepbtn.B{background:#fff;color:var(--ink);border-color:#C6CABE}
.stepbtn.C{background:var(--gC-s);color:var(--gC);border-color:var(--gC-b)}
.stepbtn.on{box-shadow:inset 0 0 0 2px currentColor}
.meter{height:6px;background:#DEE1D8;border-radius:3px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--ai);border-radius:3px}

.numtiles{display:flex;flex-wrap:wrap;gap:8px}
.numtile{width:74px;height:62px;border-radius:8px;border:1px solid #C6CABE;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.numtile small{font-size:10px;color:var(--sub);font-weight:600;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.numtile .n{font-size:19px}
.numtile.full{background:var(--ai);border-color:var(--ai);color:#fff}
.numtile.full small{color:rgba(255,255,255,.82)}
.numtile.part{background:var(--ai-s);border-color:var(--ai);color:var(--ai)}
.numtile.here{box-shadow:0 0 0 3px var(--ai)}
.numtile.abs{background:var(--shu-s);border-color:var(--shu);color:var(--shu)}
.numtile.exc{background:#F1F2ED;color:#A9AEA3}
.facebox{min-width:148px;border:1px solid #C6CABE;border-radius:8px;padding:9px 14px;cursor:pointer;text-align:left;background:#fff}
.facebox.on{border-color:var(--ai);border-width:2px;background:var(--ai-s)}
.facebox .v{font-size:25px;font-weight:800;min-height:33px}
.facebox .v .ph{color:#BFC4B8;font-weight:400;font-size:17px}

/* ===== ホーム ===== */
.navgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.navbtn{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;font-weight:700;text-align:left;min-height:62px}
.navbtn:hover{border-color:var(--ai);background:#fff}
.navbtn .ic{width:30px;height:30px;color:var(--ai)}
.navbtn small{display:block;font-weight:500;font-size:11.5px;color:var(--sub)}
@media (max-width:560px){ .navgrid{grid-template-columns:1fr 1fr} .navbtn small{display:none} }
.unitbox{border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--card);position:relative;min-width:0}
.unitbox:hover{border-color:#B9BEB1}
.grip{cursor:grab;color:#BFC4B8;display:inline-flex;padding:4px 2px;user-select:none}
.grip .ic{width:18px;height:18px}
.grip:hover{color:var(--ai)}
@media (hover: none){ .grip{display:none} }
.unitbox.moving{opacity:.4}
.unitbox.drop{outline:2px dashed var(--ai);outline-offset:2px}
.oppline.drop2{outline:2px dashed var(--ai);outline-offset:1px}
.oppline{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 9px;border-radius:7px;cursor:pointer;min-height:48px}
.oppline:hover{background:#F4F5F0}
.uttl{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oppline .ottl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.oppline .ottl .on{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.oppline .ottl .meta{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FBF3E9;border:1px solid #E8D5BC;
  border-radius:8px;padding:11px 15px;font-size:13.5px;margin-bottom:14px}
.notice>.ic{width:26px;height:26px;color:var(--ai)}

/* はじめにやること */
.steps{margin-bottom:16px}
.steps ol{list-style:none;margin-top:10px;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;flex-wrap:wrap}
.steps li .num{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;background:#F1F2ED;color:var(--sub);flex-shrink:0}
.steps li.now{border-color:var(--ai);box-shadow:0 0 0 2px var(--ai-s)}
.steps li.now .num{background:var(--ai);color:#fff}
.steps li.ok{background:#F7F8F4}
.steps li.ok .num{background:var(--ko);color:#fff}
.steps li.ok b{color:var(--sub);font-weight:600}
.steps li .stxt{min-width:0;flex:1 1 220px}
.steps li.ok .stxt{flex-basis:0}

/* ===== 折りたたみカード ===== */
.foldcard{padding:0;overflow:hidden}
.foldhead{display:flex;width:100%;align-items:center;gap:10px;padding:14px 17px;text-align:left;min-height:54px;flex-wrap:wrap}
.foldhead:hover{background:#F4F5F0}
.foldhead .arw{font-size:12px;color:var(--sub);flex-shrink:0;transition:transform .12s}
.foldcard.open .foldhead .arw{transform:rotate(90deg)}
.foldbody{display:none;padding:0 17px 17px}
.foldcard.open .foldbody{display:block}
.forceopen .foldbody{display:block}
.forceopen .arw{display:none}

/* ===== 個人シート ===== */
.psheet{width:100%;border-collapse:collapse}
.psheet th{font-size:11px;color:var(--sub);text-align:left;padding:4px 7px;border-bottom:1px solid var(--line);position:static;background:transparent;white-space:nowrap}
.psheet td{padding:5px 7px;border-bottom:1px solid var(--line2);font-size:12.5px;white-space:nowrap}
.psheet .sumrow td{border-top:1px solid var(--line);background:#F4F5F0;font-weight:700}
.plabel{font-weight:800;font-size:13px;margin:14px 0 6px;padding-left:8px;border-left:3px solid var(--ai)}
.pchip{display:inline-block;background:#F1F2ED;border-radius:5px;padding:1px 7px;font-weight:700;font-size:12px}
.initial{width:50px;height:50px;border-radius:8px;background:var(--ai);color:#fff;flex-shrink:0;

@media print{

/* ===== かぶせ表示 ===== */
#ovl,#dlgwrap,#modalwrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(30,35,40,.42)}
#dlgwrap{z-index:120}
.dlgbox,.modalbox{background:#fff;border-radius:12px;border:1px solid var(--line);padding:24px 26px;
  box-shadow:0 12px 40px rgba(30,35,40,.28)}
.dlgbox{max-width:440px;width:calc(100vw - 32px)}
.modalbox{max-width:680px;width:calc(100vw - 32px);max-height:88vh;overflow:auto}
@media (max-width:560px){ .dlgbox,.modalbox{padding:18px 16px} }
.spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--ai-s);border-top-color:var(--ai);
  animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:130;background:var(--ink);color:#fff;
  border-radius:8px;padding:11px 20px;font-weight:600;font-size:13.5px;display:none;max-width:86vw}
.wobble{animation:wb .3s}
@keyframes wb{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.boot{text-align:center;padding:70px 20px;color:var(--sub)}
.lockwrap{display:flex;justify-content:center;padding:26px 0 40px}
.lockbox{max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;padding:28px 24px}
.lockbox>.ic{width:54px;height:54px;color:var(--ai);margin-bottom:8px}
.pinrow{display:flex;gap:11px;justify-content:center;margin:14px 0 4px;min-height:18px}
.pindot{width:14px;height:14px;border-radius:50%;border:1.5px solid #B9BEB1;background:#fff}
.pindot.on{background:var(--ai);border-color:var(--ai)}
.pinmsg{min-height:22px;font-size:12.5px;color:var(--gC);font-weight:700;margin-bottom:10px}
.keygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:280px}
.keypad{height:56px;border-radius:9px;border:1px solid #C6CABE;background:#fff;font-size:21px;font-weight:800}
.keypad:hover{border-color:var(--ai);color:var(--ai)}
.keypad:active{background:var(--ai-s)}
.keypad.soft{font-size:12.5px;font-weight:700;color:var(--sub)}
.keypad.go{font-size:14.5px;background:var(--ai);color:#fff;border-color:var(--ai)}
.hero{text-align:center;padding:40px 20px}
.hero>.ic{width:72px;height:72px;color:var(--ai)}
.jump{color:var(--ai);font-weight:700;cursor:pointer;text-decoration:underline}
.kv{display:grid;grid-template-columns:132px 1fr;gap:10px 14px;align-items:center}
@media (max-width:560px){ .kv{grid-template-columns:1fr;gap:4px 0} .kv>label{margin-top:6px} }
.stepchip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:5px 9px;font-weight:800;font-size:14px}
.stepchip button{font-size:12px;opacity:.6;padding:2px 4px}
.facerow{border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;background:#fff}

.lbl-inline{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.lbl-inline input[type=checkbox],.lbl-inline input[type=radio]{width:17px;height:17px}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// onclick="f('…')" の中に入れる文字。引用符や記号がまざっても壊れない
function q(s){ return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
function ic(name, cls){ return `<span class="ic ${cls||''}" aria-hidden="true">${IC_SVG[name]||''}</span>`; }
function fillIcons(root){ (root||document).querySelectorAll('[data-ic]').forEach(el=>{ if (!el.firstChild) el.innerHTML = IC_SVG[el.dataset.ic]||''; }); }
function z2h(s){
  return String(s==null?'':s)
    .replace(/[０-９]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/．/g,'.').replace(/[－ー−]/g,'-');
}
function num(v){
  const s = z2h(v).trim();
  if (s==='' || !/^-?\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function avg(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
function r1(v){ return v==null ? null : Math.round(v*10)/10; }
function fmtDate(v){
  if (!v) return '';
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[0] : String(v);
}
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.style.display='block';
  clearTimeout(t._tm); t._tm = setTimeout(()=>{ t.style.display='none'; }, ms||2200);
}
function reportError(msg){
  if (String(msg).indexOf('__AUTH__') >= 0) return;
  unovl();
  try { alertBox('うまくいきませんでした', String(msg) + '\n\nこの画面を閉じて、もう一度お試しください。'); }
  catch(e){ toast('エラー: ' + msg, 5000); }
}
window.addEventListener('error', e=>reportError(e.message || 'エラーが発生しました'));
window.addEventListener('unhandledrejection', e=>reportError((e.reason && e.reason.message) ? e.reason.message : 'エラーが発生しました'));

      .withSuccessHandler(json=>{
        let r; try { r = JSON.parse(json); } catch(e){ rej(new Error('応答を読み取れませんでした')); return; }
        if (r.ok){ res(r.data); return; }
        if (r.auth){ const er = new Error('__AUTH__'); er.auth = true; lockOut(); rej(er); return; }
        rej(new Error(r.error||'エラーが発生しました'));
      })
      .withFailureHandler(e=>rej(new Error('通信エラー: ' + (e && e.message ? e.message : e))))
      .api(JSON.stringify({action, payload, token:S.token}));
  });
}

function dlg(opt){
  return new Promise(res=>{
    const w = $('dlgwrap');
    const btns = (opt.buttons||[{label:'OK', value:true, cls:'pri'}])
      .map((b,i)=>`<button class="btn ${b.cls||'sec'}" data-i="${i}">${esc(b.label)}</button>`).join('');
    w.innerHTML = `<div class="dlgbox" role="dialog" aria-modal="true"><h3 style="margin-bottom:8px">${esc(opt.title||'')}</h3>

      <div class="row" style="justify-content:flex-end;margin-top:20px">${btns}</div></div>`;
    w.style.display='flex';

      el.onclick = ()=>{ w.style.display='none'; res((opt.buttons||[{value:true}])[+el.dataset.i].value); };

/* --- 評価機会と「面」 ---
 * 観点構成の1要素 = テストの1つの面。{k:観点, max:満点, label:面の名前, unit:面の単元, id:面ID}
 * 記録は「機会ID|児童ID|面ID」で持つ。面ID はふつう観点そのもの(知・思・主)で、
 * 同じ観点の面が2つ以上あるときだけ「知2」のような id を持つ */
function faces(opp){
  if (opp._fsrc !== opp['観点構成']){
    let fs = [];
    try { fs = JSON.parse(opp['観点構成'])||[]; } catch(e){}
    opp._fs = fs.filter(f=>f && KAN_FULL[f.k]); opp._fsrc = opp['観点構成'];
  }
  return opp._fs;
}
function fid(f){ return f.id || f.k; }
function dupKan(opp){ return memo('dup|'+opp['機会ID'], ()=>{ const s={}; return faces(opp).some(f=>{ if (s[f.k]) return true; s[f.k]=1; return false; }); }); }
function faceName(opp, f){
  if (f.label && String(f.label).trim()) return String(f.label);
  if (dupKan(opp)) return (faces(opp).indexOf(f)+1) + '枚目';
  return opp['機会名'];
}
function faceUnitId(opp, f){ return f.unit || opp['単元ID'] || ''; }
function unitName(id){ const u = S.b.units.find(x=>x['単元ID']===id); return u ? u['単元名'] : ''; }
// 表と裏で単元が違うテストかどうか
function isSplit(opp){
  return memo('split|'+opp['機会ID'], ()=>{
    const set = {};
    faces(opp).forEach(f=>{ set[faceUnitId(opp, f)] = 1; });
    return Object.keys(set).length > 1;
  });
}
function showNames(opp){ return isSplit(opp) || dupKan(opp); }
function splitUnitNames(opp){
  const seen = [], out = [];
  faces(opp).forEach(f=>{ const id = faceUnitId(opp, f); if (seen.indexOf(id)<0){ seen.push(id); out.push(unitName(id)||'単元なし'); } });
  return out;
}

function rkey(oppId, stuId, k){ return oppId+'|'+stuId+'|'+k; }
function getRec(oppId, stuId, k){ return S.rec[rkey(oppId,stuId,k)] || null; }
function recOf(opp, stuId, f){ return getRec(opp['機会ID'], stuId, fid(f)); }
function faceMax(f, r){ const m = r && r.max ? num(r.max) : null; return m!=null && m>0 ? m : f.max; }

function unitSort(a,b){
  const ta = a['学期'] ? termIndex(a['学期']) : -1, tb = b['学期'] ? termIndex(b['学期']) : -1;
  if (ta !== tb) return ta - tb;
  return (num(a['表示順'])||99) - (num(b['表示順'])||99);
}
function oppSort(a,b){
  const av = num(a['表示順']), bv = num(b['表示順']);
  return (av==null?1e9:av) - (bv==null?1e9:bv);
}
function oppsOfSubj(subjId){ return memo('obs|'+subjId, ()=>S.b.opps.filter(o=>o['教科ID']===subjId)); }
function unitsOf(subjId){ return memo('units|'+subjId, ()=>S.b.units.filter(u=>u['教科ID']===subjId).sort(unitSort)); }
function oppsIn(subjId, unitId, term){
  return oppsOfSubj(subjId).filter(o=>(o['単元ID']||'')===unitId && (term==='年間'||o['学期']===term)).sort(oppSort);
}
function oppsOfSubject(subjId, term, kind){
  return memo('oos|'+subjId+'|'+term+'|'+(kind||''), ()=>{
    const out = [];
    const known = {};
    unitsOf(subjId).forEach(u=>{
      known[u['単元ID']] = 1;
      oppsIn(subjId, u['単元ID'], term).forEach(o=>{ if (!kind || o['種別']===kind) out.push({o, u}); });
    });
    // 単元なし・単元が消えたものは最後に
    oppsOfSubj(subjId).filter(o=>!known[o['単元ID']||''] && (term==='年間'||o['学期']===term)).sort(oppSort)
      .forEach(o=>{ if (!kind || o['種別']===kind) out.push({o, u:null}); });
    return out;
  });
}
function bounds(subjId){
  return memo('bnd|'+subjId, ()=>{
    const s = S.b.subjects.find(x=>x['教科ID']===subjId);
    return { A: s && num(s['A閾値'])!=null ? num(s['A閾値']) : 90,
             B: s && num(s['B閾値'])!=null ? num(s['B閾値']) : 60 };
  });
}
function gradeOf(pct, subjId){
  if (pct==null) return null;
  const b = bounds(subjId);
  return pct>=b.A ? 'A' : pct>=b.B ? 'B' : 'C';
}

/* --- 集計:テストと見取りは別々に100%で評価する --- */
function calcStu(stuId, subjId, term){
  return memo('calc|'+stuId+'|'+subjId+'|'+term, ()=>{
    const b = bounds(subjId), base = baseKind();
    const acc = {};
    KAN_ORDER.forEach(k=>{ acc[k] = {tRaw:0,tMax:0,tN:0,tAbs:0,tExc:0, mRaw:0,mMax:0,mN:0,mAbs:0,mExc:0}; });
    oppsOfSubj(subjId).forEach(opp=>{
      if (term!=='年間' && opp['学期']!==term) return;
      const isTest = opp['種別']==='テスト';
      faces(opp).forEach(f=>{
        const a = acc[f.k];
        const r = recOf(opp, stuId, f);
        if (!a || !r) return;
        if (r.state===ST_EXC){ isTest ? a.tExc++ : a.mExc++; return; }
        if (r.state===ST_ABS){ isTest ? a.tAbs++ : a.mAbs++; return; }
        if (r.raw==='') return;
        const n = num(r.raw), mx = faceMax(f, r);
        if (n==null || !mx) return;
        if (isTest){ a.tRaw+=n; a.tMax+=mx; a.tN++; } else { a.mRaw+=n; a.mMax+=mx; a.mN++; }
      });
    });
    const out = {};
    KAN_ORDER.forEach(kan=>{
      const a = acc[kan];
      const t = a.tMax ? r1(a.tRaw/a.tMax*100) : null;
      const m = a.mMax ? r1(a.mRaw/a.mMax*100) : null;
      const tG = t==null ? null : (t>=b.A ? 'A' : t>=b.B ? 'B' : 'C');
      const mG = m==null ? null : (m>=b.A ? 'A' : m>=b.B ? 'B' : 'C');
      out[kan] = {
        t, tG, tRaw:r1(a.tRaw), tMax:a.tMax, tN:a.tN, tAbs:a.tAbs, tExc:a.tExc, tThin: t!=null && (a.tN<=2 || a.tAbs+a.tExc>=a.tN),
        m, mG, mRaw:r1(a.mRaw), mMax:a.mMax, mN:a.mN, mAbs:a.mAbs, mExc:a.mExc, mThin: m!=null && (a.mN<=2 || a.mAbs+a.mExc>=a.mN),
        auto:  base==='test' ? (t!=null?t:m) : base==='mitori' ? (m!=null?m:t) : null,
        autoG: base==='test' ? (tG||mG)      : base==='mitori' ? (mG||tG)      : null,
        A:b.A, B:b.B
      };
    });
    return out;
  });
}
// 1回のテストの、1つの面の結果
function faceResult(opp, f, stuId){
  const r = recOf(opp, stuId, f);
  if (!r) return null;
  if (r.state===ST_EXC) return {exc:true};
  if (r.state===ST_ABS) return {abs:true};
  if (r.raw==='') return null;
  const n = num(r.raw), mx = faceMax(f, r);
  if (n==null || !mx) return null;
  return { raw:n, max:mx, pct: n/mx*100 };
}
// いくつかの面の合計(1回のテスト全体、または観点ごと)
function totalOf(opp, stuId, fs){
  let raw=0, max=0, n=0, abs=0, exc=0;
  fs.forEach(f=>{
    const r = faceResult(opp, f, stuId);
    if (!r) return;
    if (r.exc){ exc++; return; }
    if (r.abs){ abs++; return; }
    raw+=r.raw; max+=r.max; n++;
  });
  if (n===0){
    if (fs.length && exc>=fs.length) return {exc:true};
    if (abs) return {abs:true};
    return null;
  }
  return { raw:r1(raw), max, pct: max ? raw/max*100 : null, whole: n+abs+exc===fs.length };
}
function oppTotal(opp, stuId){ return totalOf(opp, stuId, faces(opp)); }
function avgOf(opp, fs){
  const v = [];
  rosterOf(opp['教科ID']).forEach(st=>{
    const t = totalOf(opp, st['児童ID'], fs);
    if (t && t.pct!=null) v.push(t.pct);
  });
  return avg(v);
}
function oppAvg(opp){ return memo('oavg|'+opp['機会ID'], ()=>avgOf(opp, faces(opp))); }
function faceAvg(opp, f){ return avgOf(opp, [f]); }

function gBadge(g, title){

  return `<span class="gbadge ${g}" title="${esc(title||'')}">${g}</span>`;
}
function finalOf(x, ov){ return ov ? {g:ov.grade, manual:true, ov} : {g:x.autoG, manual:false, ov:null}; }
function finalBadge(x, ov){
  const f = finalOf(x, ov);
  if (!f.g) return `<span class="gbadge none" title="まだ決まっていません">−</span>`;
  if (f.manual){
    const stale = ov.auto!=='' && x.auto!=null && Math.abs(num(ov.auto) - x.auto) > 0.05;
    return `<span class="gbadge ${f.g}" title="手動で確定${ov.reason?': '+esc(ov.reason):''}${stale?' / 確定後に元の点数が変わっています':''}">${f.g}<span class="gmark">${stale?'!':'手'}</span></span>`;
  }
  return `<span class="gbadge ${f.g}" title="${BASE_LABEL[baseKind()]}から自動">${f.g}</span>`;
}

/* ================= 保存キュー ================= */
function setSaveChip(){
  const el = $('saveChip');
  el.className=''; el.onclick=null;
  const n = Object.keys(S.queue).length;
  if (S.view==='lock'){ el.textContent = ''; return; }
  if (S.saveErr){
    el.className='err'; el.textContent='保存できていません — タップで再送';
    el.onclick = ()=>{ S.saveErr=false; setSaveChip(); flushSave(); };
  } else if (S.saveBusy || n){
    el.className='saving'; el.textContent='保存中…';
  } else {
    el.textContent = S.b ? '保存済み' : '';
  }
}
// group を渡すと、まとめて1回で取り消せる
function queueRec(oppId, stuId, k, raw, memo, state, max, group){
  const key = rkey(oppId, stuId, k);
  const item = {key, oppId, stuId, k, prev: S.rec[key] ? Object.assign({}, S.rec[key]) : null};
  if (group) group.push(item);
  else { S.undo.push([item]); if (S.undo.length > 60) S.undo.shift(); }
  applyRec(key, oppId, stuId, k, raw, memo, state, max);
}
function applyRec(key, oppId, stuId, k, raw, memo, state, max){
  raw = String(raw==null?'':raw); memo = memo||''; state = state||'';
  if (raw==='' && state==='' && memo==='') delete S.rec[key];
  else S.rec[key] = { raw, memo, state, max: max==null?'':String(max) };
  S.queue[key] = { oppId, stuId, kan:k, raw, memo, state, max: max==null?'':String(max) };
  bust();
  setSaveChip();
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(flushSave, 1000);
}
function flushSave(){
  if (S.saveBusy || S.saveErr || !S.token) return;
  const keys = Object.keys(S.queue);
  if (!keys.length){ setSaveChip(); return; }
  const batch = keys.map(k=>S.queue[k]);
  const sent = {}; keys.forEach(k=>sent[k]=S.queue[k]);
  S.queue = {};
  S.saveBusy = true; setSaveChip();
  call('saveRecords', {records:batch})
    .then(()=>{ S.saveBusy=false; setSaveChip(); if (Object.keys(S.queue).length) flushSave(); })
    .catch(e=>{
      // 送れなかった分は、あとから入れたものを消さないように戻す
      Object.keys(sent).forEach(k=>{ if (!S.queue[k]) S.queue[k]=sent[k]; });
      S.saveBusy=false;
      if (!e.auth) S.saveErr=true;   // 合言葉の聞き直しなら、入ったあとで自動で送る
      if (S.view==='lock') render();  // 「保存していない点が n件」を出す
      else setSaveChip();
    });
}
function stepBack(){
  const g = S.undo.pop();
  if (!g){ toast('取り消す操作がありません'); return; }
  g.slice().reverse().forEach(u=>{
    const p = u.prev;
    applyRec(u.key, u.oppId, u.stuId, u.k, p?p.raw:'', p?p.memo:'', p?p.state:'', p?p.max:'');
  });
  toast(g.length>1 ? `${g.length}件まとめて取り消しました` : '1つ取り消しました');
  render();
}

/* ================= 合言葉の画面 ================= */
let LK = { pin:'', pin2:'', step:1, msg:'', busy:false };

function lockOut(){
  if (S.view === 'lock') return;
  const wasIn = !!S.b;
  RESUME = { view:S.view, arg:S.arg };
  S.token = null; saveToken(null); S.b = null;
  S.auth.hasPin = true;
  LK = { pin:'', pin2:'', step:1, msg: wasIn ? 'しばらく使わなかったので、もう一度入力してください' : '', busy:false };
  S.view = 'lock';
  shutModal(); unovl();
  try { render(); } catch(e){}
  // 合言葉が外された・変わったなどで状態がちがうかもしれないので、確かめて描きなおす
  call('authState', {}).then(a=>{ S.auth = a; if (S.view==='lock') render(); }).catch(()=>{});
}
function lockCur(){ return (S.auth.hasPin || LK.step===1) ? 'pin' : 'pin2'; }
function keyPush(d){
  if (LK.busy) return;
  const cur = lockCur();
  if (LK[cur].length >= 6) return;
  LK[cur] += String(d);
  LK.msg = '';
  render();
}
function keyBack(){
  if (LK.busy) return;
  const cur = lockCur();
  LK[cur] = LK[cur].slice(0, -1);
  render();
}
function keyGo(){
  if (LK.busy) return;
  if (S.auth.hasPin) return doLogin();
  if (LK.step===1){
    if (!/^\d{4,6}$/.test(LK.pin)){ LK.msg = '数字4〜6桁で決めてください'; render(); return; }
    LK.step = 2; LK.msg = ''; render(); return;
  }
  if (LK.pin !== LK.pin2){ LK.msg = '2回目が合いません。もう一度入力してください'; LK.pin2=''; render(); return; }
  LK.busy = true; render();
  ovl('合言葉を登録中…');
  call('setPin', {newPin: LK.pin}).then(r=>{
    S.token = r.token; saveToken(r.token); S.auth.hasPin = true;
    return enterApp();
  }).then(()=>toast('合言葉を登録しました'))
    .catch(e=>{ unovl(); LK.busy=false; LK.msg = e.message; LK.pin=''; LK.pin2=''; LK.step=1; render(); });
}
function doLogin(){
  if (!/^\d{4,6}$/.test(LK.pin)){ LK.msg = '数字4〜6桁を入力してください'; render(); return; }
  LK.busy = true; render();
  ovl('確認中…');
  call('login', {pin: LK.pin}).then(r=>{
    S.token = r.token; saveToken(r.token);
    return enterApp();
  }).catch(e=>{
    unovl(); LK.busy=false; LK.pin='';
    LK.msg = e.auth ? '合言葉を入力してください' : e.message;
    render();
  });
}

document.addEventListener('keydown', e=>{

function reloadBundle(){

function render(){

function daysSinceBackup(){
  const at = setting('最終バックアップ','');
  if (!at) return null;
  const m = String(at).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function backupNotice(){
  const d = daysSinceBackup();

function oppProgress(opp){
  return memo('prog|'+opp['機会ID'], ()=>{
    const fs = faces(opp), sts = rosterOf(opp['教科ID']);
    let filled=0, total=0, exc=0;
    sts.forEach(st=>fs.forEach(f=>{
      const r = recOf(opp, st['児童ID'], f);
      if (r && r.state===ST_EXC){ exc++; return; }
      total++;
      if (r && (r.raw!=='' || r.state===ST_ABS)) filled++;
    }));
    return {filled, total, exc};
  });
}

/* --- 並び替え(パソコンではドラッグ) --- */
let dragOpp = null, dragUnit = null;
function oppDragStart(e, oppId, unitId){
  dragOpp = {id:oppId, unit:unitId};
  e.dataTransfer.effectAllowed='move'; e.stopPropagation();
  const row = e.target.closest('.oppline');
  if (row) setTimeout(()=>{ row.style.opacity='.4'; }, 0);
}
function oppDragEnd(){
  dragOpp = null;
  document.querySelectorAll('.oppline').forEach(r=>{ r.style.opacity=''; r.classList.remove('drop2'); });
}
function oppDragOver(e, oppId, unitId){
  if (!dragOpp || dragOpp.id===oppId || dragOpp.unit!==unitId) return;
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.add('drop2');
}
function oppDragLeave(e){ e.currentTarget.classList.remove('drop2'); }
function oppDrop(e, oppId, unitId){
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.remove('drop2');
  const info = dragOpp; oppDragEnd();
  if (!info || info.id===oppId || info.unit!==unitId) return;
  const list = oppsIn(homeSubj, unitId, '年間');
  const from = list.findIndex(o=>o['機会ID']===info.id), to = list.findIndex(o=>o['機会ID']===oppId);
  if (from<0||to<0) return;
  list.splice(to, 0, list.splice(from,1)[0]);
  const orders = list.map((o,i)=>{ o['表示順']=String(i+1); return {id:o['機会ID'], order:String(i+1)}; });
  render();
  call('saveOppOrder', {orders}).then(()=>toast('並び順を保存しました')).catch(fail('並び順を保存できませんでした'));
}
function unitDragStart(e, uid){
  dragUnit = uid; e.dataTransfer.effectAllowed='move';
  const card = e.target.closest('.unitbox');
  if (card) setTimeout(()=>card.classList.add('moving'), 0);
}
function unitDragEnd(){
  dragUnit = null;
  document.querySelectorAll('.unitbox').forEach(c=>c.classList.remove('moving','drop'));
}
function unitDragOver(e, uid){
  if (!dragUnit || dragUnit===uid) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drop');
}
function unitDragLeave(e){ e.currentTarget.classList.remove('drop'); }
function unitDrop(e, target){
  e.preventDefault(); e.currentTarget.classList.remove('drop');
  const src = dragUnit; unitDragEnd();
  if (!src || src===target) return;
  const list = unitsOf(homeSubj).slice();
  const from = list.findIndex(u=>u['単元ID']===src), to = list.findIndex(u=>u['単元ID']===target);
  if (from<0||to<0) return;
  list.splice(to, 0, list.splice(from,1)[0]);
  const orders = list.map((u,i)=>{ u['表示順']=String(i+1); return {id:u['単元ID'], order:String(i+1)}; });
  render();
  call('saveUnitOrder', {orders}).then(()=>toast('並び順を保存しました')).catch(fail('並び順を保存できませんでした'));
}

function unitBoxHtml(u, opps){
  const uid = u ? u['単元ID'] : '';
  const title = u ? esc(u['単元名']) : '単元なし・学期をまたぐ見取り';
  const dnd = u ? `ondragover="unitDragOver(event,'${q(uid)}')" ondragleave="unitDragLeave(event)" ondrop="unitDrop(event,'${q(uid)}')"` : '';
  return `<div class="unitbox" ${dnd}>
    <div class="row nowrap" style="margin-bottom:2px;gap:6px">
      ${u ? `<span class="grip" draggable="true" title="ドラッグで並び替え" ondragstart="unitDragStart(event,'${q(uid)}')" ondragend="unitDragEnd()">${ic('dots-six-vertical')}</span>` : ''}
      <h3 class="uttl" title="${title}">${title}</h3>
      ${u && u['学期'] ? `<span class="tag gray">${esc(u['学期'])}</span>` : ''}
      <span class="grow"></span>

        ${full ? `<span class="done">✓ 全員</span>` : `<span class="tag ${p.filled>0?'warn':'gray'}" title="入力した数/入力する数">${p.filled}/${p.total}</span>`}

function newBBItem(type, order){
  const ord = order || defaultFaceOrder();
  return { type, name: type==='テスト' ? '単元テスト' : '', ks: ord.map(k=>({k, on: type==='テスト' ? (k!=='主') : (k==='主'), max:100})) };
}
function newBBUnit(){
  return { name:'', term: homeTerm!=='年間' ? homeTerm : termNow(), date:'', items:[ newBBItem('テスト', BB?BB.order:null) ] };
}
function openBatchBuilder(){

function bbOrder(ord){

function bbSave(){
  const payload = [];
  const base = unitsOf(homeSubj).length;
  for (let ui=0; ui<BB.units.length; ui++){
    const u = BB.units[ui];
    if (!u.name.trim()){ toast(`単元${ui+1}の名前を入力してください`); return; }
    const opps = [];
    for (let ii=0; ii<u.items.length; ii++){
      const it = u.items[ii];
      const anyOn = it.ks.some(k=>k.on);
      if (!it.name.trim() && !anyOn && u.items.length===1) continue;
      if (!it.name.trim()){ toast(`単元${ui+1}の${ii+1}行目の名前を入力してください`); return; }
      const kanten = [];
      for (const kk of it.ks){
        if (!kk.on) continue;
        const mx = num(kk.max);
        if (mx==null || mx<=0 || mx>1000){ toast(`単元${ui+1}「${it.name}」の満点を確認してください`); return; }
        kanten.push({k:kk.k, max:mx});
      }
      if (!kanten.length){ toast(`単元${ui+1}「${it.name}」の観点を1つ以上選んでください`); return; }
      opps.push({ name:it.name.trim().slice(0,40), type:it.type, term:u.term, date:u.date, kanten:JSON.stringify(kanten) });
    }
    payload.push({ name:u.name.trim().slice(0,40), term:u.term, date:u.date, order:String(base+ui+1), opps });
  }
  if (!payload.length){ toast('単元を入力してください'); return; }
  shutModal(); ovl('保存中…');
  call('createUnitsBulk', {subjectId:homeSubj, units:payload})
    .then(()=>reloadBundle()).then(()=>{
      unovl(); go('home');
      toast(`単元${payload.length}個・テスト/見取り${payload.reduce((a,u)=>a+u.opps.length,0)}件を登録しました`);
    })
    .catch(fail('保存できませんでした'));
}

/* ================= テスト・見取りフォーム(面ごとの観点・満点・名前・単元) ================= */
let FF = [], FF_SUBJ = null, FF_UNIT = '', FF_MORE = false;
function ffMove(i, d){
  const j = i+d;
  if (j<0 || j>=FF.length) return;
  const t = FF[i]; FF[i] = FF[j]; FF[j] = t;
  drawFaces();
}
function ffAdd(){
  const used = FF.map(f=>f.k);
  const k = KAN_ORDER.find(x=>used.indexOf(x)<0) || FF[FF.length-1].k || '知';
  FF.push({k, max:100, label:'', unit:'', oid:null});
  drawFaces();
}
function ffDel(i){
  if (FF.length<=1){ toast('面は1つ以上必要です'); return; }
  FF.splice(i,1); drawFaces();
}
function drawFaces(){
  const host = $('ffList');
  if (!host) return;
  const units = unitsOf(FF_SUBJ);
  host.innerHTML = FF.map((f,i)=>`<div class="facerow">
      <div class="row">
        <span class="seq">${i+1}枚目</span>
        <select aria-label="${i+1}枚目の観点" onchange="FF[${i}].k=this.value">${KAN_ORDER.map(k=>`<option value="${k}" ${f.k===k?'selected':''}>${KAN_FULL[k]}</option>`).join('')}</select>
        <span class="row" style="gap:5px"><input type="number" aria-label="${i+1}枚目の満点" min="1" max="1000" value="${f.max==null?'':f.max}" oninput="FF[${i}].max=num(this.value)" style="width:80px"><span class="sub">点満点</span></span>
        <span class="grow"></span>
        <button class="iconbtn" title="上へ" aria-label="上へ" ${i===0?'disabled style="opacity:.3"':''} onclick="ffMove(${i},-1)">↑</button>
        <button class="iconbtn" title="下へ" aria-label="下へ" ${i===FF.length-1?'disabled style="opacity:.3"':''} onclick="ffMove(${i},1)">↓</button>
        <button class="iconbtn" title="この面を外す" aria-label="${i+1}枚目を外す" onclick="ffDel(${i})">×</button>
      </div>
      ${FF_MORE?`<div class="row facemore">
        <input value="${esc(f.label||'')}" aria-label="${i+1}枚目の名前" placeholder="この面の名前(空ならテスト名)" oninput="FF[${i}].label=this.value" style="flex:1;min-width:150px">
        <select aria-label="${i+1}枚目の単元" onchange="FF[${i}].unit=this.value" style="max-width:220px">
          <option value="">単元はテストと同じ</option>
          ${units.map(u=>`<option value="${esc(u['単元ID'])}" ${f.unit===u['単元ID']?'selected':''}>${esc(u['単元名'])}</option>`).join('')}
        </select>
      </div>`:''}
    </div>`).join('') +
    `<div class="row" style="margin-top:4px">
      <button class="btn ghost sm" onclick="ffAdd()">＋ 面を追加</button>
      <label class="lbl-inline"><input type="checkbox" ${FF_MORE?'checked':''} onchange="FF_MORE=this.checked;drawFaces()">面ごとに名前・単元を分ける(表と裏で単元が違うとき)</label>
    </div>`;
}
// 面ID を決める。前からある面は ID をそのまま使う(入力済みの点とつながったまま)
function assignFaceIds(list){
  const used = {};
  list.forEach(f=>{ if (f.oid) used[f.oid] = 1; });
  return list.map(f=>{
    let id = f.oid;
    if (!id){ id = f.k; let n = 2; while (used[id]) id = f.k + (n++); used[id] = 1; }
    const e = {k:f.k, max:num(f.max)};
    if (id !== f.k) e.id = id;
    if (f.label && f.label.trim()) e.label = f.label.trim().slice(0,40);
    if (f.unit) e.unit = f.unit;
    return e;
  });
}

      <p class="sub" style="font-size:12px;margin:2px 0 8px">上から順に、入力画面の列になります。表も裏も同じ観点なら「＋ 面を追加」で同じ観点をもう1つ選べます。</p>
      <div id="ffList"></div></div>
    ${o?`<div class="row" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)"><button class="btn danger sm" id="ofDel">このテストを削除</button></div>`:''}
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn sec" onclick="shutModal()">キャンセル</button>
      <button class="btn pri" id="ofGo">${o?'保存':'追加'}</button>
    </div>`, false);
  drawFaces();
  let curType = type;
  if (!o) $('ofType').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      if (curType === b.dataset.v) return;
      curType = b.dataset.v;
      $('ofType').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
      const lbl = $('ofNameLbl'), inp = $('ofName');
      lbl.textContent = curType==='テスト' ? 'テスト名' : '名前';
      inp.placeholder = curType==='テスト' ? '例:単元テスト' : '例:ノート、ワークシートなど';
      const cur = inp.value.trim();
      if (cur==='' || cur==='単元テスト') inp.value = curType==='テスト' ? '単元テスト' : '';
      FF = (curType==='テスト' ? ['思','知'] : ['主']).map(k=>({k, max:100, label:'', unit:'', oid:null}));
      drawFaces();
    };
  });
  $('ofGo').onclick = ()=>{
    const fv = readFields(['ofName','ofTerm','ofDate']);
    const name = fv.ofName.trim();
    if (!name){ toast(curType==='テスト' ? 'テスト名を入力してください' : '名前を入力してください'); return; }
    if (name.length > 40){ toast('名前が長すぎます(40字まで)'); return; }
    if (!FF.length){ toast('面を1つ以上つくってください'); return; }
    for (const f of FF){
      const mx = num(f.max);
      if (mx==null || mx<=0 || mx>1000){ toast('満点は1〜1000の数字で入力してください'); return; }
    }
    const kanten = assignFaceIds(FF);
    const save = ()=>{
      const p = o ? {id:oppId, name, unitId:o['単元ID'], term:fv.ofTerm, date:fv.ofDate, kanten:JSON.stringify(kanten)}
                  : {subjectId:FF_SUBJ, unitId:FF_UNIT, name, type:curType, term:fv.ofTerm,
                     date:fv.ofDate, kanten:JSON.stringify(kanten),
                     order:String(oppsIn(FF_SUBJ, FF_UNIT, '年間').length+1)};
      shutModal(); ovl('保存中…');
      call('saveOpp', p).then(()=>reloadBundle()).then(()=>{ unovl(); render(); toast(o?'保存しました':'追加しました'); })
        .catch(fail('保存できませんでした'));
    };
    // 外した面に点が入っていたら、消えることを先に伝える
    if (o){
      const keepIds = {}; kanten.forEach(e=>keepIds[e.id||e.k]=1);
      const gone = faces(o).filter(f=>!keepIds[fid(f)]);
      const n = gone.reduce((a,f)=>a + Object.keys(S.rec).filter(k=>k.indexOf(oppId+'|')===0 && k.slice(k.lastIndexOf('|')+1)===fid(f)).length, 0);
      if (n){
        askYes('外す面の点が消えます', `外した面に入っている ${n}件 の点・メモが消えます。元に戻せません。\nよろしいですか?`, '消して保存').then(y=>{ if (y) save(); });
        return;
      }
    }
    save();
  };
  if (o) $('ofDel').onclick = ()=>{ shutModal(); removeOpp(oppId); };
  if (!o) $('ofName').select();
}

/* ================= 入力画面 ================= */
let EV = { oppId:null, mode:'list', dir:'col', si:0, fi:0, step:null, pick:null };
let jumpTo = null;
function goEntryAt(oppId, stuId){ jumpTo = {oppId, stuId}; go('entry', oppId); }
function curOpp(){ return S.b.opps.find(o=>o['機会ID']===S.arg); }

function cellShow(r){
  if (!r) return {t:'ー', c:'blank'};
  if (r.state===ST_EXC) return {t:'除外', c:'exc'};
  if (r.state===ST_ABS) return {t:'欠', c:'abs'};
  if (r.raw==='') return {t:'ー', c:'blank'};
  return {t:r.raw, c:''};
}
function vEntry(){

          ${(()=>{ const t = [f.label||'', faceUnitId(opp,f)!==(opp['単元ID']||'') ? unitName(faceUnitId(opp,f)) : ''].filter(x=>x).join(' ・ ');
             return t ? `<div style="font-weight:500;font-size:10.5px;color:var(--sub)">${esc(t)}</div>` : ''; })()}</th>`).join('')}
        <th style="width:36px"></th></tr>
      ${sts.map((st,si)=>{

        <button class="${EV.dir==='col'?'on':''}" onclick="EV.dir='col';render()" title="同じ面を全員分→次の面">縦に進む</button>

function oneByOneHtml(opp, fs, sts){
  const status = st=>{
    let f=0,k=0,x=0;
    fs.forEach(fc=>{
      const r = recOf(opp, st['児童ID'], fc);
      if (!r) return;
      if (r.state===ST_EXC){ x++; return; }
      if (r.state===ST_ABS){ k++; f++; return; }
      if (r.raw!=='') f++;
    });
    if (x===fs.length) return 'exc';
    if (f===0) return '';
    if (k===fs.length) return 'abs';
    return f>=fs.length-x ? 'full' : 'part';
  };
  const sel = EV.pick!=null ? sts[EV.pick] : null;
  return `
    <p class="sub" style="margin-bottom:10px"><b>番号を押して → 点を押す</b>。次に入力していない子が自動で選ばれます。</p>
    <div class="numtiles">
      ${sts.map((st,i)=>`<button class="numtile ${status(st)} ${EV.pick===i?'here':''}" data-tile="${i}" onclick="EV.pick=${i};EV.fi=0;EV.step=null;render()">
        <span class="n">${esc(st['出席番号'])}</span><small>${esc(st['名前'])}</small></button>`).join('')}
    </div>
    ${sel ? `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:13px">
      <div class="row">
        <div class="padname"><span class="no">${esc(sel['出席番号'])}番</span> ${esc(sel['名前'])}</div>
        <span class="grow"></span>
        <button class="btn sec sm" onclick="EV.pick=null;render()">閉じる</button>
      </div>
      <div class="row" style="margin-top:10px">
        ${fs.map((f,i)=>{
          const r = recOf(opp, sel['児童ID'], f);
          const sh = cellShow(r);
          return `<button class="facebox ${EV.fi===i?'on':''}" onclick="EV.fi=${i};EV.step=null;render()">
            <div class="sub" style="font-weight:700">${fs.length>1?(i+1)+'枚目 ':''}${KAN_FULL[f.k]} <span style="font-weight:400">/${f.max}</span></div>
            ${showNames(opp)?`<div class="sub" style="font-size:11px">${esc(faceName(opp,f))}</div>`:''}
            <div class="v">${r&&r.raw!==''&&!r.state?esc(r.raw):`<span class="ph">${esc(sh.t==='ー'?'未入力':sh.t)}</span>`}</div>
          </button>`;
        }).join('')}
      </div>
    </div>` : `<p class="sub" style="margin-top:14px">↑ 番号をタップすると入力できます</p>`}`;
}
// 選んでいるマスが見えるように、表の中だけを最小限スクロールする
function keepVisible(el){
  const wrap = el.closest('.tblwrap');
  if (wrap){
    const head = wrap.querySelector('tr');
    const hh = head ? head.getBoundingClientRect().height : 0;
    const r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    if (r.top < w.top + hh) wrap.scrollTop -= (w.top + hh - r.top) + 6;
    else if (r.bottom > w.bottom - 4) wrap.scrollTop += (r.bottom - w.bottom) + 10;
  } else {
    const r = el.getBoundingClientRect();
    if (r.top < 64 || r.bottom > window.innerHeight) el.scrollIntoView({block:'nearest'});
  }
}
function afterEntry(){
  const opp = curOpp(); if (!opp) return;
  const fs = faces(opp), sts = rosterOf(opp['教科ID']);
  if (!sts.length || !fs.length) return;
  if (window.innerWidth <= 1020 && EV.scrolled !== opp['機会ID']){
    EV.scrolled = opp['機会ID'];
    const pn = document.querySelector('.entrypanel');
    if (pn) window.scrollTo(0, pn.getBoundingClientRect().top + window.scrollY - 64);
  }
  if (EV.mode==='one' && EV.pick==null){ drawPad(opp, null, null); return; }
  const si = EV.mode==='one' ? EV.pick : Math.min(EV.si, sts.length-1);
  const fi = Math.min(EV.fi, fs.length-1);
  drawPad(opp, sts[si], fs[fi]);
  const active = document.querySelector('.cell.on') || document.querySelector('.numtile.here');
  if (active) keepVisible(active);
  const pi = $('padIn');
  if (pi && window.matchMedia('(hover: hover)').matches) pi.focus({preventScroll:true});
}
function drawPad(opp, st, f){
  const host = $('padCol'); if (!host) return;
  const p = oppProgress(opp);
  const steps = stepValues();
  const isMit = opp['種別']==='見取り';
  const meter = `<div class="row" style="margin:4px 0 12px"><div class="meter"><i style="width:${p.total?p.filled/p.total*100:0}%"></i></div>
    <span class="sub" style="font-size:12px;white-space:nowrap">${p.filled}/${p.total}人分${p.exc?' (除外'+p.exc+')':''}</span></div>`;
  if (!st || !f){
    host.innerHTML = `<div class="padname">入力パッド</div>
      <p class="sub" style="margin:6px 0 10px">番号タイルをタップすると入力が始まります</p>${meter}`;
    return;
  }
  const r = recOf(opp, st['児童ID'], f);
  const max = f.max;
  let nums = [];
  for (let v = Math.floor(max/5)*5; v>=0; v-=5) nums.push(v);
  if (nums[0]!==max) nums.unshift(max);
  if (nums.length>24) nums = nums.slice(0,24);
  const stepRow = isMit ? `<div class="row" style="gap:6px;margin-bottom:8px">
      ${['A','B','C'].map(g=>`<button class="stepbtn ${g} ${EV.step===g?'on':''}" style="flex:1;min-width:0" onclick="tapStep('${g}')">${g}</button>`).join('')}
    </div>` : '';
  const grid = EV.step
    ? `<div class="numgrid">${(steps[EV.step]||[]).filter(v=>v<=max).map(v=>`<button class="nbtn" onclick="putVal(${v})">${v}</button>`).join('') || '<span class="sub" style="grid-column:1/-1">設定の「評価のルール」で数値を登録できます</span>'}</div>
       <button class="nbtn util" style="width:100%;margin-top:6px" onclick="EV.step=null;render()">ぜんぶの数字を表示</button>`
    : `<div class="numgrid">${nums.map(v=>`<button class="nbtn" onclick="putVal(${v})">${v}</button>`).join('')}</div>`;
  host.innerHTML = `
    <div class="padname"><span class="no">${esc(st['出席番号'])}番</span>${esc(st['名前'])}</div>
    <div class="sub" style="font-weight:600">${KAN_FULL[f.k]} /${max}点満点${showNames(opp)?' ・ '+esc(faceName(opp,f)):''}</div>
    ${meter}
    <div class="padgrid">
      <div class="padmain">${stepRow}${grid}</div>
      <div class="padside">
        <input id="padIn" type="text" inputmode="decimal" placeholder="直接入力" aria-label="点数を直接入力" autocomplete="off">
        <div class="pair">
          <button class="nbtn util" onclick="bump(-1)" aria-label="1点へらす">−1</button>
          <button class="nbtn util" onclick="bump(1)" aria-label="1点ふやす">＋1</button>
        </div>
        <button class="nbtn abs ${r&&r.state===ST_ABS?'on':''}" title="欠席。評価の母数には入りません。未実施チェックに出ます" onclick="putState('${ST_ABS}')">欠席</button>
        <button class="nbtn util" onclick="clearCell()">消す</button>
        <button class="nbtn util" onclick="stepBack()">${ic('arrow-counter-clockwise')}取消</button>
        <button class="nbtn util" onclick="nextBlank()">次の未入力→</button>
      </div>
    </div>
    <div class="padmore">
      <button class="nbtn util" onclick="openMemo()">${ic('note-pencil')}メモ</button>
      ${EV.mode==='list' ? `<button class="nbtn util" onclick="openFillAll()">全員に同じ点</button>` : ''}
      <button class="nbtn exc ${r&&r.state===ST_EXC?'on':''}"
        title="この子はこのテストの対象にしない。母数にも入力の分母にも入りません" onclick="putState('${ST_EXC}')">除外する</button>
    </div>
    ${r&&r.state===ST_EXC ? `<p class="sub" style="margin-top:8px;color:var(--shu)">このテストの対象外にしています。もう一度「除外する」を押すと解除できます。</p>` : ''}`;
}
function tapStep(g){ EV.step = EV.step===g ? null : g; render(); }
function curCell(){
  const opp = curOpp(); if (!opp) return null;
  const fs = faces(opp), sts = rosterOf(opp['教科ID']);
  const si = EV.mode==='one' ? EV.pick : EV.si;
  if (si==null || !sts[si] || !fs.length) return null;
  const fi = Math.min(EV.fi, fs.length-1);
  return { opp, fs, sts, si, fi, st:sts[si], f:fs[fi] };
}
function putVal(v){
  const c = curCell(); if (!c) return;
  const n = num(v);
  if (n==null){ toast('数字を入力してください'); return; }
  if (n<0 || n>c.f.max){
    toast(`0〜${c.f.max}点の範囲で入力してください`);
    const pad = $('padCol'); if (pad){ pad.classList.add('wobble'); setTimeout(()=>pad.classList.remove('wobble'), 350); }
    return;
  }
  const prev = recOf(c.opp, c.st['児童ID'], c.f);
  queueRec(c.opp['機会ID'], c.st['児童ID'], fid(c.f), Math.round(n*10)/10, prev?prev.memo:'', '', c.f.max);
  EV.step = null; blinkNext(c);
}
function putState(state){
  const c = curCell(); if (!c) return;
  const prev = recOf(c.opp, c.st['児童ID'], c.f);
  const same = prev && prev.state===state;
  queueRec(c.opp['機会ID'], c.st['児童ID'], fid(c.f), '', prev?prev.memo:'', same?'':state, c.f.max);
  EV.step = null;
  if (same){ render(); toast('解除しました'); return; }
  blinkNext(c);
}
function blinkNext(c){
  const mode = EV.mode, si = mode==='one' ? EV.pick : EV.si, fi = c.fi;
  moveNext(c); render();
  const el = document.querySelector(mode==='one' ? `[data-tile="${si}"]` : `[data-cell="${si}_${fi}"]`);
  if (el){ el.style.outline='2px solid var(--ai)'; setTimeout(()=>{ el.style.outline=''; }, 600); }
}
function clearCell(){
  const c = curCell(); if (!c) return;
  const prev = recOf(c.opp, c.st['児童ID'], c.f);
  if (!prev){ toast('このマスはまだ空です'); return; }
  queueRec(c.opp['機会ID'], c.st['児童ID'], fid(c.f), '', '', '', '');
  render();
}
function bump(d){
  const c = curCell(); if (!c) return;
  const r = recOf(c.opp, c.st['児童ID'], c.f);
  const base = r && r.raw!=='' && !r.state ? num(r.raw) : null;
  if (base==null){ toast('先に点数を入れてから ＋1 / −1 で微調整します'); return; }
  queueRec(c.opp['機会ID'], c.st['児童ID'], fid(c.f), Math.min(c.f.max, Math.max(0, base+d)), r?r.memo:'', '', c.f.max);
  render();
}
function moveNext(c){
  if (EV.mode==='one'){
    if (EV.fi < c.fs.length-1){ EV.fi++; return; }
    const nx = nextBlankStudent(c, EV.pick);
    if (nx!=null){ EV.pick = nx; EV.fi = 0; }
    else { EV.pick = null; EV.fi = 0; toast('全員入力済みです'); }
    return;
  }
  if (EV.dir==='col'){
    if (EV.si < c.sts.length-1) EV.si++;
    else if (EV.fi < c.fs.length-1){ EV.fi++; EV.si = 0; }
    else toast('最後のマスです');
  } else {
    if (EV.fi < c.fs.length-1) EV.fi++;
    else if (EV.si < c.sts.length-1){ EV.si++; EV.fi = 0; }
    else toast('最後のマスです');
  }
}
function isBlank(opp, stuId, f){
  const r = recOf(opp, stuId, f);
  return !r || (r.raw==='' && !r.state);
}
function nextBlankStudent(c, from){
  for (let s=1; s<=c.sts.length; s++){
    const si = ((from==null?-1:from) + s + c.sts.length) % c.sts.length;
    if (c.fs.some(f=>isBlank(c.opp, c.sts[si]['児童ID'], f))) return si;
  }
  return null;
}
function nextBlank(){
  const c = curCell(); if (!c) return;
  const total = c.sts.length * c.fs.length;
  let si = EV.mode==='one' ? (EV.pick||0) : EV.si, fi = EV.fi;
  for (let s=0; s<total; s++){
    if (si < c.sts.length-1) si++;
    else { si = 0; fi = (fi+1) % c.fs.length; }
    if (isBlank(c.opp, c.sts[si]['児童ID'], c.fs[fi])){
      if (EV.mode==='one') EV.pick = si; else EV.si = si;
      EV.fi = fi; EV.step = null; render(); return;
    }
  }
  toast('未入力はありません');
}

document.addEventListener('keydown', e=>{
  if (S.view !== 'entry' || modalOpen()) return;
  const pi = $('padIn');
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && document.activeElement!==pi;
  if (typing) return;
  if (e.key==='Enter'){
    e.preventDefault();
    if (pi && pi.value.trim()!==''){ const v = pi.value.trim(); pi.value=''; putVal(v); }
    else { const c = curCell(); if (c){ moveNext(c); render(); } }
    return;
  }
  if (document.activeElement===pi && pi.value.trim()!=='') return;
  if (/^[0-9.]$/.test(e.key) && pi && document.activeElement!==pi){ pi.focus({preventScroll:true}); return; }
  if (EV.mode!=='list') return;
  const c = curCell(); if (!c) return;
  if (e.key==='ArrowDown'){ e.preventDefault(); EV.si = Math.min(c.sts.length-1, EV.si+1); render(); }
  if (e.key==='ArrowUp'){ e.preventDefault(); EV.si = Math.max(0, EV.si-1); render(); }
  if (e.key==='ArrowRight'){ e.preventDefault(); EV.fi = Math.min(c.fs.length-1, EV.fi+1); render(); }
  if (e.key==='ArrowLeft'){ e.preventDefault(); EV.fi = Math.max(0, EV.fi-1); render(); }
});

// 見出しが何段あっても、スクロールしたときに重ならないように位置を合わせる
// (大きさを読むのを先にまとめ、あとから書く。読み書きを交互にすると、表が大きいときにとても遅くなる)
function afterList(){
  const tables = [...document.querySelectorAll('#app table.gridtbl')].map(t=>{
    const heads = [];
    for (const tr of t.rows){ if (tr.querySelector('td')) break; heads.push(tr); }
    const th = t.querySelector('th.stickL');
    return { t, heads, hs: heads.map(tr=>tr.getBoundingClientRect().height),
             w: th ? Math.floor(th.getBoundingClientRect().width) : 0 };
  });
  tables.forEach(x=>{
    let top = 0;
    x.heads.forEach((tr,i)=>{
      if (i>0) tr.querySelectorAll('th').forEach(th=>{ th.style.top = top + 'px'; });
      top += x.hs[i];
    });
    if (x.w) x.t.style.setProperty('--lw', (x.w-1) + 'px');
  });
}

// その教科・その学期で、実際に使われている観点だけを返す
function usedKans(subjId, term, kind){
  return memo('uk|'+subjId+'|'+term+'|'+(kind||''), ()=>{
    const used = {};
    oppsOfSubj(subjId).forEach(o=>{
      if (term!=='年間' && o['学期']!==term) return;
      if (kind && o['種別']!==kind) return;
      faces(o).forEach(f=>{ used[f.k] = 1; });
    });
    return KAN_ORDER.filter(k=>used[k]);
  });
}
// チェックを入れている観点だけに絞った面
function pickedFaces(opp){ return faces(opp).filter(f=>LV.kans[f.k]!==false); }
function countCell(grades){
  const c = {A:0,B:0,C:0};
  grades.forEach(g=>{ if (c[g]!=null) c[g]++; });
  return `<div class="cntline"><span class="cnt A">A ${c.A}</span><span class="cnt B">B ${c.B}</span><span class="cnt C">C ${c.C}</span></div>`;
}

/* --- 単元ごと(テスト・見取りを1回ずつ、観点に分けて表示) --- */
function kaiCell(opp, stuId, subjId, fs){
  const src = opp['種別']==='テスト' ? 'ts' : 'ms';
  const names = showNames(opp);
  // 1行はつねに [観点][(面名)][点][％][評価] の桁で組む。空欄も桁として出す
  const line = (head, faceLabel, pt, pc, gr, extra)=>
    `<div class="kline${extra||''}"><span class="tg">${head}</span>${names?`<span class="fn">${faceLabel}</span>`:''}` +
    `<span class="pt">${pt}</span><span class="pc">${pc}</span><span class="gr">${gr}</span></div>`;
  const lines = fs.map(f=>{
    const r = faceResult(opp, f, stuId);
    const tag = `<span class="src ${src}" title="${KAN_FULL[f.k]}">${KAN_SHORT[f.k]}</span>`;
    const fl = names ? `<span title="${esc(faceName(opp,f))} / ${esc(unitName(faceUnitId(opp,f))||'単元なし')}">${esc(faceName(opp,f))}</span>` : '';
    if (!r)     return line(tag, fl, '<span class="nores">ー</span>', '', '');
    if (r.exc)  return line(tag, fl, '<span class="nores">除外</span>', '', '');
    if (r.abs)  return line(tag, fl, '<span style="color:var(--shu)">欠</span>', '', '');
    return line(tag, fl, `${r.raw}/${r.max}`, `${Math.round(r.pct)}%`, gBadge(gradeOf(r.pct, subjId)));
  }).join('');
  const t = totalOf(opp, stuId, fs);
  const head = '<b style="font-size:11px">計</b>';
  let sum;
  if (!t)          sum = line(head, '', '<span class="nores">ー</span>', '', '', ' ksum');
  else if (t.exc)  sum = line(head, '', '<span class="nores">除外</span>', '', '', ' ksum');
  else if (t.abs)  sum = line(head, '', '<span style="color:var(--shu)">欠席</span>', '', '', ' ksum');
  else sum = line(head, '', `${t.raw}/${t.max}${t.whole?'':'<span class="sub" title="一部の面が未入力">…</span>'}`,
                  `${Math.round(t.pct)}%`, gBadge(gradeOf(t.pct, subjId)), ' ksum');
  return `<td class="kaicell${names?' split':''}">${lines}${fs.length>1?sum:''}</td>`;
}

      }).join('')}</tr>
    ${sts.map(st=>`<tr>
      <td class="sub stickL" style="left:0;width:36px">${esc(st['出席番号'])}</td>
      <td class="stickL stickEdge" style="left:56px"><span class="jump" onclick="go('person','${q(st['児童ID'])}')">${esc(st['名前'])}</span></td>

    <tr class="avgline">

      ${list.map(x=>{

        const ln = (head, pc, extra)=>`<div class="kline${extra||''}"><span class="tg">${head}</span>${names?'<span class="fn"></span>':''}<span class="pt"></span><span class="pc">${pc}</span><span class="gr"></span></div>`;
        const lines = fs.map(f=>{
          const a = faceAvg(x.o, f);
          return ln(`<span class="src ${x.o['種別']==='テスト'?'ts':'ms'}">${KAN_SHORT[f.k]}</span>`, a!=null?Math.round(a*10)/10+'%':'ー');

/* --- 観点別(点数 → ％ → 評価 の順) --- */
function kantenTable(){
  const subs = subjectsWithOpps();
  const sts = allStudents();
  if (!subs.length) return `<div class="panel sub">まだテスト・見取りがありません。</div>`;
  const cols = subs.map(s=>({s, ks: usedKans(s['教科ID'], LV.term)})).filter(c=>c.ks.length);
  if (!cols.length) return `<div class="panel sub">${LV.term}に記録のある教科がありません。</div>`;
  const mode = LV.show;
  const oneLine = (cls2, label, raw, max, pct, g, n, thin)=>{
    if (pct==null) return `<div class="kline"><span class="tg"><span class="src ${cls2}">${label}</span></span><span class="pt nores">ー</span><span class="pc"></span><span class="gr"></span></div>`;
    return `<div class="kline"><span class="tg"><span class="src ${cls2}">${label}</span></span><span class="pt">${raw}/${max}</span><span class="pc">${Math.round(pct)}%</span><span class="gr">${gBadge(g)}${thin?`<span class="thin" title="有効な記録が${n}件">!</span>`:''}</span></div>`;
  };
  const shownGrade = x=>mode==='test' ? x.tG : mode==='mitori' ? x.mG : x.autoG;
  const cellFor = (st, s, k)=>{
    if (!takes(st['児童ID'], s['教科ID'])) return `<td class="kancell nores" title="この教科の対象外です">—</td>`;
    const x = calcStu(st['児童ID'], s['教科ID'], LV.term)[k];
    const oc = `onclick="openDecide('${q(st['児童ID'])}','${q(s['教科ID'])}','${k}')" style="cursor:pointer" title="タップで最終評価を決める"`;
    if (mode==='both'){
      return `<td class="kancell" ${oc}>
        ${oneLine('ts','テ', x.tRaw, x.tMax, x.t, x.tG, x.tN, x.tThin)}
        ${oneLine('ms','見', x.mRaw, x.mMax, x.m, x.mG, x.mN, x.mThin)}</td>`;
    }
    if (mode==='test')   return `<td class="kancell" ${oc}>${oneLine('ts','テ', x.tRaw, x.tMax, x.t, x.tG, x.tN, x.tThin)}</td>`;
    if (mode==='mitori') return `<td class="kancell" ${oc}>${oneLine('ms','見', x.mRaw, x.mMax, x.m, x.mG, x.mN, x.mThin)}</td>`;
    const ov = getOv(st['児童ID'], s['教科ID'], k, LV.term);
    return `<td class="fincell" ${oc}>${finalBadge(x, ov)}<div class="sub" style="font-size:10px">${x.auto!=null?Math.round(x.auto)+'%':''}</div></td>`;
  };
  return `<div class="panel" style="padding:13px"><div class="tblwrap"><table class="gridtbl">
    <tr><th rowspan="2" class="stickL" style="left:0;width:36px">番号</th><th rowspan="2" class="stickL stickEdge" style="left:56px;min-width:118px">名前</th>
      ${cols.map((c,ci)=>`<th colspan="${c.ks.length}" style="text-align:center;border-left:1px solid var(--line);${ci%2?'background:#F4F5F0':''}">${esc(c.s['教科名'])}</th>`).join('')}</tr>
    <tr>${cols.map((c,ci)=>c.ks.map((k,i)=>`<th style="text-align:center;${i===0?'border-left:1px solid var(--line);':''}${ci%2?'background:#F4F5F0':''}">${KAN_SHORT[k]}</th>`).join('')).join('')}</tr>
    ${sts.map(st=>`<tr>
      <td class="sub stickL" style="left:0;width:36px">${esc(st['出席番号'])}</td>
      <td class="stickL stickEdge" style="left:56px"><span class="jump" onclick="go('person','${q(st['児童ID'])}')">${esc(st['名前'])}</span></td>

    <tr class="avgline">
      <td class="stickL" style="left:0"></td><td class="stickL stickEdge" style="left:56px">クラス平均</td>

        const tv=[], mv=[];
        rosterOf(c.s['教科ID']).forEach(st=>{
          const x = calcStu(st['児童ID'], c.s['教科ID'], LV.term)[k];
          if (x.t!=null) tv.push(x.t);
          if (x.m!=null) mv.push(x.m);

        return `<td class="kancell">
          <div class="kline"><span class="tg"><span class="src ts">テ</span></span><span class="pt"></span><span class="pc">${a!=null?Math.round(a*10)/10+'%':'ー'}</span><span class="gr"></span></div>

      }).join('')).join('')}
    </tr>
    <tr class="cntrow">
      <td class="stickL" style="left:0"></td><td class="stickL stickEdge" style="left:56px">評価の人数</td>
      ${cols.map(c=>c.ks.map(k=>{
        const gs = rosterOf(c.s['教科ID']).map(st=>{

function borderHtml(){
  const subs = shownSubjects();
  const nearA = [], nearC = [];
  subs.forEach(s=>rosterOf(s['教科ID']).forEach(st=>{
    const g = calcStu(st['児童ID'], s['教科ID'], LV.term);
    KAN_ORDER.forEach(k=>{
      const x = g[k];
      [['ts', x.t, x.tG], ['ms', x.m, x.mG]].forEach(([trk, p, gr])=>{
        if (p==null) return;
        if (gr==='B' && x.A - p <= 3) nearA.push({st, s, k, trk, p, need:r1(x.A-p)});
        if ((gr==='B' && p - x.B <= 3) || (gr==='C' && x.B - p <= 3)) nearC.push({st, s, k, trk, p, gr});
      });
    });
  }));
  const row = (e, note)=>`<div class="oppline" onclick="openDecide('${q(e.st['児童ID'])}','${q(e.s['教科ID'])}','${e.k}')">
    <span class="src ${e.trk}">${e.trk==='ts'?'テ':'見'}</span>
    <b style="min-width:96px">${esc(e.st['名前'])}</b>
    <span class="tag subjtag">${esc(e.s['教科名'])}</span>
    <span class="sub">${KAN_FULL[e.k]}</span>
    <span class="grow"></span><span class="sub">${e.p}%</span><span class="tag gray">${note}</span></div>`;
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr))">
    <div class="panel"><h3 style="color:var(--gA)">Aまであと僅か(3%以内)</h3>
      <p class="sub" style="margin-bottom:8px">もう1回良い記録があればAに届くかもしれない子</p>
      ${nearA.map(e=>row(e, `あと${e.need}%`)).join('') || '<p class="sub">該当なし</p>'}</div>
    <div class="panel"><h3 style="color:var(--gC)">Cとの境目(±3%)</h3>
      <p class="sub" style="margin-bottom:8px">記録が少ない・支援が必要かもしれない子</p>
      ${nearC.map(e=>row(e, e.gr)).join('') || '<p class="sub">該当なし</p>'}</div>
  </div>`;
}

function exportKai(){
  const list = oppsOfSubject(LV.subj, LV.term, LV.kind);

    [String(r.raw), String(Math.round(r.pct)), gradeOf(r.pct, LV.subj)||''];

    note: `観点ごとに分けて出力 / 欠席・除外は平均に入れていません / ${LV.kind}${list.length}件 / 対象児童${sts.length}人`,

function setFinal(stuId, subjId, kan, grade){
  const term = LV.term;

  const auto = calcStu(stuId, subjId, term)[kan].auto;
  shutModal(); ovl('保存中…');
  call('saveOverride', {stuId, subjId, kan, term, grade, reason, autoValue: auto==null?'':String(auto)})
    .then(()=>{
      const k = ovK(stuId, subjId, kan, term);

      unovl(); render();
      toast(grade ? `${grade} で確定しました` : '自動に戻しました');
    })
    .catch(fail('保存できませんでした'));
}

function copyText(text){
  const done = ()=>{ shutModal(); toast('コピーしました。Ctrl+V で貼り付けられます'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>copyFallback(text, done));
  } else copyFallback(text, done);
}
function copyFallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  if (ok){ done(); return; }
  modal(`<h3 style="margin-bottom:8px">手動でコピーしてください</h3>
    <p class="sub" style="margin-bottom:10px">下の欄をクリック(全選択されます)して Ctrl+C でコピーしてください。</p>

    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" onclick="shutModal()">閉じる</button></div>`, true);
}

function buildPerson(stuId, teacher){
  const subs = subjectsWithOpps().filter(s=>takes(stuId, s['教科ID']));
  const G = {}; subs.forEach(s=>G[s['教科ID']] = calcStu(stuId, s['教科ID'], PV.term));
  const withData = subs.filter(s=>KAN_ORDER.some(k=>G[s['教科ID']][k].t!=null || G[s['教科ID']][k].m!=null));
  const C = personCfg();
  const bl = 'border-left:1px solid var(--line)';
  const cards = withData.map(s=>{
    const g = G[s['教科ID']];
    const testList = oppsOfSubject(s['教科ID'], PV.term, 'テスト');
    const mitList  = oppsOfSubject(s['教科ID'], PV.term, '見取り');
    const showAvg = teacher && !!C.avg;
    const anyDate = !!C.dateCol && testList.some(x=>x.o['日付']);
    // この教科のテストで使われている観点だけ列にする
    const usedK = KAN_ORDER.filter(k=>testList.some(x=>faces(x.o).some(f=>f.k===k)));
    let sumRaw=0, sumMax=0;
    testList.forEach(x=>{ const t = oppTotal(x.o, stuId); if (t && t.pct!=null){ sumRaw+=t.raw; sumMax+=t.max; } });
    sumRaw = r1(sumRaw);
    const testPct = sumMax ? sumRaw/sumMax*100 : null;
    const cell3 = (r, style)=>{
      if (!r) return `<td class="nores" style="${style}">ー</td><td class="nores">ー</td><td class="nores">ー</td>`;
      if (r.exc) return `<td class="nores" style="${style}" colspan="3">除外</td>`;
      if (r.abs) return `<td style="${style};color:var(--shu);font-weight:700" colspan="3">欠席</td>`;
      return `<td style="${style};font-weight:700">${r.raw}<span class="sub">/${r.max}</span></td>
              <td><span class="pchip">${Math.round(r.pct)}%</span></td>
              <td>${gBadge(gradeOf(r.pct, s['教科ID']))}</td>`;
    };
    const testTable = C.tests && testList.length ? `
      <div class="plabel">テストの記録(観点ごと)</div>
      <div style="overflow-x:auto"><table class="psheet">
        <tr>${anyDate?'<th rowspan="2">実施日</th>':''}<th rowspan="2">単元</th><th rowspan="2">テスト名</th>
          ${usedK.map(k=>`<th colspan="3" style="text-align:center;${bl}">${KAN_SHORT[k]}</th>`).join('')}
          <th colspan="3" style="text-align:center;${bl}">合計</th>
          ${showAvg?'<th rowspan="2" class="avg-col" style="text-align:right">クラス平均</th>':''}</tr>
        <tr>${usedK.map(()=>`<th style="${bl}">点</th><th>％</th><th>評価</th>`).join('')}
          <th style="${bl}">点</th><th>％</th><th>評価</th></tr>
        ${testList.map(x=>{
          const fs = faces(x.o), split = isSplit(x.o);
          const cavg = showAvg ? oppAvg(x.o) : null;
          const unitCell = split ? splitUnitNames(x.o).join(' / ') : (x.u ? x.u['単元名'] : 'ー');
          const nameCell = split ? fs.map(f=>faceName(x.o,f)).join(' / ') : x.o['機会名'];
          return `<tr>
            ${anyDate?`<td class="sub">${esc(fmtDate(x.o['日付'])||x.o['学期'])}</td>`:''}
            <td class="sub">${esc(unitCell)}</td>
            <td style="font-weight:600">${esc(nameCell)}${split?' <span class="tag gray">表裏違い</span>':''}</td>
            ${usedK.map(k=>{
              const kf = fs.filter(z=>z.k===k);
              if (!kf.length) return `<td class="nores" style="${bl}">−</td><td class="nores">−</td><td class="nores">−</td>`;
              return cell3(totalOf(x.o, stuId, kf), bl);
            }).join('')}
            ${cell3(oppTotal(x.o, stuId), bl).replace('font-weight:700','font-weight:800')}
            ${showAvg?`<td class="avg-col sub" style="text-align:right">${cavg!=null?Math.round(cavg*10)/10+'%':'ー'}</td>`:''}
          </tr>`;
        }).join('')}
        <tr class="sumrow">${anyDate?'<td></td>':''}<td></td><td>テストの合計</td>
          ${usedK.map(k=>{
            const x = g[k];
            return `<td style="${bl}">${x.t!=null?x.tRaw+'/'+x.tMax:'ー'}</td>
                    <td>${x.t!=null?Math.round(x.t)+'%':''}</td><td>${x.t!=null?gBadge(x.tG):''}</td>`;
          }).join('')}
          <td style="${bl}">${testPct!=null?sumRaw+'/'+sumMax:'ー'}</td>
          <td>${testPct!=null?Math.round(testPct)+'%':''}</td>
          <td>${testPct!=null?gBadge(gradeOf(testPct, s['教科ID'])):''}</td>
          ${showAvg?'<td class="avg-col"></td>':''}</tr>
      </table></div>` : '';

    const mitBlock = !C.mitori || !mitList.length ? '' : `
      <div class="plabel">授業のようす(見取り)</div>
      <div class="row" style="gap:16px">
        ${KAN_ORDER.map(k=>{ const x=g[k]; if (x.m==null) return '';
          return `<span style="font-size:13px"><b>${KAN_SHORT[k]}</b> ${x.mRaw}/${x.mMax} ・ ${x.m}% ・ ${x.mN}回</span>`; }).join('')}
      </div>
      ${teacher && C.mitoriDetail ? `<div class="no-print" style="margin-top:6px;overflow-x:auto"><table class="psheet">
        <tr><th>日付</th><th>見取り名</th><th>観点</th><th style="text-align:right">点</th><th>メモ</th></tr>
        ${mitList.map(x=>faces(x.o).map(f=>{
          const r = recOf(x.o, stuId, f);
          if (!r || (r.raw==='' && !r.state && !r.memo)) return '';
          const v = r.state===ST_ABS ? '<span style="color:var(--shu)">欠</span>'
                  : r.state===ST_EXC ? '<span class="sub">除外</span>'
                  : r.raw==='' ? '' : esc(r.raw)+'/'+faceMax(f,r);
          return `<tr><td class="sub">${esc(fmtDate(x.o['日付'])||x.o['学期'])}</td><td>${esc(faceName(x.o,f))}</td><td>${KAN_SHORT[f.k]}</td><td style="text-align:right;font-weight:700">${v}</td><td class="sub" style="white-space:normal">${esc(r.memo||'')}</td></tr>`;
        }).join('')).join('')}</table></div>` : ''}`;

    const line = (x, which)=>{
      const t = which==='t';
      const pct = t ? x.t : x.m, g2 = t ? x.tG : x.mG, raw = t ? x.tRaw : x.mRaw, max = t ? x.tMax : x.mMax;
      const n = t ? x.tN : x.mN, thin = t ? x.tThin : x.mThin;
      const cls2 = t ? 'ts' : 'ms', lbl = t ? 'テ' : '見';
      if (pct==null) return `<div class="pline"><span class="src ${cls2}">${lbl}</span><span class="sub">記録なし</span></div>`;
      return `<div class="pline"><span class="src ${cls2}">${lbl}</span>
        <b style="min-width:66px">${raw}/${max}</b><b style="min-width:42px">${pct}%</b>${gBadge(g2)}
        <span class="sub" style="font-size:11px">${n}件${thin?' ⚠少ない':''}</span></div>`;
    };
    const kantenBlock = !C.kanten ? '' : `
      <div class="plabel">観点別のまとめ(点数 → ％ → 評価)</div>
      ${KAN_ORDER.map(k=>{
        const x = g[k]; if (x.t==null && x.m==null) return '';
        const ov = getOv(stuId, s['教科ID'], k, PV.term);
        let growth = '';
        const pt = prevTerm(PV.term);
        if (pt && C.growth){
          const pv = calcStu(stuId, s['教科ID'], pt)[k];
          const before = pv.t!=null ? pv.t : pv.m, now = x.t!=null ? x.t : x.m;
          if (before!=null && now!=null){
            const d = Math.round((now-before)*10)/10;
            const col = d>0?'var(--ko)':d<0?'var(--shu)':'var(--sub)';
            growth = `<span class="sub" style="font-size:11px;margin-left:8px">${pt} ${before}% → <span style="color:${col};font-weight:700">${d>0?'+':''}${d}</span></span>`;
          }
        }
        return `<div style="margin-top:9px;padding:8px 10px;background:#F7F8F4;border-radius:8px">
          <div class="row"><b style="width:56px">${KAN_SHORT[k]}</b>
            <span class="sub" style="font-size:11.5px">最終評価</span>${finalBadge(x, ov)}${growth}</div>
          ${line(x,'t')}${line(x,'m')}</div>`;
      }).join('')}`;

    const open = !!PV.open[s['教科ID']];
    return `<div class="panel foldcard ${open?'open':''}" style="margin-top:14px">
      <button class="foldhead" aria-expanded="${open}" onclick="toggleSubjCard('${q(s['教科ID'])}')">
        <span class="arw">▸</span>
        <h3>${esc(s['教科名'])}</h3>
        <span class="sub" style="font-size:12px">テスト ${testPct!=null?sumRaw+'/'+sumMax+' ('+Math.round(testPct)+'%)':'ー'}</span>
        <span class="grow"></span>
        ${C.badges ? KAN_ORDER.map(k=>{ const x=g[k]; if (x.t==null && x.m==null) return '';
          return `<span title="${KAN_FULL[k]}">${finalBadge(x, getOv(stuId, s['教科ID'], k, PV.term))}</span>`; }).join('') : ''}
      </button>
      <div class="foldbody">
        <div class="sub" style="font-size:11px;margin:6px 0 2px">A:${esc(s['A閾値'])}%以上 / B:${esc(s['B閾値'])}%以上</div>
        ${testTable}${mitBlock}${kantenBlock}
      </div></div>`;
  }).join('');
  return { cards, withData };
}
