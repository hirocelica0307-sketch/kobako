<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f07a4a">
<meta name="description" content="新学期の じこしょうかい・学期ごとの めあて・運動会・音楽発表会・1年の ふりかえり など、節目に 子どもが 書いて 色を ぬって 完成させる 白黒の カードを A4 で いんさつ。">
<title>めあてカード こうぼう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root {
  --bg: #fff8f1;
  --ink: #33291f;
  --sub: #6b5d4f;
  --line: #eadfce;
  --accent: #f07a4a;
  --accent-l: #ffeadf;
  --ui-font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --title-font: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui-font); }

.top { background: var(--accent); color: #fff; padding: 10px 18px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.logo { margin: 0; font-family: var(--title-font); font-size: 22px; font-weight: normal; letter-spacing: .04em; }
.lead { margin: 0; font-size: 13px; opacity: .95; }

.layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 52px); }
.side { border-right: 1px solid var(--line); background: #fffdf9; padding: 12px; overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 0; }
.list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.item { display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 2px solid transparent; border-radius: 12px; background: #fff; cursor: pointer; font-family: var(--ui-font); color: var(--ink); text-align: left; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.item:hover { background: var(--accent-l); }
.item.on { border-color: var(--accent); background: var(--accent-l); }
.item .thumb { aspect-ratio: 210 / 297; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.item .thumb svg { width: 100%; height: 100%; display: block; }
.item small { font-size: 10.5px; color: var(--accent); font-weight: 700; }
.item b { font-size: 12.5px; line-height: 1.3; }

.main { padding: 14px 18px 40px; min-width: 0; }
.panel { background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 16px; }
.panel h2 { margin: 0; font-size: 20px; }
.panel .when { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-l); border-radius: 999px; padding: 2px 10px; vertical-align: middle; }
.panel p { margin: 4px 0 0; font-size: 13px; color: var(--sub); line-height: 1.6; }
.opts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; margin: 12px 0 10px; padding: 10px 0; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 700; color: var(--sub); }
.field select, .field input { font: 500 15px var(--ui-font); padding: 6px 8px; border: 2px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); min-width: 90px; }
.field input { width: 90px; }
.check { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; cursor: pointer; padding-bottom: 6px; }
.check input { width: 18px; height: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.btn { font: 700 15px var(--ui-font); border: none; border-radius: 10px; padding: 10px 16px; background: var(--accent-l); color: #8a3510; cursor: pointer; }
.btn:hover { filter: brightness(.96); }
.btn-print { background: var(--accent); color: #fff; font-size: 16px; }
.hint { font-size: 12px !important; }
.kopts { flex-basis: 100%; display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; background: var(--accent-l); border-radius: 12px; }
.krow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; }
.klab { font-size: 12px; font-weight: 700; color: var(--sub); align-self: center; margin-right: 2px; }
.kitems .check { padding: 4px 10px; background: #fff; border-radius: 999px; font-size: 13.5px; }
.chip { font: 700 13px var(--ui-font); border: 2px solid var(--accent); color: #8a3510; background: #fff; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip:hover { background: var(--accent); color: #fff; }
[hidden] { display: none !important; }

.preview-wrap { display: flex; justify-content: center; }
.sheet-view { width: min(100%, 640px); aspect-ratio: 210 / 297; background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.14); }
.sheet-view svg { width: 100%; height: 100%; display: block; }

#print { display: none; }
@page { size: A4 portrait; margin: 0; }
@media print {
  html, body { background: #fff; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; }
  .sheet { width: 210mm; height: 297mm; overflow: hidden; break-after: page; page-break-after: always; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  .sheet svg { width: 210mm; height: 297mm; display: block; }
}
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--line); }
  .list { grid-template-columns: repeat(4, 1fr); }
  .item b { font-size: 11px; }
}
</style>
</head>
<body>

<header class="top">
  <h1 class="logo">✏️ めあてカード こうぼう</h1>
  <p class="lead">節目に 書く カードを えらんで A4 で いんさつ。白黒なので、さいごに 子どもが 色を ぬって 完成させます。</p>
</header>

<div class="layout">
  <aside class="side">
    <div class="list" id="list"></div>
  </aside>

  <main class="main">
    <div class="panel">
      <h2><span id="pTitle"></span><span class="when" id="pWhen"></span></h2>
      <p id="pDesc"></p>
      <form class="opts" id="opts" onsubmit="return false">
        <label class="field">学年（いんさつ）
          <select id="optNen">
            <option value="">書かない（空らん）</option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
          </select>
        </label>
        <label class="field">組（いんさつ）
          <input id="optKumi" maxlength="3" placeholder="空らん">
        </label>
        <label class="field" id="termWrap">学期（しょうじょう）
          <select id="optTerm">
            <option value="">書かない（空らん）</option>
            <option>1</option><option>2</option><option>3</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="optRuby" checked> ふりがな</label>
        <label class="check"><input type="checkbox" id="optWobble" checked> 手がき ふうの 線</label>
        <div class="kopts" id="kakariOpts" hidden>
          <div class="krow">
            <label class="field">デザイン <select id="kTheme"></select></label>
            <label class="field">メンバーの 人数 <select id="kMem"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
            <label class="field" id="kTobanWrap">当番表の かたち <select id="kToban"></select></label>
            <label class="field">係名（いんさつ） <input id="kName" maxlength="10" placeholder="空らん"></label>
          </div>
          <div class="krow kitems" id="kItems"><span class="klab">のせる こうもく</span></div>
          <div class="krow kpresets"><span class="klab">おすすめ</span>
            <button type="button" class="chip" data-preset="full">当番表あり</button>
            <button type="button" class="chip" data-preset="notoban">当番表なし（マークつき）</button>
            <button type="button" class="chip" data-preset="simple">シンプル（3こうもく）</button>
            <button type="button" class="chip" data-preset="all">ぜんぶ</button>
          </div>
        </div>
        <div class="kopts" id="ichiranOpts" hidden>
          <div class="krow">
            <label class="field">係の 数（行） <select id="iRows"><option>6</option><option>8</option><option>10</option><option>12</option><option>14</option></select></label>
            <label class="field">メンバーの らん <select id="iCols"><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
          </div>
        </div>
      </form>
      <div class="actions">
        <label class="field">まいすう
          <select id="copies">
            <option value="1">1まい</option><option value="2">2まい</option><option value="5">5まい</option>
            <option value="10">10まい</option><option value="20">20まい</option><option value="30">30まい</option><option value="35">35まい</option><option value="40">40まい</option>
          </select>
        </label>
        <button type="button" class="btn btn-print" id="btnPrint">🖨️ この カードを いんさつ</button>
        <button type="button" class="btn" id="btnAll">🖨️ ぜんぶ 1まいずつ</button>
      </div>
      <p class="hint">いんさつ がめんで <b>よはく「なし」・倍率 100%</b> に すると ぴったり A4 に なります（PDF に ほぞん しても おなじ）。「学年」を えらぶと、アルバムの「〇年生に なったら」も その 学年に なります。</p>
    </div>

    <div class="preview-wrap">
      <div class="sheet-view" id="view"></div>
    </div>
  </main>
</div>

<div id="print"></div>

<script>
'use strict';
/* =========================================================
   めあてカード こうぼう
   1まい ＝ A4（210×297mm）。SVG の 1 単位 ＝ 1mm。
   線は くろ・ぬりは しろ だけ（子どもが 色を ぬる）。
   ========================================================= */

const F_T = "'Mochiy Pop One','Zen Maru Gothic',sans-serif";    // タイトル
const F_L = "'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif"; // ラベル
const F_H = "'Klee One','Zen Maru Gothic',sans-serif";          // 手書きふう（学年・組）
const SW = 0.7;

const S = {
  nen: '', kumi: '', term: '', ruby: true, wobble: true, cur: 'jiko',
  kk: { theme: 'shop', items: { member: 1, meate: 1, work: 1, toban: 1, mark: 0, minna: 1, furi: 0 }, mem: 4, toban: 'youbi', name: '' },
  ichiran: { rows: 10, cols: 4 },
};

/* ---------- きほんの 部品 ---------- */
const n = v => +(+v).toFixed(2);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function T(x, y, s, o = {}) {
  const sz = o.size || 4;
  let a = `x="${n(x)}" y="${n(y)}" font-size="${sz}" font-family="${o.font || F_L}" font-weight="${o.weight || 700}"`;
  if (o.anchor && o.anchor !== 'start') a += ` text-anchor="${o.anchor}"`;
  if (o.hollow) a += ` fill="#fff" stroke="#000" stroke-width="${n(sz * 0.05)}" stroke-linejoin="round"`;
  if (o.rot) a += ` transform="rotate(${o.rot} ${n(x)} ${n(y)})"`;
  if (o.ls) a += ` letter-spacing="${o.ls}"`;
  return `<text ${a}>${esc(String(s).replace(/ /g, '\u00a0'))}</text>`;
}
// 文字の はば。ブラウザで じっさいに はかる（はかれない ときは 全角＝1em で みつもる）
const MC = new Map();
let CV = null;
try { CV = document.createElement('canvas').getContext('2d'); } catch (e) { CV = null; }
function cw(ch, sz) {
  if (ch === ' ') return sz * 0.3;
  if (/[\x21-\x7e]/.test(ch)) return sz * 0.62;
  return sz;
}
function tw(str, sz, font = F_L, weight = 700) {
  str = String(str).replace(/ /g, '\u00a0');
  if (!CV) return [...str].reduce((a, c) => a + cw(c === '\u00a0' ? ' ' : c, sz), 0);
  const key = weight + '|' + font + '|' + str;
  if (!MC.has(key)) { CV.font = `${weight} 100px ${font}`; MC.set(key, CV.measureText(str).width / 100); }
  return MC.get(key) * sz;
}
const plain = src => src.replace(/\{([^|}]+)\|[^}]+\}/g, '$1');
const rtw = (src, sz, font = F_L, weight = 700) => tw(plain(src), sz, font, weight);
// ふりがな つき 文字。 '{学期|がっき}の めあて'
function R(x, y, src, o = {}) {
  const sz = o.size || 4;
  const segs = [];
  src.replace(/\{([^|}]+)\|([^}]+)\}|([^{]+)/g, (m, b, k, p) => { segs.push(b ? { t: b, k } : { t: p }); return m; });
  const font = o.font || F_L, wt = o.weight || 700;
  const total = segs.reduce((a, s) => a + tw(s.t, sz, font, wt), 0);
  let cx = o.anchor === 'middle' ? x - total / 2 : o.anchor === 'end' ? x - total : x;
  let out = '';
  for (const s of segs) {
    const w = tw(s.t, sz, font, wt);
    out += T(cx, y, s.t, { ...o, anchor: 'start' });
    if (s.k && S.ruby) {
      const ks = o.rsize || Math.max(1.6, sz * 0.4);
      out += T(cx + w / 2, y - sz * (o.hollow ? 0.98 : 0.9), s.k, { size: ks, anchor: 'middle', font: F_L, weight: 700 });
    }
    cx += w;
  }
  return out;
}

function attrs(o, defFill = '#fff') {
  let a = ` fill="${o.fill || defFill}" stroke="${o.stroke || '#000'}" stroke-width="${o.w ?? SW}" stroke-linejoin="round" stroke-linecap="round"`;
  if (o.dash) a += ` stroke-dasharray="${o.dash}"`;
  if (o.tf) a += ` transform="${o.tf}"`;
  return a;
}
const P = (d, o = {}) => `<path d="${d}"${attrs(o)}/>`;
const C = (cx, cy, r, o = {}) => `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r)}"${attrs(o)}/>`;
const E = (cx, cy, rx, ry, o = {}) => `<ellipse cx="${n(cx)}" cy="${n(cy)}" rx="${n(rx)}" ry="${n(ry)}"${attrs(o)}/>`;
const RR = (x, y, w, h, r, o = {}) => `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="${n(r)}"${attrs(o)}/>`;
const L = (x1, y1, x2, y2, w = SW, extra = '') => `<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="#000" stroke-width="${w}" stroke-linecap="round"${extra ? ' ' + extra : ''}/>`;
const POLY = (pts, o = {}) => `<polygon points="${pts.map(p => n(p[0]) + ',' + n(p[1])).join(' ')}"${attrs(o)}/>`;
// 書く 線（点線）
const dotL = (x1, x2, y) => L(x1, y, x2, y, 0.5, 'stroke-dasharray="0.01 1.5"');
const wlines = (x1, x2, y0, count, gap) => { let s = ''; for (let i = 0; i < count; i++) s += dotL(x1, x2, y0 + i * gap); return s; };

/* ---------- かざり ---------- */
function starPts(cx, cy, r, ri = r * 0.45, k = 5, rot = -90) {
  const pts = [];
  for (let i = 0; i < k * 2; i++) {
    const rr = i % 2 ? ri : r, a = (rot + i * 180 / k) * Math.PI / 180;
    pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
  }
  return pts;
}
const star = (cx, cy, r, o = {}) => POLY(starPts(cx, cy, r, o.ri || r * 0.45), o);
const sparkle = (cx, cy, r, o = {}) =>
  P(`M${n(cx)},${n(cy - r)} Q${n(cx)},${n(cy)} ${n(cx + r)},${n(cy)} Q${n(cx)},${n(cy)} ${n(cx)},${n(cy + r)} Q${n(cx)},${n(cy)} ${n(cx - r)},${n(cy)} Q${n(cx)},${n(cy)} ${n(cx)},${n(cy - r)} Z`, { w: 0.5, ...o });
const heart = (cx, cy, s, o = {}) =>
  P(`M${n(cx)},${n(cy + s * 0.9)} C${n(cx - s * 1.4)},${n(cy)} ${n(cx - s * 0.9)},${n(cy - s * 1.1)} ${n(cx)},${n(cy - s * 0.35)} C${n(cx + s * 0.9)},${n(cy - s * 1.1)} ${n(cx + s * 1.4)},${n(cy)} ${n(cx)},${n(cy + s * 0.9)} Z`, { w: 0.5, ...o });
function note(x, y, s = 1, double = false) {
  // 8分音符（たま は くろ）
  let d = E(x, y, 1.7 * s, 1.15 * s, { fill: '#000', w: 0.3, tf: `rotate(-22 ${n(x)} ${n(y)})` });
  const sx = x + 1.5 * s;
  d += L(sx, y, sx, y - 8 * s, 0.5);
  if (double) {
    const x2 = sx + 5 * s;
    d += E(x2 - 1.5 * s, y - 1 * s, 1.7 * s, 1.15 * s, { fill: '#000', w: 0.3, tf: `rotate(-22 ${n(x2 - 1.5 * s)} ${n(y - s)})` });
    d += L(x2, y - s, x2, y - 9 * s, 0.5);
    d += P(`M${n(sx)},${n(y - 8 * s)} L${n(x2)},${n(y - 9 * s)} L${n(x2)},${n(y - 7.6 * s)} L${n(sx)},${n(y - 6.6 * s)} Z`, { fill: '#000', w: 0.3 });
  } else {
    d += P(`M${n(sx)},${n(y - 8 * s)} q${n(3 * s)},${n(2 * s)} ${n(2.6 * s)},${n(5 * s)}`, { fill: 'none', w: 0.5 });
  }
  return d;
}
function snow(cx, cy, r) {
  let d = '';
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3, ex = cx + r * Math.cos(a), ey = cy + r * Math.sin(a);
    d += L(cx, cy, ex, ey, 0.5);
    const mx = cx + r * 0.55 * Math.cos(a), my = cy + r * 0.55 * Math.sin(a);
    for (const sgn of [-1, 1]) {
      const b = a + sgn * 0.7;
      d += L(mx, my, mx + r * 0.32 * Math.cos(b), my + r * 0.32 * Math.sin(b), 0.45);
    }
  }
  return d;
}
function ume(cx, cy, r) {
  let d = '';
  for (let i = 0; i < 5; i++) {
    const a = (-90 + i * 72) * Math.PI / 180;
    d += C(cx + r * 0.62 * Math.cos(a), cy + r * 0.62 * Math.sin(a), r * 0.5, { w: 0.5 });
  }
  d += C(cx, cy, r * 0.3, { w: 0.5 });
  for (let i = 0; i < 5; i++) {
    const a = (-54 + i * 72) * Math.PI / 180;
    d += L(cx, cy, cx + r * 0.55 * Math.cos(a), cy + r * 0.55 * Math.sin(a), 0.35);
  }
  return d;
}
// さくらの はなびら（ねもと が 0,0、さきが うえ。ながさ およそ 90）
const PETAL = 'M0,-14 C-14,-22 -34,-48 -26,-72 C-22,-84 -10,-90 -4,-86 L0,-79 L4,-86 C10,-90 22,-84 26,-72 C34,-48 14,-22 0,-14 Z';
const petal = (x, y, s, rot) => P(PETAL, { w: 0.5 / s, tf: `translate(${n(x)} ${n(y)}) rotate(${rot}) scale(${s}) translate(0 50)` });
function sakura(cx, cy, r) {
  let d = '';
  for (let i = 0; i < 5; i++) d += P(PETAL, { w: 0.5 / (r / 88), tf: `translate(${n(cx)} ${n(cy)}) rotate(${i * 72}) scale(${n(r / 88, 3)})` });
  d += C(cx, cy, r * 0.17, { w: 0.45 });
  return d;
}
function wave(x, y, w = 4) {
  return P(`M${n(x)},${n(y)} q${n(w / 2)},${n(-w / 2)} ${n(w)},0 q${n(w / 2)},${n(-w / 2)} ${n(w)},0`, { fill: 'none', w: 0.5 });
}
function spiral(x, y, r) {
  return P(`M${n(x - r)},${n(y)} a${n(r)},${n(r)} 0 1 1 ${n(2 * r)},0 a${n(r * 0.72)},${n(r * 0.72)} 0 1 1 ${n(-r * 1.44)},0 a${n(r * 0.42)},${n(r * 0.42)} 0 1 1 ${n(r * 0.84)},0`, { fill: 'none', w: 0.55 });
}
function confetti(list) {
  let d = '';
  list.forEach(([x, y, k, rot], i) => {
    const tf = `rotate(${rot || (i * 37) % 90} ${n(x)} ${n(y)})`;
    if (k === 0) d += RR(x - 1.4, y - 0.8, 2.8, 1.6, 0.3, { w: 0.4, tf });
    else if (k === 1) d += C(x, y, 1, { w: 0.4 });
    else if (k === 2) d += POLY([[x, y - 1.4], [x + 1.3, y + 0.9], [x - 1.3, y + 0.9]], { w: 0.4, tf });
    else d += P(`M${n(x - 1.6)},${n(y)} q0.8,-1.2 1.6,0 q0.8,1.2 1.6,0`, { fill: 'none', w: 0.45, tf });
  });
  return d;
}
const screw = (x, y) => C(x, y, 2.2, { w: 0.6 }) + L(x - 1.3, y - 1.3, x + 1.3, y + 1.3, 0.5);
// かおを かく まる（てんせん）
const faceCircle = (cx, cy, r) => C(cx, cy, r, { fill: 'none', w: 0.65, dash: '1.8 1.4' });

function cat(cx, cy) {
  let d = '';
  d += E(cx, cy + 10, 7.5, 6.5, { w: 0.7 });                        // からだ
  d += E(cx + 9.5, cy - 2, 2.6, 3.2, { w: 0.6, tf: `rotate(25 ${cx + 9.5} ${cy - 2})` }); // ふる て
  d += P(`M${cx + 6},${cy + 6} Q${cx + 9},${cy + 2} ${cx + 9},${cy + 1}`, { fill: 'none', w: 0.6 });

function camera(x, y) {

function laurel(cx, cy, r, a0, a1, cnt) {
  let d = '';
  const rad = a => a * Math.PI / 180;
  const p = a => [cx + r * Math.cos(rad(a)), cy + r * Math.sin(rad(a))];
  const [sx, sy] = p(a0), [ex, ey] = p(a1);
  const large = Math.abs(a1 - a0) > 180 ? 1 : 0, sweep = a1 > a0 ? 1 : 0;
  d += P(`M${n(sx)},${n(sy)} A${r},${r} 0 ${large} ${sweep} ${n(ex)},${n(ey)}`, { fill: 'none', w: 0.6 });
  for (let i = 1; i <= cnt; i++) {
    const a = a0 + (a1 - a0) * i / (cnt + 0.4);
    const [x, y] = p(a);
    const tang = a + (a1 > a0 ? 90 : -90);
    for (const side of [-1, 1]) {
      const off = side * 2.6, lx = x + off * Math.cos(rad(a)), ly = y + off * Math.sin(rad(a));
      d += E(lx, ly, 3.2, 1.35, { w: 0.5, tf: `rotate(${n(tang - side * 28)} ${n(lx)} ${n(ly)})` });
    }
  }
  return d;
}

/* 年・組・番・なまえ の 行 */
function nameRow(x, y, w, sz = 3.8) {
  let s = '', cx = x;
  const f = (lab, val, ww) => {
    s += L(cx, y + 1.2, cx + ww, y + 1.2, 0.4);
    if (val) s += T(cx + ww / 2, y - 0.2, val, { size: sz * 1.35, anchor: 'middle', font: F_H, weight: 600 });
    cx += ww + 0.8;
    s += R(cx, y, lab, { size: sz });
    cx += rtw(lab, sz) + 3;
  };
  f('{年|ねん}', S.nen, 9);
  f('{組|くみ}', S.kumi, 9);
  f('{番|ばん}', '', 9);
  s += T(cx, y, 'なまえ', { size: sz });
  cx += tw('なまえ', sz) + 1.5;
  s += L(cx, y + 1.2, x + w, y + 1.2, 0.4);
  return s;
}

let UID = 0;

/* --- テーマごとの はこ（ラベルの つけかた） --- */
const K_BOX = {
  shop(x, y, w, h, lab) {
    const lw = rtw(lab, 4, F_T) + 10;
    return { d: RR(x, y, w, h, 3, { w: 0.9 }) + RR(x + 4, y - 4.5, lw, 9, 3, { w: 0.8 }),
      t: R(x + 9, y + 1.9, lab, { size: 4, font: F_T, rsize: 1.6 }), top: y + 8 };
  },
  company(x, y, w, h, lab) {
    return { d: RR(x, y, w, h, 1.5, { w: 0.9 }) + RR(x, y, w, 9.5, 1.5, { w: 0.9 }) + RR(x + 3, y + 2.8, 4, 4, 0.5, { w: 0.5, fill: 'HATCH' }),
      t: R(x + 10, y + 7, lab, { size: 4, font: F_T, rsize: 1.5 }), top: y + 11 };
  },
  train(x, y, w, h, lab) {
    const lw = rtw(lab, 4, F_T) + 12;
    let d = RR(x, y, w, h, 4, { w: 0.9 });
    d += P(`M${x + 3},${y + 3} H${x + 3 + lw} L${x + 8 + lw},${y + 7.5} L${x + 3 + lw},${y + 12} H${x + 3} Z`, { w: 0.75 });
    return { d, t: R(x + 8, y + 9.4, lab, { size: 4, font: F_T, rsize: 1.5 }), top: y + 14 };
  },
  space(x, y, w, h, lab) {
    return { d: RR(x, y, w, h, 5, { w: 0.9 }) + star(x + 7.5, y + 7, 3.8, { w: 0.6 }),
      t: R(x + 13.5, y + 9, lab, { size: 4, font: F_T, rsize: 1.6 }), top: y + 13 };
  },
  board(x, y, w, h, lab) {
    const lw = rtw(lab, 4, F_T);
    let d = RR(x, y, w, h, 1, { w: 0.9 });
    d += RR(x - 3, y - 3, 14, 6, 0.5, { w: 0.4, fill: 'DOTS', tf: `rotate(-28 ${x + 4} ${y})` });
    d += RR(x + w - 11, y - 3, 14, 6, 0.5, { w: 0.4, fill: 'DOTS', tf: `rotate(28 ${x + w - 4} ${y})` });
    d += L(x + 6, y + 11, x + 8 + lw, y + 11, 0.8);
    return { d, t: R(x + 7, y + 9.4, lab, { size: 4, font: F_T, rsize: 1.6 }), top: y + 15 };
  },
};

/* --- こうもくの なかみ（ラベルの 下の 場所に かく） --- */
function kLines(x1, x2, y0, y1, gap = 9.5) {
  let s = '';
  for (let y = y0 + 7.5; y <= y1 - 3; y += gap) s += dotL(x1, x2, y);
  return s;
}
const K_FILL = {
  member(x, y, w, b) {
    const k = S.kk.mem, cols = k <= 4 ? k : 3, cw2 = (w - 8) / cols;
    let d = '', t = '';
    for (let i = 0; i < k; i++) {
      const cx = x + 4 + (i % cols) * cw2, cy = y + 7 + Math.floor(i / cols) * 13;
      d += faceCircle(cx + 5.5, cy, 4.6);
      t += dotL(cx + 12, cx + cw2 - 3, cy + 3);
    }
    return { d, t };
  },
  meate(x, y, w, b) { return { d: '', t: kLines(x + 5, x + w - 5, y, b) }; },
  minna(x, y, w, b) { return { d: '', t: kLines(x + 5, x + w - 5, y, b) }; },
  work(x, y, w, b) {
    let d = '', t = '', i = 0;
    for (let yy = y + 7.5; yy <= b - 3; yy += 9.5) {
      d += C(x + 7, yy - 1.6, 2.4, { w: 0.5 });
      t += T(x + 7, yy - 0.5, String(++i), { size: 2.8, anchor: 'middle', font: F_T });
      t += dotL(x + 11.5, x + w - 5, yy);
    }
    return { d, t };
  },
  mark(x, y, w, b) {
    const r = Math.min(w - 12, b - y - 10) / 2;
    return { d: C(x + w / 2, y + (b - y - 5) / 2, r, { fill: 'none', w: 0.6, dash: '1.8 1.4' }),
      t: T(x + w / 2, b - 2.5, 'マークを かこう', { size: 2.6, anchor: 'middle' }) };
  },
  furi(x, y, w, b) {
    let d = '', t = '';
    t += T(x + 5, y + 6, 'できた ど', { size: 3.4 });
    for (let i = 0; i < 5; i++) d += star(x + 28 + i * 9, y + 4.6, 3.8, { w: 0.55 });
    t += kLines(x + 5, x + w - 5, y + 4, b);
    return { d, t };
  },
  toban(x, y, w, b) {
    let d = '', t = '';
    const x1 = x + 4, x2 = x + w - 4, y1 = y + 2, y2 = b - 3;
    const days = ['{月|げつ}', '{火|か}', '{水|すい}', '{木|もく}', '{金|きん}'];
    if (S.kk.toban === 'check') {
      const lc = 14, cw3 = (x2 - x1 - lc) / 5, rh = (y2 - y1) / 5;
      d += RR(x1, y1, x2 - x1, y2 - y1, 1, { w: 0.7 });
      for (let i = 1; i < 5; i++) d += L(x1, y1 + i * rh, x2, y1 + i * rh, i === 1 ? 0.6 : 0.4);
      d += L(x1 + lc, y1, x1 + lc, y2, 0.6);
      for (let j = 1; j < 5; j++) d += L(x1 + lc + j * cw3, y1, x1 + lc + j * cw3, y2, 0.4);
      days.forEach((dd, j) => { t += R(x1 + lc + (j + 0.5) * cw3, y1 + rh / 2 + 1.4, dd, { size: 3.4, anchor: 'middle', rsize: 1.4 }); });
      for (let i = 1; i < 5; i++) t += T(x1 + lc / 2, y1 + (i + 0.5) * rh + 1.2, `${i}しゅう`, { size: 2.7, anchor: 'middle' });
      t += T(x2, b + 0.2, 'できたら ○を かこう', { size: 2.4, anchor: 'end' });
      return { d, t };
    }
    const rows = S.kk.toban === 'week' ? ['1しゅうめ', '2しゅうめ', '3しゅうめ', '4しゅうめ'] : days;
    const lc = S.kk.toban === 'week' ? 17 : 10;
    const rh = (y2 - y1) / (rows.length + 1);
    d += RR(x1, y1, x2 - x1, y2 - y1, 1, { w: 0.7 });
    for (let i = 1; i <= rows.length; i++) d += L(x1, y1 + i * rh, x2, y1 + i * rh, i === 1 ? 0.6 : 0.4);
    d += L(x1 + lc, y1, x1 + lc, y2, 0.6);
    t += T(x1 + lc + (x2 - x1 - lc) / 2, y1 + rh / 2 + 1.3, 'なまえ', { size: 3.2, anchor: 'middle' });
    rows.forEach((r, i) => {
      const yy = y1 + (i + 1.5) * rh + 1.3;
      t += r.includes('{') ? R(x1 + lc / 2, yy, r, { size: 3.4, anchor: 'middle', rsize: 1.4 }) : T(x1 + lc / 2, yy, r, { size: 2.8, anchor: 'middle' });
    });
    return { d, t };
  },
};

function kMin(k) {
  if (k === 'member') { const rows = Math.ceil(S.kk.mem / (S.kk.mem <= 4 ? S.kk.mem : 3)); return 15 + rows * 13; }
  return { meate: 26, work: 34, toban: S.kk.toban === 'check' ? 46 : 52, mark: 44, minna: 26, furi: 38 }[k];
}
const K_WEIGHT = { member: 0, meate: 1, work: 2, toban: 1.2, mark: 1, minna: 1, furi: 0.7 };

function cardKakari() {
  let d = '', t = '';
  const th = S.kk.theme in K_HEAD ? S.kk.theme : 'shop';
  d += RR(8, 8, 194, 281, 5, { w: 1 });
  const head = K_HEAD[th]();
  d += head.d; t += head.t;
  const on = k => !!S.kk.items[k];
  // ならべかた
  const rows = [];
  if (on('member')) rows.push(['member']);
  if (on('meate')) rows.push(['meate']);
  if (on('work') && on('toban')) rows.push(['work', 'toban']); else if (on('work')) rows.push(['work']); else if (on('toban')) rows.push(['toban']);
  if (on('mark') && on('minna')) rows.push(['mark', 'minna']); else if (on('mark')) rows.push(['mark']); else if (on('minna')) rows.push(['minna']);
  if (on('furi')) rows.push(['furi']);
  if (!rows.length) {
    t += T(105, 160, 'のせたい こうもくに チェックを いれてね', { size: 5, anchor: 'middle' });
    return wrap(d, t);
  }
  const X0 = 16, W = 178, BOTTOM = 284, GAP = 8;
  const top = head.top;
  const mins = rows.map(r => Math.max(...r.map(kMin)));
  const wts = rows.map(r => Math.max(...r.map(k => K_WEIGHT[k])));
  const avail = BOTTOM - top - GAP * (rows.length - 1);
  const extra = Math.max(0, avail - mins.reduce((a, b) => a + b, 0));
  const wsum = wts.reduce((a, b) => a + b, 0) || 1;
  let y = top;
  rows.forEach((r, i) => {
    const h = mins[i] + extra * wts[i] / wsum;
    const ratio = r[0] === 'mark' ? 0.36 : 0.56;
    const parts = r.length === 1 ? [[X0, W]] : [[X0, W * ratio - 3], [X0 + W * ratio + 3, W * (1 - ratio) - 3]];
    r.forEach((k, j) => {
      const [bx, bw] = parts[j];
      const item = K_ITEMS.find(it => it.k === k);
      const box = K_BOX[th](bx, y, bw, h, item.lab);
      d += box.d; t += box.t;
      const f = K_FILL[k](bx, box.top, bw, y + h);
      d += f.d; t += f.t;
    });
    y += h + GAP;
  });
  return wrap(d, t);
}

/* =========================================================
   10. みんなの かかり（クラスの 係 いちらん表）
   ========================================================= */
function cardIchiran() {
  let d = '', t = '';
  d += RR(8, 8, 194, 281, 5, { w: 1 });
  // はた
  d += L(12, 13, 198, 13, 0.6);
  for (let i = 0; i < 16; i++) {
    const x = 15 + i * 11.6;
    d += POLY([[x, 13], [x + 9, 13], [x + 4.5, 21]], { w: 0.55 });
  }
  // えんぴつ と けしゴム
  d += P('M18,40 L44,34 L46,40 L20,46 Z', { w: 0.7 }) + P('M44,34 L52,35.5 L46,40 Z', { w: 0.6 }) + P('M50.2,35.2 L52,35.5 L50.6,36.8 Z', { fill: '#000', w: 0.3 });
  d += RR(160, 32, 16, 9, 1.5, { w: 0.7, tf: 'rotate(-12 168 36)' }) + L(166, 31.6, 167.8, 40.4, 0.5, 'transform="rotate(-12 168 36)"');
  d += star(186, 30, 2.6, { w: 0.5 }) + sparkle(192, 42, 2) + sparkle(58, 28, 2);
  t += T(105, 40, 'みんなの かかり', { size: 13, font: F_T, hollow: true, anchor: 'middle' });
  // 年 組
  let cx = 74;
  for (const [lab, val] of [['{年|ねん}', S.nen], ['{組|くみ}', S.kumi]]) {
    t += L(cx, 53.2, cx + 14, 53.2, 0.4);
    if (val) t += T(cx + 7, 51.8, val, { size: 5, anchor: 'middle', font: F_H, weight: 600 });
    t += R(cx + 15, 52, lab, { size: 4 });
    cx += 34;
  }
  // ひょう
  const x1 = 14, x2 = 196, y1 = 58, y2 = 284, hh = 9;
  const nRow = S.ichiran.rows, nCol = S.ichiran.cols, lc = 52;
  const rh = (y2 - y1 - hh) / nRow, cw4 = (x2 - x1 - lc) / nCol;
  d += RR(x1, y1, x2 - x1, y2 - y1, 1.5, { w: 0.9 });
  d += L(x1, y1 + hh, x2, y1 + hh, 0.7);
  d += L(x1 + lc, y1, x1 + lc, y2, 0.7);
  for (let j = 1; j < nCol; j++) d += L(x1 + lc + j * cw4, y1 + hh, x1 + lc + j * cw4, y2, 0.35, 'stroke-dasharray="1 1"');
  t += R(x1 + lc / 2, y1 + 6.4, '{係|かかり}の なまえ', { size: 3.6, anchor: 'middle', font: F_T, rsize: 1.5 });
  t += T(x1 + lc + (x2 - x1 - lc) / 2, y1 + 6.4, 'メンバー', { size: 3.6, anchor: 'middle', font: F_T });
  for (let i = 0; i < nRow; i++) {
    const ry = y1 + hh + i * rh;
    if (i) d += L(x1, ry, x2, ry, 0.5);
    const mr = Math.min(5, rh / 2 - 2);
    d += C(x1 + 4 + mr, ry + rh / 2, mr, { fill: 'none', w: 0.45, dash: '1 1' });
    t += R(x1 + lc - 2, ry + rh - 2, '（　　{人|にん}）', { size: 2.6, anchor: 'end', rsize: 1.2 });
  }
  return wrap(d, t);
}

const $ = id => document.getElementById(id);

function saveOpts() {
  try { localStorage.setItem('mokuhyou-card', JSON.stringify({ nen: S.nen, kumi: S.kumi, term: S.term, ruby: S.ruby, wobble: S.wobble, cur: S.cur, kk: S.kk, ichiran: S.ichiran })); } catch (e) { /* なくても うごく */ }
}
function loadOpts() {
  try {
    const o = JSON.parse(localStorage.getItem('mokuhyou-card') || '{}');
    const kk = o.kk || {}, ic = o.ichiran || {};
    delete o.kk; delete o.ichiran;
    Object.assign(S, o);
    Object.assign(S.kk, kk, { items: { ...S.kk.items, ...(kk.items || {}) } });
    Object.assign(S.ichiran, ic);
  } catch (e) { /* なくても うごく */ }
  const h = location.hash.slice(1);
  if (h && CARDS.some(c => c.id === h)) S.cur = h;
}

function renderList() {
  $('list').innerHTML = CARDS.map(c =>
    `<button type="button" class="item${c.id === S.cur ? ' on' : ''}" data-id="${c.id}">
      <div class="thumb">${c.draw()}</div>
      <small>${esc(c.when)}</small><b>${esc(c.title)}</b>
    </button>`).join('');
}
function renderMain() {
  const c = byId(S.cur);
  $('pTitle').textContent = c.title;
  $('pWhen').textContent = c.when;
  $('pDesc').textContent = c.desc;
  $('termWrap').hidden = c.id !== 'shoujou';
  $('kakariOpts').hidden = c.id !== 'kakari';
  $('ichiranOpts').hidden = c.id !== 'ichiran';
  $('kTobanWrap').hidden = !S.kk.items.toban;
  $('view').innerHTML = c.draw();
}
function renderAll() { renderList(); renderMain(); }

function doPrint(ids) {
  $('print').innerHTML = ids.map(id => `<div class="sheet">${byId(id).draw()}</div>`).join('');
  const go = () => window.print();
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(go, 60));
}
window.addEventListener('afterprint', () => { $('print').innerHTML = ''; });

function init() {
  loadOpts();
  $('optNen').value = S.nen; $('optKumi').value = S.kumi; $('optTerm').value = S.term;
  $('optRuby').checked = S.ruby; $('optWobble').checked = S.wobble;
  $('kTheme').innerHTML = K_THEMES.map(o => `<option value="${o.k}">${esc(o.lab)}</option>`).join('');
  $('kToban').innerHTML = K_TOBAN.map(o => `<option value="${o.k}">${esc(o.lab)}</option>`).join('');
  $('kItems').insertAdjacentHTML('beforeend', K_ITEMS.map(it =>
    `<label class="check"><input type="checkbox" data-item="${it.k}"> ${esc(it.ui)}</label>`).join(''));
  const syncK = () => {
    $('kTheme').value = S.kk.theme; $('kMem').value = String(S.kk.mem); $('kToban').value = S.kk.toban; $('kName').value = S.kk.name;
    document.querySelectorAll('[data-item]').forEach(cb => { cb.checked = !!S.kk.items[cb.dataset.item]; });
    $('iRows').value = String(S.ichiran.rows); $('iCols').value = String(S.ichiran.cols);
  };
  syncK();
  document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    S.kk.items = { ...K_PRESETS[b.dataset.preset] };
    syncK(); saveOpts(); renderAll();
  }));

  $('list').addEventListener('click', e => {
    const b = e.target.closest('.item');
    if (!b) return;
    S.cur = b.dataset.id;
    history.replaceState(null, '', '#' + S.cur);
    document.querySelectorAll('.item').forEach(x => x.classList.toggle('on', x === b));
    renderMain(); saveOpts();
    if (window.innerWidth <= 760) $('view').scrollIntoView({ behavior: 'smooth' });
  });
  const onOpt = () => {
    S.nen = $('optNen').value; S.kumi = $('optKumi').value.trim(); S.term = $('optTerm').value;
    S.ruby = $('optRuby').checked; S.wobble = $('optWobble').checked;
    S.kk.theme = $('kTheme').value; S.kk.mem = +$('kMem').value; S.kk.toban = $('kToban').value; S.kk.name = $('kName').value.trim();
    document.querySelectorAll('[data-item]').forEach(cb => { S.kk.items[cb.dataset.item] = cb.checked ? 1 : 0; });
    S.ichiran.rows = +$('iRows').value; S.ichiran.cols = +$('iCols').value;
    saveOpts(); renderAll();
  };
  $('opts').addEventListener('change', onOpt);
  $('optKumi').addEventListener('input', onOpt);
  $('kName').addEventListener('input', onOpt);
  $('btnPrint').addEventListener('click', () => {
    const k = +$('copies').value || 1;
    doPrint(Array.from({ length: k }, () => S.cur));
  });
  $('btnAll').addEventListener('click', () => doPrint(CARDS.map(c => c.id)));

  renderAll();
  if (document.fonts && document.fonts.load) {
    const fams = ['700 10px "Zen Maru Gothic"', '10px "Mochiy Pop One"', '600 10px "Klee One"'];
    Promise.all(fams.map(f => document.fonts.load(f, 'あ亜A').catch(() => null)))
      .then(() => document.fonts.ready)
      .then(() => { MC.clear(); renderAll(); });
  }
}
init();
</script>
</body>
</html>
