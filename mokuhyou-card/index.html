<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f07a4a">
<meta name="description" content="新学期の じこしょうかい・学期ごとの めあて・運動会・音楽発表会・1年の ふりかえり・しょうじょう・係カード など、節目に 子どもが 書いて 色を ぬって 完成させる 白黒の カード（低学年・高学年 各5しゅるい）を A4 で いんさつ。">
<title>めあてカード こうぼう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root {
  --bg: #fff8f1; --ink: #33291f; --sub: #6b5d4f; --line: #eadfce;
  --accent: #f07a4a; --accent-l: #ffeadf; --low: #2f9e6a; --high: #4b63c9;
  --ui-font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --title-font: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui-font); }
.top { background: var(--accent); color: #fff; padding: 10px 18px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.logo { margin: 0; font-family: var(--title-font); font-size: 22px; font-weight: normal; letter-spacing: .04em; }
.lead { margin: 0; font-size: 13px; opacity: .95; }
.layout { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 52px); }
.side { border-right: 1px solid var(--line); background: #fffdf9; padding: 12px; overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 0; }
.cats { display: flex; flex-direction: column; gap: 6px; }
.cat { display: flex; flex-direction: column; gap: 2px; text-align: left; border: 2px solid transparent; border-left: 6px solid var(--accent); background: #fff; border-radius: 10px; padding: 8px 10px; cursor: pointer; font-family: var(--ui-font); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.cat:hover { background: var(--accent-l); }
.cat.on { border-color: var(--accent); background: var(--accent-l); }
.cat b { font-size: 15px; }
.cgroup { margin: 10px 2px 2px; font-size: 12px; color: var(--accent); letter-spacing: .05em; }
.cgroup:first-child { margin-top: 0; }
.cat small { font-size: 11px; color: var(--sub); font-weight: 700; }
.main { padding: 14px 18px 40px; min-width: 0; }
.grades { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.gbtn { font: 700 14px var(--ui-font); border: 2px solid var(--accent); color: #8a3510; background: #fff; border-radius: 999px; padding: 5px 16px; cursor: pointer; }
.gbtn.on { background: var(--accent); color: #fff; }
.gnote { font-size: 12px; color: var(--sub); }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-bottom: 16px; }
.item { display: flex; flex-direction: column; gap: 3px; padding: 6px; border: 2px solid transparent; border-radius: 12px; background: #fff; cursor: pointer; font-family: var(--ui-font); color: var(--ink); text-align: left; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.item:hover { background: var(--accent-l); }
.item.on { border-color: var(--accent); background: var(--accent-l); }
.item .thumb { aspect-ratio: 210 / 297; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.item .thumb svg { width: 100%; height: 100%; display: block; }
.item b { font-size: 12px; line-height: 1.3; }
.gr { align-self: flex-start; font-size: 10.5px; font-weight: 700; color: #fff; border-radius: 999px; padding: 1px 8px; }
.gr-low { background: var(--low); } .gr-mid { background: #c9871b; } .gr-high { background: var(--high); }
.empty { color: var(--sub); }
.panel { background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 16px; }
.panel h2 { margin: 0; font-size: 19px; }
.panel .when { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-l); border-radius: 999px; padding: 2px 10px; vertical-align: middle; }
.panel p { margin: 4px 0 0; font-size: 13px; color: var(--sub); line-height: 1.6; }
.opts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; margin: 12px 0 10px; padding: 10px 0; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 700; color: var(--sub); }
.field select, .field input { font: 500 15px var(--ui-font); padding: 6px 8px; border: 2px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); min-width: 90px; }
.field input { width: 90px; }
.check { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; cursor: pointer; padding-bottom: 6px; }
.check input { width: 18px; height: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.btn { font: 700 15px var(--ui-font); border: none; border-radius: 10px; padding: 10px 16px; background: var(--accent-l); color: #8a3510; cursor: pointer; }
.btn:hover { filter: brightness(.96); }
.btn-print { background: var(--accent); color: #fff; font-size: 16px; }
.hint { font-size: 12px !important; }
[hidden] { display: none !important; }
.kopts { flex-basis: 100%; display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; background: var(--accent-l); border-radius: 12px; }
.krow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; }
.klab { font-size: 12px; font-weight: 700; color: var(--sub); align-self: center; margin-right: 2px; }
.kitems .check { padding: 4px 10px; background: #fff; border-radius: 999px; font-size: 13.5px; }
.chip { font: 700 13px var(--ui-font); border: 2px solid var(--accent); color: #8a3510; background: #fff; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip:hover { background: var(--accent); color: #fff; }
.preview-wrap { display: flex; justify-content: center; }
.sheet-view { width: min(100%, 640px); aspect-ratio: 210 / 297; background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.14); }
.sheet-view svg { width: 100%; height: 100%; display: block; }
#print { display: none; }
@page { size: A4 portrait; margin: 0; }
@media print {
  html, body { background: #fff; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; }
  .sheet { width: 210mm; height: 297mm; overflow: hidden; break-after: page; page-break-after: always; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  .sheet svg { width: 210mm; height: 297mm; display: block; }
}
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--line); }
  .cats { flex-direction: row; flex-wrap: wrap; }
  .cat { flex: 1 1 140px; }
  .strip { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<header class="top">
  <h1 class="logo">✏️ めあてカード こうぼう</h1>
  <p class="lead">節目に 書く カードを えらんで A4 で いんさつ。白黒なので、さいごに 子どもが 色を ぬって 完成させます。</p>
</header>

<div class="layout">
  <aside class="side">
    <nav class="cats" id="cats" aria-label="カテゴリ"></nav>
  </aside>

  <main class="main">
    <div class="grades">
      <button type="button" class="gbtn" data-grade="all">ぜんぶ</button>
      <button type="button" class="gbtn" data-grade="low">低学年むけ</button>
      <button type="button" class="gbtn" data-grade="mid" id="gMid" hidden>中学年むけ</button>
      <button type="button" class="gbtn" data-grade="high">高学年むけ</button>
      <span class="gnote">低学年：ひらがな中心・大きな 文字・広い 行間・絵の 場所 多め ／ 高学年：漢字・こうもく 多め・おとなっぽい デザイン</span>
    </div>
    <div class="strip" id="strip"></div>

    <div class="panel">
      <h2><span id="pTitle"></span><span class="when" id="pWhen"></span></h2>
      <form class="opts" id="opts" onsubmit="return false">
        <label class="field">学年（いんさつ）
          <select id="optNen">
            <option value="">書かない（空らん）</option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
          </select>
        </label>
        <label class="field">組（いんさつ）
          <input id="optKumi" maxlength="3" placeholder="空らん">
        </label>
        <label class="field" id="termWrap">学期（しょうじょう）
          <select id="optTerm">
            <option value="">書かない（空らん）</option>
            <option>1</option><option>2</option><option>3</option>
          </select>
        </label>
        <label class="field">ふりがな
          <select id="optRuby">
            <option value="auto">低・中学年むけ だけ</option>
            <option value="on">いつも つける</option>
            <option value="off">つけない</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="optWobble" checked> 手がき ふうの 線</label>
        <div class="kopts" id="kakariOpts" hidden>
          <div class="krow">
            <label class="field">メンバーの 人数 <select id="kMem"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
            <label class="field" id="kTobanWrap">当番表の かたち <select id="kToban"></select></label>
            <label class="field">係名（いんさつ） <input id="kName" maxlength="10" placeholder="空らん"></label>
          </div>
          <div class="krow kitems" id="kItems"><span class="klab">のせる こうもく</span></div>
          <div class="krow kpresets"><span class="klab">おすすめ</span>
            <button type="button" class="chip" data-preset="full">当番表あり</button>
            <button type="button" class="chip" data-preset="notoban">当番表なし（マークつき）</button>
            <button type="button" class="chip" data-preset="simple">シンプル（3こうもく）</button>
            <button type="button" class="chip" data-preset="all">ぜんぶ</button>
          </div>
        </div>
        <div class="kopts" id="ichiranOpts" hidden>
          <div class="krow">
            <label class="field">係の 数（行） <select id="iRows"><option>6</option><option>8</option><option>10</option><option>12</option><option>14</option></select></label>
            <label class="field">メンバーの らん <select id="iCols"><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
          </div>
        </div>
      </form>
      <div class="actions">
        <label class="field">まいすう
          <select id="copies">
            <option value="1">1まい</option><option value="2">2まい</option><option value="5">5まい</option>
            <option value="10">10まい</option><option value="20">20まい</option><option value="30">30まい</option><option value="35">35まい</option><option value="40">40まい</option>
          </select>
        </label>
        <button type="button" class="btn btn-print" id="btnPrint">🖨️ この デザインを いんさつ</button>
        <button type="button" class="btn" id="btnCat"></button>
      </div>
      <p class="hint">いんさつ がめんで <b>よはく「なし」・倍率 100%</b> に すると ぴったり A4 に なります（PDF に ほぞん しても おなじ）。「学年」を えらぶと、なまえらんに いんさつ されます。</p>
    </div>

    <div class="preview-wrap">
      <div class="sheet-view" id="view"></div>
    </div>
  </main>
</div>

<div id="print"></div>

<script src="core.js"></script>
<script src="themes.js"></script>
<script src="themes2.js"></script>
<script src="figure.js"></script>
<script src="heroes.js"></script>
<script src="heroes2.js"></script>
<script src="layout.js"></script>
<script src="kakari.js"></script>
<script src="bespoke.js"></script>
<script src="catalog.js"></script>
<script src="extra.js"></script>
<script src="nawa.js"></script>
<script src="scenes.js"></script>
<script src="scenecat.js"></script>
<script src="app.js"></script>
</body>
</html>
