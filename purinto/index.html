<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff8a3d">
<meta name="description" content="小学生が たのしく とりくめる プリント・めあてカード・けんてい カードを、目的・教科・学年・時期・ことばで さがして、そのまま A4 で いんさつ できる。ことばかいだん・ものがたりめいろ・けいさんめいろ・ビンゴ・すごろく・めあてカード など。">
<title>プリント＆カード こうぼう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/app-icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/app-icon-180.png">
</head>
<body>

<header class="top">
  <h1 class="logo"><a href="#" id="logoLink">🖨️ プリント＆カード こうぼう</a></h1>
  <p class="lead">プリント・めあてカード・けんてい カードを えらんで、A4 で いんさつ。</p>
  <nav class="apptabs" aria-label="メニュー">
    <a href="#" id="toHome"><span class="ui-ic" data-ic="sparkle"></span> さがす・えらぶ</a>
  </nav>
</header>

<section class="home" id="home" hidden>
  <label class="search">
    <span class="search-ic" aria-hidden="true">🔍</span>
    <input type="search" id="q" placeholder="ことばで さがす（れい：くく・てつぼう）" autocomplete="off" enterkeyhint="search">
  </label>
  <div class="purposes" id="purposes" role="group" aria-label="なにを したい？"></div>
  <div class="filters">
    <div class="frow"><span class="flab">教科</span><div class="chips" id="fSubj"></div></div>
    <div class="frow"><span class="flab">学年</span><div class="chips" id="fGrade"></div></div>
    <div class="frow"><span class="flab">時期</span><div class="chips" id="fMonth"></div></div>
  </div>
  <div class="results" id="results"></div>
</section>

<div class="layout" id="editor" hidden>
  <aside class="side">
    <a class="back" href="#" id="back">← さがす・えらぶ に もどる</a>
    <h2 class="side-h" id="sideHead"></h2>
    <div class="cards" id="cards"></div>
  </aside>

  <main class="main">
    <div class="panel" id="panel">
      <div class="panel-head">
        <span class="panel-icon" id="pIcon"></span>
        <div>
          <h2 id="pTitle"></h2>
          <p id="pDesc"></p>
        </div>
      </div>
      <form class="opts" id="opts" onsubmit="return false"></form>
      <div class="actions">
        <button type="button" class="btn" id="btnNew"><span class="ui-ic" data-ic="dice"></span> べつの もんだい</button>
        <label class="field">まいすう
          <select id="copies">
            <option value="1">1まい</option><option value="2">2まい</option><option value="4">4まい</option>
            <option value="10">10まい</option><option value="20">20まい</option><option value="30">30まい</option><option value="40">40まい</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="withAnswer"> こたえの ページも いんさつ</label>
        <button type="button" class="btn btn-print" id="btnPrint"><span class="ui-ic" data-ic="printer"></span> いんさつ</button>
        <button type="button" class="btn btn-sub" id="btnLink"><span class="ui-ic" data-ic="link"></span> この プリントの URL</button>
      </div>
      <p class="hint" id="hint">「まいすう」を ふやすと、1まいずつ ちがう もんだいに なります（クラスで くばる とき べんり）。おなじ URL を ひらけば、いつでも おなじ プリントが でます。</p>
    </div>

    <div class="preview-wrap" id="previewWrap">
      <div class="pages" id="pages"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/emoji-map.js"></script>
<script src="assets/emojify.js"></script>
<script src="assets/icons.js"></script>
<script src="gen.js"></script>
<script src="data.js"></script>
<script src="sakubun.js"></script>
<script src="genkou.js"></script>
<script src="tetsubou.js"></script>
<script src="sheets.js"></script>
<script src="finder.js"></script>
<script src="app.js"></script>
</body>
</html>
