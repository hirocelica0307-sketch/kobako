<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おえかき｜かいて あてて</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="play">

<div class="topbar">
    <div class="roomcode"><span class="sub">へや</span><b id="code">----</b></div>
    <div class="members" id="members"></div>
    <button class="btn sub-btn" id="leave">でる</button>
</div>

<!-- ① あつまる －－ みんなが そろうのを まつ -->
<section class="card" id="waiting">
    <p class="sub" style="text-align:center;margin:0 0 10px">
        この ばんごうを つたえて、みんなを よびましょう
    </p>
    <div class="members big" id="membersBig"></div>
    <p class="count" id="count">まだ だれも いません</p>

    <div class="levels" id="levels"></div>

    <div class="row" style="margin-top:14px">
        <button class="btn go hidden" id="start">はじめる</button>
        <p class="sub hidden" id="waitMsg" style="margin:0">
            へやの ぬしが はじめるのを まっています…
        </p>
    </div>
</section>

<!-- ② おえかき -->
<div class="playarea hidden" id="play">
    <div class="board-wrap">
        <canvas id="base"></canvas>
        <canvas id="overlay" class="overlay"></canvas>
    </div>

    <div class="side">
        <!-- かく人 -->
        <div id="drawerPanel" class="hidden">
            <p class="sub" style="margin:0 0 6px">あなたの おだい</p>
            <div class="odai" id="odai">－－</div>
            <p class="count" id="answeredCount">まだ だれも あてていません</p>
            <div class="row" style="margin-top:10px">
                <button class="btn go" id="nextOdai">つぎの おだい</button>
            </div>
        </div>

        <!-- こたえる人 -->
        <div id="answerPanel" class="hidden">
            <p class="sub" style="margin:0 0 4px">なにを かいて いるのかな？</p>
            <div class="readout" id="ansOut"><span class="placeholder">こたえを いれてね</span></div>
            <div id="ansSlot"></div>
            <div class="row" style="margin-top:8px">
                <button class="btn go" id="ansGo" disabled>こたえる</button>
            </div>
            <div class="judge hidden" id="judge"></div>
        </div>
    </div>
</div>

<div class="tools hidden" id="tools">
    <div class="swatches" id="swatches"></div>
    <div class="pens" id="pens"></div>
    <button class="btn sub-btn" id="undo">もどす</button>
    <button class="btn sub-btn hidden" id="clear">ぜんぶ けす</button>
    <button class="btn sub-btn hidden" id="backToWait">あつまるに もどる</button>
</div>

<div class="notice wait" id="notice">つないでいます…</div>

<script type="module" src="room.js"></script>
</body>
</html>
