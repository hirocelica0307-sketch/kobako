<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おえかき｜かいて あてて</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="play">

<div class="topbar">
    <div class="roomcode"><span class="sub">へや</span><b id="code">----</b></div>
    <div class="members" id="members"></div>
    <button class="btn sub-btn" id="leave">でる</button>
</div>

<div class="board-wrap">
    <canvas id="base"></canvas>
    <canvas id="overlay" class="overlay"></canvas>
</div>

<div class="tools">
    <div class="swatches" id="swatches"></div>
    <div class="pens" id="pens"></div>
    <button class="btn sub-btn" id="undo">もどす</button>
    <button class="btn sub-btn hidden" id="clear">ぜんぶ けす</button>
</div>

<div class="notice wait" id="notice">つないでいます…</div>

<script type="module" src="room.js"></script>
</body>
</html>
