<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おえかき｜かいて あてて</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="play">

<div class="topbar">
    <div class="roomcode"><span class="sub">へや</span><b id="code">----</b></div>
    <div class="members" id="members"></div>
    <button class="btn sub-btn" id="soundBtn" title="おとを 入れる／切る">おと</button>
    <button class="btn sub-btn" id="leave">でる</button>
</div>

<!-- ① あつまる -->
<section class="card" id="waiting">
    <div class="memberzone">
        <p class="sub" style="text-align:center">この ばんごうを つたえて、みんなを よびましょう</p>
        <div class="members big" id="membersBig"></div>
        <p class="count" id="count">まだ だれも いません</p>
    </div>

    <div class="settings hidden" id="settings">
        <div class="setrow">
            <span class="setlabel">むずかしさ</span>
            <div class="levels" id="levels"></div>
        </div>
        <div class="setrow">
            <span class="setlabel">あなた（ぬし）は</span>
            <div class="levels" id="hostRoles"></div>
        </div>
        <div class="setrow">
            <span class="setlabel">あそびかた</span>
            <div class="levels" id="modes"></div>
        </div>
        <div class="setrow" id="lapRow">
            <span class="setlabel">なんしゅう</span>
            <div class="levels" id="laps"></div>
        </div>
        <div class="setrow hidden" id="minRow">
            <span class="setlabel">ぜんたいの じかん</span>
            <div id="minSlot"></div>
        </div>
        <div class="setrow">
            <span class="setlabel">1かいの じかん</span>
            <div id="secSlot"></div>
        </div>
    </div>

    <div class="row">
        <button class="btn go hidden" id="start">はじめる</button>
        <p class="sub hidden" id="waitMsg">へやの ぬしが はじめるのを まっています…</p>
    </div>
</section>

<!-- ② おえかき -->
<div class="playarea hidden" id="play">
    <div class="board-wrap">
        <canvas id="base"></canvas>
        <canvas id="overlay" class="overlay"></canvas>
    </div>

    <div class="side">
        <div class="statusbar">
            <span id="turnLabel">－</span>
            <span class="clock" id="clock"></span>
            <span class="timer" id="timer">－</span>
        </div>

        <div id="drawerPanel" class="hidden">
            <p class="sub">あなたが かく ばんです</p>
            <p class="count" id="answeredCount">まだ だれも あてていません</p>
        </div>

        <div id="answerPanel" class="hidden">
            <p class="sub">なにを かいて いるのかな？</p>
            <div class="readout" id="ansOut"><span class="placeholder">こたえを いれてね</span></div>
            <div class="slot" id="ansSlot"></div>
            <div class="row">
                <button class="btn go" id="ansGo" disabled>こたえる</button>
            </div>
        </div>

        <div id="adminPanel" class="hidden">
            <p class="sub">みんなの ようす</p>
            <div class="watchlist" id="watchlist"></div>
        </div>

        <p class="count hidden" id="waitingFor"></p>
        <div class="judge hidden" id="judge"></div>

        <div class="row" id="hostRow">
            <button class="btn go hidden" id="nextTurn">つぎの 人へ</button>
            <button class="btn sub-btn hidden" id="changeOdai">おだいを かえる</button>
            <button class="btn sub-btn hidden" id="pauseBtn">いちじ ていし</button>
            <button class="btn sub-btn hidden" id="endGame">おわりに する</button>
        </div>
    </div>
</div>

<div class="tools hidden" id="tools">
    <div class="odaibox" id="odaibox">
        <span class="odailabel">おだい</span>
        <b class="odaiword" id="odai">－－</b>
        <span class="odaihidden hidden" id="odaiMask">● ● ● ●</span>
        <button class="btn sub-btn tiny" id="hideOdai">かくす</button>
    </div>
    <div class="swatches" id="swatches"></div>
    <div class="pens" id="pens"></div>
    <button class="btn sub-btn" id="undo">もどす</button>
    <button class="btn sub-btn hidden" id="clear">ぜんぶ けす</button>
</div>

<!-- ③ けっか -->
<section class="card hidden" id="result">
    <h2 class="resulttitle">けっか はっぴょう</h2>
    <div class="ranking" id="ranking"></div>
    <div class="row">
        <button class="btn go hidden" id="again">もういちど</button>
        <p class="sub hidden" id="againMsg">へやの ぬしを まっています…</p>
    </div>
</section>

<div class="notice wait" id="notice">つないでいます…</div>

<script type="module" src="room.js"></script>
</body>
</html>
