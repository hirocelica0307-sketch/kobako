<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>かいて あてて</title>
<meta name="description" content="お題を 絵に かいて、みんなに あててもらう ゲームです。画面を さわるだけで あそべます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/app-icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/app-icon-180.png">
</head>
<body>

<h1 class="logo"><span>か</span><span>い</span><span>て</span><i></i><span>あ</span><span>て</span><span>て</span></h1>

<!-- ① なまえを いれる -->
<section class="card" id="stepName">
    <div class="readout" id="nameOut"><span class="placeholder">なまえを いれてね</span></div>
    <div class="slot" id="hiraSlot"></div>
    <div class="row">
        <button class="btn go" id="nameNext" disabled>つぎへ</button>
    </div>
</section>

<!-- ② 4けたの へやばんごうを いれる（へやは せんせいが つくります）-->
<section class="card hidden" id="stepCode">
    <p class="sub" style="text-align:center"><b id="codeName"></b> さん、せんせいに おしえて もらった へやの ばんごう（4けた）を いれてね</p>
    <div class="digits" id="digits"></div>
    <div class="slot" id="numSlot"></div>
    <div class="row">
        <button class="btn go" id="codeGo" disabled>はいる</button>
        <button class="btn sub-btn" id="backToName">なまえを なおす</button>
    </div>
</section>

<!-- せんせい：あいことば（4けた）を いれて へやを つくる -->
<section class="card hidden" id="stepSensei">
    <p class="sub" style="text-align:center" id="senseiMsg">せんせいの あいことば（4けた）</p>
    <div class="digits" id="pinDigits"></div>
    <div class="slot" id="pinSlot"></div>
    <div class="row">
        <button class="btn go" id="pinGo" disabled>へやを つくる</button>
        <button class="btn sub-btn" id="pinBack">もどる</button>
    </div>
</section>

<div class="notice wait hidden" id="notice"></div>

<!-- へやを つくれるのは せんせい だけ -->
<button class="btn sub-btn sensei-btn" id="senseiBtn" type="button">せんせい</button>

<script type="module" src="home.js"></script>
</body>
</html>
