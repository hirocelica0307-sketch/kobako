<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fdc">
<meta name="description" content="2年生の 九九の がくしゅうで、すうずブロックを ならべたり、まるで かこんだり、教科書の しゃしんに かさねたり できる アプリ。">
<title>くく ブロック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== うえの バー ========== -->
<header class="top">
  <h1 class="logo"><span>く</span><span>く</span><i></i><span>ブ</span><span>ロ</span><span>ッ</span><span>ク</span></h1>

  <nav class="tools" id="tools" aria-label="どうぐ">
    <button class="tool on" data-tool="move"><span class="ico">✋</span><span class="lbl">うごかす</span></button>
    <button class="tool" data-tool="loop"><span class="ico ico-loop"></span><span class="lbl">かこむ</span></button>
    <button class="tool" data-tool="pen"><span class="ico">✏️</span><span class="lbl">かく</span></button>
    <button class="tool" data-tool="erase"><span class="ico ico-eraser"></span><span class="lbl">けす</span></button>
  </nav>

  <div class="top-right">
    <button class="btn" id="btnUndo" aria-label="もどす"><span class="ico">↩️</span><span class="lbl">もどす</span></button>
    <button class="btn" id="btnRedo" aria-label="やりなおす"><span class="ico">↪️</span><span class="lbl">すすむ</span></button>
    <button class="btn btn-photo" id="btnPhoto"><span class="ico">📷</span><span class="lbl">しゃしん</span></button>
    <button class="btn" id="btnMenu" aria-label="せってい"><span class="ico">⚙️</span><span class="lbl">せってい</span></button>
  </div>
</header>

<main class="main">
  <!-- ========== ひだりの ブロックばこ ========== -->
  <aside class="side" aria-label="ブロックばこ">
    <div class="src" data-c="b" title="あおい ブロック"><span class="blk blk-b"></span><span class="lbl">あお</span></div>
    <div class="src" data-c="r" title="あかい ブロック"><span class="blk blk-r"></span><span class="lbl">あか</span></div>
    <button class="side-btn" id="btnArray"><span class="ico ico-array"></span><span class="lbl">ならべる</span></button>
    <div class="side-gap"></div>
    <button class="trash" id="trash" title="ここに すてる／おすと ぜんぶ けす"><span class="ico">🗑️</span><span class="lbl">ごみばこ</span></button>
  </aside>

  <!-- ========== つくえ（ボード） ========== -->
  <section class="board-wrap" id="boardWrap">
    <canvas id="board"></canvas>

    <!-- かく ときの いろ -->
    <div class="float-bar pen-bar" id="penBar" hidden>
      <button class="pen-c on" data-c="k" style="--c:#2b2b2b" aria-label="くろ"></button>
      <button class="pen-c" data-c="r" style="--c:#e5413a" aria-label="あか"></button>
      <button class="pen-c" data-c="b" style="--c:#2f6fdc" aria-label="あお"></button>
      <button class="pen-c" data-c="g" style="--c:#2fa84f" aria-label="みどり"></button>
      <span class="sep"></span>
      <button class="pen-w on" data-w="4" aria-label="ほそい"><i style="--w:4px"></i></button>
      <button class="pen-w" data-w="10" aria-label="ふとい"><i style="--w:10px"></i></button>
    </div>

    <!-- しゃしんを うごかす とき -->
    <div class="float-bar bg-bar" id="bgBar" hidden>
      <span class="bg-hint">ゆびで うごかす・2本ゆびで 大きさ</span>
      <button class="chip" id="bgMinus" aria-label="ちいさく">➖</button>
      <button class="chip" id="bgPlus" aria-label="おおきく">➕</button>
      <button class="chip" id="bgRot">🔄 まわす</button>
      <button class="chip" id="bgFit">🔲 ぴったり</button>
      <label class="chip chip-range">うすく<input type="range" id="bgAlpha" min="0.2" max="1" step="0.05"></label>
      <button class="chip chip-go" id="bgDone">✔ できた</button>
    </div>

    <div class="expr" id="expr" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <div class="drop-hint" id="dropHint" hidden>ここに はなすと はいけいに なります</div>
  </section>
</main>

<!-- ドラッグ ちゅうの ものを、いちばん うえに かく -->
<canvas id="dragLayer" class="drag-layer"></canvas>

<!-- ========== しゃしん の まど ========== -->
<div class="sheet-back" id="photoSheet" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2>📷 はいけいの しゃしん</h2>
      <button class="x" data-close aria-label="とじる">✕</button>
    </div>
    <div class="big-row">
      <button class="big" id="btnCamera"><span class="ico">📷</span>カメラで とる</button>
      <button class="big" id="btnFile"><span class="ico">🖼️</span>ファイルから</button>
      <button class="big" id="btnPaste"><span class="ico">📋</span>はりつける</button>
    </div>
    <p class="note">コピーした がぞうは <kbd>Ctrl</kbd> + <kbd>V</kbd>、ファイルは つくえに ドラッグしても はいります。</p>

    <div class="cur-bg" id="curBg" hidden>
      <button class="chip" id="btnBgMove">✋ いち・大きさを かえる</button>
      <label class="chip chip-range">うすく<input type="range" id="bgAlpha2" min="0.2" max="1" step="0.05"></label>
      <button class="chip chip-warn" id="btnBgOff">はいけいを はずす</button>
    </div>

    <h3>さいきんの しゃしん</h3>
    <div class="thumbs" id="thumbs"></div>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>
</div>

<!-- ========== カメラ ========== -->
<div class="camera" id="camera" hidden>
  <video id="camVideo" playsinline muted></video>
  <div class="cam-msg" id="camMsg" hidden></div>
  <div class="cam-bar">
    <button class="cam-side" id="camClose" aria-label="やめる">✕<span>やめる</span></button>
    <button class="shutter" id="camShot" aria-label="とる"></button>
    <button class="cam-side" id="camFlip" aria-label="カメラを かえる">🔄<span>カメラ</span></button>
  </div>
  <div class="flash" id="camFlash"></div>
</div>

<!-- ========== ならべる の まど ========== -->
<div class="sheet-back" id="arraySheet" hidden>
  <div class="sheet sheet-array">
    <div class="sheet-head">
      <h2><span class="ico ico-array"></span> ならべる</h2>
      <button class="x" data-close aria-label="とじる">✕</button>
    </div>
    <div class="arr-body">
      <div class="arr-ctrl">
        <div class="stepper">
          <span class="st-lbl">よこに</span>
          <button class="st" data-k="cols" data-d="-1">−</button>
          <b id="arrCols">3</b>
          <button class="st" data-k="cols" data-d="1">＋</button>
          <span class="st-lbl">こ</span>
        </div>
        <div class="stepper">
          <span class="st-lbl">たてに</span>
          <button class="st" data-k="rows" data-d="-1">−</button>
          <b id="arrRows">4</b>
          <button class="st" data-k="rows" data-d="1">＋</button>
          <span class="st-lbl">だん</span>
        </div>
        <div class="arr-color">
          <button class="arr-c on" data-c="b"><span class="blk blk-b"></span></button>
          <button class="arr-c" data-c="r"><span class="blk blk-r"></span></button>
        </div>
      </div>
      <div class="arr-preview" id="arrPreview"></div>
    </div>
    <button class="go" id="arrGo">ならべる</button>
  </div>
</div>

<!-- ========== せってい の まど ========== -->
<div class="sheet-back" id="menuSheet" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2>⚙️ せってい</h2>
      <button class="x" data-close aria-label="とじる">✕</button>
    </div>
    <div class="set-list">
      <label class="set"><span>マス目に そろえる</span><input type="checkbox" id="setSnap"><i class="sw"></i></label>
      <label class="set"><span>かこみの 中の かずを 見せる</span><input type="checkbox" id="setCount"><i class="sw"></i></label>
      <label class="set"><span>しきを 見せる</span><input type="checkbox" id="setExpr"><i class="sw"></i></label>
      <div class="set set-size">
        <span>ブロックの 大きさ</span>
        <input type="range" id="setSize" min="24" max="96" step="2">
        <span class="blk blk-b" id="sizeSample"></span>
      </div>
    </div>
    <div class="big-row">
      <button class="big" id="btnSave"><span class="ico">💾</span>がぞうで ほぞん</button>
      <button class="big big-warn" id="btnClear"><span class="ico">🧹</span>ぜんぶ けす</button>
    </div>
    <p class="note">「ぜんぶ けす」は ブロック・かこみ・かいた 線を けします（しゃしんは のこります）。<br>まちがえて けしても「もどす」で もとに もどせます。</p>
  </div>
</div>

<!-- ごみばこを おした とき -->
<div class="sheet-back" id="clearSheet" hidden>
  <div class="sheet sheet-small">
    <p class="ask">ぜんぶ けしますか？</p>
    <div class="big-row">
      <button class="big big-warn" id="clearYes">けす</button>
      <button class="big" data-close>やめる</button>
    </div>
  </div>
</div>

<script src="logic.js"></script>
<script src="photos.js"></script>
<script src="app.js"></script>
</body>
</html>
