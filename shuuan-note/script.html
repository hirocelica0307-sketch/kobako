    // 1コマの分けかたと、それぞれの教科に配分する時間

    const BT_COUNT = 5;
    const BT_MARKS = ['①', '②', '③', '④', '⑤'];

    // 文字かざりで使える色
    const RT_COLORS = [['標準','#5c4e3c'], ['赤','#d3302f'], ['青','#1565c0'], ['緑','#2e7d32'], ['橙','#ef6c00'], ['紫','#7b1fa2']];
    const RT_HILITE = [['黄','#ffe600'], ['赤','#ff7b7b'], ['青','#7ec8ff'], ['緑','#7dea8c'], ['橙','#ffb347']];
    // 前の版のうすいマーカーの色 → 新しいはっきりした色
    const RT_HILITE_LEGACY = { '#fff59d': '#ffe600', '#ffcdd2': '#ff7b7b', '#b3e5fc': '#7ec8ff' };

    // 時間割の行の構成（type: lesson=教科を選ぶ / memo=自由記入）

    // fold: true の行は、見出しを押すと1週間ぶんまとめて開閉できる。
    const ROWS = [
      { id: 'gyoji',   label: '行事', title: '行事予定', type: 'memo',   cls: 'row-event', print: true },

      { id: '1', label: '1', title: '1時間目', type: 'lesson', cls: '', print: true },
      { id: '2', label: '2', title: '2時間目', type: 'lesson', cls: '', print: true },
      { id: 'kangyou', label: '業間', title: '業間', type: 'memo', cls: 'row-break', print: true },
      { id: '3', label: '3', title: '3時間目', type: 'lesson', cls: '', print: true },
      { id: '4', label: '4', title: '4時間目', type: 'lesson', cls: '', print: true },
      { id: 'hiru', label: '昼', title: '昼', type: 'memo', cls: 'row-break', print: true },

      { id: '6', label: '6', title: '6時間目', type: 'lesson', cls: '', print: true }
    ];

    // 印刷は紙の週案簿の並びのまま（連絡はいちばん下）
    const PRINT_ORDER = ['gyoji', 'morning', '1', '2', 'kangyou', '3', '4', 'hiru', '5', '6', 'renraku', 'memo'];
    const ALL_PERIODS = ROWS.map(function(r) { return r.id; });
    const MEMO_PERIODS = ROWS.filter(function(r) { return r.type === 'memo'; }).map(function(r) { return r.id; });
    const LESSON_PERIODS = ROWS.filter(function(r) { return r.type === 'lesson'; }).map(function(r) { return r.id; });
    function getRow(id) { return ROWS.find(function(r) { return r.id === String(id); }); }

    // 週案のデータのキーの形（日付-行）。これ以外の形のキーは、読み込むときに取り除く。
    const DATA_KEY_RE = /^\d{4}-\d{2}-\d{2}-[a-z0-9]+$/;

    // 期間の取り組み（〇〇週間など）の矢印の色
    const PERIOD_COLORS = {
      blue:   { name: '青', bg: '#d9e5fa', fg: '#23457f' },
      green:  { name: '緑', bg: '#dcefe0', fg: '#2a6b34' },
      orange: { name: '橙', bg: '#fbe3c8', fg: '#8a5208' },
      pink:   { name: '桃', bg: '#f8dce7', fg: '#94305b' },
      purple: { name: '紫', bg: '#e6defa', fg: '#5a3f9e' }
    };

    const subjectColors = {
      "国語": "color-kokugo", "書写": "color-shosha", "図書": "color-tosho",
      "社会": "color-shakai", "算数": "color-sansu", "理科": "color-rika",
      "生活": "color-seikatsu", "音楽": "color-ongaku", "図画工作": "color-zuko", "家庭": "color-katei",
      "体育": "color-taiiku", "道徳": "color-doutoku", "総合": "color-sogo",
      "外国語活動": "color-gaikokugo", "外国語": "color-gaikokugo",
      "学活": "color-gakkatsu", "委員会": "color-gakkatsu", "クラブ": "color-gakkatsu",
      "行事": "color-gyoji", "その他": "color-other"
    };

    let currentMonday = new Date();
    let currentEditDayIndex = -1;
    let currentEditPeriod = "";
    const appData = {};
    const appNotes = [];
    let showWeekend = false;
    let currentAttachments = [];
    let uploadMode = "";
    let editingNoteId = null;
    let noteLink = null;     // 時間割から起こしたときの手がかり
    const appSettings = { year: getFiscalYear(new Date()), configByYear: {}, adjustByYear: {} };
    let holidaysData = {};

    // ===== 祝日 =====
    // 日本の祝日は法律で規則が決まっているので、計算で求められる。
    // 通信できない校内ネットワークでも使えるよう、まずこの計算結果を使う。
    // 通信できる環境では起動時に本家のデータも読み、取れた年はそちらに置きかえる
    //（法改正や、五輪のときのような臨時の移動に自動で追いつくため）。

    const builtHolidayYears = {};
    const apiHolidayYears = {};   // 本家のデータで置きかえた年

    // その月の第n月曜日
    function nthMonday(y, m, nth) {
      const first = new Date(y, m - 1, 1);
      const shift = (8 - first.getDay()) % 7;
      return new Date(y, m - 1, 1 + shift + (nth - 1) * 7);
    }

    // 春分・秋分の日（1980〜2099年で実用上正確な近似式）
    function shunbunDay(y) { return Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)); }
    function shubunDay(y)  { return Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)); }

    function buildHolidays(y) {
      const out = {};
      const key = function(dt) { return fmtDate(dt); };
      const put = function(mo, da, name) { out[key(new Date(y, mo - 1, da))] = name; };
      const putD = function(dt, name) { out[key(dt)] = name; };

      put(1, 1, '元日');
      putD(nthMonday(y, 1, 2), '成人の日');
      put(2, 11, '建国記念の日');
      if (y >= 2020) put(2, 23, '天皇誕生日');
      put(3, shunbunDay(y), '春分の日');
      put(4, 29, '昭和の日');
      put(5, 3, '憲法記念日');
      put(5, 4, 'みどりの日');
      put(5, 5, 'こどもの日');
      putD(nthMonday(y, 7, 3), '海の日');
      put(8, 11, '山の日');
      putD(nthMonday(y, 9, 3), '敬老の日');
      put(9, shubunDay(y), '秋分の日');
      putD(nthMonday(y, 10, 2), 'スポーツの日');
      put(11, 3, '文化の日');
      put(11, 23, '勤労感謝の日');
      if (y <= 2018) put(12, 23, '天皇誕生日');

      // 国民の休日（祝日と祝日にはさまれた平日。例：敬老の日と秋分の日のあいだ）
      Object.keys(out).slice().forEach(function(k) {
        const d = new Date(k.replace(/-/g, '/'));
        const mid = new Date(d); mid.setDate(mid.getDate() + 1);
        const nxt = new Date(d); nxt.setDate(nxt.getDate() + 2);
        if (out[key(nxt)] && !out[key(mid)] && mid.getDay() !== 0) out[key(mid)] = '国民の休日';
      });

      // 振替休日（日曜と重なったら、次の祝日でない日）
      Object.keys(out).slice().sort().forEach(function(k) {
        const d = new Date(k.replace(/-/g, '/'));
        if (d.getDay() !== 0) return;
        const n = new Date(d);
        do { n.setDate(n.getDate() + 1); } while (out[key(n)]);
        out[key(n)] = '振替休日';
      });

      return out;
    }

    // 表示している年の前後1年ぶんを用意しておく。
    // 本家のデータで置きかえた年には、計算の結果を足さない。
    function ensureHolidays(centerYear) {
      const base = centerYear || new Date().getFullYear();
      for (let y = base - 1; y <= base + 1; y++) {
        if (builtHolidayYears[y] || apiHolidayYears[y]) continue;
        const h = buildHolidays(y);
        Object.keys(h).forEach(function(k) { if (!holidaysData[k]) holidaysData[k] = h[k]; });
        builtHolidayYears[y] = true;
      }
    }

    // 本家のデータが取れたら、その年の分はまるごと置きかえる。
    // 足すだけだと、計算で出した「移動前の祝日」が残ってしまうため。
    function applyApiHolidays(data) {
      const years = {};
      Object.keys(data).forEach(function(k) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k)) years[k.slice(0, 4)] = true;
      });
      Object.keys(holidaysData).forEach(function(k) {
        if (years[k.slice(0, 4)] && !data[k]) delete holidaysData[k];
      });
      Object.keys(data).forEach(function(k) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof data[k] === 'string') holidaysData[k] = data[k];
      });
      Object.keys(years).forEach(function(y) { apiHolidayYears[parseInt(y, 10)] = true; });
    }

    // 読込に失敗した状態で保存すると、クラウドのデータを空で上書きしてしまう。
    // このフラグが立っている間はいっさい書き込まない。
    let saveBlocked = false;
    let currentRev = 0;   // クラウドから読み込んだときの保存回数。上書き事故の判定に使う。
    let loadingTimer = null;

    function hasGas() {
      return typeof google !== 'undefined' && !!google.script && !!google.script.run;
    }

    function getFiscalYear(dt) {
      const y = dt.getFullYear();
      return ((dt.getMonth() + 1) <= 3 ? y - 1 : y).toString();
    }

    function renameSubject(s) { return (s && SUBJECT_RENAME[s]) ? SUBJECT_RENAME[s] : (s || ""); }

    // 古いデータ（isSplit のみ）も新しい splitMode として読めるようにする
    function getSplitMode(data) {
      if (!data) return 'none';
      if (data.splitMode && SPLIT_DEFAULTS[data.splitMode]) return data.splitMode;
      return data.isSplit ? 'half' : 'none';
    }

    // 1コマの配分（保存された値を優先し、なければ初期値）
    function getWeights(data) {
      const def = SPLIT_DEFAULTS[getSplitMode(data)];
      const saved = (data && Array.isArray(data.weights)) ? data.weights : null;
      if (!saved) return def.slice();
      return def.map(function(dv, i) {
        const n = Number(saved[i]);
        return (isFinite(n) && n > 0) ? n : dv;
      });
    }

    function getSlots(data) {
      const w = getWeights(data);
      const subs = [data.subject, data.subject2, data.subject3];
      const units = [data.unit, data.unit2, data.unit3];
      return w.map(function(wt, i) {
        return { subject: subs[i] || "", unit: units[i] || "", weight: wt };
      });
    }

    function blankLesson() {
      return { subject:"", unit:"", subject2:"", unit2:"", subject3:"", unit3:"",
               splitMode:"none", isSplit:false, weights:[1.0], disabled:false,
               contact:"", record:"", attachments:[] };
    }

    function showLoading() {
      const ls = document.getElementById('loadingScreen');
      if (ls) ls.style.display = 'flex';
      if (loadingTimer) clearTimeout(loadingTimer);
      loadingTimer = setTimeout(function() {
        hideLoading();
        alert("処理に時間がかかっています。通信状況を確認して、もう一度お試しください。");
      }, 30000);
    }

    function hideLoading() {
      if (loadingTimer) { clearTimeout(loadingTimer); loadingTimer = null; }
      const ls = document.getElementById('loadingScreen');
      if (ls) ls.style.display = 'none';
    }

    function blockSaving(reason) {
      saveBlocked = true;
      const banner = document.getElementById('readOnlyBanner');
      if (banner) {
        banner.innerHTML = '現在は閲覧のみのモードです（保存されません）<br>' +
          '<span>' + escapeHTML(reason) + '</span><br>' +
          '<span>保存済みのデータを守るため、書き込みを止めています。ページを再読み込みしてください。</span>';
        banner.style.display = 'block';
      }
    }

    window.onload = function() {
      try { buildBaseTimetableSetup(); buildRtBars(); } catch (e) { console.error('画面の組み立てでエラー:', e); }
      setupModalShortcuts();

      // 保存していない変更があるまま閉じようとしたら引き止める
      window.addEventListener('beforeunload', function(e) {
        if (!pendingSave || saveBlocked) return;
        // 閉じるまでに保存が終わらないこともあるので、念のため端末にも残す（次に開いたとき、保存できていれば消す）
        writeDraft();
        flushSave();
        e.preventDefault();
        e.returnValue = '';
        return '';
      });

      // ほかの端末で保存されていないか、タブに戻ってきたときに確かめる
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') checkServerRev();
      });

      // まず内蔵の計算で祝日をそろえる（通信を待たない・つながらなくても出る）
      ensureHolidays(new Date().getFullYear());

      // つながる環境なら本家のデータで置きかえる（臨時の祝日にも自動で追いつく）
      fetch('https://holidays-jp.github.io/api/v1/date.json')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (!data || typeof data !== 'object') return;
          applyApiHolidays(data);
          if (document.getElementById('cell-0-1')) updateView();
        })
        .catch(function() { console.log('祝日データは取得できませんでした（内蔵の計算を使います）'); });

      showLoading();
      try {
        if (hasGas()) {
          google.script.run
            .withSuccessHandler(initializeData)
            .withFailureHandler(function(err) {
              console.error('サーバー読み込みエラー:', err);
              const msg = (err && err.message) ? err.message : String(err);
              blockSaving("クラウドからの読み込みに失敗しました：" + msg);
              alert("クラウドからの読み込みに失敗しました。\n\n" + msg +
                    "\n\n保存済みのデータを消さないよう、閲覧のみのモードで起動します。");
              initializeData(null);
            })
            .loadDataFromServer();
        } else {
          blockSaving("Apps Script の外で開かれているため、クラウドに接続できません。");
          initializeData(null);
        }
      } catch (e) {
        console.error('起動エラー:', e);
        blockSaving("起動処理でエラーが発生しました：" + (e && e.message ? e.message : e));
        initializeData(null);
      }
    };

    // はじめて使う人に用意しておくタグ
    function defaultTagDefs() {
      return {
        "児童の様子": { color: "#fdeef1" },
        "アイデア":   { color: "#fbf8e3" },
        "会議メモ":   { color: "#eaf4fd" }
      };
    }

    // 設定に足りない入れものを用意する。中身のあるものには手を触れない。
    // 起動時・バックアップ読み込み・ほかの端末の内容と合わせたときに呼ぶ。
    function ensureSettingsDefaults() {
      const y = appSettings.year || getFiscalYear(new Date());
      appSettings.year = y;

      if (!appSettings.configByYear) appSettings.configByYear = {};
      if (!appSettings.foldersByYear) appSettings.foldersByYear = {};
      if (!appSettings.folderDetailsByYear) appSettings.folderDetailsByYear = {};
      if (!appSettings.adjustByYear) appSettings.adjustByYear = {};
      if (!appSettings.rosterByYear) appSettings.rosterByYear = {};
      if (!appSettings.unitsByYear) appSettings.unitsByYear = {};
      if (!appSettings.unitDoneByYear) appSettings.unitDoneByYear = {};
      if (!appSettings.autoFilledByYear) appSettings.autoFilledByYear = {};
      if (!appSettings.periodsByYear) appSettings.periodsByYear = {};
      if (!isPlainObj(appSettings.todos)) appSettings.todos = {};
      if (!appSettings.tagDefs) appSettings.tagDefs = defaultTagDefs();

      if (!appSettings.configByYear[y]) {
        // 新しい年度は、学年・組を空欄から始める（前の年度の値が残っていると気づきにくいため）
        appSettings.configByYear[y] = { grade: "", className: "", termType: "3", baseTimetable: {} };
      }
      return y;
    }

    // 形のおかしいキー・中身を取り除く（読み込んだファイルが壊れていたときのため）
    function dropBadKeys() {
      Object.keys(appData).forEach(function(k) {
        const v = appData[k];
        if (!DATA_KEY_RE.test(k) || !v || typeof v !== 'object' || Array.isArray(v)) delete appData[k];
      });
      for (let i = appNotes.length - 1; i >= 0; i--) {
        const n = appNotes[i];
        if (!n || typeof n !== 'object' || !isFinite(Number(n.id))) { appNotes.splice(i, 1); continue; }
        n.id = Number(n.id);
        if (n.link && (typeof n.link !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(String(n.link.date)))) delete n.link;
      }
    }

    // 記録に年度を付けたり、古い形の添付を読みかえたりする
    function normalizeNotes() {
      appNotes.forEach(function(note) {
        if (note.content && typeof note.content === 'string' && note.content.includes('[添付:')) {
          const migrated = migrateAttachments(note.content, note.attachments);
          note.content = migrated.text;
          note.attachments = migrated.attachments;
        }
        if (!note.year) {
          const parts = (note.date || "").split('/');
          if (parts.length >= 2) {
            const y = parseInt(parts[0]);
            const m = parseInt(parts[1]);
            note.year = (m <= 3) ? (y - 1).toString() : y.toString();
          } else {
            note.year = appSettings.year;
          }
        }
      });
    }

    function initializeData(serverData) {
      try {
        if (serverData) {
          // 読み込んだままの姿を控えておく（ほかの端末の変更と合わせるときの基準）
          snapshotBase(serverData);
          currentRev = (typeof serverData.rev === 'number') ? serverData.rev : 0;
          userKey = (typeof serverData.userKey === 'string' && /^[0-9a-f]{8,64}$/.test(serverData.userKey)) ? serverData.userKey : '';
          if (serverData.settings) Object.assign(appSettings, serverData.settings);
          if (serverData.data) Object.assign(appData, serverData.data);
          if (serverData.notes && Array.isArray(serverData.notes)) appNotes.push(...serverData.notes);
        }

        dropBadKeys();
        const currentSetYear = ensureSettingsDefaults();

        migrateOldData();
        migrateNotesToTags();
        normalizeNotes();
        cleanPeriods();
        migrateNoteTodos();
        cleanTodos();
        const holCleaned = removeAutoHolidayNames();

        const yearInput = document.getElementById('setYear');
        if (yearInput) yearInput.value = currentSetYear;

        // 先に教科の選択肢を作ってから、基本時間割の値を復元する
        updateSubjectDropdown();
        changeSettingYear();

        currentMonday = clampMonday(new Date()).monday;

        buildGrid();
        updateView();
        applyColumnDisplay();
        renderTodoCounts();
        if (serverData && !saveBlocked) checkDraftOnStart();
        // 前の版が入れた祝日の名前を取り除いたときは、保存しておく
        if (holCleaned && serverData && !saveBlocked && document.getElementById('dialogModal').style.display !== 'flex') requestSave();

      } catch (e) {
        console.error('初期化エラー:', e);
        blockSaving("読み込んだデータを展開できませんでした：" + (e && e.message ? e.message : e));
        alert('初期化中にエラーが発生しました：\n' + (e && e.message ? e.message : e) +
              '\n\n保存済みのデータを消さないよう、閲覧のみのモードで起動します。');
      } finally {
        hideLoading();
        window.__shuuanReady = true;   // 画面が開けた印（index の「開かないときの手当て」が見る）
      }
    }

    // 旧バージョンで保存されたデータを、新しい構成に読み替える
    function migrateOldData() {
      const mergeIntoMemo = function(dateStr, src, prefix) {
        const memoKey = dateStr + '-memo';
        if (!appData[memoKey]) appData[memoKey] = { record: "", attachments: [] };
        const target = appData[memoKey];
        const text = (src.record || "").trim();
        if (text) {
          target.record = (target.record ? target.record + "\n" : "") + prefix + text;
        }
        if (src.attachments && src.attachments.length) {
          target.attachments = (target.attachments || []).concat(src.attachments);
        }
      };

      Object.keys(appData).slice().forEach(function(key) {
        const parts = key.split('-');
        if (parts.length !== 4) return;
        const dateStr = parts[0] + '-' + parts[1] + '-' + parts[2];
        const period = parts[3];
        const d = appData[key];
        if (!d) return;

        // 廃止した「指導記録」「会議記録」は、内容を「メモ」欄に引き継いで削除する
        if (period === 'shidou' || period === 'kaigi') {
          mergeIntoMemo(dateStr, d, period === 'shidou' ? '指導記録：' : '会議記録：');
          delete appData[key];
          return;
        }

        // 「朝」は教科を選ぶ欄から自由記入の欄に変わったので、教科名を本文に移す
        if (period === 'morning') {
          if (d.subject || d.unit) {
            const line = [d.subject, d.unit].filter(Boolean).join(' ');
            d.record = (line ? line : "") + (d.record ? (line ? "\n" : "") + d.record : "");
            delete d.subject; delete d.unit; delete d.subject2; delete d.unit2;
            delete d.subject3; delete d.unit3; delete d.splitMode; delete d.isSplit;
            delete d.contact;
          }
          return;
        }

        // 今週の目標は表のコマではない。前の版が付けてしまった余分な項目を取り除く。
        if (period === 'weekgoal') {
          ['subject', 'subject2', 'subject3', 'splitMode'].forEach(function(f) { delete d[f]; });
          return;
        }

        if (LESSON_PERIODS.indexOf(period) === -1) return;

        // 教科名の変更（総合／学活／委員会／クラブ／行事）
        d.subject = renameSubject(d.subject);
        d.subject2 = renameSubject(d.subject2);
        d.subject3 = renameSubject(d.subject3);
        if (!d.splitMode) d.splitMode = d.isSplit ? 'half' : 'none';

        if (d.record && typeof d.record === 'string' && d.record.includes('[添付:')) {
          const migrated = migrateAttachments(d.record, d.attachments);
          d.record = migrated.text;
          d.attachments = migrated.attachments;
        }
      });

      // 基本の時間割に登録された教科名も置きかえる
      Object.keys(appSettings.configByYear || {}).forEach(function(y) {
        const conf = appSettings.configByYear[y];
        getBaseSets(conf).forEach(function(b) {
          Object.keys(b.cells).forEach(function(k) {
            if (b.cells[k] !== BT_OFF) b.cells[k] = renameSubject(b.cells[k]);
          });
        });
      });
    }

    function getConfig() {
      const y = appSettings.year || getFiscalYear(new Date());
      return appSettings.configByYear[y] || { grade: "5", className: "", termType: "3", baseTimetable: {} };
    }

    // 学年の表示（未設定のときは、そのことが分かるようにする）
    function gradeLabel(conf) {
      return (conf && conf.grade) ? conf.grade + '年' : '（学年未設定）';
    }

    // 保存の入れものは、いつも3つぶん用意しておく。
    // （2学期制に変えても、3学期に登録した単元名を消さないため）
    const TERM_KEYS = ['term1', 'term2', 'term3'];

    // 画面に出す学期は、学期制の設定で変わる
    function is2Term(conf) { return String((conf || getConfig()).termType) === '2'; }
    function termKeys(conf) { return is2Term(conf) ? ['term1', 'term2'] : ['term1', 'term2', 'term3']; }
    function termNames(conf) {
      const c = conf || getConfig();
      if (!is2Term(c)) return { term1: '1学期', term2: '2学期', term3: '3学期' };
      // 2学期制の呼び方は、学校によって変わるのでえらべるようにしてある
      return (String(c.termNaming) === 'gakki')
        ? { term1: '1学期', term2: '2学期', term3: '（使いません）' }
        : { term1: '前期',  term2: '後期',  term3: '（使いません）' };
    }
    function termName(t, conf) { return termNames(conf)[t] || t; }
    // その年度の最後の学期（年度末の判定に使う）
    function lastTermKey(conf) { return is2Term(conf) ? 'term2' : 'term3'; }

    // 教科ごとの単元名（年度 → 学期 → 教科）
    function getUnitBank(year, term) {
      if (!appSettings.unitsByYear) appSettings.unitsByYear = {};
      if (!appSettings.unitsByYear[year]) appSettings.unitsByYear[year] = {};
      const y = appSettings.unitsByYear[year];

      // 古い形式（学期の区別なし）を1学期に移す
      const looksOld = Object.keys(y).some(function(k) { return TERM_KEYS.indexOf(k) === -1; });
      if (looksOld) {
        const moved = {};
        Object.keys(y).forEach(function(k) {
          if (TERM_KEYS.indexOf(k) === -1) { moved[k] = y[k]; delete y[k]; }
        });
        if (!y.term1) y.term1 = {};
        Object.keys(moved).forEach(function(sub) {
          if (!y.term1[sub]) y.term1[sub] = moved[sub];
        });
      }
      TERM_KEYS.forEach(function(t) { if (!y[t]) y[t] = {}; });
      return term ? y[term] : y;
    }

    // 単元の「済」は、登録リスト（unitsByYear）とは別に単元名で覚える。
    // こうしておけば、設定で単元名を並べ替えても済のままになる。
    function getUnitDone(year, term) {
      if (!appSettings.unitDoneByYear) appSettings.unitDoneByYear = {};
      if (!appSettings.unitDoneByYear[year]) appSettings.unitDoneByYear[year] = {};
      const y = appSettings.unitDoneByYear[year];
      if (!y[term]) y[term] = {};
      return y[term];
    }

    function isUnitDone(year, term, sub, name) {
      const list = getUnitDone(year, term)[sub];
      return !!(list && list.indexOf(name) !== -1);
    }

    function toggleUnitDone(sub, name) {
      const y = appSettings.year || getFiscalYear(new Date());
      const term = getTermOfEditingCell();
      const store = getUnitDone(y, term);
      if (!store[sub]) store[sub] = [];
      const i = store[sub].indexOf(name);
      if (i === -1) store[sub].push(name); else store[sub].splice(i, 1);
      renderUnitPick();
      syncToServer();
    }

    // 名簿（年度ごと）
    function getRoster(year) {
      if (!appSettings.rosterByYear) appSettings.rosterByYear = {};
      if (!Array.isArray(appSettings.rosterByYear[year])) appSettings.rosterByYear[year] = [];
      return appSettings.rosterByYear[year];
    }

    function getAdjust(year) {
      if (!appSettings.adjustByYear) appSettings.adjustByYear = {};
      if (!appSettings.adjustByYear[year]) appSettings.adjustByYear[year] = {};
      return appSettings.adjustByYear[year];
    }

    let toastTimer = null;

    // withUndo を true にすると「元に戻す」ボタン付きで、長めに出る
    function showToast(text, withUndo) {
      const toast = document.getElementById('saveToast');
      if (!toast) return;
      toast.innerHTML = '<span>' + escapeHTML(text) + '</span>' +
        (withUndo ? '<button type="button" class="toast-undo" onclick="undoLast()">元に戻す</button>' : '');
      toast.classList.toggle('has-undo', !!withUndo);
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove('show'); }, withUndo ? 8000 : 2500);
    }

    // ===== 保存 =====
    // 操作のたびに Drive へ書き込むと、年数が経つほど重くなる。
    // そこで少し待って、続けて行われた操作をまとめて 1 回で保存する。

    const SAVE_DELAY = 2500;
    let saveTimer = null;
    let pendingSave = false;     // まだ保存していない変更があるか
    let savingNow = false;       // いま通信中か
    let reconciling = false;     // ほかの端末の内容と合わせている最中か
    let shrinkApproved = false;  // 件数が大きく減る保存を、本人が確かめたか
    let lastRevCheck = 0;

    function setSaveState(state) {
      const el = document.getElementById('saveState');
      if (!el) return;
      const label = {
        dirty:  '● 未保存',
        saving: '保存中…',
        saved:  '保存済み',
        error:  draftSaved ? '保存できていません（この端末に下書きあり）' : '保存できていません',
        local:  'ローカル表示（保存されません）'
      }[state] || '';
      el.className = 'on ' + state;
      el.innerText = label;
      if (state === 'saved') {
        setTimeout(function() {
          if (!pendingSave && !savingNow) el.classList.remove('on');
        }, 2200);
      }
    }

    // 既存の呼び口はそのまま。中身が「予約」に変わっただけ。
    function syncToServer() { requestSave(); }

    function requestSave() {
      if (saveBlocked) { showToast("閲覧のみのモードです（保存されません）"); return; }
      pendingSave = true;
      setSaveState('dirty');
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(doSave, SAVE_DELAY);
    }

    // 待たずにいま保存する（Ctrl+S、ページを離れるときなど）
    function flushSave() {
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
      if (pendingSave) doSave();
    }

    function doSave() {
      if (saveBlocked || !pendingSave) return;
      if (savingNow || reconciling) {   // 通信が終わってからやり直す
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(doSave, 800);
        return;
      }
      if (!hasGas()) {
        pendingSave = false;
        setSaveState('local');
        return;
      }

      savingNow = true;
      pendingSave = false;
      setSaveState('saving');
      // 送った内容を控えておき、保存できたらそれを次の基準にする
      const sent = stateStrings(appSettings, appData, appNotes);

      google.script.run
        .withSuccessHandler(function(res) {
          savingNow = false;
          if (res && res.ok === false) {
            pendingSave = true;
            if (res.conflict) { reconcileWithServer(); return; }
            if (res.shrink) { askShrink(res); return; }
            writeDraft();
            setSaveState('error');
            uiAlert("保存できませんでした。\n\n" + (res.error || "原因不明のエラーです。"));
            return;
          }
          if (res && typeof res.rev === 'number') currentRev = res.rev;
          baseState = sent;
          shrinkApproved = false;
          if (draftSaved) clearDraft();   // 保存できたので、端末の下書きはいらない
          if (pendingSave) { setSaveState('dirty'); requestSave(); }
          else { setSaveState('saved'); }
        })
        .withFailureHandler(function(err) {
          savingNow = false;
          pendingSave = true;
          const kept = writeDraft();
          setSaveState('error');
          uiAlert("保存できませんでした。\n\n" + ((err && err.message) ? err.message : String(err)) +
                  (kept ? "\n\n書いた内容は、この端末に一時的に残しました。通信がもどると、次の保存で自動で消えます。"
                        : "\n\nこの内容を失いたくない場合は、設定画面の「書き出す」でファイルに保存してください。"));
        })
        .saveDataToServer(appSettings, appData, appNotes, currentRev, shrinkApproved);
    }

    // 件数が大きく減る保存。まちがいで全部消えかけているのかもしれないので、本人に確かめる。
    function askShrink(res) {
      setSaveState('error');
      uiConfirm('保存しようとしている内容は、クラウドにある内容より件数が大きく減っています。\n\n' +
                'クラウド：' + res.oldCount + '件 → これから保存：' + res.newCount + '件\n\n' +
                'バックアップの読み込みなど、自分でまとめて消した・入れかえたのであれば「このまま保存する」を押してください。\n' +
                '心当たりがないときは「保存しない」を押し、ページを再読み込みしてください。', function(ok) {
        if (ok) {
          shrinkApproved = true;
          pendingSave = true;
          doSave();
        } else {
          blockSaving('件数が大きく減る保存を止めました。クラウドの内容はそのまま残っています。');
        }
      }, 'このまま保存する', '保存しない');
    }

    // ===== ほかの端末の内容と合わせる =====
    // 最後にクラウドとそろえたときの姿（baseState）と、いまの姿、クラウドの姿を比べる。
    // ・自分だけが変えたところ → 自分の内容を使う
    // ・相手だけが変えたところ → 相手の内容を使う
    // ・両方が別々に変えたところ → 決められないので、保存を止めて知らせる
    // 比べる単位は、週案は1コマ、記録は1件、設定は年度や項目ごと。

    const FLAT_SEP = '\u0001';
    // 設定を何段目まで分けて比べるか（書いていないものは1段）
    const SETTINGS_DEPTH = { configByYear: 2, adjustByYear: 2, unitsByYear: 3, unitDoneByYear: 3, autoFilledByYear: 2, periodsByYear: 2 };
    let baseState = null;

    function isPlainObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }

    function flatSettings(s) {
      const out = {};
      const walk = function(path, v, depth) {
        if (depth > 0 && isPlainObj(v)) {
          const ks = Object.keys(v);
          if (ks.length === 0) { out[path] = '{}'; return; }
          ks.forEach(function(k) { walk(path + FLAT_SEP + k, v[k], depth - 1); });
          return;
        }
        if (v !== undefined) out[path] = JSON.stringify(v);
      };
      Object.keys(s || {}).forEach(function(k) {
        walk(k, s[k], SETTINGS_DEPTH[k] || (isPlainObj(s[k]) ? 1 : 0));
      });
      return out;
    }

    function unflatSettings(flat) {
      const out = {};
      Object.keys(flat).forEach(function(path) {
        const parts = path.split(FLAT_SEP);
        let cur = out;
        for (let i = 0; i < parts.length - 1; i++) {
          if (!isPlainObj(cur[parts[i]])) cur[parts[i]] = {};
          cur = cur[parts[i]];
        }
        const last = parts[parts.length - 1];
        const v = JSON.parse(flat[path]);
        if (isPlainObj(v) && isPlainObj(cur[last])) Object.assign(cur[last], v);
        else cur[last] = v;
      });
      return out;
    }

    function stateStrings(settings, data, notes) {
      const s = { settings: flatSettings(settings || {}), data: {}, notes: {} };
      Object.keys(data || {}).forEach(function(k) { s.data[k] = JSON.stringify(data[k]); });
      (notes || []).forEach(function(n) {
        if (n && n.id !== undefined) s.notes[String(n.id)] = JSON.stringify(n);
      });
      return s;
    }

    function snapshotBase(src) {
      baseState = stateStrings(src.settings, src.data, src.notes);
    }

    function sameMap(a, b) {
      const ka = Object.keys(a), kb = Object.keys(b);
      if (ka.length !== kb.length) return false;
      for (let i = 0; i < ka.length; i++) { if (a[ka[i]] !== b[ka[i]]) return false; }
      return true;
    }

    function sameState(a, b) {
      return sameMap(a.data, b.data) && sameMap(a.notes, b.notes) && sameMap(a.settings, b.settings);
    }

    // B=基準、O=いま、S=クラウド。soft(k) が true の項目は、両方変えていても自分の内容を使う。
    function merge3(B, O, S, soft) {
      const out = Object.assign({}, S);
      const conflicts = [];
      const keys = {};
      Object.keys(B).forEach(function(k) { keys[k] = true; });
      Object.keys(O).forEach(function(k) { keys[k] = true; });
      Object.keys(keys).forEach(function(k) {
        if (O[k] === B[k]) return;   // 自分は変えていない
        if (S[k] === B[k] || S[k] === O[k] || (soft && soft(k))) {
          if (O[k] === undefined) delete out[k]; else out[k] = O[k];
          return;
        }
        conflicts.push(k);
      });
      return { result: out, conflicts: conflicts };
    }

    // 表示中の年度・よく使うタグの並び・自動入力の印は、端末ごとの都合なので取り合いにしない
    function softSettingPath(k) {
      return k === 'year' || k === 'recentTags' || k.indexOf('autoFilledByYear' + FLAT_SEP) === 0;
    }

    function parseMap(m) {
      const out = {};
      Object.keys(m).forEach(function(k) { out[k] = JSON.parse(m[k]); });
      return out;
    }

    function reconcileWithServer() {
      if (reconciling || saveBlocked || !hasGas()) return;
      reconciling = true;
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
      setSaveState('saving');
      google.script.run
        .withSuccessHandler(function(server) {
          reconciling = false;
          try {
            mergeServerState(server);
          } catch (e) {
            console.error('合わせられませんでした:', e);
            handleSaveConflict(server, 0);
          }
        })
        .withFailureHandler(function(err) {
          // 読めなかっただけなので、次の保存でもう一度ためす
          reconciling = false;
          pendingSave = true;
          setSaveState('error');
          console.warn('ほかの端末の内容を読めませんでした:', err);
        })
        .loadDataFromServer();
    }

    function mergeServerState(server) {
      if (!server || typeof server !== 'object') throw new Error('クラウドの内容を読めませんでした');
      const srv = stateStrings(server.settings, server.data, server.notes);
      const ours = stateStrings(appSettings, appData, appNotes);
      const base = baseState || stateStrings({}, {}, []);

      const md = merge3(base.data, ours.data, srv.data);
      const mn = merge3(base.notes, ours.notes, srv.notes);
      const ms = merge3(base.settings, ours.settings, srv.settings, softSettingPath);
      const n = md.conflicts.length + mn.conflicts.length + ms.conflicts.length;
      if (n > 0) { handleSaveConflict(server, n); return; }

      const serverMoved = !sameState(ours, srv);

      // 合わせた内容に入れかえる
      const data = parseMap(md.result);
      Object.keys(appData).forEach(function(k) { delete appData[k]; });
      Object.assign(appData, data);

      const notes = parseMap(mn.result);
      appNotes.length = 0;
      Object.keys(notes).map(function(k) { return notes[k]; })
        .sort(function(a, b) { return (Number(b.id) || 0) - (Number(a.id) || 0); })
        .forEach(function(x) { appNotes.push(x); });

      const settings = unflatSettings(ms.result);
      Object.keys(appSettings).forEach(function(k) { delete appSettings[k]; });
      Object.assign(appSettings, settings);

      currentRev = (typeof server.rev === 'number') ? server.rev : currentRev;
      baseState = srv;

      dropBadKeys();
      ensureSettingsDefaults();
      migrateOldData();
      migrateNotesToTags();
      normalizeNotes();
      cleanPeriods();
      migrateNoteTodos();
      cleanTodos();
      removeAutoHolidayNames();
      refreshAllViews();

      // クラウドの内容と食いちがうところ（自分の変更）が残っていれば、保存する
      if (!sameState(stateStrings(appSettings, appData, appNotes), srv)) {
        pendingSave = true;
        doSave();
        if (serverMoved) showToast('別の端末で保存された内容と、いまの変更を合わせました');
      } else {
        pendingSave = false;
        setSaveState('saved');
        if (serverMoved) showToast('別の端末で保存された内容を読み込みました');
      }
    }

    // タブに戻ってきたときなどに、ほかの端末が保存していないか軽く確かめる
    function checkServerRev() {
      if (saveBlocked || savingNow || reconciling || !hasGas()) return;
      const now = Date.now();
      if (now - lastRevCheck < 15000) return;
      lastRevCheck = now;
      google.script.run
        .withSuccessHandler(function(rev) {
          if (typeof rev !== 'number' || rev < 0) return;
          if (rev !== currentRev && !savingNow && !reconciling) reconcileWithServer();
        })
        .withFailureHandler(function() {})
        .getServerRev();
    }

    // 両方の端末で同じところを書きかえていた場合。
    // ここで書き込みを止めないと、相手が書いた内容を消してしまう。
    function handleSaveConflict(server, count) {
      const when = (server && server.savedAt) ? "（相手の保存: " + server.savedAt + "）" : "";
      blockSaving("別の端末（またはタブ）で、同じところが書きかえられています。" + when);
      writeDraft();   // 再読み込みしても、いまの内容が消えないように
      setSaveState('error');
      openDialog('confirm', '別の端末で同じところが書きかえられています',
        'このページを開いたあとに、別の端末またはタブでこの週案が保存されました。\n' +
        (count ? '同じところ（' + count + 'か所）を両方で書きかえているため、自動では合わせられませんでした。\n\n' : '\n') +
        'いま画面にある内容をそのまま保存すると、相手が書いた内容を消してしまうため、保存を止めました。\n\n' +
        'まず「書き出す」でいまの画面の内容をファイルに残し、そのあとページを再読み込みしてください。',
        '', function(ok) { if (ok) exportBackup(); },
        'いまの内容を書き出す', '閉じる');
    }

    // データが丸ごと入れかわったあとに、画面を全部作り直す
    function refreshAllViews() {
      const yEl = document.getElementById('setYear');
      if (yEl) yEl.value = appSettings.year;
      const settingOpen = document.getElementById('settingModal').style.display === 'flex';
      if (!settingOpen) {
        changeSettingYear();
      } else {
        // 設定を書きかけのときは、入力欄はそのままにしておく
        const dc = document.getElementById('displayClassInfo');
        if (dc) dc.innerText = classPlateText(appSettings.year, getConfig());
      }
      updateSubjectDropdown();
      currentMonday = clampMonday(currentMonday).monday;
      updateView();
      try { updateNoteYearSelect(); renderNoteFilters(); renderNotes(); } catch (e) {}
      renderTodoPanel(true);
      renderTodoCounts();
      try {
        if (document.getElementById('summaryModal').style.display === 'flex') calculateTotalHours();
      } catch (e) {}
    }

    // ===== 元に戻す =====
    // 直前の操作の「変更前の姿」だけを覚えておく。appData 全体は複製しない。

    const UNDO_MAX = 20;
    const undoStack = [];

    function dayKeys(dIdx) {
      return ALL_PERIODS.map(function(p) { return getDataKey(dIdx, p); });
    }

    function weekKeys() {
      const keys = [];
      for (let d = 0; d < 7; d++) { keys.push.apply(keys, dayKeys(d)); }
      return keys;
    }

    function pushUndo(label, keys) {
      const snap = {};
      (keys || []).forEach(function(k) {
        snap[k] = appData[k] ? JSON.parse(JSON.stringify(appData[k])) : null;
      });
      undoStack.push({ kind: 'data', label: label, snap: snap });
      if (undoStack.length > UNDO_MAX) undoStack.shift();
    }

    // バックアップ読み込みのように全部が入れ替わる操作の前に、丸ごと控える
    function pushUndoFull(label) {
      undoStack.push({
        kind: 'full', label: label,
        data: JSON.parse(JSON.stringify(appData)),
        notes: JSON.parse(JSON.stringify(appNotes)),
        settings: JSON.parse(JSON.stringify(appSettings))
      });
      if (undoStack.length > UNDO_MAX) undoStack.shift();
    }

    function pushUndoNote(label, note, index) {
      undoStack.push({ kind: 'note', label: label, note: JSON.parse(JSON.stringify(note)), index: index });
      if (undoStack.length > UNDO_MAX) undoStack.shift();
    }

    function undoLast() {
      if (saveBlocked) { showToast("閲覧のみのモードでは戻せません"); return; }
      const e = undoStack.pop();
      if (!e) { showToast("元に戻せる操作はありません"); return; }

      if (e.kind === 'full') {
        Object.keys(appData).forEach(function(k) { delete appData[k]; });
        Object.assign(appData, e.data);
        appNotes.length = 0;
        e.notes.forEach(function(n) { appNotes.push(n); });
        Object.keys(appSettings).forEach(function(k) { delete appSettings[k]; });
        Object.assign(appSettings, e.settings);
        ensureSettingsDefaults();
        // 大きく減る保存になることがあるが、本人が戻すと決めた操作なので確認はしない
        shrinkApproved = true;
        refreshAllViews();
      } else if (e.kind === 'todos') {
        const ts = getTodos();
        Object.keys(e.snap).forEach(function(id) { if (e.snap[id]) ts[id] = e.snap[id]; else delete ts[id]; });
        renderTodoPanel(true); updateView();
      } else if (e.kind === 'period') {
        const ps = getPeriods(e.year);
        if (e.prev) ps[e.id] = e.prev; else delete ps[e.id];
        afterPeriodChange();
      } else if (e.kind === 'note') {
        const at = Math.max(0, Math.min(e.index, appNotes.length));
        appNotes.splice(at, 0, e.note);
        try { renderNoteFilters(); renderNotes(); } catch (err) {}
      } else {
        Object.keys(e.snap).forEach(function(k) {
          if (e.snap[k] === null) delete appData[k];
          else appData[k] = e.snap[k];
        });
        updateView();
      }
      requestSave();
      showToast('「' + e.label + '」を元に戻しました');
    }

    function migrateAttachments(text, existingAttachments) {
      let newText = text || "";
      let atts = existingAttachments ? [...existingAttachments] : [];
      const mdRegex = /\[添付:\s*(.*?)\]\((https?:\/\/[^\s)]+)\)/g;
      let match;
      while ((match = mdRegex.exec(newText)) !== null) {
        atts.push({ id: Date.now() + Math.random(), name: match[1], url: match[2], type: 'file' });
      }
      newText = newText.replace(mdRegex, '').trim();
      return { text: newText, attachments: atts };
    }

    // ===== 文字かざり（太字・文字色・ハイライト） =====
    const RT_TAGS = ['B','STRONG','I','EM','U','S','STRIKE','DEL','SPAN','FONT','BR','DIV','P'];
    // 中身ごと捨てるタグ（タグだけ外すと、中の文字がそのまま出てしまうもの）
    const RT_DROP = ['SCRIPT','STYLE','TEMPLATE','NOSCRIPT','IFRAME','OBJECT','EMBED','SVG','MATH','TEXTAREA','SELECT','TITLE','HEAD'];
    let rtActive = null;

    function rtFocus(el) { rtActive = el; }

    function rtCmd(cmd, val) {
      if (!rtActive) { showToast("先に入力欄をタップしてください"); return; }
      rtActive.focus();
      try { document.execCommand('styleWithCSS', false, true); } catch (e) {}
      if (cmd === 'bold') { document.execCommand('bold', false, null); }
      else if (cmd === 'italic') { document.execCommand('italic', false, null); }
      else if (cmd === 'strike') { document.execCommand('strikeThrough', false, null); }
      else if (cmd === 'clear') { document.execCommand('removeFormat', false, null); }
      else if (cmd === 'fore') { document.execCommand('foreColor', false, val); }
      else if (cmd === 'hilite') {
        let ok = false;
        try { ok = document.execCommand('hiliteColor', false, val); } catch (e) {}
        if (!ok) document.execCommand('backColor', false, val);
      }
    }

    function buildRtBars() {
      const html = function() {
        let h =
          '<button type="button" class="rt-btn" onmousedown="event.preventDefault()" onclick="rtCmd(\'bold\')" title="太字"><b>B</b></button>' +
          '<button type="button" class="rt-btn it" onmousedown="event.preventDefault()" onclick="rtCmd(\'italic\')" title="斜体"><i>I</i></button>' +
          '<button type="button" class="rt-btn st" onmousedown="event.preventDefault()" onclick="rtCmd(\'strike\')" title="取り消し線">S</button>' +
          '<span class="rt-sep"></span>';
        RT_COLORS.forEach(function(c) {
          h += '<button type="button" class="rt-sw" style="background:' + c[1] + ';" onmousedown="event.preventDefault()" ' +
               'onclick="rtCmd(\'fore\',\'' + c[1] + '\')" title="文字色：' + c[0] + '"></button>';
        });
        h += '<span class="rt-sep"></span>';
        RT_HILITE.forEach(function(c) {
          h += '<button type="button" class="rt-sw hl" style="background:' + c[1] + ';" onmousedown="event.preventDefault()" ' +
               'onclick="rtCmd(\'hilite\',\'' + c[1] + '\')" title="マーカー：' + c[0] + '"></button>';
        });
        h += '<span class="rt-sep"></span>' +
             '<button type="button" class="rt-btn" onmousedown="event.preventDefault()" onclick="rtCmd(\'clear\')" title="かざりを取る">解除</button>';
        return h;
      }();
      ['rtBarInput','rtBarNote'].forEach(function(id) {
        const el = document.getElementById(id); if (el) el.innerHTML = html;
      });
    }

    function rtNormColor(c) {
      if (!c) return '';
      const t = String(c).trim().toLowerCase();
      const m = t.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
      if (!m) return t;
      return '#' + [m[1], m[2], m[3]].map(function(n) { return ('0' + parseInt(n, 10).toString(16)).slice(-2); }).join('');
    }

    function rtColorOK(c) {
      const n = rtNormColor(c);
      return RT_COLORS.some(function(x) { return x[1] === n; }) || RT_HILITE.some(function(x) { return x[1] === n; }) ||
             !!RT_HILITE_LEGACY[n];
    }

    // 文字列のHTMLを、画面には出さずに組み立てる。
    // document.createElement で組み立てると、<img onerror> などがその場で動いてしまうため、
    // スクリプトが動かない DOMParser の文書の中で扱う。
    function inertRoot(html) {
      const doc = new DOMParser().parseFromString('<!DOCTYPE html><html><body><div></div></body></html>', 'text/html');
      const root = doc.body.firstChild;
      root.innerHTML = html || '';
      return root;
    }

    // 決めた色と太字だけを残し、それ以外のタグや属性は取り除く
    function rtSanitize(html) {
      const box = inertRoot(html);
      (function walk(node) {
        Array.prototype.slice.call(node.childNodes).forEach(function(ch) {
          if (ch.nodeType === 3) return;
          if (ch.nodeType !== 1 || RT_DROP.indexOf(ch.tagName.toUpperCase()) !== -1) { node.removeChild(ch); return; }
          // 先に中身をきれいにしてから、このタグを残すか外すかを決める。
          // （タグを外して中身を親に移したあとでは、中身が調べられないまま残ってしまう）
          walk(ch);
          if (RT_TAGS.indexOf(ch.tagName.toUpperCase()) === -1) {
            while (ch.firstChild) node.insertBefore(ch.firstChild, ch);
            node.removeChild(ch);
            return;
          }
          const color = ch.style ? ch.style.color : '';
          const bg = ch.style ? ch.style.backgroundColor : '';
          const bold = ch.style ? ch.style.fontWeight : '';
          const italic = ch.style ? ch.style.fontStyle : '';
          const deco = ch.style ? ch.style.textDecoration || ch.style.textDecorationLine : '';
          const attrColor = ch.getAttribute ? ch.getAttribute('color') : '';
          Array.prototype.slice.call(ch.attributes || []).forEach(function(a) { ch.removeAttribute(a.name); });
          if (rtColorOK(color)) ch.style.color = rtNormColor(color);
          if (rtColorOK(attrColor)) ch.style.color = rtNormColor(attrColor);
          if (rtColorOK(bg)) ch.style.backgroundColor = RT_HILITE_LEGACY[rtNormColor(bg)] || rtNormColor(bg);
          if (bold === 'bold' || bold === '700' || bold === 'bolder') ch.style.fontWeight = 'bold';
          if (italic === 'italic') ch.style.fontStyle = 'italic';
          if (deco && deco.indexOf('line-through') !== -1) ch.style.textDecoration = 'line-through';
          if (deco && deco.indexOf('underline') !== -1) ch.style.textDecoration =
            (ch.style.textDecoration ? ch.style.textDecoration + ' ' : '') + 'underline';
        });
      })(box);
      return box.innerHTML;
    }

    function rtLooksHTML(v) { return /<(b|strong|i|em|u|s|strike|del|span|font|br|div|p)\b/i.test(v || ''); }

    // 表示用のHTML（古い書式なしデータもそのまま扱える）
    function rtRender(v) {
      if (!v) return '';
      return rtLooksHTML(v) ? rtSanitize(v) : escapeHTML(v).replace(/\n/g, '<br>');
    }

    // 検索や空判定に使う、かざりを外した文字列
    function rtText(v) {
      if (!v) return '';
      if (!rtLooksHTML(v)) return v;
      return inertRoot(rtSanitize(v)).textContent || '';
    }

    function rtEmpty(v) { return rtText(v).trim() === ''; }
    function setRT(id, v) { const el = document.getElementById(id); if (el) el.innerHTML = rtRender(v); }
    function getRT(id) {
      const el = document.getElementById(id);
      if (!el) return '';
      const h = rtSanitize(el.innerHTML);
      return rtEmpty(h) ? '' : h;
    }

    function escapeHTML(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function escapeRegExp(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    // かざりのない文字列の中の検索語に印を付ける（文字は先に分けてから、それぞれを退避する）
    function hlText(t, q) {
      if (!t) return '';
      if (!q) return escapeHTML(t);
      const re = new RegExp(escapeRegExp(q), 'gi');
      let out = '', last = 0, m;
      while ((m = re.exec(t)) !== null) {
        if (!m[0]) { re.lastIndex++; continue; }
        out += escapeHTML(t.slice(last, m.index)) + '<mark>' + escapeHTML(m[0]) + '</mark>';
        last = m.index + m[0].length;
      }
      return out + escapeHTML(t.slice(last));
    }

    // かざり付きのHTMLの中の検索語に印を付ける。
    // 文字の部分だけを見るので、「amp」で探しても &amp; のような書き方がこわれない。
    function hlHTML(html, q) {
      if (!q) return html;
      const root = inertRoot(html);
      const doc = root.ownerDocument;
      const re = new RegExp(escapeRegExp(q), 'gi');
      const texts = [];
      (function walk(n) {
        Array.prototype.forEach.call(n.childNodes, function(c) {
          if (c.nodeType === 3) texts.push(c); else if (c.nodeType === 1) walk(c);
        });
      })(root);
      texts.forEach(function(t) {
        const s = t.nodeValue;
        re.lastIndex = 0;
        if (!re.test(s)) return;
        re.lastIndex = 0;
        const frag = doc.createDocumentFragment();
        let last = 0, m;
        while ((m = re.exec(s)) !== null) {
          if (!m[0]) { re.lastIndex++; continue; }
          frag.appendChild(doc.createTextNode(s.slice(last, m.index)));
          const mk = doc.createElement('mark');
          mk.textContent = m[0];
          frag.appendChild(mk);
          last = m.index + m[0].length;
        }
        frag.appendChild(doc.createTextNode(s.slice(last)));
        t.parentNode.replaceChild(frag, t);
      });
      return root.innerHTML;
    }

    function safeUrl(url) {
      const u = String(url || "").trim();
      return /^https?:\/\//i.test(u) ? u : "";
    }

    function openAttachment(url) {
      const safe = safeUrl(url);
      if (!safe) { alert("このリンクは開けません。http:// または https:// で始まるURLのみ利用できます。"); return; }
      window.open(safe, '_blank');
    }


    // ===== 画面内ダイアログ =====
    // Apps Script の画面は別ドメインの iframe 内で動くため、ブラウザが
    // alert / confirm / prompt を無効化することがある。自前の画面に置きかえる。
    let dialogMode = 'alert';
    let dialogCallback = null;

    function openDialog(mode, title, message, defaultValue, cb, okLabel, cancelLabel) {
      dialogMode = mode; dialogCallback = cb || null;
      document.getElementById('dialogTitle').innerText = title;
      document.getElementById('dialogMessage').innerText = message;
      const input = document.getElementById('dialogInput');
      input.style.display = (mode === 'prompt') ? 'block' : 'none';
      input.value = defaultValue || '';
      const cancel = document.getElementById('dialogCancel');
      cancel.style.display = (mode === 'alert') ? 'none' : 'inline-flex';
      cancel.innerText = cancelLabel || 'キャンセル';
      document.getElementById('dialogOk').innerText = okLabel || 'OK';
      document.getElementById('dialogModal').style.display = 'flex';
      setTimeout(function() { if (mode === 'prompt') input.focus(); }, 30);
    }

    function dialogRespond(ok) {
      const mode = dialogMode;
      const cb = dialogCallback;
      const value = document.getElementById('dialogInput').value;
      dialogCallback = null;
      document.getElementById('dialogModal').style.display = 'none';
      if (!cb) return;
      if (mode === 'prompt') { cb(ok ? value : null); }
      else if (mode === 'confirm') { cb(!!ok); }
      else { cb(); }
    }

    function uiAlert(message, cb) { openDialog('alert', 'お知らせ', message, '', cb, '閉じる'); }
    function uiConfirm(message, cb, okLabel, cancelLabel) { openDialog('confirm', '確認', message, '', cb, okLabel, cancelLabel); }
    function uiPrompt(message, defaultValue, cb) { openDialog('prompt', '入力', message, defaultValue, cb, '決定'); }

    // ===== キーボードで操作する =====
    // 週案の表に「いま選んでいるコマ」を持たせ、矢印キーで動かす。
    // 文字を打っている最中や、ダイアログが開いている間は邪魔をしない。

    let selCell = { d: 0, p: '1' };

    function isTypingTarget(el) {
      if (!el) return false;
      const tag = (el.tagName || '').toLowerCase();
      return !!el.isContentEditable || tag === 'input' || tag === 'textarea' || tag === 'select';
    }

    // ボタンやリンクにフォーカスがあるときは、Enter・スペースをそちらに任せる
    function isActionTarget(el) {
      if (!el || el === document.body || !el.closest) return false;
      return !!el.closest('button, a[href], summary, [role="button"], [tabindex]');
    }

    function anyModalOpen() {
      return Array.prototype.slice.call(document.querySelectorAll('.modal-overlay'))
        .some(function(m) { return m.style.display === 'flex'; });
    }

    // キーボードで動かしているあいだだけ true。
    // マウスやタッチで触ったときは目印を出さない（押した場所が枠で囲まれるのを防ぐため）。
    let keyNav = false;

    function clearSelHighlight() {
      const prev = document.querySelectorAll('.timetable td.sel');
      Array.prototype.forEach.call(prev, function(td) { td.classList.remove('sel'); });
    }

    function highlightSelected() {
      clearSelHighlight();
      if (!keyNav) return;
      const td = document.getElementById('cell-' + selCell.d + '-' + selCell.p);
      if (td && td.style.display !== 'none') td.classList.add('sel');
    }

    function moveSel(dCol, dRow) {
      keyNav = true;
      const cols = visibleDayIndexes();
      let ci = cols.indexOf(selCell.d);
      if (ci === -1) ci = 0;
      ci = Math.max(0, Math.min(cols.length - 1, ci + dCol));
      selCell.d = cols[ci];

      let pi = ALL_PERIODS.indexOf(String(selCell.p));
      if (pi === -1) pi = 0;
      pi = Math.max(0, Math.min(ALL_PERIODS.length - 1, pi + dRow));
      selCell.p = ALL_PERIODS[pi];

      highlightSelected();
      const td = document.getElementById('cell-' + selCell.d + '-' + selCell.p);
      if (td && td.scrollIntoView) { td.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
    }

    function setupModalShortcuts() {
      // マウスやタッチで表を触ったら、キーボードの目印は消す
      const tt = document.querySelector('.timetable');
      if (tt) {
        tt.addEventListener('pointerdown', function() { keyNav = false; clearSelHighlight(); });
      }

      // 背景を押すと、いちばん上の画面を閉じる
      document.querySelectorAll('.modal-overlay').forEach(function(ov) {
        ov.addEventListener('mousedown', function(e) { if (e.target === ov) closeTopModal(); });
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { closeTopModal(); return; }

        const mod = e.ctrlKey || e.metaKey;

        // 保存と「元に戻す」は、どこにいても効くようにしておく
        if (mod && (e.key === 's' || e.key === 'S')) {
          e.preventDefault();
          if (saveBlocked) { showToast("閲覧のみのモードです（保存されません）"); return; }
          flushSave();
          showToast("保存しています…");
          return;
        }
        if (mod && (e.key === 'z' || e.key === 'Z') && !isTypingTarget(document.activeElement)) {
          e.preventDefault(); undoLast(); return;
        }

        // ここから下は、表を見ているときだけ
        if (anyModalOpen() || isTypingTarget(document.activeElement)) return;

        switch (e.key) {
          case 'ArrowLeft':
            if (e.altKey) changeWeek(-1); else moveSel(-1, 0);
            e.preventDefault(); break;
          case 'ArrowRight':
            if (e.altKey) changeWeek(1); else moveSel(1, 0);
            e.preventDefault(); break;
          case 'ArrowUp':   moveSel(0, -1); e.preventDefault(); break;
          case 'ArrowDown': moveSel(0,  1); e.preventDefault(); break;
          case 'Home':      jumpToToday();  e.preventDefault(); break;
          case 'Enter':
          case ' ':
            if (isActionTarget(document.activeElement)) return;
            openInputModal(selCell.d, selCell.p);
            e.preventDefault(); break;
        }
      });
    }

    function closeTopModal() {
      const open = Array.prototype.slice.call(document.querySelectorAll('.modal-overlay'))
        .filter(function(m) { return m.style.display === 'flex'; });
      if (open.length === 0) return;
      open.sort(function(a, b) {
        return (parseInt(a.style.zIndex || getComputedStyle(a).zIndex) || 1000) -
               (parseInt(b.style.zIndex || getComputedStyle(b).zIndex) || 1000);
      });
      const top = open[open.length - 1];
      if (top.id === 'dialogModal') { dialogRespond(false); return; }
      if (top.id === 'inputModal') { closeInputModal(); return; }
      if (top.id === 'noteModal') { closeNoteModal(); return; }
      if (top.id === 'printPreviewModal') { closePrintPreview(); return; }
      if (top.id === 'yearModal') { closeYearModal(); return; }
      top.style.display = 'none';
    }


    // ふつうにドラッグ＝入れ替え、Ctrl（Mac は ⌘/option）を押しながら＝コピー
    function isCopyDrag(event) { return !!(event.ctrlKey || event.metaKey || event.altKey); }

    function handleDragStart(event, key) {
      event.dataTransfer.setData("text/plain", key);
      event.dataTransfer.effectAllowed = "copyMove";
      event.stopPropagation();
    }
    function handleDragOver(event) {
      event.preventDefault();
      const copy = isCopyDrag(event);
      event.dataTransfer.dropEffect = copy ? "copy" : "move";
      event.currentTarget.style.background = copy ? '#eef4ec' : '#e4edf9';
    }
    function handleDragEnter(event) { event.currentTarget.style.background = '#e4edf9'; }
    function handleDragLeave(event) { event.currentTarget.style.background = ''; }
    function handleDrop(event, targetDay, targetPeriod) {
      event.preventDefault(); event.stopPropagation(); event.currentTarget.style.background = '';
      const sourceKey = event.dataTransfer.getData("text/plain"); if (!sourceKey) return;
      if (!DATA_KEY_RE.test(sourceKey)) return;
      if (dayIsOutside(targetDay)) { noticeLocked(targetDay); return; }
      const targetKey = getDataKey(targetDay, targetPeriod); if (sourceKey === targetKey) return;
      const srcRow = getRow(sourceKey.split('-')[3]);
      const tgtRow = getRow(targetPeriod);
      if (!srcRow || !tgtRow || srcRow.type !== tgtRow.type) {
        showToast("授業の欄と記入欄のあいだでは移せません");
        return;
      }

      const copyMode = isCopyDrag(event);
      pushUndo(copyMode ? 'コマのコピー' : 'コマの入れ替え', [sourceKey, targetKey]);

      // 添付のリンクは同じものを指したままでよいが、id は重ならないように振り直す
      const dup = function(d) {
        if (!d) return null;
        const c = JSON.parse(JSON.stringify(d));
        if (c.attachments) { c.attachments.forEach(function(a) { a.id = Date.now() + Math.random(); }); }
        return c;
      };
      const srcData = dup(appData[sourceKey]);
      const tgtData = dup(appData[targetKey]);

      if (srcData) appData[targetKey] = srcData; else delete appData[targetKey];
      if (!copyMode) {
        // 入れ替えなので、元のコマには相手の内容を入れる
        if (tgtData) appData[sourceKey] = tgtData; else delete appData[sourceKey];
      }

      updateView();
      syncToServer();
      showToast(copyMode ? "コマをコピーしました" : "コマを入れ替えました", true);
    }

    let dayMenuIndex = -1;

    function openDayMenu(dIdx) {
      if (dayIsOutside(dIdx)) { noticeLocked(dIdx); return; }
      dayMenuIndex = dIdx;
      const names = ['月','火','水','木','金','土','日'];
      const d = new Date(currentMonday); d.setDate(d.getDate() + dIdx);
      document.getElementById('dayMenuTitle').innerText =
        (d.getMonth()+1) + '月' + d.getDate() + '日（' + names[dIdx] + '）のまとめ操作';
      const holName = holidaysData[fmtDate(d)];
      const vacName = getHolidayPeriodName(fmtDate(d));
      document.getElementById('dayMenuHint').innerText =
        (holName ? holName + '。' : (vacName ? vacName + '。' : '')) +
        'この日の1日分をまとめて操作します。';
      // 日課のボタン（いまの日課に印）
      const nk = getNikka();
      const cur = nikkaOfDate(fmtDate(d));
      document.getElementById('dayNikkaBtns').innerHTML = NIKKA_TYPES.map(function(t) {
        return '<button type="button" class="btn btn-sm ' + (t === cur ? 'btn-leaf' : 'btn-soft') + '" data-t="' + t + '" ' +
               'onclick="event.stopPropagation(); setDayNikka(this.dataset.t)">' + escapeHTML(nk[t].name) + '</button>';
      }).join('');
      document.getElementById('dayMenuModal').style.display = 'flex';
    }

    function closeDayMenu() { document.getElementById('dayMenuModal').style.display = 'none'; }

    function fmtDate(d) {
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    // 1〜6時間目をまとめて「授業なし」にする
    function dayAllOff() {
      const dIdx = dayMenuIndex;
      closeDayMenu();
      uiConfirm('この日の1〜6時間目を、まとめて「授業なし」にします。\n\n' +
                '入っていた教科や単元名は消えます。\n' +
                '行事・朝・業間・昼・連絡・メモはそのまま残ります。', function(ok) {
        if (!ok) return;
        pushUndo('この日を授業なしにする', LESSON_PERIODS.map(function(p) { return getDataKey(dIdx, p); }));
        LESSON_PERIODS.forEach(function(p) { appData[getDataKey(dIdx, p)] = { disabled: true }; });
        updateView(); syncToServer(); showToast("1日を授業なしにしました", true);
      }, '授業なしにする');
    }

    // 「授業なし」を取り消して空のコマに戻す
    function dayAllOn() {
      const dIdx = dayMenuIndex;
      closeDayMenu();
      const targets = LESSON_PERIODS.map(function(p) { return getDataKey(dIdx, p); })
        .filter(function(k) { return appData[k] && appData[k].disabled; });
      if (targets.length === 0) { uiAlert("この日に「授業なし」のコマはありません。"); return; }
      pushUndo('「授業なし」の取り消し', targets);
      targets.forEach(function(k) { delete appData[k]; });
      updateView(); syncToServer();
      showToast(targets.length + "コマを元に戻しました", true);
    }

    // この日の記入を全部消す
    function dayClearAll() {
      const dIdx = dayMenuIndex;
      closeDayMenu();
      uiConfirm('この日の予定をすべて削除します。\n\n' +
                '行事・朝・授業・業間・昼・連絡・メモが、この日だけ全部消えます。\n' +
                'すぐあとなら「元に戻す」で戻せます。', function(ok) {
        if (!ok) return;
        pushUndo('この日の予定をすべて削除', dayKeys(dIdx));
        let n = 0;
        ALL_PERIODS.forEach(function(p) {
          const k = getDataKey(dIdx, p);
          if (appData[k]) { delete appData[k]; n++; }
        });
        updateView(); syncToServer();
        showToast(n ? "この日の予定を消しました" : "消すものがありませんでした", !!n);
      }, 'すべて削除する');
    }

    // この日から始まる「期間の取り組み」を入れる
    function dayAddPeriod() {
      const d = new Date(currentMonday); d.setDate(d.getDate() + dayMenuIndex);
      closeDayMenu();
      openPeriodModal('', fmtDate(d));
    }

    // 先週の内容を今週に写す
    function copyLastWeek() {
      const last = new Date(currentMonday); last.setDate(last.getDate() - 7);
      const srcKey = function(d, p) {
        const dt = new Date(last); dt.setDate(dt.getDate() + d);
        return fmtDate(dt) + '-' + p;
      };
      let found = 0;
      for (let d = 0; d < 7; d++) {
        ALL_PERIODS.forEach(function(p) { if (appData[srcKey(d, p)]) found++; });
      }
      if (found === 0) { uiAlert("先週には何も入っていません。"); return; }

      uiConfirm('先週（' + (last.getMonth()+1) + '/' + last.getDate() + 'の週）の内容を、今週にまるごと写します。\n\n' +
                '・教科・単元名・連絡・メモ・「授業なし」もそのまま写ります\n' +
                '・今週にすでに入っている内容は上書きされます\n' +
                '・添付ファイルのリンクも引き継がれます', function(ok) {
        if (!ok) return;
        pushUndo('先週から写す', weekKeys());
        let n = 0;
        for (let d = 0; d < 7; d++) {
          if (dayIsOutside(d)) continue;   // 年度の外には写さない
          ALL_PERIODS.forEach(function(p) {
            const src = appData[srcKey(d, p)];
            const dst = getDataKey(d, p);
            if (!src) { delete appData[dst]; return; }
            const copy = JSON.parse(JSON.stringify(src));
            if (copy.attachments) {
              copy.attachments.forEach(function(a) { a.id = Date.now() + Math.random(); });
            }
            appData[dst] = copy;
            n++;
          });
        }
        updateView(); syncToServer();
        showToast(n + "コマを先週から写しました", true);
      }, '写す');
    }

    // ===== 先週を横にならべる =====
    // 左に前の週を出し、右はいつもの週案の表そのもの。
    // 右はふだんどおり書きかえられるので、前の週を見ながら今週を組める。

    let compareOn = false;
    let prevOffset = 1;   // 何週前を左に出すか

    // 左側には ToDo か「先週と比べる」のどちらか片方を出す（setSidePanel）
    function toggleCompare() { setSidePanel('compare'); }

    function prevShift(delta) {
      const n = prevOffset + delta;
      if (n < 1) { showToast('1週前より後ろは、右の表そのものです'); return; }
      if (n > 8) { showToast('さかのぼれるのは8週前までです'); return; }
      prevOffset = n;
      renderPrevPanel();
    }

    // 前の週の表を作る。単元名・連絡・メモまで、切らずに全部出す。
    function prevWeekTable(monday) {
      const days = ["月", "火", "水", "木", "金", "土", "日"];
      const cols = showWeekend ? 7 : 5;
      // 右の表と同じ並び。中身が空の帯（朝・業間・昼）は出さずに詰める。
      // メモは自分用の欄なので、見くらべには出さない（縦に長くなるのを防ぐため）
      const rows = ['gyoji', 'renraku', 'morning', '1', '2', 'kangyou', '3', '4', 'hiru', '5', '6'];

      const hasAny = function(p) {
        for (let i = 0; i < cols; i++) {
          const d = new Date(monday); d.setDate(d.getDate() + i);
          const v = appData[fmtDate(d) + '-' + p];
          if (v && (v.disabled || !rtEmpty(v.record) || getSlots(v).some(function(s) { return s.subject || !rtEmpty(s.unit); }))) return true;
        }
        return false;
      };

      let head = '<tr><th class="pv-p"></th>';
      for (let i = 0; i < cols; i++) {
        const d = new Date(monday); d.setDate(d.getDate() + i);
        head += '<th>' + days[i] + '<br>' + (d.getMonth() + 1) + '/' + d.getDate() + '</th>';
      }
      head += '</tr>';

      // 期間の取り組みの矢印も、行事の段に出す
      const pl = periodLayout(monday, Array.apply(null, Array(cols)).map(function(_, i) { return i; }));

      let body = '';
      rows.forEach(function(p) {
        const row = getRow(p);
        const isNote = (row.type === 'memo');
        // 記入のない帯（朝・業間・昼）は省いて、縦に間のびしないようにする
        if (isNote && !hasAny(p) && !(p === 'gyoji' && pl.lanes)) return;

        const cls = (p === 'gyoji') ? ' class="pv-event"' : (isNote ? ' class="pv-note"' : '');
        body += '<tr' + cls + '><th class="pv-p">' + row.label + '</th>';
        for (let i = 0; i < cols; i++) {
          const d = new Date(monday); d.setDate(d.getDate() + i);
          const ds = fmtDate(d);
          if (isOutsideFiscalYear(ds)) { body += '<td class="pv-out"></td>'; continue; }
          const data = appData[ds + '-' + p];
          const bars = (p === 'gyoji') ? periodBarsHTML(pl, i, true) : '';

          if (!data) { body += '<td>' + bars + '</td>'; continue; }
          if (data.disabled) { body += '<td class="pv-off">授業なし</td>'; continue; }

          if (isNote) {
            body += '<td>' + bars + (rtEmpty(data.record) ? '' : rtRender(data.record)) + '</td>';
            continue;
          }

          // 授業のコマ：教科・単元名・連絡・メモを、切らずに全部出す
          const parts = getSlots(data).filter(function(s) { return s.subject || !rtEmpty(s.unit); });
          let inner = parts.map(function(s, idx) {
            const c = subjectColors[s.subject] || 'color-other';
            return '<span class="' + (idx > 0 ? 'pv-split ' : '') + '">' +
                   (s.subject ? '<span class="pv-sub ' + c + '">' + escapeHTML(s.subject) + '</span>' : '') +
                   (rtEmpty(s.unit) ? '' : '<span class="pv-unit">' + rtRender(s.unit) + '</span>') +
                   '</span>';
          }).join('');
          if (!rtEmpty(data.contact)) inner += '<span class="pv-contact">' + rtRender(data.contact) + '</span>';
          if (!rtEmpty(data.record))  inner += '<span class="pv-memo">' + rtRender(data.record) + '</span>';
          body += '<td>' + inner + '</td>';
        }
        body += '</tr>';
      });

      return '<div class="prev-body"><table class="prevtt"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    }

    function weekLabel(monday) {
      const e = new Date(monday); e.setDate(e.getDate() + (showWeekend ? 6 : 4));
      return (monday.getMonth() + 1) + '/' + monday.getDate() + ' 〜 ' + (e.getMonth() + 1) + '/' + e.getDate();
    }

    function renderPrevPanel() {
      const panel = document.getElementById('prevPanel');
      if (!panel) return;
      if (!compareOn) { panel.innerHTML = ''; return; }

      const prev = new Date(currentMonday);
      prev.setDate(prev.getDate() - prevOffset * 7);

      panel.innerHTML =
        '<div class="prev-head">' +
          '<span>' + (prevOffset === 1 ? '前の週' : prevOffset + '週前') + '　' + weekLabel(prev) + '</span>' +
          '<span class="pv-nav">' +
            '<button type="button" onclick="prevShift(1)" title="もう1週さかのぼる">◀</button>' +
            '<button type="button" onclick="prevShift(-1)" title="1週もどす">▶</button>' +
          '</span>' +
        '</div>' +
        prevWeekTable(prev);
    }

    // ===== 年度の切り替え =====
    // 年度を変えるのはここだけ（設定画面の年度欄は表示だけ）。
    // 年度と表示する週を、いつもいっしょに動かすため。

    function openYearModal() {
      renderYearModal();
      document.getElementById('yearModal').style.display = 'flex';
    }
    function closeYearModal() { document.getElementById('yearModal').style.display = 'none'; }

    // その年度に何か入力があるかを調べる（一覧に「記入あり」と出すため）
    function yearHasData(y) {
      const s = y + '-04-01', e = (y + 1) + '-03-31';
      const keys = Object.keys(appData);
      for (let i = 0; i < keys.length; i++) {
        const p = keys[i].split('-');
        if (p.length !== 4) continue;
        const d = p[0] + '-' + p[1] + '-' + p[2];
        if (d >= s && d <= e) return true;
      }
      return false;
    }

    function renderYearModal() {
      const cur = parseInt(appSettings.year, 10) || parseInt(getFiscalYear(new Date()), 10);
      const label = document.getElementById('yearNowLabel');
      if (label) label.innerText = cur;
      const input = document.getElementById('yearInput');
      if (input) input.value = cur;

      // 設定のある年度と、前後の年度を並べる
      const years = {};
      Object.keys(appSettings.configByYear || {}).forEach(function(y) {
        const n = parseInt(y, 10);
        if (n) years[n] = true;
      });
      years[cur] = true; years[cur - 1] = true; years[cur + 1] = true;

      const box = document.getElementById('yearList');
      if (!box) return;
      box.innerHTML = Object.keys(years).map(Number).sort(function(a, b) { return a - b; })
        .map(function(y) {
          const conf = (appSettings.configByYear || {})[String(y)];
          const cls = (y === cur) ? 'year-chip on' : 'year-chip';
          const sub = conf ? (gradeLabel(conf) + (conf.className || '')) : '未設定';
          const mark = yearHasData(y) ? '記入あり' : '空';
          return '<button type="button" class="' + cls + '" data-y="' + y + '" onclick="switchFiscalYear(this.dataset.y)">' +
                 y + '年度<small>' + escapeHTML(sub) + '／' + mark + '</small></button>';
        }).join('');
    }

    function stepYear(delta) {
      const cur = parseInt(appSettings.year, 10) || parseInt(getFiscalYear(new Date()), 10);
      switchFiscalYear(cur + delta);
    }

    function switchYearFromInput() {
      const v = document.getElementById('yearInput').value;
      const y = parseInt(v, 10);
      if (!y || y < 2000 || y > 2100) { uiAlert("年度は西暦で入れてください（例：2027）。"); return; }
      switchFiscalYear(y);
    }

    function switchFiscalYear(y) {
      const yStr = String(parseInt(y, 10));
      if (yStr === String(appSettings.year)) { closeYearModal(); return; }

      const isNew = !(appSettings.configByYear && appSettings.configByYear[yStr]);
      const go = function() {
        appSettings.year = yStr;
        ensureSettingsDefaults();

        // その年度の4月1日の週へ
        currentMonday = mondayOf(new Date(parseInt(yStr, 10), 3, 1));

        refreshAllViews();

        renderYearModal();
        closeYearModal();
        syncToServer();
        showToast(yStr + '年度に切り替えました');
        if (isNew) {
          uiAlert(yStr + "年度をはじめました。\n\n" +
                  "週案・時数集計・記録・基本時間割・学期・名簿・単元名は、すべて白紙の状態です。\n" +
                  "まず「設定」で学年・組と学期を入れてください。\n\n" +
                  "前の年度に戻せば、そのときの内容はそのまま残っています。");
        }
      };

      if (isNew) {
        uiConfirm(yStr + "年度をはじめます。\n\n" +
                  "この年度の週案・時数・記録・基本時間割・設定は、すべて白紙から始まります。\n" +
                  "いまの年度の内容が消えることはありません（年度を戻せば元どおり見られます）。\n\n" +
                  "よろしいですか？", function(ok) { if (ok) go(); }, 'はじめる');
      } else {
        go();
      }
    }

    // ===== その年度の範囲 =====
    // 週案は 4月1日 〜 翌年3月31日 まで。それより前・後には動かさない。
    // 別の年度を見るときは、設定の「年度を切り替える」を使う。

    function mondayOf(dt) {
      const d = new Date(dt);
      const w = d.getDay();
      d.setDate(d.getDate() - w + (w === 0 ? -6 : 1));
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function fiscalRange(year) {
      const y = parseInt(year || appSettings.year || getFiscalYear(new Date()), 10);
      return {
        year: y,
        start: new Date(y, 3, 1),          // 4月1日
        end: new Date(y + 1, 2, 31),       // 翌年3月31日
        firstMonday: mondayOf(new Date(y, 3, 1)),
        lastMonday: mondayOf(new Date(y + 1, 2, 31))
      };
    }

    // その日付が、いま見ている年度の外かどうか。
    // 週は月曜はじまりなので、年度の切れ目の週には別の年度の日が混ざる。
    // そこへ書けてしまうと、両方の年度で二重に数えられてしまうため、書けないようにする。
    function isOutsideFiscalYear(dateStr) {
      const r = fiscalRange();
      return (dateStr < fmtDate(r.start) || dateStr > fmtDate(r.end));
    }

    function dayIsOutside(dIdx) {
      const d = new Date(currentMonday); d.setDate(d.getDate() + dIdx);
      return isOutsideFiscalYear(fmtDate(d));
    }

    // その日が属する年度（表示中の年度の外にある日を案内するため）
    function fiscalYearOf(dateStr) {
      const d = new Date(String(dateStr).replace(/-/g, '/'));
      return getFiscalYear(d);
    }

    function noticeLocked(dIdx) {
      const d = new Date(currentMonday); d.setDate(d.getDate() + dIdx);
      const ds = fmtDate(d);
      showToast((d.getMonth() + 1) + '/' + d.getDate() + ' は ' + fiscalYearOf(ds) +
                '年度です。設定の「年度を切り替える」で移ってから入力してください');
    }

    // 年度の外に出ないように、月曜日を範囲内へ収める
    function clampMonday(dt) {
      const r = fiscalRange();
      const m = mondayOf(dt);
      if (isNaN(m.getTime())) return { monday: new Date(r.firstMonday), clamped: 'before' };
      if (m < r.firstMonday) return { monday: new Date(r.firstMonday), clamped: 'before' };
      if (m > r.lastMonday)  return { monday: new Date(r.lastMonday),  clamped: 'after' };
      return { monday: m, clamped: '' };
    }

    function noticeOutOfYear(which) {
      const r = fiscalRange();
      showToast(r.year + '年度は 4月1日〜' + (r.year + 1) + '年3月31日 までです。' +
                (which === 'before' ? '前の年度' : '次の年度') + 'は設定の「年度を切り替える」から');
    }

    function changeWeek(offsetWeeks) {
      const next = new Date(currentMonday);
      next.setDate(next.getDate() + (offsetWeeks * 7));
      const c = clampMonday(next);
      if (c.clamped) { noticeOutOfYear(c.clamped); return; }
      currentMonday = c.monday;
      updateView();
    }

    function jumpToToday() {
      const c = clampMonday(new Date());
      if (c.clamped) {
        showToast('今日は ' + appSettings.year + '年度の外です。年度のはじめを表示します');
      }
      currentMonday = c.monday;
      updateView();
    }
    function jumpToDate(dateStr) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr))) return;
      const c = clampMonday(new Date(String(dateStr).replace(/-/g, '/')));
      if (c.clamped) noticeOutOfYear(c.clamped);
      currentMonday = c.monday;
      updateView();
      closeSearchModal();
    }
    function jumpToSelectedDate() { const val = document.getElementById('jumpDateInput').value; if (val) jumpToDate(val); }

    function triggerFileUpload(mode) { uploadMode = mode; document.getElementById('fileUploadInput').click(); }

    // その場で写真を撮って添付する。
    // スマホ・タブレットではカメラが開く。Chromebook でも内蔵カメラが使える。
    function triggerCamera(mode) {
      uploadMode = mode;
      const cam = document.getElementById('cameraInput');
      const form = document.getElementById('uploadForm');
      if (!cam || !form) return;
      // 送信する項目をカメラ側に切りかえる（同じ名前が2つあると送れないため）
      document.getElementById('fileUploadInput').removeAttribute('name');
      cam.setAttribute('name', 'myFile');
      cam.value = '';
      cam.click();
    }

    function restoreUploadInput() {
      const cam = document.getElementById('cameraInput');
      const fil = document.getElementById('fileUploadInput');
      if (cam) { cam.removeAttribute('name'); cam.value = ''; }
      if (fil) { fil.setAttribute('name', 'myFile'); }
    }

    function handleFileUpload(event) {
      const file = event.target.files[0]; if (!file) return;
      if (!hasGas()) {
        alert("クラウドに接続できないため、ファイルを添付できません。");
        event.target.value = '';
        return;
      }
      showLoading();
      google.script.run
        .withSuccessHandler(onUploadSuccess)
        .withFailureHandler(function(err) {
          hideLoading();
          document.getElementById('fileUploadInput').value = '';
          restoreUploadInput();
          alert("ファイルの添付に失敗しました。\n\n" + ((err && err.message) ? err.message : String(err)));
        })
        .uploadFileFromForm(document.getElementById('uploadForm'));
    }

    function onUploadSuccess(res) {
      hideLoading();
      document.getElementById('fileUploadInput').value = '';
      restoreUploadInput();
      if (!res || res.error) { alert(res && res.error ? res.error : "ファイルの添付に失敗しました。"); return; }
      currentAttachments.push({ id: Date.now(), name: res.name, url: res.url, type: 'file' });
      renderEditorAttachments();
    }

    function addUrlAttachment() {
      uiPrompt("リンクの名前を入力してください", "", function(name) {
        if (!name) return;
        uiPrompt("URLを入力してください（http:// または https:// で始まるもの）", "https://", function(url) {
          if (!url) return;
          if (!safeUrl(url)) { uiAlert("URLは http:// または https:// で始まる必要があります。"); return; }
          currentAttachments.push({ id: Date.now(), name: name, url: url.trim(), type: 'url' });
          renderEditorAttachments();
        });
      });
    }

    function attachmentIcon(type) {
      return type === 'drive' ? 'ドライブ' : (type === 'note' ? '記録' : (type === 'url' ? 'URL' : 'ファイル'));
    }

    // 添付につける名前を変える。
    // ドライブから持ってきたものも、あとから分かりやすい名前にできる。
    // （変わるのは週案の中での呼び名だけで、ドライブ側のファイル名はそのままです）
    function renameAttachment(idx) {
      const att = currentAttachments[idx];
      if (!att) return;
      uiPrompt('この添付の名前を入力してください', att.name || '', function(v) {
        if (v === null || v === undefined) return;
        const name = String(v).trim();
        if (!name) { uiAlert('名前を空にすることはできません。'); return; }
        att.name = name;
        renderEditorAttachments();
      });
    }

    function renderEditorAttachments() {
      const area = document.getElementById(uploadMode === 'note' ? 'noteAttachmentArea' : 'recordAttachmentArea');
      if (!area) return;
      area.innerHTML = '';
      currentAttachments.forEach(function(att, idx) {
        const box = document.createElement('div'); box.className = 'att-editor-box';
        const link = document.createElement('span'); link.className = 'attachment-link';
        link.innerText = attachmentIcon(att.type) + ' ' + att.name;

      const query = document.getElementById('driveSearchInput').value.trim(); if (!query) return;
      const area = document.getElementById('driveSearchResultsArea');
      area.innerHTML = '<p class="empty-msg">さがしています...</p>';
      if (!hasGas()) {
        area.innerHTML = '<p class="empty-msg">クラウドに接続できないため検索できません。</p>';
        return;
      }
      google.script.run
        .withSuccessHandler(function(files) {
          if (files && files.error) { area.innerHTML = '<p class="empty-msg">' + escapeHTML(files.error) + '</p>'; return; }
          if (!files || files.length === 0) { area.innerHTML = '<p class="empty-msg">見つかりませんでした。</p>'; return; }
          area.innerHTML = files.map(function(file) {
            return '<div class="pick-row" data-url="' + escapeHTML(file.url) + '" data-name="' + escapeHTML(file.name) + '" ' +
              'onclick="addDriveAttachment(this.dataset.url, this.dataset.name)">' + escapeHTML(file.name) + '</div>';
          }).join('');
        })
        .withFailureHandler(function(err) {
          area.innerHTML = '<p class="empty-msg">検索に失敗しました：' + escapeHTML((err && err.message) ? err.message : String(err)) + '</p>';
        })
        .searchDriveFiles(query);

    let btIndex = 0;

    function defaultBaseSets() {
      return BT_MARKS.map(function(m) { return { name: '基本時間割' + m, cells: {} }; });
    }

    // 古い1つだけの基本時間割を、複数パターン形式に読み替える
    function getBaseSets(conf) {
      if (!Array.isArray(conf.baseTimetables)) {
        const sets = defaultBaseSets();
        if (conf.baseTimetable && Object.keys(conf.baseTimetable).length) {
          sets[0].cells = Object.assign({}, conf.baseTimetable);
        }
        conf.baseTimetables = sets;
      }
      // 登録できる数を増やしたときは、足りない分を後ろに足すだけにする。
      // 作り直すと、すでに登録してある時間割が消えてしまうため。
      while (conf.baseTimetables.length < BT_COUNT) {
        conf.baseTimetables.push({ name: '基本時間割' + BT_MARKS[conf.baseTimetables.length], cells: {} });
      }
      if (conf.baseTimetables.length > BT_COUNT) conf.baseTimetables.length = BT_COUNT;
      conf.baseTimetables.forEach(function(x, i) {
        if (!x.cells) x.cells = {};
        if (!x.name) x.name = '基本時間割' + BT_MARKS[i];
      });
      return conf.baseTimetables;
    }
