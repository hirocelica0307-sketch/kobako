    function toggleWeekend() {
      showWeekend = !showWeekend;
      applyColumnDisplay();
      updateView();   // 期間の矢印は、見えている曜日で描き直す
    }


    // ===== 時数集計 =====

    function openSummaryModal() { calculateTotalHours(); document.getElementById('summaryModal').style.display = 'flex'; }
    function closeSummaryModal() { document.getElementById('summaryModal').style.display = 'none'; }

    // 「書写」「図書」は国語として数えるなど、集計上のまとめ先を返す
    function countAsSubject(sub) {
      if (!sub) return "";
      const renamed = renameSubject(sub);
      return COUNT_AS[renamed] || renamed;
    }

    // 授業のある週を数える。休業期間だけの週と、祝日しかない週は数えない。
    function countSchoolWeeks(fromMonday, toDate) {
      if (!fromMonday || !toDate || fromMonday > toDate) return 0;
      let n = 0;
      const cur = new Date(fromMonday);
      while (cur <= toDate && n < 80) {
        let hasSchoolDay = false;
        for (let i = 0; i < 5; i++) {
          const d = new Date(cur); d.setDate(d.getDate() + i);
          if (d > toDate) break;
          const ds = fmtDate(d);
          if (!getHolidayPeriodName(ds) && !holidaysData[ds]) { hasSchoolDay = true; break; }
        }
        if (hasSchoolDay) n++;
        cur.setDate(cur.getDate() + 7);
      }
      return n;
    }

    function toDateOrNull(s) {
      if (!s) return null;
      const d = new Date(String(s).replace(/-/g, '/'));
      return isNaN(d.getTime()) ? null : d;
    }

    function calculateTotalHours() {
      const conf = getConfig();
      const year = appSettings.year || getFiscalYear(new Date());
      const yearNum = parseInt(year, 10);
      const yearStart = yearNum + '-04-01';
      const yearEnd = (yearNum + 1) + '-03-31';
      const displayGrade = document.getElementById('summaryGradeDisplay');
      if (displayGrade) { displayGrade.innerText = year + '年度 ' + gradeLabel(conf); }

      const standard = Object.assign({}, standardHoursData[conf.grade] || standardHoursData["5"]);
      standard["学活"] = gakkatsuStandard[conf.grade] || 35;

      const displaySubs = gradeSubjects().concat(["学活", "委員会", "クラブ", "行事", "その他"]);
      const zero = function() { return { term1: 0, term2: 0, term3: 0, auto: 0, upto: 0, weekly: 0, monthly: 0 }; };
      const totals = {};
      // upto = 表示している週の終わりまでの実績。着地見込みの計算だけに使う。
      displaySubs.forEach(function(sub) { totals[sub] = zero(); });
      // いまの学年にない教科（学年を変える前に入れた分など）も、数からこぼさない
      const extraSubs = [];

      const thisMon = new Date(currentMonday); const thisSun = new Date(currentMonday); thisSun.setDate(thisMon.getDate() + 6);
      const monStr = fmtDate(thisMon);
      const sunStr = fmtDate(thisSun);
      // 画面に出している週の「月曜日」がある月を、その月として数える
      const monthKey = currentMonday.getFullYear() + '-' + String(currentMonday.getMonth()+1).padStart(2,'0');
      const monthLabel = (currentMonday.getMonth() + 1) + '月';

      Object.keys(appData).forEach(function(key) {
        const parts = key.split('-'); if (parts.length !== 4) return;
        const dateStr = parts[0] + '-' + parts[1] + '-' + parts[2];
        const period = parts[3];
        if (dateStr < yearStart || dateStr > yearEnd) return;
        if (LESSON_PERIODS.indexOf(period) === -1) return;

        const term = getTerm(dateStr);
        const inThisWeek = (dateStr >= monStr && dateStr <= sunStr);
        const inThisMonth = (dateStr.slice(0, 7) === monthKey);
        getSlots(appData[key]).forEach(function(s) {
          if (!s.subject) return;
          const sub = countAsSubject(s.subject);
          if (!totals[sub]) { totals[sub] = zero(); extraSubs.push(sub); }
          totals[sub].auto += s.weight;
          if (dateStr <= sunStr) totals[sub].upto += s.weight;
          if (term !== 'other') totals[sub][term] += s.weight;
          if (inThisWeek) totals[sub].weekly += s.weight;
          if (inThisMonth) totals[sub].monthly += s.weight;
        });
      });
      const allSubs = displaySubs.concat(extraSubs);

      // ===== 見通しのもとになる週数 =====
      // 経過 = 年度のはじめから今週まで／残り = 来週から最後の学期の終わりまで
      const yStart = toDateOrNull(conf.t1Start) || new Date(yearNum, 3, 1);
      const yEnd   = toDateOrNull(conf[lastTermKey(conf) === 'term2' ? 't2End' : 't3End']) || new Date(yearNum + 1, 2, 31);
      const startMon = new Date(yStart);
      startMon.setDate(startMon.getDate() - ((startMon.getDay() + 6) % 7));   // その週の月曜へ
      const nextMon = new Date(currentMonday); nextMon.setDate(nextMon.getDate() + 7);

      const weeksDone = Math.max(1, countSchoolWeeks(startMon, new Date(Math.min(currentMonday.getTime() + 6 * 86400000, yEnd.getTime()))));
      const weeksLeft = countSchoolWeeks(nextMon, yEnd);

      const adj = getAdjust(year);
      const fH = function(n) { return (!n) ? "0" : (Math.abs(n - Math.round(n)) < 0.05) ? Math.round(n).toString() : n.toFixed(1); };
      const fS = function(n) {   // 符号つき
        if (Math.abs(n) < 0.05) return '±0';
        return (n > 0 ? '+' : '−') + fH(Math.abs(n));
      };
      const colCount = 9 + termKeys(conf).length;

      // 1教科ぶんの見通しを作る
      // total = 年間合計（入力ずみ全部＋調整）／upto = 表示している週までの実績（調整は入れない）
      // 着地見込みは upto のペースで計算する。先の週に入力ずみでも、
      // 「今日の時点でどうか」を見たいため、その分は数に入れない。
      // 調整（前の学年からの引き継ぎなど）は1回きりの数なので、着地見込みにそのまま足すだけにして、
      // 週あたりのペースには入れない。入れると、毎週その分ずつ増えるように見えてしまう。
      const forecastCells = function(total, upto, adjust, std) {
        if (!std) return '<td class="fc">-</td><td class="fc">-</td><td class="fc">-</td>';
        const left = std - total;
        const pace = upto / weeksDone;
        const landing = upto + adjust + pace * weeksLeft;
        const gap = landing - std;
        const cls = (gap < -0.5) ? 'fc short' : 'fc enough';

        // あと何週で標準時数に届くか。いまのペースで残りを割る。
        let needCell;
        if (left <= 0) {
          needCell = '<td class="fc enough">達成</td>';
        } else if (pace <= 0) {
          needCell = '<td class="fc short">—<small>まだ実績なし</small></td>';
        } else {
          const needWeeks = left / pace;
          const nCls = (needWeeks > weeksLeft + 0.05) ? 'fc short' : 'fc enough';
          const note = (needWeeks > weeksLeft + 0.05)
            ? ('残り' + weeksLeft + '週では不足')
            : ('残り' + weeksLeft + '週で足りる');
          needCell = '<td class="' + nCls + '">あと' + needWeeks.toFixed(1) + '週<small>' + note + '</small></td>';
        }

        return '<td class="fc">' + (left > 0 ? fH(left) : '達成') + '</td>' +
               needCell +
               '<td class="' + cls + '">' + fH(landing) + '<small>' + fS(gap) + '</small></td>';
      };

      let html = '<thead><tr><th>教科</th><th>今週</th><th>' + monthLabel + '</th>';
      termKeys(conf).forEach(function(tk) { html += '<th>' + termName(tk, conf) + '</th>'; });
      html += '<th>自動集計</th><th>調整</th><th>年間合計 ／ 標準</th>';
      html += '<th>残り</th><th>あと<br>何週</th><th>着地見込み</th></tr></thead><tbody>';

      allSubs.forEach(function(sub) {
        const t = totals[sub];
        const a = Number(adj[sub]) || 0;
        const total = t.auto + a;
        const std = standard[sub];
        const isExtra = extraSubs.indexOf(sub) !== -1;
        let bar = '';
        if (std) {
          const ratio = Math.max(0, Math.min(total / std, 1));
          bar = '<div class="bar"><i class="' + (total > std ? 'over' : '') + '" style="width:' + Math.round(ratio * 100) + '%;"></i></div>';
        }
        html += '<tr><td class="sub-name">' + escapeHTML(sub) +
                (isExtra ? '<small>この学年の教科ではありません</small>' : '') + '</td>' +
                '<td class="wk">' + fH(t.weekly) + '</td>' +
                '<td class="mo">' + fH(t.monthly) + '</td>';
        termKeys(conf).forEach(function(tk) { html += '<td>' + fH(t[tk]) + '</td>'; });
        html += '<td>' + fH(t.auto) + '</td>' +
                '<td><input type="number" step="0.1" class="adj-input" value="' + (a || '') + '" placeholder="0" ' +
                'data-sub="' + escapeHTML(sub) + '" onchange="setAdjust(this.dataset.sub, this.value)"></td>' +
                '<td class="total">' + fH(total) + (std ? ' / ' + std : ' / -') + bar + '</td>' +
                forecastCells(total, t.upto, a, std) + '</tr>';
      });

      // 総授業時数の行（学習指導要領の定めと比べる）
      let sumWeekly = 0, sumMonthly = 0, sumAuto = 0, sumUpto = 0, sumAdj = 0;
      const sumTerm = { term1: 0, term2: 0, term3: 0 };
      allSubs.forEach(function(sub) {
        const t = totals[sub];
        sumWeekly += t.weekly; sumMonthly += t.monthly;
        TERM_KEYS.forEach(function(tk) { sumTerm[tk] += t[tk]; });
        sumAuto += t.auto; sumUpto += t.upto; sumAdj += (Number(adj[sub]) || 0);
      });
      const grandTotal = sumAuto + sumAdj;
      const totalStd = TOTAL_STANDARD[conf.grade] || 1015;
      const totalRatio = Math.max(0, Math.min(grandTotal / totalStd, 1));
      html += '<tr class="grand"><td class="sub-name">総授業時数</td>' +
              '<td class="wk">' + fH(sumWeekly) + '</td>' +
              '<td class="mo">' + fH(sumMonthly) + '</td>';
      termKeys(conf).forEach(function(tk) { html += '<td>' + fH(sumTerm[tk]) + '</td>'; });
      html += '<td>' + fH(sumAuto) + '</td><td>' + (sumAdj ? fH(sumAdj) : '—') + '</td>' +
              '<td class="total">' + fH(grandTotal) + ' / ' + totalStd +
              '<div class="bar"><i class="' + (grandTotal > totalStd ? 'over' : '') + '" style="width:' + Math.round(totalRatio * 100) + '%;"></i></div></td>' +
              forecastCells(grandTotal, sumUpto, sumAdj, totalStd) + '</tr>';

      html += '</tbody><tfoot><tr><td colspan="' + colCount + '">' +
              '標準時数は小学校学習指導要領（平成29年告示）別表第1にもとづき、設定した学年に合わせて自動で切り替わります。' +
              (conf.grade ? conf.grade + '年の総授業時数は' + totalStd + '時間です。' : '学年が未設定のため、5年の標準時数で表示しています。') +
              '1コマを分けたときは、2分割なら0.5＋0.5、3分割なら0.3＋0.3＋0.4として数えます。' +
              '「書写」「図書」は国語に合算します。' +
              '「学活」は学級活動の標準時数（' + (gakkatsuStandard[conf.grade] || 35) + '時間）と比べています。' +
              '委員会・クラブ・行事は個別の標準時数の定めがないため「-」ですが、総授業時数には含まれます。' +
              (extraSubs.length ? 'いまの学年にない教科（' + escapeHTML(extraSubs.join('・')) + '）も、表の下のほうに出して総授業時数に含めています。' : '') +
              '「今週」「' + monthLabel + '」は、いま画面に出している週をもとにした数です（週をめくると変わります）。' +
              '年間合計＝自動集計＋調整。調整はこの年度だけに残ります。' +
              '<br><b>見通しについて</b>：' +
              '「残り」は標準時数に足りない分です（入力ずみの年間合計との差）。' +
              '「あと何週」は、その残りを<b>いまの週あたりのペース</b>で割った数で、' +
              'あと何週ぶん授業をすれば標準時数に届くかを表します。' +
              '年度末までの残り週数（' + weeksLeft + '週）でおさまれば緑、はみ出すときは橙色になります。' +
              '「着地見込み」は、<b>いま画面に出している週の終わりまで</b>に入力された分だけを実績とみなし、' +
              'そのペースが続いたときの年度末の合計です。' +
              'さらに先の週に入力ずみの分は、着地見込みには入れていません' +
              '（「今日の時点でどうか」を見るための数だからです）。' +
              '「調整」の数は着地見込みにそのまま足しますが、週あたりのペースには入れていません。' +
              'ここまでの授業のある週を' + weeksDone + '週、来週から' + termName(lastTermKey(conf), conf) + 'の終わりまでを' + weeksLeft + '週として計算しています' +
              '（休業期間だけの週と祝日しかない週は数えていません）。' +
              'かっこの中は標準時数との差で、足りない見込みのときは橙色になります。' +
              '</td></tr></tfoot>';
      document.getElementById('summaryTableElement').innerHTML = html;
    }

    function setAdjust(sub, value) {
      const year = appSettings.year || getFiscalYear(new Date());
      const adj = getAdjust(year);
      const num = parseFloat(value);
      if (!value || isNaN(num) || num === 0) { delete adj[sub]; } else { adj[sub] = num; }
      calculateTotalHours();
      syncToServer();
    }

    function resetAllAdjust() {
      const year = appSettings.year || getFiscalYear(new Date());
      const adj = getAdjust(year);
      if (Object.keys(adj).length === 0) { uiAlert("調整はまだ入力されていません。"); return; }
      uiConfirm(year + "年度の「調整」をすべて0に戻します。\n自動集計の数字はそのままです。よろしいですか？", function(ok) {
        if (!ok) return;
        appSettings.adjustByYear[year] = {};
        calculateTotalHours();
        syncToServer();
        showToast("調整をすべて戻しました");
      }, '戻す');
    }

    // ===== バックアップ =====

    function buildBackupPayload() { return JSON.stringify({ settings: appSettings, data: appData, notes: appNotes }, null, 2); }

    function backupStamp() {
      const now = new Date();
      return now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') +
             '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
    }

    function showBackupAsText(payload) {
      const win = window.open('', '_blank');
      if (!win) { alert("別画面を開けませんでした。ブラウザのポップアップブロックを解除してからもう一度お試しください。"); return; }
      win.document.write(
        '<html><head><meta charset="UTF-8"><title>バックアップ</title></head><body style="font-family:sans-serif; padding:16px;">' +
        '<h3>バックアップの内容</h3>' +
        '<p>下の枠の中をすべて選択してコピーし、テキストエディタに貼り付けて「週案バックアップ_' + backupStamp() + '.json」という名前で保存してください。</p>' +
        '<textarea style="width:100%; height:70vh; font-family:monospace; font-size:12px;"></textarea>' +
        '</body></html>'
      );
      win.document.close();
      const ta = win.document.querySelector('textarea');
      if (ta) { ta.value = payload; ta.focus(); ta.select(); }
    }

    // payload・名前を渡すと、その内容を書き出す（端末の下書きの書き出しに使う）。after は書き出したあとに呼ぶ。
    function exportBackup(payloadArg, prefix, after) {
      const payload = (typeof payloadArg === 'string') ? payloadArg : buildBackupPayload();
      try {
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (prefix || '週案バックアップ_') + backupStamp() + '.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        setTimeout(function() {
          uiConfirm("ファイルの保存画面が出ましたか？", function(ok) {
            if (!ok) showBackupAsText(payload);
            if (after) after();
          }, 'はい、出ました', 'いいえ、画面に出して');
        }, 1200);
      } catch (e) {
        showBackupAsText(payload);
        if (after) after();
      }
    }

    // 読み込んだ内容を、そのまま画面に出す。
    // いまの内容と混ぜると、どちらの予定か分からなくなるため統合はしない。
    function applyImportedBackup(obj, label) {
      // 戻せるように、入れ替える前の状態をまるごと控えておく
      pushUndoFull(label || 'バックアップの読み込み');

      // --- 週案 ---
      Object.keys(appData).forEach(function(k) { delete appData[k]; });
      if (obj.data && typeof obj.data === 'object') {
        Object.assign(appData, JSON.parse(JSON.stringify(obj.data)));
      }

      // --- 記録 ---
      appNotes.length = 0;
      if (obj.notes && Array.isArray(obj.notes)) {
        JSON.parse(JSON.stringify(obj.notes)).forEach(function(n) { appNotes.push(n); });
      }

      // --- 設定 ---
      // 単元名・名簿・タグなども含めて、ファイルの中身をそのまま入れる。
      Object.keys(appSettings).forEach(function(k) { delete appSettings[k]; });
      if (obj.settings && typeof obj.settings === 'object') {
        Object.assign(appSettings, JSON.parse(JSON.stringify(obj.settings)));
      }

      dropBadKeys();
      ensureSettingsDefaults();
      migrateOldData();
      migrateNotesToTags();
      normalizeNotes();
      cleanPeriods();
      migrateNoteTodos();
      cleanTodos();
      removeAutoHolidayNames();

      // 本人が「置きかえる」と決めた読み込みなので、件数が減っても確認はしない
      shrinkApproved = true;

      // --- 画面を作り直す ---
      refreshAllViews();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        let obj = null;
        try {
          obj = JSON.parse(e.target.result);
          if (!obj || (!obj.data && !obj.settings && !obj.notes)) { throw new Error("このファイルは週案アプリのバックアップではないようです"); }
        } catch (err) {
          event.target.value = '';
          uiAlert("読み込めませんでした：" + err.message + "\n\n書き出したときの .json ファイルをそのまま選んでください。");
          return;
        }
        event.target.value = '';
        uiConfirm("バックアップを読み込みます。\n\n【ご注意】いま画面にある内容は、\nすべてファイルの内容に置きかわります（統合ではありません）。\nよろしいですか？", function(ok) {
          if (!ok) return;
          try {
            applyImportedBackup(obj);
            syncToServer();
            uiAlert("読み込みが完了しました");
          } catch (err2) {
            uiAlert("読み込めませんでした：" + err2.message);
          }
        }, '読み込む');
      };
      reader.readAsText(file, 'utf-8');
    }

    // ===== 自動控えから復元 =====
    // 「直前の控え」と、日付ごとの「毎日の控え」から、戻したい時点をえらぶ。

    const WD_NAMES = ['日','月','火','水','木','金','土'];

    function closeBackupPicker() { document.getElementById('backupPickModal').style.display = 'none'; }

    function restoreFromServerBackup(id, label) {
      if (!hasGas()) { uiAlert("クラウドに接続できないため復元できません。"); return; }

        .withSuccessHandler(function(obj) {

    // ===== 行事のCSV取り込み =====

    let csvPlan = [];   // 取り込む予定の一覧

    function openCsvImport() {
      csvPlan = [];
      document.getElementById('csvFileInput').value = '';
      document.getElementById('csvStep1').style.display = 'block';
      document.getElementById('csvStep2').style.display = 'none';
      document.getElementById('csvRunBtn').style.display = 'none';
      document.getElementById('csvPreview').innerHTML = '';
      document.getElementById('csvSummary').innerHTML = '';
      document.getElementById('csvModal').style.display = 'flex';
    }

    function closeCsvImport() { document.getElementById('csvModal').style.display = 'none'; }

    // 引用符つきのCSVを行と列に分ける
    function parseCsv(text) {
      const rows = [];
      let row = [], field = '', inQuote = false;
      const src = text.replace(/^﻿/, '');   // 先頭のBOMを外す
      for (let i = 0; i < src.length; i++) {
        const c = src[i];
        if (inQuote) {
          if (c === '"') {
            if (src[i + 1] === '"') { field += '"'; i++; }
            else { inQuote = false; }
          } else { field += c; }
          continue;
        }
        if (c === '"') { inQuote = true; continue; }
        if (c === ',') { row.push(field); field = ''; continue; }
        if (c === '\r') { continue; }
        if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; continue; }
        field += c;
      }
      row.push(field);
      rows.push(row);
      return rows.filter(function(r) { return r.some(function(x) { return String(x).trim() !== ''; }); });
    }

    // いろいろな書き方の日付を YYYY-MM-DD にそろえる
    function parseAnyDate(raw) {
      const t = String(raw || '').trim();
      if (!t) return null;
      let m;

      // 2026年5月6日
      m = t.match(/^(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/);
      if (m) return mkDate(m[1], m[2], m[3]);

      // 2026-05-06 / 2026/5/6 / 2026.5.6
      m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
      if (m) return mkDate(m[1], m[2], m[3]);

      // 5/6/2026（月/日/年。ただし最初が13以上なら日/月/年とみなす）
      m = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
      if (m) {
        const a = parseInt(m[1], 10), b = parseInt(m[2], 10);
        return (a > 12) ? mkDate(m[3], b, a) : mkDate(m[3], a, b);
      }

      // 5/6（年がない場合は、いま設定している年度から見当をつける）
      m = t.match(/^(\d{1,2})[-\/.](\d{1,2})\s*$/);
      if (m) {
        const fy = parseInt(appSettings.year || getFiscalYear(new Date()), 10);
        const mo = parseInt(m[1], 10);
        const yr = (mo >= 4) ? fy : fy + 1;
        return mkDate(yr, mo, m[2]);
      }
      return null;
    }

    function mkDate(y, m, d) {
      const yy = parseInt(y, 10), mm = parseInt(m, 10), dd = parseInt(d, 10);
      if (!yy || !mm || !dd || mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
      const dt = new Date(yy, mm - 1, dd);
      if (dt.getFullYear() !== yy || dt.getMonth() !== mm - 1 || dt.getDate() !== dd) return null;
      return fmtDate(dt);
    }

    // 時刻を 15:00 の形にそろえる（午後3:00 や 3:00 PM にも対応）
    function parseAnyTime(raw) {
      const t = String(raw || '').trim();
      if (!t) return '';
      let m = t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?/);
      if (!m) {
        m = t.match(/^(午前|午後)\s*(\d{1,2}):(\d{2})/);
        if (!m) return '';
        let h = parseInt(m[2], 10);
        if (m[1] === '午後' && h < 12) h += 12;
        return String(h).padStart(2, '0') + ':' + m[3];
      }
      let h = parseInt(m[1], 10);
      const ap = (m[3] || '').toUpperCase();
      if (ap === 'PM' && h < 12) h += 12;
      if (ap === 'AM' && h === 12) h = 0;
      return String(h).padStart(2, '0') + ':' + m[2];
    }

    // 見出しの行から、どの列が何かを探す
    function findColumns(header) {
      const norm = header.map(function(h) { return String(h || '').trim().toLowerCase().replace(/\s+/g, ''); });
      const find = function(cands) {
        for (let i = 0; i < norm.length; i++) {
          for (let j = 0; j < cands.length; j++) {
            if (norm[i] === cands[j]) return i;
          }
        }
        for (let i = 0; i < norm.length; i++) {
          for (let j = 0; j < cands.length; j++) {
            if (norm[i].indexOf(cands[j]) !== -1) return i;
          }
        }
        return -1;
      };
      return {
        title: find(['subject', '件名', 'タイトル', '行事', '予定', '内容', '行事名', 'title', 'summary']),
        start: find(['startdate', '開始日', '日付', '年月日', '開始', 'date']),
        end:   find(['enddate', '終了日', '終了']),
        stime: find(['starttime', '開始時刻', '開始時間', 'time', '時刻'])
      };
    }

    // CSVを作ってもらうための文を、そのままコピーできるようにする
    function copyCsvPrompt() {
      const box = document.getElementById('csvPromptBox');
      if (!box) return;
      const text = box.innerText;
      const done = function() { showToast("コピーしました。Geminiなどにそのまま貼り付けてください"); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function() { selectCsvPrompt(); });
      } else {
        selectCsvPrompt();
      }
    }

    // コピーできない環境では、文を選んだ状態にして手でコピーしてもらう
    function selectCsvPrompt() {
      const box = document.getElementById('csvPromptBox');
      if (!box) return;
      const range = document.createRange();
      range.selectNodeContents(box);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      showToast("文を選びました。Ctrl+C でコピーしてください");
    }

    function readCsvFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try { buildCsvPlan(String(e.target.result)); }
        catch (err) { uiAlert("読みこめませんでした：\n" + err.message); }
      };
      reader.onerror = function() { uiAlert("ファイルを読めませんでした。"); };
      reader.readAsText(file, 'utf-8');
    }

    // 取り込む内容を組み立てて、確認の一覧を出す
    function buildCsvPlan(text) {
      const rows = parseCsv(text);
      if (rows.length === 0) { uiAlert("中身が空のようです。"); return; }

      let col = findColumns(rows[0]);
      let startRow = 1;

      // 見出しが見つからないときは、日付らしい列と文字の列を探す
      if (col.start === -1 || col.title === -1) {
        const guess = { title: -1, start: -1, end: -1, stime: -1 };
        for (let i = 0; i < rows[0].length; i++) {
          if (guess.start === -1 && parseAnyDate(rows[0][i])) guess.start = i;
        }
        if (guess.start !== -1) {
          for (let i = 0; i < rows[0].length; i++) {
            if (i !== guess.start && String(rows[0][i] || '').trim()) { guess.title = i; break; }
          }
          col = guess;
          startRow = 0;   // 見出しがないので1行目から読む
        }
      }

      if (col.start === -1 || col.title === -1) {
        uiAlert("「件名」と「開始日」にあたる列が見つかりませんでした。\n\n" +
                "1行目に見出し（件名, 開始日 など）があるか確かめてください。");
        return;
      }

      const withTime = document.getElementById('csvWithTime').checked;
      const multiEl = document.querySelector('input[name="csvMulti"]:checked');
      const multiMode = multiEl ? multiEl.value : 'arrow';   // arrow=矢印 / each=全部の日 / first=初日だけ
      const useWeekend = document.getElementById('csvWeekend').checked;

      const plan = [];
      const seen = {};
      let skippedNoDate = 0, skippedWeekend = 0;

      for (let r = startRow; r < rows.length; r++) {
        const cells = rows[r];
        const title = String(cells[col.title] || '').replace(/\s*[\r\n]+\s*/g, ' ').trim();
        if (!title) continue;

        const sd = parseAnyDate(cells[col.start]);
        if (!sd) { skippedNoDate++; continue; }

        let ed = (col.end !== -1) ? parseAnyDate(cells[col.end]) : null;
        if (!ed || ed < sd || multiMode === 'first') ed = sd;

        const tm = (withTime && col.stime !== -1) ? parseAnyTime(cells[col.stime]) : '';
        const label = tm ? (tm + ' ' + title) : title;

        // 何日かにまたがる行事は、期間の取り組み（矢印）として入れる
        if (multiMode === 'arrow' && ed > sd) {
          const fy = parseInt(getFiscalYear(new Date(sd.replace(/-/g, '/'))), 10);
          const yEnd = (fy + 1) + '-03-31';
          const pEnd = ed > yEnd ? yEnd : ed;
          const pkey = 'P' + sd + '\u0000' + pEnd + '\u0000' + title;
          if (!seen[pkey]) {
            seen[pkey] = true;
            plan.push({ kind: 'period', date: sd, end: pEnd, text: title, wd: new Date(sd.replace(/-/g, '/')).getDay() });
          }
          continue;
        }

        // 開始日から終了日まで、1日ずつ
        let cur = new Date(sd.replace(/-/g, '/'));
        const last = new Date(ed.replace(/-/g, '/'));
        let guard = 0;
        while (cur <= last && guard < 400) {
          guard++;
          const ds = fmtDate(cur);
          const wd = cur.getDay();
          if (!useWeekend && (wd === 0 || wd === 6)) { skippedWeekend++; }
          else {
            const key = ds + '\u0000' + label;
            if (!seen[key]) { seen[key] = true; plan.push({ date: ds, text: label, wd: wd, dest: 'gyoji' }); }
          }
          cur.setDate(cur.getDate() + 1);
        }
      }

      // すでに同じ行事が入っていないか調べる（<br>で区切られた行も見る）
      plan.forEach(function(item) {
        item.dup = csvItemDup(item);
        item.on = !item.dup;   // 取り込むかどうか（一覧のチェックで変えられる）
      });

      plan.sort(function(a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
      csvPlan = plan;
      renderCsvPreview(skippedNoDate, skippedWeekend);
    }

    // その日の行事欄に入っている内容を、1行ずつの配列にする
    function existingEventLines(dateStr, rowId) {
      const cell = appData[dateStr + '-' + (rowId || 'gyoji')];
      if (!cell || !cell.record) return [];
      const box = inertRoot(rtLooksHTML(cell.record) ? rtSanitize(cell.record) : escapeHTML(cell.record));
      // <br> や段落の切れ目を、改行としてそろえる
      box.innerHTML = box.innerHTML.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p)>/gi, '\n');
      return (box.textContent || '').split(/\n/).map(function(x) { return x.trim(); }).filter(Boolean);
    }

    let csvSkipNote = '';   // 読めなかった行などの知らせ（えらび直しても変わらない）
    let csvSkipArgs = [0, 0];

    // 入れる場所（行事・連絡・メモ）
    const CSV_DESTS = [['gyoji', '行事'], ['renraku', '連絡'], ['memo', 'メモ']];
    function csvDestName(d) { const x = CSV_DESTS.filter(function(v) { return v[0] === d; })[0]; return x ? x[1] : '行事'; }

    // その場所に、同じものがもう入っているか
    function csvItemDup(item) {
      if (item.kind === 'period') return periodExists(item.text, item.date, item.end);
      return existingEventLines(item.date, item.dest || 'gyoji').indexOf(item.text) !== -1;
    }

    // 1件ずつ、入れる場所を変える
    function setCsvDest(i, dest) {
      const x = csvPlan[i];
      if (!x || x.kind === 'period' || !CSV_DESTS.some(function(v) { return v[0] === dest; })) return;
      const wasDup = x.dup;
      x.dest = dest;
      x.dup = csvItemDup(x);
      if (x.dup) x.on = false; else if (wasDup) x.on = true;
      rerenderCsvPreview();
    }

    // チェックしたものを、まとめて同じ場所へ
    function setCsvDestChecked(dest) {
      let n = 0;
      csvPlan.forEach(function(x) {
        if (x.kind === 'period' || !x.on || x.dup) return;
        x.dest = dest;
        x.dup = csvItemDup(x);
        if (x.dup) x.on = false;
        n++;
      });
      rerenderCsvPreview();
      showToast(n ? 'えらんだ ' + n + '件を「' + csvDestName(dest) + '」に入れるようにしました' : '「行事」にできる、えらんだ行事がありません');
    }

    function rerenderCsvPreview() {
      const box = document.getElementById('csvPreview');
      const top = box ? box.scrollTop : 0;
      renderCsvPreview(csvSkipArgs[0], csvSkipArgs[1]);
      if (box) box.scrollTop = top;
    }

    // 読みこんだ一覧を出す。1件ずつチェックで、取り込む・取り込まないをえらべる。
    function renderCsvPreview(skippedNoDate, skippedWeekend) {
      csvSkipArgs = [skippedNoDate || 0, skippedWeekend || 0];
      const dupCount = csvPlan.filter(function(x) { return x.dup; }).length;
      let notes = [];
      if (dupCount) notes.push('同じ行事がすでにある ' + dupCount + '件は、えらべません');
      if (skippedNoDate) notes.push('<span class="warn">日付を読めなかった ' + skippedNoDate + '行はとばしました</span>');
      if (skippedWeekend) notes.push('土日の ' + skippedWeekend + '件はとばしました');
      csvSkipNote = notes.join('／');

      const wdNames = ['日','月','火','水','木','金','土'];
      const box = document.getElementById('csvPreview');
      if (csvPlan.length === 0) {
        box.innerHTML = '<p class="empty-msg">取り込めるものが見つかりませんでした。</p>';
      } else {
        let lastMonth = '';
        box.innerHTML = csvPlan.map(function(x, i) {
          const d = new Date(x.date.replace(/-/g, '/'));
          const cls = (x.wd === 0) ? 'sun' : (x.wd === 6 ? 'sat' : '');
          const isP = (x.kind === 'period');
          const ym = x.date.slice(0, 7);
          const head = (ym !== lastMonth) ? '<div class="csv-month">' + d.getFullYear() + '年' + (d.getMonth() + 1) + '月</div>' : '';
          lastMonth = ym;
          return head + '<label class="csv-row' + (x.dup ? ' skip' : (x.on ? ' on' : '')) + '">' +
            '<input type="checkbox" class="csv-pick" data-i="' + i + '"' + (x.on ? ' checked' : '') + (x.dup ? ' disabled' : '') +
            ' onchange="setCsvPick(' + i + ', this.checked)" aria-label="' + escapeHTML(x.text) + 'を取り込む">' +
            '<span class="d">' + (d.getMonth()+1) + '/' + d.getDate() +
            ' <span class="wd ' + cls + '">(' + wdNames[x.wd] + ')</span>' +
            (isP ? '<br>〜' + mdw(x.end) : '') + '</span>' +
            '<span class="t">' + escapeHTML(x.text) + '</span>' +
            (isP
              ? '<span class="st ' + (x.dup ? 'dup' : 'arrow') + '">' + (x.dup ? '入っています' : '行事に矢印') + '</span>'
              : '<span class="csv-dest" role="group" aria-label="入れる場所">' + CSV_DESTS.map(function(v) {
                  return '<button type="button" class="' + (x.dest === v[0] ? 'on' : '') + '" data-i="' + i + '" data-d="' + v[0] + '" ' +
                         'onclick="event.preventDefault(); event.stopPropagation(); setCsvDest(+this.dataset.i, this.dataset.d)">' + v[1] + '</button>';
                }).join('') + '</span>' +
                (x.dup ? '<span class="st dup">入っています</span>' : '')) +
            '</label>';
        }).join('');
      }

      document.getElementById('csvStep1').style.display = 'none';
      document.getElementById('csvStep2').style.display = 'block';
      renderCsvSummary();
    }

    // えらんだ数と、まとめてえらぶボタン
    function renderCsvSummary() {
      const can = csvPlan.filter(function(x) { return !x.dup; });
      const picked = can.filter(function(x) { return x.on; }).length;

      // 月ごとに、まとめてえらぶ・外すボタン
      const months = [];
      can.forEach(function(x) { const ym = x.date.slice(0, 7); if (months.indexOf(ym) === -1) months.push(ym); });
      const monthBtns = months.map(function(ym) {
        const inMonth = can.filter(function(x) { return x.date.slice(0, 7) === ym; });
        const n = inMonth.filter(function(x) { return x.on; }).length;
        const cls = n === inMonth.length ? ' all' : (n ? ' some' : '');
        return '<button type="button" class="csv-mbtn' + cls + '" data-ym="' + ym + '" onclick="toggleCsvMonth(this.dataset.ym)" ' +
               'title="この月をまとめてえらぶ／外す">' + parseInt(ym.slice(5), 10) + '月 <b>' + n + '/' + inMonth.length + '</b></button>';
      }).join('');

      document.getElementById('csvSummary').innerHTML =
        '<div class="csv-sum-top">' +
          '<span>取り込む行事：<b>' + picked + '</b>件<span class="csv-of"> ／ えらべるもの ' + can.length + '件</span></span>' +
          '<span class="csv-tools">' +
            '<button type="button" class="btn btn-soft btn-sm" onclick="setAllCsvPicks(true)">すべてえらぶ</button>' +
            '<button type="button" class="btn btn-soft btn-sm" onclick="setAllCsvPicks(false)">すべて外す</button>' +
            '<button type="button" class="btn btn-soft btn-sm" onclick="openCsvImport()">ファイルをえらび直す</button>' +
          '</span>' +
        '</div>' +
        (months.length > 1 ? '<div class="csv-months">' + monthBtns + '</div>' : '') +
        '<div class="csv-dest-all"><span>チェックしたものを、まとめて</span>' +
          CSV_DESTS.map(function(v) { return '<button type="button" class="btn btn-soft btn-sm" data-d="' + v[0] + '" onclick="setCsvDestChecked(this.dataset.d)">' + v[1] + 'へ</button>'; }).join('') +
        '</div>' +
        '<div class="csv-hint">取り込まないものは、左のチェックを外してください。右の「行事・連絡・メモ」で、1件ずつ入れる場所をえらべます。</div>' +
        (csvSkipNote ? '<div class="csv-hint">' + csvSkipNote + '</div>' : '');

      const btn = document.getElementById('csvRunBtn');
      btn.style.display = can.length ? 'inline-flex' : 'none';
      btn.disabled = (picked === 0);
      btn.innerText = picked ? 'えらんだ ' + picked + '件を入れる' : '取り込むものをえらんでください';
    }

    function setCsvPick(i, on) {
      const x = csvPlan[i];
      if (!x || x.dup) return;
      x.on = !!on;
      const el = document.querySelector('.csv-pick[data-i="' + i + '"]');
      if (el) { el.checked = x.on; el.closest('.csv-row').classList.toggle('on', x.on); }
      renderCsvSummary();
    }

    function setAllCsvPicks(on) {
      csvPlan.forEach(function(x, i) { if (!x.dup) setCsvPick(i, on); });
    }

    // その月がぜんぶえらばれていれば外す。そうでなければ、ぜんぶえらぶ。
    function toggleCsvMonth(ym) {
      const idx = [];
      csvPlan.forEach(function(x, i) { if (!x.dup && x.date.slice(0, 7) === ym) idx.push(i); });
      const allOn = idx.every(function(i) { return csvPlan[i].on; });
      idx.forEach(function(i) { setCsvPick(i, !allOn); });
    }

    function runCsvImport() {
      const targets = csvPlan.filter(function(x) { return !x.dup && x.on; });
      if (targets.length === 0) { uiAlert('取り込む行事がえらばれていません。\n一覧の左のチェックで、取り込むものをえらんでください。'); return; }

      const byDest = CSV_DESTS.map(function(v) {
        const n = targets.filter(function(x) { return x.kind !== 'period' && (x.dest || 'gyoji') === v[0]; }).length;
        return n ? '・' + v[1] + '：' + n + '件' : '';
      }).filter(Boolean);
      const nP = targets.filter(function(x) { return x.kind === 'period'; }).length;
      if (nP) byDest.push('・行事に矢印：' + nP + '件');
      uiConfirm('えらんだ ' + targets.length + '件を取り込みます。\n（えらばなかったものは入りません）\n\n' + byDest.join('\n') + '\n\n' +
                'すでに書いてある内容は消さずに、下に足します。\n' +
                '「矢印」のものは、期間の取り組みとして始まりから終わりまで矢印で入ります。', function(ok) {
        if (!ok) return;
        let hasWeekend = false;
        let periodCount = 0;
        const destCount = {};
        targets.forEach(function(item) {
          if (item.kind === 'period') {
            const pid = 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e9).toString(36);
            getPeriods(getFiscalYear(new Date(item.date.replace(/-/g, '/'))))[pid] =
              { title: item.text.slice(0, 60), start: item.date, end: item.end, color: 'blue' };
            periodCount++;
            return;
          }
          const key = item.date + '-' + (item.dest || 'gyoji');
          destCount[item.dest || 'gyoji'] = (destCount[item.dest || 'gyoji'] || 0) + 1;
          const cell = appData[key];
          const old = cell ? (cell.record || '') : '';
          const oldHtml = old ? (rtLooksHTML(old) ? old : escapeHTML(old).replace(/\n/g, '<br>')) : '';
          const add = escapeHTML(item.text);
          appData[key] = {
            record: oldHtml ? (oldHtml + '<br>' + add) : add,
            attachments: cell ? (cell.attachments || []) : []
          };
          if (item.wd === 0 || item.wd === 6) hasWeekend = true;
        });
        // 土日に入れたのに列が隠れていると見えないので出しておく
        if (hasWeekend && !showWeekend) { showWeekend = true; applyColumnDisplay(); }
        closeCsvImport();
        closeSettingModal();
        renderPeriodSettingsList();
        updateView();
        syncToServer();
        // 連絡・メモに入れたときは、その行を開いて見えるようにしておく
        ['renraku', 'memo'].forEach(function(r) { if (destCount[r] && rowFolded[r]) toggleFold(r); });
        const parts = CSV_DESTS.filter(function(v) { return destCount[v[0]]; }).map(function(v) { return v[1] + ' ' + destCount[v[0]] + '件'; });
        if (periodCount) parts.push('矢印 ' + periodCount + '件');
        showToast('取り込みました（' + parts.join('・') + '）');
      }, '取り込む');
    }

    function openHelp() {
      const body = document.getElementById('helpBody');
      if (body) body.scrollTop = 0;
      document.getElementById('helpModal').style.display = 'flex';
    }

    function closeHelp() { document.getElementById('helpModal').style.display = 'none'; }

    // ヘルプの中のリンクから、設定のその項目を開く
    function helpGo(section) {
      closeHelp();
      openSettingModal(section);
    }

    // ヘルプの中のリンクから、その画面を開く
    function helpOpen(what) {
      closeHelp();
      if (what === 'year') openYearModal();
      else if (what === 'todo') { if (sidePanel !== 'todo') setSidePanel('todo'); }
      else if (what === 'month') openMonthView();
      else if (what === 'csv') { openSettingModal('set-csv'); openCsvImport(); }
      else if (what === 'summary') openSummaryModal();
      else if (what === 'print') openPrintModal();
    }

    // ヘルプの中の見出しへ移動する
    function helpJump(id) {
      const target = document.getElementById(id);
      const body = document.getElementById('helpBody');
      if (!target || !body) return;
      body.scrollTop = target.offsetTop - body.offsetTop - 6;
    }

    // ===== 設定 =====

    // 設定を開く。section を渡すと、その項目だけを開いてそこまで動く（ヘルプのリンクから使う）
    function openSettingModal(section) {
      const yearEl = document.getElementById('setYear');
      if (yearEl) yearEl.value = appSettings.year;
      changeSettingYear();
      renderDraftStatus();
      document.getElementById('settingModal').style.display = 'flex';
      if (typeof section === 'string' && section) {
        const sec = document.getElementById(section);
        if (sec && sec.tagName === 'DETAILS') {
          sec.open = true;
          setTimeout(function() { sec.scrollIntoView({ block: 'start', behavior: 'smooth' }); sec.classList.add('flash'); }, 60);
          setTimeout(function() { sec.classList.remove('flash'); }, 1600);
        }
      }
    }
    function closeSettingModal() { document.getElementById('settingModal').style.display = 'none'; }

    let unitPickSlot = 1;
    let unitPickSubject = '';
    let unitSetSubject = '';
    let unitSetTerm = 'term1';

    // 設定側：教科タブと入力欄
    function renderUnitSetTabs() {
      const box = document.getElementById('unitSetTabs'); if (!box) return;
      const y = appSettings.year;
      const tks = termKeys();
      if (tks.indexOf(unitSetTerm) === -1) unitSetTerm = 'term1';

      // 学期のタブ
      const tbox = document.getElementById('unitSetTermTabs');
      if (tbox) {
        tbox.innerHTML = tks.map(function(t) {
          const bank = getUnitBank(y, t);
          let n = 0; Object.keys(bank).forEach(function(k) { n += (bank[k] || []).length; });
          return '<button type="button" class="unit-sub-tab' + (t === unitSetTerm ? ' on' : '') + '" ' +
                 'style="' + (t === unitSetTerm ? '' : 'background:#fff;') + '" ' +
                 'data-t="' + t + '" onclick="switchUnitTerm(this.dataset.t)">' +
                 termName(t) + (n ? '（' + n + '）' : '') + '</button>';
        }).join('');
      }

      // 教科のタブ
      const subs = gradeSubjects().concat(EXTRA_SUBJECTS);
      if (!unitSetSubject || subs.indexOf(unitSetSubject) === -1) unitSetSubject = subs[0];
      const bank = getUnitBank(y, unitSetTerm);
      box.innerHTML = subs.map(function(sub) {
        const n = (bank[sub] || []).length;
        return '<button type="button" class="unit-sub-tab' + (sub === unitSetSubject ? ' on' : '') + '" ' +
               'data-s="' + escapeHTML(sub) + '" onclick="switchUnitSet(this.dataset.s)">' +
               escapeHTML(sub) + (n ? '（' + n + '）' : '') + '</button>';
      }).join('');
      const ta = document.getElementById('setUnits');
      if (ta) ta.value = (bank[unitSetSubject] || []).join('\n');
    }

    function switchUnitTerm(t) {
      saveUnitText();
      unitSetTerm = t;
      renderUnitSetTabs();
    }

    function switchUnitSet(sub) {
      saveUnitText();
      unitSetSubject = sub;
      renderUnitSetTabs();
    }

    function saveUnitText() {
      const ta = document.getElementById('setUnits'); if (!ta || !unitSetSubject) return;
      const bank = getUnitBank(appSettings.year, unitSetTerm);
      const list = [];
      ta.value.split(/\r\n|\n|\r/).forEach(function(line) {
        const t = line.trim();
        if (t && list.indexOf(t) === -1) list.push(t);
      });
      if (list.length) bank[unitSetSubject] = list; else delete bank[unitSetSubject];
    }

    function onUnitTextInput() { saveUnitText(); }

    // 入力画面：単元名の候補から選ぶ
    function openUnitPick(idx) {
      unitPickSlot = idx;
      const subIds = { 1:'inputSubject', 2:'inputSubject2', 3:'inputSubject3' };
      const el = document.getElementById(subIds[idx]);
      unitPickSubject = el ? el.value : '';
      if (!unitPickSubject) { uiAlert("先に教科を選択してください。"); return; }
      renderUnitPick();
      document.getElementById('unitPickModal').style.display = 'flex';
    }

    function closeUnitPick() { document.getElementById('unitPickModal').style.display = 'none'; }

    // 登録した単元名を、その学期の分だけ並べる
    function renderUnitPick() {
      const sub = unitPickSubject;
      const y = appSettings.year || getFiscalYear(new Date());
      const term = getTermOfEditingCell();
      const list = (getUnitBank(y, term)[sub] || []).map(function(line) { return parseUnitLine(line).name; }).filter(Boolean);
      const hrs = unitHoursMap(y)[sub] || {};
      buildUnitCounter();
      const progress = function(name) {
        if (!hrs[name]) return '';
        const used = unitCounter.total[sub + '\u0001' + name] || 0;
        return '<span class="un-prog' + (used > hrs[name] + 0.05 ? ' over' : '') + '">' + fmtHour(used) + '/' + fmtHour(hrs[name]) + '時間</span>';
      };

      document.getElementById('unitPickTitle').innerText = '' + sub + ' の単元名';

      const doneCount = list.filter(function(t) { return isUnitDone(y, term, sub, t); }).length;
      const tabs = document.getElementById('unitPickTabs');
      tabs.innerHTML = '<span class="unit-sub-tab on" style="cursor:default;">' + termName(term) + '</span>' +
                       '<span class="unit-sub-tab" style="cursor:default; background:#fff;">' + list.length + '件</span>' +
                       '<span class="unit-sub-tab" style="cursor:default; background:#fff;">済 ' + doneCount + '</span>';

      const box = document.getElementById('unitPickList');
      if (list.length === 0) {
        box.innerHTML = '<p class="empty-msg">' + termName(term) + 'の「' + escapeHTML(sub) + '」は、まだ登録されていません。<br>' +
                        '「設定」の「単元名の登録」から入れておくと、ここから選べます。</p>';
        return;
      }

      // まだ「済」になっていない、いちばん上の単元＝次にやる単元
      const nextUnit = list.filter(function(t) { return !isUnitDone(y, term, sub, t); })[0];
      let html = '';
      if (nextUnit) {
        html += '<div class="unit-next"><span class="un-cap">▶ 次はここ</span>' +
                '<button type="button" class="unit-pick" data-t="' + escapeHTML(nextUnit) + '" ' +
                'onclick="pickUnit(this.dataset.t)"><span>' + escapeHTML(nextUnit) + '</span>' + progress(nextUnit) + '</button></div>';
      } else {
        html += '<div class="unit-next"><span class="un-cap">この学期の「' + escapeHTML(sub) +
                '」は、すべて「済」になっています</span></div>';
      }

      html += list.map(function(t, i) {
        const done = isUnitDone(y, term, sub, t);
        return '<div class="unit-row' + (done ? ' done' : '') + '">' +
          '<button type="button" class="unit-check" title="終わったらチェック" ' +
            'data-sub="' + escapeHTML(sub) + '" data-t="' + escapeHTML(t) + '" ' +
            'onclick="toggleUnitDone(this.dataset.sub, this.dataset.t)">' + (done ? '✓' : '') + '</button>' +
          '<button type="button" class="unit-pick" data-t="' + escapeHTML(t) + '" onclick="pickUnit(this.dataset.t)">' +
            '<span class="no">' + (i + 1) + '</span><span>' + escapeHTML(t) + '</span>' + progress(t) +
            (done ? '<span class="done-badge">済</span>' : '') +
          '</button></div>';
      }).join('');

      box.innerHTML = html;
    }

    // いま開いているコマの日付がどの学期にあたるか
    function getTermOfEditingCell() {
      const d = new Date(currentMonday);
      d.setDate(d.getDate() + (currentEditDayIndex >= 0 ? currentEditDayIndex : 0));
      return nearestTerm(fmtDate(d));
    }

    function pickUnit(text) {
      const unitIds = { 1:'inputUnit', 2:'inputUnit2', 3:'inputUnit3' };
      setRT(unitIds[unitPickSlot], text);
      closeUnitPick();
      showToast("単元名を入れました");
    }

    function copyPreviousUnit(idx) {
      const subIds = { 1: 'inputSubject', 2: 'inputSubject2', 3: 'inputSubject3' };
      const unitIds = { 1: 'inputUnit', 2: 'inputUnit2', 3: 'inputUnit3' };
      const inputEl = document.getElementById(subIds[idx]); if (!inputEl) return;
      const sub = inputEl.value; if (!sub) { uiAlert("先に教科を選択してください。"); return; }
      const keys = Object.keys(appData).sort(function(a, b) { return b.localeCompare(a); });
      const curKey = getDataKey(currentEditDayIndex, currentEditPeriod);
      for (let i = 0; i < keys.length; i++) {
        const k = keys[i];
        if (k >= curKey) continue;
        if (LESSON_PERIODS.indexOf(k.split('-')[3]) === -1) continue;
        const d = appData[k];
        if (!d) continue;
        const found = getSlots(d).find(function(sl) { return sl.subject === sub && !rtEmpty(sl.unit); });
        if (found) { setRT(unitIds[idx], found.unit); return; }
      }
      uiAlert('過去の記録に「' + sub + '」の単元名が見つかりませんでした。');
    }

    // 年度は「年度を切り替える」でだけ変える。ここでは、いま開いている年度の設定を保存する。
    function saveSettings() {
      const y = appSettings.year || getFiscalYear(new Date());
      if (!appSettings.configByYear[y]) appSettings.configByYear[y] = {};
      const c = appSettings.configByYear[y];
      c.grade = document.getElementById('setGrade') ? document.getElementById('setGrade').value : "5";
      c.className = document.getElementById('setClass') ? document.getElementById('setClass').value : "";
      c.termType = selectedTermType();
      c.termNaming = selectedTermNaming();
      const hOff  = document.getElementById('setHolidayOff');  if (hOff)  c.holidayMarkOff  = hOff.checked;
      ['t1Start','t1End','t2Start','t2End','t3Start','t3End','haruStart','haruEnd','natsuStart','natsuEnd','fuyuStart','fuyuEnd'].forEach(function(f) {
        const el = document.getElementById(f); if (el) c[f] = el.value;
      });
      saveUnitText();
      const rosterEl = document.getElementById('setRoster');
      if (rosterEl) {
        getRoster(y).length = 0;
        rosterEl.value.split(/\r\n|\n|\r/).forEach(function(line) {
          const t = line.trim();
          if (t && getRoster(y).indexOf(t) === -1) getRoster(y).push(t);
        });
      }
      readNikkaForm();
      if (nkWork) c.nikka = JSON.parse(JSON.stringify(nkWork));
      saveBtGrid();
      c.baseTimetables = JSON.parse(JSON.stringify(btWork));
      delete c.baseTimetable;
      loadBtGrid();
      const displayClass = document.getElementById('displayClassInfo');
      if (displayClass) displayClass.innerText = classPlateText(y, c);
      updateSubjectDropdown(); updateView();
      renderUnitSetTabs();
      if (document.getElementById('noteFilterBar')) { renderNoteFilters(); }
      // 学年が変わると標準時数も変わるので、集計表を作り直しておく
      if (document.getElementById('summaryTableElement')) { try { calculateTotalHours(); } catch (e) {} }
      closeSettingModal(); syncToServer();
    }

    // いま開いている年度の設定を、設定画面に出す
    function changeSettingYear() {
      const y = appSettings.year;
      const yearEl = document.getElementById('setYear'); if (yearEl) yearEl.value = y;
      const c = appSettings.configByYear[y] || { grade:"5", className:"", termType:"3", baseTimetable:{} };
      const gradeEl = document.getElementById('setGrade'); if (gradeEl) gradeEl.value = c.grade || "";
      const classEl = document.getElementById('setClass'); if (classEl) classEl.value = c.className || "";
      ['t1Start','t1End','t2Start','t2End','t3Start','t3End','haruStart','haruEnd','natsuStart','natsuEnd','fuyuStart','fuyuEnd'].forEach(function(f) {
        const el = document.getElementById(f); if (el) el.value = c[f] || "";
      });
      const hOff  = document.getElementById('setHolidayOff');  if (hOff)  hOff.checked  = (c.holidayMarkOff === true);
      const tt = String(c.termType === '2' ? '2' : '3');
      const ttEl = document.querySelector('input[name="termType"][value="' + tt + '"]');
      if (ttEl) ttEl.checked = true;
      const tn = (String(c.termNaming) === 'gakki') ? 'gakki' : 'zenki';
      const tnEl = document.querySelector('input[name="termNaming"][value="' + tn + '"]');
      if (tnEl) tnEl.checked = true;
      onTermTypeChange();
      const rosterEl = document.getElementById('setRoster');
      if (rosterEl) rosterEl.value = getRoster(y).join('\n');
      unitSetSubject = '';
      renderUnitSetTabs();
      renderPeriodSettingsList();
      nkWork = getNikka(c);
      nkTab = 'normal';
      renderNikkaSettings();
      btWork = JSON.parse(JSON.stringify(getBaseSets(c)));
      btIndex = 0;
      renderBtTabs();
      loadBtGrid();
      const displayClass = document.getElementById('displayClassInfo');
      if (displayClass) displayClass.innerText = classPlateText(y, c);
    }
</script>
