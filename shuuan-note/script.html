    function loadBaseTimetable(index) {
      const sets = getBaseSets(getConfig());
      const set = sets[index];
      if (!set) return;
      const cells = set.cells || {};
      if (Object.keys(cells).filter(function(k) { return cells[k]; }).length === 0) {
        uiAlert('「' + set.name + '」にはまだ何も登録されていません。');
        return;
      }
      closeBaseChooser();
      uiConfirm('今週の「月〜金」「1〜6時間目」を「' + set.name + '」のとおりに作り直します。\n\n' +
                '・基本時間割が空欄のコマは、空欄になります\n' +
                '・「― 授業なし ―」のコマは、授業なしになります\n' +
                '・教科が入っているコマは、その教科だけの状態になります\n\n' +
                '【ご注意】いま入っている単元名・連絡・メモは消えます。\n' +
                'すぐあとなら「元に戻す」で戻せます。', function(ok) {
        if (!ok) return;
        pushUndo('基本時間割の読み込み', weekKeys());
        // 月〜金の1〜6時間目を、基本時間割のとおりに作り直す。
        // 空欄は空欄に、「授業なし」は授業なしに、教科はその教科だけの状態にする。
        for (let d = 0; d < 5; d++) {
          if (dayIsOutside(d)) continue;   // 年度の外には入れない
          for (let p = 1; p <= 6; p++) {
            const val = cells[d + '-' + p];
            const key = getDataKey(d, p);
            if (!val) { delete appData[key]; continue; }
            if (val === BT_OFF) { appData[key] = { disabled: true }; continue; }
            const fresh = blankLesson();

            appData[key] = fresh;

        }

        showToast('「' + set.name + '」を読み込みました', true);
      }, '読み込む');

    function printTimetable(mode) {
      const isH = (mode === 'hiragana');
      // 白黒（くっきり）：線と文字を黒で太めにし、うすい色は使わない。
      // 罫線は0.5pt以上・文字は黒、灰色の地は15%前後までにしておくと、コピーをくり返しても消えにくい。
      const colorEl = document.querySelector('input[name="printColor"]:checked');
      const mono = !colorEl || colorEl.value !== 'color';
      const showUnit = document.getElementById('printUnit').checked;
      const showContact = document.getElementById('printContact').checked;
      const goalEl = document.getElementById('printGoal');
      const goalData = appData[fmtDate(currentMonday) + '-weekgoal'];
      const goalHTML = ((!goalEl || goalEl.checked) && goalData && !rtEmpty(goalData.text)) ? rtRender(goalData.text) : '';

      const hMap = {
        "国語":"こくご","書写":"しょしゃ","図書":"としょ","算数":"さんすう","理科":"りか",
        "社会":"しゃかい","生活":"せいかつ","音楽":"おんがく","図画工作":"ずこう","家庭":"かてい",
        "体育":"たいいく","道徳":"どうとく","総合":"そうごう",
        "外国語活動":"がいこくごかつどう","外国語":"がいこくご",
        "学活":"がっかつ","委員会":"いいんかい","クラブ":"くらぶ","行事":"ぎょうじ","その他":"そのた",
        "朝":"あさ","業間":"ぎょうかん","昼":"ひる","連絡":"れんらく",
        "月":"げつ","火":"か","水":"すい","木":"もく","金":"きん","土":"ど","日":"にち"
      };
      const mt = function(s) { return (isH && hMap[s]) ? hMap[s] : (s || ""); };

      const maxDays = showWeekend ? 7 : 5;
      const isLand = maxDays > 5;
      const days = ["月","火","水","木","金","土","日"];
      const wdFull = ["日","月","火","水","木","金","土"];
      const fmt = function(dt) { return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); };

      // 記入のある行だけを印刷する
      const hasContent = function(period) {
        for (let d = 0; d < maxDays; d++) {
          const data = appData[getDataKey(d, period)];
          if (data && !rtEmpty(data.record)) return true;
        }
        return false;
      };

      const bandHeights = isLand
        ? { gyoji: 9, morning: 7, kangyou: 7, hiru: 7, renraku: 14 }
        : { gyoji: 12, morning: 10, kangyou: 9, hiru: 9, renraku: 19 };

      // 期間の取り組みの矢印。ある週は、行事の段をその分だけ高くする
      const PD_LANE_MM = 4.2;
      const printPl = periodLayout(currentMonday, Array.apply(null, Array(maxDays)).map(function(_, i) { return i; }));
      if (printPl.lanes) bandHeights.gyoji += printPl.lanes * PD_LANE_MM;

      const printRows = [];
      PRINT_ORDER.map(getRow).forEach(function(r) {
        if (!r) return;
        if (!r.print) return;
        if (r.type === 'lesson') { printRows.push(r); return; }
        if (r.id === 'renraku') { if (showContact) printRows.push(r); return; }
        if (hasContent(r.id) || (r.id === 'gyoji' && printPl.lanes)) printRows.push(r);
      });

      const pageH = isLand ? 192 : 279;
      // 「今週の目標」を出すときは、その1行ぶんも差し引く（A4 1枚から溢れさせないため）
      const chrome = (isLand ? 29 : 33) + (goalHTML ? 7 : 0);
      let bandTotal = 0;
      printRows.forEach(function(r) { if (r.type === 'memo') bandTotal += bandHeights[r.id]; });
      let lessonH = (pageH - chrome - bandTotal) / 6;
      lessonH = Math.max(14, Math.min(40, lessonH));

      const colorMap = {
        "国語":["#fdeef1","#a8365a"], "書写":["#ffe4e8","#a8476a"], "図書":["#f6dfe6","#8e4266"],
        "社会":["#fdf2e5","#a5661b"], "算数":["#eaf4fd","#245f92"], "理科":["#eef8e8","#437d27"],
        "生活":["#fbf8e3","#7d7117"], "音楽":["#f9d6f5","#933b8b"], "図画工作":["#ffe9b0","#957011"],
        "家庭":["#fdeef4","#a53463"], "体育":["#ffd6d0","#ad4231"], "道徳":["#ffdcef","#9f366e"],
        "総合":["#e9f6f9","#287488"], "外国語活動":["#f1ecfd","#5e43a2"], "外国語":["#f1ecfd","#5e43a2"],
        "学活":["#ebf1fd","#39599c"], "委員会":["#ebf1fd","#39599c"], "クラブ":["#ebf1fd","#39599c"],
        "行事":["#ffe6c9","#9c5e18"]
      };
      const subColor = function(s) { return colorMap[s] || ["#ebe5d9","#6f6152"]; };

      const pill = function(sub, size, weight) {
        const c = subColor(sub);
        const w = weight ? '<span class="wt">' + weight.toFixed(1) + '</span>' : '';
        const st = mono ? '' : ' style="background:' + c[0] + '; color:' + c[1] + ';"';
        return '<div class="subj ' + size + '"' + st + '>' + w + (escapeHTML(mt(sub)) || '&nbsp;') + '</div>';
      };

      const printNikka = getNikka();
      buildUnitCounter();
      // 印刷の色。白黒は、線と文字を黒にし、地の灰色は15%（#d9d9d9）までにする。
      const PC = mono ? {
        sub: '#000', outer: '1.6pt solid #000', inner: '0.75pt solid #000', headLine: '1.4pt solid #000',
        pcolBg: '#d9d9d9', pcolText: '#000', pnum: '#000', split: '1pt solid #000',
        subj: ' background: #fff; color: #000; border: 0.9pt solid #000;',
        unitLine: '0.6pt solid #000', unit: '#000', contact: '#000', goal: '1pt solid #000', accent: '#000',
        off: 'background-color: #fff; background-image: repeating-linear-gradient(45deg, #000 0 0.7px, rgba(0,0,0,0) 0.7px 9px);',
        offText: '#000'
      } : {
        sub: '#666f7d', outer: '1.2pt solid #98a0ab', inner: '0.5pt solid #ccd2da', headLine: '1.2pt solid #98a0ab',
        pcolBg: '#eef1f5', pcolText: '#3b424d', pnum: '#98a0ab', split: '0.9pt solid #a6adb8',
        subj: '', unitLine: '0.5pt dashed #c2c8d1', unit: '#4c5361', contact: '#2b6f8c', goal: '0.8pt solid #98a0ab', accent: '#23616f',
        off: 'background-color: #e2e5ea; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.07) 0 6px, rgba(0,0,0,0) 6px 12px);',
        offText: '#555'
      };
      let head = '<th class="pcol"></th>';
      for (let i = 0; i < maxDays; i++) {
        const d = new Date(currentMonday); d.setDate(d.getDate() + i);
        const isHol = holidaysData[fmt(d)] || i === 6;
        const isSat = i === 5;
        const bg = mono ? '#d9d9d9' : (isHol ? "#ffe7de" : (isSat ? "#ddf3f8" : "#eef1f5"));
        const col = mono ? '#000' : (isHol ? "#b8492f" : (isSat ? "#276f81" : "#5c4a35"));
        const holName = holidaysData[fmt(d)];
        const nkType = nikkaOfDate(fmt(d));
        const nkHead = (nkType === 'normal') ? '' : '<span class="nkh">' + escapeHTML(printNikka[nkType].name) + '日課' +
                       (printNikka[nkType].leave ? ' 下校' + hhmm(printNikka[nkType].leave) : '') + '</span>';
        head += '<th style="background:' + bg + '; color:' + col + ';">' +
                '<span class="wd">' + mt(days[i]) + '</span><span class="dt">' + (d.getMonth()+1) + '/' + d.getDate() + '</span>' +
                (holName ? '<span class="holh">' + escapeHTML(holName) + '</span>' : '') + nkHead + '</th>';
      }

      let rows = '';
      printRows.forEach(function(r) {
        const isMemo = (r.type === 'memo');
        const h = isMemo ? bandHeights[r.id] : lessonH;
        const nt = !isMemo ? printNikka.normal.times[r.id] : null;
        const label = isMemo ? mt(r.label) : '<span class="pnum">' + r.label + '</span>' +
                      (nt && nt.s ? '<span class="ptime">' + hhmm(nt.s) + (nt.e ? '<br>' + hhmm(nt.e) : '') + '</span>' : '');
        rows += '<tr style="height:' + h.toFixed(1) + 'mm;"><th class="pcol">' + label + '</th>';
        for (let d = 0; d < maxDays; d++) {
          const dt = new Date(currentMonday); dt.setDate(dt.getDate() + d);
          const dStr = fmt(dt);
          const hol = holidaysData[dStr] || d === 6;
          const vac = getHolidayPeriodName(dStr);
          const tint = mono ? '' : (hol ? 'background:#fffaf8;' : (vac ? 'background:#f8fbff;' : ''));
          const data = appData[getDataKey(d, r.id)];

          if (isMemo) {
            const txt = (data && !rtEmpty(data.record)) ? rtRender(data.record) : '';
            const isEvent = (r.id === 'gyoji');
            const bars = isEvent ? printPeriodBars(printPl, d, mono) : '';
            const barH = isEvent ? printPl.lanes * PD_LANE_MM : 0;
            const boxH = Math.max(2, h - 0.6 - barH).toFixed(1);
            rows += '<td class="memo-cell" style="' + tint + 'height:' + h.toFixed(1) + 'mm;">' + bars +
                    (txt ? '<div class="box" style="height:' + boxH + 'mm;">' + txt + '</div>' : '') + '</td>';
            continue;
          }

          const cellStyle = tint + 'height:' + h.toFixed(1) + 'mm;';
          // 短縮・特別の日は、その時間の時刻を入れる
          const dayType = nikkaOfDate(dStr);
          const dayT = (dayType === 'normal') ? null : printNikka[dayType].times[r.id];
          const ntime = (dayT && dayT.s) ? '<div class="ntime">' + timeLabel(dayT) + '</div>' : '';
          const boxStyle = ' style="height:' + Math.max(2, h - 0.6).toFixed(1) + 'mm;"';

          if (data && data.disabled) {
            rows += '<td class="off-cell" style="height:' + h.toFixed(1) + 'mm;"><div class="offt">授業なし</div></td>';
            continue;
          }
          const cellKey = getDataKey(d, r.id);
          const slots = data ? getSlots(data).map(function(sl, si) { return Object.assign({ idx: si }, sl); })
            .filter(function(sl) { return sl.subject || !rtEmpty(sl.unit); }) : [];
          if (slots.length === 0 && !(showContact && data && !rtEmpty(data.contact))) {
            // 空きコマも枠だけは同じ形にして、手書きできるようにする
            rows += '<td class="lesson-cell" style="' + cellStyle + '"><div class="cellbox"' + boxStyle + '>' + ntime +
                    '<div class="pslot"><div class="subj blank">&nbsp;</div>' +
                    (showUnit ? '<div class="unit"></div>' : '') + '</div></div></td>';
            continue;
          }

          const size = slots.length <= 1 ? 'big' : (slots.length === 2 ? 'small' : 'tiny');
          let inner = '';
          slots.forEach(function(sl) {
            inner += '<div class="pslot">' + pill(sl.subject, size, slots.length > 1 ? sl.weight : 0) +
                     (showUnit ? '<div class="unit">' + rtRender(sl.unit) +
                       (unitBadgeText(cellKey, sl.idx) ? '<span class="uc">' + unitBadgeText(cellKey, sl.idx) + '</span>' : '') + '</div>' : '') + '</div>';
          });
          if (showContact && !rtEmpty(data.contact)) inner += '<div class="contact"><b>連絡</b> ' + rtRender(data.contact) + '</div>';
          rows += '<td class="lesson-cell" style="' + cellStyle + '"><div class="cellbox"' + boxStyle + '>' + ntime + inner + '</div></td>';
        }
        rows += '</tr>';
      });

      const conf = getConfig();
      const gradeClass = (conf.grade ? conf.grade + '年' : '') + (conf.className || '');
      const sd = new Date(currentMonday);
      const ed = new Date(currentMonday); ed.setDate(ed.getDate() + (maxDays - 1));
      const dateRange = sd.getFullYear() + '年' + (sd.getMonth()+1) + '月' + sd.getDate() + '日（' + wdFull[sd.getDay()] + '）〜 ' +
                        (ed.getMonth()+1) + '月' + ed.getDate() + '日（' + wdFull[ed.getDay()] + '）';

      const h = '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>週案 ' + escapeHTML(gradeClass) + '</title>' +
      '<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">' +
      '<style>' +
      '@page { size: A4 ' + (isLand ? 'landscape' : 'portrait') + '; margin: 9mm; }' +
      '* { box-sizing: border-box; margin: 0; padding: 0; }' +
      "body { font-family: 'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo', sans-serif; color: " + (mono ? '#000' : '#1d2127') + "; -webkit-print-color-adjust: exact; print-color-adjust: exact; }" +
      ".t-main, .pcol, thead th, .subj { font-family: 'Noto Sans JP', 'BIZ UDPGothic', 'Yu Gothic UI', sans-serif; }" +
      '.head-line { display: flex; align-items: baseline; justify-content: space-between; padding: 0 1mm 1.5mm; }' +
      '.t-main { font-size: 15pt; font-weight: 800; letter-spacing: 1px; }' +
      '.t-sub { font-size: 10pt; font-weight: 700; color: ' + PC.sub + '; }' +
      'table { width: 100%; border-collapse: collapse; table-layout: fixed; border: ' + PC.outer + '; }' +
      'th, td { border: ' + PC.inner + '; vertical-align: top; overflow: hidden; }' +
      'thead th { height: ' + (isLand ? 8 : 9) + 'mm; font-size: 10pt; font-weight: 800; text-align: center; vertical-align: middle; border-bottom: ' + PC.headLine + '; line-height: 1.15; }' +
      'thead th .holh, thead th .nkh { display: block; font-size: 6.5pt; font-weight: 800; }' +
      'thead th .wd { font-size: 11pt; margin-right: 3px; }' +
      'thead th .dt { font-size: 8pt; font-weight: 400; }' +
      '.pcol { width: 9mm; background: ' + PC.pcolBg + '; color: ' + PC.pcolText + '; font-weight: 800; text-align: center; vertical-align: middle; font-size: 9pt; }' +
      '.pnum { display:inline-block; width:6mm; height:6mm; line-height:6mm; background:' + PC.pnum + '; color:#fff; border-radius:50%; font-size:9pt; }' +
      '.box { padding: 1mm 1.2mm; overflow: hidden; }' +
      '.memo-cell .box { text-align: left; font-size: 8pt; white-space: pre-wrap; word-break: break-word; line-height: 1.35; }' +
      '.lesson-cell { padding: 0; }' +
      '.cellbox { display: flex; flex-direction: column; padding: 0.8mm; overflow: hidden; }' +
      '.pslot { flex: 1 1 0; display: flex; flex-direction: column; min-height: 0; }' +
      '.pslot + .pslot { border-top: ' + PC.split + '; margin-top: 0.8mm; padding-top: 0.8mm; }' +

      '.subj.small { font-size: 9pt; }' +

      '.offt { text-align: center; font-size: 7.5pt; font-weight: 800; color: ' + PC.offText + '; }' +

      '.off-cell { text-align: center; }' +

      '.goal-line b { flex: 0 0 auto; font-size: 7.5pt; color: ' + PC.sub + '; }' +

      '.nkh { color: ' + PC.accent + '; }' +

      '.memo-cell { color: ' + PC.unit + '; }' +
      '.pd { height: 3.6mm; margin: 0.6mm -0.5pt 0; padding-left: 1.2mm; font-size: 6.5pt; font-weight: 800; line-height: 3.6mm;' +
      ' white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }' +
      '.pd.pd-none { background: transparent; }' +
      '.pd.s { margin-left: 1mm; border-radius: 2mm 0 0 2mm; }' +
      '.pd.e { margin-right: 0.8mm; padding-right: 2.6mm; clip-path: polygon(0 0, calc(100% - 2.2mm) 0, 100% 50%, calc(100% - 2.2mm) 100%, 0 100%); }' +
      // 白黒の矢印：色の帯ではなく、黒い上下の線と「▶」で出す
      '.pd.m { position: relative; background: #fff !important; color: #000 !important; border-top: 0.8pt solid #000; border-bottom: 0.8pt solid #000; line-height: 3.2mm; }' +
      '.pd.m.s { border-left: 0.8pt solid #000; }' +
      '.pd.m.e { clip-path: none; padding-right: 3mm; }' +
      '.pd.m .tip { position: absolute; right: 0.2mm; top: 0; font-size: 6.5pt; }' +
      '.print-btn-area { text-align:center; margin-top: 6mm; }' +
      '@media print { .print-btn-area { display: none !important; } }' +
      '</style></head><body>' +
      '<div class="head-line">' +
      '<div class="t-main">' + escapeHTML(gradeClass) + '　週案</div>' +
      '<div class="t-sub">' + dateRange + '</div>' +
      '</div>' +
      (goalHTML ? '<div class="goal-line"><b>今週の目標</b><span>' + goalHTML + '</span></div>' : '') +
      '<table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="credit-line">週案ノート</div>' +
      '<div class="print-btn-area"><button onclick="window.print();" style="padding:10px 28px; font-size:12pt; cursor:pointer; background:#2f5597; color:#fff; border:none; border-radius:5px; font-family:inherit; font-weight:800;">印刷する</button></div>' +
      '</body></html>';

      openPrintWindow(h);
    }

    // ===== タグ =====
    // タグは年度をまたいで共通。児童タグだけは年度ごとに分ける。

    const TAG_COLORS = ['#fdeef1', '#eaf4fd', '#eef8e8', '#fdf2e5', '#f1ecfd', '#fbf8e3', '#fdeef4', '#e9f6f9'];
    const STU_COLOR = '#ebf1fd';
    const TAG_COLOR_FALLBACK = '#e9e2d6';

    function getTagDefs() {
      if (!appSettings.tagDefs) appSettings.tagDefs = {};
      return appSettings.tagDefs;
    }

    // 色は #rrggbb の形のものだけを使う（読み込んだファイルに変な値が入っていても、画面に持ちこまない）
    function tagColor(name) {
      const defs = getTagDefs();
      const c = defs[name] && defs[name].color;
      return (typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c)) ? c : TAG_COLOR_FALLBACK;
    }

    // まだ色が決まっていないタグに、順番に色を割り当てる
    function ensureTagDef(name) {
      const defs = getTagDefs();
      if (defs[name]) return defs[name];
      const used = Object.keys(defs).length;
      defs[name] = { color: TAG_COLORS[used % TAG_COLORS.length] };
      return defs[name];
    }

    function isStudentTag(name, year) {
      return getRoster(year || appSettings.year || getFiscalYear(new Date())).indexOf(name) !== -1;
    }

    // 実際に使われているタグを、よく使う順に返す
    function collectTags(year) {
      const count = {};
      appNotes.forEach(function(n) {
        (n.tags || []).forEach(function(t) { count[t] = (count[t] || 0) + 1; });
      });
      const roster = getRoster(year);
      const names = Object.keys(count);
      Object.keys(getTagDefs()).forEach(function(t) { if (names.indexOf(t) === -1) names.push(t); });
      const normal = names.filter(function(t) { return roster.indexOf(t) === -1; });
      normal.sort(function(a, b) { return (count[b] || 0) - (count[a] || 0); });
      return { normal: normal, students: roster.slice(), count: count };
    }

    function getYearlyDetails(y) { return (appSettings.folderDetailsByYear || {})[y] || {}; }

    // 古いフォルダ・児童タグを、新しいタグにまとめる
    function migrateNotesToTags() {
      let changed = false;
      appNotes.forEach(function(n) {
        if (Array.isArray(n.tags)) return;
        const tags = [];
        const details = getYearlyDetails(n.year);
        const folder = n.folder || '';
        if (folder && folder !== '未分類') {
          const parent = details[folder] && details[folder].parent;
          if (parent && parent !== '未分類' && tags.indexOf(parent) === -1) tags.push(parent);
          if (tags.indexOf(folder) === -1) tags.push(folder);
        }
        (n.students || []).forEach(function(s) { if (tags.indexOf(s) === -1) tags.push(s); });
        n.tags = tags;
        changed = true;
      });

      // フォルダの色をタグの色として引きつぐ（1回だけ。
      // 毎回やると、タグの整理で消したタグが、読み込むたびに戻ってきてしまう）
      const defs = getTagDefs();
      if (!appSettings.tagsFromFolders) {
        Object.keys(appSettings.folderDetailsByYear || {}).forEach(function(y) {
          const d = appSettings.folderDetailsByYear[y] || {};
          Object.keys(d).forEach(function(name) {
            if (name === '未分類') return;
            if (!defs[name] && d[name] && d[name].color) defs[name] = { color: d[name].color };
          });
        });
        appSettings.tagsFromFolders = true;
      }
      appNotes.forEach(function(n) { (n.tags || []).forEach(function(t) { ensureTagDef(t); }); });
      return changed;
    }

    // 選んだタグと記録が合うか。
    // 同じ種類（児童どうし／内容どうし）は「どれか」、種類がちがえば「両方」で判定する。
    function noteMatchesTags(note, picked, year) {
      if (!picked || picked.length === 0) return true;
      const tags = note.tags || [];
      const stuPicked = picked.filter(function(t) { return isStudentTag(t, year); });
      const normPicked = picked.filter(function(t) { return !isStudentTag(t, year); });
      if (stuPicked.length && !stuPicked.some(function(t) { return tags.indexOf(t) !== -1; })) return false;
      if (normPicked.length && !normPicked.some(function(t) { return tags.indexOf(t) !== -1; })) return false;
      return true;
    }

    function noteHasAttachment(n) { return !!(n.attachments && n.attachments.length); }

    // 「今日」「昨日」などの見出しを返す
    function noteDateGroup(dateStr) {
      const d = String(dateStr || '').split(' ')[0].replace(/\//g, '-');
      const parts = d.split('-');
      if (parts.length < 3) return 'そのほか';
      const t = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diff = Math.round((today - t) / 86400000);
      if (diff <= 0) return '今日';
      if (diff === 1) return '昨日';
      if (diff <= 7) return 'この1週間';
      if (t.getFullYear() === now.getFullYear() && t.getMonth() === now.getMonth()) return '今月';
      return (t.getMonth() + 1) + '月';
    }

    // ===== 記録の画面 =====

    let notePicked = [];       // いま絞り込みに選んでいるタグ
    let noteStuOpen = false;   // 児童タグを開いているか
    let noteOnlyAtt = false;
    let noteTags = [];         // いま書いている記録に付けるタグ
    let noteWriteOpen = false;
    let noteTagPickOpen = false;
    let noteWriterStuOpen = false;
    let noteWriterSnapshot = null;   // 書く欄を開いたときの中身（書きかけかどうかの判定に使う）

    function noteWriterState() {
      return JSON.stringify([
        getRT('newNoteInput'),
        currentAttachments.map(function(a) { return [a.name, a.url || '', a.noteId || '']; }),
        noteTags.slice().sort()
      ]);
    }

    function noteWriterDirty() {
      return noteWriteOpen && noteWriterSnapshot !== null && noteWriterState() !== noteWriterSnapshot;
    }

    function openNoteModal(link) {
      // 前に開いていたコマの添付などが、新しい記録に混ざらないよう、まず書く欄を空にする
      cancelNoteEdit();
      noteLink = link || null;
      migrateNotesToTags();
      updateNoteYearSelect();
      noteWriteOpen = !!noteLink;
      renderNoteFilters();
      renderNoteWriter();
      renderNotes();
      uploadMode = 'note';
      document.getElementById('noteModal').style.display = 'flex';
      if (noteLink) {
        noteWriterSnapshot = noteWriterState();
        setTimeout(function() {
          const ed = document.getElementById('newNoteInput');
          if (ed) { ed.focus(); rtFocus(ed); }
        }, 60);
      }
    }

    function closeNoteModal(force) {
      if (!force && noteWriterDirty()) {
        uiConfirm('書きかけの記録は、まだ保存されていません。\n保存せずに閉じますか？', function(ok) {
          if (ok) closeNoteModal(true);
        }, '保存せずに閉じる', '書くのにもどる');
        return;
      }
      cancelNoteEdit();
      document.getElementById('noteModal').style.display = 'none';
    }

    function noteFilterYear() {
      const el = document.getElementById('filterNoteYear');
      return el ? el.value : (appSettings.year || getFiscalYear(new Date()));
    }

    // 上段の札（絞り込み）を描く
    function renderNoteFilters() {
      const box = document.getElementById('noteFilterBar'); if (!box) return;
      const year = noteFilterYear();
      const y = (year === 'all') ? (appSettings.year || getFiscalYear(new Date())) : year;
      const info = collectTags(y);

      // 自動で判定する札
      let attCount = 0;
      appNotes.forEach(function(n) {
        if (year !== 'all' && n.year !== year) return;
        if (noteHasAttachment(n)) attCount++;
      });

      let h = '<div class="tagline">';
      h += '<button class="auto-chip' + (noteOnlyAtt ? ' on' : '') + '" onclick="toggleAuto(\'att\')">' +
           '添付があるもの' + (attCount ? ' <b>' + attCount + '</b>' : '') + '</button>';
      h += '<span class="tag-div"></span>';

      info.normal.forEach(function(t) {
        const on = notePicked.indexOf(t) !== -1;
        const c = info.count[t] || 0;
        h += '<button class="tag-chip' + (on ? ' on' : '') + '" data-t="' + escapeHTML(t) + '" ' +
             'style="background:' + tagColor(t) + ';" onclick="togglePick(this.dataset.t)">' +
             escapeHTML(t) + (c ? ' <b>' + c + '</b>' : '') + '</button>';
      });
      h += '<button class="tag-add" onclick="openTagManage()">＋ タグ</button>';
      h += '</div>';

      // 児童タグは畳んでおく
      if (info.students.length) {
        const picked = notePicked.filter(function(t) { return info.students.indexOf(t) !== -1; });
        h += '<div class="tagline">';
        h += '<button class="stu-toggle' + (noteStuOpen ? ' on' : '') + '" onclick="toggleStuOpen()">' +
             (noteStuOpen ? '▾' : '▸') + ' 児童 ' + info.students.length +
             (picked.length ? '（' + picked.length + '人えらび中）' : '') + '</button>';
        if (!noteStuOpen) {
          picked.forEach(function(t) {
            h += '<button class="tag-chip on" data-t="' + escapeHTML(t) + '" style="background:' + STU_COLOR + ';" ' +
                 'onclick="togglePick(this.dataset.t)">' + escapeHTML(t) + '</button>';
          });
        }
        h += '</div>';
        if (noteStuOpen) {
          h += '<div class="tagline stu-open">';
          info.students.forEach(function(t) {
            const on = notePicked.indexOf(t) !== -1;
            const c = info.count[t] || 0;
            h += '<button class="tag-chip stu' + (on ? ' on' : '') + '" data-t="' + escapeHTML(t) + '" ' +
                 'style="background:' + STU_COLOR + ';" onclick="togglePick(this.dataset.t)">' +
                 escapeHTML(t) + (c ? ' <b>' + c + '</b>' : '') + '</button>';
          });
          h += '</div>';
        }
      }

      if (notePicked.length || noteOnlyAtt) {
        h += '<div class="tagline"><button class="tag-clear" onclick="clearPicked()">✕ 絞り込みをやめる</button></div>';
      }
      box.innerHTML = h;
    }

    function togglePick(t) {
      const i = notePicked.indexOf(t);
      if (i === -1) notePicked.push(t); else notePicked.splice(i, 1);
      renderNoteFilters(); renderNotes();
    }
    function toggleAuto(kind) {
      if (kind === 'att') noteOnlyAtt = !noteOnlyAtt;
      renderNoteFilters(); renderNotes();
    }
    function toggleStuOpen() { noteStuOpen = !noteStuOpen; renderNoteFilters(); }
    function clearPicked() {
      notePicked = []; noteOnlyAtt = false;
      const s = document.getElementById('noteSearchInput'); if (s) s.value = '';
      renderNoteFilters(); renderNotes();
    }
    function clearNoteSearch() {
      const el = document.getElementById('noteSearchInput');
      if (el) { el.value = ''; el.focus(); }
      renderNotes();
    }

    // 書く欄の開け閉め
    function toggleWriter(force) {
      noteWriteOpen = (force === undefined) ? !noteWriteOpen : force;
      renderNoteWriter();
      if (noteWriteOpen) {
        noteWriterSnapshot = noteWriterState();
        setTimeout(function() {
          const ed = document.getElementById('newNoteInput');
          if (ed) { ed.focus(); rtFocus(ed); }
        }, 40);
      }
    }

    function renderNoteWriter() {
      const wrap = document.getElementById('noteWriter');
      const fab = document.getElementById('noteFab');
      if (!wrap) return;
      wrap.style.display = noteWriteOpen ? 'block' : 'none';
      if (fab) fab.style.display = noteWriteOpen ? 'none' : 'inline-flex';
      if (noteWriteOpen) renderWriterTags();
    }

    // 書く画面のタグ選び（よく使うものだけ出す）
    function renderWriterTags() {
      const box = document.getElementById('noteTagPick'); if (!box) return;
      const y = appSettings.year || getFiscalYear(new Date());
      const info = collectTags(y);
      const recent = (appSettings.recentTags || []).filter(function(t) { return info.normal.indexOf(t) !== -1; });
      const rest = info.normal.filter(function(t) { return recent.indexOf(t) === -1; });
      const ordered = recent.concat(rest);
      const show = noteTagPickOpen ? ordered : ordered.slice(0, 6);
      const hidden = ordered.length - show.length;

      let h = '';
      show.forEach(function(t) {
        const on = noteTags.indexOf(t) !== -1;
        h += '<button class="tag-chip' + (on ? ' on' : '') + '" data-t="' + escapeHTML(t) + '" ' +
             'style="background:' + tagColor(t) + ';" onclick="toggleNoteTag(this.dataset.t)">' +
             escapeHTML(t) + '</button>';
      });
      if (hidden > 0) h += '<button class="tag-add" onclick="noteTagPickOpen=true; renderWriterTags();">ほか ' + hidden + '</button>';
      h += '<button class="tag-add" onclick="promptNewTag()">＋ 新しいタグ</button>';

      // 児童タグ
      const stuPicked = noteTags.filter(function(t) { return info.students.indexOf(t) !== -1; });
      h += '<span class="tag-div"></span>';
      h += '<button class="stu-toggle' + (noteWriterStuOpen ? ' on' : '') + '" onclick="noteWriterStuOpen=!noteWriterStuOpen; renderWriterTags();">' +
           (noteWriterStuOpen ? '▾' : '▸') + ' 児童' + (stuPicked.length ? ' ' + stuPicked.length + '人' : '') + '</button>';
      if (!noteWriterStuOpen) {
        stuPicked.forEach(function(t) {
          h += '<button class="tag-chip on" data-t="' + escapeHTML(t) + '" style="background:' + STU_COLOR + ';" ' +
               'onclick="toggleNoteTag(this.dataset.t)">' + escapeHTML(t) + '</button>';
        });
      } else {
        info.students.forEach(function(t) {
          const on = noteTags.indexOf(t) !== -1;
          h += '<button class="tag-chip stu' + (on ? ' on' : '') + '" data-t="' + escapeHTML(t) + '" ' +
               'style="background:' + STU_COLOR + ';" onclick="toggleNoteTag(this.dataset.t)">' + escapeHTML(t) + '</button>';
        });
      }
      box.innerHTML = h;
    }

    function toggleNoteTag(t) {
      const i = noteTags.indexOf(t);
      if (i === -1) noteTags.push(t); else noteTags.splice(i, 1);
      renderWriterTags();
    }

    function promptNewTag() {
      uiPrompt('新しいタグの名前を入れてください。', '', function(name) {
        if (!name) return;
        const t = name.trim();
        if (!t) return;
        if (isStudentTag(t)) { uiAlert('名簿と同じ名前は使えません。'); return; }
        ensureTagDef(t);
        if (noteTags.indexOf(t) === -1) noteTags.push(t);
        renderWriterTags();
        syncToServer();
      });
    }

    function saveNote() {
      const content = getRT('newNoteInput');
      if (rtEmpty(content) && currentAttachments.length === 0) return;
      const now = new Date();
      const dStr = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0') +
                   ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

      noteTags.forEach(function(t) { if (!isStudentTag(t)) ensureTagDef(t); });
      // 次に書くとき候補の先頭に出すため、使ったタグを覚えておく
      const recent = (appSettings.recentTags || []).slice();
      noteTags.forEach(function(t) {
        if (isStudentTag(t)) return;
        const i = recent.indexOf(t); if (i !== -1) recent.splice(i, 1);
        recent.unshift(t);
      });
      appSettings.recentTags = recent.slice(0, 12);

      if (editingNoteId) {
        const idx = appNotes.findIndex(function(n) { return n.id === editingNoteId; });
        if (idx !== -1) {
          appNotes[idx].content = content;
          appNotes[idx].attachments = [...currentAttachments];
          appNotes[idx].tags = [...noteTags];
        }
      } else {
        const note = {
          id: Date.now(), date: dStr, content: content,
          attachments: [...currentAttachments], year: appSettings.year,
          tags: [...noteTags], pinned: false
        };
        if (noteLink) note.link = noteLink;
        appNotes.unshift(note);
      }
      cancelNoteEdit();
      renderNoteFilters();
      renderNotes();
      syncToServer();
      showToast("記録しました");
    }

    function editNote(id) {
      const n = appNotes.find(function(x) { return x.id === id; }); if (!n) return;
      editingNoteId = id;
      noteWriteOpen = true;
      renderNoteWriter();
      setRT('newNoteInput', n.content);
      currentAttachments = [...(n.attachments || [])];
      noteTags = [...(n.tags || [])];
      noteLink = n.link || null;
      uploadMode = 'note';
      renderWriterTags();
      renderEditorAttachments();
      document.getElementById('saveNoteBtn').innerText = "更新する";
      document.getElementById('noteWriterTitle').innerText = "記録を直す";
      noteWriterSnapshot = noteWriterState();
      const body = document.querySelector('#noteModal .modal-body');
      if (body) body.scrollTop = 0;
    }

    function cancelNoteEdit() {
      editingNoteId = null;
      noteTags = [];
      noteLink = null;
      noteTagPickOpen = false;
      setRT('newNoteInput', '');
      currentAttachments = [];
      uploadMode = 'note';
      renderEditorAttachments();
      const b = document.getElementById('saveNoteBtn'); if (b) b.innerText = "記録する";
      const t = document.getElementById('noteWriterTitle'); if (t) t.innerText = "新しい記録";
      noteWriteOpen = false;
      noteWriterSnapshot = null;
      renderNoteWriter();
    }

    function filteredNotes() {
      const year = noteFilterYear();
      const q = ((document.getElementById('noteSearchInput') || {}).value || '').trim().toLowerCase();
      const y = (year === 'all') ? (appSettings.year || getFiscalYear(new Date())) : year;

      let list = appNotes.filter(function(n) { return year === 'all' || n.year === year; });
      list = list.filter(function(n) { return noteMatchesTags(n, notePicked, y); });
      if (noteOnlyAtt) list = list.filter(noteHasAttachment);
      if (q) {
        list = list.filter(function(n) {
          if (rtText(n.content).toLowerCase().includes(q)) return true;
          if ((n.tags || []).some(function(x) { return x.toLowerCase().includes(q); })) return true;
          return (n.attachments || []).some(function(a) { return a.name && a.name.toLowerCase().includes(q); });
        });
      }
      return { list: list, q: q };
    }

    function noteCardHTML(n, q) {
      const cls = 'note-card' + (n.pinned ? ' pinned' : '');
      const full = rtRender(n.content);
      const plain = rtText(n.content);
      const long = (plain.length > 46 || /<br|<div|<p/i.test(full));
      const open = noteOpenIds.indexOf(n.id) !== -1;

      const body = q ? hlHTML(full, q) : full;

      const tags = (n.tags || []).map(function(t) {
        const stu = isStudentTag(t, n.year);
        return '<span class="mini-tag" style="background:' + (stu ? STU_COLOR : tagColor(t)) + ';">' +
               escapeHTML(t) + '</span>';
      }).join('');

      const src = n.link ? '<button class="note-src" data-d="' + escapeHTML(n.link.date) + '" onclick="jumpFromNote(this.dataset.d)">' +
                  escapeHTML(String(n.link.date).replace(/-/g, '/')) + ' ' + escapeHTML(n.link.label) +
                  (n.link.subject ? '・' + escapeHTML(n.link.subject) : '') + '</button>' : '';

      return '<div class="' + cls + '">' +
        '<div class="note-top">' +
        (n.pinned ? '<span class="pin-mark">固定</span>' : '') + tags +
        '<span class="note-time">' + escapeHTML(n.date) + '</span>' +
        '<span class="note-btns">' +
        '<button class="mini-btn" onclick="togglePin(' + Number(n.id) + ')" aria-label="上に留める">' + (n.pinned ? '固定中' : '固定') + '</button>' +
        '<button class="mini-btn" onclick="editNote(' + Number(n.id) + ')" aria-label="直す">直す</button>' +
        '<button class="mini-btn" onclick="deleteNote(' + Number(n.id) + ')" aria-label="消す">消す</button>' +
        '</span></div>' +
        '<div class="note-main">' +
        '<div class="note-text' + ((long && !open) ? ' clip' : '') + '">' + body + '</div></div>' +
        (long ? '<button class="more-btn" onclick="toggleNoteOpen(' + Number(n.id) + ')">' +
                (open ? '▲ とじる' : '▼ つづきを読む') + '</button>' : '') +
        src + generateAttachmentLinksHTML(n.attachments) +
        '</div>';
    }

    let noteOpenIds = [];
    function toggleNoteOpen(id) {
      const i = noteOpenIds.indexOf(id);
      if (i === -1) noteOpenIds.push(id); else noteOpenIds.splice(i, 1);
      renderNotes();
    }

    function renderNotes() {
      const area = document.getElementById('noteListArea'); if (!area) return;
      const res = filteredNotes();
      const countEl = document.getElementById('noteCount');
      if (countEl) countEl.innerText = res.list.length ? res.list.length + '件' : '';

      if (res.list.length === 0) {
        area.innerHTML = '<p class="empty-msg">この条件に合う記録はありません。<br>右下の「＋ 書く」から記録できます。</p>';
        return;
      }

      const sorted = res.list.slice().sort(function(a, b) {
        if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
        return (b.id || 0) - (a.id || 0);
      });

      let html = '';
      let lastGroup = '';
      sorted.forEach(function(n) {
        const g = n.pinned ? '上に留めたもの' : noteDateGroup(n.date);
        if (g !== lastGroup) { html += '<div class="date-head">' + escapeHTML(g) + '</div>'; lastGroup = g; }
        html += noteCardHTML(n, res.q);
      });
      area.innerHTML = html;
    }

    // ===== タグの整理 =====

    function openTagManage() {
      renderTagManage();
      document.getElementById('tagModal').style.display = 'flex';
    }
    function closeTagManage() { document.getElementById('tagModal').style.display = 'none'; renderNoteFilters(); renderNotes(); }

    function renderTagManage() {
      const y = appSettings.year || getFiscalYear(new Date());
      const info = collectTags(y);
      const box = document.getElementById('tagList');
      if (info.normal.length === 0) {
        box.innerHTML = '<p class="empty-msg">タグがまだありません。<br>下の欄から作れます。</p>';
      } else {
        box.innerHTML = info.normal.map(function(t) {
          const c = info.count[t] || 0;
          let sw = '';
          TAG_COLORS.forEach(function(col) {
            sw += '<button class="col-sw' + (tagColor(t) === col ? ' on' : '') + '" style="background:' + col + ';" ' +
                  'data-t="' + escapeHTML(t) + '" data-c="' + col + '" ' +
                  'onclick="setTagColor(this.dataset.t, this.dataset.c)" aria-label="色をかえる"></button>';
          });
          return '<div class="tag-row">' +
            '<span class="mini-tag" style="background:' + tagColor(t) + ';">' + escapeHTML(t) + '</span>' +
            '<span class="tag-cnt">' + c + '件</span>' +
            '<span class="col-row">' + sw + '</span>' +

    function setTagColor(t, c) {
      ensureTagDef(t);
      getTagDefs()[t].color = c;
      renderTagManage(); syncToServer();
    }

    function renameTag(oldName) {
      uiPrompt('「' + oldName + '」の新しい名前を入れてください。', oldName, function(v) {
        if (!v) return;
        const nn = v.trim();
        if (!nn || nn === oldName) return;
        if (isStudentTag(nn)) { uiAlert('名簿と同じ名前は使えません。'); return; }
        const defs = getTagDefs();
        defs[nn] = defs[oldName] || { color: TAG_COLOR_FALLBACK };
        delete defs[oldName];
        appNotes.forEach(function(n) {
          const i = (n.tags || []).indexOf(oldName);
          if (i !== -1) { n.tags[i] = nn; }
        });
        const i2 = notePicked.indexOf(oldName); if (i2 !== -1) notePicked[i2] = nn;
        renderTagManage(); syncToServer();
      });
    }

    function deleteTag(t) {
      const used = appNotes.filter(function(n) { return (n.tags || []).indexOf(t) !== -1; }).length;
      uiConfirm('タグ「' + t + '」を消します。\n\n' +
                (used ? 'この タグが付いた ' + used + '件の記録から、タグだけが外れます。\n記録そのものは消えません。'
                      : 'まだどの記録にも使われていません。'), function(ok) {
        if (!ok) return;
        delete getTagDefs()[t];
        appNotes.forEach(function(n) {
          const i = (n.tags || []).indexOf(t);
          if (i !== -1) n.tags.splice(i, 1);
        });
        const i2 = notePicked.indexOf(t); if (i2 !== -1) notePicked.splice(i2, 1);
        renderTagManage(); syncToServer();
      }, '消す');
    }

    function addTagFromManage() {
      const el = document.getElementById('newTagName');
      const t = (el.value || '').trim();
      if (!t) return;
      if (isStudentTag(t)) { uiAlert('名簿と同じ名前は使えません。'); return; }
      if (getTagDefs()[t]) { uiAlert('同じ名前のタグがすでにあります。'); return; }
      ensureTagDef(t);
      el.value = '';
      renderTagManage(); syncToServer();
    }

    function printNotes() {
      const res = filteredNotes();
      if (res.list.length === 0) { uiAlert("印刷できる記録がありません。"); return; }
      const sorted = res.list.slice().sort(function(a, b) {
        if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
        return (b.id || 0) - (a.id || 0);
      });
      let h = "<html><head><meta charset='UTF-8'><title>記録</title>" +
        '<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">' +
        "<style>@page{size:A4 portrait;margin:15mm;}" +
        "body{font-family:'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif;color:#1d2127;}" +
        "h2{font-family:'Noto Sans JP','BIZ UDPGothic','Yu Gothic UI',sans-serif;font-size:14pt;margin:0 0 10px;}" +
        ".note{border-left:4px solid #a6adb8;padding:7px 12px;margin-bottom:9px;page-break-inside:avoid;}" +
        ".meta{font-size:9pt;color:#666f7d;margin-bottom:4px;font-weight:700;}" +
        ".content{font-size:10.5pt;white-space:pre-wrap;line-height:1.6;}" +
        ".tg{font-size:8.5pt;color:#2b6f8c;font-weight:700;margin-top:3px;}" +
        "@media print{button{display:none;}}</style></head><body>";
      h += '<h2>記録の一覧</h2>';
      sorted.forEach(function(n) {
        const tg = (n.tags || []).length ? '<div class="tg">' + escapeHTML(n.tags.join('、')) + '</div>' : '';
        h += '<div class="note"><div class="meta">' + escapeHTML(n.date) + '</div>' +
             '<div class="content">' + rtRender(n.content) + '</div>' + tg + '</div>';
      });
      h += '<button onclick="window.print()">印刷</button></body></html>';
      openPrintWindow(h);
    }

    function togglePin(id) {
      const n = appNotes.find(function(x) { return x.id === id; }); if (!n) return;
      n.pinned = !n.pinned;
      renderNotes(); syncToServer();
    }

    function deleteNote(id) {
      uiConfirm("この記録を削除しますか？", function(ok) {
        if (!ok) return;
        const idx = appNotes.findIndex(function(x) { return x.id === id; });
        if (idx === -1) return;
        pushUndoNote('記録の削除', appNotes[idx], idx);
        appNotes.splice(idx, 1);
        renderNoteFilters(); renderNotes(); syncToServer();
        showToast("記録を削除しました", true);
      }, '削除する');
    }

    // 記録から、そのとき書いた週へ移動する
    function jumpFromNote(dateStr) {
      closeNoteModal();
      jumpToDate(dateStr);
      showToast("その週を開きました");
    }

    function updateNoteYearSelect() {
      const years = [];
      appNotes.forEach(function(n) { if (n.year && !years.includes(n.year)) years.push(n.year); });
      years.sort().reverse();
      const cur = appSettings.year || getFiscalYear(new Date());
      if (!years.includes(cur)) years.unshift(cur);
      const sel = document.getElementById('filterNoteYear');
      if (sel) {
        const keep = sel.value;
        sel.innerHTML = '<option value="all">全年度</option>' +
          years.map(function(y) { return '<option value="' + escapeHTML(y) + '">' + escapeHTML(y) + '年度</option>'; }).join('');
        const has = Array.prototype.some.call(sel.options, function(o) { return o.value === keep; });
        sel.value = has ? keep : cur;
      }
    }

    function getDataKey(d, p) {
      const date = new Date(currentMonday); date.setDate(date.getDate() + d);
      return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0') + '-' + p;
    }


    // ===== 入力モーダル =====

    let inputSnapshot = null;   // 開いたときの中身（書きかけかどうかの判定に使う）

    // いまの入力欄の中身を、比べられる形にする
    function inputFormState() {
      return JSON.stringify({
        s: ['inputSubject', 'inputSubject2', 'inputSubject3'].map(function(id) { return document.getElementById(id).value; }),
        u: ['inputUnit', 'inputUnit2', 'inputUnit3', 'inputContact', 'inputRecord'].map(getRT),
        m: currentSplitMode(),
        w: [1, 2, 3].map(function(i) { return document.getElementById('wt' + i).value; }),
        off: document.getElementById('inputDisabled').checked,
        a: currentAttachments.map(function(a) { return [a.name, a.url || '', a.noteId || '']; })
      });
    }

    function inputDirty() {
      return inputSnapshot !== null && inputFormState() !== inputSnapshot;
    }

    function openInputModal(day, period) {
      if (dayIsOutside(day)) { noticeLocked(day); return; }
      if (rowFolded[String(period)]) { toggleFold(String(period)); return; }
      currentEditDayIndex = day; currentEditPeriod = String(period);
      selCell = { d: day, p: String(period) };
      clearSelHighlight();
      const row = getRow(period);
      const data = appData[getDataKey(day, period)] || blankLesson();
      const dayNames = ['月','火','水','木','金','土','日'];
      currentAttachments = data.attachments ? [...data.attachments] : [];
      uploadMode = 'record';
      rtActive = null;

      setRT('inputContact', data.contact || "");
      setRT('inputRecord', data.record || "");

      const offWrap = document.getElementById('offToggleWrap');
      const offBox = document.getElementById('inputDisabled');

      if (row.type === 'memo') {
        offWrap.style.display = 'none';
        offBox.checked = false;
        document.getElementById('lessonFields').style.display = 'none';
        document.getElementById('contactFieldArea').style.display = 'none';
        document.getElementById('recordFieldArea').style.display = 'block';
        document.getElementById('inputModalTitle').innerText = mdw(getDataKey(day, period).slice(0, 10)) + 'の' + row.title;
        document.getElementById('recordLabel').innerText = row.print ? '内容（印刷に出ます）' : '内容（印刷されません）';
      } else {
        offWrap.style.display = 'flex';
        offBox.checked = !!data.disabled;
        document.getElementById('inputModalTitle').innerText = mdw(getDataKey(day, period).slice(0, 10)) + ' ' + row.title;
        document.getElementById('recordLabel').innerText = 'メモ・所感（印刷されません）';
        document.getElementById('inputSubject').value = data.subject || "";
        document.getElementById('inputSubject2').value = data.subject2 || "";
        document.getElementById('inputSubject3').value = data.subject3 || "";
        setRT('inputUnit', data.unit || "");
        setRT('inputUnit2', data.unit2 || "");
        setRT('inputUnit3', data.unit3 || "");
        const radio = document.querySelector('input[name="splitMode"][value="' + getSplitMode(data) + '"]');
        if (radio) radio.checked = true;

        for (let i = 0; i < 3; i++) {
          const el = document.getElementById('wt' + (i + 1));
          if (el) el.value = (w[i] !== undefined) ? w[i] : (SPLIT_DEFAULTS.third[i] || '');
        }
        applySplitMode(false);
        applyDisabledState();
      }
      // 行事の欄では、その日にかかっている「期間の取り組み」も出す
      const isEvent = (row.id === 'gyoji');
      document.getElementById('periodFieldArea').style.display = isEvent ? 'block' : 'none';
      if (isEvent) renderPeriodSection(getDataKey(day, period).slice(0, 10)); else periodSectionDate = '';
      renderEditorAttachments();
      document.getElementById('inputModal').style.display = 'flex';
      inputSnapshot = inputFormState();
    }

    function currentSplitMode() {
      const r = document.querySelector('input[name="splitMode"]:checked');
      return r ? r.value : 'none';
    }

    // 選んだ分けかたに合わせて、入力欄の数と配分の表示を切り替える
    function applySplitMode(resetWeights) {
      const def = SPLIT_DEFAULTS[currentSplitMode()];
      const single = (def.length === 1);
      document.getElementById('slot2').style.display = (def.length >= 2) ? 'block' : 'none';
      document.getElementById('slot3').style.display = (def.length >= 3) ? 'block' : 'none';
      document.getElementById('slotTitle1').innerText = single ? '教科' : '1つめの教科';
      document.getElementById('splitSumLine').style.display = single ? 'none' : 'flex';
      for (let i = 0; i < 3; i++) {
        const el = document.getElementById('wt' + (i + 1));
        if (!el) continue;
        const use = (i < def.length) && !single;
        el.style.display = use ? 'inline-block' : 'none';
        if (resetWeights && i < def.length) el.value = def[i];
      }
      const badge1 = document.querySelector('#slot1 .slot-badge');
      if (badge1) badge1.style.display = single ? 'none' : 'inline-block';
      updateSplitSum();
    }

    // 分けた時間の合計を数え、1.0でなければ知らせる
    function updateSplitSum() {
      const def = SPLIT_DEFAULTS[currentSplitMode()];
      const line = document.getElementById('splitSumLine');
      const out = document.getElementById('splitSum');
      const msg = document.getElementById('splitSumMsg');
      if (!line || !out) return true;
      if (def.length === 1) { line.classList.remove('bad'); msg.innerText = ''; return true; }
      let sum = 0, bad = false;
      for (let i = 0; i < def.length; i++) {
        const el = document.getElementById('wt' + (i + 1));
        const v = el ? parseFloat(el.value) : NaN;
        if (!isFinite(v) || v <= 0) { bad = true; } else { sum += v; }
      }
      sum = Math.round(sum * 100) / 100;
      out.innerText = sum.toFixed(1);
      const ok = !bad && Math.abs(sum - 1) < 0.005;
      line.classList.toggle('bad', !ok);
      msg.innerText = ok ? '' : (bad ? '各欄に0より大きい数を入れてください'
                                     : '合計が1.0になるように直してください（例：0.6 と 0.4）');
      return ok;
    }

    // 「授業なし」に切りかえると、ほかの入力欄を隠す
    function applyDisabledState() {
      const off = document.getElementById('inputDisabled').checked;
      document.getElementById('lessonFields').style.display = off ? 'none' : 'block';
      document.getElementById('contactFieldArea').style.display = off ? 'none' : 'block';
      document.getElementById('recordFieldArea').style.display = off ? 'none' : 'block';
    }

    // その枠の教科名と単元名だけを消す
    function clearSlot(idx) {
      const subIds = { 1:'inputSubject', 2:'inputSubject2', 3:'inputSubject3' };
      const unitIds = { 1:'inputUnit', 2:'inputUnit2', 3:'inputUnit3' };
      document.getElementById(subIds[idx]).value = '';
      setRT(unitIds[idx], '');
    }

    // 入力欄をすべて空に戻す（分割の指定も1教科に戻す）
    function resetInputForm() {
      ['inputSubject','inputSubject2','inputSubject3'].forEach(function(id) {
        const el = document.getElementById(id); if (el) el.value = '';
      });
      ['inputUnit','inputUnit2','inputUnit3','inputContact','inputRecord'].forEach(function(id) { setRT(id, ''); });
      const r = document.querySelector('input[name="splitMode"][value="none"]');
      if (r) r.checked = true;
      const off = document.getElementById('inputDisabled');
      if (off) off.checked = false;
      applySplitMode(true);
      applyDisabledState();
      currentAttachments = [];
      renderEditorAttachments();
    }

    // このコマの内容をまるごと消す
    function clearCell() {
      const row = getRow(currentEditPeriod);
      const what = (row && row.type === 'memo')
        ? 'この欄の内容'
        : 'この時間の教科名・単元名・連絡・メモ（2分割・3分割した分もふくめて）';
      uiConfirm(what + 'をすべて消します。よろしいですか？', function(ok) {
        if (!ok) return;
        const key = getDataKey(currentEditDayIndex, currentEditPeriod);
        pushUndo('コマを消す', [key]);
        delete appData[key];

        resetInputForm();
        closeInputModal(true);
        updateView();
        syncToServer();
        showToast("消しました", true);
      }, '消す');
    }

    // 保存できたら true。分けた時間の合計が合わないなど、保存できなかったら false。
    function saveInputData() {
      const key = getDataKey(currentEditDayIndex, currentEditPeriod);
      const row = getRow(currentEditPeriod);

      if (row.type === 'memo') {
        const rec = getRT('inputRecord');
        if (rtEmpty(rec) && currentAttachments.length === 0) { delete appData[key]; }
        else { appData[key] = { record: rec, attachments: [...currentAttachments] }; }
      } else if (document.getElementById('inputDisabled').checked) {
        appData[key] = { disabled: true };
      } else {
        // 分けた時間の合計が1.0でないうちは保存させない
        if (!updateSplitSum()) {
          uiAlert('分けた時間の合計が 1.0 時間になっていません。\n\n' +
                  '「合計」の欄が赤くなっている間は保存できません。\n' +
                  'それぞれの教科の時間を直してから、もう一度保存してください。');
          return false;
        }
        const mode = currentSplitMode();
        const def = SPLIT_DEFAULTS[mode];
        const weights = def.map(function(dv, i) {
          if (mode === 'none') return 1.0;
          const el = document.getElementById('wt' + (i + 1));
          const v = el ? parseFloat(el.value) : NaN;
          return isFinite(v) && v > 0 ? v : dv;
        });
        const entry = {
          subject: document.getElementById('inputSubject').value,
          unit: getRT('inputUnit'),
          subject2: mode === 'none' ? "" : document.getElementById('inputSubject2').value,
          unit2: mode === 'none' ? "" : getRT('inputUnit2'),
          subject3: mode === 'third' ? document.getElementById('inputSubject3').value : "",
          unit3: mode === 'third' ? getRT('inputUnit3') : "",
          splitMode: mode,
          isSplit: mode !== 'none',
          weights: weights,
          disabled: false,
          contact: getRT('inputContact'),
          record: getRT('inputRecord'),
          attachments: [...currentAttachments]
        };
        const isEmpty = !entry.subject && !entry.subject2 && !entry.subject3 &&
                        rtEmpty(entry.unit) && rtEmpty(entry.unit2) && rtEmpty(entry.unit3) &&
                        rtEmpty(entry.contact) && rtEmpty(entry.record) && entry.attachments.length === 0;
        if (isEmpty) { delete appData[key]; } else { appData[key] = entry; }
      }
      updateView();
      closeInputModal(true);
      syncToServer();
      return true;
    }

    // force でなければ、書きかけのときに確かめてから閉じる。then は閉じたあとに呼ぶ。
    function closeInputModal(force, then) {
      const modal = document.getElementById('inputModal');
      if (modal.style.display !== 'flex') { if (then) then(); return; }
      if (!force && inputDirty()) {
        uiConfirm('入力した内容は、まだ保存されていません。\n保存せずに閉じますか？', function(ok) {
          if (ok) closeInputModal(true, then);
        }, '保存せずに閉じる', '入力にもどる');
        return;
      }
      modal.style.display = 'none';
      inputSnapshot = null;
      if (then) then();
    }

    // コマを書きかけていれば、先にコマを保存してから記録の画面へ移る。
    function noteFromCell() {
