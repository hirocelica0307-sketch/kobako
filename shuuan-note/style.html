<!-- 週案ノート：見た目（index から読み込む） -->
<style>
    /* ===== 配色 =====
       変数名は元のまま。中身だけを「業務ツール」の配色に入れ替えている。
       --grass = 画面の地 ／ --paper = 面 ／ --brown = 文字
       --leaf = 主操作（保存・実行） ／ --sky = 補助 ／ --bell = 注意 ／ --coral = 削除 */
    :root {
      --grass: #f2f4f7; --grass-2: #e8ebf0; --grass-dk: #c9cfda;
      --paper: #ffffff; --paper-2: #f2f4f7; --sand: #e8ecf2;
      --line: #e3e6eb; --line-2: #d3d8e0;
      --brown: #171a1f; --brown-2: #616b7a; --brown-3: #666f7f;
      --bell: #9d6009; --bell-dk: #7d4c07;
      --leaf: #2f5597; --leaf-dk: #23457f;
      --sky: #2e7d8f; --sky-dk: #23616f;
      --coral: #c14a3a; --coral-dk: #9d3729;
      --pink: #b0567a;
      --r-xl: 10px; --r-lg: 8px; --r-md: 6px; --r-sm: 4px;
      /* 通信できない環境では、端末に入っているフォントへ順に落ちる。
         BIZ UDPGothic は Windows 10(1809以降)と Windows 11 に標準で入っている。 */
      --font-ui: 'Noto Sans JP', 'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo',
                 'Hiragino Sans', sans-serif;
      --font-read: 'BIZ UDPGothic', 'Noto Sans JP', 'Yu Gothic UI', 'Meiryo',
                   'Hiragino Sans', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px 12px 60px;
      color: var(--brown);
      font-family: var(--font-ui);
      font-weight: 500;
      background-color: var(--grass);
      display: flex; justify-content: center;
      -webkit-text-size-adjust: 100%;
    }

    .island {
      width: 100%; max-width: 1120px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 6px 20px rgba(16,24,40,0.06);
      padding: 14px 18px 20px;
    }

    /* ---------- ヘッダー ---------- */
    .top-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 0; }
    .class-plate {
      background: var(--paper-2);
      color: var(--brown); font-weight: 700; font-size: 1.05rem;
      padding: 8px 16px; border-radius: var(--r-md);
      border: 1px solid var(--line);
      box-shadow: none;
      white-space: nowrap; letter-spacing: 0.02em;
    }
    .week-count {
      margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
      background: var(--paper-2); border: 1px dashed var(--line-2);
      color: var(--brown-2); font-weight: 700; font-size: 0.85rem;
      padding: 7px 16px; border-radius: 5px;
    }
    .week-count b { color: var(--brown); font-size: 1.05rem; }

    /* ---------- ボタン ---------- */
    .btn {
      border: 1px solid #fff; border-radius: 5px; cursor: pointer;
      font-family: inherit; font-weight: 800; font-size: 0.88rem;
      padding: 9px 17px; color: #fff; line-height: 1.2;
      transition: transform .1s, box-shadow .1s, filter .15s;
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 3px solid var(--sky-dk); outline-offset: 2px; }
    .btn-leaf  { background: var(--leaf);  box-shadow: 0 1px 2px rgba(16,24,40,0.10); }
    .btn-leaf:active  { box-shadow: none; }
    .btn-sky   { background: var(--sky);   box-shadow: 0 1px 2px rgba(16,24,40,0.10); }
    .btn-sky:active   { box-shadow: none; }
    .btn-bell  { background: var(--bell);  box-shadow: 0 1px 2px rgba(16,24,40,0.10); color: #fff; }
    .btn-bell:active  { box-shadow: none; }
    .btn-coral { background: var(--coral); box-shadow: 0 1px 2px rgba(16,24,40,0.10); }
    .btn-coral:active { box-shadow: none; }
    .btn-soft  { background: #fff; color: var(--brown); box-shadow: 0 1px 1px rgba(16,24,40,0.05); border-color: var(--line-2); }
    .btn-soft:active  { box-shadow: none; }
    .btn-sm { font-size: 0.78rem; padding: 6px 13px; }
    .btn-lg { font-size: 1rem; padding: 12px 30px; }

    .toolbar { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .toolbar .sep { width: 2px; height: 20px; background: var(--line); border-radius: 2px; margin: 0 2px; }
    .toolbar .btn { padding: 7px 11px; font-size: 0.8rem; }
    @media screen and (max-width: 1180px) and (min-width: 821px) {
      .toolbar .btn { padding: 6px 9px; font-size: 0.74rem; }
      .class-plate { font-size: 1rem; padding: 8px 16px; }
    }

    /* ---------- 週ナビ ---------- */
    .week-nav {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--paper-2); border: 1px solid var(--line);
      border-radius: 5px; padding: 6px 10px; margin: 9px 0 8px;
      flex-wrap: wrap;
    }
    .nav-arrow {
      background: #fff; border: 1px solid var(--line); color: var(--brown);
      border-radius: 5px; padding: 7px 16px; cursor: pointer;
      font-family: inherit; font-weight: 800; font-size: 0.9rem;
      box-shadow: 0 3px 0 var(--line-2); transition: transform .1s, box-shadow .1s;
    }
    .nav-arrow:hover { background: #f2f5fa; }
    .nav-arrow:active { transform: translateY(3px); box-shadow: none; }
    .current-week { font-size: 1.2rem; font-weight: 800; min-width: 190px; text-align: center; }
    .jump-group { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    input[type="date"].date-jump {
      width: auto; max-width: 128px; flex: 0 0 auto;
      font-family: inherit; font-weight: 700; color: var(--brown);
      border: 1px solid var(--line); border-radius: 5px;
      padding: 6px 8px; background: #fff; cursor: pointer; font-size: 0.72rem;
    }
    input[type="date"].date-jump::-webkit-calendar-picker-indicator { margin-left: 2px; cursor: pointer; }

    /* ---------- 時間割 ---------- */
    .tt-wrap {
      border: 1px solid var(--line-2); border-radius: 14px; overflow: hidden; background: #fff;
    }
    .timetable {
      width: 100%; border-collapse: collapse; table-layout: fixed;
      font-family: var(--font-read);
    }
    .timetable th, .timetable td { padding: 0; text-align: center; vertical-align: top; border: 1px solid var(--line); }
    .timetable thead th {
      background: var(--sand); color: var(--brown); font-weight: 700; font-size: 0.88rem;
      padding: 6px 2px; border-bottom: 2px solid var(--line-2); line-height: 1.25;
      font-family: var(--font-ui);
    }
    .timetable thead th.th-sat { background: #eef3f7; color: var(--sky-dk); }
    .timetable thead th.th-sun { background: #ffeee8; color: var(--coral-dk); }
    .period-col {
      width: 42px; background: var(--paper-2); color: var(--brown-2);
      font-weight: 700; font-size: 0.74rem; font-family: var(--font-ui);
      vertical-align: middle !important; border-right: 2px solid var(--line-2) !important; line-height: 1.2;
    }
    /* height は表のセルでは「最低の高さ」として働く。
       overflow を切らないことで、書いた内容の分だけ行が自動で伸びる。 */
    .timetable tbody td {
      height: 70px; background: #fff; cursor: pointer; transition: background .12s;
      position: relative; overflow: visible;
    }
    .timetable tbody td:hover { background: #f0f5fc; box-shadow: inset 0 0 0 2px var(--leaf); }
    .timetable tbody tr.row-event td { height: 40px; background: #f5f8fc; }   /* 40px は最低の高さ */
    .timetable tbody tr.row-break td { height: 13px; background: #fafbfd; }
    .timetable tbody tr.row-note  td { height: 52px; background: #f4fbee; }
    .timetable tbody tr.row-memo  td { height: 52px; background: var(--paper-2); }
    .row-break .cell-content { padding: 0; gap: 0; justify-content: center; }
    .row-break .long-memo {
      font-size: 0.58rem; line-height: 1.25; padding: 1px 3px; text-align: center;
      white-space: pre-wrap; word-break: break-word;
    }
    .row-break .empty-tag { margin: 0 !important; padding: 0; font-size: 0.5rem; border: none; line-height: 1; opacity: 0.45; }
    .row-break .off-tag { margin: 0 !important; font-size: 0.5rem; line-height: 1; }
    .row-break th.period-col { font-size: 0.56rem; letter-spacing: -0.5px; }
    .row-break .attachment-badge { font-size: 0.5rem; padding: 0 4px; bottom: 0; right: 1px; }

    .cell-content { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 100%; padding: 3px; cursor: grab; }
    .cell-content:active { cursor: grabbing; }
    .subject-tag {
      width: 96%; padding: 1px 0; border-radius: 4px; font-size: 0.76rem; font-weight: 700;
      border: 1px solid; font-family: var(--font-read);
    }
    .memo { font-size: 0.7rem; color: #4c5361; line-height: 1.35; width: 96%; font-weight: 400;
            white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word; }
    .memo.ruled { border-top: 1px solid #e6e9ee; padding-top: 3px; margin-top: 2px; width: 90%; }
    .split-part .memo.ruled { padding-top: 2px; margin-top: 1px; }
    .long-memo { font-size: 0.7rem; color: #4c5361; line-height: 1.4; text-align: left; width: 100%; padding: 2px 4px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; font-weight: 400; }
    .empty-tag {
      width: 92%; margin-top: 18%; border: 1px dashed var(--brown-3); border-radius: 5px;
      color: var(--brown-2); font-size: 0.72rem; font-weight: 700; padding: 3px 0; background: transparent;
    }
    .row-event .empty-tag, .row-note .empty-tag, .row-memo .empty-tag { margin-top: 4px; }

    .split-part { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; min-width: 0; }
    .split-part .subject-tag { font-size: 0.66rem; padding: 1px 0; }
    .split-part .memo { font-size: 0.58rem; }
    .split-3 .subject-tag { font-size: 0.6rem; }
    .split-sep { width: 90%; border-top: 2px dotted var(--line-2); }

    .weight-chip {
      position: absolute; top: 3px; left: 3px; z-index: 5;
      background: var(--bell); color: #fff; border: 1px solid #fff;
      font-size: 0.58rem; font-weight: 800; padding: 0 6px; border-radius: 5px;
    }
    .attachment-badge {
      position: absolute; bottom: 3px; right: 3px; z-index: 5;
      background: var(--sky); border: 1px solid #fff; color: #fff;
      font-size: 0.62rem; padding: 1px 7px; border-radius: 5px; font-weight: 800;
    }

    /* 教科カラー（やわらかい淡い色） */
    .color-kokugo    { background: #fdeef1; color: #a12c4d; border-color: #f0d3da; }
    .color-shosha    { background: #fdf0f3; color: #9e4163; border-color: #f0d7de; }
    .color-tosho     { background: #fbeff4; color: #8d4266; border-color: #ecd5e0; }
    .color-sansu     { background: #eaf4fd; color: #235e91; border-color: #d0e2f2; }
    .color-rika      { background: #eef8e8; color: #366820; border-color: #d6e9cb; }
    .color-shakai    { background: #fdf2e5; color: #8a5617; border-color: #efdec6; }
    .color-seikatsu  { background: #fbf8e3; color: #726714; border-color: #e9e2bd; }
    .color-ongaku    { background: #fcedfa; color: #8f3986; border-color: #eed6eb; }
    .color-zuko      { background: #fdf4e0; color: #77590d; border-color: #eedfbb; }
    .color-katei     { background: #fdeef4; color: #a13161; border-color: #f0d5e2; }
    .color-taiiku    { background: #fdeeec; color: #9e3b2c; border-color: #f1d6d1; }
    .color-doutoku   { background: #fdeef6; color: #9b336c; border-color: #f0d6e5; }
    .color-sogo      { background: #e9f6f9; color: #22697a; border-color: #cce4ea; }
    .color-gaikokugo { background: #f1ecfd; color: #6244ab; border-color: #ddd4f3; }
    .color-gakkatsu  { background: #ebf1fd; color: #3a5da3; border-color: #d3dff4; }
    .color-gyoji     { background: #fdf3e6; color: #885213; border-color: #efdfc7; }
    .color-other     { background: #f2f3f5; color: #565e69; border-color: #dfe2e7; }

    /* 期間の取り組み（〇〇週間）の矢印。
       となりのマスの矢印とつながって見えるよう、左右の線の上まで少しはみ出させる。
       名前は最初のマスに書き、矢印の長さまで右へはみ出してよい（z-index で上に出す）。 */
    .pd-lanes { display: flex; flex-direction: column; gap: 2px; padding-top: 3px; }
    .pd-slot, .pd-seg { height: 17px; }
    .pd-seg { position: relative; margin: 0 -1px; cursor: pointer; background: var(--pd-bg); }
    .pd-seg:hover { filter: brightness(0.96); }
    .pd-seg:focus-visible { outline: 2px solid var(--sky-dk); outline-offset: 1px; }
    .pd-seg.pd-start { margin-left: 4px; border-radius: 9px 0 0 9px; }
    .pd-seg.pd-end { margin-right: 3px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); }
    .pd-seg.pd-more { background: linear-gradient(to right, var(--pd-bg) 65%, rgba(255,255,255,0)); }
    .pd-label {
      position: absolute; left: 6px; top: 0; z-index: 3; pointer-events: none;
      font-family: var(--font-ui); font-size: 0.68rem; font-weight: 800; line-height: 17px;
      color: var(--pd-fg); text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pd-c-blue   { --pd-bg: #d9e5fa; --pd-fg: #23457f; }
    .pd-c-green  { --pd-bg: #dcefe0; --pd-fg: #2a6b34; }
    .pd-c-orange { --pd-bg: #fbe3c8; --pd-fg: #8a5208; }
    .pd-c-pink   { --pd-bg: #f8dce7; --pd-fg: #94305b; }
    .pd-c-purple { --pd-bg: #e6defa; --pd-fg: #5a3f9e; }
    /* 「先週と比べる」の小さい表 */
    .pd-mini { padding-top: 1px; gap: 1px; margin-bottom: 2px; }
    .pd-mini .pd-slot, .pd-mini .pd-seg { height: 12px; }
    .pd-mini .pd-seg { margin: 0 -5px; }
    .pd-mini .pd-seg.pd-start { margin-left: 0; }
    .pd-mini .pd-seg.pd-end { margin-right: 0; }
    .pd-mini .pd-label { font-size: 0.58rem; line-height: 12px; left: 4px; }

    /* 期間の取り組みの画面・一覧 */
    .pd-quick { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .pd-quick span { font-size: 0.78rem; font-weight: 700; color: var(--brown-2); }
    .pd-colors { display: flex; gap: 6px; flex-wrap: wrap; }
    .pd-color {
      border: 2px solid transparent; border-radius: 5px; padding: 6px 14px; cursor: pointer;
      font-family: var(--font-ui); font-weight: 800; font-size: 0.8rem;
    }
    .pd-color.on { border-color: var(--brown); }
    .pd-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dotted var(--line); }
    .pd-chip { border-radius: 9px 0 0 9px; padding: 2px 14px 2px 10px; font-size: 0.8rem; font-weight: 800;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%); }
    .pd-range { font-size: 0.78rem; color: var(--brown-2); font-weight: 700; margin-right: auto; }
    .csv-row .st.arrow { background: #dcefe0; color: #2a6b34; }

    /* ===== ToDo（週案の左に出す） ===== */
    .todo-panel { display: none; min-width: 0; }
    .tt-area.todo-on {
      display: grid; grid-template-columns: minmax(280px, 30fr) minmax(0, 70fr);
      gap: 12px; align-items: start;
    }
    .tt-area.todo-on .todo-panel {
      display: block; position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow-y: auto;
      background: #fff; border: 1px solid var(--line-2); border-radius: 14px; padding: 10px 10px 12px;
    }
    @media screen and (max-width: 1000px) {
      .tt-area.todo-on { grid-template-columns: minmax(0, 1fr); }
      .tt-area.todo-on .todo-panel { position: static; max-height: none; }
    }
    .td-btn.on { background: var(--leaf); color: #fff; border-color: var(--leaf-dk); }
    .td-btn-n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bell); color: #fff; font-size: 0.68rem; line-height: 16px; text-align: center; }
    .td-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .td-head-title { font-family: var(--font-ui); font-weight: 800; font-size: 1rem; }
    .td-count { font-size: 0.74rem; font-weight: 700; color: var(--brown-2); }
    .td-close { margin-left: auto; width: 30px; height: 30px; font-size: 0.85rem; }
    .td-add { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .td-add input[type="text"] { flex: 1 1 140px; padding: 8px 10px; font-size: 0.88rem; }
    .td-kind-pick { display: flex; border: 1px solid var(--line-2); border-radius: 5px; overflow: hidden; }
    .td-kind-pick button, .td-kind button {
      background: #fff; border: none; padding: 6px 10px; cursor: pointer;
      font-family: var(--font-ui); font-size: 0.74rem; font-weight: 700; color: var(--brown-2);
    }
    .td-kind-pick button + button, .td-kind button + button { border-left: 1px solid var(--line-2); }
    .td-kind-pick button.on, .td-kind button.on { background: var(--leaf); color: #fff; }
    .td-newdue { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
    .td-newdue:empty { display: none; }
    .td-filters { display: flex; flex-wrap: wrap; gap: 4px; margin: 9px 0 7px; }
    .td-filter {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer;
      font-family: var(--font-ui); font-size: 0.74rem; font-weight: 700; color: var(--brown-2);
    }
    .td-filter b { font-weight: 800; }
    .td-filter.warn b { color: var(--coral-dk); }
    .td-filter.on { background: var(--leaf); color: #fff; border-color: var(--leaf-dk); }
    .td-filter.on b { color: #fff; }
    .td-item { border: 1px solid var(--line); border-radius: var(--r-md); margin-bottom: 5px; background: #fff; }
    .td-item.open { border-color: var(--leaf); box-shadow: 0 0 0 2px rgba(47,85,151,0.10); }
    .td-item.overdue { border-left: 3px solid var(--coral); }
    .td-item.memo { background: #fffdf4; }
    .td-item.drop-to { box-shadow: 0 -3px 0 var(--leaf); }
    .td-row { display: flex; align-items: flex-start; gap: 6px; padding: 7px 6px 7px 2px; }
    .td-grip, .td-grip-space { flex: 0 0 auto; width: 12px; white-space: nowrap; overflow: hidden; color: var(--brown-3); font-size: 0.7rem; line-height: 22px; text-align: center; }
    .td-grip { cursor: grab; letter-spacing: -2px; user-select: none; }
    .td-check {
      flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; padding: 0;
      border: 2px solid var(--leaf); background: #fff; color: #fff; font-weight: 800; font-size: 0.8rem; line-height: 1;
    }
    .td-check:hover { background: #eef3fb; }
    .td-check.on { background: var(--leaf); }
    .td-memo-mark {
      flex: 0 0 auto; font-family: var(--font-ui); font-size: 0.62rem; font-weight: 800; color: var(--bell-dk);
      border: 1px solid var(--bell); border-radius: 4px; padding: 2px 4px; line-height: 1.2; margin-top: 2px;
    }
    .td-main {
      flex: 1 1 auto; min-width: 0; text-align: left; background: none; border: none; padding: 0; cursor: pointer;
      font-family: var(--font-read); color: var(--brown);
    }
    .td-title { display: block; font-size: 0.88rem; font-weight: 700; line-height: 1.45; word-break: break-word; }
    .td-untitled { color: var(--brown-3); font-weight: 500; }
    .td-item.done .td-title { text-decoration: line-through; color: var(--brown-3); }
    .td-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; font-size: 0.7rem; color: var(--brown-2); }
    .td-due { font-weight: 800; color: var(--sky-dk); font-size: 0.72rem; }
    .td-due.today { color: var(--bell-dk); }
    .td-due.late { color: var(--coral-dk); }
    .td-ck-count { font-weight: 700; }
    .td-preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .td-star { flex: 0 0 auto; background: none; border: none; cursor: pointer; font-size: 1.05rem; color: var(--brown-3); padding: 0 2px; line-height: 1.2; }
    .td-star.on { color: #d49b00; }
    .td-detail { border-top: 1px dotted var(--line-2); padding: 8px 9px 9px; display: flex; flex-direction: column; gap: 7px; }
    .td-detail input[type="text"], .td-detail textarea, .td-detail input[type="date"] { padding: 7px 9px; font-size: 0.86rem; }
    .td-detail input[type="date"] { width: auto; }
    .td-kind { display: flex; border: 1px solid var(--line-2); border-radius: 5px; overflow: hidden; align-self: flex-start; }
    .td-lbl { font-family: var(--font-ui); font-size: 0.74rem; font-weight: 800; color: var(--brown-2); }
    .td-due-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .td-mini {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; cursor: pointer;
      font-family: var(--font-ui); font-size: 0.72rem; font-weight: 700; color: var(--brown-2);
    }
    .td-checks { display: flex; flex-direction: column; gap: 4px; }
    .td-ck { display: flex; align-items: center; gap: 5px; }
    .td-ck input[type="text"] { flex: 1; padding: 5px 8px; font-size: 0.82rem; }
    .td-ck.on input[type="text"] { text-decoration: line-through; color: var(--brown-3); }
    .td-ck-box {
      flex: 0 0 auto; width: 20px; height: 20px; border-radius: 4px; cursor: pointer; padding: 0;
      border: 1px solid var(--leaf-dk); background: #fff; color: var(--leaf-dk); font-weight: 800; font-size: 0.78rem; line-height: 1;
    }
    .td-ck.on .td-ck-box { background: var(--leaf); color: #fff; }
    .td-ck-del { background: none; border: none; cursor: pointer; color: var(--coral-dk); font-weight: 800; }
    .td-detail .td-ck-new { padding: 5px 8px; font-size: 0.82rem; }
    .td-foot { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
    .td-created { margin-right: auto; font-size: 0.68rem; color: var(--brown-3); }
    .td-done details summary { cursor: pointer; font-family: var(--font-ui); font-size: 0.8rem; font-weight: 700; color: var(--brown-2); padding: 6px 2px; }
    .td-day-badge {
      display: inline-block; margin-top: 2px; background: var(--bell); color: #fff; border-radius: 4px;
      padding: 0 5px; font-size: 0.6rem; font-weight: 800; line-height: 1.5;
    }

    /* ===== 日課 ===== */
    .nk-badge {
      display: inline-block; margin-top: 2px; background: #e6f2f4; color: var(--sky-dk); border: 1px solid #c3dde2;
      border-radius: 4px; padding: 0 5px; font-size: 0.6rem; font-weight: 800; line-height: 1.5;
    }
    .nk-time {
      position: absolute; top: 2px; right: 3px; z-index: 4; pointer-events: none;
      font-family: var(--font-ui); font-size: 0.56rem; font-weight: 800; color: var(--sky-dk);
      background: rgba(255,255,255,0.85); border-radius: 3px; padding: 0 3px;
    }
    .timetable tbody td.has-nk .cell-content { padding-top: 14px; }
    .pc-time { display: block; font-size: 0.54rem; font-weight: 700; color: var(--brown-3); line-height: 1.15; margin-top: 2px; }
    .nk-item { cursor: default; }
    .nk-item:hover { background: #fff; border-color: var(--line); }
    .nk-item:active { transform: none; }
    .nk-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .nk-table { border-collapse: collapse; }
    .nk-table th { text-align: left; font-size: 0.8rem; font-weight: 800; padding: 3px 10px 3px 0; white-space: nowrap; }
    .nk-table td { padding: 3px 3px; font-size: 0.8rem; color: var(--brown-2); }
    .nk-table input[type="time"] {
      font-family: var(--font-read); font-size: 0.85rem; padding: 5px 7px;
      border: 1px solid var(--line); border-radius: var(--r-sm); background: #fff; color: var(--brown);
    }

    /* ===== 単元の時数 ===== */
    .un-count {
      display: inline-block; margin-left: 4px; padding: 0 4px; border-radius: 3px;
      background: var(--paper-2); color: var(--brown-2); font-family: var(--font-ui);
      font-size: 0.58rem; font-weight: 800; line-height: 1.5; white-space: nowrap; vertical-align: 1px;
    }
    .un-count.over { background: #fbeeeb; color: var(--coral-dk); }
    .un-prog { margin-left: auto; flex: 0 0 auto; font-size: 0.7rem; font-weight: 800; color: var(--brown-2); font-family: var(--font-ui); }
    .un-prog.over { color: var(--coral-dk); }
    .unit-pick .un-prog + .done-badge { margin-left: 6px; }

    /* ===== 月の予定 ===== */
    table.mv { width: 100%; min-width: 640px; border-collapse: collapse; table-layout: fixed; }
    table.mv th {
      background: var(--sand); font-family: var(--font-ui); font-size: 0.78rem; font-weight: 800;
      padding: 5px; border: 1px solid var(--line);
    }
    table.mv th.sat { color: var(--sky-dk); }
    table.mv th.sun { color: var(--coral-dk); }
    td.mv-cell {
      border: 1px solid var(--line); vertical-align: top; height: 92px; padding: 2px 4px;
      cursor: pointer; font-size: 0.72rem; line-height: 1.35; background: #fff;
    }
    td.mv-cell:hover { background: #f0f5fc; }
    td.mv-cell.other { background: var(--paper-2); color: var(--brown-3); }
    td.mv-cell.out { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.035) 0 6px, rgba(0,0,0,0) 6px 12px); cursor: not-allowed; }
    td.mv-cell.vac { background-color: #f6f9ff; }
    td.mv-cell.today { box-shadow: inset 0 0 0 2px var(--leaf); }
    .mv-date { display: flex; align-items: baseline; gap: 4px; font-family: var(--font-ui); }
    .mv-date b { font-size: 0.86rem; }
    td.mv-cell.hol .mv-date b { color: var(--coral-dk); }
    td.mv-cell.sat .mv-date b { color: var(--sky-dk); }
    .mv-hol { font-size: 0.6rem; font-weight: 700; color: var(--coral-dk); }
    .mv-vac { font-size: 0.62rem; color: var(--sky-dk); font-weight: 700; }
    .mv-ev { word-break: break-word; }
    .mv-todo { display: inline-block; margin-top: 2px; background: var(--bell); color: #fff; border-radius: 4px; padding: 0 5px; font-size: 0.6rem; font-weight: 800; }

    /* 授業なしのコマ */
    .timetable tbody td.off-cell {
      background-color: #e9ebef;
      background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.055) 0 7px, rgba(0,0,0,0) 7px 14px);
      border-color: #d5d9e0;
    }
    .timetable tbody td.off-cell:hover { border-color: #9c8f76; box-shadow: none; }
    .off-tag { color: #6d6151; font-weight: 800; font-size: 0.72rem; letter-spacing: 1px; margin-top: 20%; }
    .row-break .off-tag, .row-event .off-tag { margin-top: 2px; font-size: 0.6rem; }

    /* 文字かざり付きの入力欄 */
    .rt-bar {
      display: flex; align-items: center; gap: 3px; flex-wrap: wrap;
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px;
      padding: 4px 7px; margin-bottom: 10px; position: sticky; top: 0; z-index: 5;
    }
    .rt-bar .rt-sep { width: 1px; height: 15px; background: var(--line-2); margin: 0 3px; }
    .rt-btn {
      background: #fff; border: 1.5px solid var(--line); border-radius: 7px; cursor: pointer;
      font-family: inherit; font-weight: 800; font-size: 0.76rem; color: var(--brown);
      min-width: 25px; height: 23px; padding: 0 6px; line-height: 1;
    }
    .rt-btn:hover { background: #f2f5fa; }
    .rt-btn.st { text-decoration: line-through; }
    .rt-btn.it { font-style: italic; }
    .rt-sw {
      width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid #fff;
      box-shadow: 0 0 0 1.5px var(--line-2); cursor: pointer; padding: 0;
    }
    .rt-sw:hover { transform: scale(1.15); }
    .rt-editor {
      width: 100%; min-height: 44px; padding: 10px 13px; background: #fff;
      border: 1px solid var(--line); border-radius: var(--r-md);
      font-family: inherit; font-size: 0.95rem; font-weight: 500; color: var(--brown);
      line-height: 1.55; overflow-wrap: break-word; word-break: break-word;
    }
    .rt-editor.tall { min-height: 76px; }
    .rt-editor:focus { outline: none; border-color: var(--leaf); }
    .rt-editor:empty:before { content: attr(data-ph); color: #bdb09b; }

    /* 分割の時間入力 */
    .wt-input {
      width: 64px; padding: 5px 6px; text-align: center; font-size: 0.85rem; font-weight: 800;
      border: 1px solid var(--line); border-radius: 9px;
    }
    .sum-line {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-md);
      padding: 9px 13px; margin-top: 10px; font-size: 0.85rem; font-weight: 800; color: var(--brown-2);
    }
    .sum-line b { font-size: 1.1rem; color: var(--leaf-dk); }
    .sum-line.bad { background: #fbeeeb; border-color: var(--coral); color: var(--coral-dk); }
    .sum-line.bad b { color: var(--coral-dk); }
    .sum-msg { font-weight: 700; font-size: 0.78rem; }

    /* 基本時間割のタブ */
    .bt-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .bt-tab {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 5px;
      padding: 7px 16px; cursor: pointer; font-family: inherit; font-weight: 800;
      font-size: 0.82rem; color: var(--brown-2);
    }
    .bt-tab.on { background: var(--leaf); color: #fff; border-color: #fff; box-shadow: 0 3px 0 var(--leaf-dk); }
    .bt-pick { display: flex; flex-direction: column; gap: 9px; }

    .credit {
      margin-top: 12px; text-align: right; font-size: 0.66rem; font-weight: 400;
      color: var(--brown-3); letter-spacing: 0.02em; font-family: var(--font-read);
    }

    .timetable thead th.day-th { cursor: pointer; position: relative; }
    .timetable thead th.day-th:hover { filter: brightness(0.95); box-shadow: inset 0 -3px 0 var(--leaf); }
    .timetable thead th.day-th::after {
      content: '▾'; position: absolute; top: 3px; right: 4px;
      font-size: 0.6rem; opacity: 0.45; font-weight: 700;
    }
    .day-menu { display: flex; flex-direction: column; gap: 10px; }
    .day-item {
      display: flex; align-items: flex-start; gap: 11px; width: 100%; text-align: left;
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 13px 15px; cursor: pointer; font-family: var(--font-ui);
      color: var(--brown); transition: .12s;
    }
    .day-item:hover { background: #f0f5fc; border-color: var(--leaf); }
    .day-item:active { transform: translateY(2px); }
    .day-item .txt { display: block; min-width: 0; flex: 1; }
    .day-item .txt b {
      display: block; font-size: 0.92rem; font-weight: 800; margin-bottom: 4px; line-height: 1.35;
    }
    .day-item .txt {
      font-family: var(--font-read); font-weight: 400; font-size: 0.76rem;
      color: var(--brown-2); line-height: 1.55; white-space: normal;
      overflow-wrap: break-word; word-break: break-word;
    }
    .day-item.danger { border-color: #e9c4bd; }
    .day-item.danger:hover { background: #fff4f0; border-color: var(--coral); }
    .day-item.danger .txt b { color: var(--coral-dk); }

    /* 単元名の候補 */
    .unit-list { display: flex; flex-direction: column; gap: 6px; max-height: 42vh; overflow-y: auto; }
    .unit-pick {
      display: flex; align-items: center; gap: 8px; text-align: left;
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-md);
      padding: 10px 13px; cursor: pointer; font-family: var(--font-read);
      font-size: 0.9rem; font-weight: 500; color: var(--brown); width: 100%;
    }
    .unit-pick:hover { background: #f0f5fc; border-color: var(--leaf); }
    .unit-pick .no { flex: 0 0 auto; background: var(--paper-2); color: var(--brown-2);
      border-radius: 5px; padding: 1px 9px; font-size: 0.72rem; font-weight: 800; font-family: var(--font-ui); }

    /* 単元の進み具合 */
    .unit-row { display: flex; align-items: center; gap: 7px; }
    .unit-row .unit-pick { flex: 1 1 auto; min-width: 0; }
    .unit-row.done .unit-pick { opacity: 0.5; background: var(--paper-2); }
    .unit-check {
      flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
      background: #fff; border: 1px solid var(--line-2); color: var(--leaf-dk);
      font-family: var(--font-ui); font-weight: 800; font-size: 1rem; line-height: 1; padding: 0;
    }
    .unit-check:hover { border-color: var(--leaf); background: #f0f5fc; }
    .unit-row.done .unit-check { background: var(--leaf); border-color: var(--leaf-dk); color: #fff; opacity: 1; }
    .done-badge {
      margin-left: auto; flex: 0 0 auto; background: var(--leaf); color: #fff;
      border-radius: 5px; padding: 1px 9px; font-size: 0.68rem; font-weight: 800; font-family: var(--font-ui);
    }
    .unit-next {
      background: #fdf6ea; border: 1px dashed var(--bell-dk); border-radius: var(--r-md);
      padding: 9px 11px; margin-bottom: 11px;
    }
    .unit-next .un-cap {
      display: block; font-family: var(--font-ui); font-size: 0.72rem; font-weight: 800;
      color: var(--bell-dk); margin-bottom: 6px;
    }
    .unit-next .unit-pick { border-color: var(--bell-dk); background: #fff; }
    .unit-sub-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 11px; }
    .unit-sub-tab {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 5px;
      padding: 5px 13px; cursor: pointer; font-family: var(--font-ui);
      font-weight: 700; font-size: 0.78rem; color: var(--brown-2);
    }
    .unit-sub-tab.on { background: var(--leaf); color: #fff; border-color: #fff; box-shadow: 0 2px 0 var(--leaf-dk); }

    /* CSV取り込み */
    .csv-sum {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 12px 15px; margin-bottom: 13px; font-size: 0.86rem; line-height: 1.7; font-weight: 700;
    }
    .csv-sum b { font-size: 1.1rem; color: var(--leaf-dk); }
    .csv-sum .warn { color: var(--coral-dk); }
    .csv-list { max-height: 44vh; overflow-y: auto; }
    .csv-row {
      display: flex; align-items: flex-start; gap: 10px; padding: 8px 11px;
      border-bottom: 1px dotted var(--line); font-size: 0.85rem; font-family: var(--font-read);
    }
    .csv-row.skip { opacity: 0.5; }
    .csv-row .d { flex: 0 0 auto; width: 108px; font-weight: 700; font-family: var(--font-ui); font-size: 0.8rem; }
    .csv-row .d .wd { color: var(--brown-2); }
    .csv-row .d .wd.sat { color: var(--sky-dk); }
    .csv-row .d .wd.sun { color: var(--coral-dk); }
    .csv-row .t { flex: 1; min-width: 0; word-break: break-word; }
    .csv-row .st { flex: 0 0 auto; font-size: 0.72rem; font-weight: 800; border-radius: 5px; padding: 2px 9px; }
    .csv-row .st.add { background: #e6eefa; color: var(--leaf-dk); }
    .csv-row .st.dup { background: var(--paper-2); color: var(--brown-3); }

    /* ヘルプ */
    .help-nav { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px;
      position: sticky; top: 0; background: var(--paper); padding: 2px 0 8px; z-index: 5; }
    .help-nav button {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 5px;
      padding: 5px 13px; cursor: pointer; font-family: var(--font-ui);
      font-weight: 700; font-size: 0.78rem; color: var(--brown-2);
    }
    .help-nav button:hover { background: #f2f5fa; }
    .help-body { font-family: var(--font-read); font-size: 0.88rem; line-height: 1.85; color: var(--brown); }
    .help-body h4 {
      font-family: var(--font-ui); font-size: 1rem; font-weight: 800; color: var(--brown);
      margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 3px dotted var(--line);
      scroll-margin-top: 46px;
    }
    .help-body h4:first-child { margin-top: 0; }
    .help-body h5 {
      font-family: var(--font-ui); font-size: 0.88rem; font-weight: 800;
      color: var(--brown); margin: 16px 0 5px;
    }
    .help-body p { margin: 0 0 10px; }
    .help-body ul, .help-body ol { margin: 0 0 12px; padding-left: 1.3em; }
    .help-body li { margin-bottom: 5px; }
    .help-body b { font-weight: 700; }
    .help-key {
      display: inline-block; background: var(--paper-2); border: 1px solid var(--line);
      border-radius: 8px; padding: 1px 8px; font-family: var(--font-ui);
      font-weight: 800; font-size: 0.82rem; white-space: nowrap;
    }
    .help-step {
      counter-reset: hs; list-style: none; padding-left: 0; margin: 0 0 14px;
    }
    .help-step > li {
      counter-increment: hs; position: relative; padding-left: 32px; margin-bottom: 9px;
    }
    .help-step > li::before {
      content: counter(hs); position: absolute; left: 0; top: 2px;
      width: 22px; height: 22px; border-radius: 50%; background: var(--leaf); color: #fff;
      font-family: var(--font-ui); font-weight: 800; font-size: 0.76rem;
      display: flex; align-items: center; justify-content: center;
    }
    .help-note {
      background: #f5f8fc; border: 1px solid #d3e0e8; border-radius: var(--r-md);
      padding: 11px 14px; margin: 0 0 14px; font-size: 0.84rem; line-height: 1.75;
    }
    .help-warn {
      background: #fbeeeb; border: 1px solid #e9c4bd; border-radius: var(--r-md);
      padding: 11px 14px; margin: 0 0 14px; font-size: 0.84rem; line-height: 1.75;
    }
    .help-tbl { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 0.83rem; }
    .help-tbl th, .help-tbl td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
    .help-tbl th { background: var(--paper-2); font-family: var(--font-ui); font-weight: 800; white-space: nowrap; }

    /* 記録 */
    .find-bar { display: flex; gap: 7px; align-items: center; margin-bottom: 11px; }
    .find-bar input { padding: 10px 14px; font-size: 0.9rem; }
    .note-count { font-size: 0.8rem; font-weight: 700; color: var(--brown-3); align-self: center; }

    .tagline { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 7px; }
    .tagline.stu-open {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-md);
      padding: 8px 10px; margin-bottom: 9px;
    }
    .tag-div { width: 2px; height: 18px; background: var(--line); border-radius: 2px; margin: 0 3px; }

    .tag-chip {
      border: 1px solid transparent; border-radius: 5px; padding: 4px 13px; cursor: pointer;
      font-family: var(--font-ui); font-weight: 700; font-size: 0.78rem; color: var(--brown);
      line-height: 1.3;
    }
    .tag-chip b { font-weight: 800; opacity: 0.6; font-size: 0.72rem; }
    .tag-chip:hover { filter: brightness(0.96); }
    .tag-chip.on { border-color: var(--brown); box-shadow: 0 2px 0 rgba(106,82,64,0.35); }
    .tag-chip.stu { font-size: 0.75rem; padding: 3px 11px; }

    .auto-chip {
      background: #fff; border: 1px dashed var(--brown-3); border-radius: 5px;
      padding: 4px 13px; cursor: pointer; font-family: var(--font-ui);
      font-weight: 700; font-size: 0.78rem; color: var(--brown-2); line-height: 1.3;
    }
    .auto-chip:hover { background: #f2f5fa; }
    .auto-chip.on { background: var(--bell); border-style: solid; border-color: var(--bell-dk); color: #fff; }
    .auto-chip b { font-weight: 800; }

    .tag-add, .stu-toggle, .tag-clear {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 5px;
      padding: 4px 13px; cursor: pointer; font-family: var(--font-ui);
      font-weight: 700; font-size: 0.76rem; color: var(--brown-2); line-height: 1.3;
    }
    .tag-add:hover, .stu-toggle:hover, .tag-clear:hover { background: #f2f5fa; }
    .stu-toggle.on { background: var(--sky); color: #fff; border-color: #fff; }
    .tag-clear { border-color: #e9c4bd; color: var(--coral-dk); }

    .writer {
      background: var(--paper-2); border: 1px solid var(--leaf); border-radius: var(--r-lg);
      padding: 13px 15px; margin: 12px 0 14px;
    }
    .writer-head {
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--font-ui); font-weight: 800; font-size: 0.92rem; margin-bottom: 10px;
    }
    .writer-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .writer .rt-editor { background: #fff; }

    .date-head {
      font-family: var(--font-ui); font-size: 0.8rem; font-weight: 800; color: var(--brown-2);
      margin: 16px 0 7px; padding-bottom: 5px; border-bottom: 2px dotted var(--line);
    }
    .date-head:first-child { margin-top: 4px; }

    .note-card {
      background: #fff; border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--r-lg);
      padding: 13px 15px; margin-bottom: 10px;
    }
    .note-card.pinned { background: #fdf9ee; border-color: var(--bell); }
    .note-card.done { opacity: 0.6; }
    .note-card.done .note-text { text-decoration: line-through; }
    .note-top { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 6px; }
    .note-time { font-size: 0.72rem; color: var(--brown-3); font-weight: 700; margin-left: auto; }
    .note-btns { display: flex; gap: 4px; flex: 0 0 auto; }
    .pin-mark { font-size: 0.8rem; }
    .mini-btn {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px;
      cursor: pointer; font-size: 0.76rem; padding: 2px 7px; line-height: 1.3; font-family: inherit;
    }
    .mini-btn:hover { background: #f2f5fa; }
    .mini-tag {
      display: inline-block; border-radius: 5px; padding: 2px 10px;
      font-family: var(--font-ui); font-size: 0.7rem; font-weight: 700; color: var(--brown);
    }
    .note-main { display: flex; gap: 9px; align-items: flex-start; }
    .note-text { flex: 1; min-width: 0; font-family: var(--font-read); font-size: 0.88rem; line-height: 1.75; word-break: break-word; }
    .note-text.clip { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .more-btn {
      background: none; border: none; cursor: pointer; padding: 3px 0 0;
      font-family: var(--font-ui); font-size: 0.72rem; font-weight: 700; color: var(--sky-dk);
    }
    .more-btn:hover { text-decoration: underline; }
    .note-src {
      display: inline-flex; align-items: center; gap: 4px; background: var(--paper-2);
      border: 1px solid var(--line); border-radius: 5px; padding: 2px 11px;
      font-family: var(--font-ui); font-size: 0.7rem; font-weight: 700; color: var(--brown-2);
      cursor: pointer; margin-top: 7px;
    }
    .note-src:hover { background: #f2f5fa; }
    .todo-box {
      width: 22px; height: 22px; flex: 0 0 auto; border-radius: 7px; cursor: pointer;
      border: 1px solid var(--leaf-dk); background: #fff; color: var(--leaf-dk);
      font-weight: 800; font-size: 0.85rem; line-height: 1; font-family: var(--font-ui);
    }
    .todo-box.on { background: var(--leaf); color: #fff; }
    mark { background: var(--bell); border-radius: 4px; padding: 0 2px; }

    .tag-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 9px 0; border-bottom: 1px dotted var(--line);
    }
    .tag-cnt { font-size: 0.74rem; color: var(--brown-3); font-weight: 700; }
    .col-row { display: flex; gap: 3px; margin-left: auto; }
    .col-sw { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 0 1.5px var(--line-2); cursor: pointer; padding: 0; }
    .col-sw.on { box-shadow: 0 0 0 2.5px var(--brown); }

    /* ---------- モーダル ---------- */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(70,52,33,0.55); backdrop-filter: blur(3px);
      justify-content: center; align-items: center; padding: 16px;
    }
    .modal-box {
      background: var(--paper); width: 100%; max-width: 480px; max-height: 88vh;
      border: 5px solid #fff; border-radius: var(--r-xl);
      box-shadow: 0 12px 0 rgba(60,45,25,0.2), 0 26px 44px rgba(40,30,15,0.3);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-box.large { max-width: 780px; }
    .modal-box.wide { max-width: 1120px; max-height: 94vh; }
    .modal-head {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 16px 20px; background: var(--paper-2); border-bottom: 3px dotted var(--line);
    }
    .modal-head h3 { margin: 0; font-size: 1.12rem; font-weight: 800; color: var(--brown); }
    .modal-head .head-tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
    .modal-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
    .modal-foot {
      display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      padding: 14px 20px; background: var(--paper-2); border-top: 3px dotted var(--line);
    }
    .icon-btn {
      background: #fff; border: 1px solid var(--line); color: var(--brown-2);
      width: 38px; height: 38px; border-radius: 5px; cursor: pointer;
      font-size: 1rem; font-weight: 800; font-family: inherit; line-height: 1;
      box-shadow: 0 3px 0 var(--line-2);
    }
    .icon-btn:active { transform: translateY(3px); box-shadow: none; }

    .field { margin-bottom: 15px; }
    .field > label { display: block; font-size: 0.86rem; font-weight: 800; color: var(--brown); margin-bottom: 6px; }
    .field-hint { font-size: 0.74rem; color: var(--brown-2); font-weight: 500; margin: 4px 0 0; }
    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      width: 100%; padding: 11px 14px; font-family: var(--font-read); font-size: 0.95rem; font-weight: 500;
      color: var(--brown); background: #fff;
      border: 1px solid var(--line); border-radius: var(--r-md);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--leaf); }
    input[readonly] { background: var(--paper-2); color: var(--brown-2); cursor: default; }
    textarea { line-height: 1.55; resize: vertical; }
    select { cursor: pointer; }

    /* セグメント選択（分割の切替） */
    .segmented { display: flex; gap: 6px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 5px; padding: 5px; }
    .segmented label { flex: 1; }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented span {
      display: block; text-align: center; padding: 9px 4px; border-radius: 5px;
      font-size: 0.8rem; font-weight: 800; color: var(--brown-2); cursor: pointer; transition: .15s;
      line-height: 1.3;
    }
    .segmented span small { display: block; font-size: 0.66rem; font-weight: 700; opacity: 0.8; }
    .segmented input:checked + span { background: var(--leaf); color: #fff; box-shadow: 0 3px 0 var(--leaf-dk); }
    .segmented label:hover span { background: rgba(47,85,151,0.10); }
    .segmented input:checked + span:hover { background: var(--leaf); }

    .slot {
      border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 13px 14px; margin-bottom: 12px; background: #fff;
    }
    .slot-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
    .slot-badge {
      background: var(--bell); color: #fff; border: 1px solid #fff;
      border-radius: 5px; padding: 3px 12px; font-size: 0.76rem; font-weight: 800;
    }
    .slot-title { font-weight: 800; font-size: 0.9rem; }
    .slot-tools { margin-left: auto; display: flex; gap: 5px; flex-wrap: wrap; }

    .check-line { display: flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 700; font-size: 0.88rem; padding: 10px 14px; background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-md); }
    .check-line input { width: 20px; height: 20px; accent-color: var(--leaf-dk); cursor: pointer; }

    .radio-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .radio-row label { display: flex; align-items: center; gap: 7px; cursor: pointer; font-weight: 700; font-size: 0.88rem; background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 8px 16px; }
    .radio-row input { accent-color: var(--leaf-dk); width: 17px; height: 17px; cursor: pointer; }

    .sec-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.95rem; font-weight: 800; color: var(--brown);
      margin: 22px 0 10px; padding-bottom: 7px; border-bottom: 3px dotted var(--line);
    }
    .sec-title:first-child { margin-top: 0; }
    .date-range { display: flex; align-items: center; gap: 7px; }
    .date-range input { flex: 1; min-width: 0; }

    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .summary-table { width: 100%; min-width: 560px; border-collapse: separate; border-spacing: 3px; font-family: var(--font-read); }
    /* 調整の入力欄。上下ボタンで数字が隠れないよう、ボタンを消して幅を広げてある */
    .summary-table td:has(> .adj-input) { min-width: 92px; }
    .adj-input {
      width: 84px; padding: 6px 8px; text-align: center;
      font-size: 0.9rem; font-weight: 700; font-variant-numeric: tabular-nums;
      border-width: 1px; border-radius: 6px;
      -moz-appearance: textfield;
    }
    .adj-input::-webkit-outer-spin-button,
    .adj-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .adj-input:focus { border-color: var(--leaf); box-shadow: 0 0 0 2px rgba(47,85,151,0.15); }
    .summary-table th, .summary-table td { padding: 8px 6px; text-align: center; font-size: 0.86rem; font-weight: 500; border-radius: 10px; }
    .summary-table thead th { font-family: var(--font-ui); font-weight: 700; }
    .summary-table thead th { background: var(--brown-2); color: #fff; }
    .summary-table tbody td { background: #fff; border: 1px solid var(--line); }
    .summary-table tbody td.sub-name { text-align: left; padding-left: 12px; }
    .summary-table tbody td.sub-name small { display: block; font-size: 0.66rem; color: var(--brown-3); font-weight: 700; }
    .summary-table td.wk { background: #f4f7fc; }
    .summary-table td.mo { background: #f7f8fa; }
    .summary-table td.total { color: var(--coral-dk); }
    .summary-table tr.grand td { background: #eef1f6; border-color: var(--line-2); font-weight: 800; }
    .summary-table tr.grand td.sub-name { color: var(--brown); }
    .summary-table tfoot td { background: var(--paper-2); font-size: 0.74rem; font-weight: 500; color: var(--brown-2); text-align: left; line-height: 1.5; }
    .bar { height: 7px; border-radius: 999px; background: var(--sand); overflow: hidden; margin-top: 5px; }
    .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--leaf); }
    .bar > i.over { background: var(--coral); }

    .result-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 15px; margin-bottom: 10px; }
    .result-card mark { background: var(--bell); border-radius: 5px; padding: 0 3px; }
    .pick-row { padding: 11px 13px; border-radius: var(--r-md); cursor: pointer; border: 1px solid transparent; }
    .pick-row:hover { background: #f0f5fc; border-color: var(--leaf); }

    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 13px; margin-bottom: 12px; }
    .filter-bar select { width: auto; max-width: 190px; padding: 8px 11px; font-size: 0.85rem; border-width: 1px; }

    .attachment-link { display: inline-flex; align-items: center; gap: 4px; background: #eaf2f5; color: var(--sky-dk); padding: 4px 11px; border-radius: 5px; font-size: 0.76rem; text-decoration: none; border: 1px solid #d3e0e8; font-weight: 800; cursor: pointer; }
    .attachment-link:hover { background: #d6eff7; }
    .att-editor-box { display: inline-flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px 3px 3px; margin: 5px 5px 0 0; }
    .att-editor-btn { background: none; border: none; cursor: pointer; font-size: 0.85rem; margin-left: 5px; color: var(--coral-dk); font-family: inherit; font-weight: 800; }

    .base-table { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
    .base-table th { background: var(--sand); border-radius: 9px; font-size: 0.76rem; font-weight: 800; padding: 5px 0; color: var(--brown); }
    .base-table select { padding: 6px 4px; font-size: 0.72rem; border-width: 1px; border-radius: 9px; }

    /* 自動控えの一覧 */
    .backup-list { display: flex; flex-direction: column; gap: 7px; }
    .backup-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-md);
      padding: 10px 13px; cursor: pointer; font-family: var(--font-ui); text-align: left;
      font-size: 0.88rem; font-weight: 700; color: var(--brown);
    }
    .backup-item:hover { background: #f0f5fc; border-color: var(--leaf); }
    .backup-item small { font-size: 0.72rem; color: var(--brown-3); font-weight: 700; white-space: nowrap; }

    #loadingScreen { position: fixed; inset: 0; background: var(--grass); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
    .leaf-spin {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--line); border-top-color: var(--leaf);
      animation: leafspin 0.9s linear infinite; font-size: 0;
    }
    @keyframes leafspin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .leaf-spin { animation-duration: 3s; } }
    .loading-text { color: var(--brown-2); font-weight: 700; font-size: 0.9rem; }

    #saveToast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(14px);
      background: var(--brown); color: #fff; padding: 12px 26px; border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 4px 14px rgba(16,24,40,0.22);
      opacity: 0; transition: opacity .25s, transform .25s; z-index: 2000; pointer-events: none;
      font-weight: 800; font-size: 0.9rem;
    }
    #saveToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #saveToast.has-undo { pointer-events: auto; display: flex; align-items: center; gap: 12px; }
    .toast-undo {
      background: var(--leaf); color: #fff; border: 1px solid #fff; border-radius: 5px;
      padding: 5px 14px; font-family: inherit; font-weight: 800; font-size: 0.82rem; cursor: pointer;
      white-space: nowrap;
    }
    .toast-undo:hover { background: var(--leaf-dk); }

    /* 保存の状態を、いつでも目で確かめられるようにしておく */
    #saveState {
      position: fixed; right: 14px; bottom: 14px; z-index: 1990;
      background: #fff; color: var(--brown-2); border: 1px solid var(--line);
      border-radius: 5px; padding: 6px 15px; font-size: 0.76rem; font-weight: 800;
      box-shadow: 0 3px 0 rgba(60,45,25,0.12); pointer-events: none;
      transition: opacity .3s; opacity: 0;
    }
    #saveState.on { opacity: 1; }
    #saveState.dirty  { border-color: var(--bell-dk);  color: var(--bell-dk); }
    #saveState.saving { border-color: var(--sky-dk);   color: var(--sky-dk); }
    #saveState.saved  { border-color: var(--leaf-dk);  color: var(--leaf-dk); }
    #saveState.error  { border-color: var(--coral-dk); color: var(--coral-dk); }

    #readOnlyBanner {
      display: none; background: #fbeeeb; border: 1px solid var(--coral);
      color: var(--coral-dk); padding: 13px 17px; border-radius: var(--r-lg);
      margin-bottom: 14px; font-size: 0.87rem; font-weight: 800; line-height: 1.6;
    }
    #readOnlyBanner span { font-weight: 500; }

    /* CSVの作り方の案内 */
    .csv-prompt {
      background: #fff; border: 1px solid var(--line-2); border-radius: var(--r-sm);
      padding: 9px 11px; margin-top: 8px;
      font-family: var(--font-read); font-size: 0.78rem; line-height: 1.7;
      color: var(--brown); white-space: pre-wrap; word-break: break-word;
      user-select: all;
    }
    .cs-alt { color: var(--brown-2); font-size: 0.92em; }
    .csv-sample { margin-bottom: 12px; }
    .csv-sample summary {
      cursor: pointer; font-family: var(--font-ui); font-size: 0.78rem;
      font-weight: 700; color: var(--leaf-dk); padding: 4px 0;
    }
    .csv-sample pre {
      background: var(--paper-2); border: 1px solid var(--line);
      border-radius: var(--r-sm); padding: 10px 12px; margin: 8px 0 0;
      font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
      font-size: 0.74rem; line-height: 1.6; overflow-x: auto; color: var(--brown);
    }

    /* 先週を横にならべる。右の今週の表は、ふだんどおり書きかえられる。 */
    .tt-area { display: block; }
    .tt-area.compare {
      display: grid;
      grid-template-columns: minmax(0, 44fr) minmax(0, 56fr);
      gap: 10px; align-items: start;
    }
    /* 並べているあいだは、画面いっぱいまで広げる */
    body.compare-on .island { max-width: none; width: 100%; }
    body.compare-on { padding-left: 8px; padding-right: 8px; }
    .prev-panel { display: none; min-width: 0; }
    .tt-area.compare .prev-panel { display: block; }
    @media screen and (max-width: 1000px) {
      .tt-area.compare { grid-template-columns: minmax(0, 1fr); }
    }

    .prev-head {
      font-family: var(--font-ui); font-size: 0.74rem; font-weight: 800;
      color: var(--brown-2); background: var(--paper-2);
      border: 1px solid var(--line-2); border-bottom: none;
      border-radius: 14px 14px 0 0; padding: 4px 9px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .prev-head .pv-nav { display: flex; gap: 4px; }
    .prev-head .pv-nav button {
      background: #fff; border: 1px solid var(--line-2); border-radius: var(--r-sm);
      font-family: var(--font-ui); font-size: 0.68rem; font-weight: 700;
      color: var(--brown-2); padding: 2px 8px; cursor: pointer;
    }
    .prev-head .pv-nav button:hover { background: var(--paper-2); border-color: var(--leaf); }
    .prev-body {
      border: 1px solid var(--line-2); border-radius: 0 0 14px 14px;
      background: #fff; overflow-x: auto;
    }
    table.prevtt { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 300px; }
    table.prevtt th, table.prevtt td {
      border: 1px solid var(--line); vertical-align: top; padding: 2px 4px;
    }
    table.prevtt thead th {
      background: var(--sand); font-family: var(--font-ui);
      font-size: 0.68rem; font-weight: 800; text-align: center; color: var(--brown);
    }
    table.prevtt .pv-p {
      width: 30px; background: var(--paper-2); text-align: center;
      font-family: var(--font-ui); font-size: 0.64rem; font-weight: 800; color: var(--brown-2);
    }
    /* 中身は切らずに全部出す。ただし行間を詰めて、縦に間のびさせない */
    table.prevtt td { font-size: 0.7rem; line-height: 1.3; word-break: break-word; }
    table.prevtt .pv-sub {
      display: inline-block; font-weight: 700; font-size: 0.64rem;
      border-radius: 3px; border: 1px solid; padding: 0 5px; margin-bottom: 1px;
    }
    table.prevtt .pv-unit { display: block; color: var(--brown); }
    table.prevtt .pv-contact { display: block; color: var(--sky-dk); margin-top: 1px; }
    table.prevtt .pv-memo { display: block; color: var(--brown-2); margin-top: 1px; }
    table.prevtt .pv-split { border-top: 1px dotted var(--line-2); margin-top: 3px; padding-top: 3px; }
    table.prevtt td.pv-off {
      background-color: #e9ebef; color: var(--brown-3); text-align: center; font-size: 0.6rem;
    }
    table.prevtt td.pv-out { background-color: var(--paper-2); }
    table.prevtt tr.pv-note td { background: #fafbfd; }
    table.prevtt tr.pv-event td { background: #f5f8fc; }

    /* 横に並べているあいだは、今週の表の見出しを少し小さくする */
    .tt-area.compare .timetable thead th { font-size: 0.8rem; }

    /* 連絡・メモの折りたたみ
       畳んでいるときは、行ぜんたい（見出し＋日付のマス）が1つの大きなボタンになる。
       小さすぎて押しにくい・押しまちがえる、を防ぐため。 */
    .period-col.fold-col {
      cursor: pointer; user-select: none;
      background: var(--sand); color: var(--brown);
      font-size: 0.7rem; line-height: 1.2; padding: 3px 1px;
    }
    .period-col.fold-col:hover { background: var(--grass-2); }
    .period-col.fold-col:focus-visible { outline: 2px solid var(--leaf); outline-offset: -2px; }
    .fold-mark { display: block; font-size: 0.66rem; color: var(--brown-2); }
    .fold-name { display: block; font-weight: 800; }

    /* 畳んでいるとき：中身は隠すが、押しやすい高さを残す */
    .timetable tbody tr.folded td {
      height: 28px !important; position: relative; overflow: hidden;
      cursor: pointer; background-color: var(--paper-2);
    }
    .timetable tbody tr.folded td:hover { background-color: var(--grass-2); }
    .timetable tbody tr.folded td > * { display: none !important; }

    /* 記入のある日は、色のついた帯で分かるようにする（中身は見せない） */
    .timetable tbody tr.folded td.has-note { background-color: #e3ebf7; }
    .timetable tbody tr.folded td.has-note:hover { background-color: #d6e2f4; }
    .timetable tbody tr.folded td .fold-dot {
      display: flex !important; align-items: center; justify-content: center;
      position: absolute; inset: 0;
      font-family: var(--font-ui); font-size: 0.62rem; font-weight: 800;
      color: var(--leaf-dk); letter-spacing: 0.5px;
    }
    .timetable tbody tr.folded th.fold-col {
      height: 28px; font-size: 0.68rem; padding: 0 2px;
      background: var(--grass-2);
    }
    .timetable tbody tr.folded th.fold-col:hover { background: var(--sand); }
    .timetable tbody tr.folded th.fold-col .fold-mark { display: inline; margin-right: 3px; font-size: 0.7rem; }
    .timetable tbody tr.folded th.fold-col .fold-name { display: inline; }

    /* 年度の外の日（週が年度をまたぐときに出る。書きこめない） */
    .timetable thead th.out-year-th {
      background: var(--paper-2); color: var(--brown-3);
      opacity: 0.8;
    }
    .timetable tbody tr td.out-year {
      background-color: var(--paper-2);
      background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.035) 0 6px, rgba(0,0,0,0) 6px 12px);
      cursor: not-allowed;
    }
    .timetable tbody tr td.out-year:hover { box-shadow: none; }
    .out-tag {
      color: var(--brown-3); font-weight: 800; font-size: 0.62rem;
      letter-spacing: 0.5px; margin-top: 6px;
    }

    /* 年度の切り替え */
    .year-switch {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .year-now {
      font-family: var(--font-ui); font-size: 1.3rem; font-weight: 800;
      color: var(--brown); white-space: nowrap;
    }
    .year-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .year-chip {
      background: #fff; border: 1px solid var(--line-2); border-radius: var(--r-sm);
      padding: 6px 13px; cursor: pointer; font-family: var(--font-ui);
