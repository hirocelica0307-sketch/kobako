function showCloseRoomBtnIfHost() {
    document.getElementById('closeRoomBtn').style.display = isHost ? 'block' : 'none';
    document.getElementById('playAgainBtn').style.display = isHost ? 'block' : 'none';
}

// 対戦モード：スッと全部出すのではなく、いちばん下の順位から順番にひとつずつ
// あらわす。ただし、あとから出てきた行のせいで先に出した行の場所がずれていくと
// 不自然なので、先に「1位から最下位まで」の場所をぜんぶ用意しておき（まだ見えない
// 状態で）、下の順位から順にその決まった場所へフェードインさせるだけにする。
// 1位はすこしためてから出すことで、最後にもりあがるようにする。
// 同点の人は同じ順位としてまとめて1段に表示する（例：1位が2人なら次は3位、
// 1位が3人なら次は4位、という「オリンピック式」の順位のつけかた）。これは
// 何人いても必ず守る：たとえば1位が2人・3位・4位なら、ぜったいに3段で表示する。
function renderFinalCompetitive(container, values) {
    const sorted = values.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
    const groups = [];
    let i = 0, rank = 1;
    while (i < sorted.length) {
        let j = i;
        while (j < sorted.length && (sorted[j].score || 0) === (sorted[i].score || 0)) j++;
        groups.push({ rank, users: sorted.slice(i, j) });
        rank += (j - i);
        i = j;
    }

    // groups[0] が1位。さきに1位→最下位の順で場所を作ってしまう（まだ非表示）。
    const rowEls = groups.map(g => {
        const row = document.createElement('div');
        row.className = "final-row final-row-enter" + (g.rank <= 3 ? ` f-rank-${g.rank}` : "");
        const names = g.users.map(u => `${escapeHtml(u.name)}さん`).join('、');
        row.innerHTML = `<div class="f-rank">${g.rank}位</div><div class="f-name">${names}</div><div class="f-score">${g.users[0].score || 0}点</div>`;
        container.appendChild(row);
        return row;
    });

    // 表示（フェードイン）だけは最下位から1位の順でおこなう。場所はもう決まっているので、
    // どの行が出ても他の行の位置はずれない。
    const revealSeq = rowEls.slice().reverse();
    let idx = 0;
    function revealNext() {
        if (idx >= revealSeq.length) { showCloseRoomBtnIfHost(); return; }
        const row = revealSeq[idx++];
        const isTop = row === rowEls[0]; // 1位の場所
        void row.offsetHeight; // スタイルを確定させてからクラスを付けて、確実にアニメーションさせる
        requestAnimationFrame(() => row.classList.add('final-row-visible'));
        setTimeout(revealNext, isTop ? 1500 : 900);
    }
    revealNext();
}

// 協力モード：まずチーム合計点を画面中央に大きく表示し、カウンターがぐるぐる回る
// ようにじっくり0から数え上げて、最後にドンと確定させる。そのあとで、それぞれの
// 得点をフラットに（順位はつけずに）表示するが、そのならび順は得点の高い順ではなく
// 「回答順」（ゲーム中に正解した順番。いちばん最近正解した人がいちばん後ろになる）にする。
function renderFinalCoop(container, values) {
    const total = values.reduce((sum, u) => sum + (u.score || 0), 0);
    const totalWrap = document.createElement('div');
    totalWrap.className = 'coop-total-wrap';
    totalWrap.innerHTML = `<div class="coop-total-label">チームの合計とくてん</div><div class="coop-total-number">0点</div>`;
    container.appendChild(totalWrap);
    const numberEl = totalWrap.querySelector('.coop-total-number');

    // 人数が多くてもスクロールしなくて済むように、たてに1人ずつ大きな行で
    // ならべるのではなく、小さめのチップを横になみだかたちに折り返して表示する。
    const listBox = document.createElement('div');
    listBox.className = 'coop-score-wrap';
    container.appendChild(listBox);

    const byAnswerOrder = values.slice().sort((a, b) => {
        const oa = a.answerOrder ?? Infinity, ob = b.answerOrder ?? Infinity;
        return oa - ob;
    });

    // 8人くらいまでは、1人ずつ得点チップがポンと出てきて合計にどんどん
    // 加算されていく演出にする（そのほうが盛り上がるため）。人数が多いと
    // 1人ずつやると長くなりすぎるので、その場合は今まで通り合計だけを
    // 一気に数え上げてから、全員分をまとめて表示する。
    if (byAnswerOrder.length > 0 && byAnswerOrder.length <= 8) {
        listBox.style.opacity = '1';
        animatePerPlayerReveal(numberEl, listBox, byAnswerOrder, () => showCloseRoomBtnIfHost());
    } else {
        listBox.style.opacity = '0';
        animateScoreCountUp(numberEl, total, () => {
            byAnswerOrder.forEach(u => {
                const chip = document.createElement('div');
                chip.className = 'coop-score-chip';
                chip.innerHTML = `<span class="chip-name">${escapeHtml(u.name)}さん</span><span class="chip-score">${u.score || 0}点</span>`;
                listBox.appendChild(chip);
            });
            requestAnimationFrame(() => { listBox.style.opacity = '1'; });
            showCloseRoomBtnIfHost();
        });
    }
}

// fromからtoまで、なめらかに数え上げてelに表示する（スマホでこの表示中に
// 他のアプリへ切り替えても、戻ってきたときにパッと飛ばずに再開できるよう、
// 見ていなかった時間ぶん基準時刻をずらす。animateScoreCountUpと同じしくみ）。
function animateNumberDelta(el, from, to, duration) {
    return new Promise(resolve => {
        if (from === to) { el.innerText = `${to}点`; resolve(); return; }
        let startTime = performance.now();
        let hiddenAt = document.hidden ? performance.now() : null;
        function onVisibilityChange() {
            if (document.hidden) {
                hiddenAt = performance.now();
            } else if (hiddenAt !== null) {
                startTime += performance.now() - hiddenAt;
                hiddenAt = null;
            }
        }
        document.addEventListener('visibilitychange', onVisibilityChange);
        function tick(now) {
            const p = Math.min(1, (now - startTime) / duration);
            const eased = 1 - Math.pow(1 - p, 3);
            el.innerText = `${Math.round(from + (to - from) * eased)}点`;
            if (p < 1) {
                requestAnimationFrame(tick);
            } else {
                document.removeEventListener('visibilitychange', onVisibilityChange);
                el.innerText = `${to}点`;
                resolve();
            }
        }
        requestAnimationFrame(tick);
    });
}

// 1人ずつチップを出しながら、合計をその人の得点ぶんだけ加算していく演出。
async function animatePerPlayerReveal(numberEl, listBox, players, onDone) {
    let running = 0;
    numberEl.innerText = '0点';
    for (const u of players) {
        const score = u.score || 0;
        const chip = document.createElement('div');
        chip.className = 'coop-score-chip coop-chip-enter';
        chip.innerHTML = `<span class="chip-name">${escapeHtml(u.name)}さん</span><span class="chip-score">+${score}点</span>`;
        listBox.appendChild(chip);
        requestAnimationFrame(() => chip.classList.add('coop-chip-visible'));
        const next = running + score;
        const duration = Math.min(1200, Math.max(400, score * 45));
        await animateNumberDelta(numberEl, running, next, duration);
        running = next;
        await new Promise(r => setTimeout(r, 300)); // 次の人が出るまで少し間を置く
    }
    numberEl.classList.add('total-pop');
    setTimeout(onDone, 300);
}

function animateScoreCountUp(el, target, onDone) {
    if (!target) { el.innerText = "0点"; setTimeout(onDone, 500); return; }
    // 「じっくり」感が出るように、以前よりゆっくり長めの時間をかけて数え上げる。
    const duration = Math.min(5000, Math.max(2500, target * 45));
    let startTime = performance.now();
    // スマホでこの表示中に他のアプリに切り替えるなどして画面を見ていない間は、
    // ブラウザがrequestAnimationFrameを止めてしまう。そのまま経過時間だけで
    // 計算すると、戻ってきた瞬間に時間がたちすぎていて「パッと」最後の点数まで
    // 一気に進んで見えてしまう（くるくる数え上がる演出が飛ばされる）。
    // 見ていなかった時間ぶんだけ基準時刻を先送りして、進み具合を巻き戻す。
    let hiddenAt = document.hidden ? performance.now() : null;
    function onVisibilityChange() {
        if (document.hidden) {
            hiddenAt = performance.now();
        } else if (hiddenAt !== null) {
            startTime += performance.now() - hiddenAt;
            hiddenAt = null;
        }
    }
    document.addEventListener('visibilitychange', onVisibilityChange);
    function tick(now) {
        const p = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - p, 3); // ease-out：はじめは早く、さいごはゆっくり
        el.innerText = `${Math.round(target * eased)}点`;
        if (p < 1) {
            requestAnimationFrame(tick);
        } else {
            document.removeEventListener('visibilitychange', onVisibilityChange);
            el.innerText = `${target}点`;
            el.classList.add('total-pop');
            setTimeout(onDone, 600);
        }
    }
    requestAnimationFrame(tick);
}

/* ===== 回答チェック ===== */
// 「決定」ボタンの連打・二重送信で1回の正解に2回分の点が入ってしまわないための鍵。
// answerSubmitInFlightは通信中の多重送信を、myAnswerConfirmedは「もう今回は正解ずみ」を防ぐ。
// myAnswerConfirmedは、リアルタイムリスナー側でusers/{myUid}.isCorrectと常に同期させている
// （次のラウンドでisCorrectがリセットされれば、自動でこちらも戻る）。
let answerSubmitInFlight = false;
let myAnswerConfirmed = false;
async function checkAnswer() {
    if (answerSubmitInFlight || myAnswerConfirmed) return;
    const val = document.getElementById('answerInput').value;
    if (!val) return;
    // 「決定」を押した時点でのラウンド番号を覚えておく。回線が遅いと、この後の
    // once('value')の返事が届くまでの間に、実は次のラウンド（お題）にもう進んで
    // しまっていることがある。次のラウンドもphaseは"playing"なので、
    // state.phaseのチェックだけでは「実は別の問題の答えとして採点されてしまう」
    // のを防げない（たまたま新しい問題の正解と一致すれば誤って正解になり、
    // 一致しなければ関係ない答えとして「×」の吹き出しが出てしまう）。
    // 取得しなおした後のラウンド番号と、押した時点のラウンド番号を比べて、
    // ずれていたら「もうこの答えは関係ない」として何もしない。
    const roundNumberAtSubmit = currentProgressRoundNumber;
    answerSubmitInFlight = true;
    try {
        const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
        const data = snap.val();
        if (!data) return;
        const state = data.state || {};
        if (state.phase !== "playing") return;
        const freshRoundNumber = (data.progress && typeof data.progress.roundNumber === 'number') ? data.progress.roundNumber : 0;
        if (freshRoundNumber !== roundNumberAtSubmit) return;
        if (data.users && data.users[myUid] && data.users[myUid].isCorrect) { myAnswerConfirmed = true; return; }

        if (toHira(val) === toHira(state.correctAnswer)) {
            myAnswerConfirmed = true;
            showJudge("正解！", "#ffcc00");
            db.ref(`casual_rooms/${myRoom}/users/${myUid}`).update({ isCorrect: true });
            db.ref(`casual_rooms/${myRoom}/users/${myUid}/score`).transaction(s => (s || 0) + 10);
            // このゲームを通じて「正解した順番」を記録しておく（正解するたびに、その時点の
            // 通し番号で上書きする）。協力モードの最終結果画面で、点数の高い順ではなく、
            // 実際に答えた順番どおりに名前をならべるために使う。
            db.ref(`casual_rooms/${myRoom}/progress/answerCounter`).transaction(c => (c || 0) + 1, (error, committed, snapshot) => {
                if (!error && committed) {
                    db.ref(`casual_rooms/${myRoom}/users/${myUid}/answerOrder`).set(snapshot.val());
                }
            });
            // correctCountの更新をトランザクションにし、結果が1になったクライアントだけが
            // 描いた人へのボーナスを渡す（同時正解時の二重加算を防ぐ）
            db.ref(`casual_rooms/${myRoom}/state/correctCount`).transaction(c => (c || 0) + 1, (error, committed, snapshot) => {
                if (!error && committed && snapshot.val() === 1) {
                    db.ref(`casual_rooms/${myRoom}/users/${state.currentDrawer}/score`).transaction(s => (s || 0) + 10);
                }
            });
            closeKeyboard();
        } else {
            showJudge("×", "red");
            db.ref(`casual_rooms/${myRoom}/state/wrongGuess`).set({ text: val, name: myName, uid: myUid, ts: Date.now() });
            document.getElementById('answerInput').value = "";
        }
    } finally {
        answerSubmitInFlight = false;
    }
}

function showJudge(text, color) { const el = document.getElementById('judgeEffect'); el.innerText = text; el.style.color = color; el.style.display = "block"; setTimeout(() => { el.style.display = "none"; }, 1000); }
// だれかが間違った答えを送ったとき、その答えをふきだしで数秒だけ表示する。
// これで「あ、その答えはもう違うんだ」とみんなにわかるようにする。
let lastWrongGuessTs = 0;
let wrongGuessInitialized = false;
let wrongGuessHideTimer = null;
const wideScreenQuery = window.matchMedia('(min-width: 901px)');
// まちがえた答え・「おしい！」のふきだしは、以前は2.5秒で消えていたが、
// ヒントとして活用しやすいよう、もう少し長めに表示しておく。
const GUESS_BUBBLE_DISPLAY_MS = 8000;
// 名前タグから出すふきだし（#tagBubble-{uid}）の色を、種類ごとに指定する
// （CSS変数--tag-bubble-border/--tag-bubble-textを、表示するたびにここで設定しなおす。
// 表示のたびに毎回両方指定しておけば、前に別の種類のふきだしを出していた色が
// 残ってしまう心配がない）。
function setTagBubbleColor(tagBubble, borderColor, textColor) {
    tagBubble.style.setProperty('--tag-bubble-border', borderColor);
    tagBubble.style.setProperty('--tag-bubble-text', textColor);
}
function showWrongGuessBubble(uid, name, text) {
    // パソコンなど横に余裕がある画面では、その人の名前タグから吹き出しを出す。
    // 名前タグが見つからない・スマホ表示のときは、これまでどおり画面上部に出す。
    const tagBubble = document.getElementById(`tagBubble-${uid}`);
    if (wideScreenQuery.matches && tagBubble) {
        setTagBubbleColor(tagBubble, '#ff5c5c', '#d40000');
        tagBubble.innerText = `× ${text}`;
        tagBubble.classList.add('show');
        clearTimeout(tagBubble._hideTimer);
        tagBubble._hideTimer = setTimeout(() => { tagBubble.classList.remove('show'); }, GUESS_BUBBLE_DISPLAY_MS);
        return;
    }
    const el = document.getElementById('wrongGuessBubble');
    el.innerText = `${name ? name + 'さん' : 'だれか'}： × ${text}`;
    el.classList.add('show');
    clearTimeout(wrongGuessHideTimer);
    wrongGuessHideTimer = setTimeout(() => { el.classList.remove('show'); }, GUESS_BUBBLE_DISPLAY_MS);
}

// 「おしい！」ボタン：描いている人が、だれかの間違った答えを見て「おしい」と
// 思ったときに押すと、まだ答えていない人たちへのヒントとして伝わる
// （ボタン自体は描いている人にしか表示されない）
function sendOshii() {
    if (!isDrawer || !currentIsPlaying) return;
    db.ref(`casual_rooms/${myRoom}/state/oshii`).set({ uid: myUid, name: myName, ts: Date.now() });
}
let lastOshiiTs = 0;
let oshiiInitialized = false;
let oshiiHideTimer = null;
// drawerUid: ふきだしを出す場所（＝いま描いている人の名前タグ。送信者は常にこの人自身）
// senderName: 描いている人の名前（フォールバック表示の文言に使う）
function showOshiiBubble(drawerUid, senderName) {
    const tagBubble = document.getElementById(`tagBubble-${drawerUid}`);
    if (wideScreenQuery.matches && tagBubble) {
        setTagBubbleColor(tagBubble, '#29b36b', '#128a4d');
        tagBubble.innerText = 'おしい！';
        tagBubble.classList.add('show');
        clearTimeout(tagBubble._hideTimer);
        tagBubble._hideTimer = setTimeout(() => { tagBubble.classList.remove('show'); }, GUESS_BUBBLE_DISPLAY_MS);
        return;
    }
    const el = document.getElementById('oshiiBubble');
    el.innerText = `描いている${senderName ? senderName + 'さん' : '人'}： おしい！`;
    el.classList.add('show');
    clearTimeout(oshiiHideTimer);
    oshiiHideTimer = setTimeout(() => { el.classList.remove('show'); }, GUESS_BUBBLE_DISPLAY_MS);
}

// 「わかった！」ボタン：答えている人（描いている人以外）が、まだ正解と入力していなくても
// 「もう見当がついた」ときに押すと、自分の名前タグ（せまい画面では画面上の吹き出し）に
// 自分の色で「わかった！」と出る。これを見た描いている人は、お題をチェンジしなくて
// よいと判断できる（答えそのものは見えないので、ネタバレにはならない）。
function sendGotIt() {
    if (isDrawer || !currentIsPlaying) return;
    if (usersData[myUid] && usersData[myUid].isCorrect) return; // もう正解した人には不要
    db.ref(`casual_rooms/${myRoom}/state/gotIt/${myUid}`).set({ name: myName, ts: Date.now() });
}
let lastGotItTs = {}; // uid -> このタブで最後に表示した時刻（oshii/wrongGuessと違い、押した人ごとに覚えておく）
let gotItInitialized = false;
let gotItHideTimer = null;
function showGotItBubble(uid, name) {
    const color = (usersData[uid] && usersData[uid].color) || '#3ed6c6';
    const tagBubble = document.getElementById(`tagBubble-${uid}`);
    if (wideScreenQuery.matches && tagBubble) {
        setTagBubbleColor(tagBubble, color, color);
        tagBubble.innerText = 'わかった！';
        tagBubble.classList.add('show');
        clearTimeout(tagBubble._hideTimer);
        tagBubble._hideTimer = setTimeout(() => { tagBubble.classList.remove('show'); }, GUESS_BUBBLE_DISPLAY_MS);
        return;
    }
    const el = document.getElementById('gotItBubble');
    el.style.setProperty('--bubble-color', color);
    el.innerText = `${name ? name + 'さん' : 'だれか'}： わかった！`;
    el.classList.add('show');
    clearTimeout(gotItHideTimer);
    gotItHideTimer = setTimeout(() => { el.classList.remove('show'); }, GUESS_BUBBLE_DISPLAY_MS);
}

// 「お題をチェンジ」したときに、描いている人自身の名前タグから「お題チェンジ！」と
// 出す（changeOdaiBtnと同じ紫を使う。changeOdai()側でstate.odaiChangeを書きこむ）。
let lastOdaiChangeTs = 0;
let odaiChangeInitialized = false;
let odaiChangeHideTimer = null;
const ODAI_CHANGE_COLOR = '#7c6bff';
function showOdaiChangeBubble(drawerUid) {
    const tagBubble = document.getElementById(`tagBubble-${drawerUid}`);
    if (wideScreenQuery.matches && tagBubble) {
        setTagBubbleColor(tagBubble, ODAI_CHANGE_COLOR, ODAI_CHANGE_COLOR);
        tagBubble.innerText = 'お題チェンジ！';
        tagBubble.classList.add('show');
        clearTimeout(tagBubble._hideTimer);
        tagBubble._hideTimer = setTimeout(() => { tagBubble.classList.remove('show'); }, GUESS_BUBBLE_DISPLAY_MS);
        return;
    }
    const el = document.getElementById('odaiChangeBubble');
    el.style.setProperty('--bubble-color', ODAI_CHANGE_COLOR);
    el.innerText = 'お題チェンジ！';
    el.classList.add('show');
    clearTimeout(odaiChangeHideTimer);
    odaiChangeHideTimer = setTimeout(() => { el.classList.remove('show'); }, GUESS_BUBBLE_DISPLAY_MS);
}

/* ===== キーボード（student.htmlと同じ） ===== */
function initKbd() {
    const hira = "あいうえお かきくけこ さしすせそ たちつてと なにぬねの はひふへほ まみむめも や　ゆ　よ らりるれろ わをん　ー".split(" ");
    const kana = "アイウエオ カキクケコ サシスセソ タチツテト ナニヌネノ ハヒフヘホ マミムメモ ヤ　ユ　ヨ ラリルレロ ワヲン　ー".split(" ");
    const target = kbdType === 'hira' ? hira : kana;
    const grid = document.getElementById('kanaGrid');
    grid.innerHTML = "";
    for (let i = 0; i < 5; i++) {
        target.forEach((row, rowIndex) => {
            const c = row[i];
            if (!c || c === "　") { grid.appendChild(document.createElement('div')); return; }
            const b = document.createElement('button');
            b.className = 'k-key';
            b.innerText = c;
            b.onclick = () => { document.getElementById('answerInput').value += c; };
            grid.appendChild(b);
        });
    }
    // ひらがな/カタカナの切り替え・濁点/半濁点/小さい文字・決定ボタンは、細いグリッドの
    // 1マスだと文字がはみ出す・押しにくいので、専用の少し広い側の列に縦3つで置く。
    // 切り替えボタンは今どちらのモードかひと目でわかるよう色も変える。
    const side = document.getElementById('sideGrid');
    side.innerHTML = "";
    const toggle = document.createElement('button');
    toggle.className = 'k-key k-special k-type-toggle ' + (kbdType === 'hira' ? 'mode-hira' : 'mode-kana');
    toggle.innerText = kbdType === 'hira' ? 'あ' : 'ア';
    toggle.onclick = toggleKbdType;
    side.appendChild(toggle);
    const dakuten = document.createElement('button');
    dakuten.className = 'k-key k-special k-dakuten';
    dakuten.innerHTML = "゛゜<br>小";
    dakuten.onclick = () => {
        let v = document.getElementById('answerInput').value;
        if (!v) return;
        let last = v.slice(-1);
        document.getElementById('answerInput').value = v.slice(0, -1) + convertChar(last);
    };
    side.appendChild(dakuten);
    const decide = document.createElement('button');
    decide.className = 'k-key k-decide';
    decide.innerText = "決定";
    decide.onclick = checkAnswer;
    side.appendChild(decide);
}
// ひらがな用・カタカナ用を別の表にして、いま「ひらがな」を選んでいるのに
// 濁点・半濁点・小さい文字ボタンでカタカナに変わってしまうバグを直した。
const HIRA_CONVERT_MAP = {
    'あ':'ぁ','ぁ':'あ','い':'ぃ','ぃ':'い','う':'ぅ','ぅ':'ゔ','ゔ':'う','え':'ぇ','ぇ':'え','お':'ぉ','ぉ':'お',
    'か':'が','が':'か','き':'ぎ','ぎ':'き','く':'ぐ','ぐ':'く','け':'げ','げ':'け','こ':'ご','ご':'こ',
    'さ':'ざ','ざ':'さ','し':'じ','じ':'し','す':'ず','ず':'す','せ':'ぜ','ぜ':'せ','そ':'ぞ','ぞ':'そ',
    'た':'だ','だ':'た','ち':'ぢ','ぢ':'ち','つ':'っ','っ':'づ','づ':'つ','て':'で','で':'て','と':'ど','ど':'と',
    'は':'ば','ば':'ぱ','ぱ':'は','ひ':'び','び':'ぴ','ぴ':'ひ','ふ':'ぶ','ぶ':'ぷ','ぷ':'ふ','へ':'べ','べ':'ぺ','ぺ':'へ','ほ':'ぼ','ぼ':'ぽ','ぽ':'ほ',
    'や':'ゃ','ゃ':'や','ゆ':'ゅ','ゅ':'ゆ','よ':'ょ','ょ':'よ'
};
const KANA_CONVERT_MAP = {
    'ア':'ァ','ァ':'ア','イ':'ィ','ィ':'イ','ウ':'ゥ','ゥ':'ヴ','ヴ':'ウ','エ':'ェ','ェ':'エ','オ':'ォ','ォ':'オ',
    'カ':'ガ','ガ':'カ','キ':'ギ','ギ':'キ','ク':'グ','グ':'ク','ケ':'ゲ','ゲ':'ケ','コ':'ゴ','ゴ':'コ',
    'サ':'ザ','ザ':'サ','シ':'ジ','ジ':'シ','ス':'ズ','ズ':'ス','セ':'ゼ','ゼ':'セ','ソ':'ゾ','ゾ':'ソ',
    'タ':'ダ','ダ':'タ','チ':'ヂ','ヂ':'チ','ツ':'ッ','ッ':'ヅ','ヅ':'ツ','テ':'デ','デ':'テ','ト':'ド','ド':'ト',
    'ハ':'バ','バ':'パ','パ':'ハ','ヒ':'ビ','ビ':'ピ','ピ':'ヒ','フ':'ブ','ブ':'プ','プ':'フ','ヘ':'ベ','ベ':'ペ','ペ':'ヘ','ホ':'ボ','ボ':'ポ','ポ':'ホ',
    'ヤ':'ャ','ャ':'ヤ','ユ':'ュ','ュ':'ユ','ヨ':'ョ','ョ':'ヨ'
};
function convertChar(c) {
    const map = (kbdType === 'kana') ? KANA_CONVERT_MAP : HIRA_CONVERT_MAP;
    return map[c] || c;
}
// ひらがな／カタカナの切り替えは、正方形の1個のボタンをタップするたびに
// 交互に切り替わる方式にして、答えを入力の横に置いてもかんたんに操作できるようにする。
function toggleKbdType() {
    kbdType = (kbdType === 'hira') ? 'kana' : 'hira';
    initKbd();
}
function bs() { const el = document.getElementById('answerInput'); el.value = el.value.slice(0, -1); }
function closeKeyboard() {
    document.getElementById('kbdWrapper').style.display = 'none';
    document.getElementById('stage').classList.remove('kbd-open');
    scheduleStageLayout();
}
function toggleKeyboard(){
    const k = document.getElementById('kbdWrapper');
    if (k.style.display === 'flex') { closeKeyboard(); return; }
    k.style.display = 'flex';
    // スマホ版だけ：キーボードを出している間はキャンバスを上へスライドする
    // （パソコン版は横に余裕があるのでそのまま中央表示にしておく）
    if (window.innerWidth <= 900) document.getElementById('stage').classList.add('kbd-open');
    scheduleStageLayout();
}
function initColors() { const colors = ['#ff0000', '#ff8c00', '#ffff00', '#adff2f', '#008000', '#00bfff', '#0000ff', '#800080', '#ff69b4', '#8b4513', '#f5deb3', '#000000', '#777777', '#ffffff']; const row = document.getElementById('colorRow'); row.innerHTML = ""; colors.forEach(c => { const b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c; b.dataset.color = c; b.onclick = () => { isEraserMode = false; penColor = c; updateActiveColor(); }; row.appendChild(b); }); updateActiveColor(); }
function setPenMode() { isEraserMode = false; isFillMode = false; updateActiveColor(); }
// 塗りつぶし（バケツ）モード：ペンと同じ色をつかうので、色えらびはそのまま活かす。
// 消しゴムとちがい、色を選び直しながら続けて何か所も塗りたいことが多いので、
// 色ボタンを押してもこのモードは解除しない（initColorsのonclickを参照）。
function setFillMode() { isEraserMode = false; isFillMode = true; updateActiveColor(); }
function updateActiveColor() {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.toggle('active', b.dataset.color === penColor && !isEraserMode));
    document.getElementById('eraserBtn').classList.toggle('active', isEraserMode);
    document.getElementById('penBtn').classList.toggle('active', !isEraserMode && !isFillMode);
    const fillBtn = document.getElementById('fillBtn');
    fillBtn.classList.toggle('active', isFillMode);
    // 塗りつぶしボタンは、アイコンの色はそのままに、ボタンの背景を今の色にする。
    // ただしアイコン自体は紺色のままなので、背景が黒だと見えなくなってしまう。
    // 黒の時だけアイコンを白にする（他の色は紺色のアイコンのままで十分見える）。
    fillBtn.style.background = isFillMode ? penColor : '';
    fillBtn.style.color = isFillMode ? (penColor === '#000000' ? '#ffffff' : '#2c2a4a') : '';
    // ペンの太さの●は、今えらんでいる色と同じ色にして、何色の何ミリを使っているか分かりやすくする。
    // 白を選んでいる時だけ、●が背景（白）に溶けて見えなくなるので黒い縁取りをつける。
    ['sizeDot0', 'sizeDot1', 'sizeDot2', 'sizeDot3'].forEach(id => {
        const dot = document.getElementById(id);
        dot.style.background = penColor;
        dot.style.outline = (penColor === '#ffffff') ? '1.5px solid #2c2a4a' : '';
    });
}
function changeSize(s, id) { penSize = s; document.querySelectorAll('.size-dot-wrap').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function setEraser() { isEraserMode = true; isFillMode = false; penSize = 28; document.querySelectorAll('.size-dot-wrap').forEach(b => b.classList.remove('active')); document.getElementById('wrap3').classList.add('active'); updateActiveColor(); }
function clearCanvas(){ if(confirm('ぜんぶ消す？')){ canvasGen++; ctx.clearRect(0,0,canvas.width,canvas.height); upload(); } }

// 塗りつぶし（バケツ）ツール本体：タップした場所と「近い色」でひとつながりの部分を、
// 選んだ色でまとめて塗りつぶす。手描きの線はにじみ・アンチエイリアスで完全な同色に
// ならないことがあるので、色の近さにある程度の許容範囲(TOLERANCE)を持たせて判定する。
// 何も描いていない部分は透明（アルファ0）なので、そこをタップすると背景をまるごと塗れる。
const FLOOD_FILL_TOLERANCE = 50;
function floodFillAt(rawX, rawY, fillColorHex) {
    const w = canvas.width, h = canvas.height;
    const sx = Math.floor(rawX), sy = Math.floor(rawY);
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) return;

    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;
    const startP = sy * w + sx;
    const startIdx = startP * 4;
    const startR = data[startIdx], startG = data[startIdx + 1], startB = data[startIdx + 2], startA = data[startIdx + 3];

    const fr = parseInt(fillColorHex.slice(1, 3), 16), fg = parseInt(fillColorHex.slice(3, 5), 16), fb = parseInt(fillColorHex.slice(5, 7), 16);
    const T = FLOOD_FILL_TOLERANCE;
    // すでにほぼ同じ色の場所を塗ろうとしたときは、なにもしない（無駄な処理を省く）
    if (Math.abs(startR - fr) <= T && Math.abs(startG - fg) <= T && Math.abs(startB - fb) <= T && Math.abs(startA - 255) <= T) return;

    const visited = new Uint8Array(w * h);
    const stack = new Int32Array(w * h); // 最大でも全ピクセル数ぶんまでしか積まれない
    let sp = 0;
    stack[sp++] = startP;
    visited[startP] = 1;

    function isMatch(p) {
        const idx = p * 4;
        return Math.abs(data[idx] - startR) <= T && Math.abs(data[idx + 1] - startG) <= T &&
               Math.abs(data[idx + 2] - startB) <= T && Math.abs(data[idx + 3] - startA) <= T;
    }

    while (sp > 0) {
        const p = stack[--sp];
        const idx = p * 4;
        data[idx] = fr; data[idx + 1] = fg; data[idx + 2] = fb; data[idx + 3] = 255;

        const px = p % w;
        if (px + 1 < w) { const np = p + 1; if (!visited[np] && isMatch(np)) { visited[np] = 1; stack[sp++] = np; } }
        if (px - 1 >= 0) { const np = p - 1; if (!visited[np] && isMatch(np)) { visited[np] = 1; stack[sp++] = np; } }
        if (p + w < w * h) { const np = p + w; if (!visited[np] && isMatch(np)) { visited[np] = 1; stack[sp++] = np; } }
        if (p - w >= 0) { const np = p - w; if (!visited[np] && isMatch(np)) { visited[np] = 1; stack[sp++] = np; } }
    }
    ctx.putImageData(imgData, 0, 0);
}
