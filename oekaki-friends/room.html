<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>お絵かきクイズ フレンズ｜部屋</title>
<!-- 部屋の画面はその場かぎりの内容（人によって中身が変わる）なので、検索結果には出さない -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ff8a3d">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="odailist.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- display=optionalだと、通信が少しでも遅いとそのページ表示ではずっと
     ふつうのゴシック体のまま（次に開いたときしか切り替わらない）になって
     しまっていたため、display=swapに戻す。代わりに、フォントの読み込みが
     確定してから中身を表示する仕組み（下のCSS/スクリプト）で、表示中に
     フォントが入れ替わって見える「がたつき」を防ぐ（index.htmlと同じ対策）。 -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* スマホでダブルタップ拡大・長押しメニューが出て遊びづらくなるのを防ぐ。
   CSSのtouch-actionだけではiOS Safariのピンチ拡大を止めきれないので、
   JS側でもgesturestart等を止める（下のscriptを参照）。 */
* { box-sizing: border-box; touch-action: manipulation; -webkit-touch-callout: none; }
html { overscroll-behavior-y: none; }
body {
    margin: 0; color: #2c2a4a; font-family: 'Zen Maru Gothic', sans-serif; overflow: hidden; height: 100vh; touch-action: none; overscroll-behavior-y: none;
    background: radial-gradient(circle at 20% 15%, #fffaf0 0%, #eef6ff 55%, #e3f7f2 100%);
    /* user-selectを入れておかないと、パソコンでボタンなどを素早くクリックしたときに
       まわりの文字が選択されてしまい、Iビームの文字カーソルが出て見た目が崩れる。
       入力用の要素だけは選択できるままにしておく。 */
    -webkit-user-select: none; user-select: none;
    /* フォントの読み込みが確定するまで中身を隠しておき（下のスクリプトでhtmlに
       fonts-readyクラスが付いたら表示する）、表示中にフォントが入れ替わって
       見える「がたつき」を防ぐ（index.htmlと同じ対策）。 */
    opacity: 0; transition: opacity 0.2s ease;
}
html.fonts-ready body { opacity: 1; }
input, textarea { -webkit-user-select: text; user-select: text; }
/* 日本語の短いラベル（見出しやボタンの文字）が、スマホの狭い画面で意味の
   区切りと関係ない変なところで折り返されるのを防ぐ。単語の区切り（スペースなど）
   がない日本語文でも、句読点などの自然な区切り以外では折り返さないようにする。 */
body { word-break: keep-all; overflow-wrap: break-word; }
/* 上のword-break:keep-allは「短いラベル文」が変な位置で折り返されるのを防ぐためのものだが、
   スペースを含まない1つの単語（＝正解のお題そのもの）に効かせてしまうと、逆に長い単語が
   1文字も折り返せず画面の外へはみ出す原因になる（「きゅうきゅうしゃ」等、10文字を超える
   お題もある）。正解発表の文字だけは、必要ならどこでも折り返せるように戻しておく。 */
#finalAnswer { word-break: break-all; overflow-wrap: break-word; max-width: 100%; box-sizing: border-box; text-align: center; line-height: 1.15; }
/* 正解発表の「〇〇さんが正解！」（#winnerAnnounce）、最終結果一覧の名前
   （.f-nameは下で定義）も、#finalAnswerと同じ理由で長い名前だと折り返せずはみ出すことが
   あるため、同じ対策をしておく。 */
#winnerAnnounce { word-break: break-all; overflow-wrap: break-word; max-width: 100%; box-sizing: border-box; text-align: center; line-height: 1.15; }

/* ロビー画面 */
/* align-items:center のままだと、画面より縦に長いときに上側がスクロールでも
   見えなくなってしまう（はみ出した分が上下にちぎれ、下側しか読めない）。
   align-items:flex-start にして子要素側で margin:auto 縦センタリングすると、
   入りきる時は中央、入りきらない時は上からきちんとスクロールして見える。 */
#lobbyScreen { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 1; }
.lobby-box {
    background: #ffffff;
    padding: clamp(14px, 3.2vh, 32px) clamp(20px, 4vw, 36px); border-radius: 18px; width: 90%; max-width: 420px; text-align: center; box-sizing: border-box; margin: auto 0;
    border: 1px solid rgba(60,50,120,0.08); box-shadow: 0 10px 30px rgba(60,50,120,0.12);
}
.lobby-box h2 { font-weight: 700; font-size: clamp(14px, 2vh, 17px); letter-spacing: 1px; margin: clamp(2px, 0.6vh, 4px) 0; }
.room-code-big { font-size: clamp(28px, 6vh, 54px); font-weight: 900; color: #ff8a3d; letter-spacing: clamp(3px, 0.9vh, 7px); margin: clamp(0px, 0.4vh, 4px) 0; }
.lobby-list { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; text-align: left; background: #f7f8fd; border-radius: 10px; padding: clamp(5px, 1vh, 10px); margin: clamp(4px, 1vh, 10px) 0; max-height: clamp(46px, 10vh, 130px); overflow-y: auto; }
.lobby-list .user-chip { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 12px; background: #ffffff; border: 2px solid rgba(60,50,120,0.12); border-radius: 20px; font-weight: 600; font-size: 14px; }
.lobby-list .user-chip.me { box-shadow: 0 0 0 3px rgba(60,50,120,0.18); }
/* ホストだけに見える「×」ボタン：入ったつもりで入れていない子などを一覧から消せる */
.user-chip-kick { width: 20px; height: 20px; padding: 0; border: none; border-radius: 50%; background: rgba(60,50,120,0.12); color: #4d5085; font-weight: 900; font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.user-chip-kick:active { background: #ef5f6b; color: #fff; }
.color-picker { margin: clamp(2px, 0.5vh, 6px) 0 clamp(4px, 1vh, 8px) 0; }
.color-picker .field-label { text-align: center; margin-bottom: 4px; }
/* 色は基本12色で、幅にまかせて折り返すと8個+4個のように段ごとの数がバラバラに
   なって見づらいので、必ず6個ずつ・きれいに2段になるようグリッドで固定する
   （人数が多くて12色を超えたときは、そのまま自然に3段目以降へ折り返す）。 */
.color-swatch-row { display: grid; grid-template-columns: repeat(6, auto); justify-content: center; gap: 8px 10px; }
/* 黒などの暗い色は、まわりが白いぶん同じ大きさでも大きく見える錯視（放射錯視）が起きるので、
   暗い色だけ --sizeAdj を掛けてわずかに小さく描画し、見た目の大きさをそろえる。 */
.color-swatch { position: relative; --sizeAdj: 1; width: calc(clamp(22px, 3.6vh, 32px) * var(--sizeAdj)); height: calc(clamp(22px, 3.6vh, 32px) * var(--sizeAdj)); border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; padding: 0; }
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.selected { border-color: #2c2a4a; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #2c2a4a; }
.color-swatch.selected:hover { transform: scale(1.1); }
/* チェックマークは自分（丸のボタン）を基準にflexで中央そろえする。
   .taken の「×」と同じ組み方にすることで、枠との中心ずれが出ないようにしている。 */
.color-swatch.selected::after {
    content: '✓';
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 14px; line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
.color-swatch.taken { opacity: 0.3; cursor: not-allowed; filter: grayscale(60%); }
.color-swatch.taken::after {
    content: '×';
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}
.color-swatch.taken:hover { transform: none; }
.lobby-host-controls { border-top: 1px solid rgba(60,50,120,0.12); margin-top: clamp(4px, 1.2vh, 14px); padding-top: clamp(4px, 1.2vh, 14px); }
.host-controls-grid { display: flex; flex-direction: column; }
.field { text-align: left; margin-bottom: clamp(3px, 0.9vh, 10px); break-inside: avoid; -webkit-column-break-inside: avoid; }
.field-label { font-size: clamp(12px, 1.7vh, 15px); margin-top: clamp(2px, 0.5vh, 6px); font-weight: 700; }
/* ボタンをタップして選ぶ方式。プルダウンだと選び間違えやすい子どもでも、
   大きなボタンで「今どれが選ばれているか」がひと目でわかるようにする。
   サイズはvhのclampで画面の高さに応じてなめらかに拡大縮小し、
   余裕がある画面ではより大きく、低い画面では自動で小さくなって必ず収まる。 */
.choice-group { display: flex; flex-wrap: wrap; gap: 6px; margin: clamp(2px, 0.6vh, 6px) 0; }
/* 「むずかしさ」はボタン数が増えても（都道府県を足したときなど）ボタン1個ぶんの
   幅を下回らない範囲で、入る数だけ自動で列を増やす。個数が変わっても、また
   ウィンドウの横幅が変わっても、そのつど収まりよく並べ直される。 */
#difficultyGroup { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(112px, 100%), 1fr)); flex-wrap: initial; }
/* 「とてもむずかしい」など長めの文字が2×2の幅の中で折り返して読みにくくならないよう、
   このグループだけ少し文字を小さくして、なるべく1行におさまるようにする。 */
#difficultyGroup .choice-btn { font-size: clamp(11px, 1.7vh, 14px); padding-left: clamp(4px, 1vw, 10px); padding-right: clamp(4px, 1vw, 10px); }
/* 「終わりかた」の選択ボタンと「ひとり何回描く？」のステッパーの高さがそろって見えるよう、
   同じ --ctrl-h を両方の高さの基準にする（片方だけ数値を変えても揃わなくなるので注意）。 */
:root { --ctrl-h: clamp(34px, 5.4vh, 46px); }
.choice-btn {
    flex: 1 1 0; min-width: 90px; min-height: var(--ctrl-h); box-sizing: border-box;
    padding: clamp(5px, 1.1vh, 12px) clamp(8px, 1.2vw, 14px); border-radius: 10px; border: 2px solid #e4e6f5;
    background: #f7f8fd; color: #2c2a4a; font-size: clamp(12px, 2vh, 17px); font-weight: 700; line-height: 1.3;
    font-family: 'Zen Maru Gothic', sans-serif; text-align: center;
    box-shadow: 0 2px 0 rgba(0,0,0,0.05); transition: transform 0.08s ease;
    display: flex; align-items: center; justify-content: center;
}
.choice-btn:active { transform: translateY(2px); }
.choice-btn.selected {
    border-color: #ff8a3d; background: #fff3e8; color: #a34c00;
    box-shadow: 0 0 0 3px rgba(255,138,61,0.25), 0 2px 0 rgba(0,0,0,0.05);
}
/* 2人だけの部屋では「対戦」は選べない（1人が描いて1人が当てるだけになってしまうため）ので、
   ボタンごと薄くして押せないようにする。押せない理由が一目で分かるよう、うっすら文字を添える。 */
.choice-btn.disabled { opacity: 0.4; pointer-events: none; box-shadow: none; position: relative; }
.stepper { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 1.4vh, 14px); margin: clamp(2px, 0.6vh, 6px) 0; background: #f7f8fd; border-radius: 10px; min-height: var(--ctrl-h); box-sizing: border-box; padding: 0 clamp(8px, 1.2vw, 14px); }
.stepper-btn {
    width: var(--ctrl-h); height: var(--ctrl-h); border-radius: 50%; border: none; background: #ff8a3d; color: #fff;
    font-size: clamp(15px, 2.6vh, 26px); font-weight: 900; flex-shrink: 0; box-shadow: 0 2px 0 rgba(0,0,0,0.15);
}
.stepper-btn:active { transform: translateY(2px); box-shadow: none; }
.stepper-value { font-size: clamp(15px, 2.6vh, 28px); font-weight: 900; min-width: clamp(36px, 5.8vh, 76px); text-align: center; }
/* パソコンなど横幅にゆとりがある画面では、項目を2列にならべて縦長になりすぎないようにする */
@media (min-width: 640px) {
    .lobby-box { max-width: 680px; }
    /* むずかしさ（2段）の右にあそびかた・お題チェンジを詰め、
       終わりかたとひとり何回描く？／何分で終了？は同じ行の高さにそろえる。 */
    .host-controls-grid {
        display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px;
        grid-template-areas:
            "difficulty mode"
            "difficulty allow"
            "endtype rounds";
    }
    #difficultyField { grid-area: difficulty; }
    #modeField { grid-area: mode; }
    #allowChangeField { grid-area: allow; }
    #endTypeField { grid-area: endtype; }
    #roundsField, #timeField { grid-area: rounds; }
    .choice-btn { min-width: 110px; white-space: nowrap; }
}
/* ウィンドウを縦に小さくしたとき（ブラウザの高さそのものが低いとき）は、
   vhベースのclampだけでは足りずに部屋づくり画面がスクロール必須になることがある
   ので、高さのメディアクエリで余白・文字・ボタンの高さをさらに詰める。
   （横幅は十分あるのに縦だけ低い＝ウィンドウを小さくしたときを想定） */
@media (max-height: 620px) {
    .lobby-box { padding: clamp(8px, 2vh, 18px) clamp(16px, 3.2vw, 30px); margin: auto 0; }
    .lobby-box h2 { font-size: clamp(11px, 1.6vh, 14px); margin: 2px 0; }
    .room-code-big { font-size: clamp(20px, 4.6vh, 38px); margin: 0; letter-spacing: clamp(2px, 0.6vh, 5px); }
    .lobby-list { padding: clamp(3px, 0.8vh, 8px); margin: clamp(2px, 0.7vh, 6px) 0; max-height: clamp(34px, 7vh, 80px); }
    .color-swatch { width: calc(clamp(18px, 2.8vh, 28px) * var(--sizeAdj)); height: calc(clamp(18px, 2.8vh, 28px) * var(--sizeAdj)); }
    .lobby-host-controls { margin-top: clamp(2px, 0.8vh, 8px); padding-top: clamp(2px, 0.8vh, 8px); }
    .field { margin-bottom: clamp(2px, 0.6vh, 6px); }
    .field-label { font-size: clamp(10px, 1.4vh, 13px); margin-top: clamp(1px, 0.3vh, 4px); }
    :root { --ctrl-h: clamp(26px, 4.4vh, 38px); }
    .choice-btn { font-size: clamp(10px, 1.7vh, 14px); padding: clamp(3px, 0.9vh, 8px) clamp(6px, 1vw, 10px); }
    #difficultyGroup .choice-btn { font-size: clamp(9.5px, 1.5vh, 12px); }
}
/* さらに低いときは、見出しなど無くても困らないものから省いてスペースを作る */
@media (max-height: 460px) {
    .lobby-box h2 { display: none; }
    .color-picker .field-label { display: none; }
}
.btn {
    padding: 15px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 16px;
    width: 100%; box-sizing: border-box; margin-top: 8px; font-family: 'Zen Maru Gothic', sans-serif;
    box-shadow: 0 5px 0 rgba(0,0,0,0.15); transition: transform 0.08s ease, box-shadow 0.08s ease; letter-spacing: 1px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
.btn-orange { background: #ff8a3d; color: #2a1500; }
.btn-danger { background: #ef5f6b; color: #3f0d12; }
.btn-sub { background: #eef1fb; color: #4d5085; box-shadow: 0 4px 0 rgba(0,0,0,0.06); font-size: 14px; font-weight: 500; }
.waiting-note { opacity: 0.85; font-size: 14px; margin-top: 10px; color: #6b6f9a; }

/* ゲーム画面 */
#gameStage { display: none; position: fixed; inset: 0; z-index: 1; }
#stage { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; padding: 56px 8px 90px 8px; transition: padding 0.15s ease; }
/* スマホでキーボードを開いている間は、キャンバス（とお題表示）を上へスライドして、
   キーボードのうしろに隠れる前のイラストが少しでも見えるようにする（サイズは変えない）。
   #stageはflex-direction:columnなので、縦位置の起点はjustify-contentで決まる。 */
#stage.kbd-open { justify-content: flex-start; }
#canvasBox { position: relative; max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; background: white; box-shadow: 0 4px 24px rgba(60,50,120,0.25); border-radius: 6px; overflow: hidden; }
canvas, #viewer img { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
canvas { touch-action: none; -webkit-user-select: none; user-select: none; }
#sharedImg:not([src]), #sharedImg[src=""] { opacity: 0; }
/* 問題ごとのカウントダウン（#limitTimer）は、左右の中身の量に関係なく常にバーの
   ど真ん中に来てほしいので、グリッドの列で真ん中に寄せるのではなく、#infoBar自体を
   基準にposition:absoluteで左右中央に固定する（左右のテキスト量で中央がずれない）。
   左（描いている人）と右（ゲーム終了までのカウント・点数）は、ふつうに横に並べるだけ。 */
#infoBar {
    position: fixed; top: 0; left: 0; width: 100%; background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
    padding: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; z-index: 3000;
    font-weight: 500; border-bottom: 1px solid rgba(60,50,120,0.1); color: #2c2a4a;
}
/* 「描いている人：〇〇さん」はもともと折り返し表示（狭い画面では2行になる）でよいので、
   幅が足りないときはこちら側が縮む・折り返す側になるようにする。 */
/* 中央のカウントダウン（position:absoluteで常にどまん中）に長い名前がぶつからないよう、
   「描いている人」側だけ最大42%までしか広がれないようにする（折り返して縦に伸びる分には
   問題ないので、ここは幅だけ制限する）。右側（終了までのカウント・点数）は文字量が
   もともと少なく中央にぶつかる心配がないので、幅は制限せず自然な大きさのままにする。 */
/* 部屋番号は「描いている人」の横に並べると、まん中に固定表示される問題ごとの
   カウントダウン（#limitTimer）と重なりやすくなるので、横にではなく上に
   小さく重ねて表示する（横幅を追加でとらないようにする）。 */
#infoBarLeft { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; max-width: 52%; }
#roomCodeBadge { flex-shrink: 0; background: #eef1fb; color: #4d5085; font-weight: 700; font-size: 10px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
#drawerDisplay { color: #1a9e8f; font-weight: 700; text-align: left; padding-left: 10px; min-width: 0; box-sizing: border-box; }
/* スマホ幅では「描いている人：」と名前が同じ行にあると窮屈なので、名前だけ次の行に
   落として2行にする（自然な折り返しまかせだと途中の変な位置で改行されることがあるため、
   ここではっきり名前の直前で改行させる）。パソコンなど横に余裕がある画面では1行のまま。 */
@media (max-width: 900px) { #drawerNameSpan { display: block; } }
#infoBarRight { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-right: 10px; }
#scoreArea { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#myScoreDisplay { color: #ff8a3d; font-weight: 700; }
#limitTimer {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: #ef5f6b; color: white; font-size: 22px; font-weight: 700; padding: 2px 15px; border-radius: 10px; min-width: 50px; text-align: center;
}
/* 「時間で終了」のときだけ出す、ゲーム全体があと何分何秒で終わるかの表示。
   問題ごとの残り時間（#limitTimer・赤）とは別物とわかるよう、色を変えている。
   狭い画面では点数などと幅を取り合って縮むことがあるが、overflow:hiddenを
   付けておくことで、はみ出した文字が枠の外の白地に重なって読めなくなる
   （白文字が白背景で見えなくなる）のを防ぎ、枠の中で「…」に省略させる。 */
#gameEndTimer { background: #7c6bff; color: white; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 10px; min-width: 50px; max-width: 40vw; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* お題はキャンバス自体の下部中央に小さく重ねて表示し、キャンバスをできるだけ
   大きく取れるようにする（別スペースを確保しない）。 */
#odaiGhost { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); max-width: 90%; box-sizing: border-box; text-align: center; font-size: 13px; font-weight: 700; color: rgba(120, 30, 100, 0.8); background: rgba(255,255,255,0.9); border: 1px solid rgba(120, 30, 100, 0.25); padding: 3px 14px; border-radius: 14px; pointer-events: none; z-index: 5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#odaiGhost:empty { display: none; padding: 0; border: none; }
#hintDisplay { position: fixed; top: 55px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; z-index: 3000; background: rgba(255,255,255,0.92); padding: 5px 15px; border-radius: 20px; min-height: 30px; box-shadow: 0 4px 16px rgba(60,50,120,0.15); }
#changeOdaiBtn { position: fixed; top: 55px; right: 12px; z-index: 3200; padding: 8px 16px; border-radius: 20px; background: #7c6bff; color: #fff; font-weight: 700; font-size: 13px; border: 2px solid #fff; box-shadow: 0 4px 14px rgba(60,50,120,0.25); }
#hintLabel { font-weight: 700; font-size: 18px; color: #ff8a3d; margin-right: 5px; }
.hint-dot { width: 18px; height: 18px; border: 2px solid #a9adda; border-radius: 50%; background: rgba(60,50,120,0.06); }
.hint-dot.small { width: 12px; height: 12px; }
.hint-char { min-width: 18px; height: 18px; padding: 0 3px; border: 2px solid #ff8a3d; border-radius: 8px; background: #fff3e6; color: #ff8a3d; font-weight: 800; font-size: 14px; line-height: 14px; display: flex; align-items: center; justify-content: center; box-sizing: content-box; }
#judgeEffect { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: 900; z-index: 10000; pointer-events: none; display: none; text-shadow: 0 0 20px rgba(0,0,0,0.25); font-family: 'Zen Maru Gothic', sans-serif; }
#wrongGuessBubble { position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(-6px) scale(0.85); z-index: 3600; background: #ffffff; border: 3px solid #ff5c5c; border-radius: 20px; padding: 8px 20px; font-weight: 800; font-size: 17px; color: #d40000; box-shadow: 0 6px 18px rgba(60,50,120,0.22); opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; white-space: nowrap; }
#wrongGuessBubble::after { content: ''; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); border-width: 0 10px 12px 10px; border-style: solid; border-color: transparent transparent #ff5c5c transparent; }
#wrongGuessBubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
#oshiiBubble { position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(-6px) scale(0.85); z-index: 3600; background: #ffffff; border: 3px solid #29b36b; border-radius: 20px; padding: 8px 20px; font-weight: 800; font-size: 17px; color: #128a4d; box-shadow: 0 6px 18px rgba(60,50,120,0.22); opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; white-space: nowrap; }
#oshiiBubble::after { content: ''; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); border-width: 0 10px 12px 10px; border-style: solid; border-color: transparent transparent #29b36b transparent; }
#oshiiBubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
/* 「わかった！」（答えている人）と「お題チェンジ！」（描いている人）のふきだしは、
   #wrongGuessBubble・#oshiiBubbleと同じ形だが、色が押した人ごとに変わる
   （わかった＝その人自身の色、お題チェンジ＝チェンジボタンと同じ紫）ので、
   CSS変数(--bubble-color)にしてJS側（showGotItBubble/showOdaiChangeBubble）が
   表示するたびに指定する形にしておく。 */
#gotItBubble, #odaiChangeBubble { position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(-6px) scale(0.85); z-index: 3600; background: #ffffff; border: 3px solid var(--bubble-color, #3ed6c6); border-radius: 20px; padding: 8px 20px; font-weight: 800; font-size: 17px; color: var(--bubble-color, #3ed6c6); box-shadow: 0 6px 18px rgba(60,50,120,0.22); opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; white-space: nowrap; }
#gotItBubble::after, #odaiChangeBubble::after { content: ''; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); border-width: 0 10px 12px 10px; border-style: solid; border-color: transparent transparent var(--bubble-color, #3ed6c6) transparent; }
#gotItBubble.show, #odaiChangeBubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
/* パソコンなど横に余裕がある画面では、まちがえた答えをその人の名前タグから吹き出しで出す。
   人数が増えても分かりやすいよう、上下中央ぞろえではなく、左上を起点に上から順に
   ならべる（左に入りきらない人数のときだけ、右側にも上から続けてならべる）。 */
.player-sidebar { position: fixed; top: 66px; display: flex; flex-direction: column; gap: 14px; z-index: 5200; max-width: 30vw; }
.player-sidebar.left { left: 10px; align-items: flex-start; }
.player-sidebar.right { right: 10px; align-items: flex-end; }
.player-tag { position: relative; background: #ffffff; border: 3px solid #ccc; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: 14px; box-shadow: 0 3px 10px rgba(60,50,120,0.15); white-space: nowrap; max-width: 30vw; }
.player-tag-name { display: inline-block; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.player-tag.me { box-shadow: 0 0 0 3px rgba(60,50,120,0.22), 0 3px 10px rgba(60,50,120,0.15); }
/* ふきだしの色は、まちがい（赤）・おしい（緑）・わかった（押した人の色）・
   お題チェンジ（紫）で変わるので、こちらもCSS変数(--tag-bubble-border /
   --tag-bubble-text)にして、JS側の各show*Bubble関数が表示するたびに指定する。
   （.oshiiクラスは使わなくなったが、過去にキャッシュされたCSSと混ざらないよう
   念のため互換の意味あいで扱いは変えていない＝もう参照されていない） */
.tag-bubble { position: absolute; top: 50%; transform: translateY(-50%) scale(0.85); background: #ffffff; border: 3px solid var(--tag-bubble-border, #ff5c5c); border-radius: 16px; padding: 6px 14px; font-weight: 800; font-size: 14px; color: var(--tag-bubble-text, #d40000); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; box-shadow: 0 4px 14px rgba(60,50,120,0.2); }
.player-sidebar.left .tag-bubble { left: calc(100% + 12px); }
.player-sidebar.right .tag-bubble { right: calc(100% + 12px); }
.tag-bubble.show { opacity: 1; transform: translateY(-50%) scale(1); }
.tag-bubble::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%); border-width: 8px; border-style: solid; }
.player-sidebar.left .tag-bubble::after { left: -16px; border-color: transparent var(--tag-bubble-border, #ff5c5c) transparent transparent; }
.player-sidebar.right .tag-bubble::after { right: -16px; border-color: transparent transparent transparent var(--tag-bubble-border, #ff5c5c); }
@media (max-width: 900px) { .player-sidebar { display: none; } }
#kbdWrapper { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.72); backdrop-filter: blur(3px); z-index: 5000; display: none; flex-direction: column; padding: 5px 0 env(safe-area-inset-bottom) 0; border-top: 3px solid #3ed6c6; box-shadow: 0 -4px 20px rgba(60,50,120,0.12); }
.input-display { display: flex; width: 95%; margin: 5px auto; gap: 8px; align-items: center; position: relative; }
/* min-width:0 がないと、テキスト入力欄が中身の初期サイズより縮められず、
   せまい画面で右にはみ出してしまう（キーボードグリッドと同じ理由）。 */
#answerInput { flex: 1; min-width: 0; height: 50px; font-size: 28px; text-align: center; border-radius: 10px; border: 2px solid #3ed6c6; background: white; color: #22204a; font-weight: 700; }
.k-key { background: #eef1fb; color: #2c2a4a; border: none; border-radius: 8px; height: 48px; font-size: 20px; font-weight: 700; box-shadow: 0 3px 0 rgba(60,50,120,0.15); display: flex; align-items: center; justify-content: center; min-width: 0; }
.k-key:active { transform: translateY(2px); box-shadow: none; background: #dfe3f7; }
.k-close-x { position: absolute; top: -45px; right: 0; background: #eef1fb; color: #2c2a4a; border: 2px solid #ffffff; box-shadow: 0 2px 10px rgba(60,50,120,0.2); border-radius: 50%; width: 40px; height: 40px; font-size: 24px; display: flex; align-items: center; justify-content: center; }
.k-main-area { display: flex; direction: rtl; padding: 5px; gap: 5px; }
/* min-width:0 がないと、グリッドの列が中身の文字サイズより縮められず、
   せまいスマホ画面では横にはみ出してしまう。 */
.k-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; flex: 1; min-width: 0; }
/* ひらがな/カタカナ切り替え・濁点/小さい文字・決定ボタンは、細いグリッドの1マスに
   詰め込むと文字がはみ出すので、専用の少し広めの側の列に縦に3つ並べる。 */
.k-side { width: 52px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; }
.k-dakuten { flex-direction: column; font-size: 14px; line-height: 1.2; height: 52px; }
.k-type-toggle { height: 48px; font-size: 22px; font-weight: 900; }
/* いま「ひらがな」か「カタカナ」かひと目でわかるよう、切り替えボタンの色をモードごとに変える */
.k-type-toggle.mode-hira { background: #bff2ea; color: #0c6b5c; }
.k-type-toggle.mode-kana { background: #ffd9b3; color: #a34c00; }
/* せまい画面では、キーひとつひとつが小さくなりすぎないようすき間を詰める */
@media (max-width: 480px) {
    .k-main-area { padding: 3px; gap: 3px; }
    .k-grid { gap: 2px; }
    .k-key { font-size: 15px; }
    .k-special { font-size: 10px; }
    .k-side { width: 42px; }
    .k-dakuten { font-size: 11px; height: 44px; }
    .k-type-toggle { height: 40px; font-size: 17px; }
}
.k-special { background: #dfe3f7; font-size: 16px; }
.k-bs { background: #ef5f6b; color: white; width: 100px; height: 50px; font-size: 16px; }
.k-decide { background: #3ed6c6; color: #04302b; flex: 1; font-size: 22px; }
#drawTools { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.97); z-index: 4000; display: none; flex-direction: column; padding: 10px 5px env(safe-area-inset-bottom) 5px; gap: 10px; border-top: 2px solid rgba(60,50,120,0.1); box-shadow: 0 -4px 20px rgba(60,50,120,0.12); }
/* 名前タグを左右に出す画面幅では、キーボードや色パレットを内側にせばめて、名前と重ならないようにする */
@media (min-width: 901px) {
    #kbdWrapper { left: 150px; width: calc(100% - 300px); border-radius: 20px 20px 0 0; }
    #drawTools { left: 150px; width: calc(100% - 300px); border-radius: 20px 20px 0 0; }
    /* パソコン版は画面が横に広いぶん、canvasBox（4:3）も縦方向に大きく表示されやすく、
       スマホ版と同じキーボードの不透明度・ぼかしだと、描いている絵の半分以上が
       隠れてしまっていた（スマホ版は縦長の画面でキャンバスの下に余白ができやすく、
       隠れる範囲がもともと少ない）。パソコン版のときだけ、キーボードの背景とキーの
       背景をもっと透かして、答えを入力しながら絵を見えるようにする。 */
    #kbdWrapper { background: rgba(255,255,255,0.32); backdrop-filter: blur(1px); }
    .k-key { background: rgba(238,241,251,0.5); }
    .k-key:active { background: rgba(223,227,247,0.75); }
}
.tool-panel { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.tool-divider { display: none; }
/* パソコン版は横幅に余裕があるので、色・ペン/消しゴム・太さ・全消しを全部横一列にまとめる */
@media (min-width: 901px) {
    .tool-panel { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 16px; }
    .tool-divider { display: block; width: 2px; align-self: stretch; min-height: 36px; background: rgba(60,50,120,0.12); }
}
.color-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; justify-items: center; max-width: 500px; margin: 0 auto; }
/* パソコン版は横幅に余裕があるので、パレットを折り返さず横一列にする（.color-rowの基本ルールより後ろに置いて上書きする） */
@media (min-width: 901px) {
    .color-row { grid-template-columns: repeat(14, 1fr); max-width: 640px; margin: 0; }
}
.color-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid rgba(60,50,120,0.15); }
.color-btn.active { transform: scale(1.2); border-color: #ff8a3d; box-shadow: 0 0 10px #ff8a3d; }
.tool-row-bottom { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; min-height: 60px; }
.mode-btn { width: 44px; height: 44px; padding: 0; border-radius: 12px; background: #eef1fb; color: #2c2a4a; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; }
.mode-btn.active { background: #ff8a3d; color: #2a1500; border-color: #fff; box-shadow: 0 0 0 3px rgba(255,138,61,0.35); }
/* 塗りつぶしボタンは選択中、アイコンの色は変えず、ボタンの背景そのものを今の色にする
   （どの色を選んでいるか一目でわかるように）。枠は濃い紺で固定。背景色・アイコン色（黒の
   時だけ白にする）はJS側（updateActiveColor）でインラインスタイルとして設定する。 */
#fillBtn.active { border-color: #2c2a4a; box-shadow: 0 0 0 3px rgba(44,42,74,0.18); }
.size-dot-wrap { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #eef1fb; border: 2px solid transparent; box-sizing: border-box; }
.size-dot { border-radius: 50%; background: #2c2a4a; flex-shrink: 0; }
.size-dot-wrap.active { background: #fff; border-color: #2c2a4a; box-shadow: 0 0 0 3px rgba(44,42,74,0.18); }
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#countdownOverlay { z-index: 15000; background: rgba(255,255,255,0.97); color: #2c2a4a; }
/* 実際の背景色は#answerBgSplit（JSで正解者の色ぶんに分割してぬる）が
   常に画面全体をおおうので、ここでは透明にしておく。 */
#answerOverlay { background: transparent; color: #2a1500; }
#finalOverlay { background: rgba(255,255,255,0.97); overflow-y: auto; padding-top: 50px; justify-content: flex-start; z-index: 20000; color: #2c2a4a; }
#finalOverlay h1 { font-weight: 900; letter-spacing: 1px; color: #ff8a3d; }
.final-row { background: #f7f8fd; border-radius: 16px; padding: 20px 30px; margin: 10px; width: 85%; max-width: 500px; display: flex; align-items: center; border: 2px solid rgba(60,50,120,0.08); box-sizing: border-box; color: #2c2a4a; }
.f-rank-1 { background: rgba(255, 138, 61, 0.18); border-color: #ff8a3d; }
.f-rank-2 { background: rgba(62, 214, 198, 0.15); border-color: #3ed6c6; }
.f-rank-3 { background: rgba(124, 107, 255, 0.15); border-color: #7c6bff; }
.f-rank { font-size: 32px; font-weight: 900; color: #ff8a3d; margin-right: 25px; }
.f-name { flex: 1; min-width: 0; font-size: 24px; font-weight: 700; text-align: left; word-break: break-all; overflow-wrap: break-word; }
.f-score { font-size: 22px; font-weight: 700; opacity: 0.85; }
.final-row-enter { opacity: 0; transform: translateY(28px) scale(0.9); }
.final-row-enter.final-row-visible { opacity: 1; transform: translateY(0) scale(1); transition: opacity 0.45s ease, transform 0.45s cubic-bezier(.34,1.56,.64,1); }
@keyframes totalScorePop { 0% { transform: scale(1); } 45% { transform: scale(1.2); } 100% { transform: scale(1); } }
.total-pop { animation: totalScorePop 0.5s ease; }
/* 通信が切れているときのお知らせバー。ゲームがフリーズしたように見える原因が
   通信状態にあることが分かるように、どの画面よりも上に出す。 */
#connBanner {
    display: none; position: fixed; top: 0; left: 0; width: 100%; z-index: 30000;
    background: #d9364a; color: #fff; text-align: center; font-weight: 700;
    font-size: clamp(12px, 3vw, 15px); padding: 8px 10px; box-sizing: border-box;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
/* 「けっか発表！」の合図：結果がスッと出るのではなく、いったんこの大きな
   合図を出してから最終結果の中身を出すことで、終わった感を出す */
#finalIntro {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0.4);
    font-size: clamp(34px, 9vw, 62px); font-weight: 900; color: #ff8a3d;
    text-shadow: 0 4px 14px rgba(0,0,0,0.18); opacity: 0; z-index: 21000;
    text-align: center; pointer-events: none; white-space: nowrap;
}
#finalIntro.final-intro-show { animation: finalIntroPop 0.9s cubic-bezier(.34,1.56,.64,1) forwards; }
#finalIntro.final-intro-hide { animation: finalIntroFadeOut 0.4s ease forwards; }
@keyframes finalIntroPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
@keyframes finalIntroFadeOut { to { opacity: 0; transform: translate(-50%, -50%) scale(0.85); } }
/* 協力モードの合計得点：中央にどんと目立たせる */
.coop-total-wrap { display: flex; flex-direction: column; align-items: center; margin: 4px 0 22px; }
.coop-total-label { font-size: 16px; font-weight: 700; color: #7c6bff; letter-spacing: 3px; margin-bottom: 6px; }
.coop-total-number { font-size: clamp(52px, 15vw, 92px); font-weight: 900; color: #3ed6c6; line-height: 1; text-shadow: 0 4px 12px rgba(62,214,198,0.3); }
/* 協力モードの個人得点：人数が多くてもスクロールしなくて済むように、小さめの
   チップを横になみだかたちに折り返して表示する（1人ずつ縦積みの大きな行にはしない）。 */
.coop-score-wrap { width: 100%; max-width: 640px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; padding: 0 14px; box-sizing: border-box; transition: opacity 0.6s ease; }
.coop-score-chip { display: flex; align-items: center; gap: 6px; background: #f7f8fd; border: 2px solid rgba(60,50,120,0.08); border-radius: 20px; padding: 6px 14px; white-space: nowrap; }
.coop-score-chip .chip-name { font-size: 14px; font-weight: 700; color: #2c2a4a; }
.coop-score-chip .chip-score { font-size: 14px; font-weight: 800; color: #ff8a3d; }
/* 人数が少ないとき（8人まで）は、1人ずつチップがポンと出てきて合計に
   加算されていく演出にする。出てくる瞬間が分かるよう、ふわっと拡大しながら現れる。 */
.coop-chip-enter { opacity: 0; transform: scale(0.6) translateY(6px); transition: opacity 0.3s ease, transform 0.35s cubic-bezier(.34,1.56,.64,1); }
.coop-chip-enter.coop-chip-visible { opacity: 1; transform: scale(1) translateY(0); }
</style>
</head>
<body>

<!-- 通信が切れているときに出すお知らせ。ゲーム中に画面が止まって見える原因が
     通信状態にあることに気づけるようにする（どの画面の上にも出す）。 -->
<div id="connBanner">🔌 通信が切れています…つながるのを待っています</div>

<!-- ロビー画面 -->
<div id="lobbyScreen">
    <div class="lobby-box">
        <h2 style="margin-top:0">部屋番号</h2>
        <div class="room-code-big" id="lobbyRoomCode">----</div>
        <div>この番号をお友だちに伝えてね</div>
        <div class="lobby-list" id="lobbyUserList"></div>

        <div class="color-picker">
            <div class="field-label">自分の色を決めてね</div>
            <div class="color-swatch-row" id="colorSwatchRow"></div>
        </div>

        <div id="hostControls" class="lobby-host-controls" style="display:none;">
            <div class="host-controls-grid">
                <div class="field" id="difficultyField">
                    <div class="field-label">むずかしさ</div>
                    <div class="choice-group" id="difficultyGroup"></div>
                    <input type="hidden" id="difficultySel">
                </div>

                <div class="field" id="endTypeField">
                    <div class="field-label">終わりかた</div>

<script>
// フォントの読み込みが確定する（読み込み終わる／またはあきらめる）まで
// 中身を隠しておき、確定してから表示することで、表示中にフォントが
// 入れ替わって見える「がたつき」を防ぐ（index.htmlと同じ対策）。
(function revealWhenFontsReady() {
    function reveal() { document.documentElement.classList.add('fonts-ready'); }
    if (document.fonts && document.fonts.ready) {
        Promise.race([
            document.fonts.ready,
            new Promise(resolve => setTimeout(resolve, 500))
        ]).then(reveal);
    } else {
        reveal();
    }
})();

// 「もどる」で他の画面からこのページにbfcache（そのままの状態）で戻ってくると、
// Firebaseとのつながりが止まったままになることがあるため、まるごと読み込み直す。
window.addEventListener('pageshow', (event) => {
    if (event.persisted) { location.reload(); }
});

const config = FIREBASE_CONFIG;
firebase.initializeApp(config);
const db = firebase.database();
// Safariのプライベートブラウズ等でindexedDBが使えないと、Firebase Authのログイン状態の
// 保存処理がフリーズすることがある（index.htmlと同じ理由）。ログイン状態をページを
// またいで覚えておく必要はないので、メモリ上だけに置く方式にしてindexedDBを使わないようにする。
try { firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => {}); } catch (e) {}

// 通信が切れているあいだは、正解の判定や部屋を閉じる操作などがサーバーに
// 届かず、画面が止まって見えることがある。".info/connected" はFirebaseが
// 用意している特別なパスで、サーバーとの接続が本当につながっているかどうかを
// 教えてくれるので、それを見て切れているときだけお知らせバーを出す。
// スマホの一部の回線・ブラウザでは、実際にはデータの読み書きがちゃんとできて
// いるのに、この".info/connected"だけ一瞬false→trueを細かく繰り返す（本当は
// 困っていないのにバーだけ赤いままに見える）ことがあるらしいので、少しの
// 切断ならバーを出さないようにする（切れた瞬間ではなく、しばらく切れたままの
// ときだけ知らせる）。もどったときはすぐにバーを消す。
let isFirebaseOnline = true;
let connBannerShowTimer = null;
db.ref('.info/connected').on('value', snap => {
    isFirebaseOnline = snap.val() === true;
    const banner = document.getElementById('connBanner');
    if (!banner) return;
    clearTimeout(connBannerShowTimer);
    if (isFirebaseOnline) {
        banner.style.display = 'none';
    } else {
        connBannerShowTimer = setTimeout(() => { banner.style.display = 'block'; }, 4000);
    }
});
// あか・だいだい・うすだいだい・きいろ・きみどり・みどり・みずいろ・あお・むらさき・ももいろ・ちゃいろ・くろ の12色
const BASE_PLAYER_COLORS = ["#e53935","#fb8c00","#ffb74d","#fdd835","#9ccc65","#43a047","#29b6f6","#1e88e5","#9575cd","#f06292","#8d6e63","#333333"];
function hexToHsl(hex) {
    const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    let h, s; const l = (max+min)/2;
    if (max === min) { h = s = 0; }
    else {

    if (!confirm('べつのお題にする？')) return;
    const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
    const data = snap.val();
    if (!data) return;
    const difficulty = (data.settings || {}).difficulty || 'かんたん';
    const usedWords = { ...(data.usedWords || {}) };
    const currentWord = (data.state || {}).correctAnswer;
    if (currentWord) usedWords[currentWord] = true; // もう出さないようにする
    const nextWord = pickWord(difficulty, usedWords);
    usedWords[nextWord] = true;
    trackWordPassed(currentWord);
    trackWordShown(nextWord);

    const updates = { usedWords: usedWords, 'state/correctAnswer': nextWord, 'state/correctCount': 0 };
    Object.keys(data.users || {}).forEach(uid => { updates[`users/${uid}/isCorrect`] = false; });
    // 「お題チェンジ！」を自分（描いている人）の名前タグから伝える。
    updates['state/odaiChange'] = { ts: Date.now() };
    // お題が変わったので、それまでの「わかった！」表示はいったん役目を終えたことにする
    // （前のお題への「わかった」が、新しいお題にも当てはまるとは限らないため）。
    updates['state/gotIt'] = null;

    canvasGen++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    await db.ref(`casual_rooms/${myRoom}`).update(updates);
    upload();
}

/* ===== ホスト用：ゲーム進行エンジン ===== */
function onEndTypeChange() {
    const endType = document.getElementById('endTypeSel').value;
    document.getElementById('roundsField').style.display = (endType === 'rounds') ? 'block' : 'none';
    document.getElementById('timeField').style.display = (endType === 'time') ? 'block' : 'none';
    broadcastPendingSettings();
}

// ホストがロビーで設定をえらんでいる内容を、他のこどもの端末にもリアルタイムで見せる
function broadcastPendingSettings() {
    if (!isHost) return;
    const pendingSettings = {
        difficulty: document.getElementById('difficultySel').value,
        gameMode: document.getElementById('modeSel').value,
        endType: document.getElementById('endTypeSel').value,
        roundsPerPerson: parseInt(document.getElementById('roundsIn').value) || 1,
        timeLimitMinutes: parseInt(document.getElementById('timeLimitIn').value) || 5,
        allowChangeOdai: document.getElementById('allowChangeSel').value === '1'
    };
    authReady.then(() => { db.ref(`casual_rooms/${myRoom}/pendingSettings`).set(pendingSettings); });
}

async function hostStartGame() {
    const difficulty = document.getElementById('difficultySel').value;
    let gameMode = document.getElementById('modeSel').value; // "competitive" | "coop"
    const endType = document.getElementById('endTypeSel').value; // "rounds" | "time"
    const roundsPerPerson = parseInt(document.getElementById('roundsIn').value) || 1;
    const timeLimitMinutes = parseInt(document.getElementById('timeLimitIn').value) || 5;
    const allowChangeOdai = document.getElementById('allowChangeSel').value === '1';
    const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
    const data = snap.val();
    // ホストのタブを誤って複製していた場合、古いほうのタブからは開始できないようにする
    if (data.hostSessionId && data.hostSessionId !== hostSessionId) {
        alert('このタブは別の画面でホストとして使われているようです。ホストの画面を1つにしぼってからやり直してください。');
        return;
    }
    const uids = Object.keys(data.users || {});
    if (uids.length < 2) { alert('2人以上あつまってからはじめてね'); return; }
    // 念のための最終チェック：2人ちょうどなら対戦は成立しないので、画面上のボタンを
    // 塞み忘れていた・タイミングがずれていた等があっても、ここで確実に協力にする
    if (uids.length === 2 && gameMode === 'competitive') gameMode = 'coop';

    const turnOrder = shuffleArray(uids);
    const gameEndAt = (endType === "time") ? (Date.now() + timeLimitMinutes * 60000) : 0;
    const firstWord = pickWord(difficulty, {});
    const firstDrawer = turnOrder[0];
    trackWordShown(firstWord);

    const updates = {
        settings: { difficulty: difficulty, roundsPerPerson: roundsPerPerson, gameMode: gameMode, endType: endType, timeLimitMinutes: timeLimitMinutes, allowChangeOdai: allowChangeOdai },
        turnOrder: turnOrder,
        usedWords: { [firstWord]: true },
        // turnIndexは「いまturnOrderの何番目の人が描いているか」を覚えておく場所。
        // ラウンド数のかけ算(turnOrder.length × roundsPerPerson)で総回数を決める
        // 方式だと、あとから人が増えたとき（途中参加）にうまく対応できないため、
        // 代わりに「ひとりずつの残り回数」(users/{uid}/roundsRemaining)を見ながら
        // 順番にまわす方式にしている（hostAdvanceRoundを参照）。
        progress: { roundNumber: 0, turnIndex: 0, gameEndAt: gameEndAt },
        state: {
            phase: "countdown",
            currentDrawer: firstDrawer,
            drawerName: (data.users[firstDrawer] || {}).name || "???",
            correctAnswer: firstWord,
            countdown: 3,
            timeLeft: ROUND_SECONDS,
            correctCount: 0,
            active: false
        }
    };
    if (endType === "rounds") {
        turnOrder.forEach(uid => {
            updates[`users/${uid}/roundsRemaining`] = (uid === firstDrawer) ? (roundsPerPerson - 1) : roundsPerPerson;
        });
    }
    await db.ref(`casual_rooms/${myRoom}`).update(updates);
    hostRunCountdown();
}

// カウントダウン・残り時間は「あと何回タイマーが鳴ったか」ではなく、終わる
// 予定時刻（ここではcountdownEndAt/roundEndAt）からの実時間の差で計算する。
// ブラウザのタブを最小化・バックグラウンド化するとsetIntervalが間引かれて
// 1秒ごとに正しく呼ばれなくなることがあるが、実時間から逆算していれば、
// 間引かれてしばらくしてからまとめて発火した時でも正しく「もう終わっている」と
// 気づけて、ラウンドが止まったままにならない。
function hostRunCountdown() {
    const stateRef = db.ref(`casual_rooms/${myRoom}/state`);
    const countdownEndAt = Date.now() + 3000;
    stateRef.update({ phase: "countdown", countdown: 3, countdownEndAt, active: false });
    if (hostTimerInterval) clearInterval(hostTimerInterval);
    hostTimerInterval = setInterval(() => {
        const remaining = Math.max(0, Math.ceil((countdownEndAt - Date.now()) / 1000));
        if (remaining <= 0) {
            clearInterval(hostTimerInterval);
            hostTimerInterval = null;
            const roundEndAt = Date.now() + ROUND_SECONDS * 1000;
            stateRef.update({ phase: "playing", countdown: 0, active: true, roundEndAt, timeLeft: ROUND_SECONDS });
            hostRunRoundTimer(roundEndAt);
        } else {
            stateRef.update({ countdown: remaining });
        }
    }, 1000);
}

// 以前はここで毎秒Firebaseにonce('value')で読みにいってから残り時間を計算していたが、
// その読み込み（ネットワークの往復）にかかる時間が1秒の間隔より長くなることがあると、
// 前の回の読み込みがまだ終わらないうちに次の回が始まってしまい（setIntervalは前の回の
// 完了を待たずに次を発火する）、書きこみの順番が前後して「表示が止まって見える」
// 「一気に2つぶん減って見える」という不具合になっていた。roundEndAt（終わる予定時刻）は
// ラウンド中ずっと変わらないので、呼び出し側から受け取ってこの中だけで覚えておけば、
// 毎秒Firebaseを読みに行く必要はない（正解が出た時の即終了は、リアルタイムリスナー側
// （state.correctCountの変化に反応するほう）がすでに別に処理しているので、ここで
// あらためて見にいかなくても問題ない）。
function hostRunRoundTimer(roundEndAt) {
    if (hostTimerInterval) clearInterval(hostTimerInterval);
    let lastWrittenTimeLeft = null;
    hostTimerInterval = setInterval(() => {
        // 「時間で終了」のゲーム全体の制限時間がきたら、そのお題のカウントダウンが
        // まだ残っていても、そこで区切って終わらせる（roomSettings/currentGameEndAtは
        // 全クライアント共通のリスナーで常に最新に保たれているグローバル変数）。
        const gameTimeUp = roomSettings.endType === 'time' && currentGameEndAt && Date.now() >= currentGameEndAt;
        const remaining = Math.max(0, Math.ceil((roundEndAt - Date.now()) / 1000));
        if (gameTimeUp || remaining <= 0) {
            clearInterval(hostTimerInterval);
            hostTimerInterval = null;
            hostFinishRound();
            return;
        }
        if (remaining !== lastWrittenTimeLeft) {
            lastWrittenTimeLeft = remaining;
            db.ref(`casual_rooms/${myRoom}/state/timeLeft`).set(remaining);
        }
    }, 1000);
}

async function hostFinishRound() {
    // 見回りタイマー(hostRunRoundTimer)とリアルタイムリスナー側の即時判定が、通信の
    // タイミングによってはほぼ同時にどちらもこの関数を呼んでしまうことがある。その場合
    // ラウンドが二重に進み、だれかの番がまるごと飛ばされてしまうため、すでに進行中なら
    // 何もしない（この鍵はhostAdvanceRoundが実際に次のラウンドを始めるまで保持する）。
    if (roundFinishing) return;
    roundFinishing = true;
    const resultEndAt = Date.now() + 3000;
    await db.ref(`casual_rooms/${myRoom}/state`).update({ phase: "result", active: false, resultEndAt });
    resultTimeout = setTimeout(() => {
        resultTimeout = null;
        roundFinishing = false;
        hostAdvanceRound();
    }, 3000);
}

async function hostAdvanceRound() {
    // 何らかの理由で前のラウンドの「進行中」の鍵が残っていても、次のラウンドは
    // 必ず新しく進められるようにしておく（念のための保険）。
    roundFinishing = false;
    const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
    const data = snap.val();
    if (!data) return; // 部屋がすでに消えている

    const nextRoundNumber = (data.progress && data.progress.roundNumber || 0) + 1;
    const resetUpdates = {};
    Object.keys(data.users || {}).forEach(uid => {
        resetUpdates[`users/${uid}/isCorrect`] = false;
        resetUpdates[`users/${uid}/image`] = "";
    });

    const endType = (data.settings || {}).endType || "rounds";
    const isTimeUp = endType === "time" && data.progress && data.progress.gameEndAt && Date.now() >= data.progress.gameEndAt;

    const turnOrder = data.turnOrder || [];
    const users = data.users || {};
    const prevTurnIndex = (data.progress && typeof data.progress.turnIndex === 'number') ? data.progress.turnIndex : -1;
    let nextDrawer = null;
    let nextTurnIndex = prevTurnIndex;

    // 切断中（connected===false）の人は、いったん順番を飛ばす。回線が切れている子が
    // 次の描き手に選ばれてしまうと、だれも描けないままそのラウンドが丸ごと時間切れに
    // なってしまうため。roundsRemainingは減らさないので、回線が戻ればまた順番が
    // まわってくる（連絡が取れないまま何ラウンドも損をし続けることはない）。
    const isConnected = uid => !users[uid] || users[uid].connected !== false;

    if (endType === "rounds") {
        // turnOrderを最大1周ぶんだけたどって、まだ残り回数(roundsRemaining)が
        // 残っている次の人をさがす（0回になった人は飛ばす）。誰も残っていなければ
        // 全員描き終わったということなので、そこでゲーム終了にする。
        // （途中参加した人がいる場合、turnOrderは末尾に追加されているだけなので、
        //   この探索方法のままふつうに合流できる。）
        for (let step = 1; step <= turnOrder.length; step++) {
            const idx = (prevTurnIndex + step) % turnOrder.length;
            const uid = turnOrder[idx];
            const remaining = (users[uid] && users[uid].roundsRemaining) || 0;
            if (remaining > 0 && isConnected(uid)) { nextDrawer = uid; nextTurnIndex = idx; break; }
        }
    } else if (turnOrder.length) {
        // 時間で終了：均等に順番がまわるよう、turnOrderをそのまま1つ進める。
        // 途中参加した人も、参加した時点からこのくり返しに自然に加わる。
        for (let step = 1; step <= turnOrder.length; step++) {
            const idx = (prevTurnIndex + step) % turnOrder.length;
            const uid = turnOrder[idx];
            if (isConnected(uid)) { nextDrawer = uid; nextTurnIndex = idx; break; }
        }
    }

    if (isTimeUp || !nextDrawer) {
        resetUpdates['state'] = {
            phase: "final", currentDrawer: "", drawerName: "", correctAnswer: "",
            countdown: 0, timeLeft: 0, correctCount: 0, active: false
        };
        await db.ref(`casual_rooms/${myRoom}`).update(resetUpdates);
        return;
    }

    const nextWord = pickWord(data.settings.difficulty, data.usedWords || {});
    trackWordShown(nextWord);
    resetUpdates['progress/roundNumber'] = nextRoundNumber;
    resetUpdates['progress/turnIndex'] = nextTurnIndex;
    resetUpdates['usedWords/' + nextWord] = true;
    if (endType === "rounds") {
        resetUpdates[`users/${nextDrawer}/roundsRemaining`] = ((users[nextDrawer] && users[nextDrawer].roundsRemaining) || 0) - 1;
    }
    resetUpdates['state'] = {
        phase: "countdown",
        currentDrawer: nextDrawer,
        drawerName: (data.users[nextDrawer] || {}).name || "???",
        correctAnswer: nextWord,
        countdown: 3,
        timeLeft: ROUND_SECONDS,
        correctCount: 0,
        active: false
    };
    await db.ref(`casual_rooms/${myRoom}`).update(resetUpdates);
    hostRunCountdown();
}

// 最終結果画面の「同じ部屋でもう一度あそぶ」。部屋番号・参加者はそのままに、
// 得点や正解状況だけリセットしてロビー（設定画面）に戻す。ロビーに戻れば、
// index.html側のjoinRoom()が「phaseがlobbyの部屋にしか参加できない」という
// 条件を満たすので、新しいメンバーもこのタイミングで参加できるようになる。
async function hostPlayAgain() {
    if (!confirm('同じ部屋でもう一度あそびますか？')) return;
    const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
    const data = snap.val();
    if (!data) return; // 部屋がすでに消えている
    const updates = {};
    Object.keys(data.users || {}).forEach(uid => {
        updates[`users/${uid}/score`] = 0;
        updates[`users/${uid}/isCorrect`] = false;
        updates[`users/${uid}/image`] = "";
        updates[`users/${uid}/answerOrder`] = null;
        updates[`users/${uid}/roundsRemaining`] = null;
    });
    updates['turnOrder'] = [];
    updates['usedWords'] = {};
    updates['progress'] = { roundNumber: 0, turnIndex: -1 };
    updates['state'] = {
        phase: "lobby",
        currentDrawer: "",
        drawerName: "",
        correctAnswer: "",
        countdown: 3,
        timeLeft: ROUND_SECONDS,
        correctCount: 0,
        active: false,
        wrongGuess: null,
        oshii: null
    };
    try {
        await db.ref(`casual_rooms/${myRoom}`).update(updates);
    } catch (e) {
        alert('通信状態がよくないため、もう一度あそぶ準備ができませんでした。もう一度お試しください。');
    }
}

async function hostCloseRoom() {
    if (!confirm('部屋を閉じますか？')) return;
    // 部屋を「本当に削除できてから」onDisconnect（切断時に自動で部屋を削除する
    // しくみ）を解除する。逆の順番だと、もし削除がなにかの理由で失敗したときに
    // 自動削除のしくみだけ止まってしまい、部屋がずっと残って他の人が
    // メインメニューに戻れなくなる（これが今回の不具合の原因）。
    try {
        await db.ref(`casual_rooms/${myRoom}`).remove();
    } catch (e) {
        alert('通信状態がよくないため、部屋を閉じられませんでした。もう一度お試しください。');
        return;
    }
    try { await db.ref(`casual_rooms/${myRoom}`).onDisconnect().cancel(); } catch (e) {}
    sessionStorage.removeItem('friends_room');
    location.href = 'index.html';
}

// ロビー画面の「メインメニューへもどる」。ホストが抜けると部屋自体が続けられなく
// なるので、ホストのときは部屋ごと閉じる（hostCloseRoomと同じ動作）。
// 参加者のときは自分だけ一覧から消して、部屋には残った人たちで続けられるようにする。
async function leaveRoomToMenu() {
    if (isHost) { await hostCloseRoom(); return; }
    if (!confirm('部屋を出てメインメニューにもどりますか？')) return;
    // 自分をユーザー一覧から消してから、切断時の自動削除（onDisconnect）を
    // 解除する。こちらは自分自身のメインメニューへの移動には失敗してもかまわない
    // ようにtry/catchで守っているが、それでも「本当に消せてから解除する」
    // 順番にしておくことで、削除に失敗したときに自動削除のしくみが
    // 生きたままになる（=いずれにせよ一覧からいなくなる）ようにする。
    try {
        await db.ref(`casual_rooms/${myRoom}/users/${myUid}`).remove();
        await db.ref(`casual_rooms/${myRoom}/users/${myUid}`).onDisconnect().cancel();
    } catch (e) {}
    sessionStorage.removeItem('friends_room');
    location.href = 'index.html';
}

let usersData = {};
let roomSettings = {};

// 「入ったつもりが入れていない」まま名前だけ残ってしまった子がいたときのために、

// 参加者にまだ色がついていない場合（古いセッションなど）だけ、使われていない色を割りあてる
let colorAssignAttempted = false;
function ensureMyColor(users) {
    if (colorAssignAttempted) return;
    if (!users[myUid]) return; // 自分の参加情報がまだ（または既に）無いなら、色だけの空の情報を作らない
    if (users[myUid] && users[myUid].color) return;
    colorAssignAttempted = true;
    const taken = Object.entries(users).filter(([uid]) => uid !== myUid).map(([, u]) => u.color).filter(Boolean);
    const color = pickRandomColor(taken);
    db.ref(`casual_rooms/${myRoom}/users/${myUid}/color`).set(color);
}

// 黒に近いとても暗い色は、白い背景の上では同じ大きさでも大きく見える（放射錯視）ので、
// その色だけ少し小さく描画して他の丸と見た目の大きさをそろえる。
function isVeryDarkColor(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
    return luminance < 90;
}
// 指定した要素の文字が、指定したコンテナの横幅の中で一行に収まる最大のフォントサイズを
// 大きい方から順にさがして適用する（正解発表画面の「〇〇さんが正解！」「答えは〇〇」で使う）。
// どのサイズでも収まらないくらい長い文字列は、CSS側のword-break:break-allにまかせて
// 折り返す（このサイズ探し自体は失敗にせず、いちばん小さいサイズのまま折り返させる）。
function fitTextOneLine(el, containerEl, sizes) {
    const cs = getComputedStyle(containerEl);
    const availableWidth = containerEl.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
    el.style.whiteSpace = 'nowrap';
    let chosenSize = sizes[sizes.length - 1];
    for (const size of sizes) {
        el.style.fontSize = size + 'px';
        if (el.scrollWidth <= availableWidth) { chosenSize = size; break; }
    }
    el.style.fontSize = chosenSize + 'px';
    el.style.whiteSpace = 'normal';
}
// 正解画面の背景色（正解した人の色）に対して、白文字・こい色文字のどちらが読みやすいかを決める
function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
}
function pickReadableTextColor(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
    return luminance < 140 ? '#ffffff' : '#2a1500';
}
function renderColorPicker(users) {
    const row = document.getElementById('colorSwatchRow');
    row.innerHTML = '';
    const myColor = users[myUid] && users[myUid].color;
    const takenByOthers = Object.entries(users).filter(([uid]) => uid !== myUid).map(([, u]) => u.color).filter(Boolean);
    // 12人を超えている部屋では、その分だけ選べる色も増やす
    const palette = getPalette(Object.keys(users).length);
    palette.forEach(c => {
        const sw = document.createElement('button');
        sw.type = 'button';
        const isSelected = c === myColor;
        const isTaken = takenByOthers.includes(c) && !isSelected;
        sw.className = 'color-swatch' + (isSelected ? ' selected' : '') + (isTaken ? ' taken' : '');
        sw.style.background = c;
        if (isVeryDarkColor(c)) sw.style.setProperty('--sizeAdj', '0.88');
        sw.title = isSelected ? 'いまの色' : (isTaken ? 'ほかの人がつかっています' : 'この色にする');
        if (!isTaken) {
            sw.onclick = () => db.ref(`casual_rooms/${myRoom}/users/${myUid}/color`).set(c);
        }
        row.appendChild(sw);
    });
}

// ゲーム中、パソコンなど横に余裕がある画面では名前タグを左右に出す（スマホでは非表示・CSSで制御）。
// 人が入れかわった時だけ作り直し、それ以外は名前や色だけ更新して、表示中のふきだしを消さないようにする。
// 左右で上下ふたつに分けるのではなく、まず左側の上から順にならべ、画面の高さに
// 入りきらなくなった分だけ右側にも上からならべる（見やすさを優先し、キーボードや
// 描画ツールと重ならないよう、下側には一定の余白を残しておく）。
let lastSidebarKey = "";
function computeSidebarCapacity() {
    const topOffset = 66;
    const bottomReserve = 170; // 描画ツール・キーボードとかぶらないための余白
    const tagStep = 54; // タグ1個ぶんの高さ＋すき間のめやす
    return Math.max(3, Math.floor((window.innerHeight - topOffset - bottomReserve) / tagStep));
}
function renderPlayerSidebar(data) {
    const uids = (data.turnOrder && data.turnOrder.length) ? data.turnOrder : Object.keys(usersData);
    const capacity = computeSidebarCapacity();
    const key = uids.join(",") + "|" + capacity;
    const left = document.getElementById('sidebarLeft');
    const right = document.getElementById('sidebarRight');
    if (key !== lastSidebarKey) {
        lastSidebarKey = key;
        left.innerHTML = ""; right.innerHTML = "";
        uids.forEach((uid, i) => {
            const u = usersData[uid];
            if (!u) return;
            const tag = document.createElement('div');
            tag.className = 'player-tag' + (uid === myUid ? ' me' : '');
            tag.id = `playerTag-${uid}`;
            tag.style.borderColor = u.color || '#ccc';
            tag.style.color = u.color || '#2c2a4a';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'player-tag-name';
            nameSpan.id = `playerTagName-${uid}`;
            nameSpan.innerText = u.name;
            tag.appendChild(nameSpan);
            const bubble = document.createElement('div');
            bubble.className = 'tag-bubble';
            bubble.id = `tagBubble-${uid}`;
            tag.appendChild(bubble);
            (i < capacity ? left : right).appendChild(tag);
        });
    } else {
        uids.forEach(uid => {
            const u = usersData[uid];
            const tag = document.getElementById(`playerTag-${uid}`);
            const nameSpan = document.getElementById(`playerTagName-${uid}`);
            if (!u || !tag) return;
            tag.style.borderColor = u.color || '#ccc';
            tag.style.color = u.color || '#2c2a4a';
            if (nameSpan) nameSpan.innerText = u.name;
        });
    }
}

// プルダウンだと子どもが選び間違えやすいので、代わりに大きなボタンをタップして
// えらぶ方式にしている。ボタンをクリックしたら、これまで通りのhidden inputの
// .valueにその値を入れて、'change'イベントを飛ばすことで、あとの処理（設定を
// 他の端末に伝える等）はいままでと同じしくみのまま使い回せるようにする。
function initChoiceGroup(groupId, hiddenId, defaultValue) {
    const group = document.getElementById(groupId);
    const hidden = document.getElementById(hiddenId);
    if (!hidden.value) hidden.value = defaultValue;
    function refresh() {
        [...group.querySelectorAll('.choice-btn')].forEach(b => b.classList.toggle('selected', b.dataset.value === hidden.value));
    }
    group.querySelectorAll('.choice-btn').forEach(b => {
        b.onclick = () => {
            if (b.classList.contains('disabled')) return; // 例：2人部屋の「対戦」（押せないようにCSSでも塞いである）
            hidden.value = b.dataset.value;
            refresh();
            hidden.dispatchEvent(new Event('change'));
        };
    });
    refresh();
}

// 「対戦」はふたり以上のチームに分かれてこそ成立する遊びかたで、2人ちょうどだと
// 「1人が描いて1人が当てるだけ」になってしまう。2人のときは対戦ボタンを押せなくし、
// もし対戦が選ばれたままだったら自動で協力に切りかえる（ホストの画面でのみ判定・操作する）。
function updateModeAvailability(userCount) {
    if (!isHost) return;
    const competitiveBtn = document.querySelector('#modeGroup .choice-btn[data-value="competitive"]');
    const modeSel = document.getElementById('modeSel');
    if (!competitiveBtn || !modeSel) return;
    const shouldDisable = userCount === 2;
    competitiveBtn.classList.toggle('disabled', shouldDisable);
    if (shouldDisable && modeSel.value === 'competitive') {
        modeSel.value = 'coop';
        document.querySelectorAll('#modeGroup .choice-btn').forEach(b => b.classList.toggle('selected', b.dataset.value === modeSel.value));
        modeSel.dispatchEvent(new Event('change'));
    }
}
// 「回数」「時間」も、数字入力の代わりに－／＋の大きなボタンで増減できるようにする。
function stepSetting(id, delta, min, max) {
    const hidden = document.getElementById(id);
    const display = document.getElementById(id + 'Display');
    let v = (parseInt(hidden.value) || min) + delta;
    v = Math.max(min, Math.min(max, v));
    hidden.value = v;
    if (display) display.innerText = v;
    hidden.dispatchEvent(new Event('change'));
}

authReady.then(() => {
    if (isHost) {
        // このタブ自身のID。あとで「今このタブが、Firebase上の現在のホストと一致しているか」を
        // 確認するのに使う（ホストのタブを誤って複製したときの対策。hostStartGame()を参照）。
        hostSessionId = 'h_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        db.ref(`casual_rooms/${myRoom}/hostSessionId`).set(hostSessionId);
        // 部屋ごと自動削除するonDisconnectは、以前はここで最初から常時有効にしていたが、
        // それだとゲーム中に一瞬だけ回線が切れただけ（Wi-Fiの瞬断・タブレットの通信が
        // 一時的に止まる等）でも部屋が消えてしまい、みんなが急にメインメニューに
        // 戻されてしまう不具合があった。ロビー中（まだ誰も遊んでいない間）だけ有効にし、
        // ゲームが始まったら解除する（下のリスナー内、参加者側と同じしくみ）。
    }

    // 自分の接続状態（connected）を、フェーズに関わらずゲーム中ずっと正確に保つ。
    // 再接続のたびにこのコールバックが呼び直されるのがFirebaseの標準的な使い方で、
    // そのたびにonDisconnectも新しくつけ直す必要がある（切断ごとに1回しか効かないため）。
    db.ref('.info/connected').on('value', csnap => {
        if (csnap.val() === true) {
            const connRef = db.ref(`casual_rooms/${myRoom}/users/${myUid}/connected`);
            connRef.set(true);
            connRef.onDisconnect().set(false);
        }
    });

    db.ref(`casual_rooms/${myRoom}`).on('value', snap => {
        const data = snap.val();
        // data.stateが無い場合も「部屋が無い」のと同じあつかいにする。ロビー中に
        // 更新（リロード）すると、切断のごく一瞬だけ「部屋ごと自動削除」onDisconnectが
        // 働いてしまい、部屋がまるごと消えることがある。ところが、このタブ自身が
        // 再接続時に書き込む一部の項目（hostSessionId・users/{uid}/connected・
        // ホストの設定プレビューpendingSettingsなど）は、それとは無関係に自動で
        // 書き込まれてしまうため、「stateも設定も無いのに、その3つの項目だけが
        // ある空っぽの部屋」が残ってしまい、!dataのチェックだけではすり抜けて、
        // 中身の無いゲーム画面が表示されつづけるおかしな不具合になっていた。
        if (!data || !data.state) {
            // 気づいた側で、その空っぽの残骸を片付けてから戻す
            // （そのままだと、この部屋番号がずっと使えなくなってしまうため）。
            if (data) { db.ref(`casual_rooms/${myRoom}`).remove().catch(() => {}); }
            location.href = 'index.html';
            return;
        }

        const state = data.state || {};
        usersData = data.users || {};
        roomSettings = data.settings || {};
        currentGameEndAt = (data.progress && data.progress.gameEndAt) || 0;
        currentProgressRoundNumber = (data.progress && typeof data.progress.roundNumber === 'number') ? data.progress.roundNumber : 0;
        // 「もう今回は正解ずみ」フラグを、サーバー側の実際の状態と常に合わせておく
        // （次のラウンドでisCorrectがリセットされたら、こちらも自動で戻る）。
        myAnswerConfirmed = !!(usersData[myUid] && usersData[myUid].isCorrect);

        if (usersData[myUid]) {
            everConfirmedPresent = true;
        } else if (everConfirmedPresent) {
            // 一度は一覧にいたはずの自分が消えている（ホストに出された、または
            // 通信の影響で参加情報が消えてしまった等）。入口の画面にもどす。
            alert('この部屋から出されたか、参加情報が見つからなくなりました。もう一度お試しください。');
            location.href = 'index.html';
            return;
        } else if (!isHost && state.phase === "lobby") {
            // ゲームが始まる前（ロビー中）に更新（リロード）すると、リロードの一瞬の
            // 切断で「ロビー中に切れたら自分の参加情報を自動で消す」しくみ
            // （onDisconnect、上の selfDisconnectArmed のしくみ）が働いてしまい、
            // 再接続して最初にこのリスナーが呼ばれた時点で、もう自分がusersに
            // いないことがある。ゲームはまだ始まっていない＝まだ何も失われていない
            // ので、「出された」という驚かせるアラートは出さず、静かに入口の画面へ
            // 戻す（ここでこのままrenderLobby()まで進んでしまうと、名前もスコアも
            // 無い空っぽの自分だけの参加情報がensureMyColor()で作られてしまい、
            // ロビー画面がおかしな見た目になっていた）。
            location.href = 'index.html';
            return;
        }

        // 参加者（ホスト以外）は、ロビーで待っている間だけ「切断されたら自分の
        // 名前を一覧から消す」しくみ（onDisconnect）を有効にしておく。こうすると、
        // タブを閉じる・電波が切れるなどでロビーを離れたときに、名前だけが
        // ずっと残ってしまう（他の子には見えるのに本人は入れない）不具合を防げる。
        // ゲームが始まったら、切断されても途中参加として復帰できるよう、いったん
        // このしくみを解除する（また「同じ部屋でもう一度あそぶ」でロビーに
        // もどったら、あらためて有効にする）。
        if (!isHost && usersData[myUid]) {
            if (state.phase === "lobby" && !selfDisconnectArmed) {
                selfDisconnectArmed = true;
                db.ref(`casual_rooms/${myRoom}/users/${myUid}`).onDisconnect().remove();
            } else if (state.phase !== "lobby" && selfDisconnectArmed) {
                selfDisconnectArmed = false;
                db.ref(`casual_rooms/${myRoom}/users/${myUid}`).onDisconnect().cancel();
            }
        }

        // ホストの「部屋ごと自動削除」も、参加者の上のしくみとまったく同じ理由・同じ形で
        // ロビー中だけ有効にする。ゲームが始まったら解除し、「同じ部屋でもう一度あそぶ」で
        // ロビーに戻ったら、あらためて有効にする。
        if (isHost) {
            if (state.phase === "lobby" && !hostDisconnectArmed) {
                hostDisconnectArmed = true;
                db.ref(`casual_rooms/${myRoom}`).onDisconnect().remove();
            } else if (state.phase !== "lobby" && hostDisconnectArmed) {
                hostDisconnectArmed = false;
                db.ref(`casual_rooms/${myRoom}`).onDisconnect().cancel();
            }
        }

        // ホストのタブを誤って複製したときの対策：Firebase上のhostSessionIdが自分のもの
        // でなくなっていたら、別のタブが「現在のホスト」になったということなので、
        // このタブはもう進行役をつとめない（タイマーを止めて、以降の自動進行をやめる）。
        const isStaleHostTab = isHost && data.hostSessionId && data.hostSessionId !== hostSessionId;
        if (isStaleHostTab) {
            if (hostTimerInterval) { clearInterval(hostTimerInterval); hostTimerInterval = null; }
        }

        isDrawer = (state.currentDrawer === myUid);
        currentIsPlaying = (state.phase === "playing" && state.active);

        // ホストがゲーム中にページを再読み込みすると、正解チェックや残り時間を進めている
        // hostTimerInterval（メモリ上のタイマー）が消えてしまい、だれかが正解しても
        // いつまでもラウンドが終わらなくなってしまう。ホストなのにタイマーが動いていない
        // ときは、いまのcountdown/playingの状態からタイマーを立てなおす。
        // （複製された古いホストタブでは、この進行役の処理いっさいを行わない）
        if (isHost && !isStaleHostTab) {
            if (!hostTimerInterval) {
                if (state.phase === "playing") {
                    // state.roundEndAtが無い（古いデータ等）ときのための保険：
                    // 今のtimeLeftから終わる予定時刻を逆算する
                    const roundEndAt = state.roundEndAt || (Date.now() + (state.timeLeft || ROUND_SECONDS) * 1000);
                    hostRunRoundTimer(roundEndAt);
                }
                else if (state.phase === "countdown") { hostRunCountdown(); }
            } else if (state.phase === "playing" && (state.correctCount || 0) >= 1) {
                // 1秒ごとの見回り（hostRunRoundTimer）を待たず、正解が入った瞬間に
                // すぐ次へ進める（見回り自体が端末の最小化などで間引かれても、
                // ここでなるべく早く反応できるようにする保険）。
                clearInterval(hostTimerInterval);
                hostTimerInterval = null;
                hostFinishRound();
            }
            // 正解発表（result）の3秒待ちの間にホストがリロードされると、その待ち時間を
            // 覚えていたsetTimeoutも消えてしまい、いつまでも次のラウンドに進まなくなって
            // しまう（countdown/playingは上ですでに復帰できるが、resultだけ漏れていた）。
            // state.resultEndAt（result開始時に書き込む予定終了時刻）から残り時間を計算し、
            // まだ誰も次へ進める予約をしていなければ、ここで立てなおす。
            if (state.phase === "result" && !resultTimeout && !roundFinishing) {
                roundFinishing = true;
                const remaining = Math.max(0, (state.resultEndAt || Date.now()) - Date.now());
                resultTimeout = setTimeout(() => {
                    resultTimeout = null;
                    roundFinishing = false;
                    hostAdvanceRound();
                }, remaining);
            }
        }

        document.getElementById('lobbyScreen').style.display = (state.phase === "lobby") ? "flex" : "none";
        const gameStageEl = document.getElementById('gameStage');
        const gameVisible = !(state.phase === "lobby" || state.phase === "final");
        gameStageEl.style.display = gameVisible ? "block" : "none";
        // ロビー画面の裏では display:none で幅0のままだったキャンバスのサイズ調整は、
        // このあとのupdateStageLayout()（このハンドラの最後）でまとめて行う
        document.getElementById('finalOverlay').style.display = (state.phase === "final") ? "flex" : "none";

        // 「時間で終了」のときだけ、ゲーム画面の間だけゲーム全体の残り時間バッジを出す
        const gameEndTimerEl = document.getElementById('gameEndTimer');
        if (gameVisible && roomSettings.endType === 'time' && currentGameEndAt) {
            gameEndTimerEl.style.display = 'block';
            updateGameEndTimerText();
        } else {
            gameEndTimerEl.style.display = 'none';
        }

        if (state.phase === "lobby") {
            // 「同じ部屋でもう一度あそぶ」でロビーに戻ってきたら、次にまた最終結果
            // （final）になったときに、けっか発表のアニメーションを最初からやり直せる
            // ようにしておく（このリセットが無いと、2回目の最終結果ではもう
            // renderFinal()自体が呼ばれず、くるくる回る演出が出なくなっていた）。
            finalAnimPlayed = false;
            renderLobby(data);
            return;
        }
        if (state.phase === "final") {
            if (!finalAnimPlayed) { finalAnimPlayed = true; renderFinal(); }
            return;
        }

        // ここから通常のゲーム画面
        const limitTimerEl = document.getElementById('limitTimer');
        if (currentIsPlaying && state.timeLeft !== undefined) {
            limitTimerEl.style.display = "block";
            limitTimerEl.innerText = state.timeLeft;
            limitTimerEl.style.background = state.timeLeft <= 10 ? "#ff0000" : "#ff3333";
        } else { limitTimerEl.style.display = "none"; }

        renderPlayerSidebar(data);

        // だれかが間違った答えを送ったら、ふきだしで数秒だけみんなに見せる（自分がまちがえたときも自分の名前タグから出す）
        const wg = state.wrongGuess;
        if (!wrongGuessInitialized) {
            // 途中参加・リロード直後は、過去の間違い表示を出さずに基準だけ合わせる
            wrongGuessInitialized = true;
            lastWrongGuessTs = wg ? wg.ts : 0;
        } else if (currentIsPlaying && wg && wg.ts > lastWrongGuessTs) {
            lastWrongGuessTs = wg.ts;
            showWrongGuessBubble(wg.uid, wg.name, wg.text || "");
        }

        // 描いている人が「おしい！」ボタンを押したら、その名前タグからふきだしを出す。
        // これは答えていない人たちへの手がかり（ヒント）として機能する。
        const og = state.oshii;
        if (!oshiiInitialized) {
            oshiiInitialized = true;
            lastOshiiTs = og ? og.ts : 0;
        } else if (currentIsPlaying && og && og.ts > lastOshiiTs) {
            lastOshiiTs = og.ts;
            showOshiiBubble(state.currentDrawer, og.name);
        }

        // 答えている人が「わかった！」ボタンを押したら、その人の名前タグからふきだしを出す。
        // oshii/wrongGuessは「最後の1件だけ」を覚える単一の値だが、こちらは複数人がほぼ
        // 同時に押しても互いを消し合わないよう、押した人ごと（uidをキーに）に記録・比較する。
        const gi = state.gotIt || {};
        if (!gotItInitialized) {
            gotItInitialized = true;
            Object.keys(gi).forEach(uid => { lastGotItTs[uid] = gi[uid] ? gi[uid].ts : 0; });
        } else if (currentIsPlaying) {
            Object.keys(gi).forEach(uid => {
                const entry = gi[uid];
                if (entry && entry.ts > (lastGotItTs[uid] || 0)) {
                    lastGotItTs[uid] = entry.ts;
                    showGotItBubble(uid, entry.name);
                }
            });
        }

        // 描いている人が「お題をチェンジ」したら、その人の名前タグから「お題チェンジ！」の
        // ふきだしを出す（answerCountがリセットされたことに気づきやすくするため）。
        const oc = state.odaiChange;
        if (!odaiChangeInitialized) {
            odaiChangeInitialized = true;
            lastOdaiChangeTs = oc ? oc.ts : 0;
        } else if (currentIsPlaying && oc && oc.ts > lastOdaiChangeTs) {
            lastOdaiChangeTs = oc.ts;
            showOdaiChangeBubble(state.currentDrawer);
        }

        if (state.phase !== lastStatePhase) {
            if (state.phase !== "playing") {
                closeKeyboard();
                document.getElementById('answerInput').value = "";
            }
            if (state.phase === "countdown") { canvasGen++; ctx.clearRect(0, 0, canvas.width, canvas.height); }
            if (state.phase === "result") { document.getElementById('judgeEffect').style.display = "none"; }
            lastStatePhase = state.phase;
        }

        document.getElementById('drawerNameSpan').innerText = state.drawerName ? state.drawerName + "さん" : "---";

        document.getElementById('countdownOverlay').style.display = (state.phase === "countdown") ? 'flex' : 'none';
        if (state.phase === "countdown") {
            const cdNameEl = document.getElementById('cdName');
            // ゲームの最初の1回目だけは「次は」ではなく「最初は」にする（まだ前の順番がないため）
            const isFirstRound = ((data.progress && data.progress.roundNumber) || 0) === 0;
            cdNameEl.innerText = `${isFirstRound ? '最初は' : '次は'} ${state.drawerName ? state.drawerName + 'さん' : '...'}`;
            // 次に描く人の色で文字色をそめて、だれの番か直感的にわかるようにする
            cdNameEl.style.color = (usersData[state.currentDrawer] && usersData[state.currentDrawer].color) || '#d98a00';
        }

        document.getElementById('answerOverlay').style.display = (state.phase === "result") ? 'flex' : 'none';
        if (state.phase === "result") {
            const answerContentEl = document.getElementById('answerContent');
            const winnerUsers = Object.values(usersData).filter(u => u.isCorrect);
            const winners = winnerUsers.map(u => u.name + "さん");

            // 正解・不正解がぱっと見てわかるよう、「〇〇さんが正解！」（いなければ
            // 「全員不正解」）をいちばん大きく最初に出す。答えそのものは、その下に
            // ひとまわり小さく添える形にする。
            const winnerAnnounceEl = document.getElementById('winnerAnnounce');
            winnerAnnounceEl.innerText = winners.length > 0 ? (winners.join('、') + 'が正解！') : '全員不正解...';
            // 正解者が1人だけなら、その人の色で表示して「だれが正解したか」を直感的に
            // わかるようにする（複数人・0人のときは、色の割りあてがあいまいになるので、
            // アプリの基本の差し色／控えめな色にしておく）。
            winnerAnnounceEl.style.color = winners.length === 1 ? (winnerUsers[0].color || '#ff8a3d')
                : (winners.length > 1 ? '#ff8a3d' : '#8a7a6a');

            const finalAnswerEl = document.getElementById('finalAnswer');
            const answerText = state.correctAnswer || "？";
            finalAnswerEl.innerText = answerText;

            // 以前は文字数だけを見て3段階でフォントサイズを決めていたが、濁点・拗音
            // （「ょ」「っ」等）を含む文字は数えかたによって見た目の横幅が変わるため、
            // 「ほっきょく」（5文字）は70pxのままだと一行に収まりきらず折り返すのに、
            // 「オオサンショウウオ」（9文字）は42pxで一行に収まる、という逆転が起きていた。
            // 文字数の目安ではなく、実際に今の画面幅で一行に収まるかどうかを測りながら、
            // 収まる最大のフォントサイズを大きい方から順にさがす（word-break:break-allは
            // CSS側に残してあるので、どのサイズでも収まらないくらい長いお題・名前は、
            // これまでどおり折り返して表示される）。「〇〇さんが正解！」の行も、名前の
            // 長さや人数で幅が変わるので、同じしくみでサイズを決める。
            fitTextOneLine(finalAnswerEl, answerContentEl, [54, 48, 42, 38, 34, 30, 27, 24]);
            fitTextOneLine(winnerAnnounceEl, answerContentEl, [44, 40, 36, 32, 28, 25, 22]);

            // 完全に同時のタイミングで複数人が正解したときは、みんな正解あつかいにして、
            // 画面の背景をその人数ぶんに等分し、それぞれの色でぬり分ける
            // （例：黒のAさんと赤のBさんが同時なら、画面を左右半分ずつ黒と赤にする）。
            // 正解した人がいなければ、だれかの色とまぎらわしくならないよう白のままにする。
            const bgSplit = document.getElementById('answerBgSplit');
            bgSplit.innerHTML = '';
            if (winnerUsers.length === 0) {
                const band = document.createElement('div');
                band.style.flex = '1';
                band.style.background = 'rgba(255,255,255,0.6)';
                bgSplit.appendChild(band);
            } else {
                winnerUsers.forEach(u => {
                    const band = document.createElement('div');
                    band.style.flex = '1';
                    band.style.background = hexToRgba(u.color || '#ffffff', 0.9);
                    bgSplit.appendChild(band);
                });
            }

            const resultImg = document.getElementById('resultImg');
            const drawnUser = usersData[state.currentDrawer] || {};
            // imageRoundが今のラウンド番号と一致する画像だけを信用する（回線が遅いと、
            // 前のラウンドの最後の描き戻しが、ラウンド交代のリセットより後に届くことがあるため）。
            const drawnSrc = (drawnUser.image && drawnUser.imageRound === currentProgressRoundNumber) ? drawnUser.image : "";
            if (drawnSrc) {
                if (resultImg.src !== drawnSrc) resultImg.src = drawnSrc;
                resultImg.style.display = 'block';
            } else {
                resultImg.removeAttribute('src');
                resultImg.style.display = 'none';
            }
        }

        document.getElementById('drawTools').style.display = (isDrawer && currentIsPlaying) ? 'flex' : 'none';
        // 答えている人（描いている人以外・まだ正解していない人）だけに見える2つのボタン。
        const isGuessingNow = currentIsPlaying && !isDrawer && !(usersData[myUid] && usersData[myUid].isCorrect);
        document.getElementById('toggleKbd').style.display = isGuessingNow ? 'block' : 'none';
        document.getElementById('gotItBtn').style.display = isGuessingNow ? 'block' : 'none';
        updateToggleKbdBtn();
        // 「おしい！」ボタンは#drawTools（描いている人のツール一式）の中に置いてあるので、
        // drawTools自体の表示・非表示（isDrawer && currentIsPlayingで切り替え）に
        // そのままついてくる。答えを入力する人ではなく、絵を描いている人だけに見える。
        document.getElementById('changeOdaiBtn').style.display = (isDrawer && currentIsPlaying && roomSettings.allowChangeOdai) ? 'block' : 'none';

        const viewer = document.getElementById('viewer');
        if (!isDrawer && (currentIsPlaying || state.phase === "result")) {
            viewer.style.display = 'block';
            const sImg = document.getElementById('sharedImg');
            const sharedDrawUser = usersData[state.currentDrawer] || {};
            // 同じ理由（回線遅延で前のラウンドの絵が後から届く）で、ラウンド番号が
            // 一致しない画像は「まだ届いていない」ものとしてあつかい、表示しない。
            const newSrc = (sharedDrawUser.image && sharedDrawUser.imageRound === currentProgressRoundNumber) ? sharedDrawUser.image : "";
            if (sImg.src !== newSrc) { if (!newSrc) sImg.removeAttribute('src'); else sImg.src = newSrc; }
        } else { viewer.style.display = 'none'; }

        // 「点数: 」ラベルはさいしゅう結果画面の「20点」表記に揃えつつ短くして、
        // 狭い画面で右側のバッジ（終了までのカウント）と幅を取り合わないようにする。
        document.getElementById('myScoreDisplay').innerText = `${(usersData[myUid] && usersData[myUid].score) || 0}点`;
        document.getElementById('odaiGhost').innerText = (isDrawer && currentIsPlaying) ? `お題： 「 ${state.correctAnswer} 」` : "";

        const hintBox = document.getElementById('hintDisplay'); hintBox.innerHTML = "";
        // 「都道府県」のお題だけは、最初の文字ヒントを出さないぶん、
        // 文字数の丸ヒントを少し早め（残り20秒）から出す。それ以外はこれまで通り残り40秒から。
        const hintStartSec = roomSettings.difficulty === "都道府県" ? 20 : 40;
        const showHint = currentIsPlaying && state.timeLeft <= hintStartSec && state.correctAnswer;
        // 残り20秒からは最初の1文字だけ実際の文字を見せる（それ以外は引き続き点のまま）。
        // ただし答えが1〜2文字しかないときは、1文字見せるとほぼ答えを教えてしまうのと
        // 同じになるので、文字数の丸だけにして、最初の文字は最後まで見せない。
        const answerLen = state.correctAnswer ? [...state.correctAnswer].length : 0;
        // 「都道府県」のお題だけは、最初の文字が答えとほぼ同じ意味になってしまう
        // （都道府県名は最初の文字だけでほぼ絞りこめるため）ので、ヒントで文字を見せない。
        const showFirstChar = state.timeLeft <= 20 && answerLen >= 3 && roomSettings.difficulty !== "都道府県";
        hintBox.style.display = showHint ? 'flex' : 'none'; // 中身が空でも枠(丸っぽい形)だけ表示されてしまうのを防ぐ
        if (showHint) {
            const label = document.createElement('div'); label.id = "hintLabel"; label.innerText = "ヒント："; hintBox.appendChild(label);
            [...state.correctAnswer].forEach((char, i) => {
                const isSmall = "ぁぃぅぇぉゃゅょっァィゥェォャュョッ".includes(char);
                if (i === 0 && showFirstChar) {
                    const chip = document.createElement('div');
                    chip.className = "hint-char" + (isSmall ? " small" : "");
                    chip.innerText = char;
                    hintBox.appendChild(chip);
                } else {
                    const dot = document.createElement('div');
                    dot.className = "hint-dot" + (isSmall ? " small" : "");
                    hintBox.appendChild(dot);
                }
            });
        }
        scheduleStageLayout();
    });
});
