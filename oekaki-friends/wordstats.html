<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>お題データ集計用｜お絵かきクイズ フレンズ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; touch-action: manipulation; -webkit-touch-callout: none; }
        body {
            margin: 0; color: #2c2a4a; font-family: 'Zen Maru Gothic', sans-serif;
            background: radial-gradient(circle at 20% 15%, #fffaf0 0%, #eef6ff 55%, #e3f7f2 100%);
            min-height: 100vh; padding: 20px 14px 60px; box-sizing: border-box;
        }
        h1 { font-size: clamp(18px, 4vw, 24px); text-align: center; margin: 6px 0 2px; }
        .sub { text-align: center; font-size: 13px; color: #6b6f9a; margin-bottom: 18px; }
        .panel {
            max-width: 900px; margin: 0 auto 16px; background: #ffffff; border-radius: 18px;
            padding: 14px 16px; box-shadow: 0 6px 20px rgba(60,50,120,0.08); box-sizing: border-box;
        }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
        .controls label { font-size: 13px; font-weight: 700; color: #4d5085; margin-right: 4px; }
        select, button {
            font-family: 'Zen Maru Gothic', sans-serif; font-size: 13px; font-weight: 700;
            border-radius: 10px; border: 1px solid rgba(60,50,120,0.18); padding: 7px 10px; background: #f7f8fd; color: #2c2a4a;
        }
        button { cursor: pointer; background: #eef1fb; }
        button.primary { background: #ff8a3d; color: #2a1500; border: none; }
        .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
        .stat-chip { background: #f7f8fd; border-radius: 12px; padding: 8px 14px; font-size: 12px; font-weight: 700; color: #4d5085; }
        .stat-chip b { font-size: 16px; color: #2c2a4a; display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
        thead th {
            position: sticky; top: 0; background: #fff; text-align: left; font-size: 12px; color: #6b6f9a;
            padding: 8px 6px; border-bottom: 2px solid #eef1fb; cursor: pointer; white-space: nowrap; user-select: none;
        }
        thead th.active { color: #ff8a3d; }
        tbody td { padding: 8px 6px; border-bottom: 1px solid #f4f4fb; vertical-align: middle; }
        tbody tr:hover { background: #fffaf0; }
        .word-cell { font-weight: 700; font-size: 14px; }
        .diff-badge {
            display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
            background: #eef1fb; color: #4d5085; margin-left: 6px; white-space: nowrap;
        }
        .rate-bar-wrap { display: flex; align-items: center; gap: 8px; min-width: 120px; }
        .rate-bar-bg { flex: 1; height: 8px; border-radius: 5px; background: #f0f1fa; overflow: hidden; min-width: 60px; }
        .rate-bar-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #ffce4d, #ff5c5c); }
        .rate-num { font-weight: 700; font-size: 12px; width: 42px; text-align: right; }
        .empty { text-align: center; color: #9a9dc4; padding: 40px 0; font-size: 14px; }
        .footer-note { max-width: 900px; margin: 0 auto; font-size: 12px; color: #9a9dc4; text-align: center; line-height: 1.7; }
        .table-scroll { overflow-x: auto; max-height: 62vh; overflow-y: auto; }
        code { background: #f7f8fd; padding: 1px 6px; border-radius: 6px; font-size: 11px; }
    </style>
</head>
<body>

<h1>お題データ集計用</h1>
<div class="sub">出題回数・チェンジ（パス）回数の集計です。</div>

<div class="panel">
    <div class="controls">
        <div>
            <label>むずかしさ</label>
            <select id="diffFilter">
                <option value="all">すべて</option>
                <option value="かんたん">かんたん</option>
                <option value="ふつう">ふつう</option>
                <option value="むずかしい">むずかしい</option>
                <option value="とてもむずかしい">とてもむずかしい</option>
            </select>
            <label style="margin-left:10px;">並びかえ</label>
            <select id="sortSel">
                <option value="rate">チェンジ率が高い順</option>
                <option value="passed">チェンジ回数が多い順</option>
                <option value="shown">出題回数が多い順</option>
                <option value="word">お題リストの順</option>
            </select>
        </div>
        <div>
            <button id="refreshBtn">更新</button>
            <button id="resetBtn" style="color:#c0392b;">記録をぜんぶ消す</button>
        </div>
    </div>
    <div class="stat-row">
        <div class="stat-chip">記録のあるお題<b id="statTotalWords">-</b></div>
        <div class="stat-chip">出題された合計回数<b id="statTotalShown">-</b></div>
        <div class="stat-chip">チェンジされた合計回数<b id="statTotalPassed">-</b></div>
    </div>
</div>

<div class="panel">
    <div class="table-scroll">
        <table id="statsTable">
            <thead>
                <tr>
                    <th data-key="word">お題</th>
                    <th data-key="shown">出題</th>
                    <th data-key="passed">チェンジ</th>
                    <th data-key="rate">チェンジ率</th>
                </tr>
            </thead>
            <tbody id="statsBody"></tbody>
        </table>
        <div id="emptyMsg" class="empty" style="display:none;">まだ記録がありません。ゲームで何度かお題が出題される（またはチェンジされる）と、ここに集計が表示されます。</div>
    </div>
</div>

<div class="footer-note">
    「チェンジ率」＝ チェンジされた回数 ÷ 出題された回数。値が高いお題ほど、子どもたちが「むずかしい」と感じて<br>
    チェンジしている可能性が高いお題です。むずかしすぎると感じたら、<code>odailist.js</code> から手動で削ってください。
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="odailist.js"></script>
<script>
const config = FIREBASE_CONFIG;
firebase.initializeApp(config);
const db = firebase.database();
try { firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => {}); } catch (e) {}

const authReady = new Promise((resolve, reject) => {
    let settled = false;
    const timeoutId = setTimeout(() => {
        if (settled) return;
        settled = true;
        reject(new Error('サインインの応答がありませんでした'));
    }, 30000);
    firebase.auth().onAuthStateChanged(user => {
        if (settled) return;
        if (user) { settled = true; clearTimeout(timeoutId); resolve(user); }
        else {
            firebase.auth().signInAnonymously().catch(err => {
                if (settled) return;
                settled = true; clearTimeout(timeoutId); reject(err);
            });
        }
    });
});

// odailist.jsの読み込みに失敗してもこのページ自体は壊れないよう、以後はこの
// safeOdaiData（読み込めなければ空オブジェクト）を必ず経由する。
const safeOdaiData = (typeof odaiData !== 'undefined') ? odaiData : {};

// お題→むずかしさ の逆引き（同じ言葉が複数の難易度に入っていることは今のところ無い想定だが、
// 念のため配列で複数バッジを出せるようにしておく）
const wordToDifficulties = {};
Object.keys(safeOdaiData).forEach(diff => {
    (safeOdaiData[diff] || []).forEach(w => {
        (wordToDifficulties[w] = wordToDifficulties[w] || []).push(diff);
    });
});

let rawStats = {}; // { word: {shown, passed} }
let sortKey = 'rate';
let diffFilterVal = 'all';

function computeRows() {
    let rows = Object.keys(rawStats).map(word => {
        const shown = rawStats[word].shown || 0;
        const passed = rawStats[word].passed || 0;
        // passedがshownを上回ることは本来ないはずだが、万が一データがそうなっていても
        // 表示が100%を超えて見えないようにクランプしておく。
        const rate = shown > 0 ? Math.min(1, passed / shown) : (passed > 0 ? 1 : 0);
        const diffs = wordToDifficulties[word] || [];
        return { word, shown, passed, rate, diffs };
    });
    if (diffFilterVal !== 'all') {
        rows = rows.filter(r => r.diffs.includes(diffFilterVal));
    }
    if (sortKey === 'word') {
        // お題リストに載っている順（=odaiDataの並び）。リストに無い古い記録は末尾にまとめる。
        const order = [];
        Object.keys(safeOdaiData).forEach(diff => (safeOdaiData[diff] || []).forEach(w => order.push(w)));
        const orderIndex = {};
        order.forEach((w, i) => { orderIndex[w] = i; });
        rows.sort((a, b) => (orderIndex[a.word] ?? 999999) - (orderIndex[b.word] ?? 999999));
    } else {
        rows.sort((a, b) => b[sortKey] - a[sortKey] || b.shown - a.shown);
    }
    return rows;
}

function render() {
    const rows = computeRows();
    const body = document.getElementById('statsBody');
    const emptyMsg = document.getElementById('emptyMsg');
    body.innerHTML = '';

    if (rows.length === 0) {
        // loadStats()が「読み込み中…」に書きかえている場合があるので、実際にデータが
        // 届いたあとの「0件でした」を表示するときは、いつもの文言に戻しておく。
        emptyMsg.innerText = 'まだ記録がありません。ゲームで何度かお題が出題される（またはチェンジされる）と、ここに集計が表示されます。';
        emptyMsg.style.display = 'block';
    } else {
        emptyMsg.style.display = 'none';
        rows.forEach(r => {
            const tr = document.createElement('tr');

            const wordTd = document.createElement('td');
            const wordSpan = document.createElement('span');
            wordSpan.className = 'word-cell';
            wordSpan.innerText = r.word;
            wordTd.appendChild(wordSpan);
            r.diffs.forEach(d => {
                const badge = document.createElement('span');
                badge.className = 'diff-badge';
                badge.innerText = d;
                wordTd.appendChild(badge);
            });
            if (r.diffs.length === 0) {
                const badge = document.createElement('span');
                badge.className = 'diff-badge';
                badge.style.color = '#c0392b';
                badge.innerText = 'リストに無し';
                wordTd.appendChild(badge);
            }
            tr.appendChild(wordTd);

            const shownTd = document.createElement('td'); shownTd.innerText = r.shown + '回'; tr.appendChild(shownTd);
            const passedTd = document.createElement('td'); passedTd.innerText = r.passed + '回'; tr.appendChild(passedTd);

            const rateTd = document.createElement('td');
            const wrap = document.createElement('div'); wrap.className = 'rate-bar-wrap';
            const barBg = document.createElement('div'); barBg.className = 'rate-bar-bg';
            const barFill = document.createElement('div'); barFill.className = 'rate-bar-fill';
            barFill.style.width = Math.round(r.rate * 100) + '%';
            barBg.appendChild(barFill);
            const num = document.createElement('div'); num.className = 'rate-num'; num.innerText = Math.round(r.rate * 100) + '%';
            wrap.appendChild(barBg); wrap.appendChild(num);
            rateTd.appendChild(wrap);
            tr.appendChild(rateTd);

            body.appendChild(tr);
        });
    }

    let totalShown = 0, totalPassed = 0;
    Object.values(rawStats).forEach(s => { totalShown += (s.shown || 0); totalPassed += (s.passed || 0); });
    document.getElementById('statTotalWords').innerText = Object.keys(rawStats).length;
    document.getElementById('statTotalShown').innerText = totalShown;
    document.getElementById('statTotalPassed').innerText = totalPassed;

    document.querySelectorAll('thead th').forEach(th => th.classList.toggle('active', th.dataset.key === sortKey));
}

function loadStats() {
    // 読み込み中は、テーブルが空のままヘッダーだけ見えて壊れているように見えるのを防ぐため、
    // 結果が届くまで一時的に「読み込み中」を出しておく。
    const emptyMsg = document.getElementById('emptyMsg');
    emptyMsg.style.display = 'block';
    emptyMsg.innerText = '読み込み中…';
    authReady.then(() => {
        return db.ref('wordStats').once('value');
    }).then(snap => {
        rawStats = snap.val() || {};
        render();
    }).catch(err => {
        console.error(err);
        document.getElementById('emptyMsg').style.display = 'block';
        document.getElementById('emptyMsg').innerText = '読み込みに失敗しました（通信状態をご確認のうえ「更新」を押してください）';
    });
}

document.getElementById('diffFilter').onchange = e => { diffFilterVal = e.target.value; render(); };
document.getElementById('sortSel').onchange = e => { sortKey = e.target.value; render(); };
document.getElementById('refreshBtn').onclick = loadStats;
document.querySelectorAll('thead th').forEach(th => {
    th.onclick = () => { document.getElementById('sortSel').value = th.dataset.key; sortKey = th.dataset.key; render(); };
});
document.getElementById('resetBtn').onclick = () => {
    if (!confirm('これまでの出題・チェンジの記録をぜんぶ消します。よろしいですか？（元に戻せません）')) return;
    authReady.then(() => db.ref('wordStats').remove()).then(loadStats);
};

loadStats();
</script>
</body>
</html>
