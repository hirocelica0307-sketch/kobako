<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>お題の編集｜お絵かきクイズ フレンズ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; touch-action: manipulation; -webkit-touch-callout: none; }
        [hidden] { display: none !important; }
        :root {
            --app-h: 100vh;
            --ink: #2c2a4a; --sub: #6b6f9a; --line: rgba(60,50,120,0.14);
            --accent: #ff8a3d;
        }
        @supports (height: 100dvh) { :root { --app-h: 100dvh; } }
        html { background: #eef6ff; }
        body {
            margin: 0; color: var(--ink); font-family: 'Zen Maru Gothic', sans-serif;
            background: radial-gradient(circle at 20% 15%, #fffaf0 0%, #eef6ff 55%, #e3f7f2 100%);
            height: var(--app-h); display: flex; flex-direction: column; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        input, textarea { user-select: text; -webkit-user-select: text; }
        button, select, input {
            font-family: inherit; font-size: 13px; font-weight: 700; color: var(--ink);
            border-radius: 10px; border: 1px solid var(--line); padding: 7px 11px; background: #fff;
        }
        button { cursor: pointer; background: #eef1fb; -webkit-appearance: none; appearance: none; }
        button:disabled { opacity: 0.4; cursor: default; }
        button.primary { background: var(--accent); color: #2a1500; border: none; }
        button.danger { color: #c0392b; }

        /* ---- 上の帯 ---- */
        .topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
            padding: 10px 14px 6px;
        }
        .title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
        h1 { font-size: clamp(17px, 2.4vw, 22px); margin: 0; }
        .status { font-size: 12px; font-weight: 700; color: var(--sub); }
        .status.dirty { color: #d9622b; }
        .status.saved { color: #1f9d5a; }
        .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        #changesBtn b { display: inline-block; min-width: 1.6em; padding: 0 5px; margin-left: 2px; border-radius: 9px; background: #fff; }

        .banner {
            margin: 0 14px 6px; padding: 9px 12px; border-radius: 12px; background: #fff6d6;
            font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }

        /* ---- 道具の帯 ---- */
        .toolbar {
            margin: 0 14px 8px; padding: 10px 12px; background: #fff; border-radius: 16px;
            box-shadow: 0 4px 16px rgba(60,50,120,0.07);
            display: grid; grid-template-columns: minmax(160px, 220px) 1fr auto; gap: 8px 12px; align-items: center;
        }
        .toolbar input[type=search] { width: 100%; }
        .add-row { display: flex; gap: 6px; min-width: 0; }
        .add-row input { flex: 1; min-width: 0; }
        .view-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: #4d5085; }
        .view-row label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; }
        .addmsg { grid-column: 1 / -1; font-size: 12px; line-height: 1.7; padding: 6px 10px; border-radius: 10px; background: #f7f8fd; }
        .addmsg .ok { color: #1f9d5a; } .addmsg .ng { color: #c0392b; }
        .hint { grid-column: 1 / -1; font-size: 11.5px; color: #8a8db5; line-height: 1.6; }

        /* ---- 4列のボード ---- */
        .tabs { display: none; }
        .board {
            flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px; padding: 0 14px 12px;
        }
        .board.expanded { grid-template-columns: 1fr; }
        .board.expanded .column { display: none !important; }
        .board.expanded .column.expanded-col { display: flex !important; }
        .expand-btn { white-space: nowrap; }
        .column.expanded-col .chips { padding: 16px; gap: 9px; }
        .column.expanded-col .chip { padding: 7px 14px; font-size: 16px; }
        .column {
            --fg: #555; --bg: #eee;
            display: flex; flex-direction: column; min-height: 0; background: #fff; border-radius: 16px;
            box-shadow: 0 4px 16px rgba(60,50,120,0.07); overflow: hidden; border: 2px solid transparent;
            transition: border-color 0.12s ease, background 0.12s ease;
        }
        .col-head {
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
            padding: 9px 10px 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line);
        }
        .col-name { font-weight: 900; font-size: 15px; color: var(--fg); white-space: nowrap; }
        .col-count { font-size: 12px; font-weight: 700; color: var(--sub); white-space: nowrap; }
        .col-head button { padding: 4px 8px; font-size: 11px; background: #fff; }
        .chips {
            flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden;
            padding: 10px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px;
        }
        body.has-sel .chips { padding-bottom: 90px; }
        .empty-col { font-size: 12px; color: #a3a6c8; padding: 14px 4px; }

        .chip {
            display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
            padding: 5px 10px; border-radius: 999px; background: #fff; cursor: pointer;
            border: 1.5px solid var(--line); font-size: 14px; font-weight: 700; line-height: 1.35;
            transition: background 0.1s ease, color 0.1s ease;
        }
        .chip:hover { border-color: var(--fg); }
        .chip:focus-visible { outline: 3px solid rgba(255,138,61,0.5); outline-offset: 1px; }
        .chip.selected { background: var(--fg); border-color: var(--fg); color: #fff; }
        .chip.moved { border-style: dashed; border-color: var(--fg); }
        .chip .tag {
            font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; white-space: nowrap;
            background: #f1f2fa; color: #4d5085;
        }
        .chip.selected .tag { background: rgba(255,255,255,0.25); color: #fff; }
        .chip .tag.new { background: #e3f7ec; color: #1f9d5a; }
        .chip .rate { font-size: 10px; font-weight: 900; padding: 1px 5px; border-radius: 8px; }
        .rate.r0 { background: #eef7f1; color: #3c8a5c; }
        .rate.r1 { background: #fff5d6; color: #9a7400; }
        .rate.r2 { background: #ffe8d6; color: #c25a14; }
        .rate.r3 { background: #ffe0e0; color: #c62828; }
        .chip.selected .rate { background: rgba(255,255,255,0.9); }
        .chip.flash { animation: flash 1.4s ease; }
        @keyframes flash { 0%, 30% { box-shadow: 0 0 0 4px rgba(255,138,61,0.55); } 100% { box-shadow: 0 0 0 0 rgba(255,138,61,0); } }

        /* ---- 選んだときの操作バー ---- */
        .selbar {
            position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
            max-width: calc(100% - 20px); padding: 10px 12px; border-radius: 18px;
            background: #2c2a4a; color: #fff; box-shadow: 0 10px 30px rgba(30,20,70,0.35);
        }
        .selbar .sel-count { font-weight: 900; font-size: 14px; white-space: nowrap; }
        .selbar .move-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .selbar button { border: none; }
        .selbar .move-btn { color: #fff; }
        .selbar .plain { background: rgba(255,255,255,0.14); color: #fff; }
        .selbar .danger { background: #ffe0e0; }

        /* ---- 変更点パネル ---- */
        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 60;
            background: #fff; box-shadow: -10px 0 30px rgba(30,20,70,0.18); display: flex; flex-direction: column;
        }
        .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; }
        .drawer-head b { font-size: 16px; }
        .drawer-sub { font-size: 11.5px; color: var(--sub); padding: 0 16px 8px; line-height: 1.6; }
        .change-list { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 16px 12px; }
        .change-group h3 { font-size: 13px; margin: 14px 0 6px; color: #4d5085; }
        .change-item {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 7px 10px; border-radius: 10px; background: #f7f8fd; margin-bottom: 5px; font-size: 13px; font-weight: 700;
        }
        .change-item .lv { font-size: 11px; padding: 1px 7px; border-radius: 8px; color: #fff; white-space: nowrap; }
        .change-item button { padding: 4px 9px; font-size: 11px; background: #fff; flex-shrink: 0; }
        .drawer-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
        .no-change { color: #a3a6c8; font-size: 13px; padding: 20px 0; text-align: center; }

        .toast {
            position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 70;
            display: flex; align-items: center; gap: 10px; max-width: calc(100% - 20px);
            padding: 9px 12px 9px 16px; border-radius: 14px; background: #fff; font-size: 13px; font-weight: 700;
            box-shadow: 0 8px 26px rgba(30,20,70,0.22);
        }
        .toast button { padding: 5px 10px; font-size: 12px; }

        .load-error { margin: 30px auto; max-width: 560px; background: #fff; border-radius: 16px; padding: 20px; line-height: 1.8; font-size: 14px; }

        /* ---- せまい画面：1列ずつタブで切りかえ ---- */
        @media (max-width: 899px) {
            body { height: auto; min-height: var(--app-h); overflow: visible; }
            .toolbar { grid-template-columns: 1fr; }
            .tabs {
                display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;
                position: sticky; top: 0; z-index: 20; padding: 6px 14px 8px; background: rgba(238,246,255,0.96);
            }
            .tab {
                padding: 7px 4px; font-size: 12px; line-height: 1.3; border: 2px solid transparent; background: #fff;
                white-space: normal;
            }
            .tab small { display: block; font-size: 11px; color: var(--sub); }
            .tab.active { border-color: var(--fg); background: var(--bg); color: var(--fg); }
            .board { display: block; padding-bottom: 20px; }
            .column:not(.active) { display: none; }
            /* 高さの決まっていない列の中で flex:1 1 0 のままだと、中身の高さが0として
               計算されて3行ほどで切れてしまう。スマホではページごとスクロールさせる */
            .chips { flex: none; overflow: visible; }
            .col-head .col-name { font-size: 14px; }
            .add-row { flex-wrap: wrap; }
            .add-row input { flex: 1 1 100%; }
            .add-row select { flex: 1 1 auto; }
            .selbar { width: calc(100% - 20px); bottom: 10px; gap: 8px; }
            .selbar .sel-count { width: 100%; text-align: center; }
            .selbar .move-btns { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
            .selbar .move-btn { padding: 9px 4px; }
            .selbar .danger, .selbar .plain { flex: 1 1 0; }
            body.has-sel .board { padding-bottom: 170px; }
        }
        .toast button { white-space: nowrap; flex-shrink: 0; }
    </style>
</head>
<body>

<header class="topbar" id="topbar">
    <div class="title">
        <h1>お題の編集</h1>
        <span class="status" id="saveStatus"></span>
    </div>
    <div class="top-actions">
        <button id="undoBtn" title="ひとつ前に戻す（Ctrl+Z）">↶ 元に戻す</button>
        <button id="changesBtn">変更点<b id="changeCount">0</b></button>
        <button id="saveBtn" class="primary" title="Ctrl+S">odailist.js を保存</button>
    </div>
</header>

<div class="banner" id="draftBanner" hidden>
    <span id="draftText"></span>
    <button id="draftOpenBtn">つづきを開く</button>
    <button id="draftDropBtn">すてる</button>
</div>

<section class="toolbar" id="toolbar">
    <input type="search" id="searchInput" placeholder="🔍 お題をさがす" autocomplete="off">
    <div class="add-row">
        <input type="text" id="addInput" placeholder="追加するお題（「、」で区切ってまとめて入れられます）" autocomplete="off">
        <select id="addLevel" aria-label="追加先"></select>
        <button id="addBtn">追加</button>
    </div>
    <div class="view-row">
        <select id="sortSel" aria-label="ならびかえ">
            <option value="list">リストの順</option>
            <option value="aiueo">あいうえお順</option>
            <option value="rate">チェンジ率が高い順</option>
            <option value="len">文字数が多い順</option>
        </select>
        <label><input type="checkbox" id="changedOnly"> 変更したものだけ</label>
        <label title="ゲームで出題されたときに「チェンジ」された割合（3回以上出題されたお題だけ）"><input type="checkbox" id="showStats" checked> チェンジ率 <span id="statsStatus"></span></label>
    </div>
    <div class="addmsg" id="addMsg" hidden></div>
    <div class="hint" id="hint">お題をタップして選ぶ → 下に出るボタンで移動・削除（Shift＋クリックでまとめて選択）。％はチェンジされた割合で、高いほど子どもが「むずかしい」と感じているお題です。</div>
</section>

<nav class="tabs" id="tabs"></nav>
<main class="board" id="board"></main>

<div class="load-error" id="loadError" hidden>
    <b>odailist.js が読みこめませんでした。</b><br>
    このファイル（odaieditor.html）を、<b>odailist.js と同じフォルダ</b>に置いてから開いてください。
</div>

<div class="selbar" id="selbar" hidden>
    <span class="sel-count" id="selCount"></span>
    <div class="move-btns" id="moveBtns"></div>
    <button class="danger" id="deleteBtn">削除</button>
    <button class="plain" id="clearSelBtn">選択をやめる</button>
</div>

<aside class="drawer" id="drawer" hidden>
    <div class="drawer-head"><b>変更点</b><button id="closeDrawerBtn">とじる</button></div>
    <div class="drawer-sub">このページを開いたときの odailist.js からの変更です。「戻す」でそのお題だけ元にもどせます。</div>
    <div class="change-list" id="changeList"></div>
    <div class="drawer-foot">
        <button class="danger" id="resetAllBtn">すべて元に戻す</button>
        <button class="primary" id="drawerSaveBtn">保存する</button>
    </div>
</aside>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndoBtn">元に戻す</button></div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="odailist.js"></script>
<script>
// =====================================================================
// お題の編集
//  ・odailist.js を読みこんで、4つのむずかしさを列で並べる
//  ・お題を選んで別のむずかしさへ移す／削除する／まとめて追加する
//  ・できあがったら odailist.js として保存する（同じ形式で書き出す）
// ゲーム本体（room.html）は odailist.js を読むだけなので、ここで保存した
// ファイルで置きかえれば、そのままゲームに反映される。
// =====================================================================

// ---- iPadなどでの勝手な拡大を防ぐ（mobile-web-app-pitfalls §1） ----
['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
    document.addEventListener(type, e => e.preventDefault(), { passive: false });
});
function setAppHeight() {
    const el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    if (h > 0) document.documentElement.style.setProperty('--app-h', `${Math.round(h)}px`);
}
setAppHeight();
['resize', 'pageshow'].forEach(t => window.addEventListener(t, setAppHeight));
window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);

// ---- 基本 ----
const LEVELS = (typeof DIFFICULTY_LEVELS !== 'undefined' && Array.isArray(DIFFICULTY_LEVELS)) ? DIFFICULTY_LEVELS.slice() : [];
const LEVEL_COLORS = {
    'かんたん':         { fg: '#1f9d5a', bg: '#e6f7ee' },
    'ふつう':           { fg: '#3d6ff0', bg: '#e8eeff' },
    'むずかしい':       { fg: '#e5701f', bg: '#fff0e4' },
    'とてもむずかしい': { fg: '#cf3f74', bg: '#fde8f0' },
    '都道府県':         { fg: '#2f9e8f', bg: '#e5f7f4' },
};
function colorOf(level) { return LEVEL_COLORS[level] || { fg: '#6b6f9a', bg: '#eef1fb' }; }
// room.html の checkAnswer() と同じ正規化（カタカナ→ひらがな）。「くも」と「クモ」は同じ答え。
function toHira(str) { return str.replace(/[ァ-ヶ]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60)); }
const KANA_RE = /^[ぁ-ゖァ-ヺー]+$/;
const MAX_LEN = 10; // 10文字以上は入力が間に合わないので入れない
const $ = id => document.getElementById(id);

let original = {};          // 読みこんだときの内容 { level: [words] }
let originalLevelOf = {};   // word → 読みこんだときのむずかしさ
let originalIndex = {};     // word → 読みこんだときの並び順
let current = {};           // 編集中の内容
let savedJSON = '';         // 最後に保存したときの内容（未保存の判定に使う）
let history = [];           // 元に戻す用
const selected = new Set();
let lastClicked = null;
let flashWords = new Set();
let activeTab = LEVELS[0];
let expandedLevel = null;   // このむずかしさだけを大きく全画面で表示中なら、そのレベル名
let stats = {};             // { word: {shown, passed} }
let statsState = 'loading';
let fileHandle = null;      // 上書き保存先（対応ブラウザのみ）
let baseHash = '';

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h >>> 0); }
function levelMap() {
    const m = {};
    LEVELS.forEach(l => current[l].forEach(w => { m[w] = l; }));
    return m;
}
function normMap() {
    const m = {};
    LEVELS.forEach(l => current[l].forEach(w => { m[toHira(w)] = { w, l }; }));
    return m;
}

// ---- 読みこみ ----
function init() {
    if (typeof odaiData === 'undefined' || !LEVELS.length) {
        $('loadError').hidden = false;
        ['toolbar', 'board', 'tabs'].forEach(id => $(id).hidden = true);
        $('saveBtn').disabled = true; $('undoBtn').disabled = true; $('changesBtn').disabled = true;
        return;
    }
    LEVELS.forEach(l => {
        original[l] = (odaiData[l] || []).slice();
        original[l].forEach((w, i) => { originalLevelOf[w] = l; originalIndex[w] = i; });
    });
    current = clone(original);
    savedJSON = JSON.stringify(current);
    baseHash = hashStr(savedJSON);

    LEVELS.forEach(l => {
        const o = document.createElement('option');
        o.value = l; o.textContent = l + ' へ';
        $('addLevel').appendChild(o);
    });
    try { const v = localStorage.getItem('oekaki_odaiEditor_view'); if (v) applyView(JSON.parse(v)); } catch (e) {}

    checkDraft();
    render();
    loadStats();
}

// ---- 表示 ----
function sortedWords(level) {
    const words = current[level].slice();
    const mode = $('sortSel').value;
    if (mode === 'aiueo') words.sort((a, b) => toHira(a).localeCompare(toHira(b), 'ja'));
    else if (mode === 'len') words.sort((a, b) => [...b].length - [...a].length);
    else if (mode === 'rate') {
        const r = w => { const s = rateOf(w); return s ? s.rate : -1; };
        words.sort((a, b) => r(b) - r(a));
    }
    return words;
}
function rateOf(w) {
    const s = stats[w];
    if (!s || !(s.shown >= 3)) return null;
    const shown = s.shown || 0, passed = s.passed || 0;
    return { shown, passed, rate: Math.min(1, passed / shown) };
}
function rateClass(rate) { return rate < 0.2 ? 'r0' : rate < 0.4 ? 'r1' : rate < 0.6 ? 'r2' : 'r3'; }

function captureScroll() {
    const chipScroll = {};
    document.querySelectorAll('.column').forEach(col => {
        const chips = col.querySelector('.chips');
        if (chips) chipScroll[col.dataset.level] = chips.scrollTop;
    });
    return { chipScroll, pageY: window.scrollY || document.documentElement.scrollTop || 0 };
}
function restoreScroll(state) {
    document.querySelectorAll('.column').forEach(col => {
        const chips = col.querySelector('.chips');
        if (chips && state.chipScroll[col.dataset.level] != null) chips.scrollTop = state.chipScroll[col.dataset.level];
    });
    if (state.pageY) window.scrollTo(0, state.pageY);
}

function render() {
    // 選んで移動・削除したあとに一番上へ戻らないよう、今のスクロール位置を覚えておく
    const scrollState = captureScroll();
    const q = toHira($('searchInput').value.trim());
    const changedOnly = $('changedOnly').checked;
    const showStats = $('showStats').checked && statsState === 'ok';
    const board = $('board');
    const tabs = $('tabs');
    board.innerHTML = ''; tabs.innerHTML = '';
    board.classList.toggle('expanded', !!expandedLevel);
    tabs.hidden = !!expandedLevel;
    // 列の数（むずかしさの数）ぶん、横なみに並べる
    board.style.gridTemplateColumns = `repeat(${LEVELS.length}, minmax(0, 1fr))`;
    tabs.style.gridTemplateColumns = `repeat(${LEVELS.length}, minmax(0, 1fr))`;

    LEVELS.forEach(level => {
        const c = colorOf(level);

        // タブ（せまい画面用）

        const words = sortedWords(level).filter(w => {
            if (q && !toHira(w).includes(q)) return false;
            if (changedOnly && originalLevelOf[w] === level) return false;
            return true;
        });

        const head = document.createElement('div');
        head.className = 'col-head';

        head.innerHTML = `<div><div class="col-name">${level}</div><div class="col-count">${all.length}語${filtered ? `（表示 ${words.length}）` : ''}</div></div>`;
        const headBtns = document.createElement('div');
        headBtns.style.display = 'flex'; headBtns.style.gap = '6px'; headBtns.style.flexShrink = '0';
        const expandBtn = document.createElement('button');

        const isExpanded = level === expandedLevel;
        expandBtn.textContent = isExpanded ? '✕ とじる' : '⤢ 全画面';
        expandBtn.title = isExpanded ? '4列表示にもどす' : `「${level}」だけ大きく全画面で見る`;
        expandBtn.onclick = () => { expandedLevel = isExpanded ? null : level; render(); };
        headBtns.appendChild(expandBtn);
        const selAll = document.createElement('button');
        selAll.textContent = '表示中をぜんぶ選ぶ';
        selAll.disabled = words.length === 0;
        selAll.onclick = () => {
            const allOn = words.length > 0 && words.every(w => selected.has(w));
            words.forEach(w => allOn ? selected.delete(w) : selected.add(w));
            refreshSelection();
        };
        headBtns.appendChild(selAll);
        head.appendChild(headBtns);
        col.appendChild(head);

        const list = document.createElement('div');
        list.className = 'chips';
        const frag = document.createDocumentFragment();
        words.forEach(w => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.dataset.word = w;
            chip.setAttribute('role', 'button');
            chip.tabIndex = 0;
            const orig = originalLevelOf[w];
            let title = w;
            const span = document.createElement('span');
            span.textContent = w;
            chip.appendChild(span);
            if (!orig) {
                chip.classList.add('moved');
                const t = document.createElement('span'); t.className = 'tag new'; t.textContent = '追加'; chip.appendChild(t);
                title += '（追加したお題）';
            } else if (orig !== level) {
                chip.classList.add('moved');
                const t = document.createElement('span'); t.className = 'tag'; t.textContent = '元：' + orig; chip.appendChild(t);
                title += `（元は「${orig}」）`;
            }
            if (showStats) {
                const r = rateOf(w);
                if (r) {
                    const t = document.createElement('span');
                    t.className = 'rate ' + rateClass(r.rate);
                    t.textContent = Math.round(r.rate * 100) + '%';
                    chip.appendChild(t);
                    title += `\n出題 ${r.shown}回・チェンジ ${r.passed}回`;
                }
            }
            chip.title = title;
            if (selected.has(w)) { chip.classList.add('selected'); chip.setAttribute('aria-pressed', 'true'); }
            else chip.setAttribute('aria-pressed', 'false');
            if (flashWords.has(w)) chip.classList.add('flash');
            frag.appendChild(chip);
        });
        list.appendChild(frag);
        if (words.length === 0) {
            const e = document.createElement('div');
            e.className = 'empty-col';
            e.textContent = all.length === 0 ? 'お題がありません' : '条件に合うお題はありません';
            list.appendChild(e);
        }
        col.appendChild(list);
        board.appendChild(col);
    });

    flashWords = new Set();
    updateSelbar();
    updateTop();
    if (!$('drawer').hidden) renderChanges();
    restoreScroll(scrollState);
}

function refreshSelection() {
    document.querySelectorAll('.chip').forEach(c => {
        const on = selected.has(c.dataset.word);
        c.classList.toggle('selected', on);
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    updateSelbar();
}

function updateSelbar() {
    // 検索などで見えなくなっても選択は残るが、消えたお題（削除・元に戻す）は選択から外す
    const map = levelMap();
    [...selected].forEach(w => { if (!map[w]) selected.delete(w); });
    const n = selected.size;
    $('selbar').hidden = n === 0;
    document.body.classList.toggle('has-sel', n > 0);
    if (!n) return;
    $('selCount').textContent = `${n}語を選択中 →`;
    const box = $('moveBtns');
    box.innerHTML = '';
    const levelsOfSel = new Set([...selected].map(w => map[w]));
    LEVELS.forEach(level => {
        const b = document.createElement('button');
        b.className = 'move-btn';
        b.style.background = colorOf(level).fg;
        b.textContent = level + ' へ';
        b.disabled = levelsOfSel.size === 1 && levelsOfSel.has(level);
        b.onclick = () => moveWords([...selected], level);
        box.appendChild(b);
    });
}

function computeChanges() {
    const moved = [], added = [], deleted = [];
    const map = levelMap();
    LEVELS.forEach(l => current[l].forEach(w => {
        const o = originalLevelOf[w];
        if (!o) added.push({ w, l });
        else if (o !== l) moved.push({ w, from: o, to: l });
    }));
    Object.keys(originalLevelOf).forEach(w => { if (!map[w]) deleted.push({ w, from: originalLevelOf[w] }); });
    return { moved, added, deleted, total: moved.length + added.length + deleted.length };
}
function isDirty() { return JSON.stringify(current) !== savedJSON; }

function updateTop() {
    const ch = computeChanges();
    $('changeCount').textContent = ch.total;
    $('undoBtn').disabled = history.length === 0;
    const st = $('saveStatus');
    if (isDirty()) { st.textContent = '● 保存していない変更があります'; st.className = 'status dirty'; }
    else if (ch.total > 0) { st.textContent = '✓ 保存しました'; st.className = 'status saved'; }
    else { st.textContent = '合計 ' + LEVELS.reduce((s, l) => s + current[l].length, 0) + '語'; st.className = 'status'; }
}

// ---- 変更の操作 ----
function pushHistory() {
    history.push(JSON.stringify(current));
    if (history.length > 200) history.shift();
}
// 元のむずかしさに戻すときは元の並び位置に、それ以外は列の最後に入れる
function placeWord(level, w) {
    const arr = current[level];
    if (originalLevelOf[w] === level) {
        const idx = originalIndex[w];
        let pos = arr.length;
        for (let i = 0; i < arr.length; i++) {
            const o = arr[i];
            if (originalLevelOf[o] === level && originalIndex[o] > idx) { pos = i; break; }
        }
        arr.splice(pos, 0, w);
    } else {
        arr.push(w);
    }
}
function afterChange(msg, undoable = true) {
    saveDraft();
    render();
    if (msg) toast(msg, undoable);
}
function moveWords(words, to) {
    const map = levelMap();
    const targets = words.filter(w => map[w] && map[w] !== to);
    if (!targets.length) return;
    pushHistory();
    targets.forEach(w => { const from = map[w]; current[from] = current[from].filter(x => x !== w); });
    targets.forEach(w => placeWord(to, w));
    selected.clear();
    flashWords = new Set(targets);
    afterChange(targets.length === 1 ? `「${targets[0]}」を「${to}」に移しました` : `${targets.length}語を「${to}」に移しました`);
}
function deleteWords(words) {
    const map = levelMap();
    const targets = words.filter(w => map[w]);
    if (!targets.length) return;
    pushHistory();
    targets.forEach(w => { const l = map[w]; current[l] = current[l].filter(x => x !== w); });
    selected.clear();
    afterChange(targets.length === 1 ? `「${targets[0]}」を削除しました` : `${targets.length}語を削除しました`);
}
function restoreDeleted(w) {
    if (levelMap()[w]) return;
    pushHistory();
    placeWord(originalLevelOf[w], w);
    flashWords = new Set([w]);
    afterChange(`「${w}」を元に戻しました`);
}
function undo() {
    if (!history.length) return;
    current = JSON.parse(history.pop());
    selected.clear();
    saveDraft();
    render();
    toast('ひとつ前に戻しました', false);
}

// ---- まとめて追加 ----
function addFromInput() {
    const level = $('addLevel').value;
    const raw = $('addInput').value;
    const parts = raw.split(/[、,，。\s]+/).map(s => s.trim()).filter(Boolean);
    if (!parts.length) return;
    const added = [], restored = [], exists = [], badChar = [], tooLong = [];
    const seenNow = new Set();
    let pushed = false;
    parts.forEach(w => {
        const key = toHira(w);
        if (seenNow.has(key)) return;
        seenNow.add(key);
        if (!KANA_RE.test(w)) { badChar.push(w); return; }
        if ([...w].length >= MAX_LEN) { tooLong.push(w); return; }
        const nm = normMap();
        if (nm[key]) { exists.push(`${w}（${nm[key].l}に「${nm[key].w}」）`); return; }
        if (!pushed) { pushHistory(); pushed = true; }
        // 読みこみ時に同じ表記があって、いまは削除されているもの → その言葉として戻す
        const origSame = Object.keys(originalLevelOf).find(o => toHira(o) === key);
        const word = origSame || w;
        placeWord(level, word);
        (origSame ? restored : added).push(word);
    });
    const lines = [];
    if (added.length || restored.length) {
        const all = added.concat(restored);
        lines.push(`<span class="ok">「${level}」に追加：${escapeHtml(all.join('、'))}</span>`);
        flashWords = new Set(all);
    }
    if (exists.length) lines.push(`<span class="ng">もう入っています：${escapeHtml(exists.join('、'))}</span>`);
    if (tooLong.length) lines.push(`<span class="ng">10文字以上なので入れられません：${escapeHtml(tooLong.join('、'))}</span>`);
    if (badChar.length) lines.push(`<span class="ng">ひらがな・カタカナ以外が入っています：${escapeHtml(badChar.join('、'))}</span>`);
    const msg = $('addMsg');
    msg.innerHTML = lines.join('<br>');
    msg.hidden = lines.length === 0;
    if (added.length || restored.length) {
        // 入れられなかった言葉だけ入力欄に残して、直しやすくする
        $('addInput').value = badChar.concat(tooLong).join('、');
        afterChange(`${added.length + restored.length}語を「${level}」に追加しました`);
    }
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---- 変更点パネル ----
function renderChanges() {
    const ch = computeChanges();
    const box = $('changeList');
    box.innerHTML = '';
    if (!ch.total) { box.innerHTML = '<div class="no-change">まだ変更はありません</div>'; return; }
    const lvBadge = l => `<span class="lv" style="background:${colorOf(l).fg}">${l}</span>`;
    const group = (title, items, rowHtml, onUndo) => {
        if (!items.length) return;
        const g = document.createElement('div');
        g.className = 'change-group';
        g.innerHTML = `<h3>${title}（${items.length}）</h3>`;
        items.forEach(it => {
            const row = document.createElement('div');
            row.className = 'change-item';
            row.innerHTML = `<span>${rowHtml(it)}</span>`;
            const b = document.createElement('button');
            b.textContent = '戻す';
            b.onclick = () => onUndo(it);
            row.appendChild(b);
            g.appendChild(row);
        });
        box.appendChild(g);
    };
    group('移動したお題', ch.moved, it => `${escapeHtml(it.w)}　${lvBadge(it.from)} → ${lvBadge(it.to)}`, it => moveWords([it.w], it.from));
    group('追加したお題', ch.added, it => `${escapeHtml(it.w)}　${lvBadge(it.l)}`, it => deleteWords([it.w]));
    group('削除したお題', ch.deleted, it => `<s>${escapeHtml(it.w)}</s>　${lvBadge(it.from)}`, it => restoreDeleted(it.w));
}

// ---- お題のクリック（選択） ----
$('board').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const w = chip.dataset.word;
    if (e.shiftKey && lastClicked && lastClicked !== w) {
        const chips = [...chip.closest('.column').querySelectorAll('.chip')];
        const a = chips.findIndex(c => c.dataset.word === lastClicked);
        const b = chips.indexOf(chip);
        if (a >= 0) {
            const [s, t] = a < b ? [a, b] : [b, a];
            for (let i = s; i <= t; i++) selected.add(chips[i].dataset.word);
            lastClicked = w;
            refreshSelection();
            return;
        }
    }
    if (selected.has(w)) selected.delete(w); else selected.add(w);
    lastClicked = w;
    refreshSelection();
});
$('board').addEventListener('keydown', e => {

// ---- 保存 ----
function fmtList(list) {
    if (!list.length) return '[]';
    const lines = [];
    for (let i = 0; i < list.length; i += 10) {
        lines.push('        ' + list.slice(i, i + 10).map(w => JSON.stringify(w)).join(','));
    }
    return '[\n' + lines.join(',\n') + '\n    ]';
}
function buildFileText() {
    const header = [
        '// お題リスト（4段階）',
        '//   かんたん         … 小学低学年（1〜2年）でも分かる・描ける',
        '//   ふつう           … 小学校中学年（3〜4年）でも分かる・描ける',
        '//   むずかしい       … 小学校高学年〜中高生向け',
        '//   とてもむずかしい … 大人レベル',
        '//',
        '// お題を足すときのきまり',
        '//   ・10文字以上は制限時間内に入力が間に合わないので入れない',
        '//   ・room.html は答えをカタカナ→ひらがなに直してから照合するので、',
        '//     「くも」と「クモ」は同じ答えになる。正規化したときに重複させない',
        '//   ・絵だけでは伝わらないもの（しお・べんきょう など）は入れない',
    ];
    return header.join('\n') + '\n'
        + `const DIFFICULTY_LEVELS = [${LEVELS.map(l => JSON.stringify(l)).join(', ')}];\n\n`
        + 'const odaiData = {\n'
        + LEVELS.map(l => `    ${JSON.stringify(l)}: ${fmtList(current[l])}`).join(',\n')
        + '\n};\n';
}
function validateBeforeSave() {
    const seen = new Map(), problems = [];
    LEVELS.forEach(l => current[l].forEach(w => {
        const k = toHira(w);
        if (seen.has(k)) problems.push(`重複：${w}（${l}）と ${seen.get(k)}`);
        else seen.set(k, `${w}（${l}）`);
        if ([...w].length >= MAX_LEN) problems.push(`10文字以上：${w}`);
    }));
    return problems;
}
async function save() {
    const problems = validateBeforeSave();
    if (problems.length) { alert('保存できません：\n' + problems.slice(0, 10).join('\n')); return; }
    const empty = LEVELS.filter(l => current[l].length === 0);
    if (empty.length && !confirm(`「${empty.join('」「')}」にお題がひとつもありません。このまま保存しますか？`)) return;
    const text = buildFileText();

    // Chrome / Edge：同じファイルに直接上書きできる。2回目からは同じ場所へ自動で上書き。
    if (window.showSaveFilePicker) {
        try {
            if (!fileHandle) {
                fileHandle = await window.showSaveFilePicker({
                    suggestedName: 'odailist.js',
                    types: [{ description: 'お題リスト', accept: { 'text/javascript': ['.js'] } }],
                });
            }
            const writable = await fileHandle.createWritable();
            await writable.write(text);
            await writable.close();
            markSaved(true);
            toast(`「${fileHandle.name}」に保存しました`, false);
            return;
        } catch (err) {
            if (err && err.name === 'AbortError') return; // 保存先えらびをキャンセル
            console.warn(err);
            fileHandle = null; // うまくいかなければダウンロードでわたす
        }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'odailist.js';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    markSaved(false);
    toast('odailist.js をダウンロードしました。フォルダの odailist.js と置きかえてください', false);
}
function markSaved(overwritten) {
    savedJSON = JSON.stringify(current);
    // 実物のファイルを上書きしたら、次に開いたときは新しいファイルが基準になるので下書きは不要
    if (overwritten) { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
    updateTop();
    $('saveBtn').textContent = fileHandle ? '上書き保存' : 'odailist.js を保存';
}

// ---- 下書きの自動保存（うっかり閉じても続きから） ----
const DRAFT_KEY = 'oekaki_odaiEditor_draft';
let draftTimer = null;
function saveDraft() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => {
        try {
            if (!isDirty()) { localStorage.removeItem(DRAFT_KEY); return; }
            localStorage.setItem(DRAFT_KEY, JSON.stringify({ baseHash, current, at: Date.now() }));
        } catch (e) {}
    }, 300);
}
let pendingDraft = null;
function checkDraft() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { d = null; }
    // 読みこんだ odailist.js が下書きを作ったときと同じ場合だけ出す（ファイルが新しくなっていたら古い下書きは使わない）
    if (!d || d.baseHash !== baseHash || !d.current) return;
    const ok = LEVELS.every(l => Array.isArray(d.current[l]) && d.current[l].every(w => typeof w === 'string'));
    if (!ok) return;
    const saveCur = current;
    current = d.current;
    const n = computeChanges().total;
    current = saveCur;
    if (!n) return;
    pendingDraft = d.current;
    const when = new Date(d.at);
    $('draftText').textContent = `${when.getMonth() + 1}/${when.getDate()} ${when.getHours()}:${String(when.getMinutes()).padStart(2, '0')} に保存していない編集が残っています（${n}件の変更）`;
    $('draftBanner').hidden = false;
}
$('draftOpenBtn').onclick = () => {
    if (!pendingDraft) return;
    pushHistory();
    current = clone(pendingDraft);
    LEVELS.forEach(l => { if (!Array.isArray(current[l])) current[l] = []; });
    pendingDraft = null;
    $('draftBanner').hidden = true;
    render();
    toast('前回のつづきを開きました', false);
};
$('draftDropBtn').onclick = () => {
    pendingDraft = null;
    $('draftBanner').hidden = true;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
};

// ---- チェンジ率（ゲームの集計を読むだけ。書きこみはしない） ----
function setStatsStatus() {
    const el = $('statsStatus');
    el.textContent = statsState === 'loading' ? '（読みこみ中…）'
        : statsState === 'ok' ? ''
        : statsState === 'offline' ? '（オフラインのため表示できません）'
        : '（読みこめませんでした）';
}
function loadStats() {
    setStatsStatus();
    if (typeof firebase === 'undefined') { statsState = 'offline'; setStatsStatus(); return; }
    try {
        const config = FIREBASE_CONFIG;
        if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(config);
        try { firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => {}); } catch (e) {}
        const authReady = new Promise((resolve, reject) => {
            const t = setTimeout(() => reject(new Error('timeout')), 20000);
            firebase.auth().onAuthStateChanged(user => {
                if (user) { clearTimeout(t); resolve(user); }
                else firebase.auth().signInAnonymously().catch(err => { clearTimeout(t); reject(err); });
            });
        });
        authReady
            .then(() => firebase.database().ref('wordStats').once('value'))
            .then(snap => { stats = snap.val() || {}; statsState = 'ok'; setStatsStatus(); render(); })
            .catch(err => { console.warn(err); statsState = 'error'; setStatsStatus(); });
    } catch (err) {
        console.warn(err); statsState = 'error'; setStatsStatus();
    }
}

};
document.addEventListener('keydown', e => {
    const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
    if (typing) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (e.key === 'Escape') {
        if (!$('drawer').hidden) { $('drawer').hidden = true; return; }
        if (expandedLevel) { expandedLevel = null; render(); return; }
        selected.clear(); refreshSelection();
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selected.size) { e.preventDefault(); deleteWords([...selected]); }
});
window.addEventListener('beforeunload', e => {
    if (isDirty()) { e.preventDefault(); e.returnValue = ''; }
});

init();
</script>
</body>
</html>
