<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<meta name="description" content="九九の こたえの パネルに とびこんで 走る 3D ランナーゲーム。まちがえた 九九は もういちど 出て、にがては よく 出る。">
<title>九九ラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-scr="menu">

<canvas id="world" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<div id="redflash" aria-hidden="true"></div>

<!-- ========== あそんでいる ときの 表示 ========== -->
<div id="hud">
  <div class="pills">
    <span class="pill" id="hLife">のこり ♥♥♥</span>
    <span class="pill" id="hSpeed">そくど <b>0</b> km/h</span>
    <span class="pill" id="hScore">せいかい <b>0</b></span>
  </div>
  <button id="pauseBtn" class="round" aria-label="ひとやすみ">Ⅱ</button>
  <div id="qbox">
    <div id="qTag">もういちど！</div>
    <div id="qText"></div>
    <div id="combo"></div>
  </div>
  <div id="count"></div>
  <div id="praise"></div>
  <div id="missBox">
    <div class="mx"></div>
    <div class="my"></div>
  </div>
  <div id="ctrl">
    <button id="btnL" aria-label="ひだりへ">◀</button>
    <button id="btnR" aria-label="みぎへ">▶</button>
  </div>
</div>

<!-- ========== はじめの 画面（コースと せってい） ========== -->
<section id="menu" class="sheet">
  <div class="card">
    <h1>九九<span>ラン</span></h1>
    <p class="lead">こたえの パネルに とびこもう！</p>
    <div id="noGL" class="warn" hidden>この たんまつでは 3D が うごきません（WebGL が つかえません）。</div>

    <h2>コース</h2>
    <div id="courses" class="courses"></div>
    <button id="nigateBtn" class="nigate" hidden>
      <b>にがて れんしゅう</b>
      <span id="nigateList"></span>
    </button>

    <h2>せってい</h2>
    <div class="row">
      <h3>がめん</h3>
      <div class="seg" data-key="lite">
        <button data-v="false">ふつう</button><button data-v="true">かるい</button>
      </div>
    </div>

    <p id="bestLine" class="best"></p>
    <button id="startBtn" class="start">スタート</button>
    <p class="howto">◀ ▶ で パネルを えらぶ ／ ミスは 3かいまで<br>だんだん はやく なるよ。どこまで れんぞくで いけるかな？<br>まちがえた 九九は すこし あとで「もういちど！」出るよ</p>
    <p class="foot"><button id="resetBtn" class="link">きろくを けす</button></p>
  </div>
</section>

<!-- ========== ひとやすみ ========== -->
<section id="pause" class="sheet">
  <div class="card small">
    <h2 class="big">ひとやすみ</h2>
    <button id="resumeBtn" class="start">つづける</button>
    <button id="quitBtn" class="sub">やめる</button>
  </div>
</section>

<!-- ========== おしまい ========== -->
<section id="result" class="sheet">
  <div class="card">
    <h2 class="big" id="rTitle">おしまい！</h2>
    <div class="score"><b id="rNum">0</b><span id="rUnit">れんぞく</span></div>
    <p id="rStats" class="stats"></p>
    <p id="rBest" class="best"></p>
    <div id="rReview" class="review">
      <h3>おさらい</h3>
      <div id="rChips" class="chips"></div>
    </div>
    <button id="practiceBtn" class="start">まちがえた 九九を れんしゅう</button>
    <button id="againBtn" class="start">もういちど</button>
    <button id="menuBtn" class="sub">せってい を かえる</button>
  </div>
</section>

<script src="lib/three.min.js"></script>
<script src="logic.js"></script>
<script src="world3d.js"></script>
<script src="main.js"></script>
</body>
</html>
