<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>速読ラボ ― 自動テスト</title>
<style>
 body{ font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; margin:0; background:#f7f6f2; color:#1d1f23; }
 header{ background:#1d1f23; color:#fff; padding:12px 18px; }
 h1{ margin:0; font-size:18px; }
 .sum{ font-size:15px; padding:12px 18px; }
 .sum b{ font-size:20px; }
 table{ border-collapse:collapse; width:100%; background:#fff; }
 th,td{ border-bottom:1px solid #e2dfd8; padding:8px 12px; font-size:13px; text-align:left; vertical-align:top; }
 th{ background:#efede7; }
 .ok{ color:#1f7a46; font-weight:bold; }
 .ng{ color:#b3261e; font-weight:bold; }
 tr.bad{ background:#fff4f4; }
</style>
</head>
<body>
<header><h1>速読ラボ ― 自動テスト</h1></header>
<div class="sum" id="sum">調べています…</div>
<table>
  <thead><tr><th style="width:3em"></th><th>確かめること</th><th>くわしく</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script src="logic.js"></script>
<script src="texts/catalog.js"></script>
<script src="tests.js"></script>
<script>
window.runSokuTests().then(r => {
  const ng = r.filter(x => !x.ok).length;
  document.getElementById('sum').innerHTML = ng
    ? `<b class="ng">${ng}こ まちがい</b>（ぜんぶで ${r.length}こ）`
    : `<b class="ok">ぜんぶ OK</b>（${r.length}こ）`;
  const tb = document.getElementById('rows');
  for (const x of r) {
    const tr = document.createElement('tr');
    if (!x.ok) tr.className = 'bad';
    tr.innerHTML = `<td class="${x.ok ? 'ok' : 'ng'}">${x.ok ? 'OK' : 'NG'}</td><td></td><td></td>`;
    tr.children[1].textContent = x.name;
    tr.children[2].textContent = x.ok ? '' : x.detail;
    tb.appendChild(tr);
  }
});
</script>
</body>
</html>
