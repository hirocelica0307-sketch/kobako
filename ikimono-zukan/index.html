<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF7">
<meta name="description" content="小学2年生 こくご「どうぶつカード」を作ろう（東京書籍 二下）で つかう、30しゅるいの いきものの ひみつを しゃしんと 文で しらべる 図鑑。">
<title>いきもの ひみつずかん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: a picture book on a Chromebook screen — fixed top bar (title・もくじ・さくいん・設定) and bottom bar (page turning),
   one scrolling "page" in between. Each いきもの page: big photo + data, then 「〇〇の ひみつ」 cards with question headings.
   Group colors work like the colored index tabs on the edge of a real 図鑑. */
:root{
  --paper:#FFFDF7;
  --paper-2:#F6F1E6;
  --surface:#FFFFFF;
  --ink:#2B2925;
  --ink-soft:#6A655B;
  --line:#E4DCCB;
  --accent:#C8702A;
  --accent-bg:#FBEBDC;
  --kemono:#C0661F; --kemono-bg:#FBE9D8;
  --tori:#2B7FC0;   --tori-bg:#E0EEF9;
  --umi:#13808B;    --umi-bg:#DAF0F1;
  --mushi:#4F8B22;  --mushi-bg:#E6F2D9;
  --hachu:#7B55A8;  --hachu-bg:#EFE7F7;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;
  --f-text:"Klee One","UD Digi Kyokasho NK-R","YuKyokasho","Zen Maru Gothic",serif;
  --fs:19px;
  --bar:58px;
  color-scheme:light;
}
body.fs-1{--fs:22px}
body.fs-2{--fs:25px}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper-2);color:var(--ink);
  font-family:var(--f-ui);font-weight:500;font-size:var(--fs);line-height:1.7;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.ic{display:inline-flex;width:1.25em;height:1.25em;flex:none}
.ic svg{width:100%;height:100%}
ruby rt{font-family:var(--f-ui);font-weight:700;font-size:.5em;letter-spacing:0;color:var(--ink-soft)}
body.no-rt ruby rt{visibility:hidden}
:focus-visible{outline:3px solid #2B7FC0;outline-offset:2px}

/* ---------- bars ---------- */
.topbar,.botbar{
  position:fixed;left:0;right:0;z-index:10;height:var(--bar);
  display:flex;align-items:center;gap:8px;padding:0 14px;
  background:var(--surface);
}
.topbar{top:0;border-bottom:2px solid var(--line)}
.botbar{bottom:0;border-top:2px solid var(--line);justify-content:space-between}
.brand{
  display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:4px 8px;border-radius:10px;
  font-weight:900;font-size:20px;letter-spacing:.04em;white-space:nowrap;
}
.brand .ic{color:var(--accent);width:28px;height:28px}
.spacer{flex:1}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;cursor:pointer;
  border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;font-weight:700;white-space:nowrap;
}
.tbtn:hover{background:var(--paper)}
.tbtn[aria-pressed="true"],.tbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbtn .ic{width:22px;height:22px}
.navbtn{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:170px;padding:0 16px;cursor:pointer;
  border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;font-weight:700;
}
.navbtn.next{justify-content:flex-end}
.navbtn:disabled{visibility:hidden}
.navbtn small{display:block;font-size:13px;color:var(--ink-soft);font-weight:700;line-height:1.2}
.navbtn .lbl{display:flex;flex-direction:column;line-height:1.3}
.navbtn.next .lbl{align-items:flex-end}
.pageno{font-weight:900;font-size:18px;color:var(--ink-soft);white-space:nowrap}
.pageno b{font-size:26px;color:var(--ink)}

/* ---------- page ---------- */
main{
  padding:calc(var(--bar) + 18px) 18px calc(var(--bar) + 26px);
  min-height:100%;
}
.sheet{
  max-width:1180px;margin:0 auto;background:var(--paper);border-radius:18px;
  box-shadow:0 1px 0 var(--line),0 8px 24px rgba(80,60,20,.08);
  padding:26px 34px 34px;position:relative;
}
.sheet .corner{
  position:absolute;right:22px;bottom:12px;font-weight:900;font-size:15px;color:var(--ink-soft);
}

/* cover */
.cover{text-align:center;padding:22px 20px 10px}
.cover h1{
  margin:0;font-family:var(--f-ui);font-weight:900;font-size:clamp(38px,5vw,56px);letter-spacing:.08em;line-height:1.25;
}
.cover .sub{margin:6px 0 22px;font-size:20px;color:var(--ink-soft);font-weight:700}
.collage{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:820px;margin:0 auto 24px}
.collage button{border:0;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;background:var(--paper-2)}
.collage img{width:100%;height:100%;object-fit:cover;display:block}
.bigbtn{
  display:inline-flex;align-items:center;gap:10px;min-height:60px;padding:0 34px;cursor:pointer;
  border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:24px;font-weight:900;
  box-shadow:0 4px 0 #8E4A13;
}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #8E4A13}
.bigbtn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btnrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.howto{max-width:900px;margin:30px auto 0;text-align:left;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.howto div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.howto b{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900;margin-bottom:4px}
.howto b span.n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:17px}
.howto p{margin:0;font-family:var(--f-text);font-weight:600;font-size:17px}

/* section title */
.ptitle{display:flex;align-items:baseline;gap:14px;margin:0 0 18px;border-bottom:3px solid var(--ink);padding-bottom:6px}
.ptitle h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.06em}
.ptitle span{color:var(--ink-soft);font-weight:700}

/* もくじ */
.grp{margin:0 0 26px}
.grp h2{
  display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:22px;font-weight:900;
  padding:4px 14px;border-radius:10px;background:var(--gbg);color:var(--gc);
}
.grp h2 small{font-size:15px;font-weight:700;color:var(--ink-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.acard{
  display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;
  background:var(--surface);padding:0;text-align:left;
}
.acard:hover{border-color:var(--gc)}
.acard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--paper-2)}
.acard span{display:flex;flex-direction:column;padding:6px 10px 8px;line-height:1.4}
.acard b{font-size:19px;font-weight:900;white-space:nowrap}
.acard i{font-style:normal;font-size:15px;font-weight:700;color:var(--gc);white-space:nowrap}

/* いきものの ページ */
.band{
  display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:2px 14px;border-radius:999px;
  background:var(--gbg);color:var(--gc);font-weight:900;font-size:16px;
}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.photo{margin:0}
.photo button{display:block;width:100%;border:0;padding:0;cursor:zoom-in;border-radius:16px;overflow:hidden;background:var(--paper-2);position:relative}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photo .zoom{
  position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--ink);
}
.photo .zoom .ic{width:22px;height:22px}
.photo figcaption{margin-top:6px;font-family:var(--f-text);font-weight:600;font-size:.82em;color:var(--ink-soft);line-height:1.7}
.aname{margin:0;font-size:clamp(40px,5vw,56px);font-weight:900;letter-spacing:.06em;line-height:1.2;color:var(--gc)}
.lead{margin:8px 0 16px;font-family:var(--f-text);font-weight:600;font-size:1.05em;line-height:1.95}
.data{margin:0;border:2px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.data div{display:grid;grid-template-columns:8.2em 1fr;border-top:2px solid var(--line)}
.data div:first-child{border-top:0}
.data dt{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--gbg);color:var(--gc);font-weight:900;font-size:.9em}
.data dt .ic{width:22px;height:22px}
.data dd{margin:0;padding:8px 14px;font-family:var(--f-text);font-weight:600;line-height:1.9}
.memo{
  margin-top:14px;padding:10px 14px;border:2px dashed var(--gc);border-radius:14px;background:var(--surface);
  font-size:16px;font-weight:700;line-height:1.7;
}
.memo b{font-weight:900}
.memo q{quotes:"『" "』";font-weight:900;color:var(--gc)}

.hhead{display:flex;align-items:center;gap:12px;margin:30px 0 14px}
.hhead h2{margin:0;font-size:30px;font-weight:900;letter-spacing:.06em}
.hhead::after{content:"";flex:1;height:3px;background:var(--gc);border-radius:2px;opacity:.5}
.secrets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.secret{
  display:flex;flex-direction:column;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;
  padding:14px 18px 16px;
}
.secret .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.secret .no{
  display:inline-flex;align-items:center;justify-content:center;padding:0 12px;height:30px;border-radius:999px;
  background:var(--gc);color:#fff;font-weight:900;font-size:16px;
}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:900;color:var(--ink-soft)}
.chip .ic{width:18px;height:18px}
.say{
  margin-left:auto;display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;cursor:pointer;
  border:2px solid var(--line);border-radius:999px;background:var(--surface);font-size:15px;font-weight:700;
}
.say.on{background:var(--gc);color:#fff;border-color:var(--gc)}
.say .ic{width:20px;height:20px}
.secret h3{margin:2px 0 0;font-size:1.15em;font-weight:900;line-height:1.75;color:var(--ink)}
.secret p{margin:0;font-family:var(--f-text);font-weight:600;line-height:2}
.secret .photo img{aspect-ratio:3/2}
.secret .photo figcaption{font-size:.8em}

/* さくいん */
.tabs{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.kana{columns:4 230px;column-gap:28px}
.krow{margin-bottom:12px}
.krow .irow{break-inside:avoid}
.krow h3{break-after:avoid;margin:0 0 4px;font-size:18px;font-weight:900;color:var(--accent)}
.irow{
  display:flex;align-items:baseline;gap:8px;width:100%;border:0;background:none;cursor:pointer;padding:6px 6px;border-radius:8px;
  font-size:19px;font-weight:700;text-align:left;
}
.irow:hover{background:var(--surface)}
.irow .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-6px)}
.irow .pg{font-weight:900;white-space:nowrap}
.catlist{display:grid;gap:22px}
.tabs.jump .tbtn{font-size:16px}
.tabs.jump .ic{color:var(--accent)}
.cat h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:22px;font-weight:900}
.cat h3 .ic{width:28px;height:28px;color:var(--accent)}
.cat .irow{font-size:17px}
.cat .irow .who{font-weight:900;white-space:nowrap;min-width:6.5em}
.cat .irow .q{font-family:var(--f-text);font-weight:600}
.cols{columns:2;column-gap:32px}
.cols .irow{break-inside:avoid}

/* 先生へ */
details.teacher{max-width:900px;margin:28px auto 0;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 16px}
details.teacher summary{cursor:pointer;font-weight:900}
details.teacher p,details.teacher li{font-size:16px;font-weight:500;line-height:1.8}

/* ズーム */
.lb{
  position:fixed;inset:0;z-index:50;background:rgba(20,18,14,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 20px 16px;gap:10px;
}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:calc(100% - 90px);object-fit:contain;border-radius:10px;background:#000}
.lb p{margin:0;color:#fff;font-family:var(--f-text);font-weight:600;font-size:20px;text-align:center;line-height:1.9}
.lb p rt{color:#ddd}
.lb .close{position:absolute;top:14px;right:14px;width:52px;height:52px;border-radius:50%;border:0;background:#fff;cursor:pointer;display:grid;place-items:center}
.lb .close .ic{width:28px;height:28px}

/* 設定 */
.menu{
  position:fixed;top:calc(var(--bar) + 6px);right:12px;z-index:20;background:var(--surface);border:2px solid var(--line);border-radius:14px;
  padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.14);display:grid;gap:10px;min-width:260px;
}
.menu[hidden]{display:none}
.menu b{font-size:15px;color:var(--ink-soft)}
.seg{display:flex;gap:6px}
.seg .tbtn{flex:1;justify-content:center}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .secrets{grid-template-columns:1fr}
  .howto{grid-template-columns:1fr}
  .collage{grid-template-columns:repeat(3,1fr)}
  .cols{columns:1}
  .navbtn{min-width:0}
  .navbtn small{display:none}
  .brand .t{display:none}
  .tbtn .t{display:none}
}
@media print{.topbar,.botbar{display:none}main{padding:0}}
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" id="toCover" type="button" aria-label="ひょうしへ"><span class="ic" data-ic="book-open"></span><span class="t">いきもの ひみつずかん</span></button>
  <span class="spacer"></span>
  <button class="tbtn" id="toMokuji" type="button"><span class="ic" data-ic="list-bullets"></span><span>もくじ</span></button>
  <button class="tbtn" id="toSakuin" type="button"><span class="ic" data-ic="magnifying-glass"></span><span>さくいん</span></button>
  <button class="tbtn" id="setBtn" type="button" aria-haspopup="true" aria-expanded="false"><span class="ic" data-ic="text-aa"></span><span class="t">もじ</span></button>
</header>
<div class="menu" id="menu" hidden>
  <b>ふりがな</b>
  <div class="seg"><button class="tbtn" type="button" data-rt="1">あり</button><button class="tbtn" type="button" data-rt="0">なし</button></div>
  <b>もじの 大きさ</b>
  <div class="seg"><button class="tbtn" type="button" data-fs="0">ふつう</button><button class="tbtn" type="button" data-fs="1">大</button><button class="tbtn" type="button" data-fs="2">もっと 大</button></div>
</div>
<main id="main" tabindex="-1"></main>
<footer class="botbar">
  <button class="navbtn" id="prev" type="button"><span class="ic" data-ic="caret-left"></span><span class="lbl"><small>まえの ページ</small><span id="prevName"></span></span></button>
  <span class="pageno" id="pageno"></span>
  <button class="navbtn next" id="next" type="button"><span class="lbl"><small>つぎの ページ</small><span id="nextName"></span></span><span class="ic" data-ic="caret-right"></span></button>
</footer>
<div class="lb" id="lb" hidden>
  <button class="close" id="lbClose" type="button" aria-label="とじる"><span class="ic" data-ic="x"></span></button>
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</div>
<script src="assets/icons.js"></script>
<script>
// ==LOGIC==
(function (root) {
'use strict';
const BOOK = 'いきもの ひみつずかん';
const RB = /\{([^|{}]+)\|([^}]*)\}/g;              // {漢字|よみ}
const R = s => s.replace(RB, '<ruby>$1<rt>$2</rt></ruby>');

const GROUPS = [
  { id: 'kemono', name: 'けもの',                         sub: 'おちちで {子|こ}どもを そだてる なかま' },

];
const CATS = [
  { id: 'karada',   name: 'からだの ひみつ',                 ic: 'paw-print' },
  { id: 'taberu',   name: 'たべものの ひみつ',               ic: 'fork-knife' },
  { id: 'kurashi',  name: 'くらしの ひみつ',                 ic: 'house-line' },
  { id: 'kosodate', name: '{赤|あか}ちゃん・そだちかたの ひみつ', ic: 'baby' },
  { id: 'mamoru',   name: 'みを まもる ひみつ',              ic: 'shield' },
];
const DATA_LABELS = [
  { name: '{大|おお}きさ',  ic: 'ruler' },
  { name: 'すむ ところ',    ic: 'map-pin' },
  { name: 'たべもの',       ic: 'fork-knife' },
];

const ANIMALS = [
/* ======================= けもの ======================= */
{k:'otter', n:'ラッコ', g:'kemono',
 lead:'{北|きた}の つめたい {海|うみ}に うかんで くらす、イタチの なかまです。',
 d:['{体|からだ}の {長|なが}さ 1m〜1m50cmくらい','{北|きた}の つめたい {海|うみ}の、きしに {近|ちか}い ところ','ウニ・{貝|かい}・カニ など'],
 cap:'{海|うみ}に うかんで、{顔|かお}を {手|て}で こする ラッコ。',
 s:[

  ['kurashi','どうやって ねるの？','{海|うみ}に うかんだまま ねむります。ながされない ように、{大|おお}きな {海|かい}そうを {体|からだ}に まきつけて ねる ことも あります。なかまと {手|て}を つなぐ ように して、ならんで ねむる ことも あります。','',''],
  ['karada','つめたい {海|うみ}でも さむく ないの？','ラッコの {毛|け}は、とても こく {生|は}えて います。{毛|け}の あいだに {空気|くうき}を ためて、つめたい {水|みず}が ひふまで とどかない ように して います。だから、{毎日|まいにち} ていねいに {毛|け}の {手入|てい}れを します。','otter-s2','{毛|け}の {手入|てい}れを する ラッコ。'],
  ['taberu','どれくらい {食|た}べるの？','{体|からだ}を あたためる ために、たくさん {食|た}べます。1{日|にち}に、{自分|じぶん}の {体|からだ}の おもさの 4ぶんの1くらいも {食|た}べます。','',''],
  ['kosodate','{赤|あか}ちゃんは どこに いるの？','{赤|あか}ちゃんは、お{母|かあ}さんの おなかの {上|うえ}に のって そだちます。お{母|かあ}さんが もぐって {食|た}べものを さがす あいだ、{赤|あか}ちゃんは {海|うみ}に ぷかぷか うかんで まって います。','otter-s1','お{母|かあ}さんの おなかの {上|うえ}の {赤|あか}ちゃん。'],
 ]},

  ['kosodate','おたまじゃくしは どう かわるの？','まず、{春|はる}に {田|た}んぼの {水|みず}の {中|なか}に たまごが うまれます。つぎに、たまごから おたまじゃくしが {生|う}まれ、えらで いきを しながら {水|みず}の {中|なか}で くらします。それから、{後|うし}ろ{足|あし}、{前足|まえあし}の じゅんに {生|は}えて きて、しっぽが みじかく なります。さいごに、{水|みず}から {上|あ}がって カエルに なります。','',''],
  ['karada','ガラスに はりつけるのは どうして？','アマガエルの {足|あし}の ゆびの {先|さき}には、まるい きゅうばんの ような ところが あります。だから、つるつるの はっぱや ガラスにも はりつく ことが できます。','frog-s1','はっぱに はりつく ニホンアマガエル。'],
  ['mamoru','{色|いろ}が かわるって ほんとう？','ニホンアマガエルは、まわりの {色|いろ}に あわせて、みどり{色|いろ}から {茶色|ちゃいろ}や はい{色|いろ}に {体|からだ}の {色|いろ}を かえる ことが できます。','',''],
  ['kurashi','{鳴|な}くのは だれ？','{鳴|な}くのは オスです。のどの ふくろを {大|おお}きく ふくらませて、{大|おお}きな {声|こえ}で {鳴|な}きます。{雨|あめ}の ふる {前|まえ}に よく {鳴|な}くので、「{雨|あま}ガエル」と いう {名前|なまえ}が ついたと いわれて います。','',''],
  ['kurashi','{冬|ふゆ}は どこに いるの？','{冬|ふゆ}に なると、{土|つち}の {中|なか}や おちばの {下|した}に もぐって、{春|はる}まで じっと して すごします。','frog-s2','{土|つち}の {中|なか}に もぐる カエル。'],
 ]},
];

const FIRST_PAGE = 4;          // もくじが 2〜3ページ、いきものは 4ページから
ANIMALS.forEach((a, i) => { a.page = FIRST_PAGE + i; });
const SAKUIN_PAGE = FIRST_PAGE + ANIMALS.length;
const MOKUJI_PAGE = 2;

const photo = (a, slot) => 'assets/photos/' + a.k + '-' + slot + '.jpg';
const secretsOf = a => a.s.map(([cat, q, t, p, c], i) => ({ no: i + 1, cat, q, t, p, c }));

/* 50音の 行 */
const KANA_ROWS = [
  ['あ', 'あいうえお'], ['か', 'かきくけこがぎぐげご'], ['さ', 'さしすせそざじずぜぞ'], ['た', 'たちつてとだぢづでど'],
  ['な', 'なにぬねの'], ['は', 'はひふへほばびぶべぼぱぴぷぺぽ'], ['ま', 'まみむめも'], ['や', 'やゆよ'],
  ['ら', 'らりるれろ'], ['わ', 'わをん'],
];
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const rowOf = name => { const c = toHira(name)[0]; const r = KANA_ROWS.find(([, cs]) => cs.includes(c)); return r ? r[0] : 'わ'; };
const collator = new Intl.Collator('ja');
function kanaIndex() {
  const sorted = ANIMALS.slice().sort((a, b) => collator.compare(toHira(a.n), toHira(b.n)));
  return KANA_ROWS.map(([row]) => ({ row, items: sorted.filter(a => rowOf(a.n) === row) })).filter(r => r.items.length);
}
function catIndex() {
  return CATS.map(c => ({ cat: c, items: ANIMALS.flatMap(a => secretsOf(a).filter(s => s.cat === c.id).map(s => ({ a, s }))) }));
}

/* ページの ならび：ひょうし → もくじ → いきもの 30 → さくいん */
const ROUTES = ['cover', 'mokuji', ...ANIMALS.map(a => 'p' + a.page), 'sakuin'];
const animalByRoute = r => { const m = /^p(\d+)$/.exec(r); return m ? ANIMALS.find(a => a.page === +m[1]) || null : null; };
const pageOfRoute = r => r === 'mokuji' ? MOKUJI_PAGE : r === 'sakuin' ? SAKUIN_PAGE : (animalByRoute(r) || {}).page || 0;
const normalize = h => { h = String(h || '').replace(/^#/, ''); return ROUTES.includes(h) ? h : 'cover'; };
const step = (r, d) => { const i = ROUTES.indexOf(normalize(r)) + d; return i >= 0 && i < ROUTES.length ? ROUTES[i] : null; };

/* よみあげ用：よみがなに して、分かち書きの すきまを とる */
const speechText = s => Y(s).replace(/[ 　]+/g, '').replace(/〜/g, 'から');

root.ZukanLogic = {
  BOOK, RB, R, P, Y, GROUPS, CATS, DATA_LABELS, ANIMALS, FIRST_PAGE, SAKUIN_PAGE, MOKUJI_PAGE,
  photo, secretsOf, KANA_ROWS, toHira, rowOf, kanaIndex, catIndex, ROUTES, animalByRoute, pageOfRoute, normalize, step, speechText,
};
})(typeof window !== 'undefined' ? window : globalThis);
// ==/LOGIC==
</script>
<script>
(function () {
'use strict';
const L = window.ZukanLogic;
const { R, ANIMALS, GROUPS, CATS, DATA_LABELS } = L;
const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const IC = n => '<span class="ic" data-ic="' + n + '"></span>';
const gvars = g => '--gc:var(--' + g + ');--gbg:var(--' + g + '-bg)';
const groupOf = id => GROUPS.find(g => g.id === id);
const catOf = id => CATS.find(c => c.id === id);

/* ---------- せってい（この 端末だけに おぼえる） ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('ikimono-zukan:' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ikimono-zukan:' + k, v); } catch (e) {} },
};
function applySettings() {
  const rt = store.get('rt', '1'), fs = store.get('fs', '0');
  document.body.classList.toggle('no-rt', rt === '0');
  document.body.classList.remove('fs-1', 'fs-2');
  if (fs !== '0') document.body.classList.add('fs-' + fs);
  document.querySelectorAll('[data-rt]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.rt === rt)));
  document.querySelectorAll('[data-fs]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.fs === fs)));
}

/* ---------- よみあげ ---------- */
const canSpeak = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
let speakingBtn = null;
function stopSpeak() {
  if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} }
  if (speakingBtn) { speakingBtn.classList.remove('on'); speakingBtn.querySelector('.t').textContent = 'よむ'; speakingBtn = null; }
}
function speak(text, btn) {
  if (!canSpeak) return;
  const again = speakingBtn === btn;
  stopSpeak();
  if (again) return;
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = .85;
    const v = (speechSynthesis.getVoices() || []).find(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
    if (v) u.voice = v;
    u.onend = u.onerror = () => { if (speakingBtn === btn) stopSpeak(); };
    speakingBtn = btn; btn.classList.add('on'); btn.querySelector('.t').textContent = 'とめる';
    speechSynthesis.speak(u);
  } catch (e) { stopSpeak(); }
}

/* ---------- がめん ---------- */
function photoFig(src, cap, big) {
  return '<figure class="photo"><button type="button" data-zoom="' + esc(src) + '" data-cap="' + esc(cap) + '" aria-label="しゃしんを 大きく 見る">' +
    '<img src="' + esc(src) + '" alt="' + esc(L.P(cap)) + '"' + (big ? '' : ' loading="lazy"') + ' decoding="async">' +
    '<span class="zoom">' + IC('arrows-out') + '</span></button>' +
    '<figcaption>' + R(cap) + '</figcaption></figure>';
}

function viewCover() {
  const pick = ['otter', 'koala', 'penguin', 'octopus', 'chameleon', 'giraffe', 'flamingo', 'ladybug', 'seaturtle', 'frog'];
  return '<div class="sheet cover">' +
    '<h1>いきもの<br>ひみつずかん</h1>' +
    '<p class="sub">30しゅるいの いきものの ひみつが 入って います</p>' +
    '<div class="collage">' + pick.map(k => { const a = ANIMALS.find(x => x.k === k);
      return '<button type="button" data-go="p' + a.page + '" aria-label="' + esc(a.n) + '"><img src="' + L.photo(a, 'thumb') + '" alt="' + esc(a.n) + '"></button>'; }).join('') + '</div>' +
    '<div class="btnrow"><button class="bigbtn" type="button" data-go="mokuji">' + IC('list-bullets') + 'もくじを 見る</button>' +
    '<button class="bigbtn ghost" type="button" data-go="sakuin">' + IC('magnifying-glass') + 'さくいんで さがす</button></div>' +
    '<div class="howto">' +
      '<div><b><span class="n">1</span>さがす</b><p>' + R('「もくじ」や「さくいん」で、しらべたい いきものの ページを さがそう。') + '</p></div>' +
      '<div><b><span class="n">2</span>よむ</b><p>' + R('{知|し}りたい ことの こたえを さがしながら 「ひみつ」を {読|よ}もう。') + '</p></div>' +
      '<div><b><span class="n">3</span>{書|か}く</b><p>' + R('カードに {書|か}く ときは、{本|ほん}の だい{名|めい}「いきもの ひみつずかん」と ページも {書|か}こう。') + '</p></div>' +
    '</div>' +
    '<details class="teacher"><summary>先生へ</summary>' +
      '<p>東京書籍『新編 新しい国語 二下』の「ビーバーのひみつをつたえよう」「本でしらべる」「『どうぶつカード』を作ろう」で、図鑑の かわりに つかう ことを 考えて つくりました。</p>' +
      '<ul><li>いきものは 30しゅるい。どの ページも「大きさ・すむ ところ・たべもの」と、問いの 形の 見出しの「ひみつ」が 4〜5こ あります。</li>' +
      '<li>本と おなじ ように ページ番号が あるので、ワークシートの「本の だい名・ページ」を 書く れんしゅうに なります。さくいんは「なまえ（あいうえお じゅん）」と「知りたい こと（からだ・たべもの など）」の 2しゅるいです。</li>' +
      '<li>文は この 図鑑の ための オリジナルです。漢字は 2年生までに ならう 字だけで、ぜんぶ ふりがなつき。ふりがなと 文字の 大きさは 右上の「もじ」で かえられます。</li>' +
      '<li>しゃしんは Wikimedia Commons の パブリックドメイン（CC0 など）の ものです。数字などの 内容は、授業の まえに 一度 お目通しください。</li>' +
      '<li>ページの URL（例：…/ikimono-zukan/#p4）を くばると、その ページが ひらきます。</li></ul>' +
    '</details>' +
    '</div>';
}

function viewMokuji() {
  return '<div class="sheet"><div class="ptitle"><h1>もくじ</h1><span>いきものの なまえと ページ</span></div>' +
    GROUPS.map(g => '<section class="grp" style="' + gvars(g.id) + '"><h2>' + R(g.name) + ' <small>' + R(g.sub) + '</small></h2><div class="cards">' +
      ANIMALS.filter(a => a.g === g.id).map(a =>
        '<button class="acard" type="button" data-go="p' + a.page + '"><img src="' + L.photo(a, 'thumb') + '" alt="" loading="lazy"><span><b>' + esc(a.n) + '</b><i>' + a.page + 'ページ</i></span></button>'
      ).join('') + '</div></section>').join('') +
    '<span class="corner">' + L.MOKUJI_PAGE + '</span></div>';
}

let sakuinTab = 'kana';
function viewSakuin() {
  const tabs = '<div class="tabs" role="tablist">' +
    '<button class="tbtn' + (sakuinTab === 'kana' ? ' on' : '') + '" type="button" role="tab" aria-selected="' + (sakuinTab === 'kana') + '" data-tab="kana">なまえで さがす（あいうえお じゅん）</button>' +
    '<button class="tbtn' + (sakuinTab === 'cat' ? ' on' : '') + '" type="button" role="tab" aria-selected="' + (sakuinTab === 'cat') + '" data-tab="cat">' + R('{知|し}りたい ことで さがす') + '</button></div>';
  let body;
  if (sakuinTab === 'kana') {
    body = '<div class="kana">' + L.kanaIndex().map(r => '<div class="krow"><h3>' + r.row + '</h3>' +
      r.items.map(a => '<button class="irow" type="button" data-go="p' + a.page + '"><span>' + esc(a.n) + '</span><span class="dots"></span><span class="pg">' + a.page + 'ページ</span></button>').join('') +
      '</div>').join('') + '</div>';
  } else {
    const idx = L.catIndex();
    body = '<div class="tabs jump">' + idx.map(({ cat, items }) => '<button class="tbtn" type="button" data-jump="cat-' + cat.id + '">' + IC(cat.ic) + R(cat.name) + '（' + items.length + '）</button>').join('') + '</div>' +
      '<div class="catlist">' + idx.map(({ cat, items }) => '<section class="cat" id="cat-' + cat.id + '"><h3>' + IC(cat.ic) + R(cat.name) + '</h3><div class="cols">' +
      items.map(({ a, s }) => '<button class="irow" type="button" data-go="p' + a.page + '" data-secret="' + s.no + '"><span class="who">' + esc(a.n) + '</span><span class="q">' + R(s.q) + '</span><span class="dots"></span><span class="pg">' + a.page + 'ページ</span></button>').join('') +
      '</div></section>').join('') + '</div>';
  }
  return '<div class="sheet"><div class="ptitle"><h1>さくいん</h1><span>' + R('しらべたい ことが {何|なん}ページに あるか さがそう') + '</span></div>' + tabs + body +
    '<span class="corner">' + L.SAKUIN_PAGE + '</span></div>';
}

function viewAnimal(a) {
  const g = groupOf(a.g);
  const data = '<dl class="data">' + DATA_LABELS.map((l, i) => '<div><dt>' + IC(l.ic) + R(l.name) + '</dt><dd>' + R(a.d[i]) + '</dd></div>').join('') + '</dl>';
  const secrets = L.secretsOf(a).map(s => { const c = catOf(s.cat);
    return '<article class="secret" id="h' + s.no + '"><div class="top"><span class="no">ひみつ ' + s.no + '</span>' +
      '<span class="chip">' + IC(c.ic) + R(c.name) + '</span>' +
      '<button class="say" type="button" data-say="' + s.no + '">' + IC('speaker-high') + '<span class="t">よむ</span></button></div>' +
      '<h3>' + R(s.q) + '</h3><p>' + R(s.t) + '</p>' + (s.p ? photoFig('assets/photos/' + s.p + '.jpg', s.c, false) : '') + '</article>'; }).join('');
  return '<div class="sheet" style="' + gvars(a.g) + '">' +
    '<span class="band">' + R(g.name) + '</span>' +
    '<div class="hero">' + photoFig(L.photo(a, 'main'), a.cap, true) +
      '<div><h1 class="aname">' + esc(a.n) + '</h1><p class="lead">' + R(a.lead) + '</p>' + data +
      '<p class="memo">' + R('カードに {書|か}く とき　{本|ほん}の だい{名|めい}：') + '<q>' + L.BOOK + '</q>　ページ：<b>' + a.page + 'ページ</b></p></div></div>' +
    '<div class="hhead"><h2>' + esc(a.n) + 'の ひみつ</h2></div>' +
    '<div class="secrets">' + secrets + '</div>' +
    '<span class="corner">' + a.page + '</span></div>';
}

let route = 'cover';
function render(focusSecret) {
  stopSpeak();
  route = L.normalize(location.hash);
  const a = L.animalByRoute(route);
  main.innerHTML = route === 'mokuji' ? viewMokuji() : route === 'sakuin' ? viewSakuin() : a ? viewAnimal(a) : viewCover();
  window.ZukanIcons.fill(main);
  const pg = L.pageOfRoute(route);
  $('#pageno').innerHTML = pg ? '<b>' + pg + '</b> ページ' : 'ひょうし';
  const pv = L.step(route, -1), nx = L.step(route, 1);
  $('#prev').disabled = !pv; $('#next').disabled = !nx;
  $('#prevName').textContent = pv ? routeName(pv) : '';
  $('#nextName').textContent = nx ? routeName(nx) : '';
  $('#toMokuji').classList.toggle('on', route === 'mokuji');
  $('#toSakuin').classList.toggle('on', route === 'sakuin');
  document.title = (a ? a.n + '（' + a.page + 'ページ）｜' : route === 'mokuji' ? 'もくじ｜' : route === 'sakuin' ? 'さくいん｜' : '') + L.BOOK;
  const target = focusSecret && document.getElementById('h' + focusSecret);
  if (target) scrollToEl(target);
  else window.scrollTo(0, 0);
}
function scrollToEl(el) {
  const bar = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--bar'), 10) || 58;
  window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - bar - 14);
}
function routeName(r) {
  if (r === 'cover') return 'ひょうし';
  if (r === 'mokuji') return 'もくじ';
  if (r === 'sakuin') return 'さくいん';
  const a = L.animalByRoute(r); return a ? a.n : '';
}
let pendingSecret = null;
function go(r, secret) {
  pendingSecret = secret || null;
  if (location.hash.replace(/^#/, '') === r) render(pendingSecret);
  else location.hash = r;
}
window.addEventListener('hashchange', () => { render(pendingSecret); pendingSecret = null; });

/* ---------- そうさ ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) { if (!e.target.closest('#menu')) closeMenu(); return; }
  if (t.id !== 'setBtn' && !t.closest('#menu')) closeMenu();
  if (t.dataset.go) return go(t.dataset.go, t.dataset.secret);
  if (t.dataset.tab) { sakuinTab = t.dataset.tab; return render(); }
  if (t.dataset.jump) { const el = document.getElementById(t.dataset.jump); if (el) scrollToEl(el); return; }
  if (t.dataset.zoom) return openLb(t.dataset.zoom, t.dataset.cap);
  if (t.dataset.say) {
    const a = L.animalByRoute(route); const s = a && L.secretsOf(a)[+t.dataset.say - 1];
    if (s) speak(L.speechText(s.q + '。' + s.t), t);
    return;
  }
  if (t.dataset.rt) { store.set('rt', t.dataset.rt); return applySettings(); }
  if (t.dataset.fs) { store.set('fs', t.dataset.fs); return applySettings(); }
});
$('#toCover').onclick = () => go('cover');
$('#toMokuji').onclick = () => go('mokuji');
$('#toSakuin').onclick = () => go('sakuin');
$('#prev').onclick = () => { const r = L.step(route, -1); if (r) go(r); };
$('#next').onclick = () => { const r = L.step(route, 1); if (r) go(r); };
const menu = $('#menu');
function closeMenu() { menu.hidden = true; $('#setBtn').setAttribute('aria-expanded', 'false'); }
$('#setBtn').onclick = () => { menu.hidden = !menu.hidden; $('#setBtn').setAttribute('aria-expanded', String(!menu.hidden)); };

const lb = $('#lb');
function openLb(src, cap) { $('#lbImg').src = src; $('#lbImg').alt = L.P(cap); $('#lbCap').innerHTML = R(cap); lb.hidden = false; $('#lbClose').focus(); }
function closeLb() { lb.hidden = true; $('#lbImg').removeAttribute('src'); }
$('#lbClose').onclick = closeLb;
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

document.addEventListener('keydown', e => {
  if (!lb.hidden) { if (e.key === 'Escape') closeLb(); return; }
  if (e.key === 'Escape') return closeMenu();
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowLeft') { const r = L.step(route, -1); if (r) go(r); }
  if (e.key === 'ArrowRight') { const r = L.step(route, 1); if (r) go(r); }
});

/* よこに スワイプで ページを めくる（たての スクロールとは まちがえない） */
let sx = null, sy = 0, st = 0;
main.addEventListener('touchstart', e => { if (e.touches.length !== 1) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive: true });
main.addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Date.now() - st > 700 || Math.abs(dx) < 90 || Math.abs(dy) > Math.abs(dx) * .5) return;
  const r = L.step(route, dx < 0 ? 1 : -1); if (r) go(r);
}, { passive: true });

if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
window.ZukanIcons.fill(document);
applySettings();
render();
})();
</script>
</body>
</html>
