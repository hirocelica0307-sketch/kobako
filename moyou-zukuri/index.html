<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e98aa3">
<meta name="description" content="2年生の 算数「三角形と 四角形」で、正方形・長方形・直角三角形の 色紙を ならべて もようを つくる アプリ。">
<title>もようづくり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* もようづくり ── 見ため
   ------------------------------------------------------------------
   Chromebook（1366×768）と 電子黒板（1920×1080）の どちらでも くずれない ように、
   文字の 大きさは 画面に あわせて かわります（rem）。ページは スクロールしません。
   だいし（ボード）が のこりを ぜんぶ つかいます。
   ------------------------------------------------------------------ */
:root{
    --bg:     #f6f2ea;
    --panel:  #ffffff;
    --ink:    #2f3440;
    --thin:   #7b7466;
    --line:   #e2d9c8;
    --accent: #d9577a;
    --tap:    #fdeef2;
    --warn:   #c8463b;
    --paper:  #fffefa;
    --dot:    #cfc6b4;
    --radius: 14px;
    --round: "M PLUS Rounded 1c","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
}
html{ font-size:clamp(14px, calc(.85vw + .6vh), 24px); height:100%; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
    margin:0; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
    background:var(--bg); color:var(--ink);
    font-family:var(--round); font-weight:800;
    -webkit-user-select:none; user-select:none;
}
button{ font:inherit; color:inherit; cursor:pointer; }
[hidden]{ display:none !important; }
rt{ font-size:.5em; font-weight:500; }

.btn{
    min-height:max(48px, 2.9rem); min-width:48px; padding:.25rem .85rem;
    display:inline-flex; align-items:center; justify-content:center; gap:.35rem;
    border:2px solid var(--line); border-radius:var(--radius);
    background:var(--panel); font-size:1rem; line-height:1.2; white-space:nowrap;
    transition:transform .08s, background .15s, border-color .15s;
}
.btn:active{ transform:scale(.95); }
.btn:disabled{ opacity:.35; cursor:default; transform:none; }
.btn.on{ background:var(--tap); border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
.btn.go{ background:var(--accent); border-color:var(--accent); color:#fff; }

/* ---------- うえの バー ---------- */
.bar{
    display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
    padding:.45rem .8rem; background:var(--panel); border-bottom:2px solid var(--line);
}
.bar h1{ margin:0 .4rem 0 0; font-size:1.35rem; letter-spacing:.06em; color:var(--accent); }
.grp{ display:flex; gap:.35rem; align-items:center; }
.grp + .grp{ padding-left:.6rem; border-left:2px dashed var(--line); }
.spacer{ flex:1; }

/* ---------- まんなか ---------- */
.main{ flex:1; min-height:0; display:flex; gap:.7rem; padding:.7rem; }

/* いろがみの はこ */
.palette{
    width:clamp(150px, 12.5rem, 260px); flex:none;
    display:flex; flex-direction:column; gap:.5rem;
    background:var(--panel); border:2px solid var(--line); border-radius:18px; padding:.6rem;
}
.palette h2{ margin:0; font-size:1rem; text-align:center; color:var(--thin); }
.prow{ display:flex; flex-direction:column; gap:.2rem; }
.prow .name{ font-size:.82rem; color:var(--thin); text-align:center; line-height:1.6; }
.pbtns{ display:grid; grid-template-columns:1fr 1fr; gap:.4rem; }
.pbtn{
    aspect-ratio:1; min-height:48px; padding:12%;
    border:3px solid var(--line); border-radius:16px; background:#faf8f3;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; transition:transform .08s, border-color .15s, background .15s;
}
.pbtn svg{ width:100%; height:100%; overflow:visible; }
.pbtn.sel{ border-color:var(--accent); background:var(--tap); box-shadow:0 0 0 2px var(--accent) inset; }
.pbtn:active{ transform:scale(.94); }
.palette .rot{ width:100%; }
.count{ margin-top:auto; text-align:center; font-size:.9rem; color:var(--thin); }
.count b{ font-size:1.5rem; color:var(--ink); }

/* だいし */
.stage{ flex:1; min-width:0; display:flex; flex-direction:column; gap:.5rem; }
.boardwrap{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
#board{
    display:block; background:var(--paper); border-radius:6px;
    box-shadow:0 0 0 2px var(--line), 0 6px 18px rgba(80,60,30,.12);
    touch-action:none; overflow:visible;
}
#board.erase{ cursor:crosshair; }
#board.nogrid #gridRect, body.show #gridRect{ display:none; }
.hint{
    min-height:2.4rem; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:1rem; color:var(--thin); padding:0 .5rem;
}
.hint.bad{ color:var(--warn); }

/* いろがみ */
.pc{ stroke:#fff; stroke-width:.07; stroke-linejoin:round; }
.pc.pop{ animation:pop .22s ease-out; transform-box:fill-box; transform-origin:center; }
@keyframes pop{ from{ transform:scale(.82); } to{ transform:scale(1); } }
.pc.gone{ animation:gone .2s ease-in forwards; transform-box:fill-box; transform-origin:center; }
@keyframes gone{ to{ transform:scale(.6); opacity:0; } }
.ghost{ fill-opacity:.45; stroke:#6b6253; stroke-width:.05; stroke-dasharray:.16 .1; pointer-events:none; }
.ghost.no{ fill:#e4574a !important; fill-opacity:.35; stroke:var(--warn); }
.ghost.flash{ animation:flash .45s ease-out forwards; }
@keyframes flash{ to{ opacity:0; } }

/* もちあるいている いろがみ（ゆびの 下） */
#float{ position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:50; overflow:visible; }
#float .pc{ filter:drop-shadow(0 .06px .12px rgba(0,0,0,.25)); }
#float.out .pc{ opacity:.45; }

/* かざる（みんなに 見せる） */
body.show .bar .grp, body.show .palette, body.show .hint{ display:none; }
body.show .bar .showonly{ display:inline-flex; }
.showonly{ display:none; }

/* ダイアログ */
dialog{
    border:3px solid var(--line); border-radius:22px; padding:1.4rem 1.6rem; max-width:min(560px, 92vw);
    font-family:var(--round); font-weight:800; color:var(--ink); text-align:center;
}
dialog::backdrop{ background:rgba(40,30,20,.35); }
dialog p{ font-size:1.25rem; margin:.2rem 0 1.2rem; }
dialog .row{ display:flex; gap:.8rem; justify-content:center; }
dialog .btn{ min-width:7.5rem; font-size:1.1rem; }
</style>
</head>
<body>

<header class="bar">
    <h1>もようづくり</h1>
    <div class="grp" role="group" aria-label="そうさ">
        <button class="btn on" id="modePut" aria-pressed="true">おく</button>
        <button class="btn" id="modeErase" aria-pressed="false">けす</button>
    </div>
    <div class="grp">
        <button class="btn" id="undo" disabled>もどす</button>
        <button class="btn" id="clear">ぜんぶ けす</button>
    </div>
    <div class="grp">
        <button class="btn on" id="gridBtn" aria-pressed="true">ます目</button>
        <button class="btn" id="sizeBtn">ひろさ：ふつう</button>
    </div>
    <div class="spacer"></div>
    <div class="grp">
        <button class="btn go" id="showBtn">かざる</button>
    </div>
    <button class="btn showonly" id="backBtn">もどる</button>
</header>

<div class="main">
    <aside class="palette" aria-label="いろがみ">
        <h2>いろがみ</h2>
        <div id="pal"></div>
        <button class="btn rot" id="rotBtn">むきを かえる</button>
        <div class="count">おいた いろがみ<br><b id="count">0</b> まい</div>
    </aside>

    <section class="stage">
        <div class="boardwrap" id="wrap">
            <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="だいし">
                <defs>
                    <pattern id="dots" patternUnits="userSpaceOnUse" width="2" height="2">
                        <circle cx="0" cy="0" r=".07" fill="var(--dot)"/>
                        <circle cx="2" cy="0" r=".07" fill="var(--dot)"/>
                        <circle cx="0" cy="2" r=".07" fill="var(--dot)"/>
                        <circle cx="2" cy="2" r=".07" fill="var(--dot)"/>
                        <circle cx="1" cy="0" r=".04" fill="var(--dot)"/>
                        <circle cx="0" cy="1" r=".04" fill="var(--dot)"/>
                        <circle cx="1" cy="1" r=".04" fill="var(--dot)"/>
                        <circle cx="2" cy="1" r=".04" fill="var(--dot)"/>
                        <circle cx="1" cy="2" r=".04" fill="var(--dot)"/>
                    </pattern>
                </defs>
                <rect id="gridRect" x="0" y="0" fill="url(#dots)"/>
                <g id="pieces"></g>
                <g id="ghosts"></g>
            </svg>
        </div>
        <div class="hint" id="hint" aria-live="polite"></div>
    </section>
</div>

<svg id="float" xmlns="http://www.w3.org/2000/svg"></svg>

<dialog id="clearDlg">
    <p>いろがみを ぜんぶ けしますか？</p>
    <div class="row">
        <button class="btn" id="clearNo">やめる</button>
        <button class="btn go" id="clearYes">けす</button>
    </div>
</dialog>

<script>
// ==LOGIC==
/* もようづくりの きまり（画面に かかわらない 計算だけ。tests.js で たしかめます）
   ------------------------------------------------------------------
   ・だいしは「ます」の あつまり。1ます ＝ 色紙の 正方形の 半分の 長さ。
     正方形 2×2ます、長方形 2×1ます（たてなら 1×2）、直角三角形 2×2ます の 半分。
   ・かさなりは 1ますを 対角線で 4つに わけた「よすみの 三角（北・東・南・西）」で しらべる。
     こうすると 直角三角形 2まいを くみあわせて 正方形に できる。
   ------------------------------------------------------------------ */
(function (root) {
    'use strict';
    const TYPES = [
        { shape: 'sq', fill: '#f19cb3' },   // 0 ピンクの 正方形
        { shape: 'sq', fill: '#f8cfda' },   // 1 うすい ピンクの 正方形
        { shape: 're', fill: '#9ccc80' },   // 2 みどりの 長方形
        { shape: 're', fill: '#d6eac3' },   // 3 うすい みどりの 長方形
        { shape: 'tr', fill: '#f09a32' },   // 4 オレンジの 直角三角形
        { shape: 'tr', fill: '#f8cc55' },   // 5 きいろの 直角三角形
    ];
    const SHAPES = {
        sq: { name: '正方形',     yomi: 'せいほうけい',       turns: 1 },
        re: { name: '長方形',     yomi: 'ちょうほうけい',     turns: 2 },
        tr: { name: '直角三角形', yomi: 'ちょっかくさんかくけい', turns: 4 },
    };
    const SIZES = [
        { key: 'semai', label: 'せまい', cols: 16, rows: 10 },
        { key: 'futsu', label: 'ふつう', cols: 24, rows: 14 },
        { key: 'hiroi', label: 'ひろい', cols: 32, rows: 20 },
    ];

    const shapeOf = t => TYPES[t].shape;
    const norm = (shape, r) => { const n = SHAPES[shape].turns; return ((r % n) + n) % n; };

    /* かたち（ますの 単位。左うえが 0,0） */
    function polygon(shape, r) {
        r = norm(shape, r);
        if (shape === 'sq') return [[0, 0], [2, 0], [2, 2], [0, 2]];
        if (shape === 're') return r === 0 ? [[0, 0], [2, 0], [2, 1], [0, 1]] : [[0, 0], [1, 0], [1, 2], [0, 2]];
        // 直角の かど：0 左うえ・1 右うえ・2 右した・3 左した（とけいまわりに まわる）
        return [
            [[0, 0], [2, 0], [0, 2]],
            [[0, 0], [2, 0], [2, 2]],
            [[2, 0], [2, 2], [0, 2]],
            [[0, 0], [2, 2], [0, 2]],
        ][r];
    }
    function size(shape, r) {
        if (shape === 're') return norm(shape, r) === 0 ? { w: 2, h: 1 } : { w: 1, h: 2 };
        return { w: 2, h: 2 };
    }
    function inside(x, y, poly) {
        let c = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const [xi, yi] = poly[i], [xj, yj] = poly[j];
            if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
        }
        return c;
    }
    /* 1ますの よすみの 三角の まんなか（北・東・南・西） */
    const QC = [[.5, 1 / 6], [5 / 6, .5], [.5, 5 / 6], [1 / 6, .5]];
    function quarters(p) {
        const sh = shapeOf(p.t), poly = polygon(sh, p.r), s = size(sh, p.r), out = [];
        for (let cy = 0; cy < s.h; cy++) for (let cx = 0; cx < s.w; cx++) for (let q = 0; q < 4; q++) {
            if (inside(cx + QC[q][0], cy + QC[q][1], poly)) out.push((p.x + cx) + ',' + (p.y + cy) + ',' + q);
        }
        return out;
    }
    function occupancy(pieces, exceptId) {
        const m = new Map();
        for (const p of pieces) if (p.id !== exceptId) for (const k of quarters(p)) m.set(k, p.id);
        return m;
    }
    function inBounds(p, cols, rows) {
        const s = size(shapeOf(p.t), p.r);
        return p.x >= 0 && p.y >= 0 && p.x + s.w <= cols && p.y + s.h <= rows;
    }
    function fits(p, pieces, cols, rows, exceptId) {
        if (!inBounds(p, cols, rows)) return false;
        const occ = occupancy(pieces, exceptId);
        return quarters(p).every(k => !occ.has(k));
    }
    /* かたちの まんなか（重心） */
    function center(shape, r) {
        const poly = polygon(shape, r);
        return { x: poly.reduce((a, q) => a + q[0], 0) / poly.length, y: poly.reduce((a, q) => a + q[1], 0) / poly.length };
    }
    /* ゆびの ところ（px, py）が まんなかに くる ように ますに そろえる */
    function anchorAt(shape, r, px, py) {
        const c = center(shape, r);
        return { x: Math.round(px - c.x), y: Math.round(py - c.y) };
    }
    /* すいつき：のぞむ 左うえ（rx, ry。小数）の ちかくで、おける ところの うち いちばん ちかい ますを えらぶ。
       ちょっと ずれた ところを タップしても、すきまに ぴたっと 入る。
       おける ところが なければ ok:false と、いちばん ちかい ますを かえす。 */
    function snapNear(p, rx, ry, pieces, cols, rows, exceptId, limit, mustCover) {
        let best = null, bs = Infinity;
        const poly = mustCover && polygon(shapeOf(p.t), p.r);
        const occ = occupancy(pieces, exceptId);
        for (let y = Math.floor(ry) - 1; y <= Math.ceil(ry) + 1; y++) {
            for (let x = Math.floor(rx) - 1; x <= Math.ceil(rx) + 1; x++) {
                const d = Math.hypot(x - rx, y - ry);
                if (d > limit) continue;
                if (poly && !inside(mustCover.x - x, mustCover.y - y, poly)) continue;
                const q = Object.assign({}, p, { x, y });
                if (!inBounds(q, cols, rows)) continue;
                const ks = quarters(q);
                if (ks.some(k => occ.has(k))) continue;
                // おなじ くらい ちかい ときは、まわりの いろがみに ぴったり くっつく ほう
                const score = d - 0.06 * contacts(ks, occ);
                if (score < bs) { best = q; bs = score; }
            }
        }
        if (best) return { ok: true, p: best };
        return { ok: false, p: Object.assign({}, p, { x: Math.round(rx), y: Math.round(ry) }) };
    }
    /* よすみの 三角が となりあう 数（辺で くっついている ところ） */
    const NB = [[0, -1, 2], [1, 0, 3], [0, 1, 0], [-1, 0, 1]];   // 北→上の ますの 南、東→右の 西 …
    function contacts(keys, occ) {
        let n = 0;
        for (const k of keys) {
            const [x, y, q] = k.split(',').map(Number);
            const [dx, dy, oq] = NB[q];
            if (occ.has((x + dx) + ',' + (y + dy) + ',' + oq)) n++;
            if (occ.has(x + ',' + y + ',' + ((q + 1) % 4))) n++;
            if (occ.has(x + ',' + y + ',' + ((q + 3) % 4))) n++;
        }
        return n;
    }
    /* ゆびの ところに いろがみを おく ための すいつき（かならず ゆびの 下に くる。なぞると まっすぐ ならぶ） */
    function snapAtPointer(t, r, px, py, pieces, cols, rows) {
        const c = center(shapeOf(t), r);
        return snapNear({ id: 0, t, r }, px - c.x, py - c.y, pieces, cols, rows, undefined, 1.5, { x: px, y: py });
    }
    /* ゆびの 下の いろがみ（なければ null） */
    function pieceAt(pieces, px, py) {
        for (let i = pieces.length - 1; i >= 0; i--) {
            const p = pieces[i];
            if (inside(px - p.x, py - p.y, polygon(shapeOf(p.t), p.r))) return p;
        }
        return null;
    }
    /* はみださない ように ずらす */
    function clampInto(p, cols, rows) {
        const s = size(shapeOf(p.t), p.r);
        return Object.assign({}, p, {
            x: Math.max(0, Math.min(cols - s.w, p.x)),
            y: Math.max(0, Math.min(rows - s.h, p.y)),
        });
    }
    /* その場で 90° まわす（まわせなければ null） */
    function rotateInPlace(p, pieces, cols, rows) {
        const sh = shapeOf(p.t);
        if (SHAPES[sh].turns === 1) return null;
        const q = clampInto(Object.assign({}, p, { r: norm(sh, p.r + 1) }), cols, rows);
        return fits(q, pieces, cols, rows, p.id) ? q : null;
    }
    function allInBounds(pieces, cols, rows) { return pieces.every(p => inBounds(p, cols, rows)); }

    root.MoyouLogic = {
        TYPES, SHAPES, SIZES, shapeOf, norm, polygon, size, inside, quarters, occupancy,
        inBounds, fits, center, anchorAt, snapNear, snapAtPointer, pieceAt, clampInto, rotateInPlace, allInBounds,
    };
})(globalThis);
// ==/LOGIC==
</script>

<script>
(function () {
    'use strict';
    const L = window.MoyouLogic;
    const $ = s => document.querySelector(s);
    const NS = 'http://www.w3.org/2000/svg';
    const KEY = 'moyou-zukuri:v1';
    const DRAG_PX = 8;

    /* ---------- じょうたい ---------- */
    const state = {
        pieces: [],          // { id, t, r, x, y }
        sel: 0,              // えらんでいる いろがみ（TYPES の 番号）
        prot: { sq: 0, re: 0, tr: 0 },   // はこの いろがみの むき
        mode: 'put',         // put / erase
        grid: true,
        size: 1,             // SIZES の 番号
    };
    let nextId = 1;
    let history = [];
    let cell = 40;           // 1ますの 大きさ（px）
    const fresh = new Set();

    const dims = () => L.SIZES[state.size];

    /* ---------- ほぞん（この 端末の ブラウザに） ---------- */
    function save() {
        try {
            localStorage.setItem(KEY, JSON.stringify({
                pieces: state.pieces, sel: state.sel, prot: state.prot, grid: state.grid, size: state.size,
            }));
        } catch (e) { /* ほぞん できなくても つかえる */ }
    }
    function load() {
        try {
            const d = JSON.parse(localStorage.getItem(KEY) || 'null');
            if (!d) return;
            if (Number.isInteger(d.size) && L.SIZES[d.size]) state.size = d.size;
            if (Number.isInteger(d.sel) && L.TYPES[d.sel]) state.sel = d.sel;
            if (d.prot) for (const k of ['sq', 're', 'tr']) state.prot[k] = L.norm(k, d.prot[k] | 0);
            state.grid = d.grid !== false;
            const { cols, rows } = dims();
            const ok = [];
            for (const p of Array.isArray(d.pieces) ? d.pieces : []) {
                if (!p || !L.TYPES[p.t]) continue;
                const q = { id: nextId++, t: p.t, r: L.norm(L.shapeOf(p.t), p.r | 0), x: p.x | 0, y: p.y | 0 };
                if (L.fits(q, ok, cols, rows)) ok.push(q);
            }
            state.pieces = ok;
        } catch (e) { /* こわれていたら まっさらから */ }
    }

    /* ---------- もどす ---------- */
    const snap = () => JSON.stringify(state.pieces);
    function pushHistory(before) {
        history.push(before);
        if (history.length > 200) history.shift();
        $('#undo').disabled = false;
    }
    function undo() {
        if (!history.length) return;
        state.pieces = JSON.parse(history.pop());
        $('#undo').disabled = !history.length;
        changed();
        say('ひとつ もどしたよ');
    }

    /* ---------- ことば ---------- */
    let hintTimer = 0;
    function baseHint() {
        return state.mode === 'erase'
            ? 'けしたい いろがみを タップ（なぞる）と けせるよ'
            : 'いろがみを えらんで だいしを タップ（なぞる）と おけるよ。おいた いろがみは タップで まわる・ドラッグで うごく';
    }
    function say(msg, bad) {
        const h = $('#hint');
        h.textContent = msg;
        h.classList.toggle('bad', !!bad);
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => { h.textContent = baseHint(); h.classList.remove('bad'); }, 2600);
    }

    /* ---------- かく ---------- */
    function polyEl(p, cls) {
        const T = L.TYPES[p.t];
        const el = document.createElementNS(NS, 'polygon');
        el.setAttribute('points', L.polygon(T.shape, p.r).map(([a, b]) => (p.x + a) + ',' + (p.y + b)).join(' '));
        el.setAttribute('fill', T.fill);
        el.setAttribute('class', cls);
        return el;
    }
    function render() {
        const g = $('#pieces');
        g.textContent = '';
        for (const p of state.pieces) {
            if (carry && carry.fromId === p.id) continue;
            g.appendChild(polyEl(p, 'pc' + (fresh.has(p.id) ? ' pop' : '')));
        }
        fresh.clear();
        $('#count').textContent = state.pieces.length;
    }
    function changed() { render(); save(); }

    function clearGhosts() { $('#ghosts').textContent = ''; }
    function ghost(p, ok, flash) {
        clearGhosts();
        if (!p) return;
        $('#ghosts').appendChild(polyEl(p, 'ghost' + (ok ? '' : ' no') + (flash ? ' flash' : '')));
    }

    function layout() {
        const { cols, rows } = dims();
        const wrap = $('#wrap');
        const W = wrap.clientWidth - 8, H = wrap.clientHeight - 8;
        cell = Math.max(8, Math.floor(Math.min(W / cols, H / rows)));
        const b = $('#board');
        b.setAttribute('viewBox', `0 0 ${cols} ${rows}`);
        b.setAttribute('width', cols * cell);
        b.setAttribute('height', rows * cell);
        const gr = $('#gridRect');
        gr.setAttribute('width', cols);
        gr.setAttribute('height', rows);
        b.classList.toggle('nogrid', !state.grid);
    }

    /* ---------- いろがみの はこ ---------- */
    function renderPalette() {
        const pal = $('#pal');
        pal.textContent = '';
        for (const sh of ['sq', 're', 'tr']) {
            const row = document.createElement('div');
            row.className = 'prow';
            const S = L.SHAPES[sh];
            row.innerHTML = `<div class="name"><ruby>${S.name}<rt>${S.yomi}</rt></ruby></div>`;
            const btns = document.createElement('div');
            btns.className = 'pbtns';
            L.TYPES.forEach((T, t) => {
                if (T.shape !== sh) return;
                const r = state.prot[sh], s = L.size(sh, r);
                const b = document.createElement('button');
                b.className = 'pbtn' + (t === state.sel ? ' sel' : '');
                b.dataset.t = t;
                b.setAttribute('aria-label', S.name);
                b.setAttribute('aria-pressed', t === state.sel);
                const pts = L.polygon(sh, r).map(([a, c]) => (a + (2 - s.w) / 2) + ',' + (c + (2 - s.h) / 2)).join(' ');
                b.innerHTML = `<svg viewBox="0 0 2 2"><polygon points="${pts}" fill="${T.fill}" stroke="rgba(0,0,0,.18)" stroke-width=".05" stroke-linejoin="round"/></svg>`;
                btns.appendChild(b);
            });
            row.appendChild(btns);
            pal.appendChild(row);
        }
        const turns = L.SHAPES[L.shapeOf(state.sel)].turns;
        $('#rotBtn').disabled = turns === 1;
    }
    function selectType(t) {
        if (state.sel === t) rotatePalette();
        else { state.sel = t; renderPalette(); save(); }
    }
    function rotatePalette() {
        const sh = L.shapeOf(state.sel);
        if (L.SHAPES[sh].turns === 1) { say('正方形は まわしても おなじ かたちだね'); return; }
        state.prot[sh] = L.norm(sh, state.prot[sh] + 1);
        renderPalette();
        save();
    }

    /* ---------- ゆびの いち ---------- */
    function toCell(e) {
        const r = $('#board').getBoundingClientRect();
        return { x: (e.clientX - r.left) / cell, y: (e.clientY - r.top) / cell };
    }
    function onBoard(pt, margin) {
        const { cols, rows } = dims();
        const m = margin || 0;
        return pt.x >= -m && pt.y >= -m && pt.x <= cols + m && pt.y <= rows + m;
    }

    /* ---------- おく・けす ---------- */
    function tryPlace(pt) {
        const sh = L.shapeOf(state.sel), r = state.prot[sh];
        const { cols, rows } = dims();
        const res = L.snapAtPointer(state.sel, r, pt.x, pt.y, state.pieces, cols, rows);
        if (!res.ok) return res;
        const p = res.p;
        p.id = nextId++;
        state.pieces.push(p);
        fresh.add(p.id);
        return { ok: true, p };
    }
    function removePiece(id) {
        const i = state.pieces.findIndex(p => p.id === id);
        if (i < 0) return false;
        state.pieces.splice(i, 1);
        return true;
    }

    /* ---------- ゆびの うごき ---------- */
    let active = null;   // いま おしている ゆび
    let carry = null;    // もちあるいている いろがみ { t, r, fromId, orig, off }

    function startCarry(t, r, fromId, orig, off) {
        carry = { t, r, fromId, orig, off };
        if (fromId) render();
    }
    function drawFloat(e) {
        const f = $('#float');
        f.textContent = '';
        if (!carry) return;
        const T = L.TYPES[carry.t];
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('transform', `translate(${e.clientX - carry.off.x * cell} ${e.clientY - carry.off.y * cell}) scale(${cell})`);
        g.appendChild(polyEl({ t: carry.t, r: carry.r, x: 0, y: 0 }, 'pc'));
        f.appendChild(g);
        const pt = toCell(e);
        const inside = onBoard(pt, 0.3);
        f.classList.toggle('out', !inside && !!carry.fromId);
        if (inside) {
            const res = carryTarget(carry, pt);
            ghost(res.p, res.ok);
        } else {
            clearGhosts();
        }
        if (!inside && carry.fromId) say('ここで はなすと けせるよ');
    }
    const CARRY_SNAP = 0.85;
    function carryTarget(c, pt) {
        const { cols, rows } = dims();
        return L.snapNear({ id: c.fromId || 0, t: c.t, r: c.r }, pt.x - c.off.x, pt.y - c.off.y,
            state.pieces, cols, rows, c.fromId, CARRY_SNAP);
    }
    function endCarry(e, cancel) {
        const c = carry;
        carry = null;
        $('#float').textContent = '';
        $('#float').classList.remove('out');
        clearGhosts();
        if (cancel) { render(); return; }
        const pt = toCell(e);
        const before = snap();
        if (!onBoard(pt, 0.3)) {
            if (c.fromId) {
                removePiece(c.fromId);
                pushHistory(before);
                changed();
                say('いろがみを けしたよ');
            } else render();
            return;
        }
        const res = carryTarget(c, pt), target = res.p;
        if (res.ok) {
            if (c.fromId) {
                const p = state.pieces.find(q => q.id === c.fromId);
                if (p.x === target.x && p.y === target.y) { render(); return; }
                p.x = target.x; p.y = target.y;
            } else {
                target.id = nextId++;
                state.pieces.push(target);
            }
            fresh.add(target.id);
            pushHistory(before);
            changed();
        } else {
            render();
            ghost(target, false, true);
            say('そこは ほかの いろがみと かさなるよ', true);
        }
    }

    function boardDown(e) {
        if (active || e.button > 0) return;
        e.preventDefault();
        const pt = toCell(e);
        const hit = L.pieceAt(state.pieces, pt.x, pt.y);
        active = { id: e.pointerId, sx: e.clientX, sy: e.clientY, kind: '', hit, before: snap(), did: false, last: '' };
        clearGhosts();
        if (state.mode === 'erase') {
            active.kind = 'erase';
            eraseAt(pt);
        } else if (hit) {
            active.kind = 'press';
        } else {
            active.kind = 'paint';
            paintAt(pt, true);
        }
    }
    function eraseAt(pt) {
        const hit = L.pieceAt(state.pieces, pt.x, pt.y);
        if (hit && removePiece(hit.id)) {
            if (!active.did) pushHistory(active.before);
            active.did = true;
            changed();
        }
    }
    function paintAt(pt, first) {
        const k = Math.floor(pt.x * 3) + ',' + Math.floor(pt.y * 3);   // 1/3 ます うごいたら もう いちど ためす
        if (k === active.last) return;
        active.last = k;
        const res = tryPlace(pt);
        if (res.ok) {
            if (!active.did) pushHistory(active.before);
            active.did = true;
            changed();
        } else if (first) {
            ghost(res.p, false, true);
            const { cols, rows } = dims();
            say(L.inBounds(res.p, cols, rows) ? 'そこは ほかの いろがみと かさなるよ' : 'だいしから はみでるよ', true);
        }
    }
    function paletteDown(e) {
        const b = e.target.closest('.pbtn');
        if (!b || active || e.button > 0) return;
        e.preventDefault();
        active = { id: e.pointerId, sx: e.clientX, sy: e.clientY, kind: 'palette', t: +b.dataset.t };
    }
    function move(e) {
        if (!active) { hover(e); return; }
        if (e.pointerId !== active.id) return;
        const far = Math.hypot(e.clientX - active.sx, e.clientY - active.sy) > DRAG_PX;
        if (active.kind === 'erase') eraseAt(toCell(e));
        else if (active.kind === 'paint') paintAt(toCell(e), false);
        else if (active.kind === 'press' && far) {
            const p = active.hit;
            const pt0 = { x: (active.sx - $('#board').getBoundingClientRect().left) / cell, y: (active.sy - $('#board').getBoundingClientRect().top) / cell };
            active.kind = 'carry';
            startCarry(p.t, p.r, p.id, p, { x: pt0.x - p.x, y: pt0.y - p.y });
        } else if (active.kind === 'palette' && far) {
            const sh = L.shapeOf(active.t), r = state.prot[sh];
            if (state.sel !== active.t) { state.sel = active.t; renderPalette(); save(); }
            active.kind = 'carry';
            startCarry(active.t, r, null, null, L.center(sh, r));
        }
        if (active.kind === 'carry') drawFloat(e);
    }
    function up(e) {
        if (!active || e.pointerId !== active.id) return;
        const a = active;
        active = null;
        if (a.kind === 'carry') endCarry(e, e.type === 'pointercancel');
        else if (a.kind === 'press' && e.type !== 'pointercancel') {
            const { cols, rows } = dims();
            const q = L.rotateInPlace(a.hit, state.pieces, cols, rows);
            if (q) {
                const p = state.pieces.find(x => x.id === a.hit.id);
                pushHistory(a.before);
                Object.assign(p, q);
                fresh.add(p.id);
                changed();
            } else if (L.SHAPES[L.shapeOf(a.hit.t)].turns === 1) {
                say('正方形は まわしても おなじ かたちだね');
            } else {
                say('まわすと ほかの いろがみと かさなるよ', true);
            }
        } else if (a.kind === 'palette' && e.type !== 'pointercancel') {
            selectType(a.t);
        }
    }
    function hover(e) {
        if (e.pointerType !== 'mouse' || state.mode !== 'put' || document.body.classList.contains('show')) return;
        if (!e.target.closest || !e.target.closest('#board')) { clearGhosts(); return; }
        const pt = toCell(e);
        const hit = L.pieceAt(state.pieces, pt.x, pt.y);
        $('#board').style.cursor = hit ? 'grab' : 'pointer';
        if (hit) { clearGhosts(); return; }
        const sh = L.shapeOf(state.sel), r = state.prot[sh];
        const { cols, rows } = dims();
        const res = L.snapAtPointer(state.sel, r, pt.x, pt.y, state.pieces, cols, rows);
        ghost(res.p, res.ok);
    }

    /* ---------- ボタン ---------- */
    function setMode(m) {
        state.mode = m;
        $('#modePut').classList.toggle('on', m === 'put');
        $('#modeErase').classList.toggle('on', m === 'erase');
        $('#modePut').setAttribute('aria-pressed', m === 'put');
        $('#modeErase').setAttribute('aria-pressed', m === 'erase');
        $('#board').classList.toggle('erase', m === 'erase');
        clearGhosts();
        say(baseHint());
    }
    function setGrid(on) {
        state.grid = on;
        $('#gridBtn').classList.toggle('on', on);
        $('#gridBtn').setAttribute('aria-pressed', on);
        layout();
        save();
    }
    function cycleSize() {
        const next = (state.size + 1) % L.SIZES.length;
        const { cols, rows } = L.SIZES[next];
        if (!L.allInBounds(state.pieces, cols, rows)) {
            say('いろがみが はみだすので せまく できないよ', true);
            return;
        }
        state.size = next;
        $('#sizeBtn').textContent = 'ひろさ：' + L.SIZES[next].label;
        layout();
        save();
    }
    function setShow(on) {
        document.body.classList.toggle('show', on);
        clearGhosts();
        layout();
    }

    $('#modePut').onclick = () => setMode('put');
    $('#modeErase').onclick = () => setMode('erase');
    $('#undo').onclick = undo;
    $('#clear').onclick = () => { if (state.pieces.length) $('#clearDlg').showModal(); };
    $('#clearNo').onclick = () => $('#clearDlg').close();
    $('#clearYes').onclick = () => {
        $('#clearDlg').close();
        pushHistory(snap());
        state.pieces = [];
        changed();
        say('ぜんぶ けしたよ。「もどす」で もとに もどせるよ');
    };
    $('#gridBtn').onclick = () => setGrid(!state.grid);
    $('#sizeBtn').onclick = cycleSize;
    $('#rotBtn').onclick = rotatePalette;
    $('#showBtn').onclick = () => setShow(true);
    $('#backBtn').onclick = () => setShow(false);

    $('#board').addEventListener('pointerdown', boardDown);
    $('#board').addEventListener('pointerleave', () => { if (!active) clearGhosts(); });
    $('#pal').addEventListener('pointerdown', paletteDown);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    window.addEventListener('resize', layout);
    window.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
        else if (e.key === 'r' || e.key === 'R') rotatePalette();
        else if (e.key === 'Escape' && document.body.classList.contains('show')) setShow(false);
    });

    /* ---------- はじめ ---------- */
    load();
    $('#sizeBtn').textContent = 'ひろさ：' + dims().label;
    $('#gridBtn').classList.toggle('on', state.grid);
    $('#gridBtn').setAttribute('aria-pressed', state.grid);
    renderPalette();
    layout();
    render();
    $('#hint').textContent = baseHint();
})();
</script>
</body>
</html>
