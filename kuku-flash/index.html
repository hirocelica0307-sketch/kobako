<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="テレビに うつして 子どもたちに 見せる 九九の フラッシュカード。よみかた つき。あがり・さがり・バラバラ、回数や 時間、秒数を えらべる。">
<title>九九フラッシュカード</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Kiwi+Maru:wght@500&display=swap">
<style>
/* 九九フラッシュカード ── 見ため
   ------------------------------------------------------------------
   テレビで 遠くからでも 読める ように、カードは しき・こたえ・よみかた だけ。
   白地に 黒、こたえ は 赤 の 1しゅるい。
   カードの 数字と よみかたは Kiwi Maru：4 の 上が ひらいて いて、9 の たてぼうが
   まっすぐ。子どもが 書く 字の 形に ちかい。太さは 文字の ふちどりで たす。
   文字の 大きさは 画面に あわせて JS で きめる（Chromebook 1366×768 でも
   テレビ 1920×1080 でも はみ出さない）。
   ------------------------------------------------------------------ */
:root{
    --font: "BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;
    --kids: "Kiwi Maru","BIZ UDPGothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
    --bg:    #ffffff;
    --fg:    #111111;
    --yomi:  #2b2d33;
    --ans:   #d4001a;   /* こたえの 赤（白地で 5.9:1） */
    --sub:   #5d6068;
    --line:  #d8d9de;
    --chip:  #f2f3f5;
    --on:    #111111;
    --on-fg: #ffffff;
    color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ── せってい ─────────────────────────────── */
#setup{
    box-sizing:border-box;min-height:100%;max-width:1180px;margin:0 auto;
    padding-block:18px 20px;padding-inline:24px;
    display:flex;flex-direction:column;gap:16px;
}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;
     border-bottom:3px solid var(--fg);padding-bottom:10px}
.top h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.top h1 em{font-style:normal;color:var(--ans)}
.keys{margin:0;font-size:13px;color:var(--sub);line-height:1.6}
.keys kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--chip)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.grp{border:0;margin:0;padding:0;min-width:0}
.grp legend{padding:0;margin-bottom:7px;font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.chip{position:relative;display:block}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chip span{
    box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;min-height:52px;min-width:64px;padding:5px 14px;line-height:1.15;
    border:2px solid var(--line);border-radius:10px;background:var(--bg);
    font-size:20px;font-weight:700;cursor:pointer;user-select:none;
}
.chip small{font-size:12px;font-weight:400;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums}
.chip:hover span{border-color:var(--sub)}
.chip input:checked + span{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.chip input:checked + span small{color:inherit;opacity:.8}
.chip input:focus-visible + span{outline:3px solid var(--ans);outline-offset:2px}
.chips.small .chip span{min-height:42px;min-width:56px;font-size:17px}
.chips.small{margin-top:8px}

/* だん：おした じゅんに ばんごうが つく */
.chip.dan span{width:52px;min-width:52px;height:56px;padding:0;font-family:var(--kids);font-weight:500;font-size:30px}
.chip.dan .ord{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;
    border-radius:11px;background:var(--ans);color:#ffffff;font:700 13px/22px var(--font);text-align:center;pointer-events:none}
.chips.dans{gap:6px}
.dan-tools{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dan-tools .hint{font-size:13px;color:var(--sub);margin-left:4px}
.link{border:0;background:none;padding:6px 6px;font-size:15px;color:var(--sub);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{color:var(--fg)}
.link:focus-visible{outline:3px solid var(--ans);outline-offset:2px;border-radius:4px}

/* なんしゅう：− ＋ で ふやす・へらす */
.stepper{box-sizing:border-box;display:flex;align-items:center;gap:4px;min-height:52px;padding:4px;
    border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.stepper.on{border-color:var(--on);box-shadow:inset 0 0 0 1px var(--on)}
.stepper button{width:44px;height:40px;border:0;border-radius:7px;background:var(--chip);font-size:26px;font-weight:700;line-height:1;cursor:pointer}
.stepper button:hover{background:var(--line)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper button:focus-visible{outline:3px solid var(--ans);outline-offset:1px}
.stepper output{min-width:96px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}

.go{margin-top:auto;display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
#summary{flex:1 1 360px;min-width:0;margin:0;font-size:17px;line-height:1.55}
#summary .warn{color:var(--ans);font-weight:700}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--sub);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--fg)}
.big{border:0;border-radius:12px;padding:14px 36px;font-size:26px;font-weight:700;cursor:pointer;
     background:var(--ans);color:#ffffff}
.big:disabled{opacity:.35;cursor:not-allowed}
.big.plain{background:var(--chip);color:var(--fg);border:2px solid var(--line)}
.big:focus-visible{outline:3px solid var(--fg);outline-offset:3px}

@media (max-width:860px){
    .cols{grid-template-columns:1fr}
    #setup{padding-inline:16px}
    .top h1{font-size:24px}
}

/* ── カード ─────────────────────────────── */
#play{position:fixed;inset:0;background:var(--bg);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card{display:flex;align-items:flex-end;justify-content:center;white-space:nowrap;
      font-family:var(--kids);font-weight:500;line-height:1;color:var(--fg);
      font-variant-numeric:tabular-nums}
.seg{display:flex;flex-direction:column}
.s1{align-items:center;min-width:var(--w1,0)}
.s2{align-items:flex-start;min-width:var(--w2,0)}
.yomi{font-size:.3em;line-height:1.25;margin-bottom:.12em;color:var(--yomi);letter-spacing:.04em}
.s2 .yomi{color:var(--ans)}
.nums{display:flex;align-items:center;-webkit-text-stroke:.022em currentColor;paint-order:stroke fill}
.op{margin:0 .14em}
.n1,.n2{display:inline-block;min-width:var(--dw,0);text-align:center}  /* Kiwi Maru の 数字は はばが ちがうので そろえる */
.eq{margin:0 .14em}
.ans{color:var(--ans)}
.card.noyomi .yomi{display:none}
.card.line.q .s2{visibility:hidden}
.card.flip.q .s2{display:none}
.card.flip.a .s1,.card.flip.a .s2 .yomi,.card.flip.a .eq{display:none}
.card.flip.a .s2{min-width:0;align-items:center}
.card.reveal .s2{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card.reveal .s2{animation:none}}
#measure{position:absolute;left:-9999px;top:0;visibility:hidden;font-size:100px}

#bar{position:absolute;left:0;right:0;bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;
     padding-inline:16px;transition:opacity .3s}
#paused{font-size:18px;color:var(--sub)}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.btns button{font-size:16px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--chip);cursor:pointer}
.btns button:hover{border-color:var(--sub)}
.btns button:focus-visible{outline:3px solid var(--ans);outline-offset:2px}
#play.idle,#play.idle #stage{cursor:none}
#play.idle #bar{opacity:0;pointer-events:none}

/* ── おしまい ─────────────────────────────── */
#done{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;padding-inline:16px}
.done-big{margin:0;font-family:var(--kids);font-weight:500;font-size:min(20vh,15vw);line-height:1.1}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>

<main id="setup">
    <header class="top">
        <h1>九九 フラッシュ<em>カード</em></h1>
        <p class="keys">すすむ <kbd>スペース</kbd> <kbd>→</kbd> クリック ／ もどる <kbd>←</kbd> ／ とめる <kbd>P</kbd> ／ がめん いっぱい <kbd>F</kbd> ／ おわる <kbd>Esc</kbd></p>
    </header>

    <div class="cols">
        <div class="col">
            <fieldset class="grp">
                <legend>だん（おした じゅんに 出ます）</legend>
                <div class="chips dans" id="g-dans"></div>
                <div class="dan-tools">
                    <button type="button" class="link" id="dan-all">1〜9 ぜんぶ</button>
                    <button type="button" class="link" id="dan-none">ぜんぶ けす</button>
                    <span class="hint">もう いちど おすと はずれます</span>
                </div>
            </fieldset>
            <fieldset class="grp">
                <legend>じゅんばん</legend>
                <div class="chips" id="g-order"></div>
            </fieldset>
            <fieldset class="grp">
                <legend>どれだけ 出す</legend>
                <div class="chips" id="g-amount"></div>
                <div class="chips small" id="g-minutes"></div>
            </fieldset>
        </div>
        <div class="col">
            <fieldset class="grp">
                <legend>しき を 見せる じかん</legend>
                <div class="chips" id="g-qsec"></div>
            </fieldset>
            <fieldset class="grp">
                <legend>こたえ を 見せる じかん</legend>
                <div class="chips" id="g-asec"></div>
            </fieldset>
            <fieldset class="grp">
                <legend>こたえの 出しかた</legend>
                <div class="chips" id="g-style"></div>
            </fieldset>
        </div>
    </div>

    <footer class="go">
        <p id="summary"></p>
        <div class="checks">
            <label class="check"><input type="checkbox" id="yomi"> よみかた を のせる</label>
            <label class="check"><input type="checkbox" id="fs"> がめん いっぱいで はじめる</label>
        </div>
        <button type="button" class="big" id="start">はじめる ▶</button>
    </footer>
</main>

<section id="play" hidden>
    <div id="stage">
        <div class="card line q" id="card">
            <div class="seg s1"><div class="yomi y1"></div><div class="nums"><span class="n1"></span><span class="op">×</span><span class="n2"></span></div></div>
            <div class="seg s2"><div class="yomi y2"></div><div class="nums"><span class="eq">=</span><span class="ans"></span></div></div>
        </div>
    </div>
    <div id="bar">
        <span id="paused" hidden>⏸ とまっています</span>
        <span class="btns">
            <button type="button" id="b-back">◀ もどる</button>
            <button type="button" id="b-pause">⏸ とめる</button>
            <button type="button" id="b-next">つぎ ▶</button>
            <button type="button" id="b-fs" title="がめん いっぱい（F）">⛶</button>
            <button type="button" id="b-stop">✕ おわる</button>
        </span>
    </div>
</section>

<section id="done" hidden>
    <p class="done-big">おしまい</p>
    <div class="row">
        <button type="button" class="big" id="again">もう いちど</button>
        <button type="button" class="big plain" id="to-setup">せっていに もどる</button>
    </div>
</section>

<div class="card" id="measure" aria-hidden="true"></div>

<script>
(() => {
'use strict';

/* ── よみかた（しき | こたえ）─────────────────
   こたえが 1けたの ときの「が」は しきの がわに つける（しき だけ 見せて いる ときも「ごいち が」と 出る） */
const YOMI = {
    1: ['いんいち が|いち','いんに が|に','いんさん が|さん','いんし が|し','いんご が|ご','いんろく が|ろく','いんしち が|しち','いんはち が|はち','いんく が|く'],
    2: ['にいち が|に','ににん が|し','にさん が|ろく','にし が|はち','にご|じゅう','にろく|じゅうに','にしち|じゅうし','にはち|じゅうろく','にく|じゅうはち'],
    3: ['さんいち が|さん','さんに が|ろく','さざん が|く','さんし|じゅうに','さんご|じゅうご','さぶろく|じゅうはち','さんしち|にじゅういち','さんぱ|にじゅうし','さんく|にじゅうしち'],
    4: ['しいち が|し','しに が|はち','しさん|じゅうに','しし|じゅうろく','しご|にじゅう','しろく|にじゅうし','ししち|にじゅうはち','しは|さんじゅうに','しく|さんじゅうろく'],
    5: ['ごいち が|ご','ごに|じゅう','ごさん|じゅうご','ごし|にじゅう','ごご|にじゅうご','ごろく|さんじゅう','ごしち|さんじゅうご','ごは|しじゅう','ごっく|しじゅうご'],
    6: ['ろくいち が|ろく','ろくに|じゅうに','ろくさん|じゅうはち','ろくし|にじゅうし','ろくご|さんじゅう','ろくろく|さんじゅうろく','ろくしち|しじゅうに','ろくは|しじゅうはち','ろっく|ごじゅうし'],
    7: ['しちいち が|しち','しちに|じゅうし','しちさん|にじゅういち','しちし|にじゅうはち','しちご|さんじゅうご','しちろく|しじゅうに','しちしち|しじゅうく','しちは|ごじゅうろく','しちく|ろくじゅうさん'],
    8: ['はちいち が|はち','はちに|じゅうろく','はちさん|にじゅうし','はちし|さんじゅうに','はちご|しじゅう','はちろく|しじゅうはち','はちしち|ごじゅうろく','はっぱ|ろくじゅうし','はっく|しちじゅうに'],
    9: ['くいち が|く','くに|じゅうはち','くさん|にじゅうしち','くし|さんじゅうろく','くご|しじゅうご','くろく|ごじゅうし','くしち|ろくじゅうさん','くは|しちじゅうに','くく|はちじゅういち'],
};
function yomi(a, b){ return YOMI[a][b - 1].split('|'); }

/* ── せってい ─────────────────────────────── */
const KEY = 'kuku-flash-v2';
const DEFAULTS = { dans:[5], order:'up', seqMode:'laps', laps:1, randN:'10', minutes:3,
                   qsec:0, asec:0, style:'line', yomi:true, fs:true };
const MAX_LAPS = 10;
const MIN_LABEL = { 1:'1ぷん', 2:'2ふん', 3:'3ぷん', 5:'5ふん', 10:'10ぷん' };

let cfg = load();

function load(){
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
    const c = Object.assign({}, DEFAULTS, saved);
    c.dans = Array.isArray(c.dans) ? c.dans.filter((d, i, a) => d >= 1 && d <= 9 && a.indexOf(d) === i) : DEFAULTS.dans;
    c.laps = Math.min(MAX_LAPS, Math.max(1, Number(c.laps) || 1));
    return c;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }

const $ = id => document.getElementById(id);
const timed = c => (c.order === 'rand' ? c.randN : c.seqMode) === 'time';

function chips(boxId, name, opts, value, onPick){
    const box = $(boxId);
    box.innerHTML = '';
    for (const o of opts){
        const lab = document.createElement('label');
        lab.className = 'chip';
        lab.innerHTML = `<input type="radio" name="${name}" id="${name}-${o.v}" value="${o.v}"><span>${o.label}${o.sub ? `<small>${o.sub}</small>` : ''}</span>`;
        const inp = lab.querySelector('input');
        inp.checked = String(o.v) === String(value);
        inp.addEventListener('change', () => { onPick(o.v); });
        box.appendChild(lab);
    }
}

function secOpts(){
    return [{ v:0, label:'手どう', sub:'ボタンで' }, 1, 2, 3, 5].map(s => typeof s === 'object' ? s : { v:s, label:`${s}びょう` });
}

function renderDans(){
    const db = $('g-dans');
    db.innerHTML = '';
    for (let d = 1; d <= 9; d++){
        const lab = document.createElement('label');
        lab.className = 'chip dan';
        lab.title = `${d}のだん`;
        const pos = cfg.dans.indexOf(d);
        lab.innerHTML = `<input type="checkbox" id="dan-${d}" value="${d}"><span>${d}</span>`
                      + (pos >= 0 && cfg.dans.length > 1 ? `<b class="ord">${pos + 1}</b>` : '');
        const inp = lab.querySelector('input');
        inp.checked = pos >= 0;
        inp.addEventListener('change', () => {
            cfg.dans = inp.checked ? [...cfg.dans, d] : cfg.dans.filter(x => x !== d);
            save();
            renderDans();
            $('dan-' + d).focus();
            renderSummary();
        });
        db.appendChild(lab);
    }
}

function renderAmount(){
    const box = $('g-amount');
    box.innerHTML = '';
    if (cfg.order === 'rand'){
        chips('g-amount', 'randN', [
            { v:'10', label:'10もん' }, { v:'20', label:'20もん' }, { v:'30', label:'30もん' },
            { v:'time', label:'じかんで', sub:'くりかえす' },
        ], cfg.randN, v => { cfg.randN = v; changed(); });
    } else {
        const st = document.createElement('div');
        st.className = 'stepper' + (cfg.seqMode === 'laps' ? ' on' : '');
        st.innerHTML = `<button type="button" id="laps-minus" aria-label="1しゅう へらす">−</button>`
                     + `<output id="laps-val">${cfg.laps}しゅう</output>`
                     + `<button type="button" id="laps-plus" aria-label="1しゅう ふやす">＋</button>`;
        box.appendChild(st);
        const time = document.createElement('div');
        box.appendChild(time);
        time.id = 'g-seqtime';
        chips('g-seqtime', 'seqMode', [{ v:'time', label:'じかんで', sub:'くりかえす' }], cfg.seqMode, () => {
            cfg.seqMode = 'time'; changed();
        });
        const setLaps = n => {
            cfg.laps = Math.min(MAX_LAPS, Math.max(1, n));
            cfg.seqMode = 'laps';
            changed();
        };
        st.querySelector('#laps-minus').disabled = cfg.seqMode === 'laps' && cfg.laps <= 1;
        st.querySelector('#laps-plus').disabled  = cfg.seqMode === 'laps' && cfg.laps >= MAX_LAPS;
        st.querySelector('#laps-minus').addEventListener('click', () => setLaps(cfg.seqMode === 'laps' ? cfg.laps - 1 : cfg.laps));
        st.querySelector('#laps-plus').addEventListener('click',  () => setLaps(cfg.seqMode === 'laps' ? cfg.laps + 1 : cfg.laps));
        st.querySelector('#laps-val').addEventListener('click',   () => setLaps(cfg.laps));
    }
    $('g-minutes').hidden = !timed(cfg);
    chips('g-minutes', 'minutes', [1, 2, 3, 5, 10].map(m => ({ v:m, label:MIN_LABEL[m] })), cfg.minutes,
          v => { cfg.minutes = v; changed(); });
}

function renderSetup(){
    renderDans();
    chips('g-order', 'order', [
        { v:'up',   label:'あがり',   sub:'×1 → ×9' },
        { v:'down', label:'さがり',   sub:'×9 → ×1' },
        { v:'rand', label:'バラバラ', sub:'ランダム' },
    ], cfg.order, v => { cfg.order = v; changed(); });
    renderAmount();
    chips('g-qsec', 'qsec', secOpts(), cfg.qsec, v => { cfg.qsec = v; changed(); });
    chips('g-asec', 'asec', secOpts(), cfg.asec, v => { cfg.asec = v; changed(); });
    chips('g-style', 'style', [
        { v:'line', label:'しきの となりに', sub:'5 × 3 = 15' },
        { v:'flip', label:'めくる',          sub:'こたえだけ 出す' },
    ], cfg.style, v => { cfg.style = v; changed(); });
    $('yomi').checked = !!cfg.yomi;
    $('fs').checked = !!cfg.fs;
    renderSummary();
}

// ならびが かわる ところ（どれだけ 出す）を つくりなおし、フォーカスを もどす
function changed(){
    save();
    const fid = document.activeElement && document.activeElement.id;
    renderAmount();
    const el = fid && $(fid);
    if (el && !el.disabled) el.focus();
    renderSummary();
}

function secText(s){ return s ? `${s}びょう` : '手どう'; }

function renderSummary(){
    const el = $('summary');
    if (!cfg.dans.length){
        el.innerHTML = '<span class="warn">だんを 1つ いじょう えらんでください。</span>';
        $('start').disabled = true;
        return;
    }
    $('start').disabled = false;
    const dans = cfg.dans.join(cfg.order === 'rand' ? '・' : ' → ') + ' の だん';
    const order = { up:'あがり', down:'さがり', rand:'バラバラ' }[cfg.order];
    let amount;
    if (timed(cfg)) amount = `${MIN_LABEL[cfg.minutes]} くりかえす`;
    else if (cfg.order === 'rand') amount = `${cfg.randN}もん`;
    else amount = `${cfg.laps}しゅう（${cfg.dans.length * 9 * cfg.laps}まい）`;
    const timing = (!cfg.qsec && !cfg.asec)
        ? 'ぜんぶ 手どうで すすめる'
        : `しき ${secText(cfg.qsec)} → こたえ ${secText(cfg.asec)}`;
    el.innerHTML = `<b>${dans}</b>・${order}・${amount}<br>${timing}`;
}

$('dan-all').addEventListener('click', () => { cfg.dans = [1,2,3,4,5,6,7,8,9]; save(); renderDans(); renderSummary(); });
$('dan-none').addEventListener('click', () => { cfg.dans = []; save(); renderDans(); renderSummary(); });
$('yomi').addEventListener('change', e => { cfg.yomi = e.target.checked; save(); });
$('fs').addEventListener('change', e => { cfg.fs = e.target.checked; save(); });

/* ── もんだいの ならび ─────────────────────── */
function shuffle(a){
    for (let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// だんは えらんだ じゅん（cfg.dans の ならび）の まま つかう
function makeGen(c){
    const loop = timed(c);
    if (c.order !== 'rand'){
        const base = [];
        for (const d of c.dans) for (let k = 1; k <= 9; k++) base.push([d, c.order === 'up' ? k : 10 - k]);
        const total = loop ? Infinity : base.length * c.laps;
        let i = 0;
        return { total, next(){ if (i >= total) return null; return base[i++ % base.length]; } };
    }
    const pool = [];
    for (const d of c.dans) for (let m = 1; m <= 9; m++) pool.push([d, m]);
    const total = loop ? Infinity : Number(c.randN);
    let bag = [], last = null, i = 0;
    return {
        total,
        next(){
            if (i >= total) return null;
            if (!bag.length){
                bag = shuffle(pool.slice());
                // ふくろの つなぎめで おなじ もんだいが つづかない ように
                const end = bag[bag.length - 1];
                if (last && bag.length > 1 && end[0] === last[0] && end[1] === last[1]){
                    [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
                }
            }
            i++;
            return (last = bag.pop());
        }
    };
}

/* ── カードを すすめる ─────────────────────── */
let S = null;              // いまの セッション
let runCfg = null;         // はじめた ときの せってい
const card = $('card');
const play = $('play');

function now(){ return performance.now(); }
function elapsed(){ return S.used + (S.runFrom != null ? now() - S.runFrom : 0); }
function timeUp(){ return S.limit > 0 && elapsed() >= S.limit; }

function start(){
    if (!cfg.dans.length) return;
    runCfg = Object.assign({}, cfg, { dans:[...cfg.dans] });
    S = {
        gen: makeGen(runCfg), hist: [], idx: -1, phase: 'q',
        paused: false, timer: 0,
        limit: timed(runCfg) ? runCfg.minutes * 60000 : 0,
        used: 0, runFrom: now(),
    };
    $('setup').hidden = true;
    $('done').hidden = true;
    play.hidden = false;
    $('b-pause').hidden = !runCfg.qsec && !runCfg.asec;
    $('b-pause').textContent = '⏸ とめる';
    $('paused').hidden = true;
    if (runCfg.fs) enterFs();
    lockWake();
    fit();
    advance();
    poke();
}

function advance(){
    if (!S || S.done) return;
    if (S.idx >= 0 && S.phase === 'q'){
        S.phase = 'a';
    } else if (S.idx < S.hist.length - 1){
        S.idx++; S.phase = 'q';
    } else {
        if (timeUp()) return finish();
        const c = S.gen.next();
        if (!c) return finish();
        S.hist.push(c); S.idx++; S.phase = 'q';
    }
    render(true);
    schedule();
}

function back(){
    if (!S || S.done) return;
    if (S.phase === 'a') S.phase = 'q';
    else if (S.idx > 0){ S.idx--; S.phase = 'a'; }
    else return;
    render(false);
    schedule();
}

function schedule(){
    clearTimeout(S.timer);
    if (S.paused) return;
    const sec = S.phase === 'q' ? runCfg.qsec : runCfg.asec;
    if (sec > 0) S.timer = setTimeout(advance, sec * 1000);
}

function togglePause(){
    if (!S || S.done || $('b-pause').hidden) return;
    S.paused = !S.paused;
    if (S.paused){
        clearTimeout(S.timer);
        S.used += now() - S.runFrom; S.runFrom = null;
    } else {
        S.runFrom = now();
        schedule();
    }
    $('b-pause').textContent = S.paused ? '▶ つづける' : '⏸ とめる';
    $('paused').hidden = !S.paused;
    poke();
}

function fill(el, a, b){
    const [y1, y2] = yomi(a, b);
    el.querySelector('.n1').textContent = a;
    el.querySelector('.n2').textContent = b;
    el.querySelector('.ans').textContent = a * b;
    el.querySelector('.y1').textContent = y1;
    el.querySelector('.y2').textContent = y2;
}

function cardClass(style, phase){
    return 'card ' + style + ' ' + phase + (runCfg.yomi ? '' : ' noyomi');
}

function render(forward){
    const [a, b] = S.hist[S.idx];
    fill(card, a, b);
    const cls = cardClass(runCfg.style, S.phase);
    card.className = cls;
    card.style.fontSize = sizeFor(runCfg.style, S.phase) + 'px';
    if (forward && S.phase === 'a'){
        void card.offsetWidth;          // アニメーションを はじめから
        card.className = cls + ' reveal';
    }
}

function finish(){
    clearTimeout(S.timer);
    S.done = true;
    play.hidden = true;
    $('done').hidden = false;
    releaseWake();
}

function stop(){
    if (S) clearTimeout(S.timer);
    S = null;
    play.hidden = true;
    $('done').hidden = true;
    $('setup').hidden = false;
    releaseWake();
    exitFs();
}

/* ── 文字の 大きさ ─────────────────────────── */
// 81もん ぜんぶを 100px で はかって、いちばん 大きい カードが 画面に はいる 大きさに そろえる。
// こたえの がわの はばも いちばん ひろい ものに そろえるので、しきの いちが うごかない。
const measureEl = $('measure');
let sizes = { line:200, flipQ:200, flipA:200 };

function fit(){
    if (!runCfg) return;
    const W = window.innerWidth, H = window.innerHeight;
    const m = measureEl;
    m.innerHTML = card.innerHTML;
    m.style.removeProperty('--dw');
    m.className = cardClass('line', 'a');
    let dw = 0;
    const n1 = m.querySelector('.n1');
    for (let d = 1; d <= 9; d++){ n1.textContent = d; dw = Math.max(dw, n1.getBoundingClientRect().width); }
    m.style.setProperty('--dw', (dw / 100) + 'em');
    card.style.setProperty('--dw', (dw / 100) + 'em');
    let w1 = 0, w2 = 0, h = 0, hq = 0;
    const s1 = m.querySelector('.s1'), s2 = m.querySelector('.s2');
    for (let a = 1; a <= 9; a++) for (let b = 1; b <= 9; b++){
        fill(m, a, b);
        w1 = Math.max(w1, s1.getBoundingClientRect().width);
        w2 = Math.max(w2, s2.getBoundingClientRect().width);
        h  = Math.max(h,  m.getBoundingClientRect().height);
        hq = Math.max(hq, s1.getBoundingClientRect().height);
    }
    card.style.setProperty('--w1', (w1 / 100) + 'em');
    card.style.setProperty('--w2', (w2 / 100) + 'em');
    m.className = cardClass('flip', 'a');
    fill(m, 8, 9);
    const fa = m.getBoundingClientRect();

    sizes.line  = Math.min(W * 0.92 / ((w1 + w2) / 100), H * 0.70 / (h / 100));
    sizes.flipQ = Math.min(W * 0.90 / (w1 / 100),        H * 0.72 / (hq / 100));
    sizes.flipA = Math.min(W * 0.90 / (fa.width / 100),  H * 0.72 / (fa.height / 100), sizes.flipQ * 1.4);
    if (S && !S.done && S.idx >= 0) card.style.fontSize = sizeFor(runCfg.style, S.phase) + 'px';
}
function sizeFor(style, phase){
    if (style === 'line') return Math.floor(sizes.line);
    return Math.floor(phase === 'q' ? sizes.flipQ : sizes.flipA);
}
window.addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

/* ── そうさ ─────────────────────────────── */
$('start').addEventListener('click', start);
$('again').addEventListener('click', start);
$('to-setup').addEventListener('click', stop);
$('stage').addEventListener('click', () => { advance(); poke(); });

function barBtn(id, fn){
    $(id).addEventListener('click', e => { e.stopPropagation(); fn(); e.currentTarget.blur(); poke(); });
}
barBtn('b-back', back);
barBtn('b-pause', togglePause);
barBtn('b-next', advance);
barBtn('b-fs', toggleFs);
barBtn('b-stop', stop);

document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (!play.hidden){
        switch (e.key){
            case ' ': case 'Enter': case 'ArrowRight': case 'ArrowDown': case 'PageDown':
                e.preventDefault(); advance(); return;
            case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace':
                e.preventDefault(); back(); return;
            case 'p': case 'P': case 'k': case 'K':
                e.preventDefault(); togglePause(); return;
            case 'f': case 'F':
                e.preventDefault(); toggleFs(); return;
            case 'Escape':
                stop(); return;
        }
        return;
    }
    if (!$('done').hidden){
        if (e.key === 'Escape') stop();
        if (e.key === 'f' || e.key === 'F') toggleFs();
    }
});

// マウスを うごかさない あいだは ボタンと カーソルを かくす
let idleT = 0;
function poke(){
    play.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => {
        if (S && !S.paused && !play.hidden && !$('bar').matches(':hover')) play.classList.add('idle');
    }, 2500);
}
play.addEventListener('pointermove', poke);

/* ── がめん いっぱい・スリープ よけ ─────────── */
function enterFs(){
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen){
        try { el.requestFullscreen().catch(() => {}); } catch (e) {}
    }
}
function exitFs(){
    if (document.fullscreenElement && document.exitFullscreen){
        try { document.exitFullscreen().catch(() => {}); } catch (e) {}
    }
}
function toggleFs(){ document.fullscreenElement ? exitFs() : enterFs(); }

let wake = null;
function lockWake(){
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(l => { wake = l; }).catch(() => {});
}
function releaseWake(){
    if (wake){ wake.release().catch(() => {}); wake = null; }
}
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S && !S.done && !play.hidden) lockWake();
});

renderSetup();
})();
</script>
</body>
