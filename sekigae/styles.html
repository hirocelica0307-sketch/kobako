<style>
/* ================= 基本 ================= */
:root {
  --bg: #f4f6fa;
  --panel: #ffffff;
  --line: #d8dee9;
  --line-soft: #e8edf5;
  --text: #1f2733;
  --muted: #6b7686;
  --primary: #2a6ef0;
  --primary-dark: #1d54c0;
  --ok: #17915a;
  --warn: #d92d20;
  --warn-bg: #fdecea;
  --male: #e4efff;
  --male-line: #8fb6f2;
  --female: #ffe9f0;
  --female-line: #f0a0bb;
  --unused: #e9ecf1;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Yu Gothic UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  font-size: 14px;
  -webkit-text-size-adjust: 100%;
}

h2, h3 { margin: 0; font-weight: 700; }

/* ================= ツールバー ================= */
.toolbar {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 8px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 20;
}
.tb-title { font-size: 16px; font-weight: 700; white-space: nowrap; }
.tb-class { margin-left: 8px; font-size: 13px; font-weight: 400; color: var(--muted); }
.tb-group { display: flex; align-items: center; gap: 6px; }
.tb-label { color: var(--muted); font-size: 12px; }
.tb-right { margin-left: auto; }
.tb-status { width: 100%; font-size: 12px; color: var(--muted); min-height: 16px; }

.btn {
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: #f0f4fb; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { color: var(--warn); border-color: #f0b6b1; }
.btn-sm { padding: 2px 7px; font-size: 12px; }

select, input[type="text"], textarea {
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
  background: #fff;
  color: var(--text);
}
textarea { width: 100%; resize: vertical; }

/* ================= 全体レイアウト ================= */
.layout {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr) 300px;
  gap: 12px;
  padding: 12px;
  align-items: start;
}
@media (max-width: 1200px) {
  .layout { grid-template-columns: 190px minmax(0, 1fr) 250px; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
}

.pane-history, .pane-warn {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  max-height: calc(100vh - 110px);
  overflow: auto;
}
.pane-main {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  min-width: 0;
}
.pane-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.pane-head .pane-title { margin-bottom: 0; }
.hist-actions { margin-top: 4px; }

/* ================= 座席表 ================= */
.chart-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.chart-meta { font-size: 12px; color: var(--muted); }
.badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 700; }
.badge-draft { background: #fff3d6; color: #8a5a00; }
.badge-edit { background: #e7e9fd; color: #3b3f9c; }

.blackboard {
  background: #2f3a46;
  color: #fff;
  text-align: center;
  letter-spacing: .4em;
  padding: 5px;
  border-radius: 5px;
  font-size: 13px;
  margin-bottom: 12px;
}
.blackboard.bottom { margin-bottom: 0; margin-top: 12px; }

.seat-rows { display: flex; flex-direction: column; gap: 8px; }
.seat-row { display: flex; gap: 6px; justify-content: center; }
.seat-cell.gap-after { margin-right: 22px; }

.seat-cell {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  max-width: 150px;
  min-height: 62px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  padding: 16px 4px 4px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  transition: box-shadow .1s, transform .1s;
}
.seat-cell:hover { box-shadow: 0 0 0 2px rgba(42,110,240,.25); }
.seat-cell.male { background: var(--male); border-color: var(--male-line); }
.seat-cell.female { background: var(--female); border-color: var(--female-line); }
.seat-cell.empty { background: #fafbfd; color: var(--muted); cursor: default; }
.seat-cell.unused {
  background: repeating-linear-gradient(45deg, var(--unused), var(--unused) 6px, #dfe3ea 6px, #dfe3ea 12px);
  color: #9aa4b2;
  cursor: default;
}
.seat-cell.selected { box-shadow: 0 0 0 3px var(--primary); transform: translateY(-2px); }
.seat-cell.violating { border-color: var(--warn); box-shadow: inset 0 0 0 2px var(--warn); }
.seat-cell.highlight { animation: pulse 1.1s ease-in-out 2; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(217,45,32,0); }
  50% { box-shadow: 0 0 0 5px rgba(217,45,32,.45); }
}

.seat-id { position: absolute; top: 2px; left: 5px; font-size: 10px; color: var(--muted); }
.seat-icons { position: absolute; top: 1px; right: 4px; font-size: 11px; letter-spacing: 1px; }
.seat-no { font-size: 11px; color: var(--muted); }
.seat-name { font-size: 14px; font-weight: 600; line-height: 1.25; word-break: break-word; }
.seat-kana { font-size: 10px; color: var(--muted); line-height: 1.2; }
.seat-group {
  position: absolute; bottom: 1px; left: 4px;
  font-size: 10px; color: #4a5568; background: rgba(255,255,255,.75);
  border-radius: 3px; padding: 0 3px;
}
.seat-pair {
  position: absolute; bottom: 1px; right: 4px;
  font-size: 10px; color: #4a5568; background: rgba(255,255,255,.75);
  border-radius: 3px; padding: 0 3px;
}

/* ================= 確認事項 ================= */
.warn-summary { font-size: 13px; margin-bottom: 8px; }
.warn-summary .good { color: var(--ok); font-weight: 700; }
.warn-summary .bad { color: var(--warn); font-weight: 700; }
.warn-list { display: flex; flex-direction: column; gap: 6px; }
.warn-item {
  font-size: 12px;
  line-height: 1.5;
  background: var(--warn-bg);
  border-left: 3px solid var(--warn);
  border-radius: 4px;
  padding: 6px 8px;
  cursor: pointer;
}
.warn-item.soft { background: #fff8e6; border-left-color: #e0a800; }
.warn-item:hover { filter: brightness(.97); }
.notice { padding: 8px 10px; border-radius: 6px; font-size: 12px; line-height: 1.6; }
.notice-warn { background: #fff8e6; border: 1px solid #f0d68a; }

/* ================= 履歴 ================= */
.hist-card { margin-bottom: 12px; }
.hist-head { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.hist-sub { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.hist-grid { display: flex; flex-direction: column; gap: 2px; }
.hist-row { display: flex; gap: 2px; }
.hist-cell {
  flex: 1 1 0; min-width: 0;
  font-size: 9px; line-height: 1.2;
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  padding: 2px 1px;
  text-align: center;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  background: #fbfcfe;
}
.hist-cell.off { background: #eef1f5; color: #b4bcc7; }
.hist-board { background: #2f3a46; color: #fff; font-size: 9px; text-align: center; border-radius: 3px; margin-bottom: 3px; }
.hist-empty { font-size: 12px; color: var(--muted); line-height: 1.6; }

/* ================= モーダル ================= */
.modal {
  display: none;
  position: fixed; inset: 0;
  background: rgba(20,26,34,.45);
  z-index: 50;
  padding: 24px;
  overflow: auto;
}
.modal.open { display: flex; align-items: flex-start; justify-content: center; }
.modal-box {
  background: var(--panel);
  border-radius: 10px;
  width: 100%;
  max-width: 520px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 48px);
}
.modal-lg { max-width: 980px; }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.modal-head h2 { font-size: 16px; }
.modal-close { border: none; background: none; font-size: 18px; cursor: pointer; color: var(--muted); }
.modal-body { padding: 14px 16px; overflow: auto; }
.modal-foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

.row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
.row-wrap { flex-wrap: wrap; }
.row label { font-size: 13px; }
.check-col { display: flex; flex-direction: column; gap: 10px; }
.check-col label { font-size: 13px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 6px 0; }
.sec-title { font-size: 14px; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--line-soft); }

/* タブ */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  border: 1px solid transparent; border-bottom: none;
  background: none; padding: 7px 13px; cursor: pointer;
  font-family: inherit; font-size: 13px; color: var(--muted);
  border-radius: 6px 6px 0 0;
}
.tab.active { background: #fff; border-color: var(--line); color: var(--text); font-weight: 700; margin-bottom: -1px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* 表 */
.table-wrap { border: 1px solid var(--line); border-radius: 7px; overflow: auto; }
.table-scroll { max-height: 340px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); text-align: left; }
.tbl th { background: #f2f5fa; font-size: 12px; color: var(--muted); position: sticky; top: 0; z-index: 1; }
.tbl tr:last-child td { border-bottom: none; }
.tbl input[type="text"] { width: 100%; }
.tbl select { width: 100%; }
.tbl .num { text-align: center; color: var(--muted); }

.paste-box { border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; margin-bottom: 14px; background: #fbfcfe; }
.paste-box summary { cursor: pointer; font-weight: 700; font-size: 13px; }

/* 設定用のミニ座席表 */
.mini-grid { display: flex; flex-direction: column; gap: 5px; align-items: stretch; margin: 10px 0; width: 100%; }
.mini-row { display: flex; gap: 5px; width: 100%; }
.mini-cell {
  flex: 1 1 0; min-width: 0; max-width: 96px; height: 40px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: #fff;
  font-size: 11px;
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  line-height: 1.15;
  font-family: inherit;
  color: var(--text);
  padding: 0;
}
.mini-cell .mc-tag {
  font-size: 9px; color: var(--muted);
  max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.mini-cell.lg { height: 50px; }
.mini-cell.lg .mc-id { font-size: 13px; font-weight: 700; }
.mini-cell.taken { background: #fff4e0; border-color: #e6b877; }
.mini-cell.mine { border-color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); background: #eaf1ff; }
.pick-who { font-size: 14px; font-weight: 700; margin: 0 0 4px; }

/* 固定席ボタン（配慮事項の表） */
.seat-pick-btn { display: flex; align-items: center; gap: 4px; }
.seat-pick-btn .btn { flex: 1; }
.seat-pick-btn .btn.set { background: #eaf1ff; border-color: var(--primary); color: var(--primary-dark); font-weight: 700; }
.mini-cell.off { background: repeating-linear-gradient(45deg,#e9ecf1,#e9ecf1 5px,#dfe3ea 5px,#dfe3ea 10px); color: #9aa4b2; }
.mini-cell.sel { border-color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); }
.mini-board { background: #2f3a46; color: #fff; text-align: center; font-size: 11px; border-radius: 4px; padding: 3px 0; width: 100%; letter-spacing: .3em; }

.chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 6px 3px 10px; font-size: 12px; background: #fff;
}
.chip button { border: none; background: none; cursor: pointer; color: var(--warn); font-size: 13px; padding: 0 3px; }

/* トースト・読み込み中 */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #212a35; color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 90;
  max-width: 80vw; text-align: center; line-height: 1.6;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: #8e1b13; }

.loading { display: none; position: fixed; inset: 0; background: rgba(244,246,250,.75); z-index: 100; align-items: center; justify-content: center; }
.loading.show { display: flex; }
.loading-box { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 24px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
</style>
