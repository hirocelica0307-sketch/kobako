<style>
/* ================= 基本 ================= */
:root {
  --bg: #f3f5f9;
  --panel: #ffffff;
  --line: #d6dce6;
  --line-soft: #e8edf4;
  --text: #1d2531;
  --muted: #5f6b7b;
  --primary: #2563d9;
  --primary-dark: #1b4fb3;
  --primary-soft: #e8f0ff;
  --ok: #138a52;
  --ok-dark: #0f7043;
  --ok-soft: #e3f5ec;
  --warn: #cf2b1d;
  --warn-bg: #fdecea;
  --soft: #b77d00;
  --soft-bg: #fff6df;
  --male: #e3eeff;
  --male-line: #8db3ef;
  --female: #ffe8ef;
  --female-line: #ee9fb8;
  --unused: #e9ecf1;
  --radius: 10px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Yu Gothic UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h2, h3 { margin: 0; font-weight: 700; }
button, input, select, textarea { font-family: inherit; }
:focus-visible { outline: 3px solid rgba(37,99,217,.45); outline-offset: 2px; }

/* ================= ボタン ================= */
.btn {
  padding: 7px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  line-height: 1.3;
}
.btn:hover { background: #f0f4fb; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:hover { background: #fff; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
.btn-ok:hover { background: var(--ok-dark); }
.btn-danger { color: var(--warn); border-color: #f0b6b1; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--primary-dark); font-weight: 700; }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-sm { padding: 3px 9px; font-size: 13px; }
.btn-lg { padding: 10px 26px; font-size: 16px; }
.btn-block { width: 100%; }
.btn-col { display: flex; flex-direction: column; gap: 6px; }
.btn-pair { display: flex; gap: 6px; }
.btn-pair .btn { flex: 1; }

select, input[type="text"], input[type="number"], textarea {
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 14px;
  background: #fff;
  color: var(--text);
}
textarea { width: 100%; resize: vertical; }

/* 2〜3 個から 1 つを選ぶボタン（いま選んでいるものが色付きになる） */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; flex-wrap: wrap; }
.seg button {
  border: none; background: none; padding: 7px 13px; font-size: 14px; cursor: pointer; color: var(--text);
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: none; }
.seg button:hover { background: #f0f4fb; }
.seg button[aria-pressed="true"] { background: var(--primary); color: #fff; font-weight: 700; }
.seg-sm button { padding: 4px 10px; font-size: 13px; }

/* ================= 見出し ================= */
.appbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.appbar-title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.app-name { font-size: 18px; font-weight: 700; white-space: nowrap; }
.class-name {
  border: none; background: none; padding: 2px 6px; border-radius: 6px; cursor: pointer;
  font-size: 15px; color: var(--muted);
}
.class-name:hover { background: var(--primary-soft); color: var(--primary-dark); }
.class-name.empty { color: var(--primary-dark); text-decoration: underline; }
.appbar-right { display: flex; align-items: center; gap: 4px; }
.save-state { font-size: 13px; color: var(--muted); margin-right: 8px; white-space: nowrap; }
.save-state.saving { color: var(--soft); }
.save-state.error { color: var(--warn); font-weight: 700; cursor: pointer; text-decoration: underline; }

/* ================= 4 つの手順 ================= */
.steps {
  display: grid;
  grid-template-columns: minmax(150px, .85fr) minmax(150px, .85fr) minmax(400px, 2.6fr) minmax(200px, 1fr);
  gap: 10px;
  padding: 12px 12px 0;
}
.step {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.step.is-next { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,217,.18); }
.step-head { display: flex; align-items: center; gap: 8px; }
.step-head h2 { font-size: 16px; }
.step-no {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--primary); color: #fff; font-weight: 700; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.step-check { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ok); background: var(--ok-soft); border-radius: 999px; padding: 1px 8px; }
.step-check:empty { display: none; }
.step-check.todo { color: var(--soft); background: var(--soft-bg); }
.step-opt { margin-left: auto; font-size: 12px; color: var(--muted); }
.step-sum { margin: 0; font-size: 13px; color: var(--muted); flex: 1; line-height: 1.6; }
.step-sum b { color: var(--text); }
.opt-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.opt-label { font-size: 13px; color: var(--muted); width: 3.6em; flex: none; }

@media (max-width: 1180px) {
  .steps { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 620px) {
  .steps { grid-template-columns: 1fr; }
  .opt-label { width: auto; }
}

.status-bar { padding: 6px 16px 0; font-size: 13px; color: var(--muted); min-height: 24px; }

/* ================= 全体レイアウト ================= */
.layout {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr) 290px;
  gap: 12px;
  padding: 6px 12px 16px;
  align-items: start;
}
@media (max-width: 1180px) {
  .layout { grid-template-columns: minmax(0, 1fr) 260px; }
  .pane-history { grid-column: 1 / -1; order: 3; }
}
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
}

.pane { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.pane-history, .pane-warn { max-height: calc(100vh - 40px); overflow: auto; position: sticky; top: 8px; }
.pane-main { min-width: 0; }
.pane-title { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
.pane-head .pane-title { margin-bottom: 0; }

/* ================= 座席表 ================= */
.chart-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.chart-head-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chart-meta { font-size: 13px; color: var(--muted); }
.badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; font-weight: 700; }
.badge-draft { background: var(--soft-bg); color: #845800; }
.badge-edit { background: #e7e9fd; color: #3b3f9c; }

.swap-banner {
  font-size: 13px; color: var(--muted);
  background: #f6f8fc; border: 1px dashed var(--line); border-radius: 8px;
  padding: 6px 10px; margin-bottom: 10px;
}
.swap-banner.active { background: var(--primary-soft); border: 1px solid var(--primary); color: var(--primary-dark); font-weight: 700; }

.blackboard {
  background: #2f3a46; color: #fff; text-align: center; letter-spacing: .4em;
  padding: 6px; border-radius: 6px; font-size: 14px; margin-bottom: 12px;
}
.blackboard.bottom { margin-bottom: 0; margin-top: 12px; }

.seat-rows { display: flex; flex-direction: column; gap: 8px; }
.seat-row { display: flex; gap: 5px; justify-content: center; }
.seat-cell.gap-after { margin-right: 24px; }
/* 1人ずつの席：どの席も同じ間隔であける */
.seat-rows.single { gap: 12px; }
.seat-rows.single .seat-row { gap: 14px; }

.seat-cell {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  max-width: 156px;
  min-height: 82px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 18px 4px 4px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  transition: box-shadow .1s, transform .1s;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.seat-cell:hover { box-shadow: 0 0 0 2px rgba(37,99,217,.3); }
.seat-cell.male { background: var(--male); border-color: var(--male-line); }
.seat-cell.female { background: var(--female); border-color: var(--female-line); }
.seat-cell.empty { background: #fafbfd; color: var(--muted); border-style: dashed; }
.seat-cell.unused {
  background: repeating-linear-gradient(45deg, var(--unused), var(--unused) 6px, #dfe3ea 6px, #dfe3ea 12px);
  color: #8a94a3; cursor: default;
}
.seat-cell.selected { box-shadow: 0 0 0 3px var(--primary); transform: translateY(-2px); }
.seat-cell.violating { border-color: var(--warn); box-shadow: inset 0 0 0 2px var(--warn); }
.seat-cell.selected.violating { box-shadow: 0 0 0 3px var(--primary), inset 0 0 0 2px var(--warn); }
.seat-cell.highlight { animation: pulse 1.1s ease-in-out 2; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(207,43,29,0); }
  50% { box-shadow: 0 0 0 6px rgba(207,43,29,.45); }
}

.seat-id { position: absolute; top: 3px; left: 6px; font-size: 11px; color: var(--muted); }
.seat-set { position: absolute; top: 3px; right: 6px; font-size: 11px; color: #3f4a5a; }
.seat-no { font-size: 11px; color: var(--muted); line-height: 1.2; }
.seat-name { font-size: 15px; font-weight: 700; line-height: 1.25; word-break: break-word; }
.seat-kana { font-size: 10px; color: var(--muted); line-height: 1.2; }
.seat-empty-text { font-size: 12px; }
.seat-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: 3px; }
.tag {
  display: inline-block; font-size: 10px; line-height: 1.4; padding: 0 4px; border-radius: 4px;
  background: rgba(255,255,255,.85); border: 1px solid #b9c3d1; color: #3f4a5a; margin-right: 2px;
}

.chart-empty {
  text-align: center; padding: 40px 16px; border: 2px dashed var(--line); border-radius: var(--radius);
  background: #fafbfd;
}
.chart-empty h3 { font-size: 18px; margin-bottom: 8px; }
.chart-empty p { color: var(--muted); margin: 0 0 16px; }
.chart-empty .btn { margin: 0 4px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; color: var(--muted); align-items: center; }
.legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid; }
.sw-m { background: var(--male); border-color: var(--male-line) !important; }
.sw-f { background: var(--female); border-color: var(--female-line) !important; }

/* ================= 確認事項 ================= */
.warn-summary { font-size: 14px; margin-bottom: 8px; line-height: 1.6; }
.warn-summary .good { color: var(--ok); font-weight: 700; }
.warn-summary .bad { color: var(--warn); font-weight: 700; }
.warn-list { display: flex; flex-direction: column; gap: 6px; }
.warn-group { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 6px; }
.warn-item {
  font-size: 13px; line-height: 1.55;
  background: var(--warn-bg); border-left: 4px solid var(--warn);
  border-radius: 5px; padding: 6px 8px; cursor: pointer;
}
.warn-item.soft { background: var(--soft-bg); border-left-color: #e0a800; }
.warn-item:hover { filter: brightness(.97); }
.notice { padding: 8px 10px; border-radius: 7px; font-size: 13px; line-height: 1.65; margin: 0 0 8px; }
.notice-warn { background: var(--soft-bg); border: 1px solid #f0d68a; }
.notice-info { background: var(--primary-soft); border: 1px solid #bcd0f5; }

/* ================= 前回・前々回 ================= */
.hist-card { margin-bottom: 14px; }
.hist-head { font-size: 13px; font-weight: 700; }
.hist-sub { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.hist-grid { display: flex; flex-direction: column; gap: 2px; }
.hist-row { display: flex; gap: 2px; }
.hist-cell {
  flex: 1 1 0; min-width: 0;
  font-size: 9px; line-height: 1.2;
  border: 1px solid var(--line-soft); border-radius: 3px;
  padding: 2px 1px; text-align: center;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  background: #fbfcfe;
}
.hist-cell.off { background: #eef1f5; color: #b4bcc7; }
.hist-board { background: #2f3a46; color: #fff; font-size: 9px; text-align: center; border-radius: 3px; margin-bottom: 3px; }
.hist-actions { margin-top: 5px; }
.hist-empty { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 0; }

/* ================= モーダル ================= */
.modal {
  display: none; position: fixed; inset: 0;
  background: rgba(20,26,34,.45); z-index: 50; padding: 24px; overflow: auto;
}
.modal.open { display: flex; align-items: flex-start; justify-content: center; }
.modal-box {
  background: var(--panel); border-radius: 12px; width: 100%; max-width: 540px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25);
  display: flex; flex-direction: column; max-height: calc(100vh - 48px);
}
.modal-md { max-width: 720px; }
.modal-lg { max-width: 1000px; }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; border-bottom: 1px solid var(--line);
}
.modal-head h2 { font-size: 18px; }
.modal-close { border: none; background: none; font-size: 20px; cursor: pointer; color: var(--muted); border-radius: 6px; padding: 2px 8px; }
.modal-close:hover { background: #f0f4fb; }
.modal-body { padding: 14px 18px; overflow: auto; }
.modal-foot { padding: 10px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

.row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
.row-wrap { flex-wrap: wrap; }
.row label { font-size: 14px; }
.check-col { display: flex; flex-direction: column; gap: 10px; }
.check-col label { font-size: 14px; }
.check-col label:has(input:disabled) { opacity: .5; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 6px 0; }
.hint-list { font-size: 13px; color: var(--muted); line-height: 1.8; margin: 6px 0; padding-left: 1.4em; }
.sec-title { font-size: 15px; margin: 20px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--line-soft); }
.save-note { margin-top: 18px; }
.combo-form { background: #fafbfd; border: 1px solid var(--line-soft); border-radius: 8px; padding: 2px 12px; margin-bottom: 10px; }

.help p, .help li { font-size: 14px; line-height: 1.8; }
.help-steps { padding-left: 1.4em; }
.help-steps li { margin-bottom: 6px; }

/* タブ */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  border: 1px solid transparent; border-bottom: none;
  background: none; padding: 8px 14px; cursor: pointer;
  font-size: 14px; color: var(--muted); border-radius: 7px 7px 0 0;
}
.tab.active { background: #fff; border-color: var(--line); color: var(--text); font-weight: 700; margin-bottom: -1px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* 表 */
.table-wrap { border: 1px solid var(--line); border-radius: 8px; overflow: auto; }
.table-scroll { max-height: 340px; }
.table-scroll-lg { max-height: 420px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); text-align: left; }
.tbl th { background: #f2f5fa; font-size: 13px; color: var(--muted); position: sticky; top: 0; z-index: 1; }
.tbl tr:last-child td { border-bottom: none; }
.tbl input[type="text"] { width: 100%; }
.tbl input[type="number"] { width: 64px; }
.tbl select { width: 100%; }
.tbl .num { text-align: center; color: var(--muted); }
.rule-cell { display: flex; gap: 4px; }
.rule-cell select:first-child { flex: 1.7; min-width: 0; }
.rule-cell select:last-child { flex: 1; min-width: 0; }

.paste-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; background: #fbfcfe; }
.paste-box summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--primary-dark); }

/* 設定用の小さい座席表 */
.mini-grid { display: flex; flex-direction: column; gap: 5px; align-items: stretch; margin: 10px 0; width: 100%; }
.mini-row { display: flex; gap: 5px; width: 100%; }
.mini-cell {
  flex: 1 1 0; min-width: 0; max-width: 100px; height: 42px;
  border: 1px solid var(--line); border-radius: 6px; background: #fff;
  font-size: 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1.15; color: var(--text); padding: 0;
}
.mini-cell .mc-tag { font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mini-cell.lg { height: 52px; }
.mini-cell.lg .mc-id { font-size: 14px; font-weight: 700; }
.mini-cell.taken { background: #fff4e0; border-color: #e6b877; }
.mini-cell.mine { border-color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); background: var(--primary-soft); }
.mini-cell.off { background: repeating-linear-gradient(45deg,#e9ecf1,#e9ecf1 5px,#dfe3ea 5px,#dfe3ea 10px); color: #8a94a3; }
.mini-cell.sel { border-color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); background: var(--primary-soft); }
.mini-board { background: #2f3a46; color: #fff; text-align: center; font-size: 11px; border-radius: 4px; padding: 3px 0; width: 100%; letter-spacing: .3em; }
.pick-who { font-size: 15px; font-weight: 700; margin: 0 0 4px; }

/* 固定席ボタン（配慮事項の表） */
.seat-pick-btn { display: flex; align-items: center; gap: 4px; }
.seat-pick-btn .btn { flex: 1; }
.seat-pick-btn .btn.set { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dark); font-weight: 700; }

.chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 6px 3px 10px; font-size: 13px; background: #fff;
}
.chip button { border: none; background: none; cursor: pointer; color: var(--warn); font-size: 13px; padding: 0 3px; }

/* ================= 子どもに見せる ================= */
.show-view { display: none; position: fixed; inset: 0; background: #fff; z-index: 80; flex-direction: column; padding: 14px 20px 20px; }
.show-view.open { display: flex; }
.show-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.show-title { font-size: 26px; font-weight: 700; }
.show-tools { display: flex; align-items: center; gap: 14px; font-size: 14px; }
.show-chart { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.show-chart .blackboard { font-size: 22px; padding: 8px; }
.show-chart .seat-rows { flex: 1; min-height: 0; }
.show-chart .seat-row { flex: 1; min-height: 0; }
.show-chart .seat-cell { max-width: none; min-height: 0; cursor: default; padding: 6px; border-width: 2px; }
.show-chart .seat-cell:hover { box-shadow: none; }
.show-chart .seat-name { font-size: clamp(18px, 3.1vw, 44px); }
.show-chart .seat-kana { font-size: clamp(11px, 1.3vw, 18px); }
.show-chart .seat-set { font-size: clamp(11px, 1.1vw, 16px); }
.show-chart .seat-cell.gap-after { margin-right: 3vw; }

/* ================= トースト・読み込み中 ================= */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #212a35; color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 90;
  max-width: 80vw; text-align: center; line-height: 1.6;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: #8e1b13; }

.loading { display: none; position: fixed; inset: 0; background: rgba(243,245,249,.75); z-index: 100; align-items: center; justify-content: center; }
.loading.show { display: flex; }
.loading-box { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 24px; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
</style>
