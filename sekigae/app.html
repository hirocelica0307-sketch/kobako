<script>
/**
 * 席替えアプリ — 画面の制御
 *
 * 画面の上に「1 名簿 → 2 配慮事項 → 3 席替え → 4 記録・印刷」を並べ、
 * いま何をすればよいかが分かるようにしている。
 * 名簿・配慮事項・設定は変えたときに自動で保存し、座席表は「記録する」で保存する。
 */
(function () {
  'use strict';

  /* ================= 状態 ================= */
  var State = {
    settings: null,
    roster: [],             // 出席番号の順に並べておく
    separations: [],        // { a: 出席番号, b: 出席番号, level: adjacent / pair / group / near }
    history: [],
    assign: {},             // 座席ID → 出席番号
    violations: [],
    notices: [],
    chartDirty: false,      // 座席表がまだ記録されていない
    mastersDirty: false,    // 名簿・配慮事項・設定に、まだ保存していない変更がある
    selectedSeat: null,
    editingHistoryId: '',   // 過去の記録を呼び戻して直しているときの、その記録の ID
    editingHistoryLabel: '',
    undo: [],               // 「元に戻す」ための、前の座席表
    ui: { pairSel: {}, groupSel: {}, pickIndex: -1, sepKind: 'apart' }
  };

  var MAX_NO = 99;
  var SAVE_DELAY_MS = 1200;
  var UNDO_LIMIT = 30;

  var ROW_RULE_OPTIONS = [
    { v: 'none', t: '指定なし' },
    { v: 'exact', t: '前からちょうど' },
    { v: 'frontWithin', t: '前から〜列目以内' },
    { v: 'backWithin', t: '後ろから〜列目以内' }
  ];
  var COL_RULE_OPTIONS = [
    { v: 'none', t: '指定なし' },
    { v: 'exact', t: '左からちょうど' },
    { v: 'leftWithin', t: '左から〜列目以内' },
    { v: 'rightWithin', t: '右から〜列目以内' }
  ];
  var SEP_LABEL = {
    adjacent: 'はなす（周囲のマスに入れない）',
    pair: 'はなす（同じペアにしない）',
    group: 'はなす（同じ班にしない）',
    near: '近くにする（周囲のマスに入れる）'
  };
  var MODE_TEXT = { random: 'ランダム', genderColumn: '列ごとに男女', checker: 'となりも前後も男女交互' };

  /* ================= 小道具 ================= */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function range(a, b) { var out = []; for (var i = a; i <= b; i++) out.push(i); return out; }
  /** data-icon の場所に、icons.html のアイコンを入れる（icons がなくても文字だけで動く） */
  function paintIcons(root) {
    if (typeof Icons === 'undefined') return;
    Array.prototype.forEach.call((root || document).querySelectorAll('[data-icon]'), function (el) {
      if (!el.firstChild && Icons[el.getAttribute('data-icon')]) el.innerHTML = Icons[el.getAttribute('data-icon')];
    });
  }
  function hasAssign() { return Object.keys(State.assign).length > 0; }
  function copyObj(o) { var c = {}; Object.keys(o).forEach(function (k) { c[k] = o[k]; }); return c; }

  var toastTimer = null;
  function toast(msg, isError) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, isError ? 5000 : 2600);
  }
  function showLoading(msg) {
    $('loading').firstElementChild.textContent = msg || '読み込んでいます…';
    $('loading').classList.add('show');
  }
  function hideLoading() { $('loading').classList.remove('show'); }
  function status(msg) { $('statusBar').textContent = msg; }

  function rosterByNo() {
    var m = {};
    State.roster.forEach(function (s) { m[s.no] = s; });
    return m;
  }
  function sortRoster() {
    State.roster.sort(function (a, b) { return a.no - b.no; });
  }
  function newStudent(no, name, kana, gender) {
    return {
      no: no, name: name || '', kana: kana || '', gender: gender || '',
      fixedSeat: '', rowRule: { type: 'none', value: 1 }, colRule: { type: 'none', value: 1 }, note: ''
    };
  }
  /** used（番号 → true）に入っていない、いちばん小さい番号 */
  function nextFreeNo(used) {
    for (var n = 1; n <= MAX_NO; n++) if (!used[n]) return n;
    return 0;
  }
  function usedNumbers(list) {
    var used = {};
    (list || State.roster).forEach(function (s) { used[s.no] = true; });
    return used;
  }

  function solverInput() {
    /* 過去の記録を呼び戻して直しているときは、その記録自身を比べる相手から外す。
       でないと「前回と同じ席です」が全員分出てしまう。
       詰めずに空きにしておくのは、残った記録の「前回」「前々回」の呼び方をずらさないため。 */
    var history = State.editingHistoryId
      ? State.history.map(function (h) { return h.id === State.editingHistoryId ? null : h; })
      : State.history;
    return {
      settings: State.settings,
      roster: State.roster,
      separations: State.separations,
      history: history
    };
  }

  /* ================= 自動保存 ================= */
  var saveTimer = null, saving = false, saveAgain = false;

  /** 名簿・配慮事項・設定を変えたら呼ぶ。少し待ってから、まとめて保存する。 */
  function markDirty() {
    State.mastersDirty = true;
    setSaveState('pending');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveMasters, SAVE_DELAY_MS);
  }

  function saveMasters() {
    clearTimeout(saveTimer);
    if (!State.mastersDirty) return Promise.resolve();
    if (saving) { saveAgain = true; return Promise.resolve(); }
    State.mastersDirty = false;
    saving = true;
    setSaveState('saving');
    return Api.saveMasters({
      settings: State.settings,
      roster: State.roster,
      separations: State.separations
    }).then(function (res) {
      saving = false;
      if (saveAgain || State.mastersDirty) {
        saveAgain = false;
        State.mastersDirty = true;
        return saveMasters();
      }
      setSaveState('saved', res.savedAt);
    }).catch(function (err) {
      saving = false;
      State.mastersDirty = true;
      setSaveState('error');
      toast('保存できませんでした：' + err.message, true);
    });
  }

  function setSaveState(kind, at) {
    var el = $('saveState');
    el.className = 'save-state' + (kind === 'saving' || kind === 'pending' ? ' saving' : '') + (kind === 'error' ? ' error' : '');
    if (kind === 'pending') el.textContent = '変更を保存します…';
    else if (kind === 'saving') el.textContent = '保存しています…';
    else if (kind === 'saved') el.textContent = '✓ 保存しました' + (at ? '（' + String(at).slice(11, 16) + '）' : '');
    else if (kind === 'error') el.textContent = '保存できませんでした（ここを押すと、もう一度）';
    else el.textContent = '';
  }

  /* ================= 起動 ================= */
  function init() {
    paintIcons();
    bindEvents();
    showLoading('データを読み込んでいます…');
    Api.loadAll().then(function (data) {
      State.settings = data.settings;
      State.roster = data.roster;
      State.separations = data.separations;
      State.history = data.history || [];
      sortRoster();
      hideLoading();
      renderAll();
      if (!State.roster.length) {
        status('はじめに「1 名簿」から児童を登録してください。');
        openModal('modalHelp');
      } else {
        status('名簿 ' + State.roster.length + ' 人を読み込みました。「3 席替え」の「席替えする」を押すと座席案ができます。');
      }
    }).catch(function (err) {
      hideLoading();
      toast(err.message, true);
      status('読み込めませんでした：' + err.message);
    });
  }

  function renderAll() {
    renderSteps();
    renderSegs();
    renderChart();
    renderHistory();
    renderWarnings();
    var cn = State.settings.className || '';
    $('classNameBtn').textContent = cn || 'クラス名を入れる';
    $('classNameBtn').className = 'class-name' + (cn ? '' : ' empty');
    var eb = $('editingBadge');
    if (State.editingHistoryId) {
      eb.style.display = '';
      eb.textContent = '「' + (State.editingHistoryLabel || '過去の記録') + '」を直しています';
    } else {
      eb.style.display = 'none';
    }
    var used = Core.usableSeats(State.settings).length;
    $('seatCount').textContent = '児童 ' + State.roster.length + ' 人 ／ 使える席 ' + used + ' 席';
    var u = State.undo[State.undo.length - 1];
    $('btnUndo').disabled = !u;
    $('btnUndo').title = u ? '「' + u.label + '」の前に戻します（Ctrl＋Z）' : '戻せるものはありません';
  }

  /* ================= 4 つの手順 ================= */
  function renderSteps() {
    var n = State.roster.length;
    var noGender = State.roster.filter(function (s) { return !s.gender; }).length;
    $('step1Sum').innerHTML = n
      ? '<b>' + n + ' 人</b>登録しています。' + (noGender ? '<br>性別が未設定：' + noGender + ' 人' : '')
      : 'まだ登録されていません。<br>まずここから始めます。';
    setCheck('step1Check', n > 0, n > 0 ? '✓ できた' : 'まだ');

    var fixedCount = State.roster.filter(function (s) {
      return s.fixedSeat || (s.rowRule && s.rowRule.type !== 'none') || (s.colRule && s.colRule.type !== 'none');
    }).length;
    var apart = State.separations.filter(function (s) { return s.level !== 'near'; }).length;
    var near = State.separations.length - apart;
    $('step2Sum').innerHTML = (fixedCount || State.separations.length)
      ? '席の指定 <b>' + fixedCount + ' 人</b><br>はなす <b>' + apart + ' 件</b>・近くにする <b>' + near + ' 件</b>'
      : 'まだありません。<br>「前のほうに」「この 2 人ははなす」など。';

    var placed = hasAssign();
    if (!placed) {
      $('step4Sum').innerHTML = '席替えをすると、ここで記録・印刷できます。';
    } else if (State.chartDirty) {
      $('step4Sum').innerHTML = 'この座席表は<b>まだ記録していません</b>。';
    } else {
      $('step4Sum').innerHTML = '記録しました' + (State.editingHistoryLabel ? '（' + esc(State.editingHistoryLabel) + '）' : '') + '。';
    }
    setCheck('step4Check', placed && !State.chartDirty, placed && !State.chartDirty ? '✓ 記録ずみ' : '');

    // いま進めるとよい手順を枠で示す
    var next = !n ? 'step1' : (!placed ? 'step3' : (State.chartDirty ? 'step4' : ''));
    ['step1', 'step2', 'step3', 'step4'].forEach(function (id) { $(id).classList.toggle('is-next', id === next); });

    $('btnShuffle').disabled = !n;
    $('btnExport').disabled = !placed;
    $('btnPrint').disabled = !placed;
    $('btnShow').disabled = !placed;
  }

  function setCheck(id, done, text) {
    var el = $(id);
    el.textContent = text;
    el.className = 'step-check' + (done ? '' : ' todo');
  }

  /** 2〜3 個から 1 つを選ぶボタンの、いま選んでいるものを色付きにする */
  function renderSegs() {
    var s = State.settings;
    var values = {
      mode: s.mode || 'random',
      genderStart: s.genderStart === 'F' ? 'F' : 'M',
      seatStyle: Core.isPairStyle(s) ? 'pair' : 'single',
      flipped: String(!!s.flipped)
    };
    Array.prototype.forEach.call(document.querySelectorAll('.seg[data-seg]'), function (seg) {
      var v = values[seg.getAttribute('data-seg')];
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === v));
      });
    });
    renderGenderStart();
  }

  /** 男女で分けるときだけ「はじめ」の行を出し、並び方の見本（子ども目線・黒板が上）を描く */
  function renderGenderStart() {
    var s = State.settings;
    var on = s.mode === 'genderColumn' || s.mode === 'checker';
    $('genderStartRow').style.display = on ? '' : 'none';
    if (!on) return;
    var html = '<span class="gp-board"></span>';
    for (var r = 1; r <= 3; r++) {
      for (var c = 1; c <= 4; c++) {
        var g = Core.targetGender(s, c, r);
        html += '<span class="gp ' + (g === 'M' ? 'gp-m' : 'gp-f') + '">' + (g === 'M' ? '男' : '女') + '</span>';
      }
    }
    $('genderPreview').innerHTML = html;
    $('genderPreview').style.gridTemplateColumns = 'repeat(4, auto)';
    var first = s.genderStart === 'F' ? '女子' : '男子';
    $('genderStartNote').textContent = s.mode === 'genderColumn'
      ? 'いちばん左の列（A 列）が' + first + 'です'
      : 'いちばん左前の席（A1）が' + first + 'です';
  }

  function onSegClick(ev) {
    var b = ev.target.closest('.seg[data-seg] button');
    if (!b) return;
    var key = b.parentNode.getAttribute('data-seg');
    var v = b.getAttribute('data-v');
    var s = State.settings;
    if (key === 'flipped') {
      s.flipped = (v === 'true');
      status(s.flipped ? '黒板を下にして表示しています（先生目線）。' : '黒板を上にして表示しています（子ども目線）。');
    } else if (key === 'seatStyle') {
      s.seatStyle = v;
      status(v === 'single'
        ? '1人ずつの席にしました。ペアについての条件は使いません（ペアの設定はそのまま残っています）。'
        : '隣の人とペアの席にしました。');
    } else if (key === 'mode') {
      s.mode = v;
      status('決め方を「' + MODE_TEXT[v] + '」にしました。' + (hasAssign() ? '「席替えする」を押すと、この決め方で作り直します。' : ''));
    } else if (key === 'genderStart') {
      s.genderStart = v;
      status((s.mode === 'genderColumn' ? 'いちばん左の列' : 'いちばん左前の席') + 'を' + (v === 'F' ? '女子' : '男子') + 'からにしました。'
        + (hasAssign() ? '「席替えする」を押すと、この並びで作り直します。' : ''));
    } else {
      return;
    }
    markDirty();
    reevaluateIfPlaced();
    renderAll();
  }

  /* ================= 座席表 ================= */
  /**
   * 座席表の HTML を作る。
   * opts.show … 子どもに見せる表示（しるし・メモ・席の名前・出席番号・警告を出さない。黒板はいつも上）
   * opts.kana … 子どもに見せる表示で、ふりがなを出すか
   */
  function buildChartHtml(opts) {
    opts = opts || {};
    var show = !!opts.show;
    var s = State.settings;
    var flipped = show ? false : !!s.flipped;
    var pairBySeat = Core.setIndexBySeat(Core.effectivePairs(s));
    var groupBySeat = Core.setIndexBySeat(Core.effectiveGroups(s));
    var manualPairs = Core.isManualPairs(s);
    var byNo = rosterByNo();
    var unused = s.unusedSeats || [];

    var violSeats = {}, softSeats = {};
    if (!show) {
      State.violations.forEach(function (v) {
        (v.seats || []).forEach(function (id) { (v.weight >= 200 ? violSeats : softSeats)[id] = true; });
      });
    }
    var groupColor = show && opts.groupColor;
    var sepOf = {};
    State.separations.forEach(function (sp) {
      [sp.a, sp.b].forEach(function (no) {
        sepOf[no] = sepOf[no] || {};
        sepOf[no][sp.level === 'near' ? 'near' : 'apart'] = true;
      });
    });

    var rowOrder = range(1, s.rows);
    var colOrder = range(1, s.cols);
    if (flipped) { rowOrder.reverse(); colOrder.reverse(); }

    var board = '<div class="blackboard' + (flipped ? ' bottom' : '') + '">黒 板</div>';
    var html = flipped ? '' : board;
    // ペアのときは相方どうしを寄せて組の間をあけ、1人ずつのときはどの席も同じ間隔にする
    html += '<div class="seat-rows' + (Core.isPairStyle(s) ? '' : ' single') + '">';

    rowOrder.forEach(function (r) {
      html += '<div class="seat-row">';
      colOrder.forEach(function (c, i) {
        var id = Core.seatId(c, r);
        var cls = ['seat-cell'];
        var inner = show ? '' : '<span class="seat-id">' + id + '</span>';
        var tip = '';

        if (pairGapAfter(s, colOrder, i)) cls.push('gap-after');

        if (unused.indexOf(id) >= 0) {
          cls.push('unused');
          inner += show ? '' : '<div class="seat-empty-text">使わない席</div>';
        } else {
          var gi = groupBySeat[id];
          var cellStyle = '';
          if (groupColor && gi !== undefined) {
            var gc = groupColors(gi);
            cellStyle = 'background:' + gc.bg + ';border-color:' + gc.bd + ';';
            inner += '<span class="seat-set group-badge" style="background:' + gc.badge + '">' + (gi + 1) + '班</span>';
          } else {
            var sets = [];
            if (gi !== undefined) sets.push((gi + 1) + '班');
            if (manualPairs && pairBySeat[id] !== undefined) sets.push('ペア' + (pairBySeat[id] + 1));
            if (sets.length) inner += '<span class="seat-set">' + sets.join('・') + '</span>';
          }

          var st = byNo[State.assign[id]];
          if (!st) {
            cls.push('empty');
            inner += show ? '' : '<div class="seat-empty-text">空席</div>';
          } else {
            if (!cellStyle) {
              if (st.gender === 'M') cls.push('male');
              else if (st.gender === 'F') cls.push('female');
            }
            if (!show) inner += '<div class="seat-no">' + st.no + '</div>';
            inner += '<div class="seat-name">' + esc(st.name) + '</div>';
            if (st.kana && (!show || opts.kana)) inner += '<div class="seat-kana">' + esc(st.kana) + '</div>';

            if (!show) {
              var tags = [], tips = [];
              if (st.fixedSeat) { tags.push('固定'); tips.push('席を ' + st.fixedSeat + ' に固定'); }
              if (st.rowRule && st.rowRule.type !== 'none') { tags.push('前後'); tips.push(Solver.rowRuleText(st.rowRule)); }
              if (st.colRule && st.colRule.type !== 'none') { tags.push('左右'); tips.push(Solver.colRuleText(st.colRule)); }
              if (sepOf[st.no] && sepOf[st.no].apart) { tags.push('はなす'); tips.push('はなす相手がいます'); }
              if (sepOf[st.no] && sepOf[st.no].near) { tags.push('近く'); tips.push('近くにする相手がいます'); }
              if (st.note) { tags.push('メモ'); tips.push('メモ：' + st.note); }
              if (tags.length) {
                inner += '<div class="seat-tags">' + tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>';
                tip = st.name + 'さん\n' + tips.join('\n');
              }
            }
          }
          if (!show && State.selectedSeat === id) cls.push('selected');
          if (violSeats[id]) cls.push('violating');
          else if (softSeats[id]) cls.push('soft-violating');
        }
        html += '<div class="' + cls.join(' ') + '" data-seat="' + id + '"'
          + (cellStyle ? ' style="' + cellStyle + '"' : '')
          + (tip ? ' title="' + esc(tip) + '"' : '') + '>' + inner + '</div>';
      });
      html += '</div>';
    });

    html += '</div>';
    if (flipped) html += board;
    return html;
  }

  /**
   * ペア（横 2 席ずつ）のとき、この列のあとに組の区切りの空きを入れるか。
   * 列の位置（A・B ／ C・D ／ E・F）で決めるので、使わない席があっても段ごとにずれない。
   * 1人ずつの席・ペアを自分で決めているときは空きを入れない。
   */
  function pairGapAfter(s, colOrder, i) {
    if (!Core.isPairStyle(s) || Core.isManualPairs(s) || i >= colOrder.length - 1) return false;
    return Math.ceil(colOrder[i] / 2) !== Math.ceil(colOrder[i + 1] / 2);
  }

  /** 班ごとの色（となりの班が似た色にならないよう、色相を黄金角ずつずらす） */
  function groupColors(i) {
    var h = Math.round((i * 137.508 + 210) % 360);
    return {
      bg: 'hsl(' + h + ', 75%, 91%)',
      bd: 'hsl(' + h + ', 55%, 50%)',
      badge: 'hsl(' + h + ', 60%, 34%)'
    };
  }

  function renderChart() {
    if (!State.roster.length) {
      $('seatChart').innerHTML = '<div class="chart-empty">'
        + '<h3>はじめに、名簿を登録しましょう</h3>'
        + '<p>エクセルの名簿を貼り付けると、まとめて登録できます。</p>'
        + '<button class="btn btn-primary btn-lg" type="button" data-act="roster"><span class="ic" data-icon="users" aria-hidden="true"></span>名簿をひらく</button>'
        + '<button class="btn" type="button" data-act="help"><span class="ic" data-icon="help-circle" aria-hidden="true"></span>使い方を見る</button>'
        + '</div>';
      paintIcons($('seatChart'));
      $('swapBanner').style.display = 'none';
      return;
    }
    $('seatChart').innerHTML = buildChartHtml({});
    renderSwapBanner();
  }

  function renderSwapBanner() {
    var el = $('swapBanner');
    el.style.display = '';
    el.className = 'swap-banner';
    if (State.selectedSeat) {
      var st = rosterByNo()[State.assign[State.selectedSeat]];
      el.className = 'swap-banner active';
      el.textContent = (st ? st.name + 'さん' : '') + '（' + State.selectedSeat + '）を選びました。'
        + '入れ替える相手か、空いている席をクリックしてください。やめるときは、もう一度同じ席をクリック。';
    } else if (hasAssign()) {
      el.textContent = '児童を 2 人つづけてクリックすると、席を入れ替えられます。空いている席に動かすこともできます。';
    } else {
      el.textContent = '「3 席替え」の「席替えする」を押すと、ここに座席案ができます。';
    }
  }

  /* 席をクリック：1 人目を選び、2 人目（または空席）をクリックすると入れ替わる */
  function onSeatClick(ev) {
    var act = ev.target.closest('[data-act]');
    if (act) {
      if (act.getAttribute('data-act') === 'roster') openRoster();
      else openModal('modalHelp');
      return;
    }
    var cell = ev.target.closest('.seat-cell');
    if (!cell) return;
    var id = cell.getAttribute('data-seat');
    if (!id || cell.classList.contains('unused')) return;

    if (State.selectedSeat === null) {
      if (!State.assign[id]) { toast('先に、動かしたい児童をクリックしてください。'); return; }
      State.selectedSeat = id;
      renderChart();
      return;
    }
    if (State.selectedSeat === id) {
      State.selectedSeat = null;
      renderChart();
      return;
    }

    var a = State.selectedSeat, b = id;
    pushUndo('入れ替え（' + a + ' ⇄ ' + b + '）');
    var va = State.assign[a], vb = State.assign[b];
    if (vb === undefined) delete State.assign[a]; else State.assign[a] = vb;
    if (va === undefined) delete State.assign[b]; else State.assign[b] = va;

    State.selectedSeat = null;
    State.chartDirty = true;
    reevaluate();
    renderAll();
    status('入れ替えました（' + a + ' ⇄ ' + b + '）。まちがえたときは「元に戻す」。');
  }

  function reevaluate() {
    State.violations = Solver.evaluate(solverInput(), State.assign);
  }
  function reevaluateIfPlaced() {
    if (hasAssign()) reevaluate();
  }

  /* ================= 元に戻す ================= */
  /** いまの座席表の控え（「元に戻す」で戻る先） */
  function snapshot(label) {
    return {
      label: label,
      assign: copyObj(State.assign),
      notices: State.notices.slice(),
      chartDirty: State.chartDirty,
      editingHistoryId: State.editingHistoryId,
      editingHistoryLabel: State.editingHistoryLabel
    };
  }
  function pushUndo(label, snap) {
    State.undo.push(snap || snapshot(label));
    if (State.undo.length > UNDO_LIMIT) State.undo.shift();
  }

  function doUndo() {
    var u = State.undo.pop();
    if (!u) return;
    State.assign = u.assign;
    State.notices = u.notices;
    State.chartDirty = u.chartDirty;
    State.editingHistoryId = u.editingHistoryId;
    State.editingHistoryLabel = u.editingHistoryLabel;
    State.selectedSeat = null;
    if (hasAssign()) reevaluate(); else State.violations = [];
    renderAll();
    status('「' + u.label + '」の前に戻しました。');
    toast('元に戻しました');
  }

  /* ================= 確認事項 ================= */
  function renderWarnings() {
    var sum = $('warnSummary');
    var list = $('warnList');

    if (!State.roster.length) {
      sum.innerHTML = '名簿を登録して席替えをすると、守れなかった条件がここに出ます。';
      list.innerHTML = '';
      return;
    }
    if (!hasAssign()) {
      sum.innerHTML = '席替えをすると、守れなかった条件がここに出ます。';
      list.innerHTML = '';
      return;
    }

    var hard = State.violations.filter(function (v) { return v.weight >= 200; });
    var soft = State.violations.filter(function (v) { return v.weight < 200; });
    if (!State.violations.length) {
      sum.innerHTML = '<span class="good">◎ 条件はすべて守れています。</span>';
    } else if (!hard.length) {
      sum.innerHTML = '<span class="good">◎ 配慮事項は守れています。</span><br>できれば避けたいことが ' + soft.length + ' 件あります。';
    } else {
      sum.innerHTML = '<span class="bad">守れなかった配慮事項が ' + hard.length + ' 件</span>あります。'
        + 'もう一度「席替えする」を押すか、手で入れ替えてください。';
    }

    var html = '';
    genderInfo().forEach(function (msg) {
      html += '<div class="notice notice-info">' + esc(msg) + '</div>';
    });
    State.notices.forEach(function (msg) {
      html += '<div class="notice notice-warn">' + esc(msg) + '</div>';
    });
    if (hard.length) html += '<div class="warn-group">配慮事項（クリックすると席が光ります）</div>';
    State.violations.forEach(function (v, i) {
      if (v.weight < 200) return;
      html += '<div class="warn-item" data-viol="' + i + '">' + esc(v.message) + '</div>';
    });
    if (soft.length) html += '<div class="warn-group">できれば避けたいこと</div>';
    State.violations.forEach(function (v, i) {
      if (v.weight >= 200) return;
      html += '<div class="warn-item soft" data-viol="' + i + '">' + esc(v.message) + '</div>';
    });
    list.innerHTML = html;
  }

  /** 男女で分けるとき、人数の都合で反対の席に座る人数を知らせる（守れなかったことではない） */
  function genderInfo() {
    var b = Solver.genderBalance(State.settings, State.roster);
    if (!b) return [];
    var out = [];
    if (b.overM) {
      out.push('男子が ' + b.stM + ' 人、男子の席が ' + b.seatM + ' 席なので、男子のうち ' + b.overM + ' 人は女子の席に座ります。人数の都合なので、このままで大丈夫です。');
    }
    if (b.overF) {
      out.push('女子が ' + b.stF + ' 人、女子の席が ' + b.seatF + ' 席なので、女子のうち ' + b.overF + ' 人は男子の席に座ります。人数の都合なので、このままで大丈夫です。');
    }
    if (b.unknown.length) {
      out.push('性別が未設定の児童（' + b.unknown.join('・') + '）は、男女の並びとは関係なく座ります。');
    }
    return out;
  }

  function onWarnClick(ev) {
    var item = ev.target.closest('.warn-item');
    if (!item) return;
    var v = State.violations[parseInt(item.getAttribute('data-viol'), 10)];
    if (!v) return;
    (v.seats || []).forEach(function (id) {
      var cell = document.querySelector('#seatChart .seat-cell[data-seat="' + id + '"]');
      if (!cell) return;
      cell.classList.add('highlight');
      setTimeout(function () { cell.classList.remove('highlight'); }, 2400);
    });
    if (v.seats && v.seats.length) {
      var first = document.querySelector('#seatChart .seat-cell[data-seat="' + v.seats[0] + '"]');
      if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  /* ================= 前回・前々回 ================= */
  function renderHistory() {
    var el = $('historyList');
    if (!State.history.length) {
      el.innerHTML = '<p class="hist-empty">まだ記録がありません。<br>「4 記録・印刷」で「記録する」を押すと、次からここに前回・前々回の席が出ます。</p>';
      return;
    }
    var labels = ['前回', '前々回'];
    var flipped = !!State.settings.flipped;
    var html = '';

    State.history.slice(0, 2).forEach(function (h, idx) {
      var names = Core.seatNameMap(h);
      var rowOrder = range(1, h.rows || State.settings.rows);
      var colOrder = range(1, h.cols || State.settings.cols);
      if (flipped) { rowOrder.reverse(); colOrder.reverse(); }

      html += '<div class="hist-card">';
      html += '<div class="hist-head">' + labels[idx] + (h.label ? '：' + esc(h.label) : '') + '</div>';
      html += '<div class="hist-sub">' + esc(h.at) + '</div>';
      if (!flipped) html += '<div class="hist-board">黒板</div>';
      html += '<div class="hist-grid">';
      rowOrder.forEach(function (r) {
        html += '<div class="hist-row">';
        colOrder.forEach(function (c) {
          var id = Core.seatId(c, r);
          var nm = names[id];
          html += '<div class="hist-cell' + (nm ? '' : ' off') + '" title="' + id + (nm ? '　' + esc(nm) : '') + '">'
            + (nm ? esc(shortName(nm)) : '') + '</div>';
        });
        html += '</div>';
      });
      html += '</div>';
      if (flipped) html += '<div class="hist-board" style="margin:3px 0 0">黒板</div>';
      html += '<div class="hist-actions"><button class="btn btn-sm" type="button" data-loadhist="' + esc(h.id) + '">この座席表を呼び戻す</button></div>';
      html += '</div>';
    });
    el.innerHTML = html;
  }

  /* ================= 記録の一覧・呼び戻し ================= */
  function renderHistoryTable() {
    var tb = $('historyTable').querySelector('tbody');
    if (!State.history.length) {
      tb.innerHTML = '<tr><td colspan="5" class="hint" style="padding:12px">まだ記録がありません。</td></tr>';
      return;
    }
    var html = '';
    State.history.forEach(function (h, i) {
      var tag = i === 0 ? '前回' : (i === 1 ? '前々回' : '');
      html += '<tr>'
        + '<td>' + esc(h.at) + (tag ? ' <span class="badge badge-draft">' + tag + '</span>' : '') + '</td>'
        + '<td>' + esc(h.label || '（見出しなし）')
        + (State.editingHistoryId === h.id ? ' <span class="badge badge-edit">直しています</span>' : '') + '</td>'
        + '<td>' + esc(MODE_TEXT[h.mode] || h.mode || '—') + '</td>'
        + '<td class="num">' + Object.keys(h.assign || {}).length + ' 人</td>'
        + '<td>'
        + '<button class="btn btn-sm" type="button" data-loadhist="' + esc(h.id) + '">呼び戻す</button> '
        + '<button class="btn btn-sm btn-danger" type="button" data-delhist="' + esc(h.id) + '">記録を消す</button>'
        + '</td>'
        + '</tr>';
    });
    tb.innerHTML = html;
  }

  function onHistoryAction(ev) {
    var load = ev.target.closest('button[data-loadhist]');
    if (load) { loadHistory(load.getAttribute('data-loadhist')); return; }
    var del = ev.target.closest('button[data-delhist]');
    if (del) { deleteHistory(del.getAttribute('data-delhist')); return; }
  }

  function findHistory(id) {
    var entry = null;
    State.history.forEach(function (h) { if (h.id === id) entry = h; });
    return entry;
  }

  function loadHistory(id) {
    var entry = findHistory(id);
    if (!entry) { toast('その記録が見つかりませんでした。', true); return; }

    // 氏名でつき合わせる（出席番号は付け直されていることがあるため）。
    // 同姓同名がいても順に配れるよう、名前ごとに待ち行列にしておく。
    var queue = {};
    State.roster.forEach(function (st) {
      if (!queue[st.name]) queue[st.name] = [];
      queue[st.name].push(st);
    });
    var valid = {};
    Core.usableSeats(State.settings).forEach(function (s) { valid[s.id] = true; });

    var names = Core.seatNameMap(entry);
    var assign = {};
    var gone = [], outOfLayout = [];

    Object.keys(names).forEach(function (seatId) {
      var name = names[seatId];
      var list = queue[name];
      if (!list || !list.length) { gone.push(name); return; }
      if (!valid[seatId]) { outOfLayout.push(seatId + '（' + name + '）'); return; }
      assign[seatId] = list.shift().no;
    });

    var newcomers = [];
    Object.keys(queue).forEach(function (name) {
      queue[name].forEach(function (st) { newcomers.push(st.name); });
    });

    if (hasAssign()) pushUndo('記録の呼び戻し');
    State.assign = assign;
    State.selectedSeat = null;
    State.chartDirty = true;
    State.editingHistoryId = entry.id;
    State.editingHistoryLabel = entry.label || entry.at;
    // 記録するときの見出しも、呼び戻した記録のものにそろえる（前に打った見出しが残らないように）
    $('inputExportLabel').value = entry.label || '';

    var notices = [];
    if (gone.length) {
      notices.push('この記録にいた ' + uniq(gone).join('・') + ' さんは、いまの名簿にいないので席を空けました。');
    }
    if (outOfLayout.length) {
      notices.push('いまの席の並びにない席があったため、' + outOfLayout.join('・') + ' は読み込めませんでした。');
    }
    if (newcomers.length) {
      notices.push('いまの名簿にいて、この記録に席がなかったのは ' + uniq(newcomers).join('・')
        + ' さんです。空いている席に入れてください。');
    }
    State.notices = notices;

    reevaluate();
    closeModal('modalHistory');
    renderAll();
    toast('「' + State.editingHistoryLabel + '」の座席表を呼び戻しました。');
    status('「' + State.editingHistoryLabel + '」を直しています。直したら「記録する」で、この記録を書き直すか、新しい記録にするかを選べます。'
      + '前の座席表には「元に戻す」で戻れます。');
  }

  function uniq(arr) {
    var seen = {}, out = [];
    arr.forEach(function (v) { if (!seen[v]) { seen[v] = true; out.push(v); } });
    return out;
  }

  function deleteHistory(id) {
    var entry = findHistory(id);
    if (!entry) return;
    if (!window.confirm('「' + (entry.label || entry.at) + '」の記録を消します。\n'
      + 'この記録から作った座席表のシートも一緒に消えます。よろしいですか？')) return;

    showLoading('記録を消しています…');
    Api.deleteHistory(id).then(function (res) {
      State.history = res.history || [];
      if (State.editingHistoryId === id) {
        State.editingHistoryId = '';
        State.editingHistoryLabel = '';
        State.chartDirty = hasAssign();
      }
      hideLoading();
      renderHistoryTable();
      renderAll();
      toast('記録を消しました。');
    }).catch(function (err) {
      hideLoading();
      toast('消せませんでした：' + err.message, true);
    });
  }

  function shortName(name) {
    var t = String(name).replace(/[\s　]+/g, '');
    return t.length > 4 ? t.slice(0, 4) : t;
  }

  /* ================= 席替え ================= */
  function doShuffle() {
    if (!State.roster.length) { toast('先に名簿を登録してください。', true); return; }
    showLoading('席替えを考えています…');
    setTimeout(function () {
      var res;
      var snap = hasAssign() ? snapshot('席替え') : null;
      // ここからは新しい並びを作るので、呼び戻していた記録との結びつきを解く
      // （これまでの記録すべてが「避ける相手」に戻る）
      var input = solverInput();
      input.history = State.history;
      try {
        res = Solver.solve(input);
      } catch (e) {
        hideLoading();
        toast('計算でエラーが起きました：' + e.message, true);
        return;
      }
      if (snap) pushUndo('席替え', snap);
      State.editingHistoryId = '';
      State.editingHistoryLabel = '';
      $('inputExportLabel').value = '';   // 新しい記録になるので、前の見出しは消しておく
      State.assign = res.assign;
      State.violations = res.violations;
      State.notices = res.notices;
      State.selectedSeat = null;
      State.chartDirty = true;
      hideLoading();
      renderAll();
      var hard = res.violations.filter(function (v) { return v.weight >= 200; }).length;
      status(res.attempts + ' 通り試しました（' + (res.elapsedMs / 1000).toFixed(1) + ' 秒）。'
        + (hard ? '守れなかった配慮事項が ' + hard + ' 件あります（右の確認事項）。' : '配慮事項はすべて守れました。')
        + 'よければ「記録する」、作り直すならもう一度「席替えする」。');
      toast(hard ? '席替えしました（確認 ' + hard + ' 件）' : '席替えしました');
    }, 30);
  }

  /* ================= 記録する ================= */
  function openExport() {
    if (!hasAssign()) { toast('先に席替えをしてください。', true); return; }
    // 過去の記録を呼び戻して直しているときは、書き直すか新しくするかを選ばせる
    var editing = State.editingHistoryId && !!findHistory(State.editingHistoryId);
    $('exportModeBox').style.display = editing ? '' : 'none';
    if (editing) {
      $('exportOverwriteLabel').textContent = '「' + State.editingHistoryLabel + '」';
      document.querySelector('input[name="exportMode"][value="overwrite"]').checked = true;
    }
    openModal('modalExport');
    $('inputExportLabel').focus();
  }

  function runExport() {
    var modeEl = document.querySelector('input[name="exportMode"]:checked');
    var overwrite = ($('exportModeBox').style.display !== 'none') && modeEl && modeEl.value === 'overwrite';

    clearTimeout(saveTimer);
    showLoading('スプレッドシートに記録しています…');
    Api.commit({
      settings: State.settings,
      roster: State.roster,
      separations: State.separations,
      assign: State.assign,
      label: $('inputExportLabel').value.trim(),
      overwriteId: overwrite ? State.editingHistoryId : ''
    }).then(function (res) {
      State.history = res.history || State.history;
      State.chartDirty = false;
      State.mastersDirty = false;     // 名簿・設定も一緒に保存された
      setSaveState('saved', res.savedAt);
      if (!res.overwritten) {
        // 新しい記録として保存したので、いちばん新しいものを直す対象にする
        State.editingHistoryId = State.history.length ? State.history[0].id : '';
        State.editingHistoryLabel = State.history.length ? (State.history[0].label || State.history[0].at) : '';
      } else {
        var h = findHistory(State.editingHistoryId);
        if (h) State.editingHistoryLabel = h.label || h.at;
      }
      hideLoading();
      closeModal('modalExport');
      renderAll();
      toast(res.overwritten ? '記録を書き直しました。' : '記録しました。');
      status((res.overwritten ? '記録を書き直しました' : '記録しました')
        + '（' + res.savedAt + '）。スプレッドシートにシート「' + res.sheetName + '」を作りました。');
    }).catch(function (err) {
      hideLoading();
      toast('記録できませんでした：' + err.message, true);
    });
  }

  /* ================= 印刷 ================= */
  function doPrint() {
    if (!hasAssign()) { toast('先に席替えをしてください。', true); return; }
    var w = window.open('', '_blank');
    if (!w) {
      toast('ポップアップがブロックされました。ブラウザのアドレスバー右のアイコンから、このサイトのポップアップを許可してください。', true);
      return;
    }
    w.document.open();
    w.document.write(buildPrintHtml());
    w.document.close();
    w.focus();
    setTimeout(function () { try { w.print(); } catch (e) { /* 利用者が手で印刷できるので無視 */ } }, 400);
  }

  function buildPrintHtml() {
    var s = State.settings;
    var flipped = !!s.flipped;
    var byNo = rosterByNo();
    var unused = s.unusedSeats || [];
    var pairBySeat = Core.setIndexBySeat(Core.effectivePairs(s));
    var groupBySeat = Core.setIndexBySeat(Core.effectiveGroups(s));
    var manualPairs = Core.isManualPairs(s);
    var single = !Core.isPairStyle(s);

    var rowOrder = range(1, s.rows);
    var colOrder = range(1, s.cols);
    if (flipped) { rowOrder.reverse(); colOrder.reverse(); }

    var nameFont = s.cols >= 6 ? '13pt' : '15pt';
    var kanaFont = s.cols >= 6 ? '8.5pt' : '10pt';

    var body = '';
    rowOrder.forEach(function (r) {
      body += '<div class="p-row">';
      colOrder.forEach(function (c, i) {
        var id = Core.seatId(c, r);
        var cls = ['p-cell'];
        if (pairGapAfter(s, colOrder, i)) cls.push('gap');
        var inner = '';
        if (unused.indexOf(id) >= 0) {
          cls.push('unused');
        } else {
          var st = byNo[State.assign[id]];
          if (st) {
            if (s.printShowNumber) inner += '<div class="p-no">' + st.no + '</div>';
            if (s.printNameStyle === 'kana') {
              inner += '<div class="p-name">' + esc(st.kana || st.name) + '</div>';
            } else if (s.printNameStyle === 'both') {
              if (st.kana) inner += '<div class="p-kana">' + esc(st.kana) + '</div>';
              inner += '<div class="p-name">' + esc(st.name) + '</div>';
            } else {
              inner += '<div class="p-name">' + esc(st.name) + '</div>';
            }
          }
          if (groupBySeat[id] !== undefined) {
            inner += '<div class="p-group">' + (groupBySeat[id] + 1) + '班</div>';
          }
          // ペアを手で決めているときは間隔で表せないので、番号で示す
          if (manualPairs && pairBySeat[id] !== undefined) {
            inner += '<div class="p-pair">ペア' + (pairBySeat[id] + 1) + '</div>';
          }
        }
        body += '<div class="' + cls.join(' ') + '">' + inner + '</div>';
      });
      body += '</div>';
    });

    var board = '<div class="p-board">黒 板</div>';
    var title = (s.className ? esc(s.className) + '　' : '') + '座席表';
    var today = new Date();
    var dateText = today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日';

    return '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>' + title + '</title><style>'
      + '@page{size:A4 landscape;margin:8mm;}'
      + 'html,body{margin:0;padding:0;font-family:"Yu Gothic UI","Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;color:#000;}'
      + '.sheet{width:281mm;height:194mm;display:flex;flex-direction:column;}'
      + '.p-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:2mm;}'
      + '.p-title{font-size:16pt;font-weight:700;}'
      + '.p-date{font-size:10pt;}'
      + '.p-board{height:8mm;line-height:8mm;background:#333;color:#fff;text-align:center;letter-spacing:.6em;font-size:11pt;border-radius:1.5mm;}'
      + '.p-grid{flex:1;display:flex;flex-direction:column;gap:2mm;padding:2mm 0;min-height:0;}'
      + '.p-row{flex:1;display:flex;gap:1.5mm;min-height:0;}'
      + '.p-grid.single{gap:4mm;}.p-grid.single .p-row{gap:4mm;}'
      + '.p-cell{flex:1 1 0;min-width:0;border:0.35mm solid #333;border-radius:1.5mm;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:1mm;}'
      + '.p-cell.gap{margin-right:5mm;}'
      + '.p-cell.unused{border-style:dashed;border-color:#aaa;background:#f2f2f2;}'
      + '.p-no{position:absolute;top:0.5mm;left:1.5mm;font-size:8pt;color:#555;}'
      + '.p-group{position:absolute;bottom:0.5mm;right:1.5mm;font-size:8pt;color:#555;}'
      + '.p-pair{position:absolute;top:0.5mm;right:1.5mm;font-size:8pt;color:#555;}'
      + '.p-name{font-size:' + nameFont + ';font-weight:700;line-height:1.25;text-align:center;word-break:break-word;}'
      + '.p-kana{font-size:' + kanaFont + ';line-height:1.2;text-align:center;}'
      + '</style></head><body><div class="sheet">'
      + '<div class="p-head"><div class="p-title">' + title + '</div><div class="p-date">' + dateText + '</div></div>'
      + (flipped ? '' : board)
      + '<div class="p-grid' + (single ? ' single' : '') + '">' + body + '</div>'
      + (flipped ? board : '')
      + '</div></body></html>';
  }

  /* ================= 子どもに見せる ================= */
  function openShow() {
    if (!hasAssign()) { toast('先に席替えをしてください。', true); return; }
    State.selectedSeat = null;
    $('showTitle').textContent = (State.settings.className ? State.settings.className + '　' : '') + 'あたらしい席';
    renderShow();
    $('showView').classList.add('open');
    $('btnShowClose').focus();
  }
  function renderShow() {
    var groups = Core.effectiveGroups(State.settings);
    var hasGroups = groups.length > 0;
    $('showGroupColorLabel').style.display = hasGroups ? '' : 'none';
    $('showGroupListLabel').style.display = hasGroups ? '' : 'none';
    var colorOn = hasGroups && $('chkShowGroupColor').checked;
    $('showChart').innerHTML = buildChartHtml({ show: true, kana: $('chkShowKana').checked, groupColor: colorOn });

    // 班の一覧（班ごとに、座っている児童の名前を並べる）
    var listOn = hasGroups && $('chkShowGroupList').checked;
    var el = $('showGroups');
    el.classList.toggle('open', listOn);
    if (!listOn) { el.innerHTML = ''; return; }
    var byNo = rosterByNo();
    el.innerHTML = groups.map(function (g, i) {
      var gc = groupColors(i);
      var names = g.seats.map(function (id) { var st = byNo[State.assign[id]]; return st ? esc(st.name) : ''; })
        .filter(Boolean);
      return '<div class="show-group" style="border-color:' + gc.bd + ';background:' + (colorOn ? gc.bg : '#fff') + '">'
        + '<h3>' + (i + 1) + '班<span class="hint">（' + names.length + ' 人）</span></h3>'
        + '<p>' + (names.join('、') || '（まだいません）') + '</p></div>';
    }).join('');
  }
  function closeShow() {
    $('showView').classList.remove('open');
    renderChart();
  }

  /* ================= モーダル共通 ================= */
  function openModal(id) { $(id).classList.add('open'); }
  function closeModal(id) {
    $(id).classList.remove('open');
    if (id === 'modalRoster' || id === 'modalCare' || id === 'modalSettings') {
      reevaluateIfPlaced();
      renderAll();
      saveMasters();   // とじたときは待たずに保存する
    }
  }
  function topModal() {
    var open = document.querySelectorAll('.modal.open');
    return open.length ? open[open.length - 1] : null;
  }

  /* ================= 名簿 ================= */
  function openRoster() {
    renderRoster();
    $('pasteBox').open = !State.roster.length;   // 空のときは貼り付け欄をはじめから開いておく
    openModal('modalRoster');
  }

  function renderRoster() {
    var tb = $('rosterTable').querySelector('tbody');
    var html = '';
    State.roster.forEach(function (st, i) {
      html += '<tr>'
        + '<td><input type="number" min="1" max="' + MAX_NO + '" data-r="' + i + '" data-f="no" value="' + st.no + '" aria-label="出席番号"></td>'
        + '<td><input type="text" data-r="' + i + '" data-f="name" value="' + esc(st.name) + '" aria-label="氏名"></td>'
        + '<td><input type="text" data-r="' + i + '" data-f="kana" value="' + esc(st.kana) + '" aria-label="ひらがな"></td>'
        + '<td><select data-r="' + i + '" data-f="gender" aria-label="性別">'
        + opt('', '未設定', st.gender) + opt('M', '男', st.gender) + opt('F', '女', st.gender)
        + '</select></td>'
        + '<td><button class="btn btn-sm btn-danger" type="button" data-del="' + i + '">削除</button></td>'
        + '</tr>';
    });
    tb.innerHTML = html || '<tr><td colspan="5" class="hint" style="padding:12px">まだだれもいません。上の「エクセルからまとめて貼り付ける」か「＋ 1 人足す」で登録してください。</td></tr>';
    $('rosterCount').textContent = State.roster.length + ' / ' + Core.MAX_STUDENTS + ' 人';
  }

  function opt(value, text, current) {
    return '<option value="' + value + '"' + (String(current) === String(value) ? ' selected' : '') + '>' + esc(text) + '</option>';
  }

  /** 名前・ひらがな・性別は打つそばから反映する（出席番号は打ち終わってから） */
  function onRosterInput(ev) {
    var el = ev.target;
    var r = el.getAttribute('data-r'), f = el.getAttribute('data-f');
    if (r === null || !f || f === 'no') return;
    State.roster[parseInt(r, 10)][f] = el.value;
    markDirty();
  }

  function onRosterChange(ev) {
    var el = ev.target;
    if (el.getAttribute('data-f') !== 'no') return;
    var st = State.roster[parseInt(el.getAttribute('data-r'), 10)];
    if (!st) return;
    var n = parseInt(el.value, 10);
    if (!(n >= 1 && n <= MAX_NO)) {
      toast('出席番号は 1 から ' + MAX_NO + ' までの数で入れてください。', true);
      renderRoster();
      return;
    }
    if (n === st.no) return;
    var other = rosterByNo()[n];
    if (other) {
      toast(n + ' 番は ' + other.name + ' さんが使っています。', true);
      renderRoster();
      return;
    }
    var map = {};
    map[st.no] = n;
    remapNumbers(map);
    markDirty();
    renderRoster();
    renderCare();
    status(st.name + ' さんの出席番号を ' + n + ' 番にしました。');
  }

  function onRosterClick(ev) {
    var el = ev.target.closest('button[data-del]');
    if (!el) return;
    var st = State.roster[parseInt(el.getAttribute('data-del'), 10)];
    if (!st) return;
    if (st.name && !window.confirm(st.no + ' 番 ' + st.name + ' さんを名簿から消します。よろしいですか？')) return;
    State.roster = State.roster.filter(function (s) { return s !== st; });
    State.separations = State.separations.filter(function (sp) { return sp.a !== st.no && sp.b !== st.no; });
    Object.keys(State.assign).forEach(function (seat) { if (State.assign[seat] === st.no) delete State.assign[seat]; });
    State.undo = [];   // 前の座席表には、もういない児童の番号が残っているため
    markDirty();
    renderRoster();
    renderCare();
  }

  /**
   * 出席番号を付け替える（map は 古い番号 → 新しい番号。書いていない番号はそのまま）。
   * 席の割り当て・組み合わせ・「元に戻す」の控えも、あわせて付け替える。
   */
  function remapNumbers(map) {
    function f(no) { return Object.prototype.hasOwnProperty.call(map, no) ? map[no] : no; }
    State.roster.forEach(function (st) { st.no = f(st.no); });
    sortRoster();
    function remapAssign(a) {
      var next = {};
      Object.keys(a).forEach(function (seat) { next[seat] = f(a[seat]); });
      return next;
    }
    State.assign = remapAssign(State.assign);
    State.undo.forEach(function (u) { u.assign = remapAssign(u.assign); });
    State.separations.forEach(function (sp) { sp.a = f(sp.a); sp.b = f(sp.b); });
  }

  function renumberAll() {
    if (!State.roster.length) return;
    if (!window.confirm('出席番号を、いまの順に 1・2・3… と付け直します。よろしいですか？')) return;
    var map = {};
    State.roster.forEach(function (st, i) { map[st.no] = i + 1; });
    remapNumbers(map);
    markDirty();
    renderRoster();
    renderCare();
    status('出席番号を 1 から付け直しました。');
  }

  function addStudent() {
    if (State.roster.length >= Core.MAX_STUDENTS) { toast(Core.MAX_STUDENTS + ' 人までです。', true); return; }
    var max = 0;
    State.roster.forEach(function (s) { if (s.no > max) max = s.no; });
    var no = max < MAX_NO ? max + 1 : nextFreeNo(usedNumbers());
    State.roster.push(newStudent(no, ''));
    sortRoster();
    markDirty();
    renderRoster();
    renderCare();
    var inputs = $('rosterTable').querySelectorAll('input[data-f="name"]');
    var idx = State.roster.findIndex(function (s) { return s.no === no; });
    if (inputs[idx]) inputs[idx].focus();
  }

  function applyPaste() {
    var parsed = parsePasted($('pasteArea').value);
    if (!parsed.length) { toast('読み取れる行がありませんでした。', true); return; }

    var replace = document.querySelector('input[name="pasteMode"]:checked').value === 'replace';
    var base = replace ? [] : State.roster.slice();
    var used = usedNumbers(base);
    var moved = 0;
    parsed.forEach(function (p) {
      var no = p.no;
      if (!(no >= 1 && no <= MAX_NO) || used[no]) {
        if (p.no) moved++;
        no = nextFreeNo(used);
      }
      if (!no) return;
      used[no] = true;
      base.push(newStudent(no, p.name, p.kana, p.gender));
    });
    base.sort(function (a, b) { return a.no - b.no; });
    var over = base.length - Core.MAX_STUDENTS;
    if (over > 0) base = base.slice(0, Core.MAX_STUDENTS);

    if (replace) {
      State.separations = [];
      State.assign = {};
      State.violations = [];
      State.notices = [];
      State.undo = [];
      State.chartDirty = false;
    }
    State.roster = base;
    markDirty();
    $('pasteArea').value = '';
    $('pasteBox').open = false;
    renderRoster();
    renderCare();
    renderAll();
    var msg = State.roster.length + ' 人を登録しました。';
    if (moved) msg += '出席番号が重なっていた ' + moved + ' 人は、空いている番号にしました。';
    if (over > 0) msg += Core.MAX_STUDENTS + ' 人までのため、' + over + ' 人分は取り込みませんでした。';
    status(msg);
    toast(msg, over > 0);
  }

  /** 貼り付けた文字を読む。1 列目が数だけなら出席番号として読む。 */
  function parsePasted(text) {
    var out = [];
    String(text || '').split(/\r?\n/).forEach(function (line) {
      if (!line.trim()) return;
      var cols = (line.indexOf('\t') >= 0) ? line.split('\t')
        : (line.indexOf(',') >= 0 ? line.split(',') : [line]);
      cols = cols.map(function (c) { return String(c || '').trim(); });
      var no = 0;
      if (cols.length >= 2 && /^\d+$/.test(cols[0])) {
        no = parseInt(cols.shift(), 10);
      }
      var name = cols[0] || '';
      if (!name) return;
      var kana = cols[1] || '';
      var gender = normGender(cols[2]);
      // 2 列目が「男」「女」だけのときは性別として読む
      if (!gender && kana && normGender(kana)) { gender = normGender(kana); kana = ''; }
      out.push({ no: no, name: name, kana: kana, gender: gender });
    });
    return out;
  }

  function normGender(v) {
    var t = String(v == null ? '' : v).trim();
    if (t === '男' || t === '男子' || t === 'M' || t === 'm' || t === '1') return 'M';
    if (t === '女' || t === '女子' || t === 'F' || t === 'f' || t === '2') return 'F';
    return '';
  }

  /* ================= 配慮事項 ================= */
  function renderCare() {
    var s = State.settings;
    var tb = $('careTable').querySelector('tbody');
    var html = '';
    State.roster.forEach(function (st, i) {
      var seatBtn = st.fixedSeat
        ? '<div class="seat-pick-btn">'
          + '<button class="btn btn-sm set" type="button" data-pick="' + i + '" title="' + seatWhere(st.fixedSeat) + '">' + st.fixedSeat + '</button>'
          + '<button class="btn btn-sm" type="button" data-unpick="' + i + '" title="固定をやめる" aria-label="固定をやめる">✕</button></div>'
        : '<div class="seat-pick-btn"><button class="btn btn-sm" type="button" data-pick="' + i + '">席をえらぶ</button></div>';

      html += '<tr>'
        + '<td class="num">' + st.no + '</td>'
        + '<td>' + esc(st.name) + '</td>'
        + '<td>' + seatBtn + '</td>'
        + '<td>' + ruleCell(i, 'rowRule', ROW_RULE_OPTIONS, s.rows, st.rowRule) + '</td>'
        + '<td>' + ruleCell(i, 'colRule', COL_RULE_OPTIONS, s.cols, st.colRule) + '</td>'
        + '<td><input type="text" data-c="' + i + '" data-f="note" value="' + esc(st.note || '')
        + '" placeholder="例）黒板が見えにくい"></td>'
        + '</tr>';
    });
    tb.innerHTML = html || '<tr><td colspan="6" class="hint" style="padding:12px">名簿がまだ空です。先に「1 名簿」で登録してください。</td></tr>';

    var studentOptions = State.roster.map(function (st) {
      return '<option value="' + st.no + '">' + st.no + '　' + esc(st.name) + '</option>';
    }).join('');
    // 選んでいた 2 人は、組み合わせを足したあとも選んだままにする（続けて登録しやすいように）
    var keepA = $('sepA').value, keepB = $('sepB').value;
    $('sepA').innerHTML = studentOptions;
    $('sepB').innerHTML = studentOptions;
    if (keepA && rosterByNo()[keepA]) $('sepA').value = keepA;
    if (keepB && rosterByNo()[keepB]) $('sepB').value = keepB;
    else if (State.roster.length > 1) $('sepB').selectedIndex = 1;

    // 1人ずつの席では「同じペアにしない」は使わない（登録は残しておく）
    var single = !Core.isPairStyle(s);
    $('sepPair').disabled = single;
    $('sepPairLabel').title = single ? '席の形が「1人ずつ」のあいだは使いません' : '';
    $('sepPairLabel').style.opacity = single ? '.45' : '';
    renderSepKind();

    var byNo = rosterByNo();
    var stb = $('sepTable').querySelector('tbody');
    var shtml = '';
    State.separations.forEach(function (sp, i) {
      var a = byNo[sp.a], b = byNo[sp.b];
      shtml += '<tr>'
        + '<td>' + (a ? sp.a + '　' + esc(a.name) : '（いない児童）') + '</td>'
        + '<td>' + (b ? sp.b + '　' + esc(b.name) : '（いない児童）') + '</td>'
        + '<td>' + (SEP_LABEL[sp.level] || sp.level)
        + (single && sp.level === 'pair' ? '<br><span class="hint">（1人ずつの席では使いません）</span>' : '') + '</td>'
        + '<td><button class="btn btn-sm btn-danger" type="button" data-sepdel="' + i + '">削除</button></td>'
        + '</tr>';
    });
    stb.innerHTML = shtml || '<tr><td colspan="4" class="hint" style="padding:12px">まだありません。</td></tr>';
  }

  function renderSepKind() {
    var k = State.ui.sepKind;
    Array.prototype.forEach.call($('sepKind').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === k));
    });
    $('sepApartOpts').style.display = k === 'apart' ? '' : 'none';
    $('sepNearHint').style.display = k === 'near' ? '' : 'none';
  }

  function ruleCell(i, field, options, max, rule) {
    rule = rule || { type: 'none', value: 1 };
    var sel = '<select data-c="' + i + '" data-f="' + field + '.type">';
    options.forEach(function (o) { sel += opt(o.v, o.t, rule.type); });
    sel += '</select>';
    var valSel = '<select data-c="' + i + '" data-f="' + field + '.value"' + (rule.type === 'none' ? ' disabled' : '') + '>';
    for (var v = 1; v <= max; v++) valSel += opt(v, v + '列目', rule.value);
    valSel += '</select>';
    return '<div class="rule-cell">' + sel + valSel + '</div>';
  }

  function onCareChange(ev) {
    var el = ev.target;
    var c = el.getAttribute('data-c'), f = el.getAttribute('data-f');
    if (c === null || !f) return;
    var st = State.roster[parseInt(c, 10)];
    if (f.indexOf('.') > 0) {
      var parts = f.split('.');
      if (!st[parts[0]]) st[parts[0]] = { type: 'none', value: 1 };
      st[parts[0]][parts[1]] = parts[1] === 'value' ? parseInt(el.value, 10) : el.value;
      if (parts[1] === 'type') renderCare();
    } else {
      st[f] = el.value;
    }
    markDirty();
  }

  /** 「C2」だけでは分かりにくいので、位置を言葉でも表す */
  function seatWhere(seatId) {
    var p = Core.parseSeat(seatId);
    if (!p) return '';
    return seatId + '（前から' + p.row + '列目・左から' + p.col + '番目）';
  }

  /* ---- 座席表から固定席をえらぶ ---- */
  function openSeatPicker(idx) {
    var st = State.roster[idx];
    if (!st) return;
    State.ui.pickIndex = idx;
    $('seatPickWho').textContent = st.no + '　' + st.name + ' さんを座らせる席をクリックしてください';
    renderSeatPickGrid();
    openModal('modalSeatPick');
  }

  /**
   * 設定などで使う小さい座席表を作る。画面の座席表と同じ向きで見せる。
   * cellFn(id, isUnused) は { cls: [...], attrs: '...', label: '...', tag: '...', disabled: bool } を返す。
   */
  function buildMiniGrid(cellFn) {
    var s = State.settings;
    var flipped = !!s.flipped;
    var unused = s.unusedSeats || [];
    var rowOrder = range(1, s.rows);
    var colOrder = range(1, s.cols);
    if (flipped) { rowOrder.reverse(); colOrder.reverse(); }
    var board = '<div class="mini-board">黒 板</div>';
    var html = flipped ? '' : board;
    rowOrder.forEach(function (r) {
      html += '<div class="mini-row">';
      colOrder.forEach(function (c) {
        var id = Core.seatId(c, r);
        var isUnused = unused.indexOf(id) >= 0;
        var d = cellFn(id, isUnused);
        var cls = ['mini-cell'].concat(d.cls || []);
        if (isUnused) cls.push('off');
        html += '<button type="button" class="' + cls.join(' ') + '" ' + (d.attrs || '')
          + (d.disabled ? ' disabled' : '') + ' title="' + seatWhere(id) + '">'
          + '<span class="mc-id">' + id + '</span>'
          + '<span class="mc-tag">' + (isUnused ? '使わない' : esc(d.tag || '')) + '</span>'
          + '</button>';
      });
      html += '</div>';
    });
    return html + (flipped ? board : '');
  }

  function renderSeatPickGrid() {
    var me = State.roster[State.ui.pickIndex];
    var takenBy = {};
    State.roster.forEach(function (st, i) {
      if (st.fixedSeat && i !== State.ui.pickIndex) takenBy[st.fixedSeat] = st.name;
    });
    $('gridSeatPick').innerHTML = buildMiniGrid(function (id, isUnused) {
      var cls = ['lg'];
      if (takenBy[id]) cls.push('taken');
      if (me && me.fixedSeat === id) cls.push('mine');
      return { cls: cls, attrs: 'data-pickseat="' + id + '"', disabled: isUnused, tag: takenBy[id] ? shortName(takenBy[id]) : '' };
    });
  }

  function onSeatPickClick(ev) {
    var el = ev.target.closest('button[data-pickseat]');
    if (!el || el.disabled) return;
    var st = State.roster[State.ui.pickIndex];
    if (!st) return;
    st.fixedSeat = el.getAttribute('data-pickseat');
    markDirty();
    $('modalSeatPick').classList.remove('open');
    renderCare();
    reevaluateIfPlaced();
    renderAll();
    toast(st.name + ' さんの席を ' + seatWhere(st.fixedSeat) + ' に固定しました。');
  }

  function addSeparation() {
    var a = parseInt($('sepA').value, 10);
    var b = parseInt($('sepB').value, 10);
    if (!a || !b) { toast('児童を選んでください。', true); return; }
    if (a === b) { toast('同じ児童どうしは登録できません。', true); return; }

    function samePair(sp) { return (sp.a === a && sp.b === b) || (sp.a === b && sp.b === a); }
    var near = State.ui.sepKind === 'near';
    var levels = [];
    if (near) {
      levels.push('near');
    } else {
      if ($('sepAdjacent').checked) levels.push('adjacent');
      if ($('sepPair').checked && !$('sepPair').disabled) levels.push('pair');
      if ($('sepGroup').checked) levels.push('group');
      if (!levels.length) { toast('はなし方を 1 つ以上選んでください。', true); return; }
    }
    // 「周囲のマスに入れない」と「近くにする」は同時には守れない
    var clash = State.separations.some(function (sp) {
      return samePair(sp) && ((near && sp.level === 'adjacent') || (!near && sp.level === 'near' && levels.indexOf('adjacent') >= 0));
    });
    if (clash) {
      toast('この 2 人は、反対の「' + (near ? 'はなす' : '近くにする') + '」が登録されています。先にそちらを消してください。', true);
      return;
    }

    var added = 0;
    levels.forEach(function (lv) {
      var exists = State.separations.some(function (sp) { return sp.level === lv && samePair(sp); });
      if (!exists) { State.separations.push({ a: a, b: b, level: lv }); added++; }
    });
    if (!added) { toast('もう登録されています。'); return; }
    markDirty();
    renderCare();
    toast('足しました。');
  }

  function onSepTableClick(ev) {
    var el = ev.target.closest('button[data-sepdel]');
    if (!el) return;
    State.separations.splice(parseInt(el.getAttribute('data-sepdel'), 10), 1);
    markDirty();
    renderCare();
  }

  /* ================= 設定 ================= */
  function openSettings(tab) {
    renderSettings();
    if (tab) selectTab(tab);
    openModal('modalSettings');
  }

  function selectTab(id) {
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) {
      x.classList.toggle('active', x.getAttribute('data-tab') === id);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab-panel'), function (x) {
      x.classList.toggle('active', x.id === id);
    });
  }

  function renderSettings() {
    var s = State.settings;
    $('inputClassName').value = s.className || '';

    $('selCols').innerHTML = range(1, Core.MAX_COLS).map(function (v) { return opt(v, v + ' 席', s.cols); }).join('');
    $('selRows').innerHTML = range(1, Core.MAX_ROWS).map(function (v) { return opt(v, v + ' 席', s.rows); }).join('');

    document.querySelector('input[name="pairMode"][value="' + (s.pairsAuto === false ? 'manual' : 'auto') + '"]').checked = true;
    $('pairManualArea').style.display = (s.pairsAuto === false) ? '' : 'none';

    $('chkSeatPrev').checked = s.avoidSameSeatPrev !== false;
    $('chkSeatPrev2').checked = s.avoidSameSeatPrev2 !== false;
    $('chkPairPrev').checked = s.avoidSamePairPrev !== false;
    $('chkPairPrev2').checked = s.avoidSamePairPrev2 === true;
    $('chkBalanceYear').checked = s.balanceYear !== false;
    var yr = Solver.yearStats(State.history, s).records;
    $('yearInfo').textContent = '今年度（4 月から）の記録 ' + yr + ' 回分を数えています。'
      + '前のほう＝前から 2 列、後ろのほう＝後ろから 2 列です（縦が 4 席以上のとき）。'
      + '3 回目になるときは、確認事項の「できれば避けたいこと」に出ます。';

    // 1人ずつの席ではペアを使わないので、ペアのタブと、ペアについての回避を止めておく
    var single = !Core.isPairStyle(s);
    $('pairSingleNote').style.display = single ? '' : 'none';
    $('pairStyleArea').style.display = single ? 'none' : '';
    $('chkPairPrev').disabled = single;
    $('chkPairPrev2').disabled = single;
    $('avoidPairNote').style.display = single ? '' : 'none';

    $('selPrintName').value = s.printNameStyle || 'kanji';
    $('chkPrintNumber').checked = s.printShowNumber !== false;

    renderMiniGrid('gridUnused', 'unused');
    renderMiniGrid('gridPairs', 'pairs');
    renderMiniGrid('gridGroups', 'groups');
    renderSetChips();
    renderGroupInfo();
  }

  /** mode: unused（使わない席の切り替え）／pairs・groups（複数選択） */
  function renderMiniGrid(containerId, mode) {
    var s = State.settings;
    var sel = mode === 'pairs' ? State.ui.pairSel : (mode === 'groups' ? State.ui.groupSel : {});
    var tagBy = {};
    if (mode === 'pairs') {
      Core.effectivePairs(s).forEach(function (p, i) { p.seats.forEach(function (id) { tagBy[id] = 'ペア' + (i + 1); }); });
    } else if (mode === 'groups') {
      Core.effectiveGroups(s).forEach(function (g, i) { g.seats.forEach(function (id) { tagBy[id] = (i + 1) + '班'; }); });
    }
    $(containerId).innerHTML = buildMiniGrid(function (id, isUnused) {
      return {
        cls: sel[id] ? ['sel'] : [],
        attrs: 'data-mini="' + mode + '" data-seat="' + id + '"',
        disabled: isUnused && mode !== 'unused',
        tag: tagBy[id] || ''
      };
    });
  }

  function onMiniClick(ev) {
    var el = ev.target.closest('button[data-mini]');
    if (!el || el.disabled) return;
    var mode = el.getAttribute('data-mini');
    var id = el.getAttribute('data-seat');

    if (mode === 'unused') {
      var list = State.settings.unusedSeats || [];
      var at = list.indexOf(id);
      if (at >= 0) list.splice(at, 1);
      else {
        list.push(id);
        // 使わない席になったら、ペア・班からも外す
        State.settings.pairs = dropSeatFromSets(State.settings.pairs, id);
        State.settings.groups = dropSeatFromSets(State.settings.groups, id);
        delete State.assign[id];
      }
      State.settings.unusedSeats = list;
      markDirty();
      renderSettings();
      renderAll();
      return;
    }

    var sel = mode === 'pairs' ? State.ui.pairSel : State.ui.groupSel;
    if (sel[id]) delete sel[id]; else sel[id] = true;
    renderMiniGrid(mode === 'pairs' ? 'gridPairs' : 'gridGroups', mode);
  }

  function dropSeatFromSets(sets, seatId) {
    return (sets || []).map(function (set) {
      return { no: set.no, seats: (set.seats || []).filter(function (x) { return x !== seatId; }) };
    }).filter(function (set) { return set.seats.length > 0; });
  }

  function makeSet(kind) {
    var sel = kind === 'pairs' ? State.ui.pairSel : State.ui.groupSel;
    var seats = Object.keys(sel);
    if (seats.length < 2) { toast('席を 2 つ以上選んでください。', true); return; }

    var key = kind === 'pairs' ? 'pairs' : 'groups';
    var current = (kind === 'pairs' && State.settings.pairsAuto !== false)
      ? Core.autoPairs(State.settings)          // 自動から手動に切り替えるときは今の形を引き継ぐ
      : (State.settings[key] || []);

    // 選んだ席を、いまの組から取り除いてから新しい組を作る
    var next = current.map(function (set) {
      return { no: set.no, seats: set.seats.filter(function (id) { return seats.indexOf(id) < 0; }) };
    }).filter(function (set) { return set.seats.length > 0; });

    next.push({ no: next.length + 1, seats: seats.sort() });
    next.forEach(function (set, i) { set.no = i + 1; });
    State.settings[key] = next;
    if (kind === 'pairs') State.settings.pairsAuto = false;

    if (kind === 'pairs') State.ui.pairSel = {}; else State.ui.groupSel = {};
    markDirty();
    renderSettings();
    renderAll();
    toast((kind === 'pairs' ? 'ペア' : '班') + 'を作りました（' + seats.join('・') + '）。');
  }

  /** size … 3・4（席の並びから 3〜4 人ずつ）または 6（横 2 × 縦 3） */
  function autoGroups(size) {
    if ((State.settings.groups || []).length
      && !window.confirm('いまの班を消して、作り直します。よろしいですか？')) return;
    State.settings.groups = size === 6
      ? Core.blockGroups(State.settings, 2, 3)
      : Core.partitionGroups(State.settings, size);
    State.ui.groupSel = {};
    markDirty();
    renderSettings();
    renderAll();
    toast(State.settings.groups.length + ' の班を作りました（' + groupSizeText(State.settings.groups) + '）。');
  }

  /** 例）「4 人班 × 6・3 人班 × 2」 */
  function groupSizeText(groups) {
    var count = {};
    groups.forEach(function (g) { count[g.seats.length] = (count[g.seats.length] || 0) + 1; });
    return Object.keys(count).sort(function (a, b) { return b - a; })
      .map(function (n) { return n + ' 人班 × ' + count[n]; }).join('・');
  }

  /** 班のタブの説明：いまの班の人数と、空く席があるときの案内 */
  function renderGroupInfo() {
    var groups = Core.effectiveGroups(State.settings);
    var used = Core.usableSeats(State.settings).length;
    var n = State.roster.length;
    var msg = '使える席 ' + used + ' 席／児童 ' + n + ' 人。';
    msg += groups.length ? 'いまの班：' + groupSizeText(groups) + '。' : 'まだ班はありません。';
    if (used > n && n > 0) {
      msg += '空く席が ' + (used - n) + ' 席あります。空く席を「使わない席」にしてから班を作ると、班の人数がそろいます。';
    }
    $('groupInfo').textContent = msg;
  }

  function renderSetChips() {
    var s = State.settings;
    $('pairList').innerHTML = Core.effectivePairs(s).map(function (p, i) {
      var del = (s.pairsAuto === false)
        ? '<button type="button" data-delset="pairs" data-i="' + i + '" title="消す" aria-label="消す">✕</button>' : '';
      return '<span class="chip">ペア' + (i + 1) + '：' + p.seats.join('・') + del + '</span>';
    }).join('');

    $('groupList').innerHTML = Core.effectiveGroups(s).map(function (g, i) {
      return '<span class="chip">' + (i + 1) + '班：' + g.seats.join('・')
        + '<button type="button" data-delset="groups" data-i="' + i + '" title="消す" aria-label="消す">✕</button></span>';
    }).join('') || '<span class="hint">班はまだありません。</span>';
  }

  function onChipClick(ev) {
    var el = ev.target.closest('button[data-delset]');
    if (!el) return;
    var key = el.getAttribute('data-delset');
    var i = parseInt(el.getAttribute('data-i'), 10);
    var list = (key === 'pairs' ? Core.effectivePairs(State.settings) : Core.effectiveGroups(State.settings)).slice();
    list.splice(i, 1);
    list.forEach(function (set, k) { set.no = k + 1; });
    State.settings[key] = list;
    markDirty();
    renderSettings();
    renderAll();
  }

  /** 行数・列数を変えると、範囲外になった席の設定を片づける */
  function changeLayout(key, value) {
    State.settings[key] = value;
    var valid = {};
    Core.allSeats(State.settings).forEach(function (s) { valid[s.id] = true; });

    State.settings.unusedSeats = (State.settings.unusedSeats || []).filter(function (id) { return valid[id]; });
    State.settings.pairs = Core.normalizeSets(State.settings.pairs || [], State.settings);
    State.settings.groups = Core.normalizeSets(State.settings.groups || [], State.settings);
    Object.keys(State.assign).forEach(function (id) {
      if (!valid[id] || (State.settings.unusedSeats || []).indexOf(id) >= 0) delete State.assign[id];
    });
    State.roster.forEach(function (st) {
      if (st.fixedSeat && !valid[st.fixedSeat]) st.fixedSeat = '';
      if (st.rowRule && st.rowRule.value > State.settings.rows) st.rowRule.value = State.settings.rows;
      if (st.colRule && st.colRule.value > State.settings.cols) st.colRule.value = State.settings.cols;
    });

    markDirty();
    reevaluateIfPlaced();
    renderSettings();
    renderCare();
    renderAll();
  }

  /* ================= イベント登録 ================= */
  function on(id, type, fn) { $(id).addEventListener(type, fn); }

  function bindEvents() {
    document.addEventListener('click', onSegClick);
    on('seatChart', 'click', onSeatClick);
    on('warnList', 'click', onWarnClick);
    on('historyList', 'click', onHistoryAction);
    on('historyTable', 'click', onHistoryAction);
    on('btnHistoryAll', 'click', function () { renderHistoryTable(); openModal('modalHistory'); });

    on('btnShuffle', 'click', doShuffle);
    on('btnUndo', 'click', doUndo);
    on('btnExport', 'click', openExport);
    on('btnExportRun', 'click', runExport);
    on('btnPrint', 'click', doPrint);
    on('btnShow', 'click', openShow);
    on('btnShowClose', 'click', closeShow);
    on('chkShowKana', 'change', renderShow);
    on('chkShowGroupColor', 'change', renderShow);
    on('chkShowGroupList', 'change', renderShow);

    on('btnHelp', 'click', function () { openModal('modalHelp'); });
    on('btnRoster', 'click', openRoster);
    on('btnCare', 'click', function () { renderCare(); openModal('modalCare'); });
    on('btnSettings', 'click', function () { openSettings(); });
    on('classNameBtn', 'click', function () { openSettings('tabLayout'); $('inputClassName').focus(); });
    on('saveState', 'click', function () { if (State.mastersDirty) saveMasters(); });

    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-close]');
      if (el) closeModal(el.getAttribute('data-close'));
    });
    // 背景クリックで閉じる
    Array.prototype.forEach.call(document.querySelectorAll('.modal'), function (m) {
      m.addEventListener('click', function (ev) { if (ev.target === m) closeModal(m.id); });
    });

    // キーボード：Esc でとじる、Ctrl＋Z で元に戻す
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        if ($('showView').classList.contains('open')) { closeShow(); return; }
        var m = topModal();
        if (m) { closeModal(m.id); return; }
        if (State.selectedSeat) { State.selectedSeat = null; renderChart(); }
        return;
      }
      if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && (ev.key === 'z' || ev.key === 'Z')) {
        var tag = (ev.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select' || topModal()) return;
        ev.preventDefault();
        doUndo();
      }
    });

    // 名簿
    on('rosterTable', 'input', onRosterInput);
    on('rosterTable', 'change', onRosterChange);
    on('rosterTable', 'click', onRosterClick);
    on('btnPasteApply', 'click', applyPaste);
    on('btnAddStudent', 'click', addStudent);
    on('btnRenumber', 'click', renumberAll);

    // 配慮事項（メモは打つそばから、前後・左右の指定は選んだときに反映。どちらも input で拾える）
    on('careTable', 'input', onCareChange);
    on('careTable', 'click', function (ev) {
      var pick = ev.target.closest('button[data-pick]');
      if (pick) { openSeatPicker(parseInt(pick.getAttribute('data-pick'), 10)); return; }
      var un = ev.target.closest('button[data-unpick]');
      if (un) {
        var st = State.roster[parseInt(un.getAttribute('data-unpick'), 10)];
        if (!st) return;
        st.fixedSeat = '';
        markDirty();
        renderCare();
      }
    });
    on('sepKind', 'click', function (ev) {
      var b = ev.target.closest('button[data-v]');
      if (!b) return;
      State.ui.sepKind = b.getAttribute('data-v');
      renderSepKind();
    });
    on('btnAddSep', 'click', addSeparation);
    on('sepTable', 'click', onSepTableClick);

    // 席をえらぶ
    on('gridSeatPick', 'click', onSeatPickClick);
    on('btnSeatPickClear', 'click', function () {
      var st = State.roster[State.ui.pickIndex];
      if (st) { st.fixedSeat = ''; markDirty(); }
      $('modalSeatPick').classList.remove('open');
      renderCare();
    });

    // 設定
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.addEventListener('click', function () { selectTab(t.getAttribute('data-tab')); });
    });
    on('inputClassName', 'input', function () {
      State.settings.className = this.value;
      markDirty();
      renderAll();
    });
    on('selCols', 'change', function () { changeLayout('cols', parseInt(this.value, 10)); });
    on('selRows', 'change', function () { changeLayout('rows', parseInt(this.value, 10)); });

    Array.prototype.forEach.call(document.querySelectorAll('input[name="pairMode"]'), function (r) {
      r.addEventListener('change', function () {
        var manual = this.value === 'manual';
        State.settings.pairsAuto = !manual;
        if (manual && (!State.settings.pairs || !State.settings.pairs.length)) {
          State.settings.pairs = Core.autoPairs(State.settings);  // 自動の形から始める
        }
        markDirty();
        renderSettings();
        renderAll();
      });
    });
    on('gridUnused', 'click', onMiniClick);
    on('gridPairs', 'click', onMiniClick);
    on('gridGroups', 'click', onMiniClick);
    on('btnMakePair', 'click', function () { makeSet('pairs'); });
    on('btnMakeGroup', 'click', function () { makeSet('groups'); });
    on('btnAutoGroup3', 'click', function () { autoGroups(3); });
    on('btnAutoGroup4', 'click', function () { autoGroups(4); });
    on('btnAutoGroup6', 'click', function () { autoGroups(6); });
    on('btnClearPairSel', 'click', function () { State.ui.pairSel = {}; renderMiniGrid('gridPairs', 'pairs'); });
    on('btnClearGroupSel', 'click', function () { State.ui.groupSel = {}; renderMiniGrid('gridGroups', 'groups'); });
    on('btnResetPairs', 'click', function () {
      State.settings.pairs = [];
      State.settings.pairsAuto = true;
      State.ui.pairSel = {};
      markDirty();
      renderSettings();
      renderAll();
    });
    on('btnResetGroups', 'click', function () {
      State.settings.groups = [];
      State.ui.groupSel = {};
      markDirty();
      renderSettings();
      renderAll();
    });
    on('pairList', 'click', onChipClick);
    on('groupList', 'click', onChipClick);

    [['chkSeatPrev', 'avoidSameSeatPrev'], ['chkSeatPrev2', 'avoidSameSeatPrev2'],
     ['chkPairPrev', 'avoidSamePairPrev'], ['chkPairPrev2', 'avoidSamePairPrev2'],
     ['chkBalanceYear', 'balanceYear']].forEach(function (p) {
      on(p[0], 'change', function () {
        State.settings[p[1]] = this.checked;
        markDirty();
        reevaluateIfPlaced();
        renderAll();
      });
    });
    on('selPrintName', 'change', function () { State.settings.printNameStyle = this.value; markDirty(); });
    on('chkPrintNumber', 'change', function () { State.settings.printShowNumber = this.checked; markDirty(); });

    // 保存していないものがあるまま閉じようとしたときの警告
    window.addEventListener('beforeunload', function (ev) {
      var chart = State.chartDirty && hasAssign();
      if (chart || State.mastersDirty || saving) {
        if (State.mastersDirty) saveMasters();
        ev.preventDefault();
        ev.returnValue = chart ? 'まだ記録していない座席表があります。' : '保存が終わっていません。';
        return ev.returnValue;
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
