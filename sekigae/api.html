<script>
/**
 * 席替えアプリ — サーバー（GAS）との受け渡し
 *
 * google.script.run はコールバック方式なので Promise に包み直す。
 */
var Api = (function () {
  'use strict';

  function call(name, arg) {
    return new Promise(function (resolve, reject) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(new Error('サーバーに接続できません。スプレッドシートから開き直してください。'));
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) resolve(res.data);
          else reject(new Error((res && res.error) ? res.error : 'サーバーで問題が起きました。'));
        })
        .withFailureHandler(function (err) {
          reject(new Error((err && err.message) ? err.message : String(err)));
        });
      if (arg === undefined) runner[name]();
      else runner[name](arg);
    });
  }

  return {
    loadAll: function () { return call('apiLoadAll'); },
    saveMasters: function (payload) { return call('apiSaveMasters', payload); },
    commit: function (payload) { return call('apiCommitSeating', payload); },
    deleteHistory: function (id) { return call('apiDeleteHistory', id); }
  };
})();
</script>
